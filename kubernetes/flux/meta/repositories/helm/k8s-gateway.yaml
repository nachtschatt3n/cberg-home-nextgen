---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrepository-source-v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: k8s-gateway
  namespace: flux-system
spec:
  interval: 1h
  # Upstream has relocated TWICE:
  #   1. ori-edge (frozen at chart 2.4.0 / app 0.4.0, March 2024)
  #      -> k8s-gateway org, which ships releases built against current Gateway API.
  #   2. 2026-09: the k8s-gateway GitHub org is now a READ-ONLY MIRROR and its
  #      GitHub Pages chart repo was deleted (404 on /index.yaml and on the root).
  #      Canonical development moved to codeberg.org/k8s-gateway/k8s_gateway and
  #      the chart index is now published at the URL below. Only /index.yaml and
  #      the .tgz files are served; the repo root 404s, which is normal for a
  #      bare chart repo and is NOT a fault.
  # The 3.7.2 tarball here is a REPACKAGE, not a rebuild: every template,
  # values.yaml and appVersion (1.8.0) is byte-identical to the tarball we had
  # cached; only Chart.yaml's maintainer field changed (plus a stray .mise.tools
  # dev file the .helmignore misses). `helm template` of both, with the live
  # release values, is byte-identical -- so the source move is a workload no-op.
  # Chart stays pinned at 3.7.2 here; 3.7.3 is a separate decision.
  url: https://k8s-gateway.kryptonian.kapsi.fi/
