---
apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: kibana
  namespace: monitoring
spec:
  version: 8.19.20
  count: 1
  elasticsearchRef:
    name: elasticsearch
  http:
    service:
      spec:
        type: ClusterIP
    tls:
      selfSignedCertificate:
        disabled: false
  podTemplate:
    spec:
      containers:
        - name: kibana
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
  config:
    server.publicBaseUrl: https://kibana.${SECRET_DOMAIN}
---
# The kibana Ingress was REMOVED 2026-09-07 (Envoy migration). It is now
# httproute.yaml, with a BackendTLSPolicy carrying the ECK CA — the Ingress
# set backend-protocol: HTTPS but nginx defaults proxy_ssl_verify off, so the
# new path actually VALIDATES the backend cert where the old one did not.
