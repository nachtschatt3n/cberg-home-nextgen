---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: unifi-alerts
  namespace: monitoring
  labels:
    app.kubernetes.io/name: kube-prometheus-stack
    app.kubernetes.io/part-of: kube-prometheus-stack
    release: kube-prometheus-stack
spec:
  groups:
    - name: unifi.devices
      interval: 30s
      rules:
        # GUARD — keep this FIRST and keep it working.
        #
        # Every rule below was inert from creation until 2026-09-04: they all
        # queried `unifipoller_*`, a prefix that has NEVER existed in this
        # cluster (the exporter emits `unpoller_*`). An alert whose selector
        # matches nothing sits at state=inactive, which is exactly what a
        # healthy non-firing alert looks like — so UniFi alerting was dead for
        # months and every dashboard read green. The finding tracking it
        # (F-f59ad7e5) was falsely auto-closed and re-emitted twice.
        #
        # This rule makes that failure mode LOUD: if the series backing these
        # alerts disappears (exporter down, prefix renamed again by the pending
        # unpoller v5 major), it pages instead of going quiet.
        - alert: UnifiMetricsAbsent
          expr: absent(unpoller_device_uptime_seconds)
          for: 15m
          labels:
            severity: critical
            category: network
            component: unifi
          annotations:
            summary: "UniFi device metrics are absent — UniFi alerting is blind"
            description: >-
              `unpoller_device_uptime_seconds` has no series for 15m. Every other
              rule in this group depends on the `unpoller_*` metric family, so
              they are all silently inert right now. Either unpoller is down or
              the metric names changed upstream (unpoller v5 renames metrics).
              Do NOT treat the other UniFi alerts as meaningful until this clears.

        # GUARD for the CLIENT metric family. UnifiMetricsAbsent above only watches
        # unpoller_device_uptime_seconds, so if the pending unpoller v5 major renames or
        # drops unpoller_client_satisfaction_ratio — exactly the class of change that left
        # every UniFi alert inert for months when unifipoller_* became unpoller_* — then
        # UnifiClientsDegradedOnAP would sit at health=ok / state=inactive forever,
        # indistinguishable from correct quiet operation.
        - alert: UnifiClientMetricsAbsent
          expr: absent(unpoller_client_satisfaction_ratio)
          for: 15m
          labels:
            severity: critical
            category: network
            component: unifi
          annotations:
            summary: "UniFi client metrics are absent — client-impact alerting is blind"
            description: >-
              `unpoller_client_satisfaction_ratio` has no series for 15m.
              UnifiClientsDegradedOnAP depends on it exclusively and is silently inert while
              this is true. Either unpoller is down, no client is associated, or the metric
              was renamed upstream.

        # All 10 devices report a real uptime; `== 0` occurred in 0 of the 7d
        # 5m buckets, so this is a clean signal rather than a noisy one.
        - alert: UnifiDeviceOffline
          expr: unpoller_device_uptime_seconds == 0
          for: 5m
          labels:
            severity: critical
            category: network
            component: unifi
          annotations:
            summary: "UniFi device {{ $labels.name }} is offline"
            description: "UniFi device {{ $labels.name }} ({{ $labels.type }}) has been offline for 5 minutes. This may indicate a network or power failure."

        # Was `unifipoller_device_user_num_sta`, which has no `unpoller_*`
        # equivalent — client count is now per-radio, so sum it per device.
        #
        # Threshold raised 50 -> 75. The inherited 50 was never exercised (the
        # rule was inert), and it does not fit this household: Hallway-AP-U6 Pro
        # runs a 7d average of 48.5 clients and sits at 52 right now, so a 50
        # threshold would flap across the boundary permanently. ~74 of the
        # clients here are IoT devices concentrated on 2.4GHz, which is normal
        # for this deployment and well within a U6 Pro's capacity. 75 is clear
        # of steady state while still catching a genuine pile-up.
        - alert: UnifiAccessPointHighClientCount
          expr: sum by (name, site_name) (unpoller_device_radio_stations) > 75
          for: 10m
          labels:
            severity: warning
            category: network
            component: unifi
          annotations:
            summary: "High client count on {{ $labels.name }}"
            description: "Access point {{ $labels.name }} has {{ $value }} connected clients (summed across radios), exceeding the threshold of 75."

        # Was `(unifipoller_device_sys_mem / 1024 / 1024) > 80` — that compared
        # MEBIBYTES against 80, so it was semantically wrong as well as inert.
        # The replacement is a 0-1 ratio.
        #
        # THRESHOLD IS TYPE-AWARE, and the split is measured, not guessed.
        # RETUNED 2026-09-05 after the first version fired on DMP-CBERG within
        # hours. The original single 0.90 was set from the 7d MAX (0.975), which
        # looked like plenty of headroom. The distribution says otherwise:
        #   gateway (udm): 6h avg 0.889, 24h 0.76-0.93, and 5.7% of 7d ALREADY
        #                  above 0.90 — roughly 9.6 hours of alerting per week
        #                  for a device sitting at its normal baseline. 0.0% of
        #                  7d above 0.95.
        #   everything else: 7d max 0.975 on ONE AP (Hallway-U6 Pro), every
        #                  other device <= 0.743. 0.90 is well clear of normal.
        # Checking the max but not the distribution is what produced a false
        # positive on the first night. The lesson is in the numbers above.
        #
        # The UDM runs the UniFi Network JVM with a pinned heap, so a high
        # steady state is expected there and is NOT a fault. What IS a fault is
        # memory PINNED near the ceiling — the Full-GC death spiral this cluster
        # has hit before, where the JVM thrashes without ever OOMing (so it
        # never restarts itself) and the control plane starts flapping. 0.95
        # sustained for 30m never occurred in the last 7 days, so if it fires it
        # means something. Recovery for that is `systemctl restart unifi.service`
        # on the UDM.
        - alert: UnifiDeviceHighMemory
          expr: unpoller_device_memory_utilization_ratio{type!="udm"} > 0.90
          for: 10m
          labels:
            severity: warning
            category: network
            component: unifi
          annotations:
            summary: "High memory usage on {{ $labels.name }}"
            description: "Device {{ $labels.name }} memory utilization is {{ $value | humanizePercentage }}, exceeding the 90% threshold for non-gateway devices."

        - alert: UnifiGatewayMemoryPinned
          expr: unpoller_device_memory_utilization_ratio{type="udm"} > 0.95
          for: 30m
          labels:
            severity: warning
            category: network
            component: unifi
          annotations:
            summary: "UniFi gateway {{ $labels.name }} memory pinned near ceiling"
            description: >-
              {{ $labels.name }} memory utilization has been above 95% for 30m
              ({{ $value | humanizePercentage }}). Its normal baseline is ~89%, and
              0.95 was not reached at all in the preceding 7 days. This is the
              shape of the UniFi Network-app Full-GC death spiral: the JVM thrashes
              without OOMing, so it never restarts itself, and the control plane
              begins to flap. Check `unifictl local health get`; recovery is
              `systemctl restart unifi.service` on the UDM.

        # Was `unifipoller_device_system_stats_cpu > 90`. The replacement is a
        # 0-1 ratio, so the threshold is 0.90 and not 90 — a straight prefix
        # rename here would have produced a rule that can never fire.
        - alert: UnifiDeviceHighCPU
          expr: unpoller_device_cpu_utilization_ratio > 0.90
          for: 10m
          labels:
            severity: warning
            category: network
            component: unifi
          annotations:
            summary: "High CPU usage on {{ $labels.name }}"
            description: "Device {{ $labels.name }} CPU utilization is {{ $value | humanizePercentage }}, exceeding the 90% threshold."

        # Was `unifipoller_device_port_up == 0 and unifipoller_device_port_poe_enable == 1`.
        # Neither metric exists in the unpoller schema — there is no port link-state
        # and no poe_enable gauge. Closest faithful equivalent: the port is
        # energised over PoE but negotiated no link speed. Currently matches 0
        # series, so this ships without firing.
        - alert: UnifiSwitchPortDown
          expr: unpoller_device_port_port_speed_bps == 0 and on(name, port_num) unpoller_device_port_poe_volts > 0
          for: 5m
          labels:
            severity: warning
            category: network
            component: unifi
          annotations:
            summary: "PoE port down on {{ $labels.name }}"
            description: "Port {{ $labels.port_name }} (num {{ $labels.port_num }}) on {{ $labels.name }} is energised over PoE but has negotiated no link speed."

    - name: unifi.network
      interval: 30s
      rules:
        # This one was always correct — `up{job="unpoller"}` is a scrape metric,
        # not an unpoller_* series, so it was never affected by the prefix bug.
        - alert: UnifiControllerUnreachable
          expr: up{job="unpoller"} == 0
          for: 15m
          labels:
            severity: critical
            category: network
            component: unifi
          annotations:
            summary: "UnPoller cannot reach UniFi controller"
            description: "UnPoller has failed to scrape metrics from the UniFi controller for 15 minutes. Check controller availability and credentials. Note: UnPoller polls the controller inline per scrape, so transient UDM-Pro latency spikes can briefly mark the target down without the controller being truly unreachable."

        # RETUNED 2026-09-19 (operator request) — REPLACES UnifiHighChannelUtilization,
        # which paged 21 times in 7 days (18 on Hallway-AP-U6 Pro 2.4GHz, 3 on
        # Upstairs-AP-UAP AC LR) with ZERO client impact. Renamed because it no longer
        # measures a radio at all.
        #
        # The old block justified itself with "Current max is 0.53, so 0.70 ships
        # without firing." That was stale: the measured 7d distribution on Hallway
        # 2.4GHz is p50 0.62 / p90 0.81 / max 0.97, so 0.70 sat between that radio's
        # MEDIAN and its p90. Sizing a threshold off a point-in-time max is what
        # shipped a rule that pages for a perfectly healthy radio.
        #
        # WHY UTILIZATION IS GONE FROM THE EXPRESSION ENTIRELY. A composite
        # (util > 0.90 AND client harm) was built and REJECTED on measurement: replayed
        # over the full 7d retention it would have stayed SILENT through the one genuine
        # harm episode in the window (2026-09-16 14:55-15:41Z, up to 15 clients below
        # 0.70 satisfaction on Hallway) because utilization repeatedly dipped a hundredth
        # below the gate while eleven clients were still degraded, resetting the `for:`
        # clock. Requiring 15 consecutive minutes of BOTH conditions was unreachable —
        # 0 episodes in 7 days. Client harm is the thing worth waking someone for;
        # utilization is context and now lives only in the annotation.
        #
        # THRESHOLDS ARE MEASURED, replayed at 60s resolution over 7d retention:
        #   K>=3 degraded clients, for:10m -> 1 page (the real 2026-09-16 episode)
        #   K>=3, for:15m -> 1 page, but the qualifying run is EXACTLY 15.0m, i.e. ZERO
        #                    margin; a one-minute-shorter real event is missed. Rejected.
        #   K>=3, for:5m  -> 6 pages (too chatty)
        #   K>=2, for:5m  -> 14 pages
        #   K>=4          -> 0 pages (inert)
        # for:10m keeps 5 minutes of margin on the real episode, while the next-longest
        # run in the week is 9m — a clear minute below the clock.
        #
        # `max by (ap_name, mac)` dedups clients across unpoller pods: during a two-pod
        # rollout a bare count double-counts and halves the effective K>=3 gate. Verified
        # identical to the undeduped form today (338 samples / 136 runs).
        # `ap_name!=""` drops the 1-2 UNASSOCIATED clients that report a permanent 0 with
        # the ap_name label absent.
        #
        # NOT COVERED — do not read this alert as "a device cannot connect". No metric in
        # this stack reports a failed association or auth: unpoller only lists clients
        # that DID connect, and mac_filter_rejects is flat 0 across all series. That gap
        # needs controller/syslog association events and is tracked on F-3f7e921e.
        - alert: UnifiClientsDegradedOnAP
          expr: >-
            count by (ap_name) (
              max by (ap_name, mac) (unpoller_client_satisfaction_ratio{ap_name!=""}) < 0.70
            ) >= 3
          for: 10m
          labels:
            severity: warning
            category: network
            component: unifi
          annotations:
            summary: "Multiple clients degraded on {{ $labels.ap_name }}"
            description: >-
              {{ $value }} clients associated to {{ $labels.ap_name }} have been below 0.70
              satisfaction for 10m. This fires on measured client experience, not on channel
              utilization — a busy radio with healthy clients is normal here and no longer
              alerts. Check per-band client distribution with `unifictl local device list`,
              move 5GHz-capable clients off 2.4GHz, or narrow the 2.4GHz channel width.
