---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unpoller
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: unpoller
      version: 2.4.0
      sourceRef:
        kind: HelmRepository
        name: unpoller
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  valuesFrom:
    - kind: Secret
      name: unpoller-credentials
      valuesKey: upConfig
      targetPath: upConfig
  values:
    image:
      repository: ghcr.io/unpoller/unpoller
      pullPolicy: IfNotPresent
      tag: v3.5.0

    replicaCount: 1

    # Service configuration
    # MUST stay false: chart 2.4.0 added a Service template (2.1.0 had none,
    # which is why this value was inert and service.yaml is hand-written).
    # The chart's Service is named `unpoller` in `monitoring` — the same object
    # our Kustomization owns — and names its port `tcp`, while
    # servicemonitor.yaml scrapes `port: http`. If the chart's Service won,
    # the ServiceMonitor would select a Service with no `http` port and every
    # unpoller_* series would stop with a green HelmRelease.
    service:
      enabled: false
      type: ClusterIP
      port: 9130
      annotations: {}

    # Prometheus integration.
    # Chart 2.4.0 wraps templates/pod-monitor.yaml in `if .Values.podMonitor.enabled`,
    # so this false is finally honoured and the postRenderer that used to delete
    # PodMonitor/unifi-poller has been removed. Keep it false: only the hand-tuned
    # ServiceMonitor (servicemonitor.yaml, 60s) may scrape unpoller — a second
    # 30s scrape doubles UniFi controller API load (429s) and duplicates every series.
    podMonitor:
      enabled: false
      interval: 30s
      labels:
        release: kube-prometheus-stack

    # Grafana dashboards
    dashboards:
      create: false
      grafana:
        create: false

    # Resources
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

    # Health checks
    livenessProbe:
      httpGet:
        path: /
        port: 9130
      initialDelaySeconds: 30
      periodSeconds: 10
      failureThreshold: 12
    readinessProbe:
      httpGet:
        path: /
        port: 9130
      initialDelaySeconds: 10
      periodSeconds: 5
      failureThreshold: 12
