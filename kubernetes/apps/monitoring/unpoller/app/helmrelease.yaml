---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unpoller
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: unpoller
      version: 2.4.0
      sourceRef:
        kind: HelmRepository
        name: unpoller
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  valuesFrom:
    - kind: Secret
      name: unpoller-credentials
      valuesKey: upConfig
      targetPath: upConfig
  values:
    image:
      repository: ghcr.io/unpoller/unpoller
      pullPolicy: IfNotPresent
      # 2026-09-06: image-only major v3.5.0 -> v5.2.4 (plan unpoller-v5.1.0,
      # finding F-a5ceabc1). The chart stays 2.4.0 because NO v5-aware chart
      # exists — the newest published is still 2.4.0/appVersion v3.5.0. That is
      # safe here only because chart 2.4.0 is a version-agnostic wrapper: it
      # renders our `upConfig` verbatim and we disable its Service, PodMonitor
      # and dashboards below, so the sole chart-to-image coupling is this tag.
      # This pin now permanently outranks appVersion (the coredns shape), which
      # is why the *unpoller* deny rule in runbooks/auto-update-policy.yaml
      # STAYS and was retargeted in the same commit rather than removed.
      # v5.1.0 renamed InfluxDB tags/fields (clients.channel -> channel_name,
      # uap_radios.channel -> channel_num, duplicate wan_ip/source/version
      # fields dropped); in-repo dashboards are all Prometheus-datasource, so
      # only operator-built InfluxDB panels could need repointing.
      tag: v5.2.4

    replicaCount: 1

    # HARDENING 2026-09-06 (F-d5e5f1b0). Both pod and container securityContext
    # were literally {} on a workload that mounts a config holding BOTH the
    # UniFi controller user/password AND the InfluxDB auth_token. The image is
    # distroless (no shell), so the runtime uid was unenforced rather than
    # merely unverified.
    #
    # runAsNonRoot / runAsUser are deliberately NOT set here. The image's
    # declared USER could not be read from the registry, and guessing it risks
    # CreateContainerConfigError or a container that cannot read its own
    # config — which would silently stop every unifi_* series. Pin the uid only
    # after reading it off the image, not before.
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]

    # Service configuration
    # MUST stay false: chart 2.4.0 added a Service template (2.1.0 had none,
    # which is why this value was inert and service.yaml is hand-written).
    # The chart's Service is named `unpoller` in `monitoring` — the same object
    # our Kustomization owns — and names its port `tcp`, while
    # servicemonitor.yaml scrapes `port: http`. If the chart's Service won,
    # the ServiceMonitor would select a Service with no `http` port and every
    # unpoller_* series would stop with a green HelmRelease.
    service:
      enabled: false
      type: ClusterIP
      port: 9130
      annotations: {}

    # Prometheus integration.
    # Chart 2.4.0 wraps templates/pod-monitor.yaml in `if .Values.podMonitor.enabled`,
    # so this false is finally honoured and the postRenderer that used to delete
    # PodMonitor/unifi-poller has been removed. Keep it false: only the hand-tuned
    # ServiceMonitor (servicemonitor.yaml, 60s) may scrape unpoller — a second
    # 30s scrape doubles UniFi controller API load (429s) and duplicates every series.
    podMonitor:
      enabled: false
      interval: 30s
      labels:
        release: kube-prometheus-stack

    # Grafana dashboards
    dashboards:
      create: false
      grafana:
        create: false

    # Resources
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

    # Health checks
    livenessProbe:
      httpGet:
        path: /
        port: 9130
      initialDelaySeconds: 30
      periodSeconds: 10
      failureThreshold: 12
    readinessProbe:
      httpGet:
        path: /
        port: 9130
      initialDelaySeconds: 10
      periodSeconds: 5
      failureThreshold: 12
