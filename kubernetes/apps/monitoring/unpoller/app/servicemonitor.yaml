---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: unpoller
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: unpoller
  endpoints:
    - port: http
      path: /metrics
      interval: 60s
      scrapeTimeout: 30s
      # F-26b89cde (measured 2026-09-19, re-measured 2026-09-22). Every
      # unpoller_* series carries the scrape TARGET's identity -- `instance`
      # (pod IP:port) and `pod` -- so a pod reschedule gives every device,
      # radio, client and site a SECOND series that differs only in those two
      # labels, and the old one lingers as a stale twin for the retention
      # window. Measured: all 288 unpoller_* families, none exempt (25,381
      # series over 7d against 7,495 live; the radio family 18 over 7d vs 9
      # live); exactly two target-label tuples over 7d, differing ONLY in
      # instance/pod (container, endpoint, job, namespace, service identical).
      # Cost, recorded in runbooks/maintenance/plans/unpoller-v5.2.7.md: any
      # multi-day query spans a reschedule and mixes a live exporter with a
      # dead one, and count() gates read ~2x for 5 min after every roll.
      #
      # Fix at the identity: pin `instance` to the Service name and drop `pod`
      # from unpoller_* samples, so a rescheduled exporter CONTINUES the same
      # series instead of starting a twin. metricRelabelings run after the
      # target labels are attached, so both are visible here; scoping on
      # __name__ leaves `up`, scrape_*, go_* and process_* on the real target
      # identity (those are per-process, where pod identity is true). Safe to
      # rewrite: no dashboard or rule selects unpoller_* by instance/pod
      # (0 expr hits; the prometheusrule's `max by (ap_name, mac)` dedup stays
      # correct with one series), and unpoller exports no native instance/pod
      # label (0 exported_instance/exported_pod series over 7d), so nothing is
      # clobbered. An empty replacement DELETES the target label (Prometheus
      # relabel `replace` semantics; the CRD accepts ""). During a
      # RollingUpdate both pods briefly write the same series -- both poll the
      # same controller, so they agree within a poll -- and that ~1 min overlap
      # replaces the permanent twin.
      metricRelabelings:
        - sourceLabels: [__name__]
          regex: unpoller_.*
          targetLabel: instance
          replacement: unpoller
        - sourceLabels: [__name__]
          regex: unpoller_.*
          targetLabel: pod
          replacement: ""
