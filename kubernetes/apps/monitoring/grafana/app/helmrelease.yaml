---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
spec:
  interval: 30m
  chart:
    spec:
      chart: grafana
      version: 12.11.2
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    # 2026-08-17: chart 12.10.4 from grafana-community.github.io (the repo file
    # already pointed there; grafana.github.io is frozen at 10.5.15). Ships
    # Grafana 13.1.3 — the 2026-08-14 CVE image pins (12.4.8 / curl 8.21.0 /
    # sidecar 2.10.1) are dropped: chart defaults are newer than every pin.
    # 2026-08-18: chart 12.11.0 (Grafana 13.2.0) — routine minor, direct-bump batch.
    # 2026-08-23: chart 12.11.1 — routine patch, direct-bump batch.
    # Note kube-prometheus-stack sets `grafana.enabled: false`, so this release
    # alone owns Grafana. Rollback: chart revert + grafana-config Longhorn
    # backup (03:00 daily) — Grafana 13 migrates the sqlite schema on boot.
    #
    # NO `image.tag` PIN HERE, AND THAT IS DELIBERATE — the image follows the
    # chart default (13.2.0). Do not "fix" this by pinning `13.2.0-slim`:
    # it was tried on 2026-08-18 (c8a1f6e9) and reverted 4 minutes later
    # (f08a32e9, whose message is bare because it was an emergency revert).
    #
    # What failed, and at which check: the pod started fine and 13.2.0-slim
    # exists — the DATASOURCE gate failed. `-slim` ships
    # data/plugins-bundled EMPTY, and from 13.2.0 upstream that directory is
    # the delivery mechanism for the CORE datasource backends, not a
    # duplicate of compiled-in ones (upstream grew the bundled catalog set
    # from 2 entries to 13; see PR #129593). On the slim pod
    # `/api/plugins?type=datasource` returned 6 plugins against 18 on plain —
    # and those 6 were only leftovers persisted on the grafana-config PVC.
    # Grafana logged `reason="plugin prometheus not found"`. Six of our seven
    # provisioned datasources would have been dead.
    #
    # GF_PLUGINS_PREINSTALL_DISABLED (which slim needs, or it re-downloads the
    # same binaries at startup) is what closes the last escape hatch: the tag
    # and that env var are each individually correct and jointly fatal.
    #
    # Full evidence + the remaining options: security_ref: F-de4d92cd
    # Gate to re-run before ANY grafana image change (not just slim):
    # docs/sops/monitoring.md → "Image variants: plain vs -slim".
    deploymentStrategy:
      type: Recreate
    admin:
      existingSecret: grafana-admin-secret
    envFromSecret: grafana-admin-secret
    env:
      GF_EXPLORE_ENABLED: true
    extraSecretMounts:
      - name: elasticsearch-credentials
        secretName: elasticsearch-es-elastic-user
        defaultMode: 0440
        mountPath: /etc/secrets/elasticsearch
        readOnly: true
    grafana.ini:
      server:
        root_url: "https://grafana.${SECRET_DOMAIN}"
      analytics:
        check_for_updates: false
        check_for_plugin_updates: false
        reporting_enabled: false
    datasources:
      datasources.yaml:
        apiVersion: 1
        deleteDatasources:
          - { name: Prometheus, orgId: 1 }
          - { name: InfluxDB, orgId: 1 }
          - { name: Unpoller InfluxDB, orgId: 1 }
          - { name: TeslaMate, orgId: 1 }
          - { name: Pellets, orgId: 1 }
          - { name: Elasticsearch, orgId: 1 }
          - { name: Alertmanager, orgId: 1 }
        datasources:
          - name: Alertmanager
            type: alertmanager
            uid: alertmanager
            access: proxy
            url: http://kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local:9093
            jsonData:
              implementation: prometheus
              handleGrafanaManagedAlerts: false
          - name: Prometheus
            type: prometheus
            uid: prometheus
            access: proxy
            url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
            jsonData:
              prometheusType: Prometheus
            isDefault: true
          - name: Unpoller InfluxDB
            type: influxdb
            uid: unpoller-influxdb
            access: proxy
            url: http://influxdb-influxdb2.databases.svc.cluster.local:80
            jsonData:
              version: Flux
              organization: ${INFLUXDB_ORG}
              defaultBucket: ${INFLUXDB_BUCKET}
              httpMode: POST
            secureJsonData:
              token: $__env{INFLUXDB_TOKEN}
          - name: InfluxDB
            type: influxdb
            uid: influxdb
            access: proxy
            url: http://influxdb-influxdb2.databases.svc.cluster.local:80
            jsonData:
              version: Flux
              organization: ${INFLUXDB_ORG}
              defaultBucket: ${INFLUXDB_BUCKET}
              httpMode: POST
            secureJsonData:
              token: $__env{INFLUXDB_TOKEN}
          - name: TeslaMate
            type: postgres
            uid: TeslaMate
            access: proxy
            url: teslamate-postgres.home-automation.svc.cluster.local:5432
            user: teslamate
            secureJsonData:
              password: $__env{TESLAMATE_DB_PASSWORD}
            jsonData:
              database: teslamate
              sslmode: disable
              postgresVersion: 1800
          - name: Pellets
            type: postgres
            uid: pellets
            access: proxy
            url: postgresql.databases.svc.cluster.local:5432
            user: pellets
            secureJsonData:
              password: $__env{PELLETS_DB_PASSWORD}
            jsonData:
              database: pellets
              sslmode: disable
              postgresVersion: 1600
          - name: Elasticsearch
            type: elasticsearch
            uid: elasticsearch
            access: proxy
            url: https://elasticsearch-es-http.monitoring.svc.cluster.local:9200
            basicAuth: true
            basicAuthUser: elastic
            jsonData:
              index: "fluent-bit-*"
              timeField: "@timestamp"
              logMessageField: log
              logLevelField: level
              tlsSkipVerify: true
              esVersion: "8.15.3"
            secureJsonData:
              basicAuthPassword: $__file{/etc/secrets/elasticsearch/elastic}
    dashboards:
      default:
        cloudflared:
          gnetId: 17457 # https://grafana.com/grafana/dashboards/17457?tab=revisions
          revision: 6
          datasource:
            - { name: DS_PROMETHEUS, value: Prometheus }
        external-dns:
          gnetId: 15038 # https://grafana.com/grafana/dashboards/15038?tab=revisions
          revision: 1
          datasource: Prometheus
        cert-manager:
          # Upstream RENAMED this file: .../dashboards/cert-manager.json now 404s
          # and the dashboard is cert-manager-overview.json. The old URL made the
          # init container write a 0-byte file, so Grafana logged
          # `failed to load dashboard ... error=EOF` on every start while the
          # dashboard silently did not exist. Verified 2026-08-14: 200, 47 KB,
          # valid JSON, title "Cert Manager / Overview", 10 panels.
          url: https://raw.githubusercontent.com/monitoring-mixins/website/master/assets/cert-manager/dashboards/cert-manager-overview.json
          datasource: Prometheus
        node-exporter-full:
          gnetId: 1860 # https://grafana.com/grafana/dashboards/1860?tab=revisions
          revision: 31
          datasource: Prometheus
        influxdb-v2:
          gnetId: 15650 # https://grafana.com/grafana/dashboards/15650 - InfluxDB 2.x monitoring
          revision: 1
          datasource: Prometheus
        adguard-home:
          gnetId: 20799 # https://grafana.com/grafana/dashboards/20799 - AdGuard Home Exporter
          revision: 1
          datasource: Prometheus
        mosquitto:
          gnetId: 17721 # https://grafana.com/grafana/dashboards/17721 - Mosquitto Exporter
          revision: 1
          datasource: Prometheus
      flux:
        flux-cluster:
          url: https://raw.githubusercontent.com/fluxcd/flux2-monitoring-example/main/monitoring/configs/dashboards/cluster.json
          datasource: Prometheus
        flux-control-plane:
          url: https://raw.githubusercontent.com/fluxcd/flux2-monitoring-example/main/monitoring/configs/dashboards/control-plane.json
          datasource: Prometheus
      kubernetes:
        kubernetes-api-server:
          url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-system-api-server.json
          datasource: Prometheus
        kubernetes-coredns:
          url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-system-coredns.json
          datasource: Prometheus
        kubernetes-global:
          url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-global.json
          datasource: Prometheus
        kubernetes-namespaces:
          url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-namespaces.json
          datasource: Prometheus
        kubernetes-nodes:
          url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-nodes.json
          datasource: Prometheus
        kubernetes-pods:
          url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-pods.json
          datasource: Prometheus
      nginx:
        nginx:
          url: https://raw.githubusercontent.com/kubernetes/ingress-nginx/master/deploy/grafana/dashboards/nginx.json
          datasource: Prometheus
        nginx-request-handling-performance:
          url: https://raw.githubusercontent.com/kubernetes/ingress-nginx/master/deploy/grafana/dashboards/request-handling-performance.json
          datasource: Prometheus
      teslamate:
        charges:
          url: https://raw.githubusercontent.com/teslamate-org/teslamate/master/grafana/dashboards/charges.json
          datasource: TeslaMate
        charging-stats:
          url: https://raw.githubusercontent.com/teslamate-org/teslamate/master/grafana/dashboards/charging-stats.json
          datasource: TeslaMate
        drives:
          url: https://raw.githubusercontent.com/teslamate-org/teslamate/master/grafana/dashboards/drives.json
          datasource: TeslaMate
        efficiency:
          url: https://raw.githubusercontent.com/teslamate-org/teslamate/master/grafana/dashboards/efficiency.json
          datasource: TeslaMate
        locations:
          url: https://raw.githubusercontent.com/teslamate-org/teslamate/master/grafana/dashboards/locations.json
          datasource: TeslaMate
        overview:
          url: https://raw.githubusercontent.com/teslamate-org/teslamate/master/grafana/dashboards/overview.json
          datasource: TeslaMate
        states:
          url: https://raw.githubusercontent.com/teslamate-org/teslamate/master/grafana/dashboards/states.json
          datasource: TeslaMate
        statistics:
          url: https://raw.githubusercontent.com/teslamate-org/teslamate/master/grafana/dashboards/statistics.json
          datasource: TeslaMate
        updates:
          url: https://raw.githubusercontent.com/teslamate-org/teslamate/master/grafana/dashboards/updates.json
          datasource: TeslaMate
        vampire-drain:
          url: https://raw.githubusercontent.com/teslamate-org/teslamate/master/grafana/dashboards/vampire-drain.json
          datasource: TeslaMate
        visited:
          url: https://raw.githubusercontent.com/teslamate-org/teslamate/master/grafana/dashboards/visited.json
          datasource: TeslaMate
    sidecar:
      dashboards:
        enabled: true
        searchNamespace: ALL
        labelValue: ""
        label: grafana_dashboard
        folderAnnotation: grafana_folder
        folder: /var/lib/grafana/dashboards/sidecar
        defaultFolderName: default
        provider:
          disableDelete: true
          foldersFromFilesStructure: true
      datasources:
        enabled: true
        searchNamespace: ALL
        labelValue: ""
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: default
            orgId: 1
            folder: ""
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/default
          - name: flux
            orgId: 1
            folder: Flux
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/flux
          - name: kubernetes
            orgId: 1
            folder: Kubernetes
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/kubernetes
          - name: nginx
            orgId: 1
            folder: Nginx
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/nginx
          - name: teslamate
            orgId: 1
            folder: TeslaMate
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/teslamate
    serviceMonitor:
      enabled: true
    ingress:
      enabled: true
      ingressClassName: internal
      annotations: {}
      hosts:
        - &host "grafana.${SECRET_DOMAIN}"
      tls:
        - hosts:
            - *host
    persistence:
      enabled: true
      existingClaim: grafana-config
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
    testFramework:
      enabled: false
