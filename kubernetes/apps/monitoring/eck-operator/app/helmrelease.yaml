---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: eck-operator
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: eck-operator
      version: 3.5.0
      sourceRef:
        kind: HelmRepository
        name: elastic
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    installCRDs: true
    createClusterScopedResources: true
    nodeSelector: {}
    tolerations: []
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        # 256Mi -> 512Mi (2026-09-11). At 256Mi the working set peaked at
        # 247.0Mi = 96.5% of the limit and fired ContainerMemoryNearLimit.
        #
        # The mechanism is NOT demand and NOT a leak: this binary calls
        # automemlimit at startup, which sets Go's soft heap ceiling to 90% of
        # whatever cgroup limit we give it -- logged on line 1 as
        # `GOMEMLIMIT is updated GOMEMLIMIT=241591910`, i.e. exactly 0.9*256Mi
        # = 230.4MiB. So the runtime deliberately grows the heap toward the
        # limit during a burst and collects there instead of asking for more.
        # That is why the peak ceiling is FLAT across 4 days (243.3Mi on day 1,
        # 247.0Mi on day 4, +1.5%) while sitting 9Mi under the limit, and why
        # restartCount is 0 with no OOM events despite peak cgroup usage
        # touching the limit: it self-throttles by spending CPU in GC rather
        # than by dying.
        #
        # The cost of leaving it at 256Mi is therefore GC thrash -- slower
        # Elasticsearch reconciliation, not a crash. That still matters here:
        # this operator reconciles the ES cluster that log ingestion and the
        # sweep findings store both depend on, and a stalled reconcile is
        # quiet. The 6 observed peaks are at irregular times (22:40, 00:20,
        # 01:10, 15:00, 15:10, 10:10), so there is no single periodic
        # reconcile to size against -- hence headroom against the GC ceiling
        # rather than against one event's peak.
        #
        # Expect the peak to RISE, not fall: GOMEMLIMIT becomes 460.8MiB and
        # Go will use the room it is given. The win is that the ceiling stops
        # being the binding constraint (idle RSS is ~137Mi), so the peak should
        # settle near real demand at roughly 55-65% of the limit instead of
        # pinned at 96%. If it instead climbs back to ~90% of 512Mi, the
        # diagnosis above is wrong and the next step is an explicit GOMEMLIMIT
        # plus a heap profile, NOT another doubling.
        #
        # Request deliberately left at 128Mi: scheduling pressure is unchanged,
        # only the burst ceiling moves.
        memory: 512Mi
