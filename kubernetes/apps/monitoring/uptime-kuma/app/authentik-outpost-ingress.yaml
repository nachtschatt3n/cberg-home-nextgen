---
# ExternalName service pointing at the Authentik proxy outpost in kube-system.
#
# NO LONGER ON THE SERVING PATH since Envoy migration phase 3: the HTTPRoute in
# ./httproute.yaml references the real kube-system Service directly, because
# Envoy Gateway resolves backends through EndpointSlices and an ExternalName
# has none. Kept because reverting the phase 3 commit restores an Ingress that
# needs it, and because other in-cluster callers may still resolve this name.
apiVersion: v1
kind: Service
metadata:
  name: uptime-kuma-authentik-outpost
  namespace: monitoring
spec:
  type: ExternalName
  externalName: ak-outpost-uptime-kuma-forward-auth.kube-system.svc.cluster.local
  ports:
    - port: 9000
      targetPort: 9000
      protocol: TCP
