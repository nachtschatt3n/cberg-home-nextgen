---
# Declarative Elasticsearch role for the Ninth Banner CI log reader (ECK file
# roles, spec.auth.roles). Not sensitive, so a plain Secret (ECK requires a Secret).
#
# The license is Basic: document-level security (role `query`) is NOT available
# (role creation is refused: "non-compliant for [field and document level
# security]"). The per-document restriction is therefore a FILTERED DATA STREAM
# ALIAS `ci-runner-logs` (created by elasticsearch-otel-ilm-bootstrap), and this
# role grants privileges on that alias ONLY -- no privilege on logs-generic-default
# itself, so the reader can only search through the filter.
apiVersion: v1
kind: Secret
metadata:
  name: elasticsearch-ci-runner-roles
  namespace: monitoring
stringData:
  roles.yml: |-
    ci-runner-logs-ro:
      cluster: ["monitor"]
      indices:
        - names: ["ci-runner-logs"]
          privileges: ["read", "view_index_metadata"]
