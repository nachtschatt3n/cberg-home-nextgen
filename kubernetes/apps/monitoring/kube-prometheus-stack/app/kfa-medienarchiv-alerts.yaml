---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/name: kube-prometheus-stack
    app.kubernetes.io/part-of: kube-prometheus-stack
    release: kube-prometheus-stack
  name: kfa-medienarchiv-alerts
  namespace: monitoring
spec:
  groups:
  - interval: 30s
    name: kfa-medienarchiv.rules
    rules:
    # Pod Health Alerts
    - alert: KFAMedienarchivPodNotReady
      annotations:
        description: KFA Medienarchiv pod {{ $labels.pod }} has been not ready for more
          than 5 minutes. The media archive service may be unavailable.
        summary: KFA Medienarchiv pod {{ $labels.pod }} is not ready
      expr: |
        sum by (namespace, pod) (
          kube_pod_status_ready{pod=~"kfa-medienarchiv-.*", condition="false"}
        ) > 0
      for: 5m
      labels:
        app: kfa-medienarchiv
        component: medienarchiv
        severity: critical
    - alert: KFAMedienarchivPodCrashLooping
      annotations:
        description: KFA Medienarchiv pod {{ $labels.pod }} has restarted {{ $value
          | printf "%.0f" }} times in the last 15 minutes. Check logs for startup
          errors or dependency failures.
        summary: KFA Medienarchiv pod {{ $labels.pod }} is crash looping
      expr: |
        rate(kube_pod_container_status_restarts_total{pod=~"kfa-medienarchiv-.*"}[15m]) * 900 > 2
      for: 5m
      labels:
        app: kfa-medienarchiv
        component: medienarchiv
        severity: critical
    - alert: KFAMedienarchivPodRestarted
      annotations:
        description: KFA Medienarchiv pod {{ $labels.pod }} has restarted at least
          once in the last 15 minutes. Monitor for repeated restarts or OOMKills.
        summary: KFA Medienarchiv pod {{ $labels.pod }} restarted
      expr: |
        increase(kube_pod_container_status_restarts_total{pod=~"kfa-medienarchiv-.*"}[15m]) > 0
      for: 1m
      labels:
        app: kfa-medienarchiv
        component: medienarchiv
        severity: warning

    # Resource Utilization Alerts (optional — uncomment when metrics are available)
    # - alert: KFAMedienarchivHighMemoryUsage
    #   annotations:
