    #       of its memory limit. Consider increasing memory request/limit or optimizing
    #       database queries.
    #     summary: KFA Medienarchiv pod {{ $labels.pod }} high memory usage
    #   expr: |
    #     (sum(container_memory_usage_bytes{pod=~"kfa-medienarchiv-.*"}) by (pod) /
    #      sum(container_spec_memory_limit_bytes{pod=~"kfa-medienarchiv-.*"}) by (pod)) > 0.85
    #   for: 5m
    #   labels:
    #     app: kfa-medienarchiv
    #     component: medienarchiv
    #     severity: warning

    # - alert: KFAMedienarchivHighCPUUsage
    #   annotations:
    #     description: KFA Medienarchiv pod {{ $labels.pod }} is using {{ $value | humanizePercentage }}
    #       of its CPU limit. Monitor for performance degradation or increase CPU requests.
    #     summary: KFA Medienarchiv pod {{ $labels.pod }} high CPU usage
    #   expr: |
    #     (sum(rate(container_cpu_usage_seconds_total{pod=~"kfa-medienarchiv-.*"}[5m])) by (pod) /
    #      sum(container_spec_cpu_quota{pod=~"kfa-medienarchiv-.*"}) by (pod)) > 0.8
    #   for: 10m
    #   labels:
    #     app: kfa-medienarchiv
    #     component: medienarchiv
