---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/name: kube-prometheus-stack
    app.kubernetes.io/part-of: kube-prometheus-stack
    release: kube-prometheus-stack
  name: immich-alerts
  namespace: monitoring
spec:
  groups:
    - name: immich.pods.health
      interval: 30s
      rules:
        - alert: ImmichServerNotReady
          annotations:
            summary: Immich server pod {{ $labels.pod }} is not ready
            description: >-
              Immich server pod {{ $labels.pod }} has been not ready for more than
              5 minutes. The photo library web/API is unavailable.
          expr: |
            sum by (namespace, pod) (
              kube_pod_status_ready{namespace="media", pod=~"immich-server-.*", condition="true"}
            ) == 0
          for: 5m
          labels:
            category: media
            component: immich
            severity: critical
        - alert: ImmichPostgresNotReady
          annotations:
            summary: Immich Postgres pod {{ $labels.pod }} is not ready
            description: >-
              Immich Postgres (VectorChord) pod {{ $labels.pod }} has been not ready
              for more than 5 minutes. Immich cannot function without its database.
          expr: |
            sum by (namespace, pod) (
              kube_pod_status_ready{namespace="media", pod=~"immich-postgres-.*", condition="true"}
            ) == 0
          for: 5m
          labels:
            category: media
            component: immich
            severity: critical
        - alert: ImmichMLNotReady
          annotations:
            summary: Immich machine-learning pod {{ $labels.pod }} is not ready
            description: >-
              Immich machine-learning pod {{ $labels.pod }} has been not ready for
              more than 5 minutes. Face detection and smart search are degraded
              (the server itself keeps serving the library). Check the OpenVINO/iGPU
              path — fallback is the plain (CPU) ML image tag.
          expr: |
            sum by (namespace, pod) (
              kube_pod_status_ready{namespace="media", pod=~"immich-machine-learning-.*", condition="true"}
            ) == 0
          for: 5m
          labels:
            category: media
            component: immich
            severity: warning
        - alert: ImmichRedisNotReady
          annotations:
            summary: Immich Redis pod {{ $labels.pod }} is not ready
            description: >-
              Immich Redis (BullMQ job queue) pod {{ $labels.pod }} has been not
              ready for more than 5 minutes. Background jobs (thumbnails, ML,
              library scans) will stall.
          expr: |
            sum by (namespace, pod) (
              kube_pod_status_ready{namespace="media", pod=~"immich-redis-.*", condition="true"}
            ) == 0
          for: 5m
          labels:
            category: media
            component: immich
            severity: critical
        - alert: ImmichPodCrashLooping
          annotations:
            summary: Immich pod {{ $labels.pod }} is crash looping
            description: >-
              Immich pod {{ $labels.pod }} has restarted {{ $value | printf "%.0f" }}
              times in the last 15 minutes. Check logs.
          expr: |
            rate(kube_pod_container_status_restarts_total{namespace="media", pod=~"immich-.*"}[15m]) * 900 > 2
          for: 5m
          labels:
            category: media
            component: immich
            severity: critical
        - alert: ImmichPodRestarted
          annotations:
            summary: Immich pod {{ $labels.pod }} restarted
            description: >-
              Immich pod {{ $labels.pod }} has restarted at least once in the last
              15 minutes. Monitor for repeated restarts.
          expr: |
            increase(kube_pod_container_status_restarts_total{namespace="media", pod=~"immich-.*"}[15m]) > 0
          for: 1m
          labels:
            category: media
            component: immich
            severity: warning
