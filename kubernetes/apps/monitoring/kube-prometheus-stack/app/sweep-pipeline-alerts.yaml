---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: sweep-pipeline-alerts
  labels:
    release: kube-prometheus-stack
  namespace: monitoring
spec:
  groups:
    - name: sweep.pipeline
      interval: 1m
      rules:
        # The in-cluster half of the sweep heartbeat (P0.5/G3). The CronJob
        # databases/sweep-heartbeat FAILS its job when the newest sweep_cycles
        # row is >72h old. This rule turns that failure — or the CronJob never
        # running at all — into a page over Alertmanager->Telegram, a path with
        # no Mac-mini component anywhere in it.
        #
        # Two arms, both required (the frigate-restart lesson, twice over):
        # kube_cronjob_status_last_successful_time does not exist until the
        # CronJob first SUCCEEDS, so `time() - <absent>` returns no data and
        # never fires in exactly the never-worked state; and a deleted CronJob
        # produces the same silence. absent() covers both.
        - alert: SweepPipelineDead
          expr: |
            (
              (time() - kube_cronjob_status_last_successful_time{namespace="databases",cronjob="sweep-heartbeat"}) > 8 * 3600
            )
            or
            absent(kube_cronjob_status_last_successful_time{namespace="databases",cronjob="sweep-heartbeat"})
          for: 30m
          labels:
            severity: critical
            category: pipeline
            component: sweep
          annotations:
            summary: "Sweep pipeline heartbeat is dead — the cluster may be unwatched"
            description: >-
              The in-cluster sweep-heartbeat CronJob (databases namespace) has not succeeded in
              over 8 hours (it runs every 6h), or its metrics are absent entirely. Either the
              newest sweep cycle is older than 72h — meaning the Mac-side sweep pipeline is down,
              wedged, or the Mac itself is off — or the heartbeat mechanism has been removed.
              A quiet cluster is NOT evidence of a healthy one while this fires: nothing is
              sweeping. Check the Mac mini, the OpenClaw sweep cron (8163c139), and the
              sweep-heartbeat Job logs.
