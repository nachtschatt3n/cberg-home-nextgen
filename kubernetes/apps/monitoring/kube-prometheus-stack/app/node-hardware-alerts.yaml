---
# Node hardware-health alerts — added 2026-06-29 after k8s-nuc14-01 silently
# rebooted at 04:00:58 UTC and surfaced only as a downstream app alert
# (PaperclipPodNotReady). These page directly on the node-level event.
#
# All metrics verified present on these Talos v1.13.5 / Intel NUC14 nodes:
#   - node_boot_time_seconds                 (reboot detection)
#   - node_thermal_zone_temp{type=x86_pkg_temp} + node_hwmon_temp_crit_alarm_celsius (thermal)
#   - node_edac_{correctable,uncorrectable}_errors_total  (ECC memory; works here
#     despite being unavailable on stock Talos — our image exposes the EDAC mc nodes)
# An absent-guard alert flags if EDAC ever stops being scraped (e.g. a Talos
# image change), since memory-error monitoring would silently go blind.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/name: kube-prometheus-stack
    app.kubernetes.io/part-of: kube-prometheus-stack
    release: kube-prometheus-stack  # required — Prometheus ruleSelector matchLabels
  name: node-hardware-alerts
  namespace: monitoring
spec:
  groups:
    - name: node.reboot.rules
      interval: 30s
      rules:
        - alert: NodeUnexpectedReboot
          # Fires when a node booted <10m ago AND it was already up >10m a
          # moment before (offset guard => does not false-fire when a brand-new
          # node first appears). node_boot_time_seconds is a timestamp — never
          # rate()/increase() it.
          expr: |
            (time() - node_boot_time_seconds < 600)
            and
            (time() - 600 - (node_boot_time_seconds offset 10m) > 600)
          for: 0m
          labels:
            severity: critical
            category: node-hardware
            component: node
          annotations:
            summary: "Node rebooted: {{ $labels.instance }}"
            description: >-
              Node {{ $labels.instance }} rebooted in the last 10 minutes. No planned reboot
              mechanism (kured / Talos upgrade) exists on this cluster — investigate for kernel
              panic / hardware watchdog / power. Runbook: docs/troubleshooting/node-reboot-observability.md
        - alert: NodeRebootFlapping
          expr: changes(node_boot_time_seconds[1h]) > 1
          for: 0m
          labels:
            severity: warning
            category: node-hardware
            component: node
          annotations:
            summary: "Node rebooting repeatedly: {{ $labels.instance }}"
            description: "{{ $labels.instance }} rebooted {{ $value }} times in the last hour — possible crash/power loop or failing hardware."
    - name: node.thermal.rules
      interval: 30s
      rules:
        - alert: NodeCPUTemperatureHigh
          # Retuned 2026-08-09: was >90 for 10m, which nagged continuously during
          # legitimate sustained GPU/CPU work — an Immich transcode batch parks the
          # package at 85-90°C for hours, and a warning that fires through every
          # normal batch trains you to ignore it.
          # >93 for 20m instead: the 14-day baseline ceiling for these nodes is
          # 70-85°C, so 20 minutes above 93°C is genuinely abnormal rather than
          # merely busy. This would still have fired during the 2026-08-08 thermal
          # incident, which sat at 100-103°C for over an hour.
          # NodeCPUTemperatureCritical below is deliberately UNCHANGED — it is the
          # rule that caught that incident and must stay sensitive.
          expr: max by (instance) (node_thermal_zone_temp{type="x86_pkg_temp"}) > 93
          for: 20m
          labels:
            severity: warning
            category: node-hardware
            component: cpu-thermal
          annotations:
            summary: "CPU package temp high on {{ $labels.instance }}"
            description: "CPU package temperature is {{ $value | printf \"%.0f\" }}°C (>93°C for 20m). Tjmax on these NUC14 is ~110°C; investigate airflow/dust, and check whether a bulk media job is running uncapped."
        - alert: NodeCPUTemperatureCritical
          expr: max by (instance) (node_thermal_zone_temp{type="x86_pkg_temp"}) > 100
          for: 2m
          labels:
            severity: critical
            category: node-hardware
            component: cpu-thermal
          annotations:
            summary: "CPU package temp critical on {{ $labels.instance }}"
            description: "CPU package temperature is {{ $value | printf \"%.0f\" }}°C (>100°C). Approaching Tjmax (~110°C) — thermal throttle/shutdown risk."
        - alert: NodeCPUThermalCritAlarm
          # The chip's own critical-temperature alarm flag — hardware-asserted.
          expr: node_hwmon_temp_crit_alarm_celsius == 1
          for: 1m
          labels:
            severity: critical
            category: node-hardware
            component: cpu-thermal
          annotations:
            summary: "Hardware thermal critical alarm on {{ $labels.instance }}"
            description: "Sensor {{ $labels.sensor }} on chip {{ $labels.chip }} asserted its critical-temperature alarm."
    - name: node.cpu-throttle.rules
      interval: 30s
      rules:
        - alert: CPUThrottlingHigh
          # Relaxed replacement for the stock kube-prometheus-stack rule (which
          # is disabled in helmvalues.yaml). Stock fired at >25% CFS-throttled
          # for 15m — too noisy for this bursty homelab, where brief throttling
          # against a CPU limit is normal and not actionable. Only sustained,
          # heavy throttling (>50% for 30m) is worth surfacing. Expr mirrors the
          # stock topk/sum-without shape so per-container accounting is identical.
          expr: |
            sum without (id, metrics_path, name, image, endpoint, job, node) (
              topk by (cluster, namespace, pod, container, instance) (1,
                increase(container_cpu_cfs_throttled_periods_total{container!="",job="kubelet",metrics_path="/metrics/cadvisor"}[5m])))
            / on (cluster, namespace, pod, container, instance) group_left () sum without (id, metrics_path, name, image, endpoint, job, node) (
              topk by (cluster, namespace, pod, container, instance) (1,
                increase(container_cpu_cfs_periods_total{job="kubelet",metrics_path="/metrics/cadvisor"}[5m])))
            > (50 / 100)
          for: 30m
          labels:
            severity: info
            category: node-hardware
            component: cpu-throttle
          annotations:
            summary: "Sustained CPU throttling: {{ $labels.container }} in {{ $labels.namespace }}"
            description: >-
              {{ $labels.namespace }}/{{ $labels.pod }} container {{ $labels.container }} has been
              >50% CFS-throttled against its CPU limit for 30m ({{ $value | printf "%.0f%%" }}).
              Sustained throttling this heavy usually means the container's CPU limit is too low for
              its real workload — raise the limit rather than ignore.
    - name: node.memory-ecc.rules
      interval: 60s
      rules:
        - alert: NodeMemoryECCCorrectableErrors
          expr: increase(node_edac_correctable_errors_total[1h]) > 0
          for: 5m
          labels:
            severity: warning
            category: node-hardware
            component: memory-ecc
          annotations:
            summary: "Correctable ECC memory errors on {{ $labels.instance }}"
            description: "{{ $value | printf \"%.0f\" }} correctable ECC error(s) in the last hour on controller {{ $labels.controller }}. A rising rate often precedes a DIMM failure."
        - alert: NodeMemoryECCUncorrectableErrors
          expr: increase(node_edac_uncorrectable_errors_total[1h]) > 0
          for: 0m
          labels:
            severity: critical
            category: node-hardware
            component: memory-ecc
          annotations:
            summary: "Uncorrectable ECC memory errors on {{ $labels.instance }}"
            description: "{{ $value | printf \"%.0f\" }} UNcorrectable ECC error(s) on controller {{ $labels.controller }} — imminent memory/hardware failure; this can hard-reset the node."
        - alert: NodeEDACMetricsAbsent
          # Memory-error monitoring is only as good as the EDAC metrics. These
          # work on our current image but are absent on stock Talos — page (info)
          # if they ever vanish so we know we've gone blind on ECC.
          expr: absent(node_edac_correctable_errors_total)
          for: 30m
          labels:
            severity: info
            category: node-hardware
            component: memory-ecc
          annotations:
            summary: "EDAC memory-error metrics absent cluster-wide"
            description: "node_edac_* metrics are no longer being scraped — ECC memory-error monitoring is blind. Check a Talos image/kernel change or the node-exporter edac collector."
    - name: node.kmsg.rules
      interval: 30s
      rules:
        - alert: NodeKernelHardwareError
          # Tier 2d: kmsg lines matching mce:/Hardware Error/machine check/thermal,
          # shipped from Talos via KmsgLogConfig and counted by the edot-collector
          # count/hwerrors connector (metric labelled by net_peer_ip = node). Catches
          # hardware errors that don't trip EDAC or crash the node outright.
          expr: increase(talos_kernel_hardware_errors_total[1h]) > 0
          for: 0m
          labels:
            severity: critical
            category: node-hardware
            component: kernel-hwerror
          annotations:
            summary: "Kernel hardware-error log on node {{ $labels.net_peer_ip }}"
            description: >-
              {{ $value | printf "%.0f" }} kmsg hardware-error line(s) (mce/machine check/
              Hardware Error/thermal) in the last hour from node {{ $labels.net_peer_ip }}.
              Investigate in Kibana: attributes.log_source:talos-kernel AND
              attributes.net.peer.ip:"{{ $labels.net_peer_ip }}". Runbook:
              docs/troubleshooting/node-reboot-observability.md
        # REMOVED 2026-08-09: TalosKmsgNodeSilent fired continuously and falsely.
        # The rule assumed talos_kernel_kmsg_lines_total behaves as a monotonic
        # counter, but the OTel count-connector/prometheus-exporter pair reports a
        # value of 1 for every node and never increments, so increase()[1h] reads 0
        # for all of them and the "fewer than 3 nodes shipping" test was always
        # true. Ground truth at the time: Elasticsearch had 59/31/33 kmsg docs in
        # the preceding 10 minutes from .11/.12/.13 respectively — all three were
        # shipping fine.
        # The DETECTION GAP IS STILL REAL (nuc14-03 shipped nothing for 4 days and
        # nobody noticed), so this needs re-implementing against a signal that
        # actually moves. Options: fix the connector's temporality so the counter
        # accumulates, or drive the check from Elasticsearch (where the data
        # demonstrably is) via an Uptime Kuma json-query monitor per node.
        # Not left in place at a longer `for:` — a rule that is permanently true
        # would just page forever.
        - alert: TalosKmsgPipelineDown
          # Guard for the guard: if the metric vanishes entirely (collector down,
          # connector renamed, ServiceMonitor broken) the rule above silently
          # stops evaluating and we go blind without any signal.
          expr: absent(talos_kernel_kmsg_lines_total)
          for: 15m
          labels:
            severity: warning
            category: node-hardware
            component: kernel-kmsg
          annotations:
            summary: "Talos kmsg->Elasticsearch pipeline is not reporting"
            description: >-
              talos_kernel_kmsg_lines_total is absent, so kernel-log shipping from
              ALL nodes is unverifiable. Check the edot-collector pod and its
              prometheus/hwerrors exporter on :8889 (distroless image — verify via
              Prometheus, not kubectl exec). Runbook:
              docs/troubleshooting/node-reboot-observability.md
    - name: node.memory.rules
      rules:
        - alert: NodeMemoryMajorPagesFaults
          # Memory-pressure-GATED replacement for the stock node-exporter rule
          # (disabled in helmvalues.yaml). Stock fired on
          # rate(node_vmstat_pgmajfault[5m]) > 500 for 15m — but SWAP IS DISABLED
          # on these Talos nodes (SwapTotal=0), so a "major page fault" is almost
          # always a file-backed mmap read (Elasticsearch Lucene segments, Frigate
          # video, the nightly Longhorn backup), NOT swap thrashing. The stock
          # rule therefore fired on ordinary disk-I/O bursts with the node at
          # ~54% memory and MemoryPressure=False (observed 2026-07-29: 03:00
          # backup on nuc14-01 @4494/s, 13:09 ES/Frigate on nuc14-02 @1951/s —
          # both benign, self-resolved in ~3m).
          #
          # Only a genuinely memory-STARVED node re-faults its file-cache fast
          # enough to matter, so gate on BOTH a high fault rate AND low available
          # memory, sustained. The memory gate (<10% available) is the real
          # discriminator: normal mmap bursts happen at ~46% available and never
          # fire; only file-cache thrashing under memory starvation does.
          expr: |
            rate(node_vmstat_pgmajfault{job="node-exporter"}[5m]) > 1000
            and on (instance)
            (
              node_memory_MemAvailable_bytes{job="node-exporter"}
              / node_memory_MemTotal_bytes{job="node-exporter"}
            ) < 0.10
          for: 30m
          labels:
            severity: warning
            category: node-hardware
            component: memory-faults
          annotations:
            summary: "Sustained major page faults under memory pressure on {{ $labels.instance }}"
            description: >-
              {{ $labels.instance }} is major-faulting >1000 pages/s while <10% of
              memory is available, sustained 30m — genuine file-cache thrashing under
              memory starvation (swap is disabled, so this is not swap thrash). Check
              the node's top memory consumers; a pod likely needs a limit bump or the
              node is overcommitted.
