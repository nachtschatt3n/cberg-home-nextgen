---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/name: kube-prometheus-stack
    app.kubernetes.io/part-of: kube-prometheus-stack
    release: kube-prometheus-stack
  name: dashcast-alerts
  namespace: monitoring
spec:
  groups:
  - interval: 30s
    name: dashcast.pods.health
    rules:
    - alert: DashcastPodNotReady
      annotations:
        description: dashcast pod {{ $labels.pod }} has been not ready for more
          than 5 minutes. TECHO5 screens cannot show streamed dashboards.
        summary: dashcast pod {{ $labels.pod }} is not ready
      expr: |
        sum by (namespace, pod) (
          kube_pod_status_ready{namespace="home-automation", pod=~"dashcast-.*", condition="true"}
          unless on(namespace, pod) kube_pod_status_phase{phase="Succeeded"} == 1
        ) == 0
      for: 5m
      labels:
        category: home-automation
        component: dashcast
        severity: critical
    - alert: DashcastPodCrashLooping
      annotations:
        description: dashcast pod {{ $labels.pod }} has restarted {{ $value | printf
          "%.0f" }} times in the last 15 minutes. Check logs for HA_TOKEN /
          DASHCAST_KEY errors or Chrome start failures.
        summary: dashcast pod {{ $labels.pod }} is crash looping
      expr: |
        rate(kube_pod_container_status_restarts_total{namespace="home-automation", pod=~"dashcast-.*"}[15m]) * 900 > 2
      for: 5m
      labels:
        category: home-automation
        component: dashcast
        severity: critical
    - alert: DashcastPodRestarted
      annotations:
        description: dashcast pod {{ $labels.pod }} has restarted at least once
          in the last 15 minutes (OOM with many screens is the usual cause).
        summary: dashcast pod {{ $labels.pod }} restarted
      expr: |
        increase(kube_pod_container_status_restarts_total{namespace="home-automation", pod=~"dashcast-.*"}[15m]) > 0
      for: 1m
      labels:
        category: home-automation
        component: dashcast
        severity: warning
