---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/name: kube-prometheus-stack
    app.kubernetes.io/part-of: kube-prometheus-stack
    release: kube-prometheus-stack
  name: pallet-price-monitor-alerts
  namespace: monitoring
spec:
  groups:
  - interval: 30s
    name: pallet-price-monitor.run.health
    rules:
    - alert: PalletPriceMonitorRunStale
      annotations:
        description: |
          The pellet-price-monitor scraper has not completed a successful run
          in over 15 hours. The CronJob is supposed to fire every 12 hours
          (08:00 + 20:00 Europe/Berlin). Check the latest Job status and DB.
        summary: Pellet-price-monitor has not run recently
      expr: |
        time() - max(pellet_last_run_timestamp_seconds) > 60 * 60 * 15
      for: 15m
      labels:
        category: home-automation
        component: pallet-price-monitor
        severity: warning
    - alert: PalletPriceMonitorJobFailed
      annotations:
        description: |
          The most recent pellet-price-monitor Job failed. Check kubectl logs
          for the latest pod under the pallet-price-monitor CronJob.
        summary: Pellet-price-monitor Job failed
      expr: |
        sum(kube_job_failed{namespace="home-automation", job_name=~"pallet-price-monitor-.*"}) > 0
      for: 5m
      labels:
        category: home-automation
        component: pallet-price-monitor
        severity: critical
    - alert: PalletCriticalSourceStale
      annotations:
        description: |
          Critical pellet-price-monitor source `{{ $labels.source }}` has not
          successfully reported in over 30 hours. This is the alert class that
          would have caught the DWD HDD regression where the parser silently
          emitted 0 weather rows for several runs.
        summary: Pellet-price-monitor source {{ $labels.source }} is stale
      expr: |
        time() - max by (source) (
          pellet_source_last_success_timestamp_seconds{
            source=~"dwd_hdd|heizpellets24|heizpellets24_offers|esyoil|heizoel24|eurostat_hs_440131"
          }
        ) > 60 * 60 * 30
      for: 30m
      labels:
        category: home-automation
        component: pallet-price-monitor
        severity: warning
# NOTE: the pellet BUY signal is intentionally NOT an alert. Alertmanager/
# Telegram alerts are for IT-OPERATIONS only; a favourable buy window is a
# business/informational signal, not an ops problem. It's surfaced via the
# OpenClaw morning briefing (which reads pellet_buy_signal_active /
# pellet_local_price_eur_per_t directly), not the ops alert channel.
# See memory feedback_alerts_it_ops_only (2026-08-01). The operational
# pallet-price-monitor alerts below (run stale / job failed / source stale /
# pod crashloop / not ready) stay — a broken monitor IS an ops issue.

  - interval: 30s
    name: pallet-price-monitor.pods.health
    rules:
    - alert: PalletPriceMonitorPodCrashLooping
      annotations:
        description: |
          A pellet-price-monitor pod has restarted {{ $value | printf "%.0f" }}
          times in the last 15 minutes — investigate the latest container logs.
        summary: Pellet-price-monitor pod is crash looping
      expr: |
        rate(kube_pod_container_status_restarts_total{namespace="home-automation", pod=~"pallet-price-monitor-.*"}[15m]) * 900 > 2
      for: 5m
      labels:
        category: home-automation
        component: pallet-price-monitor
        severity: critical
    - alert: PalletPriceMonitorPodNotReady
      annotations:
        description: |
          A pellet-price-monitor pod has been not-ready for more than 5 min.
          The Succeeded-phase exclusion ensures normal CronJob completion does
          not fire this alert.
        summary: Pellet-price-monitor pod is not ready
      expr: |
        sum by (namespace, pod) (
          kube_pod_status_ready{namespace="home-automation", pod=~"pallet-price-monitor-.*", condition="true"}
          unless on(namespace, pod) kube_pod_status_phase{phase="Succeeded"} == 1
        ) == 0
      for: 5m
      labels:
        category: home-automation
        component: pallet-price-monitor
        severity: warning
