---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/name: kube-prometheus-stack
    app.kubernetes.io/part-of: kube-prometheus-stack
    release: kube-prometheus-stack
  name: pallet-price-monitor-alerts
  namespace: monitoring
spec:
  groups:
  - interval: 30s
    name: pallet-price-monitor.run.health
    rules:
    - alert: PalletPriceMonitorRunStale
      annotations:
        description: |
          The pellet-price-monitor scraper has not completed a successful run
          in over 15 hours. The CronJob is supposed to fire every 12 hours
          (08:00 + 20:00 Europe/Berlin). Check the latest Job status and DB.
        summary: Pellet-price-monitor has not run recently
      expr: |
        time() - max(pellet_last_run_timestamp_seconds) > 60 * 60 * 15
      for: 15m
      labels:
        category: home-automation
        component: pallet-price-monitor
        severity: warning
    - alert: PalletPriceMonitorJobFailed
      annotations:
        description: |
          The most recent pellet-price-monitor Job failed. Check kubectl logs
          for the latest pod under the pallet-price-monitor CronJob.
        summary: Pellet-price-monitor Job failed
      expr: |
        sum(kube_job_failed{namespace="home-automation", job_name=~"pallet-price-monitor-.*"}) > 0
      for: 5m
      labels:
        category: home-automation
        component: pallet-price-monitor
        severity: critical
    # Keyed on the WRITE series (source yielded >=1 observation this run), not
    # the fetch series: a rotted parser fetches fine and writes nothing.
    #
    # Series semantics that shape this rule: the app pushes with PUT and a
    # job-only grouping key, so every run REPLACES the Pushgateway group. A
    # source that wrote nothing this run has NO write series at all, and the
    # value is always ~the run time. `time() - ts > N` can therefore never fire
    # for a dead source; absence over a window is the signal. Prometheus keeps
    # the history, so a Pushgateway wipe shorter than the window is harmless
    # and a longer one fires every source (correct: we are blind).
    # absent_over_time only yields a labelled result for an equality matcher,
    # hence one term per source; a newly enabled source must be added here.
    #
    # Windows are from measured write gaps (90d, pellets DB) and must stay
    # below Prometheus retention (7d). Three shapes:
    #   every_run  absent 30h   healthy max gap 24h -> 2 consecutive missed runs
    #   daily      absent 5d    healthy max gap 96h (agrarheute), 29h (holzpellets_net).
    #              Armed only once the write series has 5d of history
    #              (`offset 5d` guard), else it fires on sources that simply
    #              have not been due since the metric was introduced.
    #   weekly     fetched, wrote nothing: a successful fetch >=20h old in the
    #              last 36h (so >=2 runs) and no write in the same 36h. Their
    #              healthy gaps (up to 13d) exceed retention, but the forest
    #              scrapers yield exactly one observation per successful HTTP
    #              fetch and swallow HTTP errors, so fetch-without-write there
    #              means the upstream page is broken, not a cadence gap.
    # NOT covered: monthly indices (destatis_epi_*, eurostat_hs_440131) and
    # energienutzer_de: they legitimately fetch-and-write-nothing for weeks
    # between releases. Also NOT covered: a source that keeps re-yielding the
    # same stale rows (idempotent upsert) sets the write series every run;
    # holzkurier and dwd_hdd are in that state. That needs an app-side change
    # (count rows actually inserted, or export newest-observation age).
    - alert: PalletCriticalSourceStale
      annotations:
        description: |
          Pellet-price-monitor source `{{ $labels.source }}` ({{ $labels.cadence }})
          has written no observation in the last {{ $labels.window }}, well
          beyond its expected cadence. Check the scraper logs for
          `source_no_observations id={{ $labels.source }}` (fetched, wrote
          nothing: parser or upstream page broken) or `source_failed` (fetch
          raised). If every source fires at once, the Pushgateway series are
          gone: check the prometheus-pushgateway pod and the latest Job.
        summary: Pellet-price-monitor source {{ $labels.source }} has stopped writing
      expr: |
        label_replace(label_replace(
            absent_over_time(pellet_source_last_write_timestamp_seconds{source="heizpellets24"}[30h])
          or absent_over_time(pellet_source_last_write_timestamp_seconds{source="heizpellets24_offers"}[30h])
          or absent_over_time(pellet_source_last_write_timestamp_seconds{source="esyoil"}[30h])
          or absent_over_time(pellet_source_last_write_timestamp_seconds{source="baywa_pellets"}[30h])
          or absent_over_time(pellet_source_last_write_timestamp_seconds{source="heizoel24"}[30h])
          or absent_over_time(pellet_source_last_write_timestamp_seconds{source="forecast_kaessler"}[30h]),
        "cadence", "every_run", "", ""), "window", "30h", "", "")
        or
        (
          label_replace(label_replace(
              absent_over_time(pellet_source_last_write_timestamp_seconds{source="holzpellets_net"}[5d])
            or absent_over_time(pellet_source_last_write_timestamp_seconds{source="agrarheute"}[5d])
            or absent_over_time(pellet_source_last_write_timestamp_seconds{source="dwd_hdd"}[5d])
            or absent_over_time(pellet_source_last_write_timestamp_seconds{source="holzkurier"}[5d]),
          "cadence", "daily", "", ""), "window", "5d", "", "")
          and on () group(present_over_time(pellet_source_last_write_timestamp_seconds[1h] offset 5d))
        )
        or
        label_replace(label_replace(
          (
            time() - min by (source) (min_over_time(pellet_source_last_success_timestamp_seconds{source=~"hessen_forst|fva_bw_kaefer|nrw_borkenkaefer"}[36h]))
          ) > 20 * 3600
          unless on (source)
          max by (source) (max_over_time(pellet_source_last_write_timestamp_seconds{source=~"hessen_forst|fva_bw_kaefer|nrw_borkenkaefer"}[36h])),
        "cadence", "weekly", "", ""), "window", "36h (fetched on >=2 runs)", "", "")
      for: 30m
      labels:
        category: home-automation
        component: pallet-price-monitor
        severity: warning
# NOTE: the pellet BUY signal is intentionally NOT an alert. Alertmanager/
# Telegram alerts are for IT-OPERATIONS only; a favourable buy window is a
# business/informational signal, not an ops problem. It's surfaced via the
# OpenClaw morning briefing (which reads pellet_buy_signal_active /
# pellet_local_price_eur_per_t directly), not the ops alert channel.
# See memory feedback_alerts_it_ops_only (2026-08-01). The operational
# pallet-price-monitor alerts below (run stale / job failed / source stale /
# pod crashloop / not ready) stay — a broken monitor IS an ops issue.

  - interval: 30s
    name: pallet-price-monitor.pods.health
    rules:
    - alert: PalletPriceMonitorPodCrashLooping
      annotations:
        description: |
          A pellet-price-monitor pod has restarted {{ $value | printf "%.0f" }}
          times in the last 15 minutes — investigate the latest container logs.
        summary: Pellet-price-monitor pod is crash looping
      expr: |
        rate(kube_pod_container_status_restarts_total{namespace="home-automation", pod=~"pallet-price-monitor-.*"}[15m]) * 900 > 2
      for: 5m
      labels:
        category: home-automation
        component: pallet-price-monitor
        severity: critical
    - alert: PalletPriceMonitorPodNotReady
      annotations:
        description: |
          A pellet-price-monitor pod has been not-ready for more than 5 min.
          The Succeeded-phase exclusion ensures normal CronJob completion does
          not fire this alert.
        summary: Pellet-price-monitor pod is not ready
      expr: |
        sum by (namespace, pod) (
          kube_pod_status_ready{namespace="home-automation", pod=~"pallet-price-monitor-.*", condition="true"}
          unless on(namespace, pod) kube_pod_status_phase{phase="Succeeded"} == 1
        ) == 0
      for: 5m
      labels:
        category: home-automation
        component: pallet-price-monitor
        severity: warning
