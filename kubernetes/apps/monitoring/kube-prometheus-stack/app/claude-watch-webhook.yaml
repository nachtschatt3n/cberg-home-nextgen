# PERSISTENT since 2026-08-17 (operator decision: "keep it alive longer") —
# previously an EPHEMERAL kubectl-applied config from runbooks/alert-watcher/,
# torn down after each watch session. Now Flux-managed because the Mac-side
# bridge is a launchd KeepAlive service (com.cberg.alert-bridge), so the
# endpoint is durably up and the old "MUST delete or Alertmanager POSTs at a
# dead bridge" hazard no longer applies. If the bridge is ever retired, remove
# this file in the same change — an orphaned receiver would accumulate
# AlertmanagerFailedToSendAlerts.
#
# Mirrors every alert (parallel to telegram, continue-style routing) to the
# Mac-side alert-bridge, which relays to a Claude Monitor `ws` watcher.
# NOTE: the url is the operator Mac mini on the trusted VLAN; update on IP change.
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: claude-watch-webhook
  namespace: monitoring
  labels:
    alertmanager-config: claude-watch
spec:
  route:
    receiver: claude-webhook
    groupBy: [alertname]
    groupWait: 1s
    # 1m, not the original 5s. groupBy is [alertname], so ANY change in a
    # group's membership re-sends the whole group -- with several flapping
    # instances of one alertname (2026-08-29: five KumaMonitorDown monitors
    # bouncing for hours) a 5s interval re-notified every few seconds and
    # buried the signal. 1m keeps the watcher responsive while collapsing a
    # flap storm into one event per minute. Nothing is hidden: groupWait stays
    # at 1s so the FIRST notification of a new alert is still immediate.
    groupInterval: 1m
    repeatInterval: 4h
    matchers: []            # all alerts
  receivers:
    - name: claude-webhook
      webhookConfigs:
        - url: http://192.168.30.111:8788/alertmanager
          sendResolved: true
