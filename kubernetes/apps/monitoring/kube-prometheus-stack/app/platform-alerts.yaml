---
# Platform alerts — certificate expiry and Flux reconciliation.
#
# These could not exist before 2026-09-06. cert-manager's and flux-operator's
# ServiceMonitors carried no `release` label while the Prometheus CR selected
# `release: kube-prometheus-stack`, so neither was ever scraped and NO
# `certmanager_*` or `flux_*` series existed at all. Alerting on them was not
# broken, it was impossible (F-0fa5b600).
#
# It cost us the same day it was found: the Flux GitRepository sat Ready=False,
# stuck three commits behind, for ~15 minutes, and nothing could page — the
# series to alert on did not exist. That is what these rules close.
#
# Every expression below was written against labels VERIFIED on the live
# series, not assumed: flux_resource_info carries kind/name/exported_namespace/
# ready/suspended across 446 resources, and
# certmanager_certificate_expiration_timestamp_seconds carries name/
# exported_namespace/issuer_name across 11 certificates. A rule written against
# a guessed label silently matches nothing and reports healthy forever.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: platform-alerts
  namespace: monitoring
  labels:
    # REQUIRED. A PrometheusRule without this label is never loaded, and
    # nothing anywhere reports that as an error — the same silent-ignore class
    # as the ServiceMonitor problem these rules exist because of.
    release: kube-prometheus-stack
spec:
  groups:
    - name: certificates.expiry
      interval: 5m
      rules:
        - alert: CertificateExpiringSoon
          expr: (certmanager_certificate_expiration_timestamp_seconds - time()) < (14 * 24 * 3600)
          for: 1h
          labels:
            severity: warning
            category: platform
            component: cert-manager
          annotations:
            summary: "Certificate {{ $labels.name }} expires in under 14 days"
            description: >-
              {{ $labels.exported_namespace }}/{{ $labels.name }} (issuer
              {{ $labels.issuer_name }}) expires in {{ $value | humanizeDuration }}.
              cert-manager normally renews at 2/3 of lifetime, so reaching 14 days
              means renewal is not happening — check the Certificate and its
              CertificateRequest, do not just wait.
        - alert: CertificateExpiringCritical
          expr: (certmanager_certificate_expiration_timestamp_seconds - time()) < (3 * 24 * 3600)
          for: 15m
          labels:
            severity: critical
            category: platform
            component: cert-manager
          annotations:
            summary: "Certificate {{ $labels.name }} expires in under 3 days"
            description: >-
              {{ $labels.exported_namespace }}/{{ $labels.name }} expires in
              {{ $value | humanizeDuration }}. Ingress for the affected host will
              start failing TLS when it lapses.
        # Absence guard. Without this, losing the cert-manager scrape target
        # returns the whole certificate estate to the invisible state it was in
        # until 2026-09-06 — and a rule that matches nothing sits `inactive`,
        # which is indistinguishable from healthy.
        - alert: CertificateMetricsAbsent
          expr: absent(certmanager_certificate_expiration_timestamp_seconds)
          for: 30m
          labels:
            severity: warning
            category: platform
            component: cert-manager
          annotations:
            summary: "cert-manager certificate metrics have disappeared"
            description: >-
              No certmanager_certificate_expiration_timestamp_seconds series are
              being scraped. Certificate expiry is currently UNMONITORED. Check the
              cert-manager ServiceMonitor is still selected by the Prometheus CR.

    - name: node.kernel-logs
      interval: 5m
      rules:
        # Talos pushes kmsg to the collector over UDP and, per the receiver
        # config, its sender "does NOT reconnect after the sink closes". So when
        # the collector is rescheduled — which happens on every node roll — a
        # node's sender can stop permanently and NOTHING says so: UDP is
        # fire-and-forget, the collector logs nothing about a peer that went
        # quiet, and the remaining nodes keep reporting so no total-absence
        # check fires either.
        #
        # That is what happened on 2026-09-06: k8s-nuc14-03 (192.168.55.13)
        # shipped kmsg for nine minutes after its 07:23:52Z boot and then
        # stopped, silently, for the rest of the day. Verified NOT a datapath
        # problem — the LB entry on node03 correctly resolved
        # 192.168.55.18:5171/UDP to the live collector pod, and there was no
        # stale conntrack. The source was simply not sending.
        #
        # This matters more than a missing metric: Talos kernel logs are the
        # documented blind spot for diagnosing why a node rebooted
        # (docs/troubleshooting/node-reboot-observability.md). Losing them on
        # the node that just rebooted is losing them exactly when needed.
        - alert: TalosKernelLogsMissingFromNode
          # Keyed on ARRIVAL per node over 3h, made possible by the kmsg-heartbeat
          # DaemonSet (edot-collector/app/kmsg-heartbeat-daemonset.yaml), which
          # writes one `cberg-kmsg-heartbeat` line into every node's kernel ring
          # buffer each hour. A live sender therefore ships >=1 line/hour no
          # matter how quiet the node's kernel is, and "nothing for 3h" can only
          # mean the sender (or the heartbeat pod on that node) is dead.
          #
          # History: the 09-06 instant form flapped for a quiet node; the
          # 24h-range form (F-02e86261) still fired on a HEALTHY node03, which
          # wrote 4 kernel lines in ~3 days with gaps up to ~16.5h (F-f5763417,
          # 2026-10-01). Widening the window further would only make a dead
          # sender take days to surface; the heartbeat removes the ambiguity.
          #
          # Per-node absent_over_time, one per node IP: the edot-collector
          # exporter sends sample timestamps, so a node's series only has
          # samples at the moments its lines arrive — "no sample in 3h" is
          # exactly "nothing arrived in 3h", and the result keeps the
          # net_peer_ip label from the matcher. A count of distinct senders
          # could not say WHICH node; this can. Adding a node means adding a
          # term here.
          expr: |
            absent_over_time(talos_kernel_kmsg_lines_total{net_peer_ip="192.168.55.11"}[3h])
            or absent_over_time(talos_kernel_kmsg_lines_total{net_peer_ip="192.168.55.12"}[3h])
            or absent_over_time(talos_kernel_kmsg_lines_total{net_peer_ip="192.168.55.13"}[3h])
          for: 15m
          labels:
            severity: warning
            category: platform
            component: talos
          annotations:
            summary: "Node {{ $labels.net_peer_ip }} has shipped no Talos kernel log line for 3h"
            description: >-
              No kmsg line (not even the hourly cberg-kmsg-heartbeat) from
              {{ $labels.net_peer_ip }} has reached the collector for 3h.
              FIRST rule out the heartbeat itself: `kubectl -n monitoring get
              pods -l app.kubernetes.io/name=kmsg-heartbeat -o wide` must show a
              Ready pod on that node (TalosKmsgHeartbeatNotRunning fires if not),
              and `talosctl -n <node> dmesg | grep cberg-kmsg-heartbeat` must
              show an entry from the last hour. If the heartbeat IS in the node's
              dmesg but not arriving, the node's UDP sender is dead.
              RECOVERY, verified on node03 2026-09-06 — two things that do NOT
              work, then the one that does. Restarting the COLLECTOR does not
              fix it: the dead sender is on the node. Re-applying the SAME
              machine config does not fix it either (measured: senders stayed
              at 2/3 for 100s) — kmsg shipping is a separate `KmsgLogConfig`
              document, so an unchanged `url:` leaves its controller with
              nothing to reconcile. What works is forcing a teardown/rebuild
              by CHANGING the url and changing it back — the config-toggle
              already documented in node-reboot-observability.md:
              `talosctl -n <node> patch mc --patch '{apiVersion: v1alpha1,
              kind: KmsgLogConfig, name: ship-kmsg-to-otel,
              url: udp://192.168.55.18:5172/}'` then patch back to 5171.
              The node's series returned within one scrape. The toggle only
              takes once the collector has stopped churning. The alert clears
              at the next heartbeat (<=1h) after recovery.
        - alert: TalosKmsgHeartbeatNotRunning
          # Watcher of the heartbeat: without it TalosKernelLogsMissingFromNode
          # falls back to depending on the node's own kernel chatter. Paired with
          # an absent() guard on the DaemonSet metric so a deleted DaemonSet
          # does not read as healthy.
          expr: |
            kube_daemonset_status_number_ready{namespace="monitoring",daemonset="kmsg-heartbeat"}
              < kube_daemonset_status_desired_number_scheduled{namespace="monitoring",daemonset="kmsg-heartbeat"}
            or absent(kube_daemonset_status_desired_number_scheduled{namespace="monitoring",daemonset="kmsg-heartbeat"})
          for: 30m
          labels:
            severity: warning
            category: platform
            component: talos
          annotations:
            summary: "kmsg-heartbeat DaemonSet is not running on every node"
            description: >-
              The kmsg-heartbeat DaemonSet (monitoring) is missing or not Ready on
              every node, so TalosKernelLogsMissingFromNode can no longer tell a
              quiet node from a dead kmsg sender and may fire for the node
              without a heartbeat pod. Check
              `kubectl -n monitoring get ds,pods -l app.kubernetes.io/name=kmsg-heartbeat`.
        - alert: TalosKernelLogsAbsent
          expr: absent(talos_kernel_kmsg_lines_total)
          for: 30m
          labels:
            severity: warning
            category: platform
            component: talos
          annotations:
            summary: "No Talos kernel logs are being received from any node"
            description: >-
              The kmsg pipeline is entirely dead, so the count-based alert above
              cannot fire either. Check the edot-collector udplog receiver on
              :5171 and the edot-collector-talos-kmsg LoadBalancer.

    - name: flux.reconciliation
      interval: 2m
      rules:
        - alert: FluxResourceNotReady
          # `suspended` is excluded deliberately: a suspended resource is not
          # failing, it is parked on purpose, and paging on it trains people to
          # ignore this alert.
          expr: flux_resource_info{ready="False", suspended="False"} == 1
          for: 15m
          labels:
            severity: warning
            category: platform
            component: flux
          annotations:
            summary: "Flux {{ $labels.kind }} {{ $labels.name }} not ready"
            description: >-
              {{ $labels.kind }} {{ $labels.exported_namespace }}/{{ $labels.name }}
              has been not-ready for over 15m (reason {{ $labels.reason }}).
              While a Kustomization or HelmRelease is stuck, its manifests are not
              being applied.
        - alert: FluxSourceStalled
          # The specific failure that went unnoticed on 2026-09-06: the
          # GitRepository could not fetch, so the whole cluster silently stopped
          # deploying while every Kustomization still reported Ready against the
          # LAST GOOD revision. Shorter `for` than the generic rule above,
          # because a stalled source blocks everything downstream.
          expr: flux_resource_info{kind="GitRepository", ready="False", suspended="False"} == 1
          for: 10m
          labels:
            severity: critical
            category: platform
            component: flux
          annotations:
            summary: "Flux source {{ $labels.name }} cannot fetch"
            description: >-
              GitRepository {{ $labels.exported_namespace }}/{{ $labels.name }} has
              been failing for over 10m. NOTHING IS DEPLOYING: downstream
              Kustomizations keep reporting Ready against the last good revision, so
              this does not surface anywhere else. On 2026-09-06 the cause was
              wedged transport state in source-controller after a node roll —
              egress from its own node was fine while the controller timed out; a
              pod restart cleared it instantly.
        - alert: FluxMetricsAbsent
          expr: absent(flux_resource_info)
          for: 30m
          labels:
            severity: warning
            category: platform
            component: flux
          annotations:
            summary: "Flux resource metrics have disappeared"
            description: >-
              No flux_resource_info series are being scraped, so Flux
              reconciliation state is UNMONITORED — the condition that let a
              stalled source go unnoticed. Check the flux-operator ServiceMonitor.
