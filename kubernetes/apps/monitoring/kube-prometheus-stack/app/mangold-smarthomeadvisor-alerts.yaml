---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/name: kube-prometheus-stack
    app.kubernetes.io/part-of: kube-prometheus-stack
    release: kube-prometheus-stack
  name: mangold-smarthomeadvisor-alerts
  namespace: monitoring
spec:
  groups:
  - interval: 30s
    name: mangold-smarthomeadvisor.rules
    rules:
    # Pod Health Alerts
    - alert: MangoldSmarthomeadvisorPodNotReady
      annotations:
        description: Mangold Smart Home Advisor pod {{ $labels.pod }} has been
          not ready for more than 5 minutes. The smart home advisory service may
          be unavailable.
        summary: Mangold Smart Home Advisor pod {{ $labels.pod }} is not ready
      expr: |
        sum by (namespace, pod) (
          kube_pod_status_ready{pod=~"mangold-smarthomeadvisor-.*", condition="false"}
        ) > 0
      for: 5m
      labels:
        app: mangold-smarthomeadvisor
        component: smarthomeadvisor
        severity: critical
    - alert: MangoldSmarthomeadvisorPodCrashLooping
      annotations:
        description: Mangold Smart Home Advisor pod {{ $labels.pod }} has restarted {{ $value
          | printf "%.0f" }} times in the last 15 minutes. Check logs for startup
          errors or dependency failures.
        summary: Mangold Smart Home Advisor pod {{ $labels.pod }} is crash looping
      expr: |
        rate(kube_pod_container_status_restarts_total{pod=~"mangold-smarthomeadvisor-.*"}[15m]) * 900 > 2
      for: 5m
      labels:
        app: mangold-smarthomeadvisor
        component: smarthomeadvisor
        severity: critical
    - alert: MangoldSmarthomeadvisorPodRestarted
      annotations:
        description: Mangold Smart Home Advisor pod {{ $labels.pod }} has restarted at least
          once in the last 15 minutes. Monitor for repeated restarts or OOMKills.
        summary: Mangold Smart Home Advisor pod {{ $labels.pod }} restarted
      expr: |
        increase(kube_pod_container_status_restarts_total{pod=~"mangold-smarthomeadvisor-.*"}[15m]) > 0
      for: 1m
      labels:
        app: mangold-smarthomeadvisor
        component: smarthomeadvisor
        severity: warning

    # Resource Utilization Alerts (optional — uncomment when metrics are available)
    # - alert: MangoldSmarthomeadvisorHighMemoryUsage
    #   annotations:
    #     description: Mangold Smart Home Advisor pod {{ $labels.pod }} is using {{ $value | humanizePercentage }}
    #       of its memory limit. Consider increasing memory request/limit or optimizing
    #       database queries.
    #     summary: Mangold Smart Home Advisor pod {{ $labels.pod }} high memory usage
    #   expr: |
    #     (sum(container_memory_usage_bytes{pod=~"mangold-smarthomeadvisor-.*"}) by (pod) /
    #      sum(container_spec_memory_limit_bytes{pod=~"mangold-smarthomeadvisor-.*"}) by (pod)) > 0.85
    #   for: 5m
    #   labels:
    #     app: mangold-smarthomeadvisor
    #     component: smarthomeadvisor
    #     severity: warning

    # - alert: MangoldSmarthomeadvisorHighCPUUsage
    #   annotations:
    #     description: Mangold Smart Home Advisor pod {{ $labels.pod }} is using {{ $value | humanizePercentage }}
    #       of its CPU limit. Monitor for performance degradation or increase CPU requests.
    #     summary: Mangold Smart Home Advisor pod {{ $labels.pod }} high CPU usage
    #   expr: |
    #     (sum(rate(container_cpu_usage_seconds_total{pod=~"mangold-smarthomeadvisor-.*"}[5m])) by (pod) /
    #      sum(container_spec_cpu_quota{pod=~"mangold-smarthomeadvisor-.*"}) by (pod)) > 0.8
    #   for: 10m
    #   labels:
    #     app: mangold-smarthomeadvisor
    #     component: smarthomeadvisor
    #     severity: warning

