---
# iCloud photo-backup freshness + sync health. Added 2026-09-20 for finding F-21d7e2ec.
#
# WHY THESE RULES EXIST
# ---------------------
# On 2026-09-06 both icloud-docker deployments wedged and the failure went
# unnoticed for 14 days. Nothing in the cluster referenced icloud at all: no
# liveness/readiness probes (disabled in both HelmReleases), no ServiceMonitor,
# no alert rule. The pods stayed Running 1/1 with 0 restarts because the
# process was alive and merely blocked, so every pod-level signal read healthy.
#
# These rules watch the OUTPUT instead of the process — the mtime of the newest
# file actually landing under <account>/photos on the NAS. That is the only
# signal that still works when the application itself is stuck.
#
# 2026-09-28 REVISION (false-positive root-cause fix): the file-mtime rule
# turned out to measure the user's photo-taking, not the backup — icloud-docker
# stamps files with the CAPTURE date. It is now a 14-day backstop, and the
# primary detector is the icloud-backup.sync group at the bottom of this file,
# which watches the sync cycle itself (still from OUTSIDE the process, so the
# silent-wedge case stays covered: a wedged process logs no `Photos synced`).
#
# Gauges come from CronJob/icloud-backup-freshness (namespace backup, hourly)
# via prometheus-pushgateway. The probe exports a TIMESTAMP, never a
# pre-computed age: pushgateway has no TTL and serves its last value forever,
# so an age gauge would freeze the instant the probe died and silently disarm
# ICloudBackupPhotosStale — the same class of blindness being fixed here.
#
# `max by (account)` and NOT a bare `max()`: a bare max would collapse both
# accounts into one series, so a single wedged account would be completely
# hidden behind the other one still syncing. The two Apple IDs fail
# independently (separate deployments, separate sessions, separate 2FA quota),
# and in the 2026-09-06 incident they wedged three days apart.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/name: kube-prometheus-stack
    app.kubernetes.io/part-of: kube-prometheus-stack
    release: kube-prometheus-stack
  name: icloud-backup-alerts
  namespace: monitoring
spec:
  groups:
    - interval: 1m
      name: icloud-backup.freshness
      rules:
        # DEMOTED 2026-09-28 from the primary detector to a 14-day BACKSTOP.
        #
        # This rule used to fire at 24h (warning) / 72h (critical, as
        # ICloudBackupPhotosStaleCritical, now removed). That was a FALSE
        # POSITIVE by construction: icloud-docker stamps each file with the
        # photo's CAPTURE date, so this gauge measures "when did the user last
        # take a photo", not "when did the backup last work". On 2026-09-28 it
        # paged for account mu at 2d 0h while the pod logged `Photos synced`
        # every 20-40 min — the operator had simply taken no photos since 09-26.
        # Raising the threshold would only have moved the false positive; the
        # fix is a detector that watches the SYNC: see the icloud-backup.sync
        # group below (ICloudBackupSyncStalled / AuthRequired /
        # PersistentDownloadFailures, fed by CronJob/icloud-sync-probe).
        #
        # Why keep it at all: it is the only signal that looks at the NAS
        # rather than at the app's own claims. If icloud-docker ever logged
        # `Photos synced` while writing nothing (wrong destination, broken
        # mount, a silent filter change), only this rule would notice. 14 days
        # sits above any plausible quiet spell and at the 13-16 day scale of
        # the real 2026-09-06 outage, which the sync group now catches in 6h.
        - alert: ICloudBackupPhotosStale
          annotations:
            summary: No new iCloud photo file for account {{ $labels.account }} in {{ $value | humanizeDuration }} (14-day backstop)
            description: |
              No new file has landed under {{ $labels.account }}/photos on the
              backup share for {{ $value | humanizeDuration }}. This is the
              BACKSTOP, not the primary detector: file mtimes are the photo
              CAPTURE dates, so this also fires if nobody took a photo for two
              weeks.

              Check the primary signal first. If ICloudBackupSyncStalled /
              ICloudBackupAuthRequired are NOT firing for this account, the app
              believes it is syncing — then either the user genuinely took no
              photos (compare with the phone), or icloud-docker is logging
              `Photos synced` while writing nothing to the share, which is the
              case this backstop exists for: check the destination path and the
              data PVC mount of icloud-docker-{{ $labels.account }}.

              If the sync IS broken, recover via docs/sops/icloud-docker-reauth.md
              (stop the retry loop FIRST — scale to 0 + suspend Flux — or
              Apple's 2FA quota is burned). Background: F-21d7e2ec.
          expr: |
            time() - max by (account) (icloud_backup_newest_file_timestamp_seconds) > 60 * 60 * 24 * 14
          for: 1h
          labels:
            category: backup
            component: icloud-docker
            severity: warning
        # INERTNESS GUARDS. An expr matching no series sits at state=inactive
        # and is indistinguishable from healthy, so the staleness rules above
        # need an absence companion — exactly as nas-share-alerts.yaml pairs
        # NasMediaShareFillingUp with NasMediaShareMetricsMissing.
        #
        # Deliberately ONE GUARD PER ACCOUNT rather than a single bare
        # absent(icloud_backup_newest_file_timestamp_seconds): the bare form
        # only fires when BOTH series vanish, so losing just one account's
        # gauge would silently un-monitor that account while the rule set still
        # looked armed. The account set is fixed and known (two Apple IDs, one
        # deployment each), so per-account absence is precise and cheap.
        # absent() propagates the equality matcher into its output labels, so
        # these fire with account="mu" / account="andrea" attached.
        #
        # DO NOT "improve" these by gating them on the scrape target being up as
        #   absent(<metric>) and up{job="prometheus-pushgateway"} == 1
        # That form is PERMANENTLY INERT: absent() emits a sample with an EMPTY
        # label set, so `and` against a vector carrying job/instance labels
        # matches nothing even when the metric genuinely is missing. If a gate
        # is ever genuinely wanted it MUST be `and on() up{...} == 1`. Same
        # trap, same wording, as AuthentikAuditFreshnessProbeMissing.
        - alert: ICloudBackupFreshnessMetricMissing
          annotations:
            summary: iCloud backup freshness gauge for account mu is not present in Prometheus
            description: |
              icloud_backup_newest_file_timestamp_seconds{account="mu"} has no
              series at all. the 14-day ICloudBackupPhotosStale
              backstop is BLIND for this account while
              this fires and must not be read as evidence the backup is healthy.
              Most likely the icloud-backup-freshness CronJob in namespace
              backup was removed or has never run successfully, or
              prometheus-pushgateway lost its in-memory state and no probe cycle
              has re-pushed yet (it re-pushes hourly, so that self-heals inside
              the 3h `for`).
          expr: absent(icloud_backup_newest_file_timestamp_seconds{account="mu"})
          for: 3h
          labels:
            category: backup
            component: icloud-docker
            severity: warning
        - alert: ICloudBackupFreshnessMetricMissingAndrea
          annotations:
            summary: iCloud backup freshness gauge for account andrea is not present in Prometheus
            description: |
              icloud_backup_newest_file_timestamp_seconds{account="andrea"} has
              no series at all. the 14-day ICloudBackupPhotosStale
              backstop is BLIND for this account while
              this fires and must not be read as evidence the backup is healthy.
              See ICloudBackupFreshnessMetricMissing for triage — same probe,
              same causes.
          expr: absent(icloud_backup_newest_file_timestamp_seconds{account="andrea"})
          for: 3h
          labels:
            category: backup
            component: icloud-docker
            severity: warning
        - alert: ICloudBackupFreshnessProbeStale
          annotations:
            summary: iCloud backup freshness probe has not completed a successful run recently
            description: |
              icloud-backup-freshness last succeeded {{ $value | humanizeDuration }}
              ago (it runs hourly; threshold 6h = 6 missed cycles). The probe
              pushes nothing on failure by design, so the freshness gauges are
              now stale snapshots. The staleness alerts still age CORRECTLY
              because they read a timestamp rather than a pre-computed age — but
              they are reporting the last known good scan, not the current state
              of the share. Check the latest Job under CronJob/icloud-backup-freshness
              in namespace backup; a broken or hung CIFS mount is the expected
              cause and is itself worth investigating.
          expr: |
            time() - max(icloud_backup_probe_last_success_timestamp_seconds) > 60 * 60 * 6
          for: 30m
          labels:
            category: backup
            component: icloud-docker
            severity: warning
        # METRIC CHOICE IS DELIBERATE — verified against live kube-state-metrics
        # on 2026-09-20, because this is exactly where an inert rule hides.
        #
        # `kube_job_failed` is a CONDITION metric: KSM emits it only while a Job
        # actually carries a Failed condition. Measured now: kube_job_complete
        # has 162 series (54 Jobs x condition=true/false/unknown) while
        # kube_job_failed has ZERO, because no Job is currently failed. That
        # zero is CORRECT, not a typo — do not "fix" it by swapping the name.
        #
        # The consequence is honest and worth stating: this rule CANNOT be
        # proven armed by querying it at rest, the way the repo's doctrine
        # otherwise demands. That is accepted here because it is not the
        # load-bearing detector — ICloudBackupFreshnessProbeStale below reads an
        # always-present timestamp gauge and catches every probe failure mode
        # including this one, a few hours later. This rule only sharpens the
        # signal from "the gauge stopped refreshing" to "here is the failed Job".
        #
        # `kube_job_status_failed` was considered and REJECTED even though it is
        # always present (54 series) and would therefore be verifiable: it
        # counts failed PODS, not failed Jobs, and stays > 0 for the retained
        # life of the Job object. With backoffLimit: 2 a single transient pod
        # failure that the Job then RECOVERED from would latch this alert on for
        # a full day. An always-armed rule that cries wolf is not an upgrade
        # over a quiet rule that is right.
        #
        # condition="true" is explicit so the expression cannot accidentally sum
        # the condition=false/unknown series into a false positive.
        - alert: ICloudBackupFreshnessProbeJobFailed
          annotations:
            summary: iCloud backup freshness probe Job failed
            description: |
              The most recent icloud-backup-freshness Job failed
              ({{ $labels.job_name }}). The probe deliberately exits non-zero
              and pushes nothing rather than pushing a partial result, so a
              failure here means the freshness signal is going stale — check
              `kubectl -n backup logs job/{{ $labels.job_name }}`. A Job killed
              by activeDeadlineSeconds means the probe itself hung on the CIFS
              mount, which is a storage problem, not an iCloud problem.
          expr: |
            sum(kube_job_failed{namespace="backup", job_name=~"icloud-backup-freshness-.*", condition="true"}) > 0
          for: 5m
          labels:
            category: backup
            component: icloud-docker
            severity: warning
    # ------------------------------------------------------------------------
    # SYNC HEALTH (primary detector since 2026-09-28).
    #
    # Gauges come from CronJob/icloud-sync-probe (namespace backup, every
    # 10 min), which reads the icloud-docker-<account> pod logs through the
    # Kubernetes API (Role: pods get/list, pods/log get — nothing else) and
    # pushes to pushgateway group job=icloud-sync-probe/account=<account>.
    #
    # WHY LOGS, AND WHY THE API RATHER THAN ELASTICSEARCH: icloud-docker has no
    # metrics endpoint, no health endpoint and no post-sync hook, so its own
    # `Photos synced` line is the only first-hand statement that a cycle
    # finished. The API read has one dependency (the apiserver); the ES path
    # would add the ingestion pipeline, which has stalled for hours before
    # (TSDB rollover, 2026-07-17 translog corruption) — a detector must not be
    # blinded by an unrelated pipeline.
    #
    # WHAT EACH REAL FAILURE LOOKS LIKE HERE
    #   wedged process (F-21d7e2ec) -> no new `Photos synced`; last_success ages
    #   session expired / 2FA        -> icloud_auth_required 1 (+ stall)
    #   pod scaled to 0 / deleted    -> ICloudBackupDeploymentUnavailable
    #                                   (+ stall: the probe pushes no success)
    #   crash loop                   -> DeploymentUnavailable + KubePodCrashLooping
    #                                   (+ stall if no cycle ever completes)
    #   same items failing for 24h+  -> ICloudBackupPersistentDownloadFailures
    #
    # THE PROBE NEVER INVENTS A SUCCESS. When it finds no `Photos synced` it
    # omits the gauge and pushgateway (POST semantics, per-account group) keeps
    # serving the previous timestamp, which keeps ageing. If pushgateway also
    # lost its state, the series is ABSENT, which ICloudBackupSyncMetricMissing
    # catches — absent never reads as healthy.
    #
    # NOTE `Photos synced` is logged even when every download in the cycle
    # failed (it closes the cycle, it does not grade it). That is why download
    # failures are a SEPARATE signal and not folded into "success".
    - interval: 1m
      name: icloud-backup.sync
      rules:
        # 6h = ~10 missed photo cycles at the configured 500s interval plus the
        # observed 20-40 min cycle length; no healthy instance has ever gone
        # 6h without a `Photos synced`. Critical at 24h.
        - alert: ICloudBackupSyncStalled
          annotations:
            summary: iCloud photo sync for account {{ $labels.account }} has not completed a cycle in {{ $value | humanizeDuration }}
            description: |
              icloud-docker-{{ $labels.account }} last logged `Photos synced`
              {{ $value | humanizeDuration }} ago; a healthy instance does so
              every 20-40 min. This is independent of whether new photos exist.

              Triage in this order:
                1. Is the pod there? `kubectl -n backup get pods -l
                   app.kubernetes.io/name=icloud-docker-{{ $labels.account }}`
                   (scaled to 0 / Pending / CrashLoopBackOff).
                2. Is it an auth loop? ICloudBackupAuthRequired would fire too;
                   logs show `2FA is required` / `(421)`.
                3. Otherwise it is the SILENT WEDGE of F-21d7e2ec: Running 1/1,
                   0 restarts, no new log lines. A `kubectl -n backup rollout
                   restart deploy/icloud-docker-{{ $labels.account }}` recovers
                   it if the session is still valid.
              Re-auth, if needed: docs/sops/icloud-docker-reauth.md — STOP the
              retry loop first (scale to 0 + suspend Flux) or Apple's 2FA quota
              is burned. Probe: CronJob/icloud-sync-probe in namespace backup.
          expr: |
            time() - max by (account) (icloud_sync_last_success_timestamp_seconds) > 60 * 60 * 6
          for: 15m
          labels:
            category: backup
            component: icloud-docker
            severity: warning
        - alert: ICloudBackupSyncStalledCritical
          annotations:
            summary: iCloud photo sync for account {{ $labels.account }} has been broken for over 24h ({{ $value | humanizeDuration }})
            description: |
              icloud-docker-{{ $labels.account }} has not logged `Photos synced`
              for over 24h (a healthy instance does every 20-40 min). Photos
              taken since then exist only in iCloud. Triage and recovery are in
              ICloudBackupSyncStalled's description (pod state -> auth loop ->
              silent wedge) and docs/sops/icloud-docker-reauth.md.
          expr: |
            time() - max by (account) (icloud_sync_last_success_timestamp_seconds) > 60 * 60 * 24
          for: 15m
          labels:
            category: backup
            component: icloud-docker
            severity: critical
        # "Immediate": the probe runs every 10 min and flips this only when an
        # auth error is NEWER than the newest success, so a transient 421 in a
        # cycle that still completed never sets it. `for: 10m` = one more probe
        # run confirming it, which is still well under one sync interval.
        - alert: ICloudBackupAuthRequired
          annotations:
            summary: iCloud session for account {{ $labels.account }} needs re-authentication (2FA)
            description: |
              icloud-docker-{{ $labels.account }} logged an auth/session error
              (`2FA is required`, `Authentication required for Account (421)`,
              `INCORRECT_PCS_KEY` or `Password is not stored in keyring`) and
              has not completed a sync since. Apple sessions expire every
              ~30-60 days; re-auth is interactive and cannot be automated.

              Follow docs/sops/icloud-docker-reauth.md end to end:
                * Step 1 FIRST — scale icloud-docker-{{ $labels.account }} to 0
                  and suspend its Flux Kustomization. The container retries
                  login every 10 min and each retry spends Apple's per-Apple-ID
                  2FA quota; once exhausted, NO device receives a code.
                * Step 4b — after `requires_2fa = False`, PROVE data access
                  before resuming. A 421 on `validate` right after a good
                  re-auth means pending iCloud terms (`termsUpdateNeeded`), not
                  a bug: the account owner must accept them at icloud.com.
              Do not wait for the app's own Telegram 2FA message: it is
              rate-limited to once per 24h.
          expr: |
            max by (account) (icloud_auth_required) == 1
          for: 10m
          labels:
            category: backup
            component: icloud-docker
            severity: warning
        # Item-level, not account-level: the oldest start of an unbroken run of
        # failed cycles among items that are STILL failing. A different item
        # failing each cycle does not accumulate. Info, because the rest of the
        # library is backing up; it is a to-do, not an outage. Coverage is
        # bounded by the logs the probe can see (current + previous container,
        # 48h), so after a restart the run restarts too — it can only fire LATE,
        # never early.
        - alert: ICloudBackupPersistentDownloadFailures
          annotations:
            summary: "{{ $labels.account }}: an iCloud photo has failed to download on every cycle for {{ $value | humanizeDuration }}"
            description: |
              At least one item in icloud-docker-{{ $labels.account }} has
              failed to download in every completed photo cycle for
              {{ $value | humanizeDuration }}. The rest of the library is still
              syncing (otherwise ICloudBackupSyncStalled would fire).
              Find it: `kubectl -n backup logs deploy/icloud-docker-{{ $labels.account }}
              | grep 'Failed to download'`. A repeating `Service Unavailable (503)`
              on one asset is Apple refusing that asset (often an item still
              processing or damaged in iCloud); check it in the Photos app.
              Nothing to fix in the cluster unless many items fail.
          expr: |
            (time() - max by (account) (icloud_sync_failing_item_since_timestamp_seconds) > 60 * 60 * 24)
              and on (account) max by (account) (icloud_sync_items_failed) > 0
          for: 30m
          labels:
            category: backup
            component: icloud-docker
            severity: info
        # KSM-based, independent of the probe: scaled to 0, deleted pod, or a
        # container in CrashLoopBackOff (no probes are configured, so Ready ==
        # running). Fires during an intentional re-auth too — silence it for
        # the duration of the SOP instead of weakening it.
        - alert: ICloudBackupDeploymentUnavailable
          annotations:
            summary: icloud-docker-{{ $labels.account }} has no available replica
            description: |
              Deployment icloud-docker-{{ $labels.account }} in namespace backup
              has had 0 available replicas for 30m (scaled to 0, Pending, or
              crash-looping). No photos are being backed up for this Apple ID.
              If this is a deliberate re-auth per
              docs/sops/icloud-docker-reauth.md, silence it until Step 5.
          expr: |
            label_replace(
              max by (deployment) (kube_deployment_status_replicas_available{namespace="backup", deployment=~"icloud-docker-(mu|andrea)"}),
              "account", "$1", "deployment", "icloud-docker-(.*)"
            ) < 1
          for: 30m
          labels:
            category: backup
            component: icloud-docker
            severity: warning
        # INERTNESS GUARDS — one per account, same reasoning as the freshness
        # group above (a bare absent() only fires when BOTH accounts vanish).
        # Do NOT gate these with `and up{...}` (permanently inert, see above).
        - alert: ICloudBackupSyncMetricMissing
          annotations:
            summary: iCloud sync-health gauge for account mu is not present in Prometheus
            description: |
              icloud_sync_last_success_timestamp_seconds has no series for this
              account. ICloudBackupSyncStalled is BLIND for it. Either
              CronJob/icloud-sync-probe (namespace backup) has not run
              successfully, or pushgateway lost its in-memory state AND the
              probe has found no `Photos synced` line since — which, if the probe
              itself is healthy, means the sync really is not completing. Check
              the latest icloud-sync-probe Job log and the icloud-docker pod.
          expr: absent(icloud_sync_last_success_timestamp_seconds{account="mu"})
          for: 1h
          labels:
            category: backup
            component: icloud-docker
            severity: warning
        - alert: ICloudBackupSyncMetricMissingAndrea
          annotations:
            summary: iCloud sync-health gauge for account andrea is not present in Prometheus
            description: |
              icloud_sync_last_success_timestamp_seconds has no series for
              account andrea; ICloudBackupSyncStalled is BLIND for it. See
              ICloudBackupSyncMetricMissing for triage — same probe, same causes.
          expr: absent(icloud_sync_last_success_timestamp_seconds{account="andrea"})
          for: 1h
          labels:
            category: backup
            component: icloud-docker
            severity: warning
        # Per account: the probe pushes this for every account it OBSERVED,
        # even when it found no success, so a stale value means the probe
        # itself stopped (and the other sync gauges are frozen snapshots —
        # the stall rule still ages correctly off its timestamp).
        - alert: ICloudBackupSyncProbeStale
          annotations:
            summary: iCloud sync probe has not observed account {{ $labels.account }} for {{ $value | humanizeDuration }}
            description: |
              CronJob/icloud-sync-probe (namespace backup, every 10 min) last
              completed for this account {{ $value | humanizeDuration }} ago.
              ICloudBackupAuthRequired and PersistentDownloadFailures are
              reading a frozen snapshot. Check the latest Job's log
              (`kubectl -n backup logs job/<latest icloud-sync-probe job>`):
              an RBAC 403, apiserver timeout or pushgateway error is printed
              per account.
          expr: |
            time() - max by (account) (icloud_sync_probe_last_success_timestamp_seconds) > 60 * 60
          for: 15m
          labels:
            category: backup
            component: icloud-docker
            severity: warning
        - alert: ICloudBackupSyncProbeJobFailed
          annotations:
            summary: iCloud sync probe Job failed
            description: |
              The icloud-sync-probe Job {{ $labels.job_name }} failed. The probe
              exits non-zero after handling both accounts if either one hit an
              API or push error — see `kubectl -n backup logs job/{{ $labels.job_name }}`.
              Same metric choice and caveats as ICloudBackupFreshnessProbeJobFailed.
          expr: |
            sum by (job_name) (kube_job_failed{namespace="backup", job_name=~"icloud-sync-probe-.*", condition="true"}) > 0
          for: 5m
          labels:
            category: backup
            component: icloud-docker
            severity: warning
    # ------------------------------------------------------------------------
    # iCLOUD DRIVE SYNC HEALTH (added 2026-10-03).
    #
    # Same probe (CronJob/icloud-sync-probe), same pushgateway group, same
    # never-invent-a-success contract as the photo group above, keyed on the
    # app's `Drive synced` line. Until this group existed nothing covered
    # Drive: on 2026-10-03 account mu had 10 Drive items failing on EVERY
    # cycle for days (Apple package types icloud-docker cannot unpack, plus one
    # item answering `Unknown reason`) while `Drive synced` kept being logged.
    #
    # THRESHOLDS ARE SIZED FROM THE OBSERVED CADENCE, NOT THE CONFIG. Both
    # accounts set drive sync_interval 3600, but icloud-docker runs drive and
    # photos in ONE serial loop and the drive countdown only advances while the
    # loop sleeps between photo cycles. Measured 2026-09-27..10-03: `Drive
    # synced` every 4.8-8.1h (mu), ~4.8-5h (andrea); a single mu drive cycle
    # can itself take ~2h. A 3h threshold ("3 missed hourly cycles") would
    # therefore fire permanently. 12h = 1.5x the longest observed healthy gap;
    # critical at 24h.
    #
    # NO FILE NAMES ANYWHERE (labels, annotations): Drive holds personal
    # documents and this repo is public. The probe pushes counts only; the SOP
    # (docs/sops/icloud-docker-reauth.md section 9) shows how to list the items.
    - interval: 1m
      name: icloud-backup.drive
      rules:
        - alert: ICloudDriveSyncStalled
          annotations:
            summary: iCloud Drive sync for account {{ $labels.account }} has not completed a cycle in {{ $value | humanizeDuration }}
            description: |
              icloud-docker-{{ $labels.account }} last logged `Drive synced`
              {{ $value | humanizeDuration }} ago; a healthy instance does so
              every ~5-8h (the configured 3600s interval only counts loop sleep
              time). Check the photo alerts first: the two share one process,
              so ICloudBackupSyncStalled / ICloudBackupAuthRequired /
              ICloudBackupDeploymentUnavailable firing for the same account
              explain this one. If photos are healthy and only Drive stalls,
              the drive phase itself is hanging (a long batch or a blocked
              download): read the pod log from the last `Syncing drive...`.
              Triage + recovery: docs/sops/icloud-docker-reauth.md section 9.
          expr: |
            time() - max by (account) (icloud_drive_sync_last_success_timestamp_seconds) > 60 * 60 * 12
          for: 15m
          labels:
            category: backup
            component: icloud-docker
            severity: warning
        - alert: ICloudDriveSyncStalledCritical
          annotations:
            summary: iCloud Drive sync for account {{ $labels.account }} has been broken for over 24h ({{ $value | humanizeDuration }})
            description: |
              icloud-docker-{{ $labels.account }} has not logged `Drive synced`
              for over 24h (healthy: every ~5-8h). Drive changes since then
              exist only in iCloud. Triage is in ICloudDriveSyncStalled's
              description and docs/sops/icloud-docker-reauth.md section 9.
          expr: |
            time() - max by (account) (icloud_drive_sync_last_success_timestamp_seconds) > 60 * 60 * 24
          for: 15m
          labels:
            category: backup
            component: icloud-docker
            severity: critical
        # Item-level, same semantics as ICloudBackupPersistentDownloadFailures:
        # the oldest start of an unbroken run of failed cycles among items still
        # failing; a different item failing each cycle does not accumulate.
        # Bounded by the 48h log window, so it can only fire late, never early.
        - alert: ICloudDrivePersistentDownloadFailures
          annotations:
            summary: "{{ $labels.account }}: iCloud Drive items have failed to download on every cycle for {{ $value | humanizeDuration }}"
            description: |
              At least one iCloud Drive item of icloud-docker-{{ $labels.account }}
              has failed in every completed drive cycle for
              {{ $value | humanizeDuration }}; the rest of Drive is still syncing
              (otherwise ICloudDriveSyncStalled would fire). Count per cycle:
              icloud_drive_items_failed. Known cause classes: Apple package
              formats (Numbers/Pages/Keynote/GarageBand) that icloud-docker
              cannot unpack (`Unhandled file type - cannot unpack the package
              application/octet-stream`) and items Apple answers with
              `Unknown reason`. List them with the kubectl logs grep in
              docs/sops/icloud-docker-reauth.md section 9 (do not paste file
              names into findings, commits or alerts).
          expr: |
            (time() - max by (account) (icloud_drive_failing_item_since_timestamp_seconds) > 60 * 60 * 24)
              and on (account) max by (account) (icloud_drive_items_failed) > 0
          for: 30m
          labels:
            category: backup
            component: icloud-docker
            severity: info
        # INERTNESS GUARDS, one per account WITH DRIVE ENABLED. Both accounts'
        # configs carry a `drive:` section (sync_interval 3600) as of
        # 2026-10-03. If Drive is ever disabled for an account, remove that
        # account's guard in the same commit -- it would otherwise fire
        # forever. Do NOT gate with `and up{...}` (permanently inert, see the
        # freshness group).
        - alert: ICloudDriveSyncMetricMissing
          annotations:
            summary: iCloud Drive sync gauge for account mu is not present in Prometheus
            description: |
              icloud_drive_sync_last_success_timestamp_seconds has no series for
              account mu; ICloudDriveSyncStalled is BLIND for it. Either
              CronJob/icloud-sync-probe (namespace backup) has not run
              successfully, or pushgateway lost its state AND the probe has
              found no `Drive synced` line in the last 48h of logs -- which, if
              the probe itself is healthy, means Drive really is not
              completing. Check the latest icloud-sync-probe Job log.
          expr: absent(icloud_drive_sync_last_success_timestamp_seconds{account="mu"})
          for: 1h
          labels:
            category: backup
            component: icloud-docker
            severity: warning
        - alert: ICloudDriveSyncMetricMissingAndrea
          annotations:
            summary: iCloud Drive sync gauge for account andrea is not present in Prometheus
            description: |
              icloud_drive_sync_last_success_timestamp_seconds has no series for
              account andrea; ICloudDriveSyncStalled is BLIND for it. See
              ICloudDriveSyncMetricMissing for triage -- same probe, same causes.
          expr: absent(icloud_drive_sync_last_success_timestamp_seconds{account="andrea"})
          for: 1h
          labels:
            category: backup
            component: icloud-docker
            severity: warning
