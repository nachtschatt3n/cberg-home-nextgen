---
# Container memory-ceiling alerts — added 2026-08-24.
#
# The cluster had NO memory-ceiling alerting of any kind. frigate leaked from
# 5.8 GiB to 7.95 GiB of an 8 GiB limit over six days and nobody knew until the
# daily sweep happened to notice it at 98.6%; a redeploy then reset the counter
# and the finding looked stale rather than urgent. Building the rule immediately
# surfaced three more containers already above 85% that nothing was watching.
#
# Why "approaching the limit" needs its own alert rather than relying on OOMKill:
# a container at its cgroup limit does NOT necessarily get OOMKilled. The kernel
# fails the allocation first, so a leaking multi-process app (frigate spawns one
# process per camera) sees child allocations return ENOMEM and degrades — cameras
# stop recording, detectors stall — while the pod stays Ready with restart-count 0.
# Waiting for a kill means waiting for a signal that may never arrive.
#
# THE LIMIT COMES FROM kube-state-metrics, NOT cAdvisor. The obvious choice,
# container_spec_memory_limit_bytes, is not exposed on this cluster: a rule built
# on it returns no data and therefore never fires for anything, which looks
# identical to "nothing is near its limit". In kube_pod_container_resource_limits
# the resource is a LABEL, which is why searching metric names for "memory.*limit"
# does not turn it up. Every rule below was checked to return series before being
# trusted.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/name: kube-prometheus-stack
    app.kubernetes.io/part-of: kube-prometheus-stack
    release: kube-prometheus-stack  # required — Prometheus ruleSelector matchLabels
  name: container-memory-alerts
  namespace: monitoring
spec:
  groups:
    - name: container.memory.rules
      interval: 60s
      rules:
        - alert: ContainerMemoryNearLimit
          # The join itself excludes containers with no limit set, where a ratio
          # would be meaningless — no limit series, no result.
          expr: |
            (
              container_memory_working_set_bytes{container!="",container!="POD"}
              / on(namespace,pod,container) group_left
              kube_pod_container_resource_limits{resource="memory"}
            ) > 0.90
          for: 15m
          labels:
            severity: warning
            category: capacity
            component: container
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.container }} at {{ $value | humanizePercentage }} of its memory limit"
            description: >-
              Container {{ $labels.container }} in pod {{ $labels.pod }} has held above 90% of its
              memory limit for 15 minutes. It may never be OOMKilled — the kernel fails child
              allocations with ENOMEM first, so a multi-process app degrades silently while the pod
              stays Ready. Check whether this is a leak (rising floor across restarts) or a limit
              that is simply too small for current load.

        - alert: ContainerMemoryLimitImminent
          expr: |
            (
              container_memory_working_set_bytes{container!="",container!="POD"}
              / on(namespace,pod,container) group_left
              kube_pod_container_resource_limits{resource="memory"}
            ) > 0.97
          for: 5m
          labels:
            severity: critical
            category: capacity
            component: container
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.container }} is out of memory headroom ({{ $value | humanizePercentage }})"
            description: >-
              Container {{ $labels.container }} in pod {{ $labels.pod }} is within 3% of its memory
              limit. Allocations are likely already failing. Restart it to reclaim, then fix the
              underlying leak or raise the limit.

        - alert: ContainerMemoryLeakPredicted
          # The early-warning rule, and the one that would have caught frigate.
          # Projects 6h of growth 48h forward, so a steady leak surfaces days
          # before the ceiling. Thresholding the PREDICTION is what makes it fire
          # early; the >0.50 guard on the current value keeps containers that sit
          # high and flat from alerting forever.
          #
          # RSS, NOT working_set, and this is the one rule where that is right.
          # A leak is ANONYMOUS memory that cannot be reclaimed; page cache
          # growth is a workload reading files and says nothing about a leak.
          # On working_set this rule fired four times in one evening for
          # open-webui, immich (twice) and the unifi controller — every one of
          # them cache from heavy I/O, none of them leaking. Checked against the
          # real leak before switching: frigate still trips it about 1.4 days
          # from now, ~2.8 days before its ceiling, so this sharpens the
          # detector rather than blinding it.
          #
          # The two THRESHOLD rules above deliberately stay on working_set:
          # there, unreclaimable tmpfs pages must count, and that is exactly what
          # caught falco's 501 MiB in-RAM log file.
          #
          # The growth requirement is what separates this from
          # ContainerMemoryNearLimit. Predicting a FLAT series returns roughly
          # its current value, so a container simply pinned near its limit —
          # penpot-frontend sits at 98.5% and has moved 0.1 MiB in five days —
          # satisfied "projected above 90%" without leaking at all, and fired
          # both alerts for one condition. Requiring the projection to exceed
          # today's usage by a tenth of the limit makes this a leak detector
          # rather than a second copy of the threshold alert.
          #
          # The container-age guard is load-bearing. A memory-hungry app ramping
          # up after a restart grows steeply for its first few hours -- frigate
          # projected 138% of its limit while merely loading models -- so without
          # it this rule pages after every single restart of elasticsearch,
          # frigate or any other large process.
          #
          # The guard and the prediction window must MATCH, and both are 24h.
          # They used to be 6h, on the reasoning that "six hours matches the
          # prediction window, so the projection is never built purely from
          # ramp-up" -- which is wrong. At container age 6h the [6h] window is
          # ENTIRELY the container's first six hours. The guard only stops the
          # window from predating the container; it does nothing to keep ramp-up
          # out of it. office/sure-worker proved it: the alert went active at
          # 02:57:43Z on a container started 20:57:03Z -- 6h00m40s, the exact
          # instant the guard opened -- projecting 114% of limit off Sidekiq's
          # post-boot glibc-arena ratchet, against an observed 7-day asymptote
          # of 68% that has never OOMKilled.
          #
          # Widening the window alone would NOT have fixed that: predict_linear
          # uses whatever samples exist in the range, so a 7h-old container fed
          # a [24h] window still extrapolates the same steep 7h slope. The guard
          # has to move with the window.
          #
          # Checked against the real leak before changing, so this sharpens the
          # detector rather than blinding it. Frigate leaks ~437 MiB/day at a
          # near-constant slope; over [24h] on 08-24 it projects 7623 MiB = 93%
          # of its 8 Gi limit and still fires. The old [6h] window sampled at
          # that same moment projected only 83% and would have MISSED it -- a
          # short window on a noisy series catches a slow leak or not depending
          # on which six hours it happens to land in. Frigate's growth-margin
          # term lands at 10.7% against the >0.10 floor, so that floor is now
          # the tight constraint for a slow leak; revisit it before the window.
          #
          # Cost: a 24h blind spot for this rule after every restart. The two
          # threshold rules above cover that window.
          expr: |
            (
              predict_linear(
                container_memory_rss{container!="",container!="POD"}[24h],
                48 * 3600
              )
              / on(namespace,pod,container) group_left
              kube_pod_container_resource_limits{resource="memory"}
            ) > 0.90
            and
            (
              container_memory_rss{container!="",container!="POD"}
              / on(namespace,pod,container) group_left
              kube_pod_container_resource_limits{resource="memory"}
            ) > 0.50
            and
            (
              (time() - container_start_time_seconds{container!="",container!="POD"}) > 24 * 3600
            )
            and
            (
              predict_linear(
                container_memory_rss{container!="",container!="POD"}[24h],
                48 * 3600
              )
              - container_memory_rss{container!="",container!="POD"}
            )
            / on(namespace,pod,container) group_left
            kube_pod_container_resource_limits{resource="memory"} > 0.10
          for: 1h
          labels:
            severity: warning
            category: capacity
            component: container
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.container }} is trending into its memory limit within 48h"
            description: >-
              Projecting the last 24 hours of growth forward, container {{ $labels.container }} in
              pod {{ $labels.pod }} reaches over 90% of its memory limit within 48 hours. This is
              the shape of a leak rather than a load spike. Plan a limit change or a fix in a
              maintenance window — do not wait for it to reach the ceiling, where allocations fail
              silently instead of producing a clean OOMKill.

        # ---- Restart-mitigated workloads (added 2026-08-26, finding F-5e6cdafc) ----
        #
        # ContainerMemoryLeakPredicted above is STRUCTURALLY BLIND to any workload
        # under a restart mitigation: it needs container age > 24h plus for:1h, and
        # frigate is now restarted every 24h at 02:30. Making the restart more
        # frequent makes that alert LESS likely to ever fire. The two rules below
        # exist so the mitigation is observable; neither depends on container age
        # being large, so neither can be blinded by the restart.
        #
        # The 24h guard on ContainerMemoryLeakPredicted is deliberately UNTOUCHED.
        # It is load-bearing: office/sure-worker fired at container age 6h00m40s --
        # the exact instant a 6h guard opened -- projecting 114% of limit off
        # Sidekiq's post-boot arena ratchet, against a 7-day asymptote of 68%.
        # Loosening it to cover frigate would trade this false negative for that
        # false positive. Add coverage; do not move the guard.
        #
        # Scoped by an explicit selector rather than applied cluster-wide: a
        # restart mitigation is a rare, deliberate, per-workload decision, and a
        # cluster-wide version of either rule would fire on every normal deploy.
        # To put another workload under a restart mitigation, add it here.

        - alert: ContainerRestartMitigationStale
          # The restart is the mitigation, so the restart itself must be monitored.
          # Asserts the EFFECT (the container actually got younger), not the
          # mechanism -- so it covers CronJob deleted, RBAC revoked, image pull
          # failing, job erroring, schedule edited wrong, and
          # startingDeadlineSeconds silently skipping a run, all in one expression.
          #
          # NOT built on kube_cronjob_status_last_schedule_time: that series does
          # not exist until the CronJob first fires, so `time() - <absent>` returns
          # no data and never fires in exactly the broken state this rule is for.
          # Verified 2026-08-26: no such series exists for frigate-restart.
          #
          # The `or absent(...)` arm is not decoration. Without it, frigate's pod
          # disappearing entirely makes this rule return no data -- which reads as
          # "all clear", the exact failure the rule is meant to prevent.
          #
          # 30h = the 24h schedule plus one skipped run's grace. Warning, not
          # critical: at 30h the container is well inside the 10Gi budget, so this
          # is a day of lead time rather than an emergency. ContainerMemoryNearLimit
          # and ContainerMemoryLimitImminent remain the critical tier. Expect it to
          # fire if the CronJob is deliberately suspended -- that is correct.
          expr: |
            (
              (time() - container_start_time_seconds{namespace="home-automation",container="frigate"}) > 30 * 3600
            )
            or
            absent(container_start_time_seconds{namespace="home-automation",container="frigate"})
          for: 30m
          labels:
            severity: warning
            category: capacity
            component: container
          annotations:
            summary: "frigate has not been restarted on schedule — its leak mitigation may be dead"
            description: >-
              home-automation/frigate is under a DAILY restart mitigation (CronJob frigate-restart,
              30 2 * * *) because it exhausts its memory limit in roughly 38 hours. The container has
              now gone more than 30 hours without a restart, or has vanished entirely. The mitigation
              is not running. Check the CronJob's lastScheduleTime, its Job history, and its RBAC.
              Do not silence this — at the ceiling frigate degrades silently (ENOMEM to child
              processes) instead of being OOMKilled.

        - alert: ContainerMemoryBudgetExceeded
          # "The restart interval is no longer sized correctly." Age-independent,
          # so the restart cannot hide it. Fires an entire tier earlier than
          # ContainerMemoryNearLimit (0.90) and much earlier than Imminent (0.97).
          #
          # working_set, matching the two threshold rules and matching what the
          # cgroup actually enforces -- frigate has a 2Gi /dev/shm for ffmpeg
          # frames, which is charged to the container and is NOT visible in RSS.
          # (RSS is the right metric for the PREDICTION rule and the wrong one here.)
          #
          # 0.75 of 10Gi = 7.5 GiB. Expected daily peak under this mitigation is
          # ~62% (cold start ~3.87 GiB + ~2.14 GiB over 24h), and the pre-change
          # 8Gi-era peak was ~7.76 GiB, so crossing 7.5 GiB within one restart
          # cycle means the leak rate has risen above what daily can absorb.
          # Response: tighten the interval or act on the root cause -- do not
          # raise this threshold.
          expr: |
            (
              container_memory_working_set_bytes{namespace="home-automation",container="frigate"}
              / on(namespace,pod,container) group_left
              kube_pod_container_resource_limits{resource="memory"}
            ) > 0.75
          for: 30m
          labels:
            severity: warning
            category: capacity
            component: container
          annotations:
            summary: "frigate reached {{ $value | humanizePercentage }} of its limit inside one restart cycle"
            description: >-
              home-automation/frigate crossed 75% of its memory limit within a single daily restart
              cycle. The daily restart is no longer sufficient to bound the leak. Tighten the
              frigate-restart schedule or address the root cause (frigate.embeddings_manager);
              see docs/sops/frigate-memory-leak.md and finding F-5e6cdafc.
