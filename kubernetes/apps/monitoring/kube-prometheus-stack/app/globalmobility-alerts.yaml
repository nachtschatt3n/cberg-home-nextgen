---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/name: kube-prometheus-stack
    app.kubernetes.io/part-of: kube-prometheus-stack
    release: kube-prometheus-stack
  name: globalmobility-alerts
  namespace: monitoring
spec:
  groups:
  - interval: 30s
    name: globalmobility.rules
    rules:
    - alert: GlobalmobilityPodNotReady
      annotations:
        description: globalDISPO dispatch system (TYPO3) pod {{ $labels.pod }} has been not ready for more
          than 5 minutes. The service is likely unavailable.
        summary: globalDISPO dispatch system (TYPO3) pod {{ $labels.pod }} is not ready
      expr: |
        sum by (namespace, pod) (
          kube_pod_status_ready{namespace="my-software-showcase", pod=~"globalmobility-.*", condition="false"}
        ) > 0
      for: 5m
      labels:
        app: globalmobility
        namespace: my-software-showcase
        severity: critical
    - alert: GlobalmobilityPodCrashLooping
      annotations:
        description: globalDISPO dispatch system (TYPO3) pod {{ $labels.pod }} has restarted {{ $value |
          printf "%.0f" }} times in the last 15 minutes. Check logs for startup
          errors or dependency failures.
        summary: globalDISPO dispatch system (TYPO3) pod {{ $labels.pod }} is crash looping
      expr: |
        rate(kube_pod_container_status_restarts_total{namespace="my-software-showcase", pod=~"globalmobility-.*"}[15m]) * 900 > 2
      for: 5m
      labels:
        app: globalmobility
        namespace: my-software-showcase
        severity: critical
    - alert: GlobalmobilityPodRestarted
      annotations:
        description: globalDISPO dispatch system (TYPO3) pod {{ $labels.pod }} has restarted at least once in
          the last 15 minutes. Monitor for repeated restarts or OOMKills.
        summary: globalDISPO dispatch system (TYPO3) pod {{ $labels.pod }} restarted
      expr: |
        increase(kube_pod_container_status_restarts_total{namespace="my-software-showcase", pod=~"globalmobility-.*"}[15m]) > 0
      for: 1m
      labels:
        app: globalmobility
        namespace: my-software-showcase
        severity: warning
