---
# ci-runner alerting: test results must not page, runner INFRA must.
#
# The ci-runner namespace (docs/sops/ci-runner.md) runs The Ninth Banner test
# suites as sharded, ephemeral Jobs. Two stock kube-prometheus-stack rules
# treated ordinary CI activity as cluster faults, so both are disabled in
# helmvalues.yaml (defaultRules.disabled) and re-declared here under the SAME
# alert names (routing, silences and docs/sops/failed-job-alerting.md keep
# working) with one narrow exclusion each.
# KubeCPUQuotaOvercommit / KubeMemoryQuotaOvercommit stay stock: they compare
# the SUM of hard quotas to allocatable (> 1.5x); ci-runner-quota is 12 CPU /
# 36Gi (~0.24x / ~0.21x of 51 CPU / 174 GiB), nowhere near, so no override.
#
# These are inline copies of the stock rules (chart 91.5.2): on every
# kube-prometheus-stack minor/major bump, diff them against the chart's
# kubernetes-apps / kubernetes-resources rules so upstream fixes are not lost.
#
#   KubeJobFailed     - a red test run fails its Job by design (every shard
#                       fails its index). That is a test RESULT, not a fault.
#                       Excluded: namespace="ci-runner". Every other namespace
#                       keeps the stock expression verbatim.
#   KubeCPUOvercommit - the N-1 check summed the CI pods' requests (2 CPU per
#                       shard, 3 shards) on top of ~30.7 CPU of production
#                       requests against a 34 CPU (51 - 17) budget, so every CI
#                       run fired it. CI pods run at PriorityClass ci-low
#                       (value -1000): on a node loss every production pod
#                       (priority >= 0) preempts them, so they never consume
#                       the N-1 headroom this alert protects. Excluded: pods
#                       in namespace ci-runner whose kube_pod_info
#                       priority_class is "ci-low" (namespace-pinned: the
#                       cluster-scoped class could otherwise hide any pod).
#                       Everything else is the stock expression.
#   KubeMemoryOvercommit - same reasoning and the identical exclusion as
#                       KubeCPUOvercommit: fired 2026-10-04 with ~82.6 GiB of
#                       production requests + 5-6 CI shards at 6Gi each against
#                       a ~116 GiB (174 - 58) N-1 budget. Added 2026-10-04.
#   KubeQuotaAlmostFull / KubeQuotaFullyUsed (info)
#                     - ci-runner-quota is a deliberate capacity CAP sized to
#                       6 shards (thermal gate, since 2026-10-04); gated pods
#                       count against it, so busy periods sit near or at the
#                       cap. That is the design, not a warning sign.
#                       Excluded: namespace="ci-runner". KubeQuotaExceeded
#                       (> 100%, only possible when the hard limit is lowered
#                       under live usage) stays stock and still covers it.
#
# The ci-runner.infra group replaces the signal KubeJobFailed used to carry
# for ci-runner: things that break the RUNNER, independent of test outcome.
# Stock KubePodNotReady skips Job-owned pods and KubeContainerWaiting waits
# 1h, so without these a broken runner would be silent.
#
# Labels verified on live series 2026-10-03: kube_pod_info{priority_class},
# kube_pod_status_phase{phase}, kube_pod_init_container_status_terminated_reason
# {container="clone",reason}. Healthy CI pods are Pending ~1 min (clone).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ci-runner-alerts
  namespace: monitoring
  labels:
    # REQUIRED: without it the rule is never loaded, silently.
    release: kube-prometheus-stack
    app.kubernetes.io/name: kube-prometheus-stack
    app.kubernetes.io/part-of: kube-prometheus-stack
spec:
  groups:
    - name: kubernetes-apps.overrides
      rules:
        - alert: KubeJobFailed
          annotations:
            description: Job {{ $labels.namespace }}/{{ $labels.job_name }} failed
              to complete. Removing failed job after investigation should clear
              this alert. (ci-runner test Jobs are excluded - a failing test run
              is a result, not a fault; see ci-runner-alerts.yaml.)
            runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubejobfailed
            summary: Job failed to complete.
          expr: |
            kube_job_failed{job="kube-state-metrics", namespace!="ci-runner"} > 0
          for: 15m
          labels:
            severity: warning
    - name: kubernetes-resources.overrides
      rules:
        - alert: KubeCPUOvercommit
          annotations:
            description: Cluster has overcommitted CPU resource requests for Pods
              by {{ printf "%.2f" $value }} CPU shares and cannot tolerate node
              failure. (Preemptible ci-low CI pods are not counted.)
            runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubecpuovercommit
            summary: Cluster has overcommitted CPU resource requests.
          # Stock expression with namespace_cpu:kube_pod_container_resource_requests:sum
          # expanded inline so ci-low pods can be subtracted per pod.
          expr: |
            (
              (
                sum by (cluster) (
                  max by (namespace, pod, container, cluster) (kube_pod_container_resource_requests{job="kube-state-metrics", resource="cpu"})
                  * on (namespace, pod, cluster) group_left ()
                  max by (namespace, pod, cluster) (kube_pod_status_phase{phase=~"Pending|Running"} == 1)
                  unless on (namespace, pod, cluster)
                  max by (namespace, pod, cluster) (kube_pod_info{job="kube-state-metrics", namespace="ci-runner", priority_class="ci-low"})
                )
                - sum by (cluster) (kube_node_status_allocatable{job="kube-state-metrics", resource="cpu"}) > 0
              )
              and
              count by (cluster) (max by (cluster, node) (kube_node_role{job="kube-state-metrics", role="control-plane"})) < 3
            )
            or
            (
              sum by (cluster) (
                max by (namespace, pod, container, cluster) (kube_pod_container_resource_requests{job="kube-state-metrics", resource="cpu"})
                * on (namespace, pod, cluster) group_left ()
                max by (namespace, pod, cluster) (kube_pod_status_phase{phase=~"Pending|Running"} == 1)
                unless on (namespace, pod, cluster)
                max by (namespace, pod, cluster) (kube_pod_info{job="kube-state-metrics", namespace="ci-runner", priority_class="ci-low"})
              )
              - (
                sum by (cluster) (kube_node_status_allocatable{job="kube-state-metrics", resource="cpu"})
                - max by (cluster) (kube_node_status_allocatable{job="kube-state-metrics", resource="cpu"})
              ) > 0
            )
          for: 10m
          labels:
            severity: warning
        - alert: KubeMemoryOvercommit
          annotations:
            description: Cluster has overcommitted memory resource requests for
              Pods by {{ $value | humanize }} bytes and cannot tolerate node
              failure. (Preemptible ci-low CI pods are not counted.)
            runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubememoryovercommit
            summary: Cluster has overcommitted memory resource requests.
          # Stock expression (chart 91.5.2) with
          # namespace_memory:kube_pod_container_resource_requests:sum expanded
          # inline so ci-low pods can be subtracted per pod. Same exclusion as
          # KubeCPUOvercommit above.
          expr: |
            # Non-HA clusters.
            (
              (
                sum by (cluster) (
                  max by (namespace, pod, container, cluster) (kube_pod_container_resource_requests{job="kube-state-metrics", resource="memory"})
                  * on (namespace, pod, cluster) group_left ()
                  max by (namespace, pod, cluster) (kube_pod_status_phase{phase=~"Pending|Running"} == 1)
                  unless on (namespace, pod, cluster)
                  max by (namespace, pod, cluster) (kube_pod_info{job="kube-state-metrics", namespace="ci-runner", priority_class="ci-low"})
                )
                -
                sum by (cluster) (kube_node_status_allocatable{job="kube-state-metrics", resource="memory"}) > 0
              )
              and
              count by (cluster) (max by (cluster, node) (kube_node_role{job="kube-state-metrics", role="control-plane"})) < 3
            )
            or
            # HA clusters.
            (
              sum by (cluster) (
                max by (namespace, pod, container, cluster) (kube_pod_container_resource_requests{job="kube-state-metrics", resource="memory"})
                * on (namespace, pod, cluster) group_left ()
                max by (namespace, pod, cluster) (kube_pod_status_phase{phase=~"Pending|Running"} == 1)
                unless on (namespace, pod, cluster)
                max by (namespace, pod, cluster) (kube_pod_info{job="kube-state-metrics", namespace="ci-runner", priority_class="ci-low"})
              )
              -
              (
                # Skip clusters with only one allocatable node.
                (
                  sum by (cluster) (kube_node_status_allocatable{job="kube-state-metrics", resource="memory"})
                  -
                  max by (cluster) (kube_node_status_allocatable{job="kube-state-metrics", resource="memory"})
                ) > 0
              ) > 0
            )
          for: 10m
          labels:
            severity: warning
        - alert: KubeQuotaAlmostFull
          annotations:
            description: Namespace {{ $labels.namespace }} is using {{ $value | humanizePercentage }}
              of its {{ $labels.resource }} quota. (ci-runner is excluded - its quota is
              a capacity cap that every CI run fills by design.)
            runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubequotaalmostfull
            summary: Namespace quota is going to be full.
          expr: |
            topk by (cluster, namespace, resource, resourcequota) (1, max without (instance, job, type) (kube_resourcequota{job="kube-state-metrics", type="used", namespace!="ci-runner"}))
            / on (cluster, namespace, resource, resourcequota) group_left ()
            topk by (cluster, namespace, resource, resourcequota) (1, max without (instance, job, type) (kube_resourcequota{job="kube-state-metrics", type="hard", namespace!="ci-runner"}) > 0)
            > 0.9 < 1
          for: 15m
          labels:
            severity: info
        - alert: KubeQuotaFullyUsed
          annotations:
            description: Namespace {{ $labels.namespace }} is using {{ $value | humanizePercentage }}
              of its {{ $labels.resource }} quota. (ci-runner is excluded - its quota is
              a capacity cap that every CI run fills by design.)
            runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubequotafullyused
            summary: Namespace quota is fully used.
          expr: |
            topk by (cluster, namespace, resource, resourcequota) (1, max without (instance, job, type) (kube_resourcequota{job="kube-state-metrics", type="used", namespace!="ci-runner"}))
            / on (cluster, namespace, resource, resourcequota) group_left ()
            topk by (cluster, namespace, resource, resourcequota) (1, max without (instance, job, type) (kube_resourcequota{job="kube-state-metrics", type="hard", namespace!="ci-runner"}) > 0)
            == 1
          for: 15m
          labels:
            severity: info
    - name: ci-runner.infra
      interval: 1m
      rules:
        - alert: CIRunnerPodStuckPending
          annotations:
            description: CI pod {{ $labels.namespace }}/{{ $labels.pod }} has been
              Pending for more than 30 minutes (healthy pods clone and start in
              about a minute). Likely unschedulable, ImagePullBackOff on the
              Playwright image, a missing ConfigMap/Secret, or a hung clone
              init container. Test results are not affected - the runner is.
              Thermal-gated pods (SchedulingGated) are NOT counted - the
              30 min start when the gate releases the pod, so this is a pod
              the scheduler/kubelet could not start after admission.
            summary: CI runner pod stuck Pending
          # Since 2026-10-04 shard pods are created behind the thermal gate
          # (schedulingGates: ci.cberg.home/thermal, docs/sops/ci-runner.md) and
          # queue Pending for as long as nodes are hot or full - by design, and
          # on 2026-10-04 that was 16 pods at once, all of them firing this rule.
          # Excluded: pods whose KSM kube_pod_status_reason is SchedulingGated
          # (KSM v2.20 emits it from the PodScheduled condition; verified live
          # 2026-10-04). NOT kube_pod_status_unschedulable: it is 1 for gated
          # pods too. Once released, the pod drops the reason and the 30m
          # timer starts - unschedulable, ImagePullBackOff, missing CM/Secret
          # and a hung clone all still fire. A missing reason series fails
          # toward firing. Tests: runbooks/tests/test-ci-runner-pending-alert.py.
          # A DEAD admitter (no trigger running) leaves pods gated; gated pods
          # count as Job active, so CIRunnerJobStarved misses it too. Covered
          # by CIRunnerThermalGateStalled (below).
          expr: |
            (
              max by (namespace, pod) (kube_pod_status_phase{namespace="ci-runner", phase="Pending"}) == 1
            )
            unless on (namespace, pod) (
              max by (namespace, pod) (kube_pod_status_reason{namespace="ci-runner", reason="SchedulingGated"}) == 1
            )
          for: 30m
          labels:
            category: ci-runner
            component: the-ninth-banner-tests
            severity: warning
        - alert: CIRunnerCloneFailed
          annotations:
            description: The clone init container of CI pod {{ $labels.pod }}
              terminated with reason {{ $labels.reason }}. The test suite never
              ran - check the git credential (the-ninth-banner-git-credential),
              the NetworkPolicy/DNS allow-list, and that the ref exists.
            summary: CI runner could not clone the repository
          expr: |
            max by (namespace, pod, reason) (
              kube_pod_init_container_status_terminated_reason{namespace="ci-runner", container="clone", reason!="Completed"}
            ) == 1
          for: 1m
          labels:
            category: ci-runner
            component: the-ninth-banner-tests
            severity: warning
        # A quota-blocked shard is never created (FailedCreate event), so no
        # Pending pod exists for CIRunnerPodStuckPending to see. Queueing behind
        # another run is by design (observed <= 9 min; runs take 9-40 min), but
        # a run that gets NO pod for an hour is about to hit its 90-min
        # activeDeadlineSeconds without ever testing anything.
        - alert: CIRunnerJobStarved
          annotations:
            description: CI Job {{ $labels.job_name }} has had no running pod for
              over an hour and has not finished. Its shards are not being
              created - check `kubectl -n ci-runner get events
              --field-selector reason=FailedCreate` (quota held by a stuck or
              orphaned run?) before its 90-minute deadline fails it.
            summary: CI runner Job is starved of pods
          expr: |
            (max by (namespace, job_name) (kube_job_status_active{namespace="ci-runner"}) == 0)
            unless on (namespace, job_name) (
              max by (namespace, job_name) (kube_job_complete{namespace="ci-runner", condition="true"} == 1)
              or
              max by (namespace, job_name) (kube_job_failed{namespace="ci-runner", condition="true"} == 1)
            )
          for: 60m
          labels:
            category: ci-runner
            component: the-ninth-banner-tests
            severity: info
        # Closes the gap baaa2d7e opened: a thermal-gated pod is neither
        # "stuck Pending" (CIRunnerPodStuckPending skips SchedulingGated) nor
        # starved (it counts as Job-active). The admitter
        # (scripts/ninth-banner-admit.py) is NOT a cluster workload: it runs on
        # the Mac, ticked by every live ninth-banner-test.sh trigger, and
        # exports no metric, so there is nothing to absent() on. Its liveness
        # is observed through its effect instead: every release removes the
        # gate and the scheduler binds the pod within seconds, which sets KSM
        # kube_pod_status_scheduled_time. Newest scheduled_time in ci-runner =
        # last release. Fires when gated pods exist and nothing was released
        # for 30 min, or gated pods exist and NO ci-runner pod was ever
        # scheduled (all earlier pods TTL-deleted: fails toward firing).
        # N=30m from live data 2026-10-04 15:14-21:15 (361 gated minutes,
        # queue up to 24): release gap p50 1.9 / p90 7.4 / p99 12.2 / max
        # 13.2 min (brake 10 min + settle 5 min). Edge: GPU=0 CPU-mode browser
        # shards (~34 min) filling every slot could approach it; GPU mode
        # shards take 4-7 min. If the reason series vanished (KSM rename),
        # CIRunnerPodStuckPending fires for the gated pods instead, so the
        # pair is never blind together.
        # ARC GitHub Actions runner pods (ninth-banner-k8s-*, §2c) are never
        # gated and get scheduled whenever a GitHub job arrives, so they are
        # excluded from "last release": a busy runner must not mask a dead
        # admitter.
        # Tests: runbooks/tests/test-ci-runner-gate-stalled-alert.py.
        - alert: CIRunnerThermalGateStalled
          annotations:
            description: '{{ $value }} CI pod(s) in {{ $labels.namespace }} wait
              behind the ci.cberg.home/thermal schedulingGate, and no CI pod has
              been released (scheduled) for over 30 minutes. The admitter
              (scripts/ninth-banner-admit.py, ticked only by a RUNNING
              ninth-banner-test.sh on the Mac) is probably dead or wedged, or
              the gate is held closed (brake / missing Prometheus data =
              fail-closed). Check `scripts/ninth-banner-admit.py --status`;
              without action the Jobs hit activeDeadlineSeconds untested.
              docs/sops/ci-runner.md section 2b.'
            summary: CI thermal gate has released no pod for 30 minutes
          expr: |
            (
              sum by (namespace) (kube_pod_status_reason{namespace="ci-runner", reason="SchedulingGated"}) > 0
            )
            and on (namespace)
            (
              (time() - max by (namespace) (kube_pod_status_scheduled_time{namespace="ci-runner", pod!~"ninth-banner-k8s-.*"})) > 1800
              or on (namespace)
              (
                sum by (namespace) (kube_pod_status_reason{namespace="ci-runner", reason="SchedulingGated"}) > 0
                unless on (namespace)
                max by (namespace) (kube_pod_status_scheduled_time{namespace="ci-runner", pod!~"ninth-banner-k8s-.*"})
              )
            )
          for: 5m
          labels:
            category: ci-runner
            component: the-ninth-banner-tests
            severity: warning
