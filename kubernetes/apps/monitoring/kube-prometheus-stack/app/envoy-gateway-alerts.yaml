---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/name: kube-prometheus-stack
    app.kubernetes.io/part-of: kube-prometheus-stack
    release: kube-prometheus-stack
  name: envoy-gateway-alerts
  namespace: monitoring
spec:
  groups:
  - interval: 30s
    name: envoy-gateway.pods.health
    rules:
    # Matches BOTH the control plane (envoy-gateway-*) and the data-plane
    # deployments EG generates per Gateway (envoy-network-envoy-<gw>-<hash>).
    - alert: EnvoyGatewayPodNotReady
      annotations:
        description: Envoy Gateway pod {{ $labels.pod }} in {{ $labels.namespace }}
          has been not ready for more than 5 minutes. During the ingress
          migration parallel-run this affects only the new envoy gateways
          (192.168.55.103/.104); ingress-nginx keeps serving until the phase
          that moves the app is done.
        summary: Envoy Gateway pod {{ $labels.pod }} is not ready ({{ $labels.namespace }})
      expr: |
        sum by (namespace, pod) (
          kube_pod_status_ready{namespace="network", pod=~"envoy-gateway-.*|envoy-network-.*", condition="true"}
        ) == 0
      for: 5m
      labels:
        category: network
        component: envoy-gateway
        severity: critical
    - alert: EnvoyGatewayPodCrashLooping
      annotations:
        description: Envoy Gateway pod {{ $labels.pod }} in {{ $labels.namespace }}
          has restarted {{ $value | printf "%.0f" }} times in the last 15
          minutes. The chart is pinned and held (runbooks/auto-update-policy.yaml),
          so suspect a config change (EnvoyProxy/GatewayClass/policy) rather
          than an image bump.
        summary: Envoy Gateway pod {{ $labels.pod }} is crash looping ({{ $labels.namespace }})
      expr: |
        rate(kube_pod_container_status_restarts_total{namespace="network", pod=~"envoy-gateway-.*|envoy-network-.*"}[15m]) * 900 > 2
      for: 5m
      labels:
        category: network
        component: envoy-gateway
        severity: critical
    - alert: EnvoyGatewayPodRestarted
      annotations:
        description: Envoy Gateway pod {{ $labels.pod }} in {{ $labels.namespace }}
          has restarted at least once in the last 15 minutes.
        summary: Envoy Gateway pod {{ $labels.pod }} restarted ({{ $labels.namespace }})
      expr: |
        increase(kube_pod_container_status_restarts_total{namespace="network", pod=~"envoy-gateway-.*|envoy-network-.*"}[15m]) > 0
      for: 1m
      labels:
        category: network
        component: envoy-gateway
        severity: warning
