apiVersion: v1
kind: ConfigMap
metadata:
  name: kube-prometheus-stack-values
  labels:
    reconcile.fluxcd.io/watch: "Enabled"
data:
  values.yaml: |
    crds:
      enabled: true
    defaultRules:
      disabled:
        KubeAPIDown: true
        KubeControllerManagerDown: true
        KubeSchedulerDown: true
        KubeletDown: true
        # Stock CPUThrottlingHigh is too trigger-happy on this bursty homelab
        # (>25% CFS-throttled for 15m). Replaced by a relaxed custom rule in
        # node-hardware-alerts.yaml (>50% for 30m). See 2026-07-13.
        CPUThrottlingHigh: true
        # Stock etcdDatabaseHighFragmentationRatio flaps on this tiny 3-node
        # etcd (100 MiB floor, 10m). Replaced by a relaxed rule in
        # etcd-alerts.yaml (512 MiB floor, 1h). See 2026-07-25.
        etcdDatabaseHighFragmentationRatio: true
        # Stock NodeMemoryMajorPagesFaults (rate(pgmajfault[5m])>500 for 15m)
        # is meaningless here: SWAP IS DISABLED (SwapTotal=0), so major faults
        # are file-backed mmap reads (ES/Frigate/backup I/O), not swap thrash —
        # it fired on ordinary disk bursts at ~54% mem, no pressure. Replaced by
        # a memory-pressure-gated rule in node-hardware-alerts.yaml. See 2026-07-29.
        NodeMemoryMajorPagesFaults: true
      rules:
        kubeApiserverAvailability: false
        kubeControllerManager: false
        kubelet: false
        kubeSchedulerAlerting: false
    cleanPrometheusOperatorObjectNames: true
    alertmanager:
      enabled: true
      ingress:
        enabled: false  # Using separate alertmanager-ingress.yaml for Authentik integration
      alertmanagerConfigSelector:
        matchLabels:
          alertmanager-config: telegram
      # Allow AlertmanagerConfigs from all namespaces
      alertmanagerConfigNamespaceSelector:
        matchExpressions: []
      alertmanagerSpec:
        logLevel: debug
        # Remove automatic namespace= matcher injection so AlertmanagerConfigs
        # in monitoring/storage namespaces route alerts from ALL namespaces.
        # Without this, alerts from network/home-automation/ai/etc. hit receiver: "null".
        alertmanagerConfigMatcherStrategy:
          type: None
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              resources:
                requests:
                  storage: 1Gi
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 512Mi
    kube-state-metrics:
      metricLabelsAllowlist:
        - "deployments=[*]"
        - "persistentvolumeclaims=[*]"
        - "pods=[*]"
      prometheus:
        monitor:
          enabled: true
          relabelings:
            - action: replace
              sourceLabels: ["__meta_kubernetes_pod_node_name"]
              regex: ^(.*)$
              replacement: $1
              targetLabel: kubernetes_node
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 512Mi
    kubelet:
      enabled: true
      serviceMonitor:
        interval: 30s
        metricRelabelings:
          # Remove duplicate labels provided by k3s
          - action: keep
            sourceLabels: ["__name__"]
            regex: (apiserver_audit|apiserver_client|apiserver_delegated|apiserver_envelope|apiserver_storage|apiserver_webhooks|authentication_token|cadvisor_version|container_blkio|container_cpu|container_fs|container_last|container_memory|container_network|container_oom|container_processes|container|csi_operations|disabled_metric|get_token|go|hidden_metric|kubelet_certificate|kubelet_cgroup|kubelet_container|kubelet_containers|kubelet_cpu|kubelet_device|kubelet_graceful|kubelet_http|kubelet_lifecycle|kubelet_managed|kubelet_node|kubelet_pleg|kubelet_pod|kubelet_run|kubelet_running|kubelet_runtime|kubelet_server|kubelet_started|kubelet_volume|kubernetes_build|kubernetes_feature|machine_cpu|machine_memory|machine_nvm|machine_scrape|node_namespace|plugin_manager|prober_probe|process_cpu|process_max|process_open|process_resident|process_start|process_virtual|registered_metric|rest_client|scrape_duration|scrape_samples|scrape_series|storage_operation|volume_manager|volume_operation|workqueue)_(.+)
          - action: replace
            sourceLabels: ["node"]
            targetLabel: instance
          # Drop high cardinality labels
          - action: labeldrop
            regex: (uid)
          - action: labeldrop
            regex: (id|name)
          - action: drop
            sourceLabels: ["__name__"]
            regex: (rest_client_request_duration_seconds_bucket|rest_client_request_duration_seconds_sum|rest_client_request_duration_seconds_count)
    kubeApiServer:
      enabled: true
      serviceMonitor:
        metricRelabelings:
          # Remove duplicate labels provided by k3s
          - action: keep
            sourceLabels: ["__name__"]
            regex: (aggregator_openapi|aggregator_unavailable|apiextensions_openapi|apiserver_admission|apiserver_audit|apiserver_cache|apiserver_cel|apiserver_client|apiserver_crd|apiserver_current|apiserver_envelope|apiserver_flowcontrol|apiserver_init|apiserver_kube|apiserver_longrunning|apiserver_request|apiserver_requested|apiserver_response|apiserver_selfrequest|apiserver_storage|apiserver_terminated|apiserver_tls|apiserver_watch|apiserver_webhooks|authenticated_user|authentication|disabled_metric|etcd_bookmark|etcd_lease|etcd_request|field_validation|get_token|go|grpc_client|hidden_metric|kube_apiserver|kubernetes_build|kubernetes_feature|node_authorizer|pod_security|process_cpu|process_max|process_open|process_resident|process_start|process_virtual|registered_metric|rest_client|scrape_duration|scrape_samples|scrape_series|serviceaccount_legacy|serviceaccount_stale|serviceaccount_valid|watch_cache|workqueue)_(.+)
          # Drop high cardinality labels
          - action: drop
            sourceLabels: ["__name__"]
            regex: (apiserver|etcd|rest_client)_request(|_sli|_slo)_duration_seconds_bucket
          - action: drop
            sourceLabels: ["__name__"]
            regex: (apiserver_response_sizes_bucket|apiserver_watch_events_sizes_bucket)
    kubeControllerManager:
      enabled: true
      endpoints:
        - 192.168.55.11
        - 192.168.55.12
        - 192.168.55.13
      serviceMonitor:
        metricRelabelings:
          # Remove duplicate labels provided by k3s
          - action: keep
            sourceLabels: ["__name__"]
            regex: "(apiserver_audit|apiserver_client|apiserver_delegated|apiserver_envelope|apiserver_storage|apiserver_webhooks|attachdetach_controller|authenticated_user|authentication|cronjob_controller|disabled_metric|endpoint_slice|ephemeral_volume|garbagecollector_controller|get_token|go|hidden_metric|job_controller|kubernetes_build|kubernetes_feature|leader_election|node_collector|node_ipam|process_cpu|process_max|process_open|process_resident|process_start|process_virtual|pv_collector|registered_metric|replicaset_controller|rest_client|retroactive_storageclass|root_ca|running_managed|scrape_duration|scrape_samples|scrape_series|service_controller|storage_count|storage_operation|ttl_after|volume_operation|workqueue)_(.+)"
    kubeEtcd:
      enabled: true
      endpoints:
        - 192.168.55.11
        - 192.168.55.12
        - 192.168.55.13
    kubeScheduler:
      enabled: true
      endpoints:
        - 192.168.55.11
        - 192.168.55.12
        - 192.168.55.13
      serviceMonitor:
        metricRelabelings:
          # Remove duplicate labels provided by k3s
          - action: keep
            sourceLabels: ["__name__"]
            regex: "(apiserver_audit|apiserver_client|apiserver_delegated|apiserver_envelope|apiserver_storage|apiserver_webhooks|authenticated_user|authentication|disabled_metric|go|hidden_metric|kubernetes_build|kubernetes_feature|leader_election|process_cpu|process_max|process_open|process_resident|process_start|process_virtual|registered_metric|rest_client|scheduler|scrape_duration|scrape_samples|scrape_series|workqueue)_(.+)"
    kubeProxy:
      enabled: false # Disabled due to eBPF
    prometheus:
      ingress:
        enabled: false  # Using separate prometheus-ingress.yaml for Authentik integration
      prometheusSpec:
        ruleSelectorNilUsesHelmValues: false
        ruleSelector:
          matchLabels:
            release: kube-prometheus-stack
        serviceMonitorSelectorNilUsesHelmValues: false
        serviceMonitorSelector:
          matchLabels:
            release: kube-prometheus-stack
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        enableAdminAPI: true
        walCompression: true
        retention: 7d
        retentionSize: 20GB
        storageSpec:
          volumeClaimTemplate:
            spec:
              # RIGHT-SIZED 2026-09-06: 100Gi -> 30Gi. Longhorn schedules on DECLARED
              # size; 100Gi for an 8.2 GiB working set reserved ~140 GiB of cluster
              # scheduling across two replicas and pushed k8s-nuc14-02 to 95.5%
              # committed. 30Gi keeps retentionSize (20GiB) at 68% of allocated disk,
              # inside upstream's 80-85% compaction-headroom guidance.
              # Plan: runbooks/maintenance/plans/prometheus-volume-rightsize.md
              #
              # storageClassName CORRECTED longhorn -> longhorn-static: the live PVC
              # has ALWAYS been longhorn-static (StatefulSet volumeClaimTemplates are
              # immutable, so the earlier `longhorn` edit never took effect). Leaving
              # it as `longhorn` meant any future PVC delete would silently
              # regenerate a dynamic, EMPTY, Delete-reclaim 100Gi volume.
              #
              # volumeName pins the claim to the named static PV so the StatefulSet
              # can only ever re-bind to the intended volume.
              # GUARD: this pin is correct only while prometheusSpec.replicas is 1
              # (chart default, and unset here). Raising `replicas` or `shards`
              # would make EVERY replica's PVC request this same RWO PV, leaving
              # replica-1 Pending forever. volumeClaimTemplates are immutable, so
              # unwinding that needs a StatefulSet delete. To scale out: remove
              # this pin and pre-create one named static PV per replica first.
              #
              # The old `longhorn.io/number-of-replicas: "1"` annotation is REMOVED,
              # not kept: Longhorn reads replica count from StorageClass parameters,
              # never from PVC annotations, so it was inert and read as an applied
              # setting that was not applied. Replica count now lives, visibly, on
              # the hand-applied Volume CR (longhorn-volume-prometheus-tsdb.yaml).
              storageClassName: longhorn-static
              volumeName: prometheus-tsdb
              resources:
                requests:
                  storage: 30Gi
        resources:
          requests:
            cpu: 500m
            memory: 3Gi
          limits:
            cpu: 2000m
            # RAISED 4Gi -> 6Gi on 2026-09-06 (F-a0f92039). Measured, not guessed:
            # the 48h working-set history read 1.8-2.7 GiB steady through 09-04/05,
            # then climbed 2.71 -> 3.05 -> 3.68 GiB across today's Talos roll and
            # TSDB migration, tripping ContainerMemoryNearLimit at 91.6% with
            # ~235k head series and zero restarts. So this is a genuine new
            # plateau, not a leak and not a spike.
            # Why it matters more than an ordinary OOM: an OOMKill here discards
            # the in-memory head, and Prometheus is the thing that would tell us
            # anything else broke — it goes blind exactly when it is needed.
            # 6Gi restores roughly the 2x headroom the 4Gi limit gave at the old
            # ~2 GiB baseline, and is a PREREQUISITE for fixing the 21 unselected
            # ServiceMonitors (F-0fa5b600): adding those scrape targets adds
            # series, and doing that at 92% of the limit would OOM it.
            memory: 6Gi
      additionalServiceMonitors:
        - name: longhorn
          namespaceSelector:
            any: true
          selector:
            matchLabels:
              app: longhorn-manager
          endpoints:
            - port: manager
              path: /metrics
              interval: 30s
        - name: ingress-nginx
          namespaceSelector:
            matchNames: ["network"]
          selector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
              app.kubernetes.io/component: controller
          endpoints:
            - port: metrics
              path: /metrics
              interval: 30s
        - name: external-dns
          namespaceSelector:
            matchNames: ["network"]
          selector:
            matchLabels:
              app.kubernetes.io/name: external-dns
          endpoints:
            - port: metrics
              path: /metrics
              interval: 30s
        - name: nextcloud-metrics
          namespaceSelector:
            matchNames: ["office"]
          selector:
            matchLabels:
              app.kubernetes.io/name: nextcloud
              app.kubernetes.io/component: metrics
          endpoints:
            - port: metrics
              path: /metrics
              interval: 30s
        - name: influxdb
          namespaceSelector:
            matchNames: ["databases"]
          selector:
            matchLabels:
              app.kubernetes.io/name: influxdb2
          endpoints:
            - port: http
              path: /metrics
              interval: 30s
        - name: frigate
          namespaceSelector:
            matchNames: ["home-automation"]
          selector:
            matchLabels:
              app: frigate
          endpoints:
            - port: http
              path: /api/prometheus
              interval: 30s
        - name: mosquitto
          namespaceSelector:
            matchNames: ["home-automation"]
          selector:
            matchLabels:
              app.kubernetes.io/name: mosquitto
          endpoints:
            - port: metrics
              path: /metrics
              interval: 30s
    prometheusOperator:
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
    grafana:
      enabled: false
      forceDeployDashboards: true
      sidecar:
        dashboards:
          multicluster:
            etcd:
              enabled: true
