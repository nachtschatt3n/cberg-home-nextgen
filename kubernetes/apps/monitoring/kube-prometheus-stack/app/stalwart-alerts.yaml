---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/name: kube-prometheus-stack
    app.kubernetes.io/part-of: kube-prometheus-stack
    release: kube-prometheus-stack
  name: stalwart-alerts
  namespace: monitoring
spec:
  groups:
  - interval: 30s
    name: stalwart.pods.health
    rules:
    - alert: StalwartPodNotReady
      annotations:
        description: Stalwart pod {{ $labels.pod }} has been not ready for more
          than 5 minutes. Mail delivery, IMAP and submission may be unavailable.
        summary: Stalwart pod {{ $labels.pod }} is not ready
      expr: |
        sum by (namespace, pod) (
          kube_pod_status_ready{namespace="office", pod=~"stalwart-.*", condition="true"}
          unless on(namespace, pod) kube_pod_status_phase{phase="Succeeded"} == 1
        ) == 0
      for: 5m
      labels:
        category: office
        component: stalwart
        severity: critical
    - alert: StalwartPodCrashLooping
      annotations:
        description: Stalwart pod {{ $labels.pod }} has restarted {{ $value | printf
          "%.0f" }} times in the last 15 minutes. Check logs for datastore or
          listener bind errors.
        summary: Stalwart pod {{ $labels.pod }} is crash looping
      expr: |
        rate(kube_pod_container_status_restarts_total{namespace="office", pod=~"stalwart-.*"}[15m]) * 900 > 2
      for: 5m
      labels:
        category: office
        component: stalwart
        severity: critical
    - alert: StalwartPodRestarted
      annotations:
        description: Stalwart pod {{ $labels.pod }} has restarted at least once
          in the last 15 minutes. Monitor for repeated restarts.
        summary: Stalwart pod {{ $labels.pod }} restarted
      expr: |
        increase(kube_pod_container_status_restarts_total{namespace="office", pod=~"stalwart-.*"}[15m]) > 0
      for: 1m
      labels:
        category: office
        component: stalwart
        severity: warning
  - interval: 60s
    name: stalwart.scrape
    rules:
    # absent() guard: if the ServiceMonitor stops matching (label drift, auth
    # change) every metric-based rule below silently goes inactive.
    - alert: StalwartMetricsAbsent
      annotations:
        description: No Stalwart scrape target has reported up==1 for 15 minutes.
          Either the pod is down or the /metrics/prometheus basic auth / ServiceMonitor
          no longer matches, which blinds every Stalwart metric alert.
        summary: Stalwart metrics are not being scraped
      expr: |
        absent(up{namespace="office", service="stalwart"} == 1)
      for: 15m
      labels:
        category: office
        component: stalwart
        severity: warning
  - interval: 60s
    name: stalwart.auth
    rules:
    # auth_failed is observed live on /metrics/prometheus (counter, created on
    # first event). Queue/delivery rules are deliberately NOT here yet: no
    # queue metric exists until mail flows (phase 2); add them from the names
    # seen live then, never from docs.
    - alert: StalwartAuthFailuresHigh
      annotations:
        description: Stalwart recorded {{ $value | printf "%.0f" }} failed
          authentications in 15 minutes. Check for a misconfigured client or
          password guessing (IMAP/submission/web are LAN/VPN-only).
        summary: Stalwart authentication failures are elevated
      expr: |
        sum(increase(auth_failed{namespace="office", service="stalwart"}[15m])) > 20
      for: 5m
      labels:
        category: office
        component: stalwart
        severity: warning
