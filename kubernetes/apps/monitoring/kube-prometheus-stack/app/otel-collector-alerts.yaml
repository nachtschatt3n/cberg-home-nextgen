---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: otel-collector-alerts
  namespace: monitoring
  labels:
    app.kubernetes.io/name: kube-prometheus-stack
    app.kubernetes.io/part-of: kube-prometheus-stack
    release: kube-prometheus-stack
spec:
  groups:
    - name: otel-collector.pipeline.health
      interval: 30s
      rules:
        # ES auth failure — fires when the exporter gets persistent 401/security_exception
        # from Elasticsearch (bad credentials, rotated secret, API key invalidated).
        # Uses send_failed metrics which increment on every rejected bulk flush.
        - alert: EdotCollectorESAuthError
          expr: |
            increase(otelcol_exporter_send_failed_log_records_total{exporter=~"elasticsearch/.*"}[5m]) > 0
            or
            increase(otelcol_exporter_send_failed_metric_points_total{exporter=~"elasticsearch/.*"}[5m]) > 0
          for: 3m
          labels:
            severity: critical
            category: logging
            component: otel-collector
          annotations:
            summary: "edot-collector cannot write to Elasticsearch (auth/connection error)"
            description: >-
              edot-collector exporter {{ $labels.exporter }} has been failing to flush
              to Elasticsearch for 3+ minutes ({{ $value }} records dropped in last 5m).
              Most likely cause: 401 security_exception — check if the ES password
              secret was rotated or the user was locked out.
              Check logs: kubectl logs -n monitoring deployment/edot-collector | grep -i "flush failed"
              Check secret: kubectl get secret elasticsearch-es-elastic-user -n monitoring

        # General export failures (non-auth: network, ES overload, etc.)
        - alert: OtelCollectorExportFailed
          expr: increase(otelcol_exporter_send_failed_log_records_total{exporter=~"elasticsearch/.*"}[5m]) > 500
          # for: 10m would NOT have fired on the 2026-08-16 loss event: the
          # corrected expression held true for only 7.5m (10:13:30-10:21:00).
          # 5m is satisfied by that observed event with margin.
          for: 5m
          labels:
            severity: warning
            category: logging
            component: otel-collector
          annotations:
            summary: "OTel collector export failures on {{ $labels.instance }}"
            description: >-
              OTel collector on {{ $labels.instance }} failed to send {{ $value }} log
              records in the last 5 minutes. This usually indicates Elasticsearch
              connectivity or authentication issues. Check edot-collector logs and ES
              cluster health.

        # 2026-08-16: replaced OtelCollectorDroppedLogs, which keyed off
        # `otelcol_processor_dropped_log_records_total` — a name this collector
        # emits under NO condition (absent from the /metrics name list and from
        # 7d of Prometheus history; it was removed upstream when per-processor
        # accepted/refused/incoming/outgoing counters replaced the aggregate
        # "dropped" family). The rule therefore evaluated to an empty vector and
        # sat `inactive, health=ok` forever: green because it matched nothing.
        #
        # Its INTENT — "telemetry was permanently lost inside the collector" —
        # splits across two real loss paths:
        #   1. rejected downstream after enqueue -> otelcol_exporter_send_failed_*
        #      (covered by EdotCollectorESAuthError / OtelCollectorExportFailed above)
        #   2. refused at INTAKE, when memory_limiter applies backpressure and the
        #      receiver returns an error to the sender -> the records never enter a
        #      queue and are lost at the source. That is this rule.
        # Deliberately NOT using otelcol_exporter_enqueue_failed_* — that family is
        # also an empty vector here, so it would have reproduced the same defect.
        - alert: OtelCollectorRecordsRefused
          expr: |
            increase(otelcol_receiver_refused_log_records_total[5m]) > 0
            or
            increase(otelcol_receiver_refused_metric_points_total[5m]) > 0
          for: 1m
          labels:
            severity: critical
            category: logging
            component: otel-collector
          annotations:
            summary: "OTel collector refusing telemetry at intake on {{ $labels.instance }} ({{ $labels.receiver }})"
            description: >-
              Receiver {{ $labels.receiver }} on {{ $labels.instance }} refused
              {{ $value }} records in the last 5 minutes — memory_limiter backpressure
              or a full pipeline. Refused records are rejected before they ever reach
              an export queue, so they are permanently lost at the sender.
              Check collector memory against the memory_limiter limit_mib and the
              ES export queue depth.

        - alert: OtelCollectorQueueFull
          expr: otelcol_exporter_queue_size / otelcol_exporter_queue_capacity > 0.8
          for: 5m
          labels:
            severity: warning
            category: logging
            component: otel-collector
          annotations:
            summary: "OTel collector export queue is {{ $value | humanizePercentage }} full on {{ $labels.instance }}"
            description: >-
              OTel collector export queue on {{ $labels.instance }} is above 80% capacity.
              If it fills completely, new telemetry will be dropped. Check Elasticsearch
              write performance and edot-collector pod resources.

    - name: otel-collector.availability
      interval: 30s
      rules:
        - alert: EdotCollectorDown
          expr: |
            kube_deployment_status_replicas_available{deployment="edot-collector",namespace="monitoring"}
            < kube_deployment_spec_replicas{deployment="edot-collector",namespace="monitoring"}
          for: 5m
          labels:
            severity: critical
            category: logging
            component: otel-collector
          annotations:
            summary: "edot-collector gateway is unreachable"
            description: >-
              The edot-collector gateway deployment has been unreachable for 5 minutes.
              All telemetry (logs, metrics, traces) from node collectors will be backed
              up or dropped until it recovers.
              Check: kubectl get pods -n monitoring -l app=edot-collector

        - alert: OtelDaemonCollectorDown
          expr: kube_daemonset_status_number_ready{daemonset="otel-operator-daemon-collector",namespace="monitoring"}
            < kube_daemonset_status_desired_number_scheduled{daemonset="otel-operator-daemon-collector",namespace="monitoring"}
          for: 5m
          labels:
            severity: warning
            category: logging
            component: otel-collector
          annotations:
            summary: "OTel DaemonSet collector not running on all nodes"
            description: >-
              The OTel daemon collector DaemonSet does not have a running pod on all
              nodes. Logs and host metrics will be missing from affected nodes.
              Check: kubectl get pods -n monitoring -l app.kubernetes.io/managed-by=opentelemetry-operator

    - name: otel-collector.es-ingestion
      interval: 30s
      rules:
        # Closes the 2026-07-17 blind spot: ES metric ingestion stalled for ~32h
        # (RED corrupt shard + a stalled TSDB rollover -> timestamp_error) with NO
        # alert firing. NOTE (corrected 2026-08-16): the claim previously recorded
        # here — "the failure-based alerts above key off send_failed_* series that
        # this collector build does not export" — was WRONG, and this wrong note is
        # why the defect survived three incidents. The build DOES export them; the
        # rules simply omitted the `_total` suffix, so they matched an empty vector.
        # Proof: on 2026-08-16 10:13-10:21 the real series recorded 486,876 metric
        # points and 222,614 log records failed-to-send, while all three rules sat
        # `inactive`. The sent-rate alerts below remain useful for a different case:
        # the collector stops sending entirely (dead/ES unreachable -> rate 0).
        #
        # 2026-08-05 correction: sent-rate is NOT sufficient on its own. During a
        # 3h ES-metrics outage (corrupt write-index shard, cluster RED) the
        # sent_metric_points counter kept incrementing at ~220/s and rate(sent)==0
        # never tripped — the ES _bulk API returns HTTP 200 even when every item
        # is rejected by an unavailable shard, so "sent" tracks bulk dispatch, not
        # doc-level ingestion. The reliable ES-side-stall signal is the export
        # QUEUE pinned at 100% (EsExportQueueStuckFull, below). Keep both: sent==0
        # catches collector-death, queue-stuck catches ES-side rejection stalls.
        - alert: EsMetricsIngestionStalled
          expr: rate(otelcol_exporter_sent_metric_points_total{exporter="elasticsearch/metrics"}[10m]) == 0
          for: 15m
          labels:
            severity: critical
            category: logging
            component: otel-collector
          annotations:
            summary: "Elasticsearch metric ingestion has stalled (0 points/s for 25m+)"
            description: >-
              The edot-collector elasticsearch/metrics exporter has persisted 0 metric
              points for 15m+. Likely causes: ES cluster RED (corrupt shard) or a
              stalled TSDB rollover (write-index time_series window expired ->
              timestamp_error). The elasticsearch-obs-recovery CronJob should auto-heal
              within ~10m; if this is still firing it could not. Check its last run
              (kubectl get jobs -n monitoring | grep obs-recovery) and
              GET _cluster/health / _data_stream/metrics-generic.otel-default.
        - alert: EsLogIngestionStalled
          expr: rate(otelcol_exporter_sent_log_records_total{exporter="elasticsearch/logs"}[10m]) == 0
          for: 15m
          labels:
            severity: critical
            category: logging
            component: otel-collector
          annotations:
            summary: "Elasticsearch log ingestion has stalled (0 records/s for 25m+)"
            description: >-
              The edot-collector elasticsearch/logs exporter has persisted 0 log
              records for 15m+. Likely ES RED or an exporter/connectivity failure —
              application logs are not being stored. Check ES cluster health and
              edot-collector logs.

        # 2026-08-05 backstop: the ES-side-rejection stall that the sent-rate
        # alerts miss. When ES stops accepting writes (cluster RED / corrupt
        # shard / rejected bulk items), the exporter's async queue fills and
        # stays pinned at capacity. This DID fire in the 2026-08-05 incident
        # (metrics queue 10/10 for 3h) while sent-rate looked healthy. Per
        # exporter (metrics/logs/traces) so any ES-side stall pages critically.
        - alert: EsExportQueueStuckFull
          expr: otelcol_exporter_queue_size{exporter=~"elasticsearch/.*"} >= otelcol_exporter_queue_capacity{exporter=~"elasticsearch/.*"}
          for: 15m
          labels:
            severity: critical
            category: logging
            component: otel-collector
          annotations:
            summary: "Elasticsearch export queue stuck 100% full on {{ $labels.instance }} ({{ $labels.exporter }})"
            description: >-
              The edot-collector {{ $labels.exporter }} export queue has been at
              100% capacity for 15m+ — Elasticsearch is not accepting writes
              (cluster RED / corrupt shard / rejected bulk items). Unlike the
              sent-rate alerts, this catches an ES-side stall even while the
              collector's sent_* counters keep incrementing on HTTP-200 bulk
              responses with per-item failures. Telemetry is backing up and will
              be dropped. Check GET _cluster/health, the elasticsearch-obs-recovery
              CronJob (kubectl get jobs -n monitoring | grep obs-recovery), and
              GET _data_stream/{{ $labels.exporter }} write-index shard state.
