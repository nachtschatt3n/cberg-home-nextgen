---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: otel-operator
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: opentelemetry-kube-stack
      version: 0.21.0
      sourceRef:
        kind: HelmRepository
        name: opentelemetry
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      strategy: rollback
      retries: 3
  values:
    clusterName: cberg-home

    # Prometheus-operator CRD ownership (plan prometheus-crd-ownership, F-a85e8943).
    # The umbrella chart bundles an OLDER copy of servicemonitors/podmonitors/probes/
    # scrapeconfigs under charts/prometheus-crds/crds/ (a crds/ directory behind the
    # Chart.yaml condition `crds.install,crds.installPrometheus`), and Flux
    # CreateReplace re-stamped them on every chart bump, undoing kube-prometheus-stack's
    # newer set. crds/-directory objects are never Helm release resources, so `false`
    # only stops the WRITES - it deletes nothing (helm-controller crds.go:
    # ProcessDependencies runs before CRDObjects; CreateReplace never deletes).
    # kube-prometheus-stack is the single owner of all ten monitoring.coreos.com CRDs.
    # Do NOT set `crds.install` here: it precedes installPrometheus in the condition.
    crds:
      installPrometheus: false

    opentelemetry-operator:
      enabled: true
      admissionWebhooks:
        certManager:
          enabled: false
        autoGenerateCert:
          enabled: true
          recreate: true
      manager:
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 256Mi

    collectors:
      daemon:
        enabled: true
        mode: daemonset
        tolerations:
          - effect: NoSchedule
            operator: Exists
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 512Mi
        presets:
          logsCollection:
            enabled: true
          kubeletMetrics:
            enabled: true
          hostMetrics:
            enabled: true
          kubernetesAttributes:
            enabled: true
          kubernetesEvents:
            enabled: true
          clusterMetrics:
            enabled: true
        config:
          exporters:
            otlp:
              endpoint: edot-collector.monitoring.svc:4317
              tls:
                insecure: true
          service:
            pipelines:
              logs:
                exporters: [otlp]
              metrics:
                exporters: [otlp]
              traces:
                exporters: [otlp]
