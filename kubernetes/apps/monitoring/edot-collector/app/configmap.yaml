---
apiVersion: v1
kind: ConfigMap
metadata:
  name: edot-collector-config
  namespace: monitoring
data:
  otel.yml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      # Persistent sending-queue backing store (2026-08-16).
      # Before this, all three ES exporters used the DEFAULT in-memory queue:
      # otelcol_exporter_queue_capacity == 10 requests. When Elasticsearch went
      # away on 2026-08-16 10:13-10:21 that queue filled in seconds and the
      # exporter then DISCARDED everything for the rest of the outage —
      # 486,876 metric points and 222,614 log records counted by
      # otelcol_exporter_send_failed_* and gone for good. An in-memory queue also
      # evaporates entirely on pod restart. Backing the queue with bbolt on a
      # Longhorn PVC means a downstream outage BUFFERS to disk and drains when ES
      # returns, and survives a collector restart.
      file_storage/queue:
        directory: /var/lib/otelcol/sending-queue
        # The PVC mounts exactly at this path so it always exists; create_directory
        # is a guard so the collector cannot hard-fail at startup (taking ALL
        # observability down) if the mount path ever changes.
        create_directory: true
        timeout: 10s
        compaction:
          # bbolt does not return freed pages to the filesystem on its own; without
          # compaction the file only ever grows to its high-water mark. on_rebound
          # compacts once the queue drains after a spike.
          on_start: true
          on_rebound: true
          directory: /var/lib/otelcol/sending-queue
          rebound_needed_threshold_mib: 100
          rebound_trigger_threshold_mib: 10

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      # Talos kernel logs (kmsg) shipped via KmsgLogConfig as json_lines over UDP.
      # UDP (not TCP) on purpose: Talos's kmsg sender does NOT reconnect after the
      # sink closes — over TCP it gets stuck in CLOSE_WAIT and silently stops on any
      # collector restart. UDP is connectionless so it survives pod restarts.
      # Captures mce:/Hardware Error/thermal/panic lines that survive a reboot —
      # see docs/troubleshooting/node-reboot-observability.md (Tier 2).
      udplog/talos-kernel:
        listen_address: 0.0.0.0:5171
        # add_attributes => each record gets net.peer.ip = the source node
        # (192.168.55.11/12/13), the only way to attribute a kmsg line to a node
        # (Talos kmsg carries no hostname).
        add_attributes: true
        operators:
          - type: json_parser
            parse_from: body
            parse_to: attributes
            on_error: send_quiet
          - type: move
            from: attributes.msg
            to: body
            on_error: send_quiet
          - type: add
            field: attributes.log_source
            value: talos-kernel

    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 400
        spike_limit_mib: 100
      filter/drop-malformed-json-log-keys:
        error_mode: ignore
        log_conditions:
          - 'IsString(log.body) and IsMatch(log.body, "(?s)^\\s*\\{.*(?:\"\\.[^\"]*\"\\s*:|\"[^\"]*\\.\\.[^\"]*\"\\s*:|\"[^\"]*\\.\"\\s*:).*")'
      # Strip Kubernetes managedFields (server-side-apply bookkeeping) from the
      # k8s_objects Event logs that otel-operator-daemon forwards via OTLP. Their
      # metadata.managedFields.fieldsV1 tree uses "." as a key, which ES rejects
      # with document_parsing_exception ("field name cannot contain only dots") —
      # dropping the WHOLE doc (was ~0.5% of all log records). The drop-malformed
      # filter above misses these because here the body is a map, not a JSON
      # string (IsString(body) is false). managedFields is pure SSA noise, so
      # delete it and keep the useful Event. IsMap guards make it a no-op on the
      # string-bodied app logs. NB: the OTLP record body is {type, object, ...};
      # the "body.structured.*" shape seen in Elasticsearch is the otel-mode
      # exporter wrapping a map body, so the record path is body["object"], NOT
      # body["structured"]["object"]. See docs/troubleshooting/node-reboot-observability.md.
      transform/strip-k8s-managedfields:
        error_mode: ignore
        log_statements:
          - context: log
            statements:
              - delete_key(log.body["object"]["metadata"], "managedFields") where IsMap(log.body) and IsMap(log.body["object"]) and IsMap(log.body["object"]["metadata"]) and log.body["object"]["metadata"]["managedFields"] != nil
      # ES otel-mode rejects CUMULATIVE-temporality histograms — the exporter
      # logged ~9.2k/24h "dropping cumulative temporality histogram" for these
      # four (silently lost). Convert just them to delta so they index.
      # New histogram metrics that appear later will log the same drop — the
      # health-check ES-rejection assertion (added 2026-08-07) catches that.
      cumulativetodelta/es-histograms:
        include:
          match_type: strict
          metrics:
            - otelcol_processor_batch_batch_send_size
            - workqueue_queue_duration_seconds
            - workqueue_work_duration_seconds
            - controller_runtime_reconcile_time_seconds
            # Go runtime histograms, same cumulative-temporality rejection as
            # the four above (~120 validation errors/h). Confirmed still
            # dropping on collector 0.158.0: 8 distinct names, 42 occurrences
            # each per 300 log lines.
            - go_sched_latencies_seconds
            - go_sched_pauses_stopping_gc_seconds
            - go_sched_pauses_stopping_other_seconds
            - go_sched_pauses_total_gc_seconds
            - go_sched_pauses_total_other_seconds
            - go_gc_pauses_seconds
            - go_gc_heap_allocs_by_size_bytes
            - go_gc_heap_frees_by_size_bytes
            # --- Envoy Gateway (phase 0, 2026-08) ---------------------------
            # The three EG pods annotated prometheus.io/scrape are scraped by
            # otel-operator-daemon (30s) and forwarded here; ES otel-mode rejects
            # every cumulative histogram they emit. Measured 2026-08-15 over 60m:
            # 6720 drop-events/h across 34 families = 100% of ALL drops on this
            # exporter. This was INVISIBLE because the collector batches ~18 drops
            # into one "validation errors" warn line, and health-check.sh counted
            # LINES (flat at ~362/h) rather than events — fixed in the same commit.
            #
            # envoy-{internal,external} proxies (/stats/prometheus, 2 pods =>
            # 240 events/h each; the http2_* four only bind on one proxy => 120/h):
            - envoy_cluster_external_upstream_rq_time
            - envoy_cluster_http2_cookie_count
            - envoy_cluster_http2_cookie_size
            - envoy_cluster_http2_header_count
            - envoy_cluster_http2_header_list_size
            - envoy_cluster_manager_cds_update_duration
            - envoy_cluster_update_duration
            - envoy_cluster_upstream_cx_connect_ms
            - envoy_cluster_upstream_cx_length_ms
            - envoy_cluster_upstream_rq_per_cx
            - envoy_cluster_upstream_rq_time
            - envoy_http2_cookie_count
            - envoy_http2_cookie_size
            - envoy_http2_header_count
            - envoy_http2_header_list_size
            - envoy_http_downstream_cx_length_ms
            - envoy_http_downstream_rq_time
            - envoy_http_rds_update_duration
            - envoy_listener_admin_connections_accepted_per_socket_event
            - envoy_listener_admin_downstream_cx_length_ms
            - envoy_listener_connections_accepted_per_socket_event
            - envoy_listener_downstream_cx_length_ms
            - envoy_listener_manager_lds_update_duration
            - envoy_overload_refresh_interval_delay
            - envoy_sds_update_duration
            - envoy_server_initialization_time_ms
            # envoy-gateway CONTROL PLANE (/metrics, 1 pod => 120 events/h each).
            # Unprefixed, so a naive `envoy_*` sweep misses them, but they are the
            # same regression: 4 EG-native + 4 client-go histograms off the same
            # binary. Verified absent from every other scraped pod (the flux
            # controllers expose no rest_client_* histograms).
            - resource_apply_duration_seconds
            - resource_delete_duration_seconds
            - status_update_duration_seconds
            - watchable_subscribe_duration_seconds
            # xDS stream-duration histogram (EG-native #5) — first seen dropping
            # 2026-08-18 at ~120 points/h, same cumulative-temporality rejection.
            - xds_stream_duration_seconds
            - rest_client_rate_limiter_duration_seconds
            - rest_client_request_duration_seconds
            - rest_client_request_size_bytes
            - rest_client_response_size_bytes
      # ES rejects data points with Empty value type ("invalid number data
      # point ... wrong ValueType Empty" — flux_resource_info, node_network_*,
      # node_arp_entries; ~470/24h). They're untyped/info-style series that ES
      # can never store; they remain fully available in Prometheus. Drop them
      # here so they stop erroring on every batch.
      filter/drop-es-invalid-metrics:
        error_mode: ignore
        metrics:
          metric:
            - 'type == METRIC_DATA_TYPE_NONE'
            # info/label-carrier series — ES rejects its points continuously
            # ("wrong ValueType Empty"); fully available in Prometheus.
            - 'name == "flux_resource_info"'
          datapoint:
            # Prometheus STALENESS markers (NoRecordedValue points, e.g. the
            # node_network_*/node_arp_entries burst on scrape churn) — carry no
            # value by design; ES can never index them.
            - 'flags == FLAG_NO_RECORDED_VALUE'
      batch:
        send_batch_size: 1000
        send_batch_max_size: 1500
        timeout: 5s

    exporters:
      elasticsearch/logs:
        endpoints:
          - https://elasticsearch-es-http.monitoring.svc:9200
        user: elastic
        password: $${env:ES_PASSWORD}
        tls:
          insecure_skip_verify: true
        logs_index: logs-generic-default
        # Persistent queue: buffer to disk instead of discarding (see
        # file_storage/queue above). block_on_overflow is deliberate — when the
        # disk budget IS exhausted we want backpressure to the OTLP receiver
        # (which increments otelcol_receiver_refused_*, a series that exists and
        # is alerted on by OtelCollectorRecordsRefused) rather than a silent drop
        # into otelcol_exporter_enqueue_failed_*, which has no series today and
        # would therefore be undetectable by exactly the kind of rule we just
        # finished repairing.
        sending_queue:
          enabled: true
          storage: file_storage/queue
          sizer: bytes
          queue_size: 2147483648
          num_consumers: 4
          block_on_overflow: true
        # NB: the elasticsearch exporter does NOT use exporterhelper's
        # `retry_on_failure` — it has its own `retry` block with different keys
        # (validator rejects retry_on_failure outright).
        retry:
          enabled: true
          initial_interval: 5s
          max_interval: 60s
          # 0 = retry indefinitely. The default retry budget is what turned an ES
          # outage into permanent loss: retries were exhausted and the records
          # dropped. The queue's byte budget is the real bound now.
          max_retries: 0
        mapping:
          mode: otel
      elasticsearch/metrics:
        endpoints:
          - https://elasticsearch-es-http.monitoring.svc:9200
        user: elastic
        password: $${env:ES_PASSWORD}
        tls:
          insecure_skip_verify: true
        metrics_index: metrics-generic.otel-default
        # Persistent queue: buffer to disk instead of discarding (see
        # file_storage/queue above). block_on_overflow is deliberate — when the
        # disk budget IS exhausted we want backpressure to the OTLP receiver
        # (which increments otelcol_receiver_refused_*, a series that exists and
        # is alerted on by OtelCollectorRecordsRefused) rather than a silent drop
        # into otelcol_exporter_enqueue_failed_*, which has no series today and
        # would therefore be undetectable by exactly the kind of rule we just
        # finished repairing.
        sending_queue:
          enabled: true
          storage: file_storage/queue
          sizer: bytes
          queue_size: 4294967296
          num_consumers: 4
          block_on_overflow: true
        # NB: the elasticsearch exporter does NOT use exporterhelper's
        # `retry_on_failure` — it has its own `retry` block with different keys
        # (validator rejects retry_on_failure outright).
        retry:
          enabled: true
          initial_interval: 5s
          max_interval: 60s
          # 0 = retry indefinitely. The default retry budget is what turned an ES
          # outage into permanent loss: retries were exhausted and the records
          # dropped. The queue's byte budget is the real bound now.
          max_retries: 0
        mapping:
          mode: otel
      elasticsearch/traces:
        endpoints:
          - https://elasticsearch-es-http.monitoring.svc:9200
        user: elastic
        password: $${env:ES_PASSWORD}
        tls:
          insecure_skip_verify: true
        traces_index: traces-generic-default
        # Persistent queue: buffer to disk instead of discarding (see
        # file_storage/queue above). block_on_overflow is deliberate — when the
        # disk budget IS exhausted we want backpressure to the OTLP receiver
        # (which increments otelcol_receiver_refused_*, a series that exists and
        # is alerted on by OtelCollectorRecordsRefused) rather than a silent drop
        # into otelcol_exporter_enqueue_failed_*, which has no series today and
        # would therefore be undetectable by exactly the kind of rule we just
        # finished repairing.
        sending_queue:
          enabled: true
          storage: file_storage/queue
          sizer: bytes
          queue_size: 268435456
          num_consumers: 2
          block_on_overflow: true
        # NB: the elasticsearch exporter does NOT use exporterhelper's
        # `retry_on_failure` — it has its own `retry` block with different keys
        # (validator rejects retry_on_failure outright).
        retry:
          enabled: true
          initial_interval: 5s
          max_interval: 60s
          # 0 = retry indefinitely. The default retry budget is what turned an ES
          # outage into permanent loss: retries were exhausted and the records
          # dropped. The queue's byte budget is the real bound now.
          max_retries: 0
        mapping:
          mode: otel
      # Tier 2d: expose the kmsg hardware-error count to Prometheus (scraped via
      # the hwmetrics ServiceMonitor endpoint) so a PrometheusRule can alert.
      prometheus/hwerrors:
        endpoint: 0.0.0.0:8889
        send_timestamps: true
        metric_expiration: 24h

    connectors:
      # Counts Talos kmsg lines matching hardware-error patterns (MCE / machine
      # check / Hardware Error / thermal), labelled by source node, into a metric.
      count/hwerrors:
        logs:
          talos_kernel_hardware_errors:
            description: Talos kmsg hardware-error lines (mce/machine check/Hardware Error/thermal)
            conditions:
              - 'attributes["log_source"] == "talos-kernel" and IsString(body) and IsMatch(body, "(?i)(mce:|machine check|hardware error|uncorrected|cpu[0-9]+: machine check|thermal throttl|critical temperature)")'
            attributes:
              - key: net.peer.ip
          # Counts EVERY kmsg line per node, so we can tell a node has gone
          # SILENT. Added 2026-08-08 after nuc14-03 stopped shipping kmsg on
          # 08-04 and nobody noticed for 4 days — the UDP sender wedges when the
          # collector pod restarts (see docs/troubleshooting/node-reboot-
          # observability.md). A silent node means the next unexplained reboot on
          # it is undiagnosable, which is exactly what Tier 2 exists to prevent.
          talos_kernel_kmsg_lines:
            description: All Talos kmsg lines received, labelled by source node
            conditions:
              - 'attributes["log_source"] == "talos-kernel"'
            attributes:
              - key: net.peer.ip

    service:
      extensions: [health_check, file_storage/queue]
      pipelines:
        logs:
          receivers: [otlp]
          processors: [memory_limiter, filter/drop-malformed-json-log-keys, transform/strip-k8s-managedfields, batch]
          exporters: [elasticsearch/logs]
        logs/talos-kernel:
          receivers: [udplog/talos-kernel]
          processors: [memory_limiter, batch]
          # shares logs-generic-default (proven path); filter by
          # attributes.log_source=talos-kernel + attributes.net.peer.ip (node).
          # count/hwerrors also taps this stream to emit the hardware-error metric.
          exporters: [elasticsearch/logs, count/hwerrors]
        metrics/hwerrors:
          receivers: [count/hwerrors]
          processors: [batch]
          exporters: [prometheus/hwerrors]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, filter/drop-es-invalid-metrics, cumulativetodelta/es-histograms, batch]
          exporters: [elasticsearch/metrics]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [elasticsearch/traces]
      telemetry:
        logs:
          level: info
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
                    # Pin the Prometheus self-telemetry naming scheme.
                    # Because this telemetry block is configured EXPLICITLY
                    # (to set host), collector <=0.151.0 left these three at
                    # false, so self-metrics carry `_total`, unit suffixes and
                    # otel_scope_* labels. Collector 0.152.0 added
                    # applyPrometheusDefaults(), which forces all three to TRUE
                    # for explicitly-configured telemetry -- silently renaming
                    # otelcol_exporter_sent_{log_records,metric_points}_total to
                    # drop `_total`.
                    #
                    # kube-prometheus-stack/app/otel-collector-alerts.yaml lines
                    # 137 and 154 (the ES metrics/logs INGESTION-STALL detectors)
                    # match on the `_total` names. They are `rate(...) == 0`
                    # alerts, so a renamed metric yields an empty vector and the
                    # alert simply never fires -- we would lose exactly the
                    # detectors that catch silent telemetry loss, without any
                    # error to notice.
                    #
                    # Setting them false explicitly preserves today's names
                    # across the upgrade, so no alert rules need to change (and
                    # kube-prometheus-stack stays untouched in this window).
                    # Validated by `otelcol validate` in a throwaway pod on BOTH
                    # 0.147.0 and 0.158.0: accepted by both.
                    without_type_suffix: false
                    without_units: false
                    without_scope_info: false
