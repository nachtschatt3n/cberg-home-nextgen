---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edot-collector
  namespace: monitoring
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app: edot-collector
spec:
  replicas: 1
  # MANDATORY once this pod mounts an RWO Longhorn PVC (edot-collector-queue):
  # at replicas: 1 the default RollingUpdate rounds maxSurge UP to 1, so the new
  # pod is scheduled before the old one detaches the volume; if it lands on
  # another node it blocks forever on Multi-Attach.
  # See docs/sops/longhorn-rwo-multi-attach.md.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: edot-collector
  template:
    metadata:
      annotations:
        cberg.dev/rollout-revision: "2026-08-16.1"
      labels:
        app: edot-collector
    spec:
      automountServiceAccountToken: false
      # The collector image runs as 10001:10001. Stated explicitly so fsGroup can
      # chown the Longhorn ext4 volume — without it the bbolt queue file cannot be
      # created and the collector crashloops on start.
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: edot-collector
          image: otel/opentelemetry-collector-contrib:0.158.0
          args:
            - --config=/config/otel.yml
          ports:
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
            - name: health
              containerPort: 13133
              protocol: TCP
            - name: talos-kmsg
              containerPort: 5171
              protocol: UDP
            - name: hwmetrics
              containerPort: 8889
              protocol: TCP
          env:
            - name: ES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-es-elastic-user
                  key: elastic
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: queue
              mountPath: /var/lib/otelcol/sending-queue
          readinessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: edot-collector-config
        - name: queue
          persistentVolumeClaim:
            claimName: edot-collector-queue
