---
# dashcast (HuskerMinion/techo5, folder dashcast/, MIT): headless Chrome that
# renders Home Assistant dashboards and streams them to TECHO5 screens (Echo
# Show) over its own Noise-encrypted TCP protocol on :9555. Not HTTP, so no
# HTTPRoute, no Authentik, no Homepage entry. LAN-only LoadBalancer; the port
# must never be forwarded from the router.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dashcast
  namespace: home-automation
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      dashcast:
        # HA_TOKEN = dedicated non-admin HA user (set 2026-11-17, 6c000c524).
        replicas: 1
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/huskerminion/techo5-dashcast
              tag: v1.6.46@sha256:6c780d5d06b5d022caafda0a0bbbc6f87fda9c00b460bc85a44b16ff59870465
            env:
              TZ: "Europe/Berlin"
              LISTEN: ":9555"
            # HA_URL (in-cluster HA Service URL), HA_TOKEN and DASHCAST_KEY come
            # from the SOPS secret. HA_URL lives there only because the cluster
            # Service URL also appears as a Secret value elsewhere and trips the
            # pre-commit literal scanner; it is not itself sensitive.
            envFrom:
              - secretRef:
                  name: dashcast-secret
            # Silent exec probe: checks the :9555 (0x2553) listen socket in
            # /proc instead of a tcpSocket probe. A bare TCP connect is a failed
            # Noise handshake to dashcast and would emit a "device failed the
            # handshake" warning every minute, masking real wrong-key attempts.
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["/bin/sh", "-c", "grep -qE ':2553 [0-9A-F]+:0000 0A' /proc/net/tcp6 /proc/net/tcp"]
                  initialDelaySeconds: 15
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["/bin/sh", "-c", "grep -qE ':2553 [0-9A-F]+:0000 0A' /proc/net/tcp6 /proc/net/tcp"]
                  initialDelaySeconds: 5
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            # ~150-250 MB per connected screen (upstream), up to 8 screens.
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
        pod:
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            runAsNonRoot: true
            fsGroup: 65534
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: dashcast
        type: LoadBalancer
        externalTrafficPolicy: Cluster
        annotations:
          # LAN-only (VLAN 55, Cilium L2). TECHO5 devices on IoT VLAN 30 connect here.
          lbipam.cilium.io/ips: "192.168.55.32"
        ports:
          dashcast:
            protocol: TCP
            port: 9555
            targetPort: 9555
    persistence:
      # Chrome profile + HOME=/tmp (root fs is read-only).
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      # Chrome needs >=256 MB shared memory.
      shm:
        type: emptyDir
        medium: Memory
        sizeLimit: 256Mi
        globalMounts:
          - path: /dev/shm
