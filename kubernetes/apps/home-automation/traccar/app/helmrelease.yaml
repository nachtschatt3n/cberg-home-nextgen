---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traccar
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  maxHistory: 1
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: false
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  dependsOn:
    - name: traccar-postgres
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: traccar/traccar
              tag: "6.15.3"
            # Wrapper to surface Traccar's file-based logs to stdout for kubectl logs
            command:
              - /bin/sh
              - -c
              - |
                cd /opt/traccar
                ./jre/bin/java -jar tracker-server.jar conf/traccar.xml &
                JAVA_PID=$!
                sleep 3
                tail -f logs/tracker-server.log &
                wait $JAVA_PID
            env:
              - name: TZ
                value: "Europe/Berlin"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/server
                    port: &port 8082
                  initialDelaySeconds: 60
                  periodSeconds: 30
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/server
                    port: *port
                  initialDelaySeconds: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi

    service:
      main:
        controller: main
        type: ClusterIP
        ports:
          http:
            port: *port
      osmand:
        controller: main
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: "192.168.55.31"
        ports:
          osmand:
            port: 5055
            protocol: TCP

    # Envoy migration PHASE 3 — moved to envoy-external (2026-09-07).
    #
    # NO external-dns target annotation on the route, deliberately: with
    # --source=gateway-httproute external-dns reads the target from the parent
    # GATEWAY and silently ignores it on the route. It is already set on
    # Gateway/envoy-external. (Proven 2026-09-07: putting it on a route took a
    # hostname dark publicly.)
    #
    # NO SecurityPolicy. This app authenticates in-app and never had nginx
    # forward-auth; ext-auth would add a second login in front of the app's own.
    route:
      main:
        kind: HTTPRoute
        hostnames:
          - "traccar.${SECRET_DOMAIN}"
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: Gateway
            name: envoy-external
            namespace: network
            # https only. The http listener is owned cluster-wide by
            # httproute-https-redirect, which 301s every host.
            sectionName: https
        labels:
          gethomepage.dev/enabled: "true"
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "Traccar"
          gethomepage.dev/group: "Home Automation"
          gethomepage.dev/icon: "mdi-map-marker-path"
          gethomepage.dev/description: "AirTag GPS tracking"
        # Rule is MANDATORY here: this release enables TWO Services (main and
        # the osmand LoadBalancer), so the chart's "omit rules" shortcut
        # hard-fails in _validate.tpl. Only `main` serves this hostname —
        # osmand is the raw device-tracker port and must not be published here.
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: main
                port: http

    persistence:
      # traccar.xml (with DB password) stored in SOPS-encrypted secret
      traccar-config:
        type: secret
        name: traccar-secret
        advancedMounts:
          main:
            main:
              - path: /opt/traccar/conf/traccar.xml
                subPath: traccar.xml
      logs:
        type: emptyDir
        globalMounts:
          - path: /opt/traccar/logs
