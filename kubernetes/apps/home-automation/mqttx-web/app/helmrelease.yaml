apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mqttx-web
  namespace: home-automation
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      mqttx-web:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: emqx/mqttx-web
              tag: v1.13.0  # v1.13.3 is a GitHub release only; not published to Docker Hub (latest image tag is v1.13.0)
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false # Nginx might need to write logs or temp files
              capabilities: { drop: ["ALL"] }
    service:
      app:
        controller: mqttx-web
        ports:
          http:
            port: 80
    # Envoy Gateway migration phase 2 (2026-09-07): Ingress -> HTTPRoute.
    # Both halves in ONE commit -- k8s-gateway watches Ingress AND HTTPRoute,
    # so leaving the Ingress alongside the route gives this host two records
    # (.100 nginx and .103 envoy) and it resolves non-deterministically.
    #
    # The postRenderers block that used to sit above is REMOVED, not retargeted.
    # It existed solely to bolt gethomepage.dev/enabled onto the RENDERED
    # Ingress, because the ingress values here carried no labels: key. With no
    # Ingress rendered its target matches nothing, and a kustomize patch that
    # matches nothing fails the WHOLE post-render -- the HelmRelease would stop
    # installing. app-template's route object takes labels natively, so the
    # workaround has no reason to exist any more.
    route:
      main:
        kind: HTTPRoute
        hostnames:
          - "mqtt-web.${SECRET_DOMAIN}"
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: Gateway
            name: envoy-internal
            namespace: network
            # https only. The http listener is owned cluster-wide by
            # httproute-https-redirect, which 301s every host.
            sectionName: https
        labels:
          gethomepage.dev/enabled: "true"
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "MQTTX Web"
          gethomepage.dev/description: "Web-based MQTT 5.0 client tool"
          gethomepage.dev/group: "Home Automation"
          gethomepage.dev/icon: "mqtt.png"
        # Rule written out explicitly rather than relying on the chart's
        # single-Service default: that shortcut only holds while exactly one
        # Service is enabled, and _validate.tpl hard-fails the moment a
        # second one appears.
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: app
                port: http
