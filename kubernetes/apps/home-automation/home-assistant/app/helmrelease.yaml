apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
  namespace: home-automation
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      home-assistant:
        pod:
          hostNetwork: true
          dnsPolicy: ClusterFirstWithHostNet
        initContainers:
          # Recent home-assistant images dropped "DigiCert Global Root CA" (the
          # legacy 2006 root) from the certifi bundle, keeping only Global Root
          # G2/G3. api.wyzecam.com serves a valid chain terminating at that
          # legacy root, so the wyzeapi integration fails device-list TLS
          # verification. This init copies the image's certifi bundle to the
          # patched-ca emptyDir, appends the missing root, and drops in the
          # sitecustomize.py shim (from the extra-ca ConfigMap) that redirects
          # certifi.where() to the patched bundle.
          # IMPORTANT: the patched bundle lives at a NEUTRAL path
          # (/patched-ca/cacert.pem) — never mount it over certifi's own
          # site-packages file. Since certifi 2026.7.22, HA's runtime installer
          # (uv/pip) upgrades certifi at boot; a rename over a subPath-mounted
          # cacert.pem fails with EBUSY "Resource busy (os error 16)" and kills
          # requirements install for every HACS integration that pulls certifi
          # (alexa_devices, dirigera_platform, dwd_weather, custom_conversation).
          certifi-patch:
            image:
              repository: ghcr.io/home-assistant/home-assistant
              tag: 2026.9.0
            command:
              - /bin/sh
              - -c
              - |
                set -eu
                SRC="$(python3 -c 'import certifi; print(certifi.where())')"
                cp "$SRC" /patched-ca/cacert.pem
                if ! grep -q "BEGIN CERTIFICATE" /extra-ca/digicert-global-root-ca.pem; then
                  echo "extra-ca configMap missing a PEM certificate" >&2; exit 1
                fi
                printf '\n' >> /patched-ca/cacert.pem
                cat /extra-ca/digicert-global-root-ca.pem >> /patched-ca/cacert.pem
                cp /extra-ca/sitecustomize.py /patched-ca/sitecustomize.py
                # Self-test: with PYTHONPATH=/patched-ca (as set on the app
                # container) certifi.where() must resolve to the patched bundle.
                GOT="$(PYTHONPATH=/patched-ca python3 -c 'import certifi; print(certifi.where())')"
                if [ "$GOT" != "/patched-ca/cacert.pem" ]; then
                  echo "sitecustomize redirect failed: certifi.where() -> $GOT" >&2; exit 1
                fi
                echo "patched certifi bundle: $(grep -c 'BEGIN CERTIFICATE' /patched-ca/cacert.pem) certs; certifi.where() redirected OK"
        containers:
          app:
            image:
              repository: ghcr.io/home-assistant/home-assistant
              tag: 2026.9.0
            env:
              - name: TZ
                value: "Europe/Berlin"
              # TLS trust patch — both consumer paths point at the NEUTRAL
              # patched bundle (see certifi-patch init):
              # 1. HA core's util.ssl.client_context() hardcodes certifi.where()
              #    and ignores SSL_CERT_FILE → covered by the sitecustomize.py
              #    shim loaded via PYTHONPATH (redirects certifi.where()).
              # 2. Integrations' own aiohttp.ClientSession()/requests use the
              #    OpenSSL default context / system store, which honors
              #    SSL_CERT_FILE / REQUESTS_CA_BUNDLE.
              - name: SSL_CERT_FILE
                value: "/patched-ca/cacert.pem"
              - name: REQUESTS_CA_BUNDLE
                value: "/patched-ca/cacert.pem"
              - name: PYTHONPATH
                value: "/patched-ca"
            resources:
              requests:
                cpu: 1000m
                memory: 2Gi
              limits:
                memory: 4Gi
    service:
      main:
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: "192.168.55.24"
        controller: home-assistant
        ports:
          http:
            port: 8123
            primary: true
          colot:
            enabled: true
            protocol: UDP
            port: 5683
    ingress:
      main:
        enabled: true
        className: external
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "Home Assistant"
          gethomepage.dev/description: "Open source home automation platform"
          gethomepage.dev/group: "Home Automation"
          gethomepage.dev/icon: "home-assistant.png"
          external-dns.alpha.kubernetes.io/target: "external.${SECRET_DOMAIN}"
        labels:
          gethomepage.dev/enabled: "true"
        hosts:
          - host: "hass.${SECRET_DOMAIN}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: main
                  port: http
    persistence:
      config:
        enabled: true
        type: persistentVolumeClaim
        existingClaim: home-assistant-config
        advancedMounts:
          home-assistant:
            app:
              - path: /config
      # Public DigiCert Global Root CA, consumed only by the certifi-patch init.
      extra-ca:
        type: configMap
        name: home-assistant-extra-ca
        advancedMounts:
          home-assistant:
            certifi-patch:
              - path: /extra-ca
                readOnly: true
      # Shared scratch: init writes the patched certifi bundle + the
      # sitecustomize.py shim here; the app container mounts the whole dir at a
      # neutral path. Do NOT subPath-mount anything over certifi's file in
      # site-packages — HA's runtime installer upgrades certifi at boot and a
      # rename over a mounted file fails with EBUSY (os error 16), breaking
      # requirements install for HACS integrations.
      patched-ca:
        type: emptyDir
        advancedMounts:
          home-assistant:
            certifi-patch:
              - path: /patched-ca
            app:
              - path: /patched-ca
                readOnly: true
