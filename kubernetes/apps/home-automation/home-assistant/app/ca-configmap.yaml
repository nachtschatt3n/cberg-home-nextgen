  # Loaded at interpreter startup in every Python process of the app container
  # via PYTHONPATH=/patched-ca (the certifi-patch init copies it there).
  # Redirects certifi.where()/contents() to the patched bundle so HA core's
  # client_context() — which ignores SSL_CERT_FILE — still trusts the appended
  # legacy root, even after pip/uv replaces certifi in site-packages at runtime
  # (a fresh certifi install ships WITHOUT DigiCert Global Root CA).
  sitecustomize.py: |
    """certifi.where() redirect shim — see helmrelease.yaml (certifi-patch)."""
    import os

    _BUNDLE = "/patched-ca/cacert.pem"

    if os.path.isfile(_BUNDLE):
        try:
            import certifi
            import certifi.core as _core

            def _where() -> str:
                return _BUNDLE

            def _contents() -> str:
                with open(_BUNDLE, encoding="ascii") as f:
                    return f.read()

            certifi.where = _where
            certifi.contents = _contents
            _core.where = _where
            _core.contents = _contents
        except Exception:
            # Never break interpreter startup; worst case is stock certifi.
            pass
