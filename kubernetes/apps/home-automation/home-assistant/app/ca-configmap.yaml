---
apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-extra-ca
  namespace: home-automation
data:
  # DigiCert Global Root CA (public trust anchor, PUBLIC certificate — not a secret).
  # Removed from the certifi bundle and Alpine ca-certificates shipped in recent
  # home-assistant images (Alpine 3.24 / certifi ships Global Root G2/G3 only).
  # api.wyzecam.com serves a complete chain that terminates at this legacy root,
  # so the wyzeapi integration fails device-list TLS verification without it.
  # The certifi-patch initContainer appends this root to a copy of the certifi
  # bundle at /patched-ca/cacert.pem (a neutral path OUTSIDE site-packages, so
  # pip/uv can upgrade certifi at runtime without hitting a mount — EBUSY).
  # HA core's util.ssl.client_context() hardcodes certifi.where() and ignores
  # SSL_CERT_FILE, so certifi.where() is redirected to the patched bundle via
  # the sitecustomize.py shim below (loaded through PYTHONPATH=/patched-ca).
  digicert-global-root-ca.pem: |
