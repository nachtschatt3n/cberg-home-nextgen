apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zigbee2mqtt
  namespace: home-automation
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      zigbee2mqtt:
        containers:
          app:
            image:
              repository: koenkk/zigbee2mqtt
              #tag: "1.35.3"
              tag: "2.14.1"
            env:
              - name: ZIGBEE2MQTT_DATA
                value: "/data"
              - name: ZIGBEE2MQTT_CONFIG_MQTT_SERVER
                # In-cluster consumer: use the ClusterIP service, not the
                # LoadBalancer. mosquitto-main (192.168.55.15) is reserved
                # for LAN clients (HA on host network, Frigate, Scrypted);
                # zigbee2mqtt runs in-cluster and should hit the broker
                # without the LB hop. Matches the pattern used by
                # teslamate and solarfocus-scraper.
                value: "mqtt://mosquitto-internal.home-automation.svc.cluster.local:1883"
              - name: ZIGBEE2MQTT_CONFIG_SERIAL_PORT
                value: "tcp://192.168.32.20:6638"
              - name: ZIGBEE2MQTT_CONFIG_SERIAL_ADAPTER
                value: "zstack"
              - name: ZIGBEE2MQTT_CONFIG_SERIAL_BAUDRATE
                value: "115200"
              - name: TZ
                value: "Europe/Berlin"
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: 200m
                memory: 256Mi
    service:
      main:
        controller: zigbee2mqtt
        ports:
          http:
            port: 8080
    # Envoy Gateway migration phase 2 (2026-09-07): Ingress -> HTTPRoute.
    # Both halves in ONE commit -- k8s-gateway watches Ingress AND HTTPRoute,
    # so leaving the Ingress alongside the route gives this host two records
    # (.100 nginx and .103 envoy) and it resolves non-deterministically.
    #
    # DROPPED: external-dns.alpha.kubernetes.io/hostname. It was already inert
    # on this object -- external-dns runs with --ingress-class=external and this
    # Ingress was class `internal`, and there is in fact no public record for
    # the host (verified against 1.1.1.1: NXDOMAIN, no k8s. TXT registry entry).
    # Carrying it onto an HTTPRoute would be worse than inert: external-dns also
    # runs --source=gateway-httproute, and the only thing keeping it from
    # publishing this route is the --gateway-name=envoy-external filter. One
    # flag change away, that annotation would put a PRIVATE address (the
    # envoy-internal LB, 192.168.55.103) into public Cloudflare DNS. Removing it
    # keeps today's behaviour identical and removes the latent hazard.
    #
    # pathType ImplementationSpecific becomes PathPrefix "/" -- on a bare "/"
    # nginx already treated it as a prefix match. The frontend's websocket rides
    # HTTP/1.1 Upgrade, which Envoy passes through; no websocket annotation
    # existed here to carry over.
    route:
      main:
        kind: HTTPRoute
        hostnames:
          - "zigbee2mqtt.${SECRET_DOMAIN}"
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: Gateway
            name: envoy-internal
            namespace: network
            # https only. The http listener is owned cluster-wide by
            # httproute-https-redirect, which 301s every host.
            sectionName: https
        labels:
          gethomepage.dev/enabled: "true"
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "Zigbee2MQTT"
          gethomepage.dev/description: "Zigbee to MQTT bridge"
          gethomepage.dev/group: "Home Automation"
          gethomepage.dev/icon: "zigbee2mqtt.png"
        # Rule written out explicitly rather than relying on the chart's
        # single-Service default: that shortcut only holds while exactly one
        # Service is enabled, and _validate.tpl hard-fails the moment a
        # second one appears.
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: main
                port: http
    persistence:
      data:
        enabled: true
        existingClaim: zigbee2mqtt-data
        globalMounts:
          - path: /data
