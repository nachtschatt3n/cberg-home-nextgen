---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-red
  namespace: home-automation
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    defaultPodOptions:
      securityContext:
        runAsUser: 0
    controllers:
      node-red:
        containers:
          app:
            image:
              repository: nodered/node-red
              tag: 5.0.7
            env:
              - name: TZ
                value: "${TIMEZONE}"
              - name: NODE_RED_ENABLE_PROJECTS
                value: "true"
              - name: NODE_RED_ENABLE_SAFE_MODE
                value: "false"
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                memory: 1Gi
    service:
      main:
        controller: node-red
        ports:
          http:
            port: 1880
    # Envoy Gateway migration phase 2 (2026-09-07): Ingress -> HTTPRoute.
    # Both halves in ONE commit -- k8s-gateway watches Ingress AND HTTPRoute,
    # so leaving the Ingress alongside the route gives this host two records
    # (.100 nginx and .103 envoy) and it resolves non-deterministically.
    #
    # pathType ImplementationSpecific becomes PathPrefix "/". Under nginx,
    # ImplementationSpecific on a bare "/" already behaved as a prefix match,
    # so this is the same routing, spelled in the only vocabulary the Gateway
    # API has. Node-RED's editor websocket (/comms) rides HTTP/1.1 Upgrade,
    # which Envoy passes through on a plain HTTPRoute -- no annotation existed
    # here to carry over.
    route:
      main:
        kind: HTTPRoute
        hostnames:
          - "node.${SECRET_DOMAIN}"
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: Gateway
            name: envoy-internal
            namespace: network
            # https only. The http listener is owned cluster-wide by
            # httproute-https-redirect, which 301s every host.
            sectionName: https
        labels:
          gethomepage.dev/enabled: "true"
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "Node-RED"
          gethomepage.dev/description: "Flow-based programming tool for wiring together hardware devices, APIs and online services"
          gethomepage.dev/group: "Home Automation"
          gethomepage.dev/icon: "node-red.png"
        # Rule written out explicitly rather than relying on the chart's
        # single-Service default: that shortcut only holds while exactly one
        # Service is enabled, and _validate.tpl hard-fails the moment a
        # second one appears.
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: main
                port: http
    persistence:
      data:
        enabled: true
        existingClaim: node-red-data
        globalMounts:
          - path: /data
