apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: otbr
  namespace: home-automation
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      otbr:
        # Re-enabled 2026-09-03 on a WIRED radio. History: the original
        # SLZB-06P7 (192.168.32.70) lost its Ethernet port in 2026-05 and on
        # WiFi the spinel-over-TCP RCP link crashlooped otbr-agent
        # (48-378ms jitter; re-measured 2026-09-03: avg 98ms / max 260ms).
        # The Thread RCP MUST stay on Ethernet: a flapping TCP RCP leaves
        # stale routes on this host for up to 30 min and makes Thread devices
        # unreachable for matter-server (same node). Now points at a second,
        # Ethernet-attached SLZB-06P7 (192.168.33.238, 0.8ms / 0.5ms jitter
        # from k8s-nuc14-03). If NETWORK_DEVICE ever moves to a WiFi unit,
        # scale back to 0 instead.
        replicas: 1
        pod:
          hostNetwork: true
          dnsPolicy: ClusterFirstWithHostNet
          nodeSelector:
            kubernetes.io/hostname: k8s-nuc14-03
        containers:
          app:
            image:
              repository: ghcr.io/ownbee/hass-otbr-docker
              tag: v0.3.0
            env:
              - name: TZ
                value: "Europe/Berlin"
              - name: NETWORK_DEVICE
                value: "192.168.33.238:6638"  # SLZB-06P7 "SLZB-06 Matter-over-Thread", Ethernet
              - name: DEVICE
                value: "/tmp/ttyOTBR"
              - name: BAUDRATE
                value: "115200"
              - name: BACKBONE_IF
                value: "enp86s0"
              - name: OTBR_REST_PORT
                value: "8081"
            securityContext:
              privileged: true
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                memory: 256Mi
    persistence:
      data:
        enabled: true
        suffix: data
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 1Gi
        storageClass: longhorn
        advancedMounts:
          otbr:
            app:
              - path: /data
    service:
      main:
        controller: otbr
        ports:
          http:
            port: 8081
    ingress:
      main:
        enabled: true
        className: internal
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "Thread Border Router"
          gethomepage.dev/description: "OpenThread Border Router (SLZB-06P7 RCP, 192.168.33.238)"
          gethomepage.dev/group: "Home Automation"
          gethomepage.dev/icon: "thread.png"
        labels:
          gethomepage.dev/enabled: "true"
        hosts:
          - host: "otbr.${SECRET_DOMAIN}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: main
                  port: http
