apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: scrypted
  namespace: home-automation
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      scrypted:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: koush/scrypted
              tag: v0.143.0-noble-full
            env:
              # WITHOUT THIS, SCRYPTED PERSISTS NOTHING. Scrypted's default
              # SCRYPTED_VOLUME is /server/volume, which is on the container's
              # EPHEMERAL overlay — not on either PVC. Verified on the live pod
              # 2026-09-06: /proc/mounts showed only /data (Longhorn) and /media
              # (CIFS); /server/volume held 16 KB of scrypted.db recreated at
              # that pod's start, while the scrypted-data PVC contained nothing
              # but lost+found. So every camera, plugin and user this NVR has
              # ever been given was discarded at the next restart, and it had
              # been that way since deployment.
              # Fixed NOW rather than later precisely because the NVR is empty:
              # there is no state to migrate, so this is the cheapest it will
              # ever be. Once cameras exist, changing the volume path means
              # moving live state.
              - name: SCRYPTED_VOLUME
                value: /data
              - name: SCRYPTED_DEBUG
                value: "true"
              - name: SCRYPTED_DEBUG_LEVEL
                value: "info"
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            securityContext:
              privileged: true
              capabilities:
                add:
                  - SYS_ADMIN
              allowPrivilegeEscalation: true
              runAsUser: 0
              runAsGroup: 0
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
                gpu.intel.com/i915: 1
              limits:
                cpu: 2000m
                memory: 1Gi
                gpu.intel.com/i915: 1
    service:
      main:
        controller: scrypted
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: "192.168.55.26"
        ports:
          web:
            protocol: TCP
            enabled: true
            port: 11080
            targetPort: 11080
    ingress:
      scrypted:
        enabled: true
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "Scrypted"
          gethomepage.dev/description: "Scrypted is a home automation platform that supports various camera and device integrations"
          gethomepage.dev/group: "Home Automation"
          gethomepage.dev/icon: "scrypted.png"
        labels:
          gethomepage.dev/enabled: "true"
        hosts:
          - host: "scrypted.${SECRET_DOMAIN}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  name: scrypted
                  port: 11080
    persistence:
      data:
        enabled: true
        existingClaim: scrypted-data
      media:
        enabled: true
        existingClaim: scrypted-media
    extraVolumes:
      - name: dev-dri
        hostPath:
          path: /dev/dri
          type: Directory
    extraVolumeMounts:
      - name: dev-dri
        mountPath: /dev/dri
