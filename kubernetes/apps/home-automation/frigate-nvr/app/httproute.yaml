---
# Envoy migration phase 2 — frigate off nginx (forward-auth). Last of the ten.
# Pattern + gotchas: docs/sops/gateway-api-httproute.md
#
# The Service exposes 5000/8971/1935/8554/8555 (UI, auth, RTMP, RTSP, WebRTC),
# but only 5000 was ever routed through the ingress — the streaming ports are
# reached directly on the Service and are untouched by this change.
#
# Frigate carried NO nginx timeout annotations, so it ran on nginx's 60s
# default. The gateway-wide BackendTrafficPolicy sets requestTimeout: 60s, so
# live-view behaviour is unchanged rather than silently tightened to Envoy's
# 15s default.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frigate
  namespace: home-automation
  labels:
    gethomepage.dev/enabled: "true"
  annotations:
    gethomepage.dev/description: "Frigate NVR is a home surveillance system"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: "Home Automation"
    gethomepage.dev/icon: "frigate.png"
    gethomepage.dev/name: "Frigate NVR"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - "frigate.${SECRET_DOMAIN}"
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - group: ""
          kind: Service
          name: frigate
          port: 5000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frigate-authentik-outpost
  namespace: home-automation
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - "frigate.${SECRET_DOMAIN}"
  rules:
    - matches:
        - path: { type: PathPrefix, value: /outpost.goauthentik.io }
      backendRefs:
        - group: ""
          kind: Service
          name: ak-outpost-frigate-forward-auth
          namespace: kube-system
          port: 9000
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: frigate-forward-auth
  namespace: home-automation
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: frigate
  extAuth:
    failOpen: false            # camera feeds must never publish on outpost loss
    http:
      backendRefs:
        - group: ""
          kind: Service
          name: ak-outpost-frigate-forward-auth
          namespace: kube-system
          port: 9000
      path: /outpost.goauthentik.io/auth/envoy
      headersToBackend:
        - Set-Cookie
        - X-authentik-username
        - X-authentik-groups
        - X-authentik-email
        - X-authentik-name
        - X-authentik-uid
