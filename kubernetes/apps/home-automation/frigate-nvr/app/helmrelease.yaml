---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: frigate
  namespace: home-automation
spec:
  interval: 30m
  chart:
    spec:
      chart: frigate
      version: 7.8.0
      sourceRef:
        kind: HelmRepository
        name: blakeblackshear
        namespace: flux-system
  maxHistory: 3
  install:
    remediation:
      retries: 1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 1
  uninstall:
    keepHistory: false

  # Frigate reads /config/config.yml ONCE at process start, and that file comes
  # from the frigate-config ConfigMap. A ConfigMap-only change therefore lands in
  # the API, reconciles green in Flux, and the running process keeps using the old
  # config until something restarts it. During the 2026-09-04 gemma4 GGUF->MLX
  # migration the ConfigMap said 26b-mlx while the live process was still sending
  # vision requests to the GGUF; the only thing that would have fixed it on its own
  # was the 02:30 frigate-restart CronJob, hours later. Reloader closes that window.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: frigate
            patch: |
              - op: add
                path: /metadata/annotations/reloader.stakater.com~1auto
                value: "true"
  values:
    image:
      repository: ghcr.io/blakeblackshear/frigate
      tag: 0.17.2
    env:
      TZ: "Europe/Berlin"
      LIBVA_DRIVER_NAME: "iHD"
      OPENAI_BASE_URL: "http://192.168.30.111:11434/v1"
      # Cap glibc malloc arenas at one. frigate runs ~177 threads and per-thread
      # arenas fragment badly; upstream discussion #23007 measures steady-state RSS
      # roughly halved. This is glibc behaviour, NOT the CUDA pinned-host-memory
      # theory in that thread — we run OpenVINO on the NPU and that part does not
      # apply to us. Attacks the BASELINE, not the growth rate.
      # TRADE-OFF: one arena serialises malloc across those threads. If detection
      # throughput regresses, revert THIS LINE ONLY — the daily restart and the
      # 10Gi headroom stand on their own.
      MALLOC_ARENA_MAX: "1"

    # Frigate configuration is now in ConfigMap (frigate-config)
    # Mount the ConfigMap as a volume to /config/config.yml

    # Configure persistence for recordings, database, etc.
    persistence:
      config:
        enabled: true
        existingClaim: frigate-config
      media:
        enabled: true
        existingClaim: frigate-media

    # Service configuration
    # Port 5000: Unauthenticated internal access (Home Assistant)
    # Port 8971: Authenticated web UI (external via ingress) - exposed via separate service-auth.yaml
    service:
      type: ClusterIP
      port: 5000

    # Ingress configuration
    ingress:
      enabled: false
      ingressClassName: internal
      hosts:
        - host: frigate.example.com
          paths:
            - path: "/"
              pathType: Prefix
              portName: http



    # Resource requests and limits
    # GPU stays for VAAPI video decoding; NPU added for OpenVINO object detection
    # (detector device flipped GPU → NPU in ConfigMap on 2026-05-01).
    resources:
      requests:
        cpu: 1000m
        memory: 1Gi
        gpu.intel.com/i915: 1
        npu.intel.com/accel: 1
      limits:
        memory: 10Gi    # was 8Gi. NOT the fix — the daily restart is. This is headroom
                        # so ONE missed restart degrades into a warning instead of an
                        # ENOMEM incident. Request stays 1Gi, so scheduling is unchanged.
        gpu.intel.com/i915: 1
        npu.intel.com/accel: 1

    # Set shared memory size for ffmpeg
    shmSize: "2Gi"
    securityContext:
      privileged: true
      capabilities:
        add:
          - SYS_ADMIN
      allowPrivilegeEscalation: true

    extraVolumes:
      - name: dev-dri
        hostPath:
          path: /dev/dri
          type: Directory
      - name: frigate-config-map
        configMap:
          name: frigate-config

    extraVolumeMounts:
      - name: dev-dri
        mountPath: /dev/dri
      - name: frigate-config-map
        mountPath: /config/config.yml
        subPath: config.yml
        readOnly: true

    nodeSelector:
      kubernetes.io/hostname: k8s-nuc14-02
