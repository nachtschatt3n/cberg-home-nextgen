---
# Envoy migration — ha-ai-harness onto envoy-internal.
#
# Annotation notes: proxy-http-version 1.1 — Envoy already speaks HTTP/1.1 to backends by default
#   Body-size limits have no route-level equivalent; Envoy streams uncapped
#   unless a requestBuffer is set and none is, so this loosens rather than
#   breaks. A cap would have to be Gateway-scoped and hit every other app.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ha-ai-harness
  namespace: home-automation
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - "ha-harness.${SECRET_DOMAIN}"
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - group: ""
          kind: Service
          name: ha-ai-harness-frontend
          port: 5173
      timeouts:
        # Replaces nginx proxy-read/send-timeout: 3600. Left off, the route
        # inherits the gateway-wide 60s default — a tightening invisible to a
        # `curl /` check.
        request: 3600s
        backendRequest: 3600s
