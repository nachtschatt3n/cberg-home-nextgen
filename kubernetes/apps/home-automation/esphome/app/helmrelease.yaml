---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: esphome
  namespace: home-automation
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      esphome:
        pod:
          hostNetwork: true
          dnsPolicy: ClusterFirstWithHostNet
        containers:
          app:
            image:
              repository: ghcr.io/esphome/esphome
              tag: "2026.8.2"
            env:
              - name: TZ
                value: "Europe/Berlin"
            resources:
              # ESPHome compiles ESP32 firmware in-pod (PlatformIO/gcc), which is
              # far heavier than the idle dashboard. At 512Mi/200m a compile OOMKilled
              # (exit 137) ~74s after start, and because the dashboard auto-resumes the
              # queued job on boot it re-entered the same build and crash-looped.
              # Requests stay low (idle dashboard footprint, keeps scheduling honest);
              # limits give the build room to burst.
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                cpu: "4"
                memory: 4Gi
    service:
      main:
        controller: esphome
        ports:
          http:
            port: 6052
    ingress:
      main:
        enabled: false  # Using separate ingress.yaml for Authentik integration
    persistence:
      config:
        enabled: true
        existingClaim: esphome-config
        globalMounts:
          - path: /config
  valuesFrom:
    - kind: Secret
      name: esphome-values
      valuesKey: values.yaml
