---
# Envoy migration phase 2 — esphome off nginx (forward-auth).
# Pattern + the gotchas: docs/sops/gateway-api-httproute.md
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: esphome
  namespace: home-automation
  labels:
    gethomepage.dev/enabled: "true"
  annotations:
    gethomepage.dev/description: "ESPHome dashboard"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: "Home Automation"
    gethomepage.dev/icon: "esphome.png"
    gethomepage.dev/name: "ESPHome"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - "esphome.${SECRET_DOMAIN}"
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - group: ""
          kind: Service
          name: esphome
          port: 6052
---
# Callback route — separate and MORE specific than `/`; Gateway API resolves by
# longest match, so folding it in would loop the login callback into the app.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: esphome-authentik-outpost
  namespace: home-automation
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - "esphome.${SECRET_DOMAIN}"
  rules:
    - matches:
        - path: { type: PathPrefix, value: /outpost.goauthentik.io }
      backendRefs:
        # Real Service cross-namespace, NOT an ExternalName shim — Envoy
        # resolves backends via EndpointSlices and ExternalName has none.
        - group: ""
          kind: Service
          name: ak-outpost-esphome-forward-auth
          namespace: kube-system
          port: 9000
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: esphome-forward-auth
  namespace: home-automation
spec:
  targetRefs:                    # app route ONLY, never the callback route
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: esphome
  extAuth:
    failOpen: false              # outpost down => deny, never publish
    # MANDATORY. Unset, Envoy forwards the ext-auth server ONLY Host, Method,
    # Path, Content-Length and Authorization — no Cookie — so the outpost cannot
    # see the session and every check is anonymous. Each asset request then opens
    # its own flow; the parallel flows clobber each other's state cookie and the
    # top-level callback returns `oauth state does not match the session` =>
    # HTTP 400 in the browser. nginx's auth_request passed Cookie implicitly,
    # which is why this only surfaced after the Envoy migration.
    # Verify with the session-stability A/B, NOT a 302: a broken policy 302s
    # forever. Present the issued cookie a second time — fixed reuses it,
    # broken mints a new one. See docs/sops/gateway-api-httproute.md.
    headersToExtAuth:
      - cookie                   # the session — the one that actually fixes it
      - accept
      - user-agent               # the outpost's request log, where 400s show up
    # DELIBERATELY NOT FORWARDED: x-forwarded-for / x-forwarded-proto. Envoy
    # appends to XFF rather than sanitising it, so forwarding it lets a client
    # choose the IP authentik's lockout scoring records. The redirect URI is
    # built correctly without x-forwarded-proto.
    http:
      backendRefs:
        - group: ""
          kind: Service
          name: ak-outpost-esphome-forward-auth
          namespace: kube-system
          port: 9000
      path: /outpost.goauthentik.io/auth/envoy   # /auth/nginx 500s here
      headersToBackend:
        - Set-Cookie
        - X-authentik-username
        - X-authentik-groups
        - X-authentik-email
        - X-authentik-name
        - X-authentik-uid
