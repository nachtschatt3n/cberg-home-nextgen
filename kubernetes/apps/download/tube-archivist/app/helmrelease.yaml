---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tube-archivist
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  dependsOn:
    - name: cloudflared
      namespace: network
    - name: tube-archivist-redis
      namespace: download
    - name: tube-archivist-elasticsearch
      namespace: download
  values:
    controllers:
      main:
        strategy: Recreate
        containers:
          app:
            image:
              repository: bbilly1/tubearchivist
              tag: v0.5.12
              pullPolicy: IfNotPresent
            env:
              TZ: ${TIMEZONE}
              TA_HOST: "https://tube-archivist.${SECRET_DOMAIN}"
              TA_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: tube-archivist-secrets
                    key: TUBE_ARCHIVIST_USERNAME
              TA_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: tube-archivist-secrets
                    key: TUBE_ARCHIVIST_PASSWORD
              REDIS_CON: "redis://tube-archivist-redis:6379"
              ES_URL: "http://tube-archivist-elasticsearch:9200"
              ELASTIC_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: tube-archivist-secrets
                    key: TUBE_ARCHIVIST_ELASTIC_PASSWORD
              ELASTIC_USER: "elastic"
              TA_AUTO_UPDATE_YTDLP: "release"
              DISABLE_STATIC_AUTH: "false"
              DJANGO_DEBUG: "false"
            resources:
              requests:
                cpu: 200m
                memory: 1.5Gi
              limits:
                # 1.5Gi OOMKilled (exit 137) on 2026-06-05 during a 180-item
                # playlist download + ES metadata bulk-index — idle sits ~730Mi
                # but download/indexing bursts blow past 1.5Gi. 3Gi gives ample
                # headroom (192GiB cluster, cost is cheap).
                memory: 3Gi
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - python
                      - -c
                      - |
                        import os
                        import sys
                        import urllib.request

                        urllib.request.urlopen("http://127.0.0.1:8000/", timeout=5).read(1)
                        needle = b"celery -A task.celery worker"
                        for pid in os.listdir("/proc"):
                            if not pid.isdigit():
                                continue
                            try:
                                cmdline = open(f"/proc/{pid}/cmdline", "rb").read().replace(b"\0", b" ")
                            except OSError:
                                continue
                            if needle in cmdline:
                                sys.exit(0)

                        sys.exit(1)
                  initialDelaySeconds: 60
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 8000
                  initialDelaySeconds: 60
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 8000
                  failureThreshold: 30
                  periodSeconds: 10

    service:
      main:
        controller: main
        ports:
          http:
            port: 8000

    # Envoy migration PHASE 3 — moved to envoy-external (2026-09-07).
    #
    # NO external-dns target annotation on the route, deliberately: with
    # --source=gateway-httproute external-dns reads the target from the parent
    # GATEWAY and silently ignores it on the route. It is already set on
    # Gateway/envoy-external. (Proven 2026-09-07: putting it on a route took a
    # hostname dark publicly.)
    #
    # NO SecurityPolicy. This app authenticates in-app and never had nginx
    # forward-auth; ext-auth would add a second login in front of the app's own.
    route:
      main:
        kind: HTTPRoute
        hostnames:
          - "tube-archivist.${SECRET_DOMAIN}"
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: Gateway
            name: envoy-external
            namespace: network
            # https only. The http listener is owned cluster-wide by
            # httproute-https-redirect, which 301s every host.
            sectionName: https
        labels:
          gethomepage.dev/enabled: "true"
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "Tube Archivist"
          gethomepage.dev/description: "Tube Archivist is a self-hosted YouTube media server"
          gethomepage.dev/group: "Download"
          gethomepage.dev/icon: "youtube.png"
        # Rule written out explicitly rather than relying on the chart's
        # single-Service default: that shortcut only holds while exactly one
        # Service is enabled, and _validate.tpl hard-fails the moment a
        # second one appears.
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: main
                port: http

    persistence:
      youtube:
        enabled: true
        existingClaim: tube-archivist-youtube
        globalMounts:
          - path: /youtube
      cache:
        enabled: true
        existingClaim: tube-archivist-cache-2g
        globalMounts:
          - path: /cache
