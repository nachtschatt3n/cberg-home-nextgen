---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway-crds
spec:
  interval: 30m
  chart:
    spec:
      chart: gateway-crds-helm
      # PINNED + HELD — see runbooks/auto-update-policy.yaml (*envoy-gateway*,
      # *gateway-helm*, *gateway-crds-helm*). Must move in lockstep with the
      # envoy-gateway HelmRelease; EG only supports its own bundled CRD set.
      version: 1.8.3
      sourceRef:
        kind: HelmRepository
        name: envoyproxy
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    crds:
      gatewayAPI:
        enabled: true
        # STANDARD channel only. The gateway-helm chart bundles the
        # EXPERIMENTAL channel (TCPRoute/UDPRoute/TLSRoute/XMesh); we do not
        # want those — L4 stays on Cilium LB-IPAM by design
        # (docs/troubleshooting/ingress-migration-plan.md, "Scope exclusions").
        channel: standard
      envoyGateway:
        enabled: true
