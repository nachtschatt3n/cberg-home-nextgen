# No listener-level `hostname:` on either gateway. Per-app HTTPRoutes carry
# their own hostnames (Phases 1-3), the wildcard cert already bounds what TLS
# can serve, and a listener hostname of "*.${SECRET_DOMAIN}" would additionally
# lock out any apex-domain route. It also cannot be validated pre-commit: the
# Gateway schema pattern-checks hostname, and the Flux postBuild variable is
# still literal at `task kubeconform` time.
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy-internal
spec:
  gatewayClassName: envoy
  infrastructure:
    annotations:
      lbipam.cilium.io/ips: "192.168.55.103"
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: "${SECRET_DOMAIN/./-}-production-tls"
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy-external
  annotations:
    # REQUIRED for phase 3, and the route-level equivalent does NOT work.
    #
    # external-dns runs --source=gateway-httproute with --cloudflare-proxied.
    # For that source it derives each HTTPRoute record target from the PARENT
    # GATEWAY, not from the route: an
    # external-dns.alpha.kubernetes.io/target annotation on the HTTPRoute
    # itself is ignored. Proven the hard way on 2026-09-07 - the authentik
    # canary carried that annotation verbatim and external-dns still tried to
    # publish auth as an A record to 192.168.55.104, which Cloudflare refuses
    # as a private target for a proxied record. The CNAME had already been
    # withdrawn with the Ingress, so the hostname went dark publicly until the
    # commit was reverted.
    #
    # Set here, every route attached to this Gateway publishes a CNAME to the
    # tunnel hostname - exactly what the Ingresses did.
    external-dns.alpha.kubernetes.io/target: "external.${SECRET_DOMAIN}"
spec:
  gatewayClassName: envoy
  infrastructure:
    annotations:
      lbipam.cilium.io/ips: "192.168.55.104"
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: "${SECRET_DOMAIN/./-}-production-tls"
