---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
spec:
  # Attaches ONLY to the :80 listeners of the two NEW gateways. Parity with
  # ingress-nginx `force-ssl-redirect: true`. Nothing routes through these
  # gateways yet, so this changes no existing traffic.
  parentRefs:
    - name: envoy-internal
      sectionName: http
    - name: envoy-external
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
