---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: envoy-internal-client
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-internal
  clientIPDetection:
    xForwardedFor:
      # Parity with ingress-nginx `use-forwarded-headers: true` on the
      # internal class: trust XFF only from the pod network and the RFC1918
      # LAN VLANs, so an external client cannot spoof its own client IP.
      trustedCIDRs:
        - 10.69.0.0/16
        - 192.168.0.0/16
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: envoy-external-client
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-external
  clientIPDetection:
    customHeader:
      # External traffic arrives via the cloudflared tunnel, which sets
      # CF-Connecting-IP. failClosed: false keeps behaviour equivalent to
      # nginx's real-ip module (fall back to the socket peer, do not 403).
      name: CF-Connecting-IP
      failClosed: false
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: envoy-compression
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-internal
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-external
  # Parity with ingress-nginx `enable-brotli: true` (gzip is on by default
  # there). Order matters: brotli wins when q-values tie.
  compressor:
    - type: Brotli
    - type: Gzip
