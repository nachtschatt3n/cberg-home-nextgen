---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cert-manager.io/certificate_v1.json
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: "${SECRET_DOMAIN/./-}-production"
spec:
  # Gateway API certificateRefs are namespace-local unless a ReferenceGrant is
  # in play, so the wildcard is issued a second time into `network`. Same SANs
  # as the cert-manager-ns copy that ingress-nginx uses; the two renew
  # independently and well inside Let's Encrypt's duplicate-certificate limit.
  secretName: "${SECRET_DOMAIN/./-}-production-tls"
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  commonName: "${SECRET_DOMAIN}"
  dnsNames:
    - "${SECRET_DOMAIN}"
    - "*.${SECRET_DOMAIN}"
