---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
spec:
  interval: 30m
  chart:
    spec:
      chart: gateway-helm
      # PINNED + HELD — see runbooks/auto-update-policy.yaml. EG bumps are
      # reviewed-only, never auto-merged: v1.7.0 shipped an ext-auth
      # regression (envoyproxy/gateway#8202) that broke redirect auth, and
      # this stack fronts authentik forward-auth from Phase 1 on.
      # 1.8.3 -> 1.9.0 (2026-08-16, "phase 0.5"): 1.8.x supports k8s
      # 1.32-1.35 only and this cluster is on 1.36 (already off-matrix);
      # 1.8.3 is EOL 2026-11-08 and there is no 1.8.4. 1.9 covers 1.33-1.36.
      # Done NOW deliberately, while Envoy carries zero real traffic (one
      # hostname-less HTTPRoute) and ingress-nginx still serves all
      # ingresses — the coupled Gateway-API-CRD channel bump
      # (v1.5.1 -> v1.6.1) is cheapest to revert at this point.
      version: 1.9.0
      sourceRef:
        kind: HelmRepository
        name: envoyproxy
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    # CRDs are owned by the envoy-gateway-crds HelmRelease (standard channel).
    # The bundle inside this chart is the EXPERIMENTAL channel — keep it off.
    crds:
      enabled: false
    config:
      envoyGateway:
        gateway:
          controllerName: gateway.envoyproxy.io/gatewayclass-controller
        provider:
          type: Kubernetes
          kubernetes:
            deploy:
              # Data-plane Envoy Deployment/Service land in the SAME namespace
              # as the Gateway (network), not in the EG control-plane namespace.
              type: GatewayNamespace
        logging:
          level:
            default: info
    # The topology injector is a MutatingWebhookConfiguration on pods/binding
    # with NO namespace/object selector — it would intercept every pod binding
    # in the cluster. It only exists to inject zone/topology labels into
    # data-plane Envoy pods, which buys nothing at replicas: 1 on a 3-node
    # cluster. Off, so Phase 0 adds zero cluster-wide admission surface.
    topologyInjector:
      enabled: false
    deployment:
      replicas: 1
      envoyGateway:
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
