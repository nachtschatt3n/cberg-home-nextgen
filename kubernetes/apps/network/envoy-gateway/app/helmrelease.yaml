---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
spec:
  interval: 30m
  chart:
    spec:
      chart: gateway-helm
      # PINNED + HELD — see runbooks/auto-update-policy.yaml. EG bumps are
      # reviewed-only, never auto-merged: v1.7.0 shipped an ext-auth
      # regression (envoyproxy/gateway#8202) that broke redirect auth, and
      # this stack fronts authentik forward-auth from Phase 1 on.
      # 1.8.3 -> 1.9.0 (2026-08-16, "phase 0.5"): 1.8.x supports k8s
      # 1.32-1.35 only and this cluster is on 1.36 (already off-matrix);
      # 1.8.3 is EOL 2026-11-08 and there is no 1.8.4. 1.9 covers 1.33-1.36.
      # Done NOW deliberately, while Envoy carries zero real traffic (one
      # hostname-less HTTPRoute) and ingress-nginx still serves all
      # ingresses — the coupled Gateway-API-CRD channel bump
      # (v1.5.1 -> v1.6.1) is cheapest to revert at this point.
      version: 1.9.1
      sourceRef:
        kind: HelmRepository
        name: envoyproxy
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    # CRDs are owned by the envoy-gateway-crds Flux Kustomization (see ks.yaml),
    # which applies the vendored standard-channel bundle under crds/.
    # The bundle inside this chart is the EXPERIMENTAL channel — keep it off.
    # (install/upgrade crds: CreateReplace above is inert: this chart has no
    # chart-native crds/ dir, only this values-gated subchart.)
    crds:
      enabled: false
    config:
      envoyGateway:
        gateway:
          controllerName: gateway.envoyproxy.io/gatewayclass-controller
        provider:
          type: Kubernetes
          kubernetes:
            deploy:
              # Data-plane Envoy Deployment/Service land in the SAME namespace
              # as the Gateway (network), not in the EG control-plane namespace.
              type: GatewayNamespace
        extensionApis:
          # Required for the Backend resource (2026-09-07). It is an OPT-IN
          # extension API: without this, a route referencing a Backend reports
          # ResolvedRefs=False "Backend is disabled in Envoy Gateway
          # configuration" and serves 500 — it does not fail at apply time.
          #
          # Needed because wazuh-dashboard's backend speaks TLS with a cert that
          # has NO subjectAltName (CN=wazuh-dashboard only), so hostname
          # validation is impossible and Gateway API's BackendTLSPolicy — which
          # requires a hostname and offers no insecureSkipVerify — cannot
          # express it. EG's Backend can, via tls.insecureSkipVerify, matching
          # what the nginx Ingress did with proxy-ssl-verify: off.
          enableBackend: true
        logging:
          level:
            default: info
    # The topology injector is a MutatingWebhookConfiguration on pods/binding.
    # It only injects zone/topology labels into data-plane Envoy pods. The
    # original note here said this "buys nothing at replicas: 1" — that premise
    # expired on 2026-09-07 when the data plane went to 3. It stays disabled
    # anyway: this is a single-rack, single-zone cluster, so there is no
    # topology for it to express, and the RBAC argument below was always the
    # real reason. Disabling it also drops
    # a cluster-wide pods + pods/binding get/list/patch/update/watch grant from
    # the control-plane ClusterRole — that RBAC reduction is the real reason.
    # (Corrected 2026-08-16: the webhook DOES carry a namespaceSelector scoped
    # to the network namespace with failurePolicy: Ignore in both 1.8.3 and
    # 1.9.0 — the earlier "no selector, intercepts every pod binding" claim
    # here was wrong. The decision stands on the RBAC argument.)
    topologyInjector:
      enabled: false
    # Control plane: 3 replicas, one per node. EG uses leader election, so the
    # extra two are standby rather than active-active — losing the leader costs
    # a re-election, not a config outage, and the data plane keeps serving its
    # last good config throughout. Was 1 until 2026-09-07: it sat on
    # k8s-nuc14-03 alongside envoy-external, so one node event took out the
    # control plane and half the data plane together (F-f2b89d20).
    podDisruptionBudget:
      minAvailable: 2                 # chart default is 0, i.e. no protection
    deployment:
      replicas: 3
      pod:
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: DoNotSchedule
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: gateway-helm
                app.kubernetes.io/instance: envoy-gateway
            # See the data-plane comment in gatewayclass.yaml: without the
            # template hash, a rolling update counts the outgoing ReplicaSet
            # and replicas pile onto one node permanently. Measured today.
            matchLabelKeys:
              - pod-template-hash
      envoyGateway:
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
