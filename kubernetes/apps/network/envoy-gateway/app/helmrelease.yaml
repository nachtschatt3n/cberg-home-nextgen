---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
spec:
  interval: 30m
  chart:
    spec:
      chart: gateway-helm
      # PINNED + HELD at 1.8.3 — see runbooks/auto-update-policy.yaml.
      # v1.7.0 shipped an ext-auth regression (envoyproxy/gateway#8202) that
      # broke redirect auth; this stack fronts authentik forward-auth from
      # Phase 1 on, so EG bumps are reviewed-only, never auto-merged.
      version: 1.8.3
      sourceRef:
        kind: HelmRepository
        name: envoyproxy
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    # CRDs are owned by the envoy-gateway-crds HelmRelease (standard channel).
    # The bundle inside this chart is the EXPERIMENTAL channel — keep it off.
    crds:
      enabled: false
    config:
      envoyGateway:
        gateway:
          controllerName: gateway.envoyproxy.io/gatewayclass-controller
        provider:
          type: Kubernetes
          kubernetes:
            deploy:
              # Data-plane Envoy Deployment/Service land in the SAME namespace
              # as the Gateway (network), not in the EG control-plane namespace.
              type: GatewayNamespace
        logging:
          level:
            default: info
    # The topology injector is a MutatingWebhookConfiguration on pods/binding
    # with NO namespace/object selector — it would intercept every pod binding
    # in the cluster. It only exists to inject zone/topology labels into
    # data-plane Envoy pods, which buys nothing at replicas: 1 on a 3-node
    # cluster. Off, so Phase 0 adds zero cluster-wide admission surface.
    topologyInjector:
      enabled: false
    deployment:
      replicas: 1
      envoyGateway:
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
