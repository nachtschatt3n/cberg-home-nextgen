---
# THROWAWAY probe for phase 3. Exists only to prove what external-dns publishes
# for a route on envoy-external, on a hostname nothing uses, before that
# mechanism is trusted with a real service.
#
# Delete this file once phase 3 is done. It has no backend by design - the only
# thing it produces that matters is the DNS record.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dns-canary
  namespace: network
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-external
      namespace: network
      sectionName: https
  hostnames:
    - "envoy-dns-probe.${SECRET_DOMAIN}"
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      filters:
        - type: RequestRedirect
          requestRedirect:
            statusCode: 302
            hostname: "external.${SECRET_DOMAIN}"
