---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-gateway
spec:
  interval: 30m
  # Chart comes from ./ocirepository.yaml (pinned tag 3.7.2), not from an HTTP
  # HelmRepository index -- see that file for why the HTTP source was dropped.
  chartRef:
    kind: OCIRepository
    name: k8s-gateway
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    fullnameOverride: k8s-gateway
    # 3 replicas, one per node. Was 1 until 2026-09-07, when a single-replica
    # ingress controller dying with its node took every internal hostname to
    # NXDOMAIN for ~6 min (F-f2b89d20) — k8s-gateway stayed up and answering,
    # just with no records, which is why Ready=True told us nothing. This is
    # also the SECOND full internal-DNS outage from this component (see §8 of
    # docs/sops/k8s-gateway-dns.md for the 2026-08-15 fail-closed one), and
    # phase 1 of the Envoy migration edits watchedResources — the same class of
    # change. Do that on one replica and it is a third outage.
    replicaCount: 3
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: k8s-gateway
            app.kubernetes.io/instance: k8s-gateway
        # pod-template-hash is REQUIRED, not polish. Spread is evaluated only
        # at SCHEDULING time and k8s never rebalances. Without this key a
        # rolling update counts the outgoing ReplicaSet while it terminates and
        # replicas pile onto one node, then stay — measured on the Envoy half
        # of this same change today (both gateways settled skew=2 against a
        # declared maxSkew of 1). Scoping to the template hash makes each
        # ReplicaSet spread among its own pods.
        matchLabelKeys:
          - pod-template-hash
    # Chart 3.7.2's default image tag lags at 1.7.0 despite appVersion 1.8.0.
    # Pin 1.8.0 explicitly: it is built against sigs.k8s.io/gateway-api v1.5.1
    # (verified in the tag's go.mod) — the exact CRD set Envoy Gateway installs,
    # which is the whole point of this upgrade (see docs/sops/k8s-gateway-dns.md §8).
    image:
      tag: "1.8.0"
    domain: "${SECRET_DOMAIN}"
    # TTL 1 was pathologically low: the UniFi gateway's dnsmasq couldn't
    # keep the positive A-record cached (expired every 1s) while latching
    # the 60s NODATA negative SOA, so newly-added ingress hosts (e.g. the
    # `sweep` subdomain) got stuck returning empty in a self-renewing loop.
    # Match the SOA neg-TTL (60s) so positive answers actually stick.
    ttl: 60
    service:
      type: LoadBalancer
      loadBalancerIP: "192.168.55.101"
      port: 53
      annotations:
        lbipam.cilium.io/ips: "192.168.55.101"
      externalTrafficPolicy: Cluster
    # History (2026-08-15): on chart 2.4.0 / app 0.4.0 the mere PRESENCE of any
    # Gateway API CRD made the plugin's v1alpha2 route informers fail to sync and
    # the plugin failed closed for EVERY name — a full internal-DNS outage, latent
    # until the next pod restart. Chart 3.7.2 / app 1.8.0 (gateway-api v1.5.1) is
    # the fix. Full analysis: docs/sops/k8s-gateway-dns.md §8.
    #
    # Adding "HTTPRoute" here is deliberate phase-1 work of the Envoy Gateway
    # migration (with the restart-and-verify DNS gate), not a casual edit.
    # HTTPRoute added 2026-09-07 — phase 1 step 0 of the Envoy migration.
    # This is the change the guard comment above warns about: on chart 2.4.0 the
    # mere PRESENCE of a Gateway API CRD made the plugin's route informers fail
    # to sync and it failed CLOSED for every name — a full internal-DNS outage,
    # latent until the next pod restart. Chart 3.7.2 / app 1.8.0 (gateway-api
    # v1.5.1) is the fix, and this edit is gated by the §8 restart-and-verify
    # procedure, not by a successful rollout: a green rollout is NOT evidence,
    # because the failure only appears when the pod restarts with CRDs present.
    # Deliberately made AFTER k8s-gateway went to 3 replicas the same morning
    # (F-f2b89d20), so a fail-closed pod cannot take all of internal DNS with it.
    watchedResources: ["Ingress", "Service", "HTTPRoute"]
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
