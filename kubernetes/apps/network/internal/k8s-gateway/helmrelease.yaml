---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-gateway
spec:
  interval: 30m
  chart:
    spec:
      chart: k8s-gateway
      version: 2.4.0
      sourceRef:
        kind: HelmRepository
        name: k8s-gateway
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    fullnameOverride: k8s-gateway
    domain: "${SECRET_DOMAIN}"
    # TTL 1 was pathologically low: the UniFi gateway's dnsmasq couldn't
    # keep the positive A-record cached (expired every 1s) while latching
    # the 60s NODATA negative SOA, so newly-added ingress hosts (e.g. the
    # `sweep` subdomain) got stuck returning empty in a self-renewing loop.
    # Match the SOA neg-TTL (60s) so positive answers actually stick.
    ttl: 60
    service:
      type: LoadBalancer
      loadBalancerIP: "192.168.55.101"
      port: 53
      annotations:
        lbipam.cilium.io/ips: "192.168.55.101"
      externalTrafficPolicy: Cluster
    # DO NOT add "HTTPRoute" here on k8s-gateway 2.4.0 — it takes internal DNS
    # down completely. Adding it makes the plugin start informers for the whole
    # route family at v1alpha2, including TLSRoute and GRPCRoute, which no
    # longer exist in Gateway API v1.5.1 (both graduated to v1). The informers
    # fail to sync, and the plugin then answers EVERY query — Ingress-backed
    # ones included — with "Could not sync required resources", i.e. SERVFAIL
    # for the whole domain. Verified live 2026-08-15 during envoy-gateway
    # phase 0 and reverted within minutes. Not an RBAC problem: the chart
    # already grants gateway.networking.k8s.io/*.
    #
    # Phase 1 blocker: internal DNS for HTTPRoute-backed apps needs either a
    # k8s-gateway release built against Gateway API >= v1.1 (v1 routes), or a
    # different mechanism (per-app DNSEndpoint, or point the split-horizon
    # record at the gateway VIP directly).
    watchedResources: ["Ingress", "Service"]
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
