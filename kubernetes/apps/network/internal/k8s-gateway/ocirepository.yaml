---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/ocirepository-source-v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: k8s-gateway
# Replaces the HTTP HelmRepository this chart used to be sourced from. That
# source relocated THREE times (ori-edge -> the k8s-gateway GitHub org ->
# a personal namespace on hobbyist hosting) and on 2026-09-11 the middle one's
# GitHub Pages index was DELETED outright, which blocked `cluster-apps`
# cluster-wide until the source was repointed. An HTTP chart index is a single
# mutable URL owned by one person; the OCI registry below is the chart's own
# canonical distribution point.
#
# CORRECTION to an earlier version of this comment: OCI does NOT make the cached
# artifact survive a source-controller restart. Its artifact lives in the SAME
# emptyDir as a HelmRepository's, so a restart discards it either way. What
# actually changed is that the artifact is RE-FETCHABLE afterwards -- the old
# HTTP index was a 404, so a cache loss was unrecoverable and would have left
# internal DNS unreconcilable. That is the property worth having; do not
# over-claim persistence it does not provide.
#
# The 3.7.2 layer here is the ORIGINAL tarball, not a repackage:
# sha256:a9bd8636...526 / 9195 bytes, byte-identical to the HelmChart artifact
# the live release v7 was built from. (The hobbyist-host repointing never
# re-pulled -- reconcileStrategy keys on the version string -- and that host
# actually serves a repackaged 9616-byte variant with a different digest. So
# moving to OCI returns us to the exact bytes already running.)
#
# NO `spec.verify` BLOCK ON PURPOSE. These charts do carry cosign signatures
# (a `sha256-<manifest-digest>.sig` tag exists for this revision), but the
# signing identity has not been established here, and `spec.verify` fails
# CLOSED: a wrong or drifting identity stops this source reconciling, and this
# chart is internal DNS for the whole cluster. Adding verification is a
# separate, independently-gated change -- see docs/sops/k8s-gateway-dns.md.
#
# THE DIGEST BELOW IS THE TRUST ANCHOR -- not the deny rule, and not the tag.
# This is the one thing the OCI move made WORSE until the digest was pinned.
# The old HelmRepository used reconcileStrategy: ChartVersion, so an unchanged
# version string meant NO re-pull -- which is exactly why repointing the HTTP
# host was harmless. An OCIRepository instead re-resolves tag -> digest EVERY
# interval (1h here), and GHCR does not enforce tag immutability by default, so
# a tag overwrite upstream would replace cluster-wide internal DNS within the
# hour with NO git diff and NO PR.
#
# The `*k8s-gateway*` deny rule in runbooks/auto-update-policy.yaml does NOT
# cover that: it gates Renovate PRs and coverage.py bumps, i.e. git-VISIBLE
# version changes. source-controller silently re-resolving a tag is not one.
# Keep the rule -- it still holds the git-visible pin -- but do not mistake it
# for protection against tag mutation. The digest is what provides that.
#
# To move versions, change BOTH tag and digest together, and re-derive the
# digest from the registry rather than trusting this note.
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 3.7.2
    # Immutable pin. Verified against the registry 2026-09-11: the manifest for
    # tag 3.7.2 IS this digest, and the chart layer inside it is
    # sha256:a9bd8636...526 / 9195 bytes -- the original tarball already running.
    digest: sha256:3783b0b4bc414e040d6b72e81cf78071542b27a4779d3e462f547bbfd23651fc
  url: oci://ghcr.io/k8s-gateway/charts/k8s-gateway
