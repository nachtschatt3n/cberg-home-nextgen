---
originRequest:
  originServerName: "external.${SECRET_DOMAIN}"

ingress:
  - hostname: "${SECRET_DOMAIN}"
    service: https://envoy-external.network.svc.cluster.local:443
    originRequest:
      originServerName: "${SECRET_DOMAIN}"
  # PHASE 3 WILDCARD FLIP (2026-09-07). Every external app now has an
  # HTTPRoute on envoy-external, so the whole surface moves in one rule.
  # Rollback is reverting this commit and restarting cloudflared: seconds.
  #
  # :443 not :80 — the gateway's http listener is owned by the cluster-wide
  # https-redirect route, so a plain-HTTP origin would loop.
  #
  # originServerName supplies the TLS SNI so the gateway serves the wildcard
  # cert and cloudflared can verify it. It is a fixed name here rather than
  # per-host because one wildcard cert covers every hostname.
  #
  # http2Origin is deliberately NOT set. WebSocket-over-HTTP/2 requires
  # Extended CONNECT, which is not enabled on this gateway, and hass and the
  # whiteboard both hold WebSockets. HTTP/1.1 to origin keeps Upgrade working.
  - hostname: "*.${SECRET_DOMAIN}"
    service: https://envoy-external.network.svc.cluster.local:443
    originRequest:
      originServerName: "${SECRET_DOMAIN}"
  - service: http_status:404
