---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app external-dns
spec:
  interval: 30m
  chart:
    spec:
      chart: external-dns
      version: 1.21.1
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      strategy: rollback
      retries: 3
  values:
    fullnameOverride: *app
    provider: cloudflare
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: external-dns-secret
            key: api-token
    extraArgs:
      - --cloudflare-dns-records-per-page=1000
      - --cloudflare-proxied
      - --request-timeout=60s
      - --crd-source-apiversion=externaldns.k8s.io/v1alpha1
      - --crd-source-kind=DNSEndpoint
      - --events
      - --ignore-ingress-tls-spec
      - --ingress-class=external
      # --ingress-class filters INGRESS objects only; it has no effect on the
      # gateway-httproute source. Without the two flags below, ANY HTTPRoute
      # with a hostname -- including one attached to the INTERNAL gateway --
      # would be published to public Cloudflare DNS. Name+namespace form a
      # default-deny allowlist of exactly one Gateway: a route whose parents
      # are not in that set yields no endpoints, so a typo, a rename or a
      # newly added gateway all fail CLOSED (not published) rather than open.
      # Preferred over --gateway-label-filter because it needs no label on the
      # Gateway objects (owned by the Envoy migration workstream) and cannot be
      # widened by accidentally applying a label. NOTE: --gateway-name takes a
      # single name; if a second externally-facing Gateway is ever added,
      # switch to --gateway-label-filter and label that gateway explicitly.
      - --gateway-name=envoy-external
      - --gateway-namespace=network
      - --metrics-address=0.0.0.0:7979
    policy: sync
    # `ingress` dropped 2026-09-08: the Envoy Gateway migration is complete and
    # the cluster holds zero Ingress objects, so no DNS record can be derived
    # from that source any more. Retaining it was only ever needed for the
    # parallel run — with policy: sync, an UNLISTED source whose objects still
    # exist would have had its records deleted.
    #
    # Safe precisely because the count is zero: verified before the change.
    # If an Ingress is ever reintroduced, this must be added back BEFORE it is
    # created, or sync will refuse to publish its record.
    sources: ["crd", "gateway-httproute"]
    txtPrefix: k8s.
    txtOwnerId: default
    domainFilters: ["${SECRET_DOMAIN}"]
    podAnnotations:
      secret.reloader.stakater.com/reload: external-dns-secret
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: kube-prometheus-stack
      interval: 30s
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
