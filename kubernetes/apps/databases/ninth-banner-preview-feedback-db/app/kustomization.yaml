---
# Database + login role for ninth-banner-preview (the v0.6.x art line's
# owner-only preview, my-software-production/ninth-banner-preview) on the
# shared postgresql. Same shape as ../../ninth-banner-5-feedback-db, but a
# SEPARATE role and database (ninth_banner_preview_feedback): the preview never
# writes the live game's feedback/analytics tables, and its retention/size
# pruning only ever touches its own rows. Separate Flux app so the other init
# Jobs are not re-run.
#
# secret.sops.yaml: NINTH_BANNER_PREVIEW_FEEDBACK_PASSWORD MUST equal the
# password inside FEEDBACK_DATABASE_URL in
# my-software-production/ninth-banner-preview/app/feedback-secret.sops.yaml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - secret.sops.yaml
  - bootstrap-configmap.yaml
  - init-job.yaml
