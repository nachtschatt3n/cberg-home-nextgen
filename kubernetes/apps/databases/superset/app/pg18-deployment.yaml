---
# THE Superset metadata DB (postgres 18.6), plan superset-pg-18.6.
# Cut over 2026-09-08. The predecessor superset-pg (17.11) ran alongside as the
# rollback through the soak and was RETIRED 2026-09-09 (Deployment + Service
# deleted); its data volume superset-pg-data is retained, so rolling back means
# re-creating that Deployment from git history against the retained PVC.
# This is now the only live metadata DB — nothing else serves DB_HOST.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: superset-pg18
  namespace: databases
  labels:
    app: superset-pg18
spec:
  replicas: 1
  # Recreate: single-replica Deployment on an RWO Longhorn PVC — RollingUpdate
  # surges a second pod (maxSurge rounds UP to 1 at replicas: 1) which then
  # deadlocks forever on Multi-Attach if it lands on another node.
  # See docs/sops/longhorn-rwo-multi-attach.md.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: superset-pg18
  template:
    metadata:
      labels:
        app: superset-pg18
    spec:
      containers:
      - name: postgresql
        # Multi-arch OCI INDEX digest, verified 2026-09-08 — matches the form used
        # by pg-deployment.yaml in this folder (which this file is modelled on).
        # Deliberately NOT the per-platform amd64 manifest digest: an index digest
        # survives scheduling onto a non-amd64 node.
        image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5432
          name: postgresql
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: superset-secrets
              key: DB_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: superset-secrets
              key: DB_PASS
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: superset-secrets
              key: DB_NAME
        # PIN PGDATA EXPLICITLY — load-bearing, do not remove (plan superset-pg-18.6,
        # mirroring kubernetes/apps/ai/paperclip/app/postgresql.yaml). postgres:18
        # moved its DEFAULT PGDATA from /var/lib/postgresql/data to
        # /var/lib/postgresql/18/docker, and its VOLUME from .../data to
        # /var/lib/postgresql. The mount below is at /var/lib/postgresql/data, so
        # without this pin initdb and the restore would land OUTSIDE the mount, in
        # the container's ephemeral layer: SELECT version() reports 18.6, row counts
        # match, the app works — and the data is gone at the next pod restart.
        # Pinning inside the mount also keeps this immune when PG19 relocates the
        # default again. See docs/sops/postgres-major-upgrade.md.
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        # No POSTGRES_INITDB_ARGS: postgres 18 enables data checksums by default
        # (release-18: "Change initdb default to enable data checksums"), so the
        # 17.11 Deployment's explicit --data-checksums is redundant here. Asserted
        # post-initdb with `show data_checksums`, not assumed from the manifest.
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        readinessProbe:
          exec:
            command:
              - /bin/sh
              - -c
              - exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          initialDelaySeconds: 15
          timeoutSeconds: 2
          periodSeconds: 10
        livenessProbe:
          exec:
            command:
              - /bin/sh
              - -c
              - exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          initialDelaySeconds: 30
          timeoutSeconds: 2
          periodSeconds: 10
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: superset-pg18-data
---
apiVersion: v1
kind: Service
metadata:
  name: superset-pg18
  namespace: databases
  labels:
    app: superset-pg18
spec:
  type: ClusterIP
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
    name: postgresql
  selector:
    app: superset-pg18
