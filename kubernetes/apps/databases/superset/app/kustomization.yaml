---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: databases
# NOTE: pg18-longhorn-volume.yaml is in this directory for reference but NOT listed
# here because Flux `targetNamespace: databases` would override its `namespace: storage`
# field and create a duplicate/broken Volume in the wrong namespace. The Longhorn
# Volume CR must be applied once manually against the `storage` namespace:
#   kubectl apply -f pg18-longhorn-volume.yaml
# This matches pgadmin/postgresql convention in this repo.
#
# DECOMMISSIONED 2026-09-11 by plan `superset-pg-decommission`: the two retired
# metadata-DB generations are gone from this folder and from the cluster —
# postgres 14.17 `superset-postgresql-data` (workload retired 2026-09-05,
# 90539942) and postgres 17.11 `superset-pg-data` (workload retired 2026-09-09,
# 9d10199c). Their PV/PVC manifests and hand-applied Longhorn Volume CRs were
# removed here; the Volume CRs were deleted by hand in namespace `storage`.
# This supersedes the earlier "deliberately-orphaned rollback artifact — do not
# clean it up" framing: reclaiming them WAS the explicit decision, not an
# oversight. Their frozen Longhorn backup sets are deliberately RETAINED and are
# now the only restore path (see §6/§7 of the plan). Any restore from those
# backups crosses the 2026-09-08 credential rotation and MUST reset every local
# db-provider Admin account before Superset serves traffic.
resources:
  - secret.sops.yaml
  - helmrelease.yaml
  - redis-deployment.yaml
  - httproute.yaml
  # postgres 18.6 metadata DB (plan superset-pg-18.6) — the LIVE metadata DB,
  # serving since 2026-09-08 08:36. Same rule as above:
  # pg18-longhorn-volume.yaml is deliberately NOT listed — apply it manually.
  - pg18-pv.yaml
  - pg18-pvc.yaml
  - pg18-deployment.yaml
