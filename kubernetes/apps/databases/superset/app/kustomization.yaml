---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: databases
# NOTE: longhorn-volume.yaml is in this directory for reference but NOT listed here
# because Flux `targetNamespace: databases` would override its `namespace: storage`
# field and create a duplicate/broken Volume in the wrong namespace. The Longhorn
# Volume CR must be applied once manually against the `storage` namespace:
#   kubectl apply -f longhorn-volume.yaml
# This matches pgadmin/postgresql convention in this repo.
resources:
  - pv.yaml
  - data-pvc.yaml
  - secret.sops.yaml
  - helmrelease.yaml
  - redis-deployment.yaml
  - httproute.yaml
  # postgres 17.11 metadata DB — WORKLOAD RETIRED 2026-09-09, DATA RETAINED.
  # Superset cut over to postgres 18.6 (superset-pg18) on 2026-09-08; this DB
  # was kept running only as the rollback and has been idle since (0 client
  # backends at teardown). pg-deployment.yaml (Deployment + Service) is DELETED;
  # the PV and PVC below stay so the 20Gi Longhorn volume `superset-pg-data`
  # remains Bound and restorable.
  #
  # These are a DELIBERATELY-ORPHANED ROLLBACK ARTIFACT, *not* an orphan to
  # reclaim — same disposition as superset-postgresql-data in 90539942. A PVC
  # with no workload is exactly what that looks like; do not "clean it up".
  # Reclaiming it is a separate, later decision.
  #
  # NOTE the volume DETACHES once the workload is gone, so
  # daily-backup-all-volumes stops producing new backups for it: the existing
  # dailies are a FROZEN restore set that will not age out on its own.
  - pg-pv.yaml
  - pg-pvc.yaml
  # postgres 18.6 metadata DB (plan superset-pg-18.6). Same rule:
  # pg18-longhorn-volume.yaml is deliberately NOT listed — apply it manually.
  - pg18-pv.yaml
  - pg18-pvc.yaml
  - pg18-deployment.yaml
