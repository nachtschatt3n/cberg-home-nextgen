---
# RETAINED ROLLBACK ARTIFACT — postgres 17.11 metadata DB (superset-pg).
# The Deployment + Service were deleted 2026-09-09 after Superset cut over to
# postgres 18.6 (superset-pg18); this PersistentVolume is kept ON PURPOSE so the 20Gi
# Longhorn volume `superset-pg-data` stays Bound and restorable.
# NOT an orphan to reclaim, and NOT to be switched off Retain. Precedent:
# superset-postgresql-data in 90539942 (workload goes, data stays).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: superset-pg-data
spec:
  capacity:
    storage: 20Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: longhorn-static
  csi:
    driver: driver.longhorn.io
    fsType: ext4
    volumeAttributes:
      numberOfReplicas: "2"
      staleReplicaTimeout: "30"
    volumeHandle: superset-pg-data
