---
# Replacement Superset metadata DB (plan superset-pg-standup, stage 2/4).
# Runs ALONGSIDE the bundled bitnamilegacy superset-postgresql StatefulSet;
# Superset is NOT repointed in this stage (cutover is stage 3).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: superset-pg
  namespace: databases
  labels:
    app: superset-pg
spec:
  replicas: 1
  # Recreate: single-replica Deployment on an RWO Longhorn PVC — RollingUpdate
  # would surge a second pod and deadlock on Multi-Attach.
  # See docs/sops/longhorn-rwo-multi-attach.md.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: superset-pg
  template:
    metadata:
      labels:
        app: superset-pg
    spec:
      containers:
      - name: postgresql
        image: postgres:17.11-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5432
          name: postgresql
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: superset-secrets
              key: DB_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: superset-secrets
              key: DB_PASS
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: superset-secrets
              key: DB_NAME
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        - name: POSTGRES_INITDB_ARGS
          value: "--data-checksums"
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        readinessProbe:
          exec:
            command:
              - /bin/sh
              - -c
              - exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          initialDelaySeconds: 15
          timeoutSeconds: 2
          periodSeconds: 10
        livenessProbe:
          exec:
            command:
              - /bin/sh
              - -c
              - exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          initialDelaySeconds: 30
          timeoutSeconds: 2
          periodSeconds: 10
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: superset-pg-data
---
apiVersion: v1
kind: Service
metadata:
  name: superset-pg
  namespace: databases
  labels:
    app: superset-pg
spec:
  type: ClusterIP
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
    name: postgresql
  selector:
    app: superset-pg
