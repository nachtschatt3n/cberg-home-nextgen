---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: superset
  namespace: databases
spec:
  interval: 30m
  chart:
    spec:
      chart: superset
      # NOTE: bumping this chart across the 0.17→0.20 selector relabel needs a
      # one-time delete of the superset/superset-worker/superset-celerybeat
      # Deployments (immutable spec.selector) so Helm can recreate them, then a
      # `flux reconcile hr superset --force`. See the redis block below for the
      # Redis-auth wiring 0.20.0 requires.
      version: 0.22.7
      sourceRef:
        kind: HelmRepository
        name: apache-superset
        namespace: flux-system
  # 15m: the Recreate transition (webserver + worker + beat serially releasing
  # and re-acquiring) exceeds the 5m default — attempt-vs-rollback thrash on the
  # 2026-08-17 redis cutover, where every rollback resurrected the bundled redis.
  timeout: 15m
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  values:
    image:
      repository: apache/superset
      # 6.1.0 stable. Chart 0.22.4 already declares appVersion 6.1.0 (as has every
      # chart since 0.16.0) — this REMOVES a pin-down, it does not outrun the chart.
      # Do NOT bump spec.chart.spec.version to "match": the selector-relabel trap
      # above is triggered by a CHART change, and there is nothing to gain.
      # Multi-arch OCI index digest, re-verified 2026-09-08 (upstream re-pushes this
      # tag in place: the plan recorded ...08e3be59 on 2026-08-17, the live index is
      # now ...16b50bbe pushed 2026-09-07). Never pin a per-platform digest here.
      tag: 6.1.0@sha256:16b50bbef6648912a79e3293d418fefa743ce555d36c5af6b85d859119ed7f88
      pullPolicy: IfNotPresent

    # Keep chart's default config Secret (contains bootstrap script + superset_config.py scaffold);
    # add our OIDC/DB/Redis creds via a second envFrom reference.
    envFromSecrets:
      - superset-secrets

    # Install postgres + redis + OAuth drivers into the Superset venv.
    # apache/superset:5.0.0 uses `uv` for package management (no pip inside the venv).
    # `uv pip install --python /app/.venv/bin/python` targets the runtime venv's
    # site-packages, matching where the app imports from.
    bootstrapScript: |
      #!/bin/bash
      # Superset 6.1.0 hard-requires redis>=5.0.0,<6.0 (pyproject.toml) and the image
      # already ships redis==5.3.1 (requirements/base.txt). The old `redis==4.5.4`
      # line here silently DOWNGRADED the client two majors below that floor on every
      # pod start — removed deliberately, DO NOT restore it.
      # psycopg2-binary and authlib ARE still needed: neither is in base.txt, and the
      # published `lean` image does not install the `postgres` extra. 6.1.0 pins
      # psycopg2-binary==2.9.9 in that extra; authlib 1.3.0 satisfies
      # flask-appbuilder[oauth] 5.0.2's Authlib<2.0.0,>=0.14.
      uv pip install --python /app/.venv/bin/python \
        psycopg2-binary==2.9.9 \
        authlib==1.3.0
      if [ ! -f ~/bootstrap ]; then echo "Running Superset with UID $(id -u)" > ~/bootstrap; fi

    # Superset Python config (OIDC + role mapping)
    # Chart generates a ConfigMap `superset-config` and mounts as /app/pythonpath/{key}
    configOverrides:
      oidc.py: |
        import os
        from flask_appbuilder.security.manager import AUTH_OAUTH

        # Behind the TLS-terminating Envoy Gateway (httproute.yaml -> Gateway
        # envoy-internal, sectionName https): trust X-Forwarded-* headers so
        # Flask builds OAuth callback URLs with the external https scheme
        # (otherwise redirect_uri is sent as http://... and Authentik rejects it).
        ENABLE_PROXY_FIX = True
        PROXY_FIX_CONFIG = {"x_for": 1, "x_proto": 1, "x_host": 1, "x_port": 1, "x_prefix": 1}

        AUTH_TYPE = AUTH_OAUTH
        AUTH_USER_REGISTRATION = True
        AUTH_USER_REGISTRATION_ROLE = "Gamma"
        AUTH_ROLES_SYNC_AT_LOGIN = True
        AUTH_ROLES_MAPPING = {
            "superset-admins": ["Admin"],
            "superset-users":  ["Gamma"],
        }

        OAUTH_PROVIDERS = [{
            "name": "authentik",
            "icon": "fa-key",
            "token_key": "access_token",
            "remote_app": {
                "client_id": os.environ["OIDC_CLIENT_ID"],
                "client_secret": os.environ["OIDC_CLIENT_SECRET"],
                "server_metadata_url": "https://auth.${SECRET_DOMAIN}/application/o/superset/.well-known/openid-configuration",
                "client_kwargs": {"scope": "openid email profile"},
            },
        }]

        FEATURE_FLAGS = {"EMBEDDED_SUPERSET": False, "ALERT_REPORTS": True}

    # --- Bundled PostgreSQL (metadata DB) — RETIRED 2026-09-05 ---
    # bitnamilegacy is an ARCHIVED registry (last push 2025-08-28; security
    # driver F-937701ef) and chart 0.22.4 pins
    # bitnamilegacy/postgresql:14.17.0-debian-12-r3 itself, so no chart bump
    # can fix it. The metadata DB is now postgres:18.6-alpine on superset-pg18
    # — pg18-deployment.yaml in this folder — reached via DB_HOST in
    # superset-secrets and database.host below. (Cut over 2026-09-08. The
    # postgres:17.11-alpine superset-pg workload was RETIRED 2026-09-09 — its
    # Deployment and Service are gone, and its volume was DECOMMISSIONED
    # 2026-09-11 by plan `superset-pg-decommission`. Rolling back onto 17.11 is
    # therefore a RESTORE-FROM-BACKUP operation: there is no retained PVC left to
    # bind. Restore the 2026-09-09 frozen Longhorn backup of superset-pg-data —
    # the only member of that set carrying the 6.1.0 alembic schema — into a new
    # volume, reset every local db-provider Admin account BEFORE serving traffic
    # (all those backups predate the 2026-09-08 rotation), then move DB_HOST.
    # See §6 of runbooks/maintenance/plans/superset-pg-decommission.md.)
    # The bundled-chart volume superset-postgresql-data (postgres 14.17) was
    # decommissioned by the same plan; its pv.yaml / data-pvc.yaml /
    # longhorn-volume.yaml are gone from this folder. Its frozen backups are
    # retained but have no viable restore into today's 6.1.0 schema.
    postgresql:
      enabled: false

    # --- Bundled Redis (broker/cache) ---
    # Same Bitnami image-mirror workaround as above.
    # Chart 0.20.0's superset_config.py builds the Celery/cache Redis URL from
    # env('REDIS_PASSWORD') at RUNTIME — a known upstream fix for the old
    # "password only wired from a Helm value, not a secret" limitation
    # (apache/superset #16246, #13995, PR #14274). superset-secrets already
    # supplies REDIS_PASSWORD (== redis-password, identical value) via
    # envFromSecrets, so the CLIENT is authenticated. Point the Redis SERVER at
    # that SAME SOPS secret so both sides share one password — no plaintext in
    # git. Verified by `helm template` render (2026-07-18): server
    # secretKeyRef=superset-secrets/redis-password, client env('REDIS_PASSWORD').
    # Bundled Bitnami redis retired 2026-08-17: bitnamilegacy is an ARCHIVED
    # registry (last push 2025-08-28, no future security fixes) and
    # docker.io/bitnami/redis publishes no semver tags. Security driver on the
    # superset-redis-official plan (security_ref F-f6239bec). Superset now uses
    # the official redis image deployed by redis-deployment.yaml in this folder.
    redis:
      enabled: false

    # The chart-generated superset-env secret is the ONLY envFrom the
    # wait-for-postgres-redis INIT containers get (the superset-secrets
    # override reaches the main containers, not init), and its REDIS_HOST
    # falls back to "<release>-redis-headless" unless cache.host is set —
    # that dead default kept every upgrade's init waiting forever during the
    # 2026-08-17 cutover (attempt/rollback thrash). Point the chart itself
    # at the replacement server.
    cache:
      host: superset-redis-official

    # --- SQL Lab results backend (Redis auth) ---
    # RESULTS_BACKEND is the ONE Redis client the chart builds from a HELM VALUE
    # instead of the runtime env(...) mechanism. `superset.redis.password`
    # coalesces .Values.cache.password / connections.redis_password — both of
    # which we deliberately leave unset, because the password lives in the SOPS
    # secret and putting it in a Helm value would publish it to this public repo.
    # The result was `RESULTS_BACKEND = RedisCache(..., password="")`, so every
    # SQL Lab query died with redis.AuthenticationError -> HTTP 500
    # "Authentication required.", while CACHE_CONFIG / DATA_CACHE_CONFIG kept
    # working because they are built from env('REDIS_PASSWORD') at RUNTIME.
    # That is why charts rendered and SQL Lab did not. Broken since 0796573e
    # (2026-08-17); last successful SQL Lab query 2026-05-01.
    #
    # `config.resultsBackend` is the chart's escape hatch: when it is a STRING it
    # is emitted RAW as `RESULTS_BACKEND = <string>` (_helpers.tpl:419), and the
    # key is excluded from the generic config-dump loop (_helpers.tpl:644) so it
    # is not also emitted as a literal. That lets us express the same runtime
    # lookup CACHE_CONFIG uses successfully — `env` and `RedisCache` are both
    # already in scope at that point in the generated superset_config.py.
    # Keep the host/port/key_prefix identical to the chart's own render; the
    # ONLY thing this changes is where the password comes from.
    #
    # NOTE the GLOBAL_ASYNC_QUERIES_* blocks render empty passwords too, but the
    # GLOBAL_ASYNC_QUERIES feature flag is NOT enabled (verified at runtime: the
    # only true flag is ALERT_REPORTS), so those blocks are inert. Left untouched
    # deliberately — if that flag is ever turned on, they must be fixed the same
    # way, and there is no chart escape hatch for them but `config.<KEY>`.
    config:
      resultsBackend: |-
        RedisCache(
            host=env("REDIS_HOST", "superset-redis-official"),
            password=env("REDIS_PASSWORD", ""),
            port=int(env("REDIS_PORT", "6379")),
            key_prefix="superset_results",
        )

    # Same trap on the DB side. `superset.db.host` in _helpers.tpl coalesces
    # .Values.database.host FIRST and otherwise falls through to
    # "<release>-postgresql", so the chart-generated superset-env Secret — the
    # ONLY envFrom the wait-for-postgres INIT containers get — carries whatever
    # is set here, NOT the DB_HOST in superset-secrets (which reaches the main
    # containers only). A stale value here is invisible for exactly as long as
    # the old Service still exists; the moment that DB is retired, every restart
    # of superset / superset-worker / superset-celerybeat hangs 120s in the init
    # gate and exits 1.
    #
    # THIS KEY MUST MOVE IN THE SAME CHANGE SET AS ANY DB_HOST CUTOVER.
    # It did not on 2026-09-08 (d9863640 moved only the SOPS key), which left the
    # init gate probing the retained 17.11 rollback while the app ran on 18.6 —
    # i.e. the protection was being provided by the very artifact scheduled for
    # deletion. Caught post-hoc by the doc and security agents; see
    # docs/sops/container-dependencies.md, whose rule this is.
    database:
      host: superset-pg18

    # --- Superset web/UI pods ---
    supersetNode:
      replicaCount: 1
      strategy:
        type: Recreate
      podAnnotations:
        secret.reloader.stakater.com/reload: "superset-secrets"
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          memory: 2Gi

    # --- Celery workers (async SQL, email reports) ---
    # Celery spawns N worker processes per pod (default = CPU count = 18 on nuc14);
    # OOM at 1Gi → either bump to 2Gi or cap concurrency. Cap concurrency for lower idle cost.
    supersetWorker:
      replicaCount: 1
      podAnnotations:
        secret.reloader.stakater.com/reload: "superset-secrets"
      command:
        - /bin/sh
        - -c
        - . /app/pythonpath/superset_bootstrap.sh; celery --app=superset.tasks.celery_app:app worker --concurrency=4
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 2Gi

    # --- Celery beat (scheduler for alerts/reports) ---
    supersetCeleryBeat:
      enabled: true
      podAnnotations:
        secret.reloader.stakater.com/reload: "superset-secrets"

    # --- init/boot: initdb + schema migrations ONLY (no admin creation) ---
    #
    # createAdmin is FALSE and MUST STAY FALSE. The chart renders
    # `.Values.init.adminUser.password` into superset_init.sh as a
    # SINGLE-QUOTED shell literal (`superset fab create-admin ... --password
    # '<value>'`), so it is never expanded from the environment. A previous
    # comment here claimed an ADMIN_PASSWORD env var from superset-secrets
    # "overrides" it — that was FALSE in both directions: the chart does not
    # read ADMIN_PASSWORD at all, and the literal that WAS here got published
    # to this public repo (and its git history) as a working FAB `provider=db`
    # credential. FAB's db login does not gate on AUTH_TYPE, so it bypassed
    # Authentik entirely and granted Superset Admin.
    #
    # The `admin` user already exists in the metadata DB and is retained
    # deliberately (SSO role mapping needs something to map onto). Its password
    # now lives ONLY in superset-secrets (SOPS) as ADMIN_PASSWORD and in the
    # DB's own hash. Nothing in this file, and nothing in the chart, applies it
    # — rotating that key requires running, inside a superset pod:
    #   superset fab reset-password --username admin --password "$ADMIN_PASSWORD"
    # Do NOT reintroduce a literal password here to "make it declarative".
    init:
      createAdmin: false

    # Expose via our httproute.yaml (Gateway API), not the chart's built-in
    # Ingress: ingress-nginx was deleted 2026-09-07 (ad1ea7c2), so an Ingress
    # object here would be inert and the app simply unreachable.
    service:
      type: ClusterIP
      port: 8088
    ingress:
      enabled: false
