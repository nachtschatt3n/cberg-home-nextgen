---
# RETAINED ROLLBACK ARTIFACT — metadata-DB volume for postgres:17.11-alpine
# (superset-pg). The Deployment + Service were deleted 2026-09-09 after the
# cutover to postgres 18.6; this Volume and its data are kept ON PURPOSE as the
# rollback. NOT an orphan to reclaim. Precedent: 90539942.
#
# The volume DETACHES with the workload gone, so daily-backup-all-volumes no
# longer produces new backups for it — the existing dailies are a FROZEN
# restore set that will not age out on its own.
#
# NOT registered in kustomization.yaml — Flux `targetNamespace: databases` would
# override `namespace: storage` and create a broken duplicate. Apply by hand once:
#   kubectl apply -f pg-longhorn-volume.yaml
apiVersion: longhorn.io/v1beta2
kind: Volume
metadata:
  name: superset-pg-data
  namespace: storage
spec:
  size: "21474836480"   # 20 Gi
  numberOfReplicas: 2
  dataEngine: v1
  accessMode: rwo
  frontend: blockdev
  migratable: false
  encrypted: false
