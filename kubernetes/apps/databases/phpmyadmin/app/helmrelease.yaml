---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: phpmyadmin
  namespace: databases
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  # postRenderers REMOVED 2026-09-07 (Envoy phase 2). It patched a
  # gethomepage label onto `kind: Ingress name: phpmyadmin`. With no Ingress
  # rendered that target matches NOTHING and kustomize fails the ENTIRE
  # post-render rather than skipping it — which stops the HelmRelease
  # installing at all. The label now lives directly on the HTTPRoute.
  # Grep postRenderers for `kind: Ingress` before converting any app.
  values:
    controllers:
      phpmyadmin:
        replicas: 1
        containers:
          app:
            image:
              repository: phpmyadmin
              # Digest-pinned: upstream rebuilds 5.2.3/latest in place
              tag: 5.2.3@sha256:6db6e0bc9959eb00395f5d927cc786cb63530a265663950ecb9faf5955419c37
              pullPolicy: IfNotPresent

            env:
              PMA_HOST: mariadb.databases.svc.cluster.local
              PMA_PORT: "3306"
              PMA_USER: root
              PMA_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: mariadb
                    key: mariadb-root-password
              UPLOAD_LIMIT: 300M

            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 80
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 80
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3

            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: 200m
                memory: 512Mi

    service:
      app:
        controller: phpmyadmin
        ports:
          http:
            port: 80
