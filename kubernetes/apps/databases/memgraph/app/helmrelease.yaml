---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app memgraph
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      memgraph:
        strategy: Recreate
        initContainers:
          init-sysctl:
            image:
              repository: busybox
              tag: 1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
            command:
              - sh
              - -c
              - sysctl -w vm.max_map_count=524288
            securityContext:
              privileged: true
          init-chown:
            image:
              repository: busybox
              tag: 1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
            command:
              - sh
              - -c
              - chown -R 101:101 /var/lib/memgraph
        containers:
          app:
            image:
              repository: memgraph/memgraph-mage
              tag: "3.12.0"
              pullPolicy: IfNotPresent
            args:
              - --bolt-address=0.0.0.0
              - --bolt-port=7687
              - --monitoring-port=7444
              - --also-log-to-stderr
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                memory: 2Gi
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 7687
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 7687
                  initialDelaySeconds: 5
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 3
      lab:
        strategy: Recreate
        containers:
          app:
            image:
              repository: memgraph/lab
              tag: "3.12.1"
              pullPolicy: IfNotPresent
            env:
              QUICK_CONNECT_MG_HOST: memgraph.databases.svc.cluster.local
              QUICK_CONNECT_MG_PORT: "7687"
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 3000
                  initialDelaySeconds: 15
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 3000
                  initialDelaySeconds: 5
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 3
    service:
      memgraph:
        controller: memgraph
        ports:
          bolt:
            port: 7687
          monitoring:
            port: 7444
      lab:
        controller: lab
        ports:
          http:
            port: 3000
    # Envoy Gateway migration phase 2 (2026-09-07): Ingress -> HTTPRoute.
    # The swap happens in ONE commit. k8s-gateway watches Ingress AND HTTPRoute,
    # so leaving both alive would publish two A records for this host (.100
    # nginx and .103 envoy) and it would resolve non-deterministically.
    #
    # DROPPED deliberately: the `tls:` block. Gateway API terminates TLS at the
    # LISTENER, not per route, and the envoy-internal https listener already
    # presents the wildcard *.${SECRET_DOMAIN} certificate.
    route:
      lab:
        kind: HTTPRoute
        hostnames:
          - "memgraph.${SECRET_DOMAIN}"
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: Gateway
            name: envoy-internal
            namespace: network
            # https only -- the http listener is owned cluster-wide by
            # httproute-https-redirect, which 301s every host.
            sectionName: https
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "Memgraph Lab"
          gethomepage.dev/group: "Databases"
          gethomepage.dev/icon: "https://avatars.githubusercontent.com/u/36494539"
          gethomepage.dev/description: "Graph database visualization and querying"
        labels:
          gethomepage.dev/enabled: "true"
        # Rule is MANDATORY here, not optional: this release enables two
        # Services (memgraph bolt/monitoring and lab http) so the chart's
        # "omit rules" shortcut hard-fails in _validate.tpl. It also has to
        # point at the `lab` identifier -- the primary Service is the bolt
        # endpoint, which is not what this hostname serves.
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: lab
                port: http
    persistence:
      data:
        existingClaim: memgraph-data
        advancedMounts:
          memgraph:
            init-chown:
              - path: /var/lib/memgraph
            app:
              - path: /var/lib/memgraph
