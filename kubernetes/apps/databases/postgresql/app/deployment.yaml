---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql
  namespace: databases
  labels:
    app: postgresql
spec:
  replicas: 1
  # Recreate (not the default RollingUpdate): this Deployment mounts the RWO
  # Longhorn PVC `postgresql-data-5g`. With replicas: 1 the RollingUpdate
  # defaults compute to maxSurge 1 (25% rounds UP) and maxUnavailable 0 (25%
  # rounds DOWN), so a rollout surges a second pod that must attach a volume
  # the old pod still holds, while the old pod is not allowed to terminate
  # until the new one is Ready -> FailedAttachVolume / Multi-Attach circular
  # wait. Recreate tears the old pod down FIRST.
  #
  # Trade-off: a brief outage on every postgresql rollout. That is inherent to
  # a single-replica RWO database and is preferable to a nondeterministic
  # multi-minute stall. See docs/sops/longhorn-rwo-multi-attach.md.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      containers:
      - name: postgresql
        image: pgvector/pgvector:pg16
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5432
          name: postgresql
        envFrom:
        - secretRef:
            name: postgresql
        env:
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        - name: POSTGRES_INITDB_ARGS
          value: "-c shared_preload_libraries=vector"
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: init-scripts
          mountPath: /docker-entrypoint-initdb.d
        readinessProbe:
          exec:
            command:
              - /bin/sh
              - -c
              - exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          initialDelaySeconds: 15
          timeoutSeconds: 2
          periodSeconds: 10
        livenessProbe:
          exec:
            command:
              - /bin/sh
              - -c
              - exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          initialDelaySeconds: 30
          timeoutSeconds: 2
          periodSeconds: 10
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: postgresql-data-5g
      - name: init-scripts
        configMap:
          name: postgresql-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: databases
  labels:
    app: postgresql
spec:
  type: ClusterIP
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
    name: postgresql
  selector:
    app: postgresql
