---
# One-shot init Job. Major suffix (v1, v2, …) tracks schema version. Minor
# suffix (v1a, v1b, …) tracks bash-only bootstrap fixes that don't alter
# the schema. Flux prune deletes the previous Job and creates the new one.
#
# History:
#   v1  — initial scaffold
#   v1a — psql -c didn't honour :'var' substitution; tried shell-escape via
#         ${VAR//\'/\'\'} but YAML/ConfigMap loading stripped the backslash.
#   v2  — runtime-assert + inline password; renamed slo_snapshots.window →
#         window_size (Postgres reserved word). Still saw empty passwords
#         in-cluster: Flux postBuild.substituteFrom is eating every ${VAR}
#         reference in the ConfigMap.
#   v2a — escape all bash ${VAR} as $${VAR} so Flux outputs a literal `${VAR}`.
#   v2b — sweep_writer got DB ownership but not table-level DML (tables were
#         created by `postgres`). Add explicit DML + sequence grants for
#         sweep_writer + future-table defaults. Schema unchanged.
#   v3  — added 4 operator-curated policy tables (accepted_risks,
#         slo_definitions, noise_suppressions, security_acceptances).
#         No data migration in this Job — runbooks/migrate-policy-to-db.py
#         is the one-shot. v2b's tables remain (idempotent CREATE IF NOT
#         EXISTS). sweep_writer's DML grants from v2b carry over via
#         ALTER DEFAULT PRIVILEGES.
#   v3a — pin image to the live digest (float-tag pinning batch); no schema or
#         bash change. Rename forces prune+recreate (Job spec is immutable);
#         bootstrap is idempotent.
#   v3b — pgvector 0.8.1-pg16 -> 0.8.6-pg16 (digest re-pinned). No schema or
#         bash change. The v3a Job could not be patched in place (Job
#         .spec.template is immutable), so the rename is the delivery
#         mechanism — see docs/sops/immutable-job-image-bumps.md. Same image
#         already validated in-cluster on the shared postgresql Deployment.
#   v4  — partial UNIQUE index uq_findings_open_finding_id on
#         sweep_findings(finding_id) WHERE resolved_at IS NULL. finding_id is
#         derived from the fingerprint so it can never be globally unique (a
#         resolved finding that recurs re-derives its old id), but two OPEN
#         rows sharing one is always a bug and silently mis-resolves every
#         by-id lookup. Needs table ownership, which the sweep_writer role
#         used by runbooks/refingerprint-findings.py does not have — hence
#         delivery here rather than in that migration. Index creation is
#         IF NOT EXISTS; run refingerprint-findings.py FIRST if any duplicate
#         open ids exist, or this Job fails on the index build.
#   v5  — CHECK ck_findings_resolved_status: resolved_at IS NULL OR
#         status='resolved'. "Resolved" was stored in two columns with nothing
#         keeping them agreed, and two separate resolve paths set one without
#         the other on 2026-08-18 — producing rows that auto-close treats as
#         closed while the board still renders them as live. Same ownership
#         constraint as v4, hence delivery here. The ADD fails loudly if any
#         row still violates it; fix the rows first.
#   v5a — wrap v5's DROP+ADD in an explicit transaction. schema.sql runs under
#         `psql -f` without --single-transaction, so the two statements
#         autocommitted independently: a failed ADD would have left the table
#         with NO constraint. SQL-delivery fix only; resulting schema identical.
apiVersion: batch/v1
kind: Job
metadata:
  name: sweep-history-init-v5a
  namespace: databases
  labels:
    app.kubernetes.io/name: sweep-history
    app.kubernetes.io/component: init
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 604800  # 7d retention so we can inspect logs after the fact
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sweep-history
        app.kubernetes.io/component: init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: pgvector/pgvector:0.8.6-pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
          command: ["bash", "/sql/bootstrap.sh"]
          env:
            # Service lives in this same namespace; short name resolves via
            # in-namespace DNS. FQDN omitted to avoid pre-commit false-positive
            # against unrelated cluster-Secret DSN substrings.
            - name: PGHOST
              value: postgresql
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgresql
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql
                  key: POSTGRES_PASSWORD
            - name: SWEEP_WRITER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sweep-history
                  key: SWEEP_WRITER_PASSWORD
            - name: SWEEP_READER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sweep-history
                  key: SWEEP_READER_PASSWORD
          volumeMounts:
            - name: sql
              mountPath: /sql
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
      volumes:
        - name: sql
          configMap:
            name: sweep-history-schema
            defaultMode: 0o555
