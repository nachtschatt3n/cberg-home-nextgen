---
# Sweep heartbeat — the watcher that does NOT share the Mac mini's fate.
#
# Every liveness signal about the ops pipeline used to originate on the Mac
# mini: the sweep runs there, the alert-bridge runs there, and the sweep's own
# self-checks run inside the sweep. If the Mac dies (power, disk, launchd,
# somebody unplugging it), the component that would report the outage dies
# with it, and the cluster looks quiet — indistinguishable from healthy.
#
# This CronJob runs IN-CLUSTER and asserts the EFFECT (a fresh sweep_cycles
# row exists), not the mechanism. Sweep cadence is 48h; 72h = one missed cycle
# plus a day of grace. If the newest cycle is older, the job FAILS, and the
# SweepHeartbeatStale PrometheusRule (kube-prometheus-stack app) turns that —
# or the job silently never running — into an Alertmanager->Telegram page,
# a path that involves no Mac component anywhere.
#
# P0.5 (G3) of the ops-continuity plan, 2026-08-26.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sweep-heartbeat
  namespace: databases
spec:
  schedule: "17 */6 * * *"
  timeZone: Europe/Berlin
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            runAsNonRoot: true
          containers:
            - name: check
              # digest-pinned per float-tag policy; same image family the
              # authentik channels-cleanup CronJob already runs
              image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
              env:
                - name: DSN
                  valueFrom:
                    secretKeyRef:
                      name: sweep-history
                      key: READER_DSN
              command:
                - /bin/sh
                - -c
                # $$ = Flux postBuild envsubst escaping (cluster-wide substitution)
                - |
                  set -e
                  # trigger='cron' ONLY. sweep_cycles also collects rows from
                  # alert-triage (trigger='alert') and hand-run sweeps
                  # (trigger='manual'), and MAX(started_at) over all of them
                  # reads fresh while the scheduler is dead. That is not
                  # hypothetical: between 2026-08-28 and 2026-09-03 the cron
                  # produced NOTHING for six days -- three missed 48h cycles --
                  # while this heartbeat passed every run, because alert rows on
                  # 08-28 and manual rows on 08-31 kept resetting the clock. The
                  # operator found it by noticing dates on a dashboard.
                  AGE=$$(psql "$$DSN" -tA -c "SELECT COALESCE(EXTRACT(EPOCH FROM now()-MAX(started_at)),1e9)::bigint FROM sweep_cycles WHERE trigger = 'cron'")
                  # 50h, not 72h. The cadence is 48h, so 72h could not fail until
                  # a cycle had been missed AND the next was already overdue --
                  # it reported healthy through the first miss by construction.
                  # 50h = one full period plus 2h of jitter: the FIRST miss trips.
                  echo "newest CRON sweep cycle: $${AGE}s ago (limit 180000s = 50h)"
                  if [ "$$AGE" -gt 180000 ]; then
                    echo "STALE: no cron-triggered sweep in >50h — the Mac-side"
                    echo "daily-operation session the cluster cron drives is"
                    echo "probably absent or wedged. Manual/alert cycles do NOT"
                    echo "clear this; the scheduler itself is what is broken."
                    exit 1
                  fi
                  echo "sweep heartbeat OK"
              resources:
                requests: {cpu: 10m, memory: 32Mi}
                limits: {memory: 64Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
