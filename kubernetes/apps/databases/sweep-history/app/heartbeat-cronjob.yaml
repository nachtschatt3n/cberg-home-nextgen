---
# Sweep heartbeat — the watcher that does NOT share the Mac mini's fate.
#
# Every liveness signal about the ops pipeline used to originate on the Mac
# mini: the sweep runs there, the alert-bridge runs there, and the sweep's own
# self-checks run inside the sweep. If the Mac dies (power, disk, launchd,
# somebody unplugging it), the component that would report the outage dies
# with it, and the cluster looks quiet — indistinguishable from healthy.
#
# This CronJob runs IN-CLUSTER and asserts the EFFECT (a fresh sweep_cycles
# row exists), not the mechanism. Sweep cadence is 48h; 72h = one missed cycle
# plus a day of grace. If the newest cycle is older, the job FAILS, and the
# SweepHeartbeatStale PrometheusRule (kube-prometheus-stack app) turns that —
# or the job silently never running — into an Alertmanager->Telegram page,
# a path that involves no Mac component anywhere.
#
# P0.5 (G3) of the ops-continuity plan, 2026-08-26.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sweep-heartbeat
  namespace: databases
spec:
  schedule: "17 */6 * * *"
  timeZone: Europe/Berlin
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            runAsNonRoot: true
          containers:
            - name: check
              # digest-pinned per float-tag policy; same image family the
              # authentik channels-cleanup CronJob already runs
              image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
              env:
                - name: DSN
                  valueFrom:
                    secretKeyRef:
                      name: sweep-history
                      key: READER_DSN
              command:
                - /bin/sh
                - -c
                # $$ = Flux postBuild envsubst escaping (cluster-wide substitution)
                - |
                  set -e
                  AGE=$$(psql "$$DSN" -tA -c "SELECT COALESCE(EXTRACT(EPOCH FROM now()-MAX(started_at)),1e9)::bigint FROM sweep_cycles")
                  echo "newest sweep cycle: $${AGE}s ago (limit 259200s = 72h)"
                  if [ "$$AGE" -gt 259200 ]; then
                    echo "STALE: no sweep cycle in >72h — Mac-side pipeline is down or wedged"
                    exit 1
                  fi
                  echo "sweep heartbeat OK"
              resources:
                requests: {cpu: 10m, memory: 32Mi}
                limits: {memory: 64Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
