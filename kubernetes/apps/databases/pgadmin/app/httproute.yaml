---
# Envoy Gateway migration phase 2 (2026-09-07): replaces ingress.yaml, which is
# deleted in the SAME commit. k8s-gateway watches Ingress AND HTTPRoute, so
# leaving both alive would publish two A records for this host (.100 nginx and
# .103 envoy) and it would resolve non-deterministically.
#
# DROPPED deliberately: cert-manager.io/cluster-issuer and the per-host
# `pgadmin-tls` Secret. Gateway API terminates TLS at the LISTENER, not per
# route, and the envoy-internal https listener already presents the wildcard
# *.${SECRET_DOMAIN} certificate -- so this host keeps a valid cert-manager
# certificate without a per-app Certificate. The old Secret is left in place
# untouched so that `git revert` of this commit is a working rollback.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pgadmin
  namespace: databases
  labels:
    gethomepage.dev/enabled: "true"
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "pgAdmin"
    gethomepage.dev/description: "Web-based PostgreSQL administration tool"
    gethomepage.dev/group: "Databases"
    gethomepage.dev/icon: "pgadmin.png"
    gethomepage.dev/pod-selector: "app=pgadmin"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-internal
      namespace: network
      # https only -- the http listener is owned cluster-wide by
      # httproute-https-redirect, which 301s every host.
      sectionName: https
  hostnames:
    - "pgadmin.${SECRET_DOMAIN}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: pgadmin
          port: 80
