---
# Envoy Gateway migration phase 2 (2026-09-07): replaces ingress.yaml, which is
# deleted in the SAME commit. k8s-gateway watches Ingress AND HTTPRoute, so
# leaving both alive would publish two A records for this host (.100 nginx and
# .103 envoy) and it would resolve non-deterministically.
#
# DROPPED deliberately: cert-manager.io/cluster-issuer and the per-host
# `redisinsight-tls` Secret. Gateway API terminates TLS at the LISTENER, not per
# route, and the envoy-internal https listener already presents the wildcard
# *.${SECRET_DOMAIN} certificate. The Secret is left in the cluster untouched so
# `git revert` of this commit is a working rollback.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: redisinsight
  namespace: databases
  labels:
    gethomepage.dev/enabled: "true"
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "RedisInsight"
    gethomepage.dev/description: "Modern Redis management UI"
    gethomepage.dev/group: "Databases"
    gethomepage.dev/icon: "redis.png"
    gethomepage.dev/pod-selector: "app=redisinsight"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-internal
      namespace: network
      # https only -- the http listener is owned cluster-wide by
      # httproute-https-redirect, which 301s every host.
      sectionName: https
  hostnames:
    - "redisinsight.${SECRET_DOMAIN}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: redisinsight
          port: 5540
