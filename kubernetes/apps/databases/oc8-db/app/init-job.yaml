---
# One-shot init Job. Version suffix (v1, v1a, ...) forces prune+recreate,
# because a Job's .spec.template is immutable -- see
# docs/sops/immutable-job-image-bumps.md. The bootstrap is idempotent.
#
# History:
#   v1 — initial: oc8_migrate/oc8_app roles, oc8 database, vector extension,
#        schema ownership and default privileges on the shared postgresql.
apiVersion: batch/v1
kind: Job
metadata:
  name: oc8-db-init-v1
  namespace: databases
  labels:
    app.kubernetes.io/name: oc8-db
    app.kubernetes.io/component: init
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 604800  # 7d, so the logs survive for inspection
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oc8-db
        app.kubernetes.io/component: init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: pgvector/pgvector:0.8.6-pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
          command: ["bash", "/sql/bootstrap.sh"]
          env:
            # Short name, not the FQDN: the service is in this namespace, and a
            # FQDN here trips the pre-commit cluster-Secret substring check.
            - name: PGHOST
              value: postgresql
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgresql
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql
                  key: POSTGRES_PASSWORD
            - name: OC8_MIGRATE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oc8-db
                  key: OC8_MIGRATE_PASSWORD
            - name: OC8_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oc8-db
                  key: OC8_APP_PASSWORD
          volumeMounts:
            - name: sql
              mountPath: /sql
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
      volumes:
        - name: sql
          configMap:
            name: oc8-db-bootstrap
            defaultMode: 0o555
