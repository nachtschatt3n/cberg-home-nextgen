---
# Envoy migration phase 2 — nocodb off nginx (forward-auth).
# Pattern + the 13 gotchas: docs/troubleshooting/envoy-phase2-conversion-pattern.md
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nocodb
  namespace: databases
  labels:
    gethomepage.dev/enabled: "true"
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "NocoDB"
    gethomepage.dev/group: "Databases"
    gethomepage.dev/icon: "nocodb.png"
    gethomepage.dev/description: "Smart spreadsheet - Open source Airtable alternative"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - "nocodb.${SECRET_DOMAIN}"
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - group: ""
          kind: Service
          name: nocodb
          port: 8080
---
# Callback route — separate and MORE specific than `/`; Gateway API resolves by
# longest match. Folded into the app route the login callback loops back to the
# app itself.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nocodb-authentik-outpost
  namespace: databases
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - "nocodb.${SECRET_DOMAIN}"
  rules:
    - matches:
        - path: { type: PathPrefix, value: /outpost.goauthentik.io }
      backendRefs:
        # Real Service cross-namespace — NOT the ExternalName shim the nginx
        # form used; Envoy resolves via EndpointSlices and ExternalName has none.
        - group: ""
          kind: Service
          name: ak-outpost-nocodb-forward-auth
          namespace: kube-system
          port: 9000
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: nocodb-forward-auth
  namespace: databases
spec:
  targetRefs:                    # app route ONLY — never the callback route
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: nocodb
  extAuth:
    failOpen: false              # outpost down => deny, never publish
    http:
      backendRefs:
        - group: ""
          kind: Service
          name: ak-outpost-nocodb-forward-auth
          namespace: kube-system
          port: 9000
      path: /outpost.goauthentik.io/auth/envoy    # /auth/nginx 500s here
      headersToBackend:
        - Set-Cookie
        - X-authentik-username
        - X-authentik-groups
        - X-authentik-email
        - X-authentik-name
        - X-authentik-uid
