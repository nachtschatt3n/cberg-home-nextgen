---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mariadb
  namespace: databases
spec:
  interval: 25m
  chart:
    spec:
      chart: mariadb
      version: 27.0.1
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
      interval: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  valuesFrom:
    - kind: Secret
      name: mariadb
      valuesKey: mariadb-root-password
      targetPath: auth.rootPassword
    - kind: Secret
      name: mariadb
      valuesKey: mariadb-password
      targetPath: auth.password
    - kind: Secret
      name: mariadb
      valuesKey: mariadb-user
      targetPath: auth.username
    - kind: Secret
      name: mariadb
      valuesKey: mariadb-database
      targetPath: auth.database
  values:
    # Bitnami's free-tier catalog publishes NO versioned tags for this image —
    # only a floating `latest` plus sha256-* digest tags. An unpinned `latest`
    # silently changed the server major underneath this release, so the image is
    # pinned BY DIGEST. This digest is MariaDB 13.0.1 (built 2026-08-14).
    # Trade-off: the pin also freezes patching at that build. Re-pin to a newer
    # digest deliberately (check the target's version label first) rather than
    # ever letting the tag float again.
    # GOTCHA when re-pinning across a SERVER MAJOR: the Bitnami entrypoint logged
    # "This installation is already upgraded" and skipped mariadb-upgrade on the
    # 12 -> 13 roll, leaving 12-format system tables under a 13 binary. Always
    # check /bitnami/mariadb/data/mariadb_upgrade_info matches SELECT VERSION()
    # afterwards, and if not run mariadb-upgrade --force by hand. Use
    # --protocol=socket --skip-ssl: over TLS/TCP the client connection resets
    # mid-run and leaves the upgrade half-applied.
    image:
      registry: registry-1.docker.io
      repository: bitnami/mariadb
      digest: "sha256:47bdb03b349e22c62443fa91d95b3f10366aa48ce9e4419990c99b7c23400fa9"
    auth:
      usePasswordFiles: false
    primary:
      # Legacy-compat for the my-software-showcase tenants (TYPO3 4.2 / Rails 3.2
      # era, 2026-08-18): relaxed sql_mode (strict rejects their inserts, e.g.
      # fields without defaults) and init_connect forcing the connection charset
      # to utf8(mb3) for clients that negotiate utf8mb4 (TYPO3 4.2 string-compares
      # the charset name). init_connect skips SUPER (root); modern clients that
      # SET NAMES themselves override it. Applied live via SET GLOBAL same day —
      # this block makes it survive pod restarts.
      configuration: |-
        [mysqld]
        skip-name-resolve
        explicit_defaults_for_timestamp
        basedir=/opt/bitnami/mariadb
        datadir=/bitnami/mariadb/data
        plugin_dir=/opt/bitnami/mariadb/plugin
        port=3306
        socket=/opt/bitnami/mariadb/tmp/mysql.sock
        tmpdir=/opt/bitnami/mariadb/tmp
        max_allowed_packet=16M
        bind-address=*
        pid-file=/opt/bitnami/mariadb/tmp/mysqld.pid
        log-error=/opt/bitnami/mariadb/logs/mysqld.log
        character-set-server=UTF8
        collation-server=utf8_general_ci
        slow_query_log=0
        long_query_time=10.0
        sql_mode=NO_ENGINE_SUBSTITUTION
        init_connect="SET NAMES utf8"

        [client]
        port=3306
        socket=/opt/bitnami/mariadb/tmp/mysql.sock
        default-character-set=UTF8
        plugin_dir=/opt/bitnami/mariadb/plugin

        [manager]
        port=3306
        socket=/opt/bitnami/mariadb/tmp/mysql.sock
        pid-file=/opt/bitnami/mariadb/tmp/mysqld.pid
      persistence:
        enabled: true
        existingClaim: mariadb-data-5g
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi
    service:
      type: ClusterIP
      ports:
        mysql: 3306
    ingress:
      enabled: true
      ingressClassName: internal
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: "MariaDB"
        gethomepage.dev/description: "MariaDB is a community-developed, commercially supported, and open-source relational database"
        gethomepage.dev/group: "Databases"
        gethomepage.dev/icon: "mariadb.png"
      labels:
        gethomepage.dev/enabled: "true"

      hostname: &host "mariadb.${SECRET_DOMAIN}"
      hosts:
        - *host
      tls:
        - hosts:
            - *host
