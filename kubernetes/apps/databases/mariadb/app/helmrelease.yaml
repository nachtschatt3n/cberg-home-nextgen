---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mariadb
  namespace: databases
spec:
  interval: 25m
  chart:
    spec:
      chart: mariadb
      version: 27.0.1
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
      interval: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      # Temporarily 0 for the 12 -> 13 datadir migration: an auto-rollback fired
      # mid-migration is worse than a stalled upgrade. Restored to 3 immediately
      # after verification.
      retries: 0
      remediateLastFailure: false
  valuesFrom:
    - kind: Secret
      name: mariadb
      valuesKey: mariadb-root-password
      targetPath: auth.rootPassword
    - kind: Secret
      name: mariadb
      valuesKey: mariadb-password
      targetPath: auth.password
    - kind: Secret
      name: mariadb
      valuesKey: mariadb-user
      targetPath: auth.username
    - kind: Secret
      name: mariadb
      valuesKey: mariadb-database
      targetPath: auth.database
  values:
    # Bitnami's free-tier catalog publishes NO versioned tags for this image —
    # only a floating `latest` plus sha256-* digest tags. An unpinned `latest`
    # silently changed the server major underneath this release, so the image is
    # pinned BY DIGEST. This digest is MariaDB 13.0.1 (built 2026-08-14).
    # Trade-off: the pin also freezes patching at that build — review on the date
    # tracked with the accepted risk, and re-pin to a newer digest deliberately.
    image:
      registry: registry-1.docker.io
      repository: bitnami/mariadb
      digest: "sha256:47bdb03b349e22c62443fa91d95b3f10366aa48ce9e4419990c99b7c23400fa9"
    auth:
      usePasswordFiles: false
    primary:
      persistence:
        enabled: true
        existingClaim: mariadb-data-5g
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi
    service:
      type: ClusterIP
      ports:
        mysql: 3306
    ingress:
      enabled: true
      ingressClassName: internal
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: "MariaDB"
        gethomepage.dev/description: "MariaDB is a community-developed, commercially supported, and open-source relational database"
        gethomepage.dev/group: "Databases"
        gethomepage.dev/icon: "mariadb.png"
      labels:
        gethomepage.dev/enabled: "true"

      hostname: &host "mariadb.${SECRET_DOMAIN}"
      hosts:
        - *host
      tls:
        - hosts:
            - *host
