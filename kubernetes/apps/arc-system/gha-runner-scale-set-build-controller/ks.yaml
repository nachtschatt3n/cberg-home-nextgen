apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gha-runner-scale-set-build-controller
  namespace: flux-system
spec:
  targetNamespace: arc-system
  dependsOn:
    - name: gha-runner-scale-set-controller
  path: ./kubernetes/apps/arc-system/gha-runner-scale-set-build-controller/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
