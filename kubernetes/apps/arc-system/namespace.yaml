---
apiVersion: v1
kind: Namespace
metadata:
  name: arc-system
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    # controller (distroless nonroot) and listener pods carry the restricted
    # securityContext from helmrelease.yaml / the scale set's listenerTemplate.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
