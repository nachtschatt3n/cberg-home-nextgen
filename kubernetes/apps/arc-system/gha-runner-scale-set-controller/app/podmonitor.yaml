---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/monitoring.coreos.com/podmonitor_v1.json
# Controller (gha_controller_*) and listener (gha_*) metrics, both on the
# container port named `metrics` (:8080). Alerts:
# kubernetes/apps/monitoring/kube-prometheus-stack/app/gha-runner-scale-set-alerts.yaml
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: arc
  labels:
    release: kube-prometheus-stack
spec:
  # Select on the component label: ARC 0.15 overwrites the listener pod's
  # app.kubernetes.io/name with the scale-set name (ninth-banner-k8s, ...),
  # so the listenerTemplate's `the-ninth-banner-arc-listener` never reached the
  # pod and no listener was scraped (ARCRunnerScaleSetNotRegistered firing
  # since 2026-10-06). Both controllers (CPU/browser + build) and all three
  # listeners match; namespace = arc-system only (PodMonitor default).
  selector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          - controller-manager
          - runner-scale-set-listener
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 30s
