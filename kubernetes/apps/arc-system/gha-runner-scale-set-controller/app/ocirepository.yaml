---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/ocirepository-source-v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: gha-runner-scale-set-controller
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    # Controller and scale-set chart MUST stay on the same version: bump
    # ../../../ci-runner/the-ninth-banner-runners/app/ocirepository.yaml in the
    # same commit. Digest = immutable pin (GHCR tags are mutable); re-derive it
    # from the registry on every bump (`helm show chart oci://...` prints it).
    tag: 0.15.1
    digest: sha256:c2497a6dedaaa723322abfe9ea2f5a81b9b8fbb90b38e45d7835b6c7629a3aae
  url: oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set-controller
