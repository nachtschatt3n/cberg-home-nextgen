---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: absenty
  namespace: my-software-development
spec:
  image: ghcr.io/nachtschatt3n/absenty
  interval: 10m
  secretRef:
    name: ghcr-secret
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: absenty
  namespace: my-software-development
spec:
  imageRepositoryRef:
    name: absenty
  filterTags:
    # ci.yml in the Absenty repo is the only publisher, and it emits
    # `development-<YYYYMMDDHHMMSS>` ONLY from a push to the `development` branch.
    # Every tag it publishes is branch-prefixed, so a build for the other
    # environment -- or a pull-request build, which no longer publishes at
    # all -- cannot be selected here.
    # The ^...$ anchors are SECURITY-LOAD-BEARING, not style: Flux matches
    # filterTags unanchored, and 18 legacy tags are shaped
    # `sha-20060102150405-<sha>` (docker/metadata-action does not expand Go
    # date layouts in type=raw, so it published the layout literally). Those
    # contain a 14-digit run that (?P<ts>\d{14}) would otherwise extract.
    pattern: '^development-(?P<ts>\d{14})$'
    extract: '$ts'
  policy:
    # The timestamp is a fixed-width, monotonically increasing counter, so
    # this selects the NEWEST BUILD. The previous config sorted bare 7-char
    # hex git shas alphabetically, which is not a time order at all: it had
    # been pinned since 2025-10 to whichever sha happened to start with `ff`.
    numerical:
      order: asc
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: absenty-image-updates
  namespace: my-software-development
spec:
  # UNSUSPENDED 2026-08-15, after both reasons it was suspended were removed:
  #   1. the ImagePolicy above now selects by build time, not by hex-sha sort;
  #   2. the upstream ci.yml is now the only publisher, it branch-prefixes
  #      every tag, and it does not publish from pull_request events at all --
  #      so a PR build can no longer wear a tag this policy would select.
  # NOTE: a SUSPENDED ImageUpdateAutomation still reports READY=True. Check
  # `.spec.suspend` directly; do not infer state from the Ready condition.
  interval: 30m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        email: fluxcdbot@users.noreply.github.com
        name: fluxcdbot
      messageTemplate: |
        chore(absenty-dev): update container images

        Automation name: {{ .AutomationObject }}

        Files updated:
        {{ range $filename, $_ := .Changed.FileChanges -}}
        - {{ $filename }}
        {{ end -}}

        Objects updated:
        {{ range $resource, $changes := .Changed.Objects -}}
        - {{ $resource.Kind }} {{ $resource.Name }}
        {{- range $_, $change := $changes }}
          {{ $change.OldValue }} -> {{ $change.NewValue }}
        {{ end -}}
        {{ end -}}
    push:
      branch: main
  update:
    strategy: Setters
    path: "./kubernetes/apps/my-software-development"
