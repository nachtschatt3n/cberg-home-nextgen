apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: andreamosteller-legacy
  namespace: my-software-development
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      # Load-bearing for image automation: a tag whose pod fails its
      # startup/readiness probes times the upgrade out and is rolled back.
      strategy: rollback
      retries: 3
  values:
    controllers:
      andreamosteller-legacy:
        replicas: 1
        containers:
          app:
            image:
              repository: ghcr.io/nachtschatt3n/andreamosteller-site
              # Tracks the `latest` build; the digest is bumped by ./image-automation.yaml.
              tag: latest # {"$imagepolicy": "my-software-development:andreamosteller-legacy:tag"}
              digest: sha256:bd066707ffe7e038f1615339956852ffa04336e35eb1ca3451d719f597608abe # {"$imagepolicy": "my-software-development:andreamosteller-legacy:digest"}
              pullPolicy: IfNotPresent
            env:
              TZ: ${TIMEZONE}
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8080
                  periodSeconds: 5
                  timeoutSeconds: 3
                  failureThreshold: 30
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8080
                  periodSeconds: 30
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8080
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
    # nginx-unprivileged runs as uid/gid 101.
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: "OnRootMismatch"
        seccompProfile:
          type: RuntimeDefault
    service:
      main:
        controller: andreamosteller-legacy
        ports:
          http:
            port: 8080
    route:
      main:
        kind: HTTPRoute
        hostnames:
          - "beta-legacy-andreamosteller.${SECRET_DOMAIN}"
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: Gateway
            name: envoy-internal
            namespace: network
            # https only. The http listener is owned cluster-wide by
            # httproute-https-redirect, which 301s every host.
            sectionName: https
        labels:
          gethomepage.dev/enabled: "true"
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "Andrea Mosteller Legacy Beta"
          gethomepage.dev/description: "Beta of the legacy andreamosteller.com static site (latest build)"
          gethomepage.dev/group: "Software Development"
          gethomepage.dev/icon: "mdi-web"
          gethomepage.dev/pod-selector: "app.kubernetes.io/name=andreamosteller-legacy"
    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      cache:
        type: emptyDir
        globalMounts:
          - path: /var/cache/nginx
      run:
        type: emptyDir
        globalMounts:
          - path: /var/run
