# Homepage's manual device inventory -- the `config.services` Helm values,
# merged into the HelmRelease by spec.valuesFrom (kind: Secret, valuesKey
# values.yaml). Flux merges valuesFrom BEFORE spec.values, so these entries
# and the `config.*` keys left in helmrelease.yaml end up in one values tree.
#
# WHY THIS IS ENCRYPTED AT ALL (security_ref: F-93102d77). Nothing in here is
# a credential. This repository is public, and these entries pair private LAN
# addresses with each device's role and model -- any one line is harmless, the
# LIST is a map of the house network. So SOPS is protecting a topology here,
# not a secret, which is why the file looks like values and not like a
# password.
#
# WHY HOSTNAMES ARE LITERAL and not ${SECRET_DOMAIN}: no other *.sops.yaml in
# this repo depends on Flux postBuild substitution reaching decrypted Secret
# content, and the payload is encrypted either way -- a literal removes a
# dependency instead of adding an unproven one. The cost is real though: a
# domain rotation has to edit this file too.
#
# Edit:   sops kubernetes/apps/default/homepage/app/secret.sops.yaml
# Verify: the rendered dashboard config must not change --
#   kubectl -n default get cm homepage -o jsonpath='{.data.services\.yaml}'
#
# Namespace is deliberately absent: ks.yaml sets targetNamespace default, the
# same way the sibling helmrelease.yaml gets its namespace.
apiVersion: v1
kind: Secret
metadata:
  name: homepage-values
type: Opaque
stringData:
