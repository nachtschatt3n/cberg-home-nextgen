---
# Envoy migration phase 2 — homepage off nginx (forward-auth).
# Pattern + the gotchas: docs/troubleshooting/envoy-phase2-conversion-pattern.md
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: homepage
  namespace: default
  labels:
    gethomepage.dev/enabled: "false"
  annotations:
    gethomepage.dev/description: "A modern, secure, application dashboard"
    gethomepage.dev/enabled: "false"
    gethomepage.dev/group: "System"
    gethomepage.dev/icon: "homepage.png"
    gethomepage.dev/name: "Homepage"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - "homepage.${SECRET_DOMAIN}"
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - group: ""
          kind: Service
          name: homepage
          port: 3000
---
# Callback route — separate and MORE specific than `/`; Gateway API resolves by
# longest match, so folding it in would loop the login callback into the app.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: homepage-authentik-outpost
  namespace: default
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - "homepage.${SECRET_DOMAIN}"
  rules:
    - matches:
        - path: { type: PathPrefix, value: /outpost.goauthentik.io }
      backendRefs:
        # Real Service cross-namespace, NOT an ExternalName shim — Envoy
        # resolves backends via EndpointSlices and ExternalName has none.
        - group: ""
          kind: Service
          name: ak-outpost-homepage-forward-auth
          namespace: kube-system
          port: 9000
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: homepage-forward-auth
  namespace: default
spec:
  targetRefs:                    # app route ONLY, never the callback route
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: homepage
  extAuth:
    failOpen: false              # outpost down => deny, never publish
    http:
      backendRefs:
        - group: ""
          kind: Service
          name: ak-outpost-homepage-forward-auth
          namespace: kube-system
          port: 9000
      path: /outpost.goauthentik.io/auth/envoy   # /auth/nginx 500s here
      headersToBackend:
        - Set-Cookie
        - X-authentik-username
        - X-authentik-groups
        - X-authentik-email
        - X-authentik-name
        - X-authentik-uid
