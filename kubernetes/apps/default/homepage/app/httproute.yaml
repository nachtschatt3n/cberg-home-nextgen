---
# Envoy migration phase 2 — homepage off nginx (forward-auth).
# Pattern + the gotchas: docs/sops/gateway-api-httproute.md
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: homepage
  namespace: default
  labels:
    gethomepage.dev/enabled: "false"
  annotations:
    gethomepage.dev/description: "A modern, secure, application dashboard"
    gethomepage.dev/enabled: "false"
    gethomepage.dev/group: "System"
    gethomepage.dev/icon: "homepage.png"
    gethomepage.dev/name: "Homepage"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - "homepage.${SECRET_DOMAIN}"
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - group: ""
          kind: Service
          name: homepage
          port: 3000
---
# Callback route — separate and MORE specific than `/`; Gateway API resolves by
# longest match, so folding it in would loop the login callback into the app.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: homepage-authentik-outpost
  namespace: default
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - "homepage.${SECRET_DOMAIN}"
  rules:
    - matches:
        - path: { type: PathPrefix, value: /outpost.goauthentik.io }
      backendRefs:
        # Real Service cross-namespace, NOT an ExternalName shim — Envoy
        # resolves backends via EndpointSlices and ExternalName has none.
        - group: ""
          kind: Service
          name: ak-outpost-homepage-forward-auth
          namespace: kube-system
          port: 9000
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: homepage-forward-auth
  namespace: default
spec:
  targetRefs:                    # app route ONLY, never the callback route
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: homepage
  extAuth:
    failOpen: false              # outpost down => deny, never publish
    # MANDATORY. Without this list Envoy sends the ext-auth service ONLY Host,
    # Method, Path, Content-Length and Authorization (CRD doc on this very
    # field) — so the outpost never sees `authentik_proxy_*` and CANNOT know the
    # client is logged in. Every check then denies with a fresh 302 + a fresh
    # session/state cookie; the page's parallel asset requests each start their
    # own flow and clobber that cookie, so the top-level callback comes back
    # with a state the surviving session does not know. The outpost answers
    # `oauth state does not match the session` => **HTTP 400 in the browser**.
    # Measured before this fix: 75 successful callbacks, 0 requests ever
    # allowed through to the app. nginx's auth_request passed the Cookie header
    # implicitly, which is why this only appeared after the Envoy migration.
    headersToExtAuth:
      - cookie                   # the session — the one that actually fixes it
      - accept                   # lets the outpost 401 assets instead of
                                 # redirecting them (kills the clobber storm)
      - user-agent               # authentik login events, not the Envoy pod
      - x-forwarded-for          # real client IP in those events
      - x-forwarded-proto
    http:
      backendRefs:
        - group: ""
          kind: Service
          name: ak-outpost-homepage-forward-auth
          namespace: kube-system
          port: 9000
      path: /outpost.goauthentik.io/auth/envoy   # /auth/nginx 500s here
      headersToBackend:
        - Set-Cookie
        - X-authentik-username
        - X-authentik-groups
        - X-authentik-email
        - X-authentik-name
        - X-authentik-uid
