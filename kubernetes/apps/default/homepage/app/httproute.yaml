---
# Envoy migration phase 2 — homepage off nginx (forward-auth).
# Pattern + the gotchas: docs/sops/gateway-api-httproute.md
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: homepage
  namespace: default
  labels:
    gethomepage.dev/enabled: "false"
  annotations:
    gethomepage.dev/description: "A modern, secure, application dashboard"
    gethomepage.dev/enabled: "false"
    gethomepage.dev/group: "System"
    gethomepage.dev/icon: "homepage.png"
    gethomepage.dev/name: "Homepage"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - "homepage.${SECRET_DOMAIN}"
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - group: ""
          kind: Service
          name: homepage
          port: 3000
---
# Callback route — separate and MORE specific than `/`; Gateway API resolves by
# longest match, so folding it in would loop the login callback into the app.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: homepage-authentik-outpost
  namespace: default
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - "homepage.${SECRET_DOMAIN}"
  rules:
    - matches:
        - path: { type: PathPrefix, value: /outpost.goauthentik.io }
      backendRefs:
        # Real Service cross-namespace, NOT an ExternalName shim — Envoy
        # resolves backends via EndpointSlices and ExternalName has none.
        - group: ""
          kind: Service
          name: ak-outpost-homepage-forward-auth
          namespace: kube-system
          port: 9000
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: homepage-forward-auth
  namespace: default
spec:
  targetRefs:                    # app route ONLY, never the callback route
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: homepage
  extAuth:
    failOpen: false              # outpost down => deny, never publish
    # MANDATORY. Without this list Envoy sends the ext-auth service ONLY Host,
    # Method, Path, Content-Length and Authorization (CRD doc on this very
    # field) — so the outpost never sees `authentik_proxy_*` and CANNOT know the
    # client is logged in. Every check then denies with a fresh 302 + a fresh
    # session/state cookie; the page's parallel asset requests each start their
    # own flow and clobber that cookie, so the top-level callback comes back
    # with a state the surviving session does not know. The outpost answers
    # `oauth state does not match the session` => **HTTP 400 in the browser**.
    # Measured before this fix: 75 successful callbacks, 0 requests ever
    # allowed through to the app. nginx's auth_request passed the Cookie header
    # implicitly, which is why this only appeared after the Envoy migration.
    headersToExtAuth:
      - cookie                   # the session — the one that actually fixes it
      - accept                   # forwarded for completeness only: MEASURED on
                                 # this Rust outpost, an unauthenticated asset
                                 # request is answered 302 whatever Accept says,
                                 # so this does NOT suppress the clobber storm.
                                 # The storm stops because `cookie` above makes
                                 # the first callback stick.
      - user-agent               # the outpost's own request log — this is what
                                 # the 400 was diagnosed from
    # DELIBERATELY NOT FORWARDED: x-forwarded-for / x-forwarded-proto. They were
    # in the first cut of this fix for "real client IP in authentik events", and
    # the security review then MEASURED the cost: Envoy appends to XFF rather
    # than sanitising it, and ClientTrafficPolicy/envoy-internal-client trusts
    # all of 192.168.0.0/16, so a LAN client sending its own XFF has that value
    # selected as the client IP — a sentinel `203.0.113.77` showed up as the
    # outpost's `remote=`. No bypass (the request was still denied), but it makes
    # the recorded IP forgeable, which is what IP-keyed lockout scoring reads.
    # The redirect URI is built correctly without x-forwarded-proto — verified
    # against the live outpost. Neither header is needed; neither is forwarded.
    http:
      backendRefs:
        - group: ""
          kind: Service
          name: ak-outpost-homepage-forward-auth
          namespace: kube-system
          port: 9000
      path: /outpost.goauthentik.io/auth/envoy   # /auth/nginx 500s here
      headersToBackend:
        - Set-Cookie
        - X-authentik-username
        - X-authentik-groups
        - X-authentik-email
        - X-authentik-name
        - X-authentik-uid
