---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app andreamosteller
  namespace: my-software-production
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      andreamosteller:
        containers:
          app:
            image:
              repository: ghcr.io/nachtschatt3n/andreamosteller.com
              tag: 5d88656-unprivileged-v2
              pullPolicy: IfNotPresent
            env:
              TZ: ${TIMEZONE}
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 8080
                  initialDelaySeconds: 5
                  periodSeconds: 20
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
    defaultPodOptions:
      imagePullSecrets:
        - name: ghcr-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: "OnRootMismatch"
        seccompProfile:
          type: RuntimeDefault
    service:
      main:
        controller: andreamosteller
        ports:
          http:
            port: *port
    # Envoy migration PHASE 3: Ingress -> HTTPRoute on envoy-EXTERNAL.
    #
    # NO external-dns target annotation. With --source=gateway-httproute
    # external-dns reads the target from the parent GATEWAY and silently
    # ignores it on the route; it is already set on Gateway/envoy-external.
    # Putting it here took a hostname dark publicly on 2026-09-07.
    #
    # NO SecurityPolicy / ext-auth. This app authenticates in-app and never
    # had nginx forward-auth; adding ext-auth would put a second login in
    # front of an app that already has one.
    #
    # rules omitted deliberately: exactly one enabled Service, so
    # app-template defaults the backendRef to it.
    route:
      main:
        kind: HTTPRoute
        hostnames:
          - "pro-andreamosteller.${SECRET_DOMAIN}"
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: Gateway
            name: envoy-external
            namespace: network
            # https only. The http listener is owned cluster-wide by
            # httproute-https-redirect, which 301s every host.
            sectionName: https
        labels:
          gethomepage.dev/enabled: "true"
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "Andrea Mosteller"
          gethomepage.dev/description: "andreamosteller.com production site"
          gethomepage.dev/group: "Software Development"
          gethomepage.dev/icon: "mdi-web"
    persistence:
      cache:
        type: emptyDir
        globalMounts:
          - path: /var/cache/nginx
      run:
        type: emptyDir
        globalMounts:
          - path: /var/run
