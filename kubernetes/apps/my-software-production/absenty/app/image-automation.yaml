---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: absenty
  namespace: my-software-production
spec:
  image: ghcr.io/nachtschatt3n/absenty
  interval: 10m
  secretRef:
    name: ghcr-secret
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: absenty
  namespace: my-software-production
spec:
  imageRepositoryRef:
    name: absenty
  filterTags:
    # ci.yml in the Absenty repo is the only publisher, and it emits
    # `production-<YYYYMMDDHHMMSS>` ONLY from a push to the `production` branch.
    # Every tag it publishes is branch-prefixed, so a build for the other
    # environment -- or a pull-request build, which no longer publishes at
    # all -- cannot be selected here.
    pattern: '^production-(?P<ts>\d{14})$'
    extract: '$ts'
  policy:
    # The timestamp is a fixed-width, monotonically increasing counter, so
    # this selects the NEWEST BUILD. The previous config sorted bare 7-char
    # hex git shas alphabetically, which is not a time order at all: it had
    # been pinned since 2025-10 to whichever sha happened to start with `ff`.
    numerical:
      order: asc
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: absenty-image-updates
  namespace: my-software-production
spec:
  # SUSPENDED 2026-08-15: the ImagePolicy below sorts 7-char hex shas
  # alphabetically, so it has been pinned to the highest hex tag (sha-ff*)
  # since 2025-10 and silently ignored every newer build. Left armed, it
  # would also deploy an arbitrary PR build whose sha happens to sort high.
  # Re-enable together with the ImagePolicy fix (see runbooks/maintenance/
  # plans/absenty-rebuild.md) once the image backlog decision is made.
  suspend: true
  interval: 30m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        email: fluxcdbot@users.noreply.github.com
        name: fluxcdbot
      messageTemplate: |
        chore(absenty-prod): update container images

        Automation name: {{ .AutomationObject }}

        Files updated:
        {{ range $filename, $_ := .Changed.FileChanges -}}
        - {{ $filename }}
        {{ end -}}

        Objects updated:
        {{ range $resource, $changes := .Changed.Objects -}}
        - {{ $resource.Kind }} {{ $resource.Name }}
        {{- range $_, $change := $changes }}
          {{ $change.OldValue }} -> {{ $change.NewValue }}
        {{ end -}}
        {{ end -}}
    push:
      branch: main
  update:
    strategy: Setters
    path: "./kubernetes/apps/my-software-production"
