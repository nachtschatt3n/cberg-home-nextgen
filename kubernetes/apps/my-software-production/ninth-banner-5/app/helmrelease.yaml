# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
# The Ninth Banner, v0.5 line, on its own address (ninthbanner-5). Same image
# as the main game; follows its OWN ImagePolicy `ninth-banner-5`, range
# '>=0.5.0 <0.6.0' (./image-automation.yaml), so it stays on v0.5.x when the
# main address later moves to the v0.6 line.
#
# Same app config as the main game except: own feedback/analytics database
# (ninth_banner_5_feedback) with a smaller store cap, own edge rate limit on
# POST /ai/generate (httproute.yaml).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ninth-banner-5
  namespace: my-software-production
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      # Load-bearing for image automation: a release tag whose pod fails its
      # startup/readiness probes times the upgrade out and is rolled back.
      strategy: rollback
      retries: 3
  values:
    controllers:
      ninth-banner-5:
        # No local state (static game + /ai/* proxy; feedback goes to the
        # shared postgresql). One replica:
        # the proxy's per-client rate limit and session budget are in-memory.
        replicas: 1
        containers:
          app:
            image:
              repository: ghcr.io/nachtschatt3n/the-ninth-banner
              # v0.5.x release tags only; updated by the ImageUpdateAutomation
              # in ./image-automation.yaml (policy '>=0.5.0 <0.6.0').
              tag: v0.5.5 # {"$imagepolicy": "my-software-production:ninth-banner-5:tag"}
              pullPolicy: IfNotPresent
            env:
              - name: PORT
                value: "8080"
              - name: HOST
                value: "0.0.0.0"
              - name: TZ
                value: Europe/Berlin
              # The image defaults to AI_PROVIDER=offline; enable the proxy.
              - name: AI_PROVIDER
                value: ollama
              # Shared Mac mini Ollama host. gemma4:26b-mlx is in the pinned
              # warm set. The client sends think:false, never keep_alive or
              # num_ctx, and keeps one request in flight -- either of the
              # former would reload or un-pin the shared model for ~15 other
              # apps. docs/ai-usage-map.md, docs/sops/ai-integration.md.
              - name: OLLAMA_URL
                value: http://192.168.30.111:11434
              - name: OLLAMA_MODEL
                value: gemma4:26b-mlx
              # Player feedback + play statistics: the -5 instance's OWN db
              # ninth_banner_5_feedback (role + db from
              # databases/ninth-banner-5-feedback-db). The app creates its own
              # tables. Secret: ./feedback-secret.sops.yaml.
              - name: FEEDBACK_DATABASE_URL
                valueFrom:
                  secretKeyRef:
                    name: ninth-banner-5-feedback
                    key: FEEDBACK_DATABASE_URL
              - name: FEEDBACK_ADMIN_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: ninth-banner-5-feedback
                    key: FEEDBACK_ADMIN_TOKEN
              # Store cap on the SHARED 5Gi postgresql volume. Smaller than the
              # main game's 512: this is the fallback address.
              - name: FEEDBACK_MAX_MB
                value: "128"
              - name: FEEDBACK_RETENTION_DAYS
                value: "180"
            probes:
              # /healthz (v0.1.1+): static {ok, version}, no Ollama call, and not
              # access-logged on success (Gotcha #13). /ai/health still exists in the
              # app for humans but is no longer a probe target.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8080
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 30
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8080
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8080
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 25m
                memory: 96Mi
              limits:
                cpu: 500m
                memory: 256Mi
    # Image USER is numeric 1000:1000; pin it so runAsNonRoot is enforceable.
    defaultPodOptions:
      automountServiceAccountToken: false
      # Private GHCR package (the source repo is private).
      imagePullSecrets:
        - name: ghcr-the-ninth-banner
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: ninth-banner-5
        ports:
          http:
            port: 80
            targetPort: 8080
    # In-cluster scrape of GET /metrics on the app port. The gateway 404s
    # /metrics, so it is never public.
    serviceMonitor:
      app:
        serviceName: ninth-banner-5
        endpoints:
          - port: http
            scheme: http
            path: /metrics
            interval: 30s
            scrapeTimeout: 10s
        labels:
          release: kube-prometheus-stack
    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
