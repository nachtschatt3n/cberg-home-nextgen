# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
---
# Owner-only preview of The Ninth Banner: the art line's preview (v0.6.x).
# Behind Authentik forward-auth (authentik Admins only).
# Named ninth-banner-preview, NOT the-ninth-banner-preview: the production
# alerts and selectors match pod=~"the-ninth-banner-.*".
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app ninth-banner-preview
  namespace: flux-system
spec:
  targetNamespace: my-software-production
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/my-software-production/ninth-banner-preview/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
