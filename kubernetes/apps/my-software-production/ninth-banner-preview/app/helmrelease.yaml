# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
---
# The Ninth Banner preview: the art line (v0.6.x releases, 3D battlefield),
# shown here before the live game moves to it.
#
# Tag updates: AUTOMATIC since 2026-11-13. image.tag below carries an
# `$imagepolicy` marker for ImagePolicy `ninth-banner-preview` (range
# '>=0.6.0', ./image-automation.yaml), so every `v0.6.x`+ release tag of the
# game is written here by ninth-banner-preview-image-updates. The live game's
# policy is capped at '<0.6.0' and its automation is scoped to its own
# directory, so neither app deploys a tag of the other line.
#
# A pin by commit between two tags (a fix shown before it is tagged): set
# image.tag to the coordinator-supplied `sha-<40-char commit>@sha256:<digest>`
# AND remove the marker comment in the same commit; put the marker back to
# follow tags again.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ninth-banner-preview
  namespace: my-software-production
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      ninth-banner-preview:
        replicas: 1
        containers:
          app:
            image:
              repository: ghcr.io/nachtschatt3n/the-ninth-banner
              # Written by Flux image automation (ImagePolicy ninth-banner-preview,
              # '>=0.6.0'). Last manual pin: poc3d 20140161 with its digest, 2026-11-10.
              tag: sha-201401610688815ec063e1dc0b469c8d224a77ee@sha256:dce33b9463d78a3ab86cb7b3822974b6a88ac83ca6ea1ac67ea3fdba790beb7a # {"$imagepolicy": "my-software-production:ninth-banner-preview:tag"}
              pullPolicy: IfNotPresent
            env:
              - name: PORT
                value: "8080"
              - name: HOST
                value: "0.0.0.0"
              - name: TZ
                value: Europe/Berlin
              # No AI proxy for the PoC: the image default AI_PROVIDER=offline
              # keeps the shared Mac mini Ollama host out of it entirely.
              - name: AI_PROVIDER
                value: offline
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8080
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 30
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8080
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8080
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 25m
                memory: 96Mi
              limits:
                cpu: 500m
                memory: 256Mi
    defaultPodOptions:
      automountServiceAccountToken: false
      # Private GHCR package: the production app's pull secret, same namespace.
      imagePullSecrets:
        - name: ghcr-the-ninth-banner
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: ninth-banner-preview
        ports:
          http:
            port: 80
            targetPort: 8080
    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
