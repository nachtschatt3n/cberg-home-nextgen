---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No PVC, no secret of its own. The image pull secret ghcr-the-ninth-banner
# is the production app's (same namespace, ../../the-ninth-banner/app).
# No AI proxy (AI_PROVIDER stays offline: template text) and no feedback DB
# (the intake answers 503, the client keeps the report).
resources:
  - ./helmrelease.yaml
  - ./httproute.yaml
  # ImagePolicy + ImageUpdateAutomation only; the ImageRepository is the live
  # game's (../../the-ninth-banner/app/image-automation.yaml).
  - ./image-automation.yaml
