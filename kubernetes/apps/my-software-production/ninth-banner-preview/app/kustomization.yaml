---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No PVC. The image pull secret ghcr-the-ninth-banner is the production
# app's (same namespace, ../../the-ninth-banner/app).
# No AI proxy (AI_PROVIDER stays offline: template text).
# Feedback + play statistics: its OWN database on the shared postgresql
# (databases/ninth-banner-preview-feedback-db, role + db
# ninth_banner_preview_feedback), never the live game's tables.
resources:
  # Operator-written SOPS secret: FEEDBACK_DATABASE_URL + FEEDBACK_ADMIN_TOKEN.
  # FEEDBACK_ADMIN_TOKEN is the same team token as the live game's
  # (the-ninth-banner-feedback); rotate both together. The DSN password MUST
  # equal NINTH_BANNER_PREVIEW_FEEDBACK_PASSWORD in
  # databases/ninth-banner-preview-feedback-db/app/secret.sops.yaml.
  - ./feedback-secret.sops.yaml
  - ./helmrelease.yaml
  - ./httproute.yaml
  # ImagePolicy + ImageUpdateAutomation only; the ImageRepository is the live
  # game's (../../the-ninth-banner/app/image-automation.yaml).
  - ./image-automation.yaml
