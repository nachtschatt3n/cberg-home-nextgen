---
# The Ninth Banner on envoy-EXTERNAL, ENTIRELY behind Authentik forward-auth
# (owner decision 2026-10-02). Shape copied from ai/gods-eye-view: every path
# except the outpost callback is gated -- the game, /ai/*, /api/* (same-origin
# browser calls carry the authentik_proxy_* session cookie). Pattern + gotchas:
# docs/sops/authentik.md "Integrating a New Application" Step 3 and
# docs/sops/gateway-api-httproute.md §4.3.
#
# NO external-dns target annotation: external-dns reads the target from the
# parent GATEWAY and silently ignores it on the route (Known Gotcha #11).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: the-ninth-banner
  namespace: my-software-production
  labels:
    gethomepage.dev/enabled: "true"
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "The Ninth Banner"
    gethomepage.dev/description: "Turn-based fantasy tactics RPG for the browser (Authentik)"
    gethomepage.dev/group: "Software Development"
    gethomepage.dev/icon: "mdi-flag-variant"
    gethomepage.dev/pod-selector: "app.kubernetes.io/name=the-ninth-banner"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-external
      namespace: network
      # https only. The http listener is owned cluster-wide by
      # httproute-https-redirect, which 301s every host.
      sectionName: https
  hostnames:
    - "ninthbanner.${SECRET_DOMAIN}"
  rules:
    # Prometheus metrics are for the in-cluster ServiceMonitor only (it scrapes
    # the Service directly). Never serve them through the gateway, even to an
    # authenticated user.
    - matches:
        - path: { type: PathPrefix, value: /metrics }
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: the-ninth-banner-not-found
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - group: ""
          kind: Service
          name: the-ninth-banner
          port: 80
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: the-ninth-banner-not-found
  namespace: my-software-production
spec:
  directResponse:
    statusCode: 404
    contentType: text/plain
    body:
      type: Inline
      inline: "not found\n"
---
# POST /ai/generate ONLY -- the one path that reaches the SHARED Mac mini
# Ollama host. Its own route so the BackendTrafficPolicy below rate-limits
# exactly this. An Exact path match outranks the PathPrefix "/" above for the
# same hostname (Gateway API precedence); a non-POST falls through to the main
# route and gets the app's own 404. Gated by the same SecurityPolicy.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: the-ninth-banner-ai-generate
  namespace: my-software-production
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-external
      namespace: network
      sectionName: https
  hostnames:
    - "ninthbanner.${SECRET_DOMAIN}"
  rules:
    - matches:
        - path: { type: Exact, value: /ai/generate }
          method: POST
      # The proxy waits up to 120s for Ollama; the gateway-wide 60s would cut a
      # slow generation off first. Rule timeouts win over the BTP timeout.
      # (Cloudflare's own proxied-request ceiling is ~100s; the client falls
      # back to offline content on any failure.)
      timeouts:
        request: 125s
      backendRefs:
        - group: ""
          kind: Service
          name: the-ninth-banner
          port: 80
---
# Edge rate limit protecting the shared Ollama host, on top of the app's own
# per-client limit. Target is the HTTPRoute above, NOT a Gateway: only ONE
# BackendTrafficPolicy may target a Gateway (envoy-compression owns that).
#
# mergeType StrategicMerge: without it a route-level BTP REPLACES the
# gateway-level one for this route, silently dropping its compression and
# timeout settings. With it, this rateLimit is merged into envoy-compression.
#
# Local rate limits are enforced PER ENVOY REPLICA. envoy-external runs 3
# replicas, so 10/min each = at most 30 req/min across the gateway. Excess
# requests get a 429 from Envoy; the game client falls back to offline text.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: the-ninth-banner-ai-generate
  namespace: my-software-production
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: the-ninth-banner-ai-generate
  mergeType: StrategicMerge
  rateLimit:
    type: Local
    local:
      rules:
        - limit:
            requests: 10
            unit: Minute
---
# Callback route -- separate and MORE specific than `/` (longest match wins),
# and NEVER gated, or the login flow can never complete.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: the-ninth-banner-authentik-outpost
  namespace: my-software-production
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-external
      namespace: network
      sectionName: https
  hostnames:
    - "ninthbanner.${SECRET_DOMAIN}"
  rules:
    - matches:
        - path: { type: PathPrefix, value: /outpost.goauthentik.io }
      backendRefs:
        # Authorised by ReferenceGrant kube-system/the-ninth-banner-outpost-access
        # (kubernetes/apps/kube-system/authentik/app/referencegrants.yaml).
        - group: ""
          kind: Service
          name: ak-outpost-the-ninth-banner-forward-auth
          namespace: kube-system
          port: 9000
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: the-ninth-banner-forward-auth
  namespace: my-software-production
spec:
  # BOTH app routes -- never the callback route (instant redirect loop).
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: the-ninth-banner
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: the-ninth-banner-ai-generate
  extAuth:
    failOpen: false              # outpost down => deny, never publish
    # cookie is MANDATORY (without it every check is anonymous and browsers get
    # `oauth state does not match` 400s); x-forwarded-* deliberately NOT
    # forwarded -- see the full rationale in office/arag-web/app/httproute.yaml.
    headersToExtAuth:
      - cookie
      - accept
      - user-agent
    http:
      backendRefs:
        - group: ""
          kind: Service
          name: ak-outpost-the-ninth-banner-forward-auth
          namespace: kube-system
          port: 9000
      path: /outpost.goauthentik.io/auth/envoy   # /auth/nginx 500s here
      # X-authentik-username reaches the app (structured logs' `user` field).
      headersToBackend:
        - Set-Cookie
        - X-authentik-username
        - X-authentik-groups
        - X-authentik-email
        - X-authentik-name
        - X-authentik-uid
