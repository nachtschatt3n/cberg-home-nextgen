---
# The Ninth Banner on envoy-EXTERNAL, PUBLIC -- no Authentik forward-auth
# (operator decision 2026-10-02: the game is meant to be shared). Forward-auth
# was removed in the same change; the Authentik provider/app/outpost were
# decommissioned blueprint-first. What still protects the host:
#   - /metrics is 404'd at the gateway (below);
#   - POST /ai/generate, the only path reaching the SHARED Mac mini Ollama, has
#     its own route with an edge rate limit, per client IP plus a global cap
#     (BackendTrafficPolicy below);
#     the game falls back to offline text on 429.
# Accepted exposure is recorded in sweep_history security_acceptances
# (runbooks/policy-cli.py sec). Route pattern: docs/sops/gateway-api-httproute.md.
#
# NO external-dns target annotation: external-dns reads the target from the
# parent GATEWAY and silently ignores it on the route (Known Gotcha #11).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: the-ninth-banner
  namespace: my-software-production
  labels:
    gethomepage.dev/enabled: "true"
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "The Ninth Banner"
    gethomepage.dev/description: "Turn-based fantasy tactics RPG for the browser"
    gethomepage.dev/group: "Software Development"
    gethomepage.dev/icon: "mdi-flag-variant"
    gethomepage.dev/pod-selector: "app.kubernetes.io/name=the-ninth-banner"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-external
      namespace: network
      # https only. The http listener is owned cluster-wide by
      # httproute-https-redirect, which 301s every host.
      sectionName: https
  hostnames:
    - "ninthbanner.${SECRET_DOMAIN}"
  rules:
    # Prometheus metrics are for the in-cluster ServiceMonitor only (it scrapes
    # the Service directly). Never serve them through the public gateway.
    - matches:
        - path: { type: PathPrefix, value: /metrics }
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: the-ninth-banner-not-found
    - matches:
        - path: { type: PathPrefix, value: / }
      # No forward-auth any more, so nothing overwrites the X-authentik-*
      # headers: strip them, or a client could set X-authentik-username and
      # rotate it to dodge the app's per-client limits (clientKey() trusts it)
      # and forge the `user` log field.
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - X-Authentik-Username
              - X-Authentik-Groups
              - X-Authentik-Email
              - X-Authentik-Name
              - X-Authentik-Uid
      backendRefs:
        - group: ""
          kind: Service
          name: the-ninth-banner
          port: 80
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: the-ninth-banner-not-found
  namespace: my-software-production
spec:
  directResponse:
    statusCode: 404
    contentType: text/plain
    body:
      type: Inline
      inline: "not found\n"
---
# POST /ai/generate ONLY -- the one path that reaches the SHARED Mac mini
# Ollama host. Its own route so the BackendTrafficPolicy below rate-limits
# exactly this. An Exact path match outranks the PathPrefix "/" above for the
# same hostname (Gateway API precedence); a non-POST falls through to the main
# route and gets the app's own 404. Public like the rest of the host.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: the-ninth-banner-ai-generate
  namespace: my-software-production
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-external
      namespace: network
      sectionName: https
  hostnames:
    - "ninthbanner.${SECRET_DOMAIN}"
  rules:
    - matches:
        - path: { type: Exact, value: /ai/generate }
          method: POST
      # The proxy waits up to 120s for Ollama; the gateway-wide 60s would cut a
      # slow generation off first. Rule timeouts win over the BTP timeout.
      # (Cloudflare's own proxied-request ceiling is ~100s; the client falls
      # back to offline content on any failure.)
      timeouts:
        request: 125s
      # Same header strip as the main route (see there).
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - X-Authentik-Username
              - X-Authentik-Groups
              - X-Authentik-Email
              - X-Authentik-Name
              - X-Authentik-Uid
      backendRefs:
        - group: ""
          kind: Service
          name: the-ninth-banner
          port: 80
---
# Edge rate limit protecting the shared Ollama host, on top of the proxy's own
# limits (30/min, 400 per 6h, ai.yaml) and its one-request-at-a-time queue to
# Ollama. Target is the HTTPRoute above, NOT a Gateway: only ONE
# BackendTrafficPolicy may target a Gateway (envoy-compression owns that).
#
# mergeType StrategicMerge: without it a route-level BTP REPLACES the
# gateway-level one for this route, silently dropping its compression and
# timeout settings. With it, this rateLimit is merged into envoy-compression.
#
# History: 2/min per replica, ONE bucket shared by every player (2026-10-02).
# After-battle bursts of 3-9 requests made players hit 429 (17x in 7 days),
# which can switch AI text off for a session. Owner approved raising it
# 2026-10-12: per client ~20/min with room for the burst, global ~60/min.
#
# How it works (Envoy Gateway v1.9.2 Local limits; there is NO global
# rate-limit service / Redis in this cluster, so Type Global is unavailable):
#   - rules 0+1, sourceCIDR Distinct: one bucket PER CLIENT IP (v4 and v6).
#     The client IP is the one envoy-external's ClientTrafficPolicy selects:
#     XFF set by Cloudflare, trusted only from the pod CIDR (cloudflared), so
#     clients cannot forge it (network/envoy-gateway/app/policies.yaml).
#   - rule 2, methods POST (the route only matches POST): ONE shared bucket for
#     everyone = the global cap. It must have a selector: a no-selector rule
#     becomes Envoy's default bucket, which EG configures with
#     always_consume_default_token_bucket=false, so requests that match a
#     per-client descriptor would never count against it.
#   A request is checked against every rule it matches; the strictest wins.
#
# Local limits are enforced PER ENVOY REPLICA and envoy-external runs 3;
# cloudflared spreads requests over replicas (measured: 16/29/0 over 7 days).
#   - per client: 10/min per replica. Covers the 3-9 burst within one
#     replica's bucket; spread over 2-3 replicas that is ~20-30/min per client.
#   - global: 20/min per replica = ~60/min across the gateway.
# Token buckets refill in full each minute, so a full bucket is the burst.
# Excess gets a 429 from Envoy; the game client falls back to offline text.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: the-ninth-banner-ai-generate
  namespace: my-software-production
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: the-ninth-banner-ai-generate
  mergeType: StrategicMerge
  rateLimit:
    type: Local
    local:
      rules:
        # Per client, IPv4.
        - clientSelectors:
            - sourceCIDR:
                type: Distinct
                value: 0.0.0.0/0
          limit:
            requests: 10
            unit: Minute
        # Per client, IPv6.
        - clientSelectors:
            - sourceCIDR:
                type: Distinct
                value: ::/0
          limit:
            requests: 10
            unit: Minute
        # Global cap: one bucket shared by all clients.
        - clientSelectors:
            - methods:
                - value: POST
          limit:
            requests: 20
            unit: Minute
