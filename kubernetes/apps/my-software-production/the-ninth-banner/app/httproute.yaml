---
# The Ninth Banner on envoy-EXTERNAL, PUBLIC -- no Authentik forward-auth
# (operator decision 2026-10-02: the game is meant to be shared). Forward-auth
# was removed in the same change; the Authentik provider/app/outpost were
# decommissioned blueprint-first. What still protects the host:
#   - /metrics is 404'd at the gateway (below);
#   - POST /ai/generate, the only path reaching the SHARED Mac mini Ollama, has
#     its own route with a tight edge rate limit (BackendTrafficPolicy below);
#     the game falls back to offline text on 429.
# Accepted exposure is recorded in sweep_history security_acceptances
# (runbooks/policy-cli.py sec). Route pattern: docs/sops/gateway-api-httproute.md.
#
# NO external-dns target annotation: external-dns reads the target from the
# parent GATEWAY and silently ignores it on the route (Known Gotcha #11).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: the-ninth-banner
  namespace: my-software-production
  labels:
    gethomepage.dev/enabled: "true"
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "The Ninth Banner"
    gethomepage.dev/description: "Turn-based fantasy tactics RPG for the browser"
    gethomepage.dev/group: "Software Development"
    gethomepage.dev/icon: "mdi-flag-variant"
    gethomepage.dev/pod-selector: "app.kubernetes.io/name=the-ninth-banner"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-external
      namespace: network
      # https only. The http listener is owned cluster-wide by
      # httproute-https-redirect, which 301s every host.
      sectionName: https
  hostnames:
    - "ninthbanner.${SECRET_DOMAIN}"
  rules:
    # Prometheus metrics are for the in-cluster ServiceMonitor only (it scrapes
    # the Service directly). Never serve them through the public gateway.
    - matches:
        - path: { type: PathPrefix, value: /metrics }
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: the-ninth-banner-not-found
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - group: ""
          kind: Service
          name: the-ninth-banner
          port: 80
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: the-ninth-banner-not-found
  namespace: my-software-production
spec:
  directResponse:
    statusCode: 404
    contentType: text/plain
    body:
      type: Inline
      inline: "not found\n"
---
# POST /ai/generate ONLY -- the one path that reaches the SHARED Mac mini
# Ollama host. Its own route so the BackendTrafficPolicy below rate-limits
# exactly this. An Exact path match outranks the PathPrefix "/" above for the
# same hostname (Gateway API precedence); a non-POST falls through to the main
# route and gets the app's own 404. Public like the rest of the host.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: the-ninth-banner-ai-generate
  namespace: my-software-production
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-external
      namespace: network
      sectionName: https
  hostnames:
    - "ninthbanner.${SECRET_DOMAIN}"
  rules:
    - matches:
        - path: { type: Exact, value: /ai/generate }
          method: POST
      # The proxy waits up to 120s for Ollama; the gateway-wide 60s would cut a
      # slow generation off first. Rule timeouts win over the BTP timeout.
      # (Cloudflare's own proxied-request ceiling is ~100s; the client falls
      # back to offline content on any failure.)
      timeouts:
        request: 125s
      backendRefs:
        - group: ""
          kind: Service
          name: the-ninth-banner
          port: 80
---
# Edge rate limit protecting the shared Ollama host, on top of the app's own
# per-client limit. Target is the HTTPRoute above, NOT a Gateway: only ONE
# BackendTrafficPolicy may target a Gateway (envoy-compression owns that).
#
# mergeType StrategicMerge: without it a route-level BTP REPLACES the
# gateway-level one for this route, silently dropping its compression and
# timeout settings. With it, this rateLimit is merged into envoy-compression.
#
# Local rate limits are enforced PER ENVOY REPLICA. envoy-external runs 3
# replicas, so 2/min each = at most ~6 req/min across the gateway (operator
# decision 2026-10-02 when the host went public: Ollama runs NUM_PARALLEL=1
# and is shared with the rest of the household's AI). Excess requests get a
# 429 from Envoy; the game client falls back to offline text.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: the-ninth-banner-ai-generate
  namespace: my-software-production
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: the-ninth-banner-ai-generate
  mergeType: StrategicMerge
  rateLimit:
    type: Local
    local:
      rules:
        - limit:
            requests: 2
            unit: Minute
