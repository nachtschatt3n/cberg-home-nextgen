---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: global-filesystem-trim
  namespace: storage
spec:
  name: global-filesystem-trim
  task: filesystem-trim
  cron: "0 22 * * *"  # Daily 22:00 UTC (30 min before snapshot-cleanup, 1 h before backup)
  retain: 0
  concurrency: 2
  # Applies to every volume in the "default" group (all volumes by default)
  groups:
    - default
  labels:
    job: global-trim
