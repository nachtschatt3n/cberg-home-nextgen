---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: openclaw-filesystem-trim
  namespace: storage
spec:
  name: openclaw-filesystem-trim
  task: filesystem-trim
  cron: "0 22 * * *"  # Daily 22:00 UTC (30 min before snapshot-cleanup, 1 h before backup)
  retain: 0
  concurrency: 1
  labels:
    job: openclaw-trim
    volume: clawd-bot-data
