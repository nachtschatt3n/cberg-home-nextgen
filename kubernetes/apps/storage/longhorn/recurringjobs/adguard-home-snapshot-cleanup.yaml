---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: adguard-home-snapshot-cleanup
  namespace: storage
spec:
  name: adguard-home-snapshot-cleanup
  task: snapshot-cleanup
  cron: "30 22 * * *"  # Daily 22:30 UTC (after trim at 22:00, before backup at 23:00)
  retain: 0
  concurrency: 1
  labels:
    job: adguard-home-snapshot-cleanup
    volume: adguard-home-config
