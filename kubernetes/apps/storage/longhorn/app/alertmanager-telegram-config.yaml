---
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: telegram
  namespace: storage
  labels:
    alertmanager-config: telegram
spec:
  route:
    receiver: telegram
    groupBy:
      - alertname
    groupWait: 1s
    groupInterval: 15m  # Allow grouping similar alerts for 15 minutes
    repeatInterval: 4h   # Repeat every 4 hours if still firing
    # SCOPED to category=storage. This used to be `matchers: []`, which matches
    # EVERY alert -- and monitoring/telegram already does exactly that with the
    # same `receiver: telegram`. The Prometheus Operator renders each
    # AlertmanagerConfig as its own top-level route, so the generated config
    # carried BOTH `- receiver: monitoring/telegram/telegram` and
    # `- receiver: storage/telegram/telegram` with empty matchers: every
    # severity=warning alert matched both and was delivered to Telegram TWICE.
    # Confirmed 2026-09-03 from the running generated secret, and visible to the
    # operator as duplicate phone messages with identical timestamps.
    #
    # Scoping the root here is safe: monitoring/telegram still catches
    # everything, so nothing loses coverage -- this config now only handles the
    # storage-specific routing it was written for.
    matchers:
      - name: category
        value: storage
    routes:
      # Suppress Watchdog and InfoInhibitor (synthetic kube-prometheus-stack alerts,
      # not actionable — InfoInhibitor fires whenever any warning alert is active)
      - receiver: "null"
        matchers:
          - name: alertname
            value: Watchdog
      - receiver: "null"
        matchers:
          - name: alertname
            value: InfoInhibitor
      # Storage warning alerts - immediate first notification, then every 4 hours
      - receiver: telegram
        matchers:
          - name: severity
            value: warning
          - name: category
            value: storage
        groupWait: 1s
        groupInterval: 15m  # Allow grouping similar alerts for 15 minutes
        repeatInterval: 4h   # Repeat every 4 hours if still firing
        continue: false
  receivers:
    # Null receiver for suppressed alerts (like Watchdog)
    - name: "null"
    - name: telegram
      telegramConfigs:
        - botToken:
            name: alertmanager-telegram-secret
            key: bot-token
          chatID: -1003112342088  # home operation channel
          parseMode: HTML  # use HTML parsing to avoid escaping issues
          sendResolved: true
          message: |
            🚨 <b>{{ .CommonLabels.alertname }}</b> ({{ len .Alerts }} alerts)
            Severity: {{ .CommonLabels.severity | toUpper }}
            {{- if .CommonLabels.component }} | Component: {{ .CommonLabels.component }}{{- end }}
            {{- if .CommonLabels.node }} | Node: {{ .CommonLabels.node }}{{- end }}
            
            {{- if gt (len .Alerts) 10 }}
            ⚠️ Showing first 10 of {{ len .Alerts }} alerts:
            {{- end }}
            {{- range $i, $alert := .Alerts }}
            {{- if lt $i 10 }}
            • {{- if $alert.Annotations.summary }} {{ $alert.Annotations.summary }}{{- else }} {{ $alert.Labels.alertname }}{{- end }}
            {{- if $alert.Labels.node }} [{{ $alert.Labels.node }}]{{- end }}
            {{- end }}
            {{- end }}
            {{- if gt (len .Alerts) 10 }}
            
            ... and more alerts ({{ len .Alerts }} total)
            {{- end }}
