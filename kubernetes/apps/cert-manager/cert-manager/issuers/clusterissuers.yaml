---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cert-manager.io/clusterissuer_v1.json
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-production
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cert-manager-secret
              key: api-token
        selector:
          dnsZones:
            - "${SECRET_DOMAIN}"
            # Second zone (legacy site). The shared Cloudflare token must also
            # carry Zone:Read + DNS:Edit on this zone or DNS-01 fails with
            # "zone not found" (docs/sops/cloudflare.md, secondary zone).
            - "${SECRET_DOMAIN_ANDREAMOSTELLER}"
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cert-manager.io/clusterissuer_v1.json
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-staging
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cert-manager-secret
              key: api-token
        selector:
          dnsZones:
            - "${SECRET_DOMAIN}"
            # Second zone (legacy site). The shared Cloudflare token must also
            # carry Zone:Read + DNS:Edit on this zone or DNS-01 fails with
            # "zone not found" (docs/sops/cloudflare.md, secondary zone).
            - "${SECRET_DOMAIN_ANDREAMOSTELLER}"
