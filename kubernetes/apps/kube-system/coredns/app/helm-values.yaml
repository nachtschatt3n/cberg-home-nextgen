---
fullnameOverride: coredns
k8sAppLabelOverride: kube-dns
# Chart 1.47.0 is the newest published chart and still ships appVersion 1.14.6,
# so the image is pinned ahead of the chart's tested appVersion. Re-check on
# every chart bump: once a chart ships >= this appVersion, drop this block and
# let the chart own the tag again.
image:
  tag: "1.14.7"
serviceAccount:
  create: true
service:
  name: kube-dns
  clusterIP: "10.96.0.10"
replicaCount: 2
servers:
  - zones:
      - zone: ${SECRET_DOMAIN}
        scheme: dns://
        use_tcp: true
    port: 53
    plugins:
      - name: errors
      - name: log
        configBlock: |-
          class error
      - name: forward
        parameters: . 192.168.55.101
        configBlock: |-
          max_connect_attempts 0
      - name: cache
        parameters: 30
      - name: loop
      - name: reload
      - name: loadbalance
  - zones:
      - zone: .
        scheme: dns://
        use_tcp: true
    port: 53
    plugins:
      - name: errors
      - name: health
        configBlock: |-
          lameduck 5s
      - name: ready
      - name: log
        configBlock: |-
          class error
      - name: prometheus
        parameters: 0.0.0.0:9153
      - name: kubernetes
        parameters: cluster.local in-addr.arpa ip6.arpa
        configBlock: |-
          pods insecure
          fallthrough in-addr.arpa ip6.arpa
      - name: forward
        parameters: . /etc/resolv.conf
        configBlock: |-
          max_connect_attempts 0
      - name: cache
        parameters: 30
      - name: loop
      - name: reload
      - name: loadbalance
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
            - key: k8s-app
              operator: In
              values: [kube-dns]
        topologyKey: kubernetes.io/hostname
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        k8s-app: kube-dns
tolerations:
  - key: CriticalAddonsOnly
    operator: Exists
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
