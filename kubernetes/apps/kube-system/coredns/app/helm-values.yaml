---
fullnameOverride: coredns
k8sAppLabelOverride: kube-dns
# Chart 1.47.0 is the newest published chart and still ships appVersion 1.14.6,
# so the image is pinned ahead of the chart's tested appVersion. Re-check on
# every chart bump: once a chart ships >= this appVersion, drop this block and
# let the chart own the tag again.
image:
  tag: "1.14.7"
serviceAccount:
  create: true
service:
  name: kube-dns
  clusterIP: "10.96.0.10"
replicaCount: 2
servers:
  - zones:
      - zone: ${SECRET_DOMAIN}
        scheme: dns://
        use_tcp: true
    port: 53
    plugins:
      - name: errors
      - name: log
        configBlock: |-
          class error
      - name: forward
        parameters: . 192.168.55.101
        # Bounded, not unbounded, and not upstream's default either. Derived
        # from the 1.14.7 forward plugin: the per-request deadline is 5s and a
        # dead-upstream exchange costs read_timeout 2s, so at most THREE
        # attempts can start (t=0, 2, 4) when the upstream is silent — any cap
        # >= 3 is non-binding there and the deadline governs. Upstream's
        # default (2 x upstreams = 2 for our single upstream) DOES bind, which
        # is the SERVFAIL risk that made the 1.14.7 bump pin this. The other
        # failure shape is a connect error that returns instantly (ICMP port
        # unreachable while k8s-gateway has no ready endpoint); nothing paces
        # that loop, so 0 spins until the 5s deadline — the busy loop upstream
        # capped this to stop. 6 = three complete passes: double the
        # deadline-implied maximum, so it never binds where a retry costs
        # wall-clock time, and binds only on the instant-error path it exists
        # to bound. Re-derive if read_timeout, the 5s deadline, or the number
        # of upstreams in this block changes.
        configBlock: |-
          max_connect_attempts 6
      - name: cache
        parameters: 30
      - name: loop
      - name: reload
      - name: loadbalance
  - zones:
      - zone: .
        scheme: dns://
        use_tcp: true
    port: 53
    plugins:
      - name: errors
      - name: health
        configBlock: |-
          lameduck 5s
      - name: ready
      - name: log
        configBlock: |-
          class error
      - name: prometheus
        parameters: 0.0.0.0:9153
      - name: kubernetes
        parameters: cluster.local in-addr.arpa ip6.arpa
        configBlock: |-
          pods insecure
          fallthrough in-addr.arpa ip6.arpa
      - name: forward
        parameters: . /etc/resolv.conf
        # Same bound, same derivation (see the block above). This block is also
        # single-upstream — verified on the running pods rather than assumed
        # from the file: coredns_proxy_* carries exactly one `to=` label per
        # forward block (169.254.116.108:53 here, 192.168.55.101:53 above), so
        # upstream's 2 x upstreams default would be 2 for this block too.
        configBlock: |-
          max_connect_attempts 6
      - name: cache
        parameters: 30
      - name: loop
      - name: reload
      - name: loadbalance
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
            - key: k8s-app
              operator: In
              values: [kube-dns]
        topologyKey: kubernetes.io/hostname
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        k8s-app: kube-dns
tolerations:
  - key: CriticalAddonsOnly
    operator: Exists
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
