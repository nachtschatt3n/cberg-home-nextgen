---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: intel-device-plugin-operator
spec:
  interval: 30m
  chart:
    spec:
      chart: intel-device-plugins-operator
      version: 0.37.0
      sourceRef:
        kind: HelmRepository
        name: intel
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
    - name: node-feature-discovery
      namespace: kube-system
  # UPSTREAM CHART BUG (intel-device-plugins-operator 0.36.0): the metrics
  # Service declares `targetPort: https`, but the controller-manager Deployment
  # declares only `containerPort: 9443, name: webhook-server` — no port named
  # `https` exists anywhere. The EndpointSlice therefore resolves the pod IP but
  # no port, so the Service has ZERO usable endpoints and surfaces as a
  # "service without endpoints" health finding. Metrics ARE served, on :8443
  # (--metrics-bind-address=:8443 --metrics-secure), so target it numerically.
  # The chart exposes no value for this, hence a post-render patch.
  # Re-check on every chart bump: if upstream names the port, drop this.
  #
  # (0.37.0) The former second post-render patch -- removing the
  # fpga/sgx pod-mutator webhooks by index -- is gone: upstream 0.37.0
  # deleted the FPGA plugin entirely and gates the sgx pod mutator on
  # `manager.devices`, so enabling devices via `manager.devices` below
  # renders neither entry. Re-check on every chart bump that
  # `kubectl get mutatingwebhookconfigurations
  # inteldeviceplugins-mutating-webhook-configuration` lists no
  # `*.mutator.webhooks.intel.com` entry.
  postRenderers:
    - kustomize:
        patches:
          - target:
              version: v1
              kind: Service
              name: inteldeviceplugins-controller-manager-metrics-service
            patch: |
              - op: replace
                path: /spec/ports/0/targetPort
                value: 8443
  values:
    # Renders exactly `--devices=gpu --devices=npu` (same args as the old
    # controllerExtraArgs) AND, since chart 0.37.0, suppresses the sgx pod
    # mutator webhook. Do not also set controllerExtraArgs -- the flags
    # would be passed twice.
    manager:
      devices:
        gpu: true
        npu: true
