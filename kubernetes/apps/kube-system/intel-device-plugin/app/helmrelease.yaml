---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: intel-device-plugin-operator
spec:
  interval: 30m
  chart:
    spec:
      chart: intel-device-plugins-operator
      version: 0.36.0
      sourceRef:
        kind: HelmRepository
        name: intel
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
    - name: node-feature-discovery
      namespace: kube-system
  # UPSTREAM CHART BUG (intel-device-plugins-operator 0.36.0): the metrics
  # Service declares `targetPort: https`, but the controller-manager Deployment
  # declares only `containerPort: 9443, name: webhook-server` — no port named
  # `https` exists anywhere. The EndpointSlice therefore resolves the pod IP but
  # no port, so the Service has ZERO usable endpoints and surfaces as a
  # "service without endpoints" health finding. Metrics ARE served, on :8443
  # (--metrics-bind-address=:8443 --metrics-secure), so target it numerically.
  # The chart exposes no value for this, hence a post-render patch.
  # Re-check on every chart bump: if upstream names the port, drop this.
  #
  # SECOND UPSTREAM CHART BUG: the mutating-webhook config template renders
  # the pod-mutator entries for ALL device types unconditionally — there is
  # no `manager.devices` (or any other) value that gates it (verified against
  # this chart version: `--set manager.devices.gpu=true` still renders all
  # 8). Only gpu + npu are enabled here (controllerExtraArgs below), so
  # `fpga.mutator.webhooks.intel.com` and `sgx.mutator.webhooks.intel.com` —
  # the two entries whose rules match core-group `pods` with no CRD scoping,
  # so they run on EVERY pod CREATE cluster-wide — point at controller routes
  # that are never registered and 404 on every call (found via
  # health-check.sh Section 38's response probe, 2026-08-24). `failurePolicy:
  # Ignore` means the 404 blocks nothing, so this was pure waste (an extra
  # network round-trip per pod create, cluster-wide) rather than a
  # functional bug, but it's a needless one now that it is detected.
  #
  # Removed by index with an explicit name TEST first, so a future chart
  # bump that reorders the webhooks array fails this patch LOUDLY (Flux
  # Kustomization goes NotReady) instead of silently deleting the wrong
  # entry. Only these two are removed — the six OTHER unused-device-type
  # webhooks (dlb/dsa/fpga/iaa/qat/sgx device-plugin CRD validators +
  # mutators) are CRD-scoped, essentially never fire (nothing here ever
  # creates an FpgaDevicePlugin-shaped object), and are already correctly
  # reported as low-severity by Section 38 — not worth the same index-patch
  # fragility for near-zero benefit. gpu/npu's own webhooks
  # (m/vgpudeviceplugin.kb.io, m/vnpudeviceplugin.kb.io) are untouched by
  # this patch and continue to work exactly as before — this cannot affect
  # GPU/NPU-accelerated workloads (Ollama, immich ML, etc.), because removing
  # an Ignore-policy webhook that already 404s on every call changes nothing
  # about what gets admitted.
  # Re-check on every chart bump: `kubectl get mutatingwebhookconfigurations
  # inteldeviceplugins-mutating-webhook-configuration -o json | jq -r
  # '.webhooks[].name'` and confirm fpga.mutator/sgx.mutator are still at
  # indices 8/9 before trusting a green Flux reconcile blindly.
  postRenderers:
    - kustomize:
        patches:
          - target:
              version: v1
              kind: Service
              name: inteldeviceplugins-controller-manager-metrics-service
            patch: |
              - op: replace
                path: /spec/ports/0/targetPort
                value: 8443
          - target:
              group: admissionregistration.k8s.io
              version: v1
              kind: MutatingWebhookConfiguration
              name: inteldeviceplugins-mutating-webhook-configuration
            patch: |
              - op: test
                path: /webhooks/8/name
                value: fpga.mutator.webhooks.intel.com
              - op: test
                path: /webhooks/9/name
                value: sgx.mutator.webhooks.intel.com
              - op: remove
                path: /webhooks/9
              - op: remove
                path: /webhooks/8
  values:
    controllerExtraArgs: |
      - --devices=gpu
      - --devices=npu
