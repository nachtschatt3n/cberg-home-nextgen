---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./secret.sops.yaml
  - ./configmap.sops.yaml
  - ./helmrelease.yaml
  - ./metrics-service.yaml
  - ./prometheusrule.yaml
  - ./cronjob-channels-cleanup.yaml
  # Audit-log freshness + DB connection gauges -> Pushgateway. The ONLY thing
  # asserting that authentik_events_event is still being written; see the
  # "two databases" note in docs/sops/authentik.md for why that matters.
  - ./cronjob-db-probe.yaml
  # ReferenceGrants letting other namespaces reach the forward-auth outposts.
  # Must be here (target ns), not next to each app — see the file header.
  - ./referencegrants.yaml
  - ./httproute.yaml
  # plan authentik-postgres-18: replacement DB, additive until cutover.
  # pg-longhorn-volume.yaml is deliberately NOT listed — targetNamespace
  # would override its namespace: storage. Applied by hand (docs/sops/longhorn.md).
  - ./pg-deployment.yaml
  - ./pg-pv.yaml
  - ./pg-pvc.yaml

# Authentik blueprints are stored in SOPS-encrypted configmap.sops.yaml
# This provides security for sensitive domain information in a public repository
# The ConfigMap is the source of truth - what Authentik loads at runtime
# To update blueprints -- EDIT IN PLACE, never via /tmp:
#
#   sops kubernetes/apps/kube-system/authentik/app/configmap.sops.yaml
#
# That opens the decrypted content in $EDITOR and re-encrypts on save. Then
# commit and push -- Flux decrypts and applies automatically.
#
# The previous recipe here said "sops -d ... > /tmp/configmap.yaml", edit, then
# "sops -e /tmp/configmap.yaml > configmap.sops.yaml". DO NOT DO THAT. It fails
# two ways, and the second one destroys the file:
#
#   1. It leaves this ConfigMap's blueprints -- including every OIDC provider
#      client_secret -- sitting in world-readable plaintext in /tmp. Two such
#      files were found there on 2026-09-09, 14 client_secrets each.
#   2. SOPS creation rules are PATH-BASED (.sops.yaml path_regex). /tmp matches
#      no rule, so "sops -e /tmp/configmap.yaml" errors with "no matching
#      creation rules found" -- but the shell has ALREADY TRUNCATED the target
#      via ">" before sops runs. Net result: configmap.sops.yaml is left EMPTY
#      and every blueprint is gone from git.
#
# If you genuinely need an out-of-file edit, copy the plaintext to a path INSIDE
# kubernetes/ first, encrypt in place with "sops -e -i", then move it over the
# target and shred the plaintext -- the flow in AGENTS.md "SOPS Encryption Rules".

# Note: Blueprints are loaded via init containers in helmrelease.yaml:
# - ConfigMap (authentik-blueprints) is mounted as a volume (blueprints-source)
# - Init containers copy all blueprints from blueprints-source to /blueprints (emptyDir volume)
# - Authentik server/worker containers mount /blueprints as read-only
# Volume mounts are configured via extraVolumes/extraVolumeMounts in helmrelease.yaml
