---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: kube-system
spec:
  interval: 30m
  chart:
    spec:
      chart: authentik
      version: 2026.8.3
      sourceRef:
        kind: HelmRepository
        name: authentik
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    timeout: 30m
    cleanupOnFail: true
    remediation:
      retries: 3
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Ingress
              name: authentik-server
            patch: |
              - op: add
                path: /metadata/labels/gethomepage.dev~1enabled
                value: "true"
  values:
    global:
      deploymentAnnotations:
        secret.reloader.stakater.com/reload: authentik-secret
        # Reloader rolls server + worker whenever the blueprint ConfigMap
        # changes; it is referenced as the blueprints-cberg volume below.
        configmap.reloader.stakater.com/reload: authentik-blueprints
      podAnnotations:
        reloader.stakater.com/auto: "true"

    authentik:
      # The error reporting is fully anonymous and helps developers
      error_reporting:
        enabled: true
      # Redis removed in 2025.10 - migrated to PostgreSQL
      # redis:
      #   host: "authentik-redis-master"

    server:
      replicas: 3
      env:
        - name: AUTHENTIK_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: authentik-secret
              key: SECRET_AUTHENTIK_SECRET_KEY
        # PostgreSQL connection configuration
        - name: AUTHENTIK_POSTGRESQL__HOST
          value: "authentik-pg"
        - name: AUTHENTIK_POSTGRESQL__NAME
          value: "authentik"
        - name: AUTHENTIK_POSTGRESQL__USER
          value: "authentik"
        - name: AUTHENTIK_POSTGRESQL__PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-secret
              key: SECRET_AUTHENTIK_DB_PASSWORD
        - name: AUTHENTIK_POSTGRESQL__PORT
          value: "5432"
        # Unauthenticated (pre-login) session age only. Logged-in SSO session
        # length is the user-login stage session_duration (days=365) in blueprint
        # cberg/session-lifetime-blueprint.yaml; that per-session set_expiry()
        # overrides SESSION_EXPIRE_AT_BROWSER_CLOSE (docs/sops/authentik.md
        # "Session lifetime").
        - name: AUTHENTIK_SESSIONS__UNAUTHENTICATED_AGE
          value: "days=365"
        # F-649e78b6: only the pod CIDR may set proxy headers (X-Forwarded-For).
        # Envoy Gateway (network/envoy-gateway policies.yaml) is the only hop
        # in front of authentik and trusts client XFF from that same CIDR. The
        # upstream default also trusts 10/8, 172.16/12 and 192.168/16, so any
        # LAN client reaching the Service directly could spoof its client IP.
        # Attribution only (events, reputation scoring) - not an access change.
        # Docs: "applies to the Server"; mirrored on the worker so both env
        # blocks stay identical.
        - name: AUTHENTIK_LISTEN__TRUSTED_PROXY_CIDRS
          value: "10.69.0.0/16"
      initContainers:
        # Wait for the authentik-pg Deployment (postgres 18.6) to be reachable
        # before starting the server. Without this, authentik tries to connect
        # too early after a cold-start / Talos node reboot, hits a connect
        # error, enters CrashLoopBackOff, and recovery takes 5+ minutes due to
        # kubelet exponential backoff. See docs/sops/container-dependencies.md.
        - name: wait-for-postgresql
          image: busybox:1.38.0
          command:
            - sh
            - -c
            - |
              until nc -z authentik-pg 5432; do
                echo "waiting for authentik-pg:5432..."
                sleep 2
              done
        - name: patch-session-settings
          image: ghcr.io/goauthentik/server:2026.8.3
          command:
            - sh
            - -c
            - |
              echo "Patching SESSION_EXPIRE_AT_BROWSER_CLOSE to False..."
              cp /authentik/root/settings.py /tmp/settings.py
              sed -i 's/SESSION_EXPIRE_AT_BROWSER_CLOSE = True/SESSION_EXPIRE_AT_BROWSER_CLOSE = False/' /tmp/settings.py
              cp /tmp/settings.py /authentik-settings/settings.py
              echo "Patch complete"
          volumeMounts:
            - name: patched-settings
              mountPath: /authentik-settings
      volumes:
        # Our blueprints are mounted as a SUBDIRECTORY of the image's own
        # /blueprints, so upstream's default/, system/ and migrations/ trees
        # stay visible and re-apply on every image bump (F-6d6decf1). The
        # previous layout copied the ConfigMap into an emptyDir mounted OVER
        # /blueprints, which hid those trees and froze every upstream-managed
        # object at whatever the database held. Discovery is recursive
        # (blueprints_find: rglob "**/*.yaml", skipping dot-prefixed parts such
        # as the ConfigMap's ..data symlink), so each key becomes a
        # BlueprintInstance with path cberg/<key>.yaml. Adding a data key to the
        # ConfigMap is still all it takes — no init container, no HelmRelease
        # edit. Layout, re-apply semantics and the post-rollout checks:
        # docs/sops/authentik.md "Blueprint directory layout".
        - name: blueprints-cberg
          configMap:
            name: authentik-blueprints
        - name: patched-settings
          emptyDir: {}
      volumeMounts:
        - name: blueprints-cberg
          mountPath: /blueprints/cberg
          readOnly: true
        - name: patched-settings
          mountPath: /authentik/root/settings.py
          subPath: settings.py
          readOnly: true
      ingress:
        # Replaced by httproute.yaml on envoy-external (phase 3 canary #1,
        # 2026-09-07). The block below is left INERT as the rollback target
        # until ingress-nginx is removed in phase 4. Do not re-enable without
        # removing the HTTPRoute — two live routes for one host give
        # k8s-gateway two records and resolution flaps between .102 and .104.
        enabled: false
        ingressClassName: external
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "Authentik"
          gethomepage.dev/description: "Identity Provider and SSO"
          gethomepage.dev/group: "Network Services"
          gethomepage.dev/icon: "authentik.png"
          gethomepage.dev/pod-selector: app.kubernetes.io/instance=authentik
          # Point to external CNAME for Cloudflare tunnel
          external-dns.alpha.kubernetes.io/target: "external.${SECRET_DOMAIN}"
        hosts:
          - "auth.${SECRET_DOMAIN}"
        paths:
          - "/"
        tls:
          - hosts:
              - "auth.${SECRET_DOMAIN}"

      # Metrics scraping is handled by a manually created ServiceMonitor
      # See: kubernetes/apps/kube-system/authentik/app/metrics-service.yaml
      # This allows us to scrape metrics from the server pods without relying on
      # the Helm chart's ServiceMonitor implementation which has limited configuration

      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 2Gi

    worker:
      replicas: 3
      env:
        - name: AUTHENTIK_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: authentik-secret
              key: SECRET_AUTHENTIK_SECRET_KEY
        # PostgreSQL connection configuration
        - name: AUTHENTIK_POSTGRESQL__HOST
          value: "authentik-pg"
        - name: AUTHENTIK_POSTGRESQL__NAME
          value: "authentik"
        - name: AUTHENTIK_POSTGRESQL__USER
          value: "authentik"
        - name: AUTHENTIK_POSTGRESQL__PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-secret
              key: SECRET_AUTHENTIK_DB_PASSWORD
        - name: AUTHENTIK_POSTGRESQL__PORT
          value: "5432"
        # Unauthenticated (pre-login) session age only. Logged-in SSO session
        # length is the user-login stage session_duration (days=365) in blueprint
        # cberg/session-lifetime-blueprint.yaml; that per-session set_expiry()
        # overrides SESSION_EXPIRE_AT_BROWSER_CLOSE (docs/sops/authentik.md
        # "Session lifetime").
        - name: AUTHENTIK_SESSIONS__UNAUTHENTICATED_AGE
          value: "days=365"
        # F-649e78b6: only the pod CIDR may set proxy headers (X-Forwarded-For).
        # Envoy Gateway (network/envoy-gateway policies.yaml) is the only hop
        # in front of authentik and trusts client XFF from that same CIDR. The
        # upstream default also trusts 10/8, 172.16/12 and 192.168/16, so any
        # LAN client reaching the Service directly could spoof its client IP.
        # Attribution only (events, reputation scoring) - not an access change.
        # Docs: "applies to the Server"; mirrored on the worker so both env
        # blocks stay identical.
        - name: AUTHENTIK_LISTEN__TRUSTED_PROXY_CIDRS
          value: "10.69.0.0/16"
      # WORKAROUND for Authentik 2025.10.1 bug - Remove when upgrading to 2025.10.2+
      # Issue: Workers try to connect to port 9000 (server port) instead of checking heartbeat file
      # Upstream: https://github.com/goauthentik/authentik/issues/17923
      # Fix: https://github.com/goauthentik/authentik/pull/18090 (scheduled for 2025.10.2)
      # This override pre-implements the official fix by disabling worker HTTP healthchecks
      # Workers don't expose HTTP endpoints, they only process background tasks via PostgreSQL
      livenessProbe: null
      readinessProbe: null
      startupProbe: null
      initContainers:
        # Wait for the authentik-pg Deployment (postgres 18.6) to be reachable
        # before starting the worker. See docs/sops/container-dependencies.md.
        - name: wait-for-postgresql
          image: busybox:1.38.0
          command:
            - sh
            - -c
            - |
              until nc -z authentik-pg 5432; do
                echo "waiting for authentik-pg:5432..."
                sleep 2
              done
        - name: patch-session-settings
          image: ghcr.io/goauthentik/server:2026.8.3
          command:
            - sh
            - -c
            - |
              echo "Patching SESSION_EXPIRE_AT_BROWSER_CLOSE to False..."
              cp /authentik/root/settings.py /tmp/settings.py
              sed -i 's/SESSION_EXPIRE_AT_BROWSER_CLOSE = True/SESSION_EXPIRE_AT_BROWSER_CLOSE = False/' /tmp/settings.py
              cp /tmp/settings.py /authentik-settings/settings.py
              echo "Patch complete"
          volumeMounts:
            - name: patched-settings
              mountPath: /authentik-settings
      volumes:
        # Same subdirectory mount as the server (see the comment there): the
        # worker is where blueprints_discovery, the file watcher and every
        # apply_blueprint task actually run, so this is the mount that matters.
        - name: blueprints-cberg
          configMap:
            name: authentik-blueprints
        - name: patched-settings
          emptyDir: {}
      volumeMounts:
        - name: blueprints-cberg
          mountPath: /blueprints/cberg
          readOnly: true
        - name: patched-settings
          mountPath: /authentik/root/settings.py
          subPath: settings.py
          readOnly: true
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 8Gi

    redis:
      # Disabled in 2025.10 - Redis support completely removed, migrated to PostgreSQL
      enabled: false
 
    postgresql:
      # Bundled 17.11 DB retired 2026-09-24 (plan authentik-pg17-decommission); live DB is deployment/authentik-pg
      enabled: false

    geoip:
      enabled: false

    serviceMonitor:
      enabled: true
