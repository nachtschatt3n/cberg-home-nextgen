kind: ReferenceGrant
metadata:
  name: nocodb-outpost-access
  namespace: kube-system
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: databases
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: databases
  to:
    - group: ""
      kind: Service
      name: ak-outpost-nocodb-forward-auth
