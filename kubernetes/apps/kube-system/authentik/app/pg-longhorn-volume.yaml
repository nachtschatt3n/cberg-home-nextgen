---
# NOT registered in kustomization.yaml on purpose: the app Kustomization's
# targetNamespace: kube-system would override namespace: storage and create a
# broken duplicate Longhorn ignores. See docs/sops/longhorn.md.
# Apply by hand once:  kubectl apply -f pg-longhorn-volume.yaml
apiVersion: longhorn.io/v1beta2
kind: Volume
metadata:
  name: authentik-pg-data
  namespace: storage
spec:
  size: "21474836480"   # 20 Gi
  numberOfReplicas: 2
  dataEngine: v1
  accessMode: rwo
  frontend: blockdev
  migratable: false
  encrypted: false
