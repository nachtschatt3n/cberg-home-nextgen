---
# Envoy migration PHASE 3 — canary #1: authentik's own hostname.
#
# Deliberately first. Every other external app's login depends on this host, so
# if the external path through Envoy is wrong, we want to find out here, on the
# one service whose failure is immediately obvious, rather than discover it
# later behind an app.
#
# THE §2.1 GATE: external-dns.alpha.kubernetes.io/target is REQUIRED and is
# carried across verbatim from the Ingress. For the gateway-httproute source,
# external-dns derives the record target from the PARENT GATEWAY's LB address
# when this annotation is absent — and envoy-external's address is
# 192.168.55.104, an RFC1918 address. Without it this either publishes private
# addressing into the public zone, or Cloudflare rejects the record because a
# proxied record cannot point at a private address, leaving the hostname dark.
# All 26 external Ingresses carry this same value; the only failure mode is
# forgetting to copy it.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authentik-server
  namespace: kube-system
  labels:
    gethomepage.dev/enabled: "true"
  annotations:
    external-dns.alpha.kubernetes.io/target: "external.${SECRET_DOMAIN}"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Authentik"
    gethomepage.dev/description: "Identity Provider and SSO"
    gethomepage.dev/group: "Network Services"
    gethomepage.dev/icon: "authentik.png"
    gethomepage.dev/pod-selector: "app.kubernetes.io/instance=authentik"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-external          # EXTERNAL gateway (.104), not envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - "auth.${SECRET_DOMAIN}"
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - group: ""
          kind: Service
          name: authentik-server
          port: 80
