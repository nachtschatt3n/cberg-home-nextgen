---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: csi-driver-smb
  namespace: kube-system
spec:
  interval: 30m
  chart:
    spec:
      # Sourced from kubernetes/flux/meta/repositories/git/csi-driver-smb.yaml
      # (GitRepository pinned to the commit tagged v1.20.3), NOT from an HTTP
      # chart index on a mutable branch -- see that file for why, and for the
      # proof that the chart directory below is byte-identical to the tarball
      # this release was already built from.
      #
      # For a git source `chart` is a PATH to the chart directory, and `version`
      # does not apply -- the version is whatever Chart.yaml says at the pinned
      # commit (1.20.3). Moving versions means changing this path AND the
      # GitRepository's ref.commit together.
      chart: charts/v1.20.3/csi-driver-smb
      sourceRef:
        kind: GitRepository
        name: csi-driver-smb
        namespace: flux-system
  install:
    remediation:
      retries: 2
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 2
  uninstall:
    keepHistory: false
  values:
    driver:
      name: smb.csi.k8s.io
    secrets:
      enabled: true
      name: csi-driver-smb
      namespace: kube-system
