---
instance:
  cluster:
    networkPolicy: false
  distribution:
    version: v2.9.3
  components:
    - source-controller
    - kustomize-controller
    - helm-controller
    - notification-controller
    - image-reflector-controller
    - image-automation-controller
  sync:
    kind: GitRepository
    url: "https://github.com/nachtschatt3n/cberg-home-nextgen.git"
    ref: "refs/heads/main"
    path: kubernetes/flux/cluster
    # FluxInstance .spec.sync takes `pullSecret` (a STRING), not `secretRef`.
    # This was `secretRef: {name: ...}` until 2026-08-18: an unknown field, so
    # the CRD's structural schema PRUNED it silently -- no error, no event. The
    # generated flux-system GitRepository came out with no credential at all.
    # Anonymous READ works (public repo) so the GitRepository stayed Ready and
    # nothing complained, but ImageUpdateAutomation must PUSH: both absenty
    # automations failed with "authentication required: No anonymous write
    # access" and never set .status.lastPushCommit.
    pullSecret: flux-system-git-auth
  # Ship ONLY kubernetes/ in the flux-system source artifact (F-baf94b64).
  # FluxInstance .spec.sync has no `ignore` field, so it is set on the
  # generated GitRepository via a kustomize patch. Without it every new
  # revision made kustomize-controller download + unpack the whole repo
  # (docs/ + runbooks/ are the bulk) once per Kustomization -- ~141x per
  # commit, and again on every Kustomization interval -- on the NVMe
  # partition etcd shares, causing fsync stalls and leader elections.
  # Verified 2026-09-26: every Kustomization spec.path is under kubernetes/,
  # no kustomization.yaml resource/component/generator file climbs out of
  # kubernetes/, no symlinks, and no HelmChart is sourced from flux-system.
  # If a Kustomization ever needs a path outside kubernetes/, add a precise
  # `!/<path>` negation here or it will fail with "path not found".
  kustomize:
    patches:
      - target:
          kind: GitRepository
          name: flux-system
        patch: |
          - op: add
            path: /spec/ignore
            value: |
              # exclude everything
              /*
              # include only what Flux reconciles
              !/kubernetes
