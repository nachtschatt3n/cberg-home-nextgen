---
# Official MariaDB image replacing the chart-bundled bitnamilegacy mariadb
# (archived catalog, frozen at server 11.8.2 — see the retirement comment in
# helmrelease.yaml and security_ref F-cb42f390). Plain Deployment + Service on
# purpose (not app-template): keeps the household's file index out of the
# app-template-5.0 migration blast radius, same as paperless-db and superset-pg.
#
# Replatform, not an upgrade: 11.8.2 -> 11.8.8 stays inside the 11.8 LTS
# series. The datadir moved from /bitnami/mariadb/data to /var/lib/mysql and
# the runtime uid from 1001 to 999, so the data came across as a logical dump
# into a fresh volume (nextcloud-db-data). The retired volume nextcloud-mariadb
# is kept, Retain, as the rollback floor.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-db
  namespace: office
  labels:
    app: nextcloud-db
spec:
  replicas: 1
  # Recreate: single-replica Deployment on an RWO Longhorn PVC — RollingUpdate
  # would surge a second pod and deadlock on Multi-Attach.
  # See docs/sops/longhorn-rwo-multi-attach.md.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nextcloud-db
  template:
    metadata:
      labels:
        app: nextcloud-db
    spec:
      containers:
        - name: mariadb
          image: mariadb:11.8.8
          imagePullPolicy: IfNotPresent
          # Server settings PINNED to what the retired server actually ran,
          # read off it while it was still live. This window changes the image
          # lineage and nothing about how the server behaves.
          #
          # charset: MariaDB 11.5+ initialises a fresh datadir as
          # utf8mb4/uca1400, but the retired server and all 206 restored tables
          # are utf8mb3/utf8mb3_general_ci. Without the pin the entrypoint would
          # create `nextcloud` as utf8mb4 while the dump restores utf8mb3 tables
          # into it — a silently mixed schema, which Nextcloud is especially
          # unforgiving about (it reports 4-byte support and index-length
          # behaviour off the schema). Moving Nextcloud to utf8mb4 is separate
          # work (occ db:convert-mysql-charset).
          #
          # transaction-isolation: REPEATABLE-READ because that is what the
          # retired server ran. Nextcloud's docs recommend READ-COMMITTED and
          # the plan suggested it, but switching isolation level in the same
          # change as a datastore replatform would mean two variables in one
          # window. Matching the source keeps this a pure image move; adopting
          # READ-COMMITTED is its own change.
          args:
            - --character-set-server=utf8mb3
            - --collation-server=utf8mb3_general_ci
            - --innodb-file-per-table=1
            - --transaction-isolation=REPEATABLE-READ
            - --max-connections=200
          env:
            - name: MARIADB_DATABASE
              value: nextcloud
            - name: MARIADB_USER
              valueFrom:
                secretKeyRef:
                  name: nextcloud-config
                  key: db-username
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-config
                  key: db-password
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-config
                  key: mariadb-root-password
          ports:
            - containerPort: 3306
              name: mariadb
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          # healthcheck.sh ships in the official image. --connect proves the
          # server answers on the socket, --innodb_initialized proves the
          # engine finished recovery — a server that answers but has not
          # initialised InnoDB fails every query the app makes.
          readinessProbe:
            exec:
              command:
                - healthcheck.sh
                - --connect
                - --innodb_initialized
            initialDelaySeconds: 45
            timeoutSeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - healthcheck.sh
                - --connect
                - --innodb_initialized
            initialDelaySeconds: 45
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 6
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nextcloud-db-data
---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud-db
  namespace: office
  labels:
    app: nextcloud-db
spec:
  type: ClusterIP
  ports:
    - port: 3306
      targetPort: 3306
      protocol: TCP
      name: mariadb
  selector:
    app: nextcloud-db
