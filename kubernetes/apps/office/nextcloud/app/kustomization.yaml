---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./secrets.sops.yaml
  - ./pvc.yaml
  # The replacement-database standup (db-pv/db-pvc/db-deployment/
  # db-longhorn-volume) was REMOVED 2026-08-20. It had been parked at
  # replicas: 0 since the 2026-08-19 rollback (revert d1dbbdd1) and its volume
  # held the restore that rollback rejected as LOSSY, so leaving it invited a
  # later reader to treat corrupted data as a usable starting point. Nextcloud
  # runs on the bundled nextcloud-mariadb throughout. Plan
  # bitnamilegacy-exit-nextcloud-db recreates the standup from scratch in its
  # Phase A, which is what attempt 2 needs anyway.
  - ./helmrelease.yaml
  - ./redis-deployment.yaml
  - ./whiteboard-proxy.yaml
  - ./notify-push.yaml
configMapGenerator:
  # Custom Nextcloud app — gives the OpenClaw agent a route that saves
  # IMAP drafts WITH attachments (upstream nextcloud/mail#458 has been
  # open since 2017). Materialized into the NC pod's custom_apps/ on
  # each boot via the install-openclaw-mail initContainer.
  - name: nextcloud-openclaw-mail-app
    files:
      - openclaw-mail/info.xml
      - openclaw-mail/routes.php
      - openclaw-mail/Application.php
      - openclaw-mail/DraftController.php
generatorOptions:
  # Fixed name so the HelmRelease can reference the ConfigMap directly.
  # Auto-restart on change is handled by reloader.stakater.com/auto on
  # the deployment.
  disableNameSuffixHash: true

