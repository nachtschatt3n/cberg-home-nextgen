---
# Official redis image replacing the chart-bundled bitnamilegacy redis
# (archived registry, frozen at redis 8.0.3 — see F-d62ac46a and the
# retirement comment in helmrelease.yaml). Plain Deployment + Service on
# purpose (not app-template): keeps this datastore out of the
# app-template-5.0 migration blast radius, same as superset-redis-official
# and the paperless-redis twin in this namespace.
#
# Deliberately NO PVC: this instance holds Nextcloud's distributed cache,
# transient file locks and PHP sessions only — ~140 keys steady state, ~96%
# of them carrying a TTL (the ~800 in the plan was the retired instance under
# load; size memory from the live figure, not that one). Nothing durable
# survives a restart by design. The old longhorn-static PV
# `redis-data-nextcloud-redis-master-0` was kept (Retain) as the rollback
# path for the bundled chart redis; deleted 2026-08-30 once the cutover was
# 11 days stable. It held only cache contents, so there was nothing to lose.
#
# Auth + source-restricted NetworkPolicy since plan nextcloud-redis-hardening
# (2026-09-26, see git log for this file): requirepass from SOPS key
# nextcloud-config/redis-password, enforced by a wrapper that refuses to start
# unauthenticated; consumers = main pod, cron pods, notify-push (via config.php).
#
# Named `nextcloud-redis`, NOT `nextcloud-redis-master`: reusing the old
# name would race Helm's own Service of that name during the cutover
# reconcile (field-manager / already-exists conflict at exactly the wrong
# moment).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-redis
  namespace: office
  labels:
    app: nextcloud-redis
spec:
  replicas: 1
  # No RWO volume here, but Recreate keeps rollouts deterministic for a
  # single-replica stateful-ish service and avoids two cache/lock servers
  # answering the same Service during an image bump — which for
  # memcache.locking would mean two disjoint lock namespaces.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nextcloud-redis
  template:
    metadata:
      labels:
        app: nextcloud-redis
    spec:
      containers:
      - name: redis
        image: redis:8.10.1-alpine
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - |
          # Refuse to start unauthenticated: an empty --requirepass means "no
          # password" to Redis, and a missing env var must be a crash, not a
          # silently open server.
          [ -n "$REDIS_PASSWORD" ] || { echo "REDIS_PASSWORD is empty — refusing to start"; exit 1; }
          exec redis-server --save "" --appendonly no --requirepass "$REDIS_PASSWORD"
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: nextcloud-config
              key: redis-password
        # redis-cli reads REDISCLI_AUTH — keeps the password off the probe argv.
        - name: REDISCLI_AUTH
          valueFrom:
            secretKeyRef:
              name: nextcloud-config
              key: redis-password
        ports:
        - containerPort: 6379
          name: redis
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 256Mi
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - redis-cli ping | grep -q PONG
          initialDelaySeconds: 5
          timeoutSeconds: 2
          periodSeconds: 10
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - redis-cli ping | grep -q PONG
          initialDelaySeconds: 15
          timeoutSeconds: 2
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud-redis
  namespace: office
  labels:
    app: nextcloud-redis
spec:
  type: ClusterIP
  ports:
  - port: 6379
    targetPort: 6379
    protocol: TCP
    name: redis
  selector:
    app: nextcloud-redis
---
# Replacement for the subchart-owned `networkpolicy/nextcloud-redis`.
# Source-restricted since plan nextcloud-redis-hardening (2026-09-26): only
# the three real consumers (CLIENT LIST-verified) may reach 6379 — main pod
# + cron pods (instance=nextcloud, component in [app, cronjob]) and
# notify-push. A mis-scoped selector surfaces as file-lock timeouts rather
# than a clean connection error. Egress is unrestricted.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nextcloud-redis
  namespace: office
  labels:
    app: nextcloud-redis
spec:
  podSelector:
    matchLabels:
      app: nextcloud-redis
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - {key: app.kubernetes.io/instance, operator: In, values: [nextcloud]}
        - {key: app.kubernetes.io/component, operator: In, values: [app, cronjob]}
    - podSelector:
        matchLabels:
          app: nextcloud-notify-push
    ports:
    - port: 6379
      protocol: TCP
  egress:
  - {}
