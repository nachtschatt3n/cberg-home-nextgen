---
# Official redis image replacing the chart-bundled bitnamilegacy redis
# (archived registry, frozen at redis 8.0.3 — see F-d62ac46a and the
# retirement comment in helmrelease.yaml). Plain Deployment + Service on
# purpose (not app-template): keeps this datastore out of the
# app-template-5.0 migration blast radius, same as superset-redis-official
# and the paperless-redis twin in this namespace.
#
# Deliberately NO PVC: this instance holds Nextcloud's distributed cache,
# transient file locks and sessions only — ~800 keys, ~99% of them with a
# TTL. Nothing durable. The old longhorn-static PV
# `redis-data-nextcloud-redis-master-0` is kept (Retain) purely as the
# rollback path for the bundled chart redis.
#
# Deliberately NO --requirepass: parity with the retired instance's
# `auth.enabled: false` posture. Nextcloud's redis.config.php carries no
# password either, so introducing auth is a separate change that must edit
# both sides at once.
#
# Named `nextcloud-redis`, NOT `nextcloud-redis-master`: reusing the old
# name would race Helm's own Service of that name during the cutover
# reconcile (field-manager / already-exists conflict at exactly the wrong
# moment).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-redis
  namespace: office
  labels:
    app: nextcloud-redis
spec:
  replicas: 1
  # No RWO volume here, but Recreate keeps rollouts deterministic for a
  # single-replica stateful-ish service and avoids two cache/lock servers
  # answering the same Service during an image bump — which for
  # memcache.locking would mean two disjoint lock namespaces.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nextcloud-redis
  template:
    metadata:
      labels:
        app: nextcloud-redis
    spec:
      containers:
      - name: redis
        image: redis:8.10.0-alpine
        imagePullPolicy: IfNotPresent
        command:
        - redis-server
        - --save
        - ""
        - --appendonly
        - "no"
        ports:
        - containerPort: 6379
          name: redis
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 256Mi
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - redis-cli ping | grep -q PONG
          initialDelaySeconds: 5
          timeoutSeconds: 2
          periodSeconds: 10
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - redis-cli ping | grep -q PONG
          initialDelaySeconds: 15
          timeoutSeconds: 2
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud-redis
  namespace: office
  labels:
    app: nextcloud-redis
spec:
  type: ClusterIP
  ports:
  - port: 6379
    targetPort: 6379
    protocol: TCP
    name: redis
  selector:
    app: nextcloud-redis
---
# Replacement for the subchart-owned `networkpolicy/nextcloud-redis`, which
# disappears together with the subchart when `redis.enabled: false`. Without
# this the replacement Redis would be the only unguarded datastore in the
# namespace. Posture mirrored 1:1 from the retired policy: ingress limited to
# TCP 6379, egress unrestricted.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nextcloud-redis
  namespace: office
  labels:
    app: nextcloud-redis
spec:
  podSelector:
    matchLabels:
      app: nextcloud-redis
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - ports:
    - port: 6379
      protocol: TCP
  egress:
  - {}
