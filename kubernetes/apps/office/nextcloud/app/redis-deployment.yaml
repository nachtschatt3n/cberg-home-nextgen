---
# Official redis image replacing the chart-bundled bitnamilegacy redis
# (archived registry, frozen at redis 8.0.3 — see F-d62ac46a and the
# retirement comment in helmrelease.yaml). Plain Deployment + Service on
# purpose (not app-template): keeps this datastore out of the
# app-template-5.0 migration blast radius, same as superset-redis-official
# and the paperless-redis twin in this namespace.
#
# Deliberately NO PVC: this instance holds Nextcloud's distributed cache,
# transient file locks and PHP sessions only — ~140 keys steady state, ~96%
# of them carrying a TTL (the ~800 in the plan was the retired instance under
# load; size memory from the live figure, not that one). Nothing durable
# survives a restart by design. The old longhorn-static PV
# `redis-data-nextcloud-redis-master-0` was kept (Retain) as the rollback
# path for the bundled chart redis; deleted 2026-08-30 once the cutover was
# 11 days stable. It held only cache contents, so there was nothing to lose.
#
# Deliberately NO --requirepass: parity with the retired instance's
# `auth.enabled: false` posture, so this cutover stays a pure registry move.
#
# CORRECTION (2026-08-19, post-execution review): an earlier version of this
# comment claimed auth was deferred because "redis.config.php carries no
# password, so both sides must change at once". That is wrong and should not
# be relied on. The password path already exists upstream on both sides —
# redis.config.php reads REDIS_HOST_PASSWORD/_FILE, the image entrypoint
# builds session.save_path with auth from it, and the chart's externalRedis
# block emits it. Enabling auth is therefore a normal scoped change (SOPS
# secret + secretKeyRef + `sh -c` wrapper, since redis-server does not expand
# env in argv + externalRedis.password + flip redis.auth.enabled so
# _helpers.tpl renders the AUTH form + the hardcoded worker sidecar env +
# the config.php refresh, see notify-push.yaml). Deferring it here was a
# SCOPING decision, not a technical blocker.
#
# Named `nextcloud-redis`, NOT `nextcloud-redis-master`: reusing the old
# name would race Helm's own Service of that name during the cutover
# reconcile (field-manager / already-exists conflict at exactly the wrong
# moment).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-redis
  namespace: office
  labels:
    app: nextcloud-redis
spec:
  replicas: 1
  # No RWO volume here, but Recreate keeps rollouts deterministic for a
  # single-replica stateful-ish service and avoids two cache/lock servers
  # answering the same Service during an image bump — which for
  # memcache.locking would mean two disjoint lock namespaces.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nextcloud-redis
  template:
    metadata:
      labels:
        app: nextcloud-redis
    spec:
      containers:
      - name: redis
        image: redis:8.10.0-alpine
        imagePullPolicy: IfNotPresent
        command:
        - redis-server
        - --save
        - ""
        - --appendonly
        - "no"
        ports:
        - containerPort: 6379
          name: redis
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 256Mi
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - redis-cli ping | grep -q PONG
          initialDelaySeconds: 5
          timeoutSeconds: 2
          periodSeconds: 10
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - redis-cli ping | grep -q PONG
          initialDelaySeconds: 15
          timeoutSeconds: 2
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud-redis
  namespace: office
  labels:
    app: nextcloud-redis
spec:
  type: ClusterIP
  ports:
  - port: 6379
    targetPort: 6379
    protocol: TCP
    name: redis
  selector:
    app: nextcloud-redis
---
# Replacement for the subchart-owned `networkpolicy/nextcloud-redis`, which
# disappears together with the subchart when `redis.enabled: false`.
#
# READ THE SEMANTICS BEFORE TRUSTING THIS. It is mirrored 1:1 from the retired
# subchart policy (and matches the shape of the surviving
# networkpolicy/nextcloud-mariadb), but "mirrors the old policy" and
# "restricts access" are different claims and only the first one holds: an
# ingress rule carrying `ports` and no `from` peer allows ALL sources on that
# port. What this actually constrains is ports OTHER than 6379 — and redis
# listens on nothing else. Egress is unrestricted.
#
# To make it restrict sources, add a `from:` with podSelectors for the real
# consumers, which are (verified from CLIENT LIST + pod labels, all in
# office): the main pod and the cron Jobs, both labelled
# app.kubernetes.io/instance=nextcloud, and app=nextcloud-notify-push.
# nextcloud-metrics, -mcp and -whiteboard do not connect. Do it in a window,
# not casually: a mis-scoped selector surfaces as file-lock timeouts rather
# than a clean connection error.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nextcloud-redis
  namespace: office
  labels:
    app: nextcloud-redis
spec:
  podSelector:
    matchLabels:
      app: nextcloud-redis
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - ports:
    - port: 6379
      protocol: TCP
  egress:
  - {}
