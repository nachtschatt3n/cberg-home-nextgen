---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-whiteboard
  namespace: office
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app: nextcloud-whiteboard
    app.kubernetes.io/name: nextcloud-whiteboard
    app.kubernetes.io/instance: nextcloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nextcloud-whiteboard
  template:
    metadata:
      labels:
        app: nextcloud-whiteboard
    spec:
      containers:
      - name: whiteboard-server
        image: ghcr.io/nextcloud-releases/whiteboard:v1.5.9
        ports:
        - containerPort: 3002
          name: websocket
        env:
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: nextcloud-config
              key: whiteboard-jwt-secret
        - name: NEXTCLOUD_URL
          value: "https://drive.${SECRET_DOMAIN}"
        - name: STORAGE_STRATEGY
          value: "lru"
        - name: PORT
          value: "3002"
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
            ephemeral-storage: 256Mi
          limits:
            # 1Gi is upstream's sizing for ~50 users; the image bundles ffmpeg
            # for server-side recording since v1.5.5, so 256Mi risked OOM.
            memory: 1Gi
            # Recording/temp output goes to the writable layer without this cap,
            # which is a node-disk-pressure risk, not just a pod-local one.
            ephemeral-storage: 2Gi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud-whiteboard
  namespace: office
  labels:
    app: nextcloud-whiteboard
    app.kubernetes.io/name: nextcloud-whiteboard
    app.kubernetes.io/instance: nextcloud
spec:
  type: ClusterIP
  ports:
  - port: 3002
    targetPort: 3002
    protocol: TCP
    name: websocket
  selector:
    app: nextcloud-whiteboard
---
# The nextcloud-whiteboard Ingress was REMOVED 2026-09-07 (Envoy phase 3).
# It is now httproute-whiteboard.yaml on envoy-external, carrying the 3600s
# timeout (WebSocket collaborative editing) and the HSTS header the nginx
# configuration-snippet used to add.
