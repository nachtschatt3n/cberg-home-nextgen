---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud-notify-push
  namespace: office
spec:
  type: ClusterIP
  ports:
    - name: notify-push
      port: 7867
      targetPort: 7867
      protocol: TCP
  selector:
    app: nextcloud-notify-push
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-notify-push
  namespace: office
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nextcloud-notify-push
  template:
    metadata:
      labels:
        app: nextcloud-notify-push
    spec:
      containers:
        - name: notify-push
          # Keep in lockstep with the main nextcloud server image
          # (helmrelease.yaml). It had lagged at 33.0.0 while the server was on
          # 34.x — the sole source of ~12 "fixable CRITICAL" CVEs from that lag
          # (2026-07-31). The notify_push binary must match the server version.
          image: nextcloud:34.0.3
          command:
            - /var/www/html/custom_apps/notify_push/bin/x86_64/notify_push
            - /var/www/html/config/config.php
          ports:
            - containerPort: 7867
              name: notify-push
              protocol: TCP
          # NOTE — notify_push does NOT read REDIS_HOST from its own
          # environment. It parses config.php directly and uses the redis
          # host PERSISTED there, ignoring the chart's redis.config.php
          # overlay (which is `if (getenv('REDIS_HOST'))` and is what the
          # main container follows). So a redis hostname change reaches the
          # main app through the HelmRelease but reaches notify_push only
          # once config.php itself is rewritten. Nextcloud rewrites config.php
          # with the full merged config on ANY `occ config:system:set`, so
          # after such a rename:
          #   occ config:system:set  zz_touch --value=1 && \
          #   occ config:system:delete zz_touch
          # then roll this Deployment so notify_push re-parses. Verify with
          # `occ notify_push:self-test` — a green HelmRelease will not catch
          # it (found the hard way during the 2026-08-19 redis registry move).
          # Adding REDIS_HOST here does NOT work; it was tried and reverted.
          env:
            - name: PORT
              value: "7867"
            - name: NEXTCLOUD_URL
              value: "http://nextcloud:8080"
          volumeMounts:
            - name: nextcloud-main
              mountPath: /var/www/
              subPath: root
            - name: nextcloud-main
              mountPath: /var/www/html
              subPath: html
            - name: nextcloud-data
              mountPath: /var/www/html/data
              subPath: data
            - name: nextcloud-main
              mountPath: /var/www/html/config
              subPath: config
            - name: nextcloud-main
              mountPath: /var/www/html/custom_apps
              subPath: custom_apps
            - name: nextcloud-main
              mountPath: /var/www/tmp
              subPath: tmp
            - name: nextcloud-main
              mountPath: /var/www/html/themes
              subPath: themes
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
      volumes:
        - name: nextcloud-main
          persistentVolumeClaim:
            claimName: nextcloud-config
        - name: nextcloud-data
          persistentVolumeClaim:
            claimName: nextcloud-data
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nextcloud-notify-push
  namespace: office
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    external-dns.alpha.kubernetes.io/target: "external.${SECRET_DOMAIN}"
spec:
  ingressClassName: external
  rules:
    - host: "drive.${SECRET_DOMAIN}"
      http:
        paths:
          - path: /push
            pathType: Prefix
            backend:
              service:
                name: nextcloud-notify-push
                port:
                  number: 7867
  tls:
    - secretName: nextcloud-tls
      hosts:
        - "drive.${SECRET_DOMAIN}"
