---
# Speaking-name static Longhorn volume for the replacement Nextcloud database.
# The Longhorn Volume CR, this PV, its volumeHandle, the PVC and the PVC's
# volumeName all share the identifier `nextcloud-db-data` so the volume is
# identifiable in the Longhorn UI and in a backup list without a claimRef
# lookup (docs/sops/longhorn.md).
#
# 10Gi: the retiring 5Gi volume sits at 25% (1.2G), but oc_filecache and
# oc_activity grow without bound and this is the household's file index.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nextcloud-db-data
spec:
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: longhorn-static
  csi:
    driver: driver.longhorn.io
    fsType: ext4
    volumeAttributes:
      numberOfReplicas: "2"
      staleReplicaTimeout: "30"
    volumeHandle: nextcloud-db-data
