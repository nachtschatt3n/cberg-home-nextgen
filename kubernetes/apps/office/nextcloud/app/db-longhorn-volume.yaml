---
# Replacement Nextcloud DB volume (mariadb:11.8.8, plan bitnamilegacy-exit-nextcloud-db).
# NOT registered in kustomization.yaml — Flux `targetNamespace: office` would
# override `namespace: storage` and create a broken duplicate Longhorn ignores
# (CLAUDE.md Longhorn rules). Applied by hand once:
#   kubectl apply -f db-longhorn-volume.yaml
apiVersion: longhorn.io/v1beta2
kind: Volume
metadata:
  name: nextcloud-db-data
  namespace: storage
spec:
  size: "10737418240"   # 10 Gi
  numberOfReplicas: 2
  dataEngine: v1
  accessMode: rwo
  frontend: blockdev
  migratable: false
  encrypted: false
