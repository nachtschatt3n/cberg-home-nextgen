---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: stalwart
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      stalwart:
        # Single replica on an RWO Longhorn volume: RollingUpdate would schedule
        # the new pod before the old one releases the volume (Multi-Attach).
        strategy: Recreate
        # Reloader restarts the pod when stalwart-tls is renewed (Stalwart reads
        # the PEM files at startup) or when stalwart-secret / the config change.
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: stalwartlabs/stalwart
              tag: v0.16.24@sha256:ec011be228596e37e65f41aab17deed573859614430472f7eeb42178c50d87b7
            args: ["--config", "/etc/stalwart/config.json"]
            env:
              TZ: Europe/Berlin
              # Break-glass admin (username:password). Kept permanently as the
              # recovery credential; the bootstrap plan authenticates with it.
              STALWART_RECOVERY_ADMIN:
                secretKeyRef:
                  name: stalwart-secret
                  key: STALWART_RECOVERY_ADMIN
            # Remaining secret values are exposed as env so store objects can
            # reference them with {"@type":"EnvironmentVariable"} secrets
            # instead of copying plaintext into the datastore.
            envFrom:
              - secretRef:
                  name: stalwart-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz/live
                    port: &mgmt 8080
                  initialDelaySeconds: 20
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz/ready
                    port: *mgmt
                  initialDelaySeconds: 10
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz/live
                    port: *mgmt
                  periodSeconds: 5
                  failureThreshold: 60
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
                # The image binary carries cap_net_bind_service=+ep for the
                # privileged mail ports (25/465/587/993).
                add: ["NET_BIND_SERVICE"]
        pod:
          annotations:
            # Stalwart binds NetworkListeners only at process start; a
            # ReloadSettings action does NOT open/close ports. After changing
            # listeners via bootstrap/plan.ndjson.tmpl, bump this value to
            # roll the pod through git (docs/sops/stalwart.md).
            stalwart.cberg/listener-revision: "1"
          securityContext:
            runAsUser: 2000
            runAsGroup: 2000
            runAsNonRoot: true
            fsGroup: 2000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault

    service:
      stalwart:
        controller: stalwart
        type: ClusterIP
        ports:
          http:
            port: *mgmt
          # Port 25 is internal-only (ClusterIP): the future mail-ingest shim
          # delivers here. It is never put on a LoadBalancer.
          smtp:
            port: 25
          submissions:
            port: 465
          submission:
            port: 587
          imaps:
            port: 993

    route:
      stalwart:
        kind: HTTPRoute
        hostnames:
          - "stalwart.${SECRET_DOMAIN}"
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: Gateway
            name: envoy-internal
            namespace: network
            # https only. The http listener is owned cluster-wide by
            # httproute-https-redirect, which 301s every host.
            sectionName: https
        labels:
          gethomepage.dev/enabled: "true"
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "Stalwart"
          gethomepage.dev/group: "Office"
          gethomepage.dev/icon: "stalwart.png"
          gethomepage.dev/description: "Mail server (admin + webmail/JMAP)"
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: stalwart
                port: *mgmt

    persistence:
      data:
        existingClaim: stalwart-data
        globalMounts:
          - path: /var/lib/stalwart
      config:
        type: configMap
        name: stalwart-config
        globalMounts:
          - path: /etc/stalwart
            readOnly: true
      # Whole-directory mount (no subPath) so a renewed certificate lands in
      # the pod; Reloader then restarts Stalwart to pick it up.
      tls:
        type: secret
        name: stalwart-tls
        globalMounts:
          - path: /etc/stalwart-tls
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
