---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./secret.sops.yaml
  - ./configmap.yaml
  - ./certificate.yaml
  - ./pv.yaml
  - ./pvc.yaml
  - ./helmrelease.yaml
  - ./servicemonitor.yaml
  # longhorn-volume.yaml is deliberately NOT listed: this Kustomization's
  # targetNamespace (office) would override its `namespace: storage` and create
  # a broken duplicate Longhorn ignores. Apply it by hand, once.
  # bootstrap-plan.ndjson is not a Kubernetes object; it is the stalwart-cli
  # apply plan, run from the operator Mac (see docs/sops/stalwart.md).
