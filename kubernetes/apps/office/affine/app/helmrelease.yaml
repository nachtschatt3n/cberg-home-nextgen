---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: affine
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    timeout: 20m
    remediation:
      retries: 3
  upgrade:
    timeout: 20m
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  dependsOn:
    - name: affine-pg
    - name: affine-redis
  values:
    controllers:
      main:
        strategy: Recreate
        pod:
          annotations:
            reloader.stakater.com/auto: "true"
            secret.reloader.stakater.com/reload: affine-secret
        initContainers:
          wait-for-postgres:
            image:
              repository: busybox
              tag: 1.38.0
            command:
              - sh
              - -c
              - |
                until nc -z affine-pg 5432; do
                  echo "waiting for affine-pg:5432..."
                  sleep 2
                done
                echo "postgres reachable"
          wait-for-redis:
            image:
              repository: busybox
              tag: 1.38.0
            command:
              - sh
              - -c
              - |
                until nc -z affine-redis 6379; do
                  echo "waiting for affine-redis:6379..."
                  sleep 2
                done
                echo "redis reachable"
          predeploy:
            image:
              repository: ghcr.io/toeverything/affine
              tag: 0.27.4
              pullPolicy: IfNotPresent
            command:
              - sh
              - -c
              - node ./scripts/self-host-predeploy.js
            env:
              - name: TZ
                value: ${TIMEZONE}
              - name: DATABASE_URL
                valueFrom:
                  secretKeyRef:
                    name: affine-secret
                    key: DATABASE_URL
              - name: REDIS_SERVER_HOST
                value: affine-redis
              - name: REDIS_SERVER_PORT
                value: "6379"
              - name: AFFINE_SERVER_EXTERNAL_URL
                value: https://affine.${SECRET_DOMAIN}
              - name: AFFINE_SERVER_HOST
                value: affine.${SECRET_DOMAIN}
              - name: AFFINE_SERVER_HTTPS
                value: "true"
              - name: AFFINE_INDEXER_ENABLED
                value: "false"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
        containers:
          main:
            image:
              repository: ghcr.io/toeverything/affine
              tag: 0.27.4
              pullPolicy: IfNotPresent
            env:
              - name: TZ
                value: ${TIMEZONE}
              - name: DATABASE_URL
                valueFrom:
                  secretKeyRef:
                    name: affine-secret
                    key: DATABASE_URL
              - name: REDIS_SERVER_HOST
                value: affine-redis
              - name: REDIS_SERVER_PORT
                value: "6379"
              - name: AFFINE_SERVER_EXTERNAL_URL
                value: https://affine.${SECRET_DOMAIN}
              - name: AFFINE_SERVER_HOST
                value: affine.${SECRET_DOMAIN}
              - name: AFFINE_SERVER_HTTPS
                value: "true"
              - name: AFFINE_INDEXER_ENABLED
                value: "false"
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                memory: 2Gi
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 3010
                  initialDelaySeconds: 60
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 6
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  initialDelaySeconds: 20
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 60
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }

    service:
      main:
        controller: main
        type: ClusterIP
        ports:
          http:
            port: *port

    # Envoy Gateway migration phase 2 (2026-09-07): Ingress -> HTTPRoute.
    # Both halves in ONE commit -- k8s-gateway watches Ingress AND HTTPRoute,
    # so leaving the Ingress alongside the route gives this host two records
    # (.100 and .103) and it resolves non-deterministically.
    route:
      main:
        kind: HTTPRoute
        hostnames:
          - "affine.${SECRET_DOMAIN}"
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: Gateway
            name: envoy-internal
            namespace: network
            # https only. The http listener is owned cluster-wide by
            # httproute-https-redirect, which 301s every host.
            sectionName: https
        labels:
          gethomepage.dev/enabled: "true"
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "AFFiNE"
          gethomepage.dev/group: "Office"
          gethomepage.dev/icon: "affine.png"
          gethomepage.dev/description: "Collaborative knowledge base and workspace"
        # Rule written out explicitly rather than relying on the chart default:
        # the "rules may be omitted" shortcut only holds while exactly one
        # Service is enabled, and _validate.tpl hard-fails the moment a second
        # one appears.
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: main
                port: http
    persistence:
      config:
        enabled: true
        existingClaim: affine-config
        globalMounts:
          - path: /root/.affine/config
      storage:
        enabled: true
        existingClaim: affine-storage
        globalMounts:
          - path: /root/.affine/storage
      runtime-config:
        type: configMap
        name: affine-configmap
        globalMounts:
          - path: /root/.affine/config/config.json
            subPath: config.json
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
