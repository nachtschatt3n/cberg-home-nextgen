---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2beta2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: omni-tools
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  maxHistory: 1
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: false
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: iib0011/omni-tools
              tag: "0.6.0"
            env:
              TZ: ${TIMEZONE}
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 80
                  initialDelaySeconds: 30
                  periodSeconds: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 5
                  periodSeconds: 10
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                cpu: 500m
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
        pod:
          securityContext:
            runAsUser: 568
            runAsGroup: 568
            runAsNonRoot: true
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch

    service:
      main:
        controller: main
        type: ClusterIP
        ports:
          http:
            port: *port

    # Envoy Gateway migration phase 2 (2026-09-07): Ingress -> HTTPRoute.
    # Both halves in ONE commit -- k8s-gateway watches Ingress AND HTTPRoute,
    # so leaving the Ingress alongside the route gives this host two records
    # (.100 and .103) and it resolves non-deterministically.
    route:
      main:
        kind: HTTPRoute
        hostnames:
          - "omni-tools.${SECRET_DOMAIN}"
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: Gateway
            name: envoy-internal
            namespace: network
            # https only. The http listener is owned cluster-wide by
            # httproute-https-redirect, which 301s every host.
            sectionName: https
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "Omni Tools"
          gethomepage.dev/group: "Office"
          gethomepage.dev/icon: "omni-tools.png"
          gethomepage.dev/description: "Multi-purpose toolkit for PDF, text, date, math, and data tools"
        labels:
          # Was applied by a postRenderers kustomize patch onto the rendered
          # Ingress (that patch is removed in this commit -- with no Ingress it
          # would match nothing and fail the render). route takes labels natively.
          gethomepage.dev/enabled: "true"
        # Rule written out explicitly rather than relying on the chart default:
        # the "rules may be omitted" shortcut only holds while exactly one
        # Service is enabled, and _validate.tpl hard-fails the moment a second
        # one appears.
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: main
                port: http
    persistence:
      cache:
        type: emptyDir
        advancedMounts:
          main:
            main:
              - path: /var/cache/nginx
      tmp:
        type: emptyDir
        advancedMounts:
          main:
            main:
              - path: /tmp
      run:
        type: emptyDir
        advancedMounts:
          main:
            main:
              - path: /run
