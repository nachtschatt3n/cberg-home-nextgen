---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arag-web
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  maxHistory: 1
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      main:
        containers:
          app:
            image:
              repository: ghcr.io/nachtschatt3n/arag-web
              tag: sha-3f5fb90
              pullPolicy: Always
            env:
              RAILS_ENV: production
              DATABASE_PATH: /data/arag.sqlite
              RAILS_SERVE_STATIC_FILES: "true"
              RAILS_LOG_TO_STDOUT: "true"
              TMPDIR: /rails/tmp
              SOLID_QUEUE_IN_PUMA: "true"
              PAPERLESS_WEB_URL: "https://paperless.${SECRET_DOMAIN}"
              SURE_WEB_URL: "https://sure.${SECRET_DOMAIN}"
            envFrom:
              - secretRef:
                  name: arag-web-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /up
                    port: 80
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /up
                    port: 80
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  failureThreshold: 3
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop: ["ALL"]
        pod:
          imagePullSecrets:
            - name: arag-web-ghcr-pull
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch

    service:
      main:
        controller: main
        type: ClusterIP
        ports:
          http:
            port: 80

    # Envoy Gateway migration phase 2 (2026-09-07): Ingress -> HTTPRoute.
    # Both halves in ONE commit -- k8s-gateway watches Ingress AND HTTPRoute,
    # so leaving the Ingress alongside the route gives this host two records
    # (.100 and .103) and it resolves non-deterministically.
    route:
      main:
        kind: HTTPRoute
        hostnames:
          - "arag.${SECRET_DOMAIN}"
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: Gateway
            name: envoy-internal
            namespace: network
            # https only. The http listener is owned cluster-wide by
            # httproute-https-redirect, which 301s every host.
            sectionName: https
        labels:
          gethomepage.dev/enabled: "true"
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "ARAG"
          gethomepage.dev/group: "Office"
          gethomepage.dev/icon: "mdi-hospital-box"
          gethomepage.dev/description: "ARAG health insurance tracker"
        # Rule written out explicitly rather than relying on the chart default:
        # the "rules may be omitted" shortcut only holds while exactly one
        # Service is enabled, and _validate.tpl hard-fails the moment a second
        # one appears.
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: main
                port: http
    persistence:
      data:
        existingClaim: arag-web-data
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
