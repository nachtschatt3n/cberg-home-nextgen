---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2beta2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vaultwarden
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  maxHistory: 1
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: false
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllerType: deployment
    controllers:
      main:
        containers:
          main:
            image:
              repository: vaultwarden/server
              tag: "1.37.2"
            env:
              ADMIN_TOKEN:
                secretKeyRef:
                  name: vaultwarden-secret
                  key: admin-token
              DOMAIN: "https://vaultwarden.${SECRET_DOMAIN}"
              PORT: "80"
              SMTP_HOST: "mail.gmx.net"
              SMTP_FROM:
                secretKeyRef:
                  name: vaultwarden-secret
                  key: smtp-from
              SMTP_FROM_NAME: "Vaultwarden"
              SMTP_SECURITY: "starttls"
              SMTP_PORT: "587"
              SMTP_USERNAME:
                secretKeyRef:
                  name: vaultwarden-secret
                  key: smtp-username
              SMTP_PASSWORD:
                secretKeyRef:
                  name: vaultwarden-secret
                  key: smtp-password
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /alive
                    port: &port 80
                  initialDelaySeconds: 30
                  periodSeconds: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /alive
                    port: *port
                  initialDelaySeconds: 5
                  periodSeconds: 10
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
        pod:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch

    service:
      main:
        controller: main
        type: ClusterIP
        ports:
          http:
            port: *port

    # Envoy Gateway migration phase 2 (2026-09-07): Ingress -> HTTPRoute.
    # Both halves in ONE commit -- k8s-gateway watches Ingress AND HTTPRoute,
    # so leaving the Ingress alongside the route gives this host two records
    # (.100 and .103) and it resolves non-deterministically.
    route:
      main:
        kind: HTTPRoute
        hostnames:
          - "vaultwarden.${SECRET_DOMAIN}"
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: Gateway
            name: envoy-internal
            namespace: network
            # https only. The http listener is owned cluster-wide by
            # httproute-https-redirect, which 301s every host.
            sectionName: https
        labels:
          gethomepage.dev/enabled: "true"
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "Vaultwarden"
          gethomepage.dev/group: "Office"
          gethomepage.dev/icon: "bitwarden.png"
          gethomepage.dev/description: "Self-hosted password manager"
        # Rule written out explicitly rather than relying on the chart default:
        # the "rules may be omitted" shortcut only holds while exactly one
        # Service is enabled, and _validate.tpl hard-fails the moment a second
        # one appears.
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: main
                port: http
    persistence:
      data:
        enabled: true
        existingClaim: vaultwarden-data