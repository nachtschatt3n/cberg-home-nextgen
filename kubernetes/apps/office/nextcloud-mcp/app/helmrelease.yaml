---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2beta2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app nextcloud-mcp
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  maxHistory: 1
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: false
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/cbcoutinho/nextcloud-mcp-server
              tag: 0.184.5
            envFrom:
              - secretRef:
                  name: nextcloud-mcp-config
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 8000
                  initialDelaySeconds: 10
                  periodSeconds: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  initialDelaySeconds: 5
                  periodSeconds: 10
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 1Gi

    service:
      main:
        controller: main
        ports:
          http:
            port: *port

    # Envoy Gateway migration phase 2 (2026-09-07): Ingress -> HTTPRoute.
    # Both halves in ONE commit -- k8s-gateway watches Ingress AND HTTPRoute,
    # so leaving the Ingress alongside the route gives this host two records
    # (.100 and .103) and it resolves non-deterministically.
    route:
      main:
        kind: HTTPRoute
        hostnames:
          - "nextcloud-mcp.${SECRET_DOMAIN}"
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: Gateway
            name: envoy-internal
            namespace: network
            # https only. The http listener is owned cluster-wide by
            # httproute-https-redirect, which 301s every host.
            sectionName: https
        # Rule written out explicitly rather than relying on the chart default:
        # the "rules may be omitted" shortcut only holds while exactly one
        # Service is enabled, and _validate.tpl hard-fails the moment a second
        # one appears.
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: main
                port: http