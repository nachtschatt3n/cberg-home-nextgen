# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app mealie
  namespace: &namespace office
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: longhorn
      namespace: storage
  path: ./kubernetes/apps/office/mealie/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  # 10m (not the usual 5m): first install runs Alembic migrations against an
  # empty schema. Same class as uzeit-de (152cb651) — a from-scratch schema
  # install that outruns the default timeout looks like a failure while it is
  # still making forward progress. The HelmRelease carries its own 15m.
  timeout: 10m
