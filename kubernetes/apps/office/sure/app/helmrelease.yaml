---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sure
spec:
  interval: 30m
  chart:
    spec:
      chart: sure
      version: 0.7.4
      sourceRef:
        kind: HelmRepository
        name: sure
        namespace: flux-system
  install:
    timeout: 20m
    remediation:
      retries: 3
  upgrade:
    timeout: 20m
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  dependsOn:
    - name: sure-pg
    - name: sure-redis
  # Post-render patch: the Sure chart hard-codes ingress metadata.labels
  # and doesn't expose a values pass-through, so we inject the Homepage
  # discovery label here (doc-check.py enforces both annotation + label).
  # Same chart limitation applies to extraInitContainers — the chart only
  # exposes a fixed db-migrate initContainer, so we inject wait-for-pg /
  # wait-for-redis via strategic-merge patches on the rendered Deployments.
  # Pattern: docs/sops/container-dependencies.md (busybox + nc -z loop).
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Ingress
              name: sure
            patch: |
              - op: add
                path: /metadata/labels/gethomepage.dev~1enabled
                value: "true"
          - target:
              kind: Deployment
              name: sure-web
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: sure-web
              spec:
                template:
                  spec:
                    initContainers:
                      - name: wait-for-pg
                        image: busybox:1.38.0
                        command:
                          - sh
                          - -c
                          - |
                            until nc -z sure-pg 5432; do
                              echo "waiting for sure-pg:5432..."
                              sleep 2
                            done
                      - name: wait-for-redis
                        image: busybox:1.38.0
                        command:
                          - sh
                          - -c
                          - |
                            until nc -z sure-redis 6379; do
                              echo "waiting for sure-redis:6379..."
                              sleep 2
                            done
          - target:
              kind: Deployment
              name: sure-worker
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: sure-worker
              spec:
                template:
                  spec:
                    initContainers:
                      - name: wait-for-pg
                        image: busybox:1.38.0
                        command:
                          - sh
                          - -c
                          - |
                            until nc -z sure-pg 5432; do
                              echo "waiting for sure-pg:5432..."
                              sleep 2
                            done
                      - name: wait-for-redis
                        image: busybox:1.38.0
                        command:
                          - sh
                          - -c
                          - |
                            until nc -z sure-redis 6379; do
                              echo "waiting for sure-redis:6379..."
                              sleep 2
                            done
  values:
    image:
      repository: ghcr.io/nachtschatt3n/sure
      # Fork build (nachtschatt3n/sure) carrying the gated "Contracts" preview
      # feature. Pinned by commit SHA (multi-arch amd64+arm64) rather than a
      # chart-version tag. Built from branch `integration`.
      # This bump is the first upstream sync in a month and runs 7 new
      # migrations: add_last_used_at_to_categories,
      # add_family_name_index_to_tags_and_categories, add_import_all_history_to_wise_items,
      # add_personal_budgets, create_onchain_wallet_items_and_accounts,
      # add_reconciliation_to_entries, create_sso_identity_blocks.
      # Two of them need care:
      #   * add_family_name_index_to_tags_and_categories builds UNIQUE indexes
      #     with no de-dup step, so it fails outright on duplicate
      #     (family_id, name). Verified read-only pre-deploy: 0 duplicate rows
      #     in both `categories` (24 rows) and `tags` (0 rows).
      #   * add_reconciliation_to_entries is `disable_ddl_transaction!` +
      #     `algorithm: :concurrently` on `entries`, so a partial failure does
      #     NOT roll back and can leave an INVALID index behind.
      # add_personal_budgets is not purely additive — it drops
      # index_budgets_on_family_id_and_start_date_and_end_date and replaces it
      # with two partial unique indexes. Rollback is therefore
      # revert-the-manifest, NOT db:rollback: the schema stays migrated forward.
      # That is safe because all 6 existing budget rows get user_id IS NULL, so
      # index_budgets_shared_unique enforces exactly the dropped constraint.
      # Contracts feature preserved. Reuses the existing office GHCR pull secret.
      # Fixes AutoMerchantDetector's local-LLM path persisting leaked reasoning
      # text / placeholder strings as merchant names (no schema change).
      # Fixes Contract#next_due freezing at first-detection value forever
      # (recomputes from the most recent matching transaction; scan-time
      # refresh restored too). No schema change.
      #
      # --- 2026-09-04 bump: sha-e683bcb8 -> sha-7b22a02a -------------------
      # Stops AutoDetectMerchantsJob re-submitting unchanged transactions to
      # the LLM on every rule run. 4 files, all under app/ and test/.
      # NO MIGRATION: the migration Job runs but has nothing to do.
      #
      # Two behaviour changes an operator needs to know about:
      #   * The detection gate drops the business_url requirement (name only).
      #     The URL was acting as an unintended quality filter, so the first
      #     sync run after this assigns AI merchants that were previously
      #     discarded — created with website_url/logo_url nil, and locked.
      #   * Enrichable gains record_enrichment_attempt /
      #     without_recent_enrichment_attempt, so a transaction the detector
      #     examined without changing is marked and suppressed for
      #     AI_ENRICHMENT_ATTEMPT_TTL_DAYS (default 30). Set that env to 0 to
      #     disable suppression and restore the old retry-every-pass
      #     behaviour without a code change.
      #
      # ROLLBACK: revert this manifest to sha-e683bcb8981d78e91b59a462248e100c237a6612.
      # NOTE that after the first sync run the revert alone does NOT remove the
      # merchants this creates — that is Rules -> "Clear AI cache" in the UI,
      # which unlocks and deletes everything source:"ai" and leaves
      # user-modified merchants untouched. Residual: the ProviderMerchant rows
      # created alongside remain as orphans and need separate cleanup.
      #
      # PRE-DEPLOY BASELINE, measured live 2026-09-04 21:08 UTC, before the
      # roll. Re-measure after the 02:22 UTC (04:22 Berlin) sync_all_accounts
      # run and compare; the run applies every active rule via
      # app/models/family/syncer.rb, including the auto_detect_merchants rule
      # 42d35788-0cf8-4c37-bb28-b7ec87c1627e (active=true).
      #   transactions             14038
      #   merchants total            431   (expect higher)
      #   AI merchants (Family)       47   (expect ~366)
      #   DataEnrichment source=ai 15655
      #     of those merchant_id    5224
      #   detection candidates       319   (expect ~0)
      # Quality check that matters: the 47 pre-existing AI merchants have a max
      # name length of 30 chars and none over 40, so a new name >40 chars is a
      # good tripwire for leaked reasoning text rather than a real merchant.
      #
      # CO-INCIDENT VARIABLE, recorded so the two stay separable: the Ollama
      # host moved to engine 0.33.3 (from 0.32.15) the same evening, and
      # gemma4:26b-mlx was pulled to disk. At the time THIS image tag was
      # deployed Sure still talked to the GGUF gemma4:26b, unchanged. That
      # host also had two MLX GPU-OOM events at 20:40 and 21:13 UTC which
      # evicted models before the pinned state was restored; an LLM timeout
      # in sure-worker around then is a host event, not this deploy.
      #
      # Sure was moved to gemma4:26b-mlx in the fleet-wide migration that
      # followed (see OPENAI_MODEL below) — a SEPARATE change from this tag.
      tag: "sha-7b22a02aede4195149d70ca931e85d21235675b8"
      pullPolicy: IfNotPresent
      imagePullSecrets:
        - name: arag-web-ghcr-pull

    # ---------------- Rails config ----------------
    rails:
      env: production
      # Chart loads SECRET_KEY_BASE + ACTIVE_RECORD_ENCRYPTION_* directly from this Secret
      existingSecret: sure-secret
      encryptionEnv:
        enabled: true
      settings:
        SELF_HOSTED: "true"
        ONBOARDING_STATE: "open"
        AI_DEBUG_MODE: "false"
      # Explicit, minimal extra env. The DATABASE_URL/REDIS_URL helpers auto-resolve
      # to "" once CNPG + Redis subcharts are disabled, so we inject them ourselves
      # via extraEnvVars (below).
      extraEnv: {}
      extraEnvVars:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: sure-secret
              key: DATABASE_URL
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: sure-secret
              key: REDIS_URL
        - name: OIDC_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: sure-secret
              key: OIDC_CLIENT_ID
        - name: OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: sure-secret
              key: OIDC_CLIENT_SECRET
        - name: OIDC_ISSUER
          valueFrom:
            secretKeyRef:
              name: sure-secret
              key: OIDC_ISSUER
        # Built-in assistant → OpenAI-compatible Ollama on Mac Mini (docs/sops/ai-integration.md).
        # Keeps ASSISTANT_TYPE unset so family.assistant_type stays "builtin".
        - name: OPENAI_ACCESS_TOKEN
          valueFrom:
            secretKeyRef:
              name: sure-secret
              key: OPENAI_ACCESS_TOKEN
        - name: OPENAI_URI_BASE
          valueFrom:
            secretKeyRef:
              name: sure-secret
              key: OPENAI_URI_BASE
        # Plain value (model name is not sensitive). Switched back to the
        # larger gemma4:26b-mlx for the agentic assistant: gemma4:e2b-mlx was
        # too small/weak for reliable multi-turn tool-use, so we go back to
        # the smarter 26b model on the same Ollama.
        - name: OPENAI_MODEL
          value: "gemma4:26b-mlx"
        # Widen the OpenAI HTTP client timeout (upstream default 60s) so
        # slow local LLM inference (Ollama on Mac Mini) finishes before
        # Net::ReadTimeout. Bumped from 900 → 1800 to leave headroom for
        # larger merchant-detection models that produce reliable URLs
        # (gemma4:26b-mlx returns names but rarely URLs, so the auto-detector
        # silently skips). Read once per-request in Provider::Openai.
        - name: OPENAI_REQUEST_TIMEOUT
          value: "1800"
        # Consumed by zz_bank_refresh_overrides.rb (sure-overrides-initializer
        # ConfigMap): clamps AutoCategorizeJob / AutoDetectMerchantsJob batches
        # so a single LLM request fits inside OPENAI_REQUEST_TIMEOUT on Ollama.
        - name: AUTO_CATEGORIZE_BATCH_SIZE
          value: "5"
        - name: AUTO_DETECT_MERCHANTS_BATCH_SIZE
          value: "5"
        # Token budget for BatchSlicer. Precedence in Provider::Openai#context_window
        # is ENV > Setting > 2048, and both ENV and Setting were unset — so Sure
        # assumed 2048, computed max_input_tokens = 2048 - 512 - 256 = 1280, and
        # silently sliced the batch of 5 above back down to 1-4 transactions per
        # call. This only stops that shredding; AUTO_*_BATCH_SIZE stays the real
        # cap, so raising this further buys nothing. Safe against the model:
        # the host serves num_ctx 65536 (lowered from 131072 on 2026-09-05) and
        # Sure's longest observed prompt is ~4.2k tokens, leaving ~15x headroom —
        # no truncation risk. NOTE: unlike the GGUF, the MLX build has no baked
        # num_ctx — it inherits OLLAMA_CONTEXT_LENGTH from the Mac mini's Guardian
        # env, so that ceiling is a HOST setting and can move again. Sure is safe
        # across such a move because 16384 is a client-side cap well under it; do
        # not raise this value to track the host without re-checking that margin.
        - name: LLM_CONTEXT_WINDOW
          value: "16384"
        # Pin the JSON strategy instead of inheriting the "auto" default. Under
        # auto, 31.2% of enrichment calls were retried in "none" mode, and every
        # one of those retries was triggered by the model correctly returning
        # null (Sure's own prompt prefers null over a guess) — not one caught a
        # real failure. "strict" is a member of VALID_JSON_MODES and ENV outranks
        # Setting.openai_json_mode, so this also documents intent in git rather
        # than leaving it to the settings UI. The 400-fallback path is unchanged.
        - name: LLM_JSON_MODE
          value: "strict"
        # Insights/assistant response watchdog. SECONDS, not milliseconds —
        # 300 is five minutes; "300000" would be ~3.5 days and effectively
        # disables the watchdog. Load-bearing as of this image: the fork's
        # hardcoded 300000 client-side watchdog was deleted upstream and the
        # timeout is now driven server-side from this env var. If it is absent
        # the default is 90s, which is shorter than local Ollama inference
        # takes and resurfaces the "assistant did not reply" bug. Verify in the
        # RUNNING pod, not just the manifest:
        #   kubectl exec -n office deploy/sure-web -c web -- printenv AI_RESPONSE_TIMEOUT
        - name: AI_RESPONSE_TIMEOUT
          value: "300"
        # Vector store (Settings → AI health "hosted vector-store check failed"):
        # Ollama doesn't implement OpenAI's /v1/vector_stores API, so route
        # document/PDF search to pgvector instead — Sure's own Postgres image
        # is pgvector/pgvector:0.8.6-pg16 (extension available, enabled on
        # first use by VectorStore::Pgvector#ensure_schema!). Embeddings reuse
        # OPENAI_URI_BASE/OPENAI_ACCESS_TOKEN above (same Ollama host), so no
        # separate EMBEDDING_URI_BASE/EMBEDDING_ACCESS_TOKEN needed.
        - name: VECTOR_STORE_PROVIDER
          value: "pgvector"
        # nomic-embed-text is the only embedding-capable model pulled on the
        # Ollama host (confirmed via /api/tags) — mxbai-embed-large (Sure's
        # default) is not pulled. embedding_length 768 per Ollama, must match
        # EMBEDDING_DIMENSIONS (the vector_store_chunks column width).
        - name: EMBEDDING_MODEL
          value: "nomic-embed-text"
        - name: EMBEDDING_DIMENSIONS
          value: "768"
      externalAssistant:
        enabled: false

    # ---------------- Disable bundled DB / Redis (Path C) ----------------
    # We run our own Postgres (office/sure/postgres-helmrelease.yaml) and
    # Redis (redis-helmrelease.yaml) via bjw-s app-template. This keeps the
    # cluster free of CloudNativePG + OT-Redis-Operator just for one app.
    cnpg:
      enabled: false
      cluster:
        enabled: false
    cloudnative-pg:
      enabled: false
    redisOperator:
      enabled: false
      managed:
        enabled: false
    redisSimple:
      enabled: false

    # ---------------- Migrations ----------------
    migrations:
      strategy: job

    # ---------------- Web (Rails server) ----------------
    web:
      enabled: true
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 1536Mi
      # Mount PVC for Active Storage uploads (transaction attachments etc.)
      extraVolumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: sure-storage
        - name: rails-overrides
          configMap:
            name: sure-overrides-initializer
      extraVolumeMounts:
        - name: uploads
          mountPath: /rails/storage
        - name: rails-overrides
          mountPath: /rails/config/initializers/zz_bank_refresh_overrides.rb
          subPath: zz_bank_refresh_overrides.rb
          readOnly: true

    # ---------------- Worker (Sidekiq) ----------------
    worker:
      enabled: true
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          # Sidekiq leaks slowly (~5-10 MiB/day). With 1 GiB limit the
          # pod was OOMKilled after 9d of uptime (2026-05-09 06:52 UTC,
          # working set hit 819 MiB then crossed limit during a job
          # spike). Bumping to 1.5 GiB pushes the next OOM to ~3 weeks
          # of uptime — acceptable cadence for a leak we don't own.
          memory: 1536Mi
      extraVolumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: sure-storage
        - name: rails-overrides
          configMap:
            name: sure-overrides-initializer
      extraVolumeMounts:
        - name: uploads
          mountPath: /rails/storage
        - name: rails-overrides
          mountPath: /rails/config/initializers/zz_bank_refresh_overrides.rb
          subPath: zz_bank_refresh_overrides.rb
          readOnly: true
      # Co-schedule worker onto the same node as web so both can mount the RWO
      # sure-storage Longhorn PVC. Without this, rollouts deadlock on Multi-Attach.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: sure
                  app.kubernetes.io/instance: sure
                  app.kubernetes.io/component: web
              topologyKey: kubernetes.io/hostname

    # ---------------- Ingress (internal, Homepage-registered) ----------------
    ingress:
      enabled: true
      className: internal
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: "Sure"
        gethomepage.dev/group: "Office"
        # simpleicons 404s on "maybefinance"; dashboard-icons has no entry.
        # Use the Sure project's own favicon from its GitHub repo.
        gethomepage.dev/icon: "https://raw.githubusercontent.com/we-promise/sure/main/public/favicon.ico"
        gethomepage.dev/description: "Personal finance — accounts, budgets, investments"
      hosts:
        - host: sure.${SECRET_DOMAIN}
          paths:
            - path: /
              pathType: Prefix
      tls:
        - hosts:
            - sure.${SECRET_DOMAIN}
