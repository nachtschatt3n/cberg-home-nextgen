---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.networking.k8s.io/httproute_v1.json
# Envoy Gateway migration phase 2 (2026-09-07) — conversion shape B.
#
# The Sure chart (sure-0.7.4) has no Gateway API support and no `route:` values
# key, so this is a standalone manifest rather than a HelmRelease values block.
# The chart's `ingress.enabled` is flipped to false in the same commit; the two
# must never coexist, because k8s-gateway watches Ingress AND HTTPRoute and the
# host would end up with two records (.100 and .103) resolving at random.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sure
  labels:
    # Homepage discovery. Previously bolted onto the rendered Ingress by a
    # postRenderers kustomize patch, which is removed in this commit -- a patch
    # target that matches nothing fails the entire post-render.
    gethomepage.dev/enabled: "true"
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Sure"
    gethomepage.dev/group: "Office"
    gethomepage.dev/icon: "https://raw.githubusercontent.com/we-promise/sure/main/public/favicon.ico"
    gethomepage.dev/description: "Personal finance — accounts, budgets, investments"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-internal
      namespace: network
      # https only. The http listener is owned cluster-wide by
      # httproute-https-redirect, which 301s every host.
      sectionName: https
  hostnames:
    - "sure.${SECRET_DOMAIN}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        # The `sure` Service, port 80 (targetPort `http`). backendRef.port must
        # be the numeric Service port -- the Gateway API has no named-port form,
        # unlike the Ingress backend this replaces.
        - group: ""
          kind: Service
          name: sure
          port: 80
