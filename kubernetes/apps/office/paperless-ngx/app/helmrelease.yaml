---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless-ngx
  namespace: office
spec:
  interval: 30m
  chart:
    spec:
      chart: paperless-ngx
      version: 0.24.1
      sourceRef:
        kind: HelmRepository
        name: gabe565
        namespace: flux-system
  maxHistory: 1
  install:
    remediation:
      retries: 1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 1
  uninstall:
    keepHistory: false
  values:
    global:
      security:
        allowInsecureImages: true
    image:
      repository: ghcr.io/paperless-ngx/paperless-ngx
      tag: "3.0.5"
      pullPolicy: IfNotPresent
    env:
      TZ: UTC
      # Corpus is entirely German — default eng OCR garbles text and breaks
      # auto-classification. deu tesseract data is bundled in the image; keep
      # eng as fallback for the occasional English doc.
      PAPERLESS_OCR_LANGUAGE: "deu+eng"
      # Some German ARAG PDFs ship a broken embedded text layer (subsetted
      # fonts → dingbat/control-char extraction). `redo` preserves that broken
      # layer; `force` rasterizes the page and OCRs the image, yielding clean
      # text. Trade-off: `force` re-OCRs every page (slower, larger output) but
      # is correct for these documents.
      PAPERLESS_OCR_MODE: "force"
      # ES-580W duplex scans arrive mis-oriented; ocrmypdf's auto-rotate
      # confidence sat right at the default threshold (12) — e.g. 11.52 left a
      # page upside-down (garbled OCR) while 12.41 rotated. Lower to 7 so
      # near-threshold pages get straightened. (ROTATE_PAGES defaults to true.)
      PAPERLESS_OCR_ROTATE_PAGES_THRESHOLD: 7
      # Reduce logging conflicts
      PAPERLESS_LOGROTATE_MAX_SIZE: "1048576"
      PAPERLESS_LOGROTATE_MAX_BACKUPS: "2"
      # Celery logging configuration
      CELERY_WORKER_HIJACK_ROOT_LOGGER: "false"
      CELERY_WORKER_LOG_FORMAT: "[%(levelname)s] %(message)s"
      PAPERLESS_SECRET_KEY:
        valueFrom:
          secretKeyRef:
            name: paperless-ngx-secret
            key: PAPERLESS_KEY
      PAPERLESS_URL: "https://paperless.${SECRET_DOMAIN}"
      PAPERLESS_CONSUMER_DELETE_DUPLICATES: true
      PAPERLESS_CONSUMER_RECURSIVE: true
      PAPERLESS_CONSUMER_SUBDIRS_AS_TAGS: true
      # Renamed in v3 (was PAPERLESS_CONSUMER_POLLING). MUST stay > 0: /consume is a
      # CIFS mount written by the validator pod, and native fs events never fire for
      # a remote SMB write — interval 0 would silently stop all scanner ingestion.
      PAPERLESS_CONSUMER_POLLING_INTERVAL: 10
      # v3 decoupled archive generation from OCR mode; v2 default always created an
      # archive. Set explicitly to preserve that behaviour (migration guide).
      PAPERLESS_ARCHIVE_FILE_GENERATION: "always"
      # ZXING is the only barcode backend as of v3 (pyzbar removed upstream) —
      # PAPERLESS_CONSUMER_BARCODE_SCANNER no longer exists. PATCHT splitting is
      # unchanged. See docs/sops/paperless.md.
      PAPERLESS_CONSUMER_ENABLE_BARCODES: true
      # Organize stored media by year/correspondent. REMOVE_NONE drops the path
      # segment when a field is unset (paperless-ai assigns the correspondent
      # only after ingest, so fresh docs are briefly None — without this they'd
      # be filed under a literal "none/" folder).
      PAPERLESS_FILENAME_FORMAT: "{created_year}/{correspondent}/{title}"
      PAPERLESS_FILENAME_FORMAT_REMOVE_NONE: true
      PAPERLESS_EMAIL_HOST: smtp.gmail.com
      PAPERLESS_EMAIL_PORT: 587
      PAPERLESS_EMAIL_USE_TLS: true
      PAPERLESS_EMAIL_USERNAME:
        valueFrom:
          secretKeyRef:
            name: paperless-ngx-secret
            key: PAPERLESS_EMAIL_USERNAME
      PAPERLESS_EMAIL_PASSWORD:
        valueFrom:
          secretKeyRef:
            name: paperless-ngx-secret
            key: PAPERLESS_EMAIL_PASSWORD
      # With redis.enabled: false the chart no longer templates these two
      # (chart 0.24.1 templates/common.yaml emits them only inside
      # `if .Values.redis.enabled`), so they must be declared explicitly.
      # $(A_REDIS_PASSWORD) is container-runtime env interpolation — keep it.
      A_REDIS_PASSWORD:
        valueFrom:
          secretKeyRef:
            name: paperless-ngx-secret
            key: redis-password
      PAPERLESS_REDIS: "redis://:$(A_REDIS_PASSWORD)@paperless-redis:6379"
      # With mariadb.enabled: false the chart no longer templates the five DB
      # variables (chart 0.24.1 templates/common.yaml emits them only inside
      # `if .Values.mariadb.enabled`), so they must be declared explicitly.
      # PAPERLESS_DBENGINE being explicit is also what paperless-ngx v3 wants:
      # the engine is no longer inferred from the presence of PAPERLESS_DBHOST.
      PAPERLESS_DBENGINE: mariadb
      PAPERLESS_DBHOST: paperless-db
      PAPERLESS_DBPORT: 3306
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS:
        valueFrom:
          secretKeyRef:
            name: paperless-ngx-secret
            key: mariadb-password
    service:
      # -- Configures service settings for the chart.
      # @default -- See [values.yaml](./values.yaml)
      main:
        ports:
          http:
            port: 8000
    ingress:
      main:
        enabled: true
        ingressClassName: "external"
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "Paperless-ngx"
          gethomepage.dev/description: "Document management system"
          gethomepage.dev/group: "Office"
          gethomepage.dev/icon: "paperless.png"
          nginx.ingress.kubernetes.io/proxy-body-size: 64m
          external-dns.alpha.kubernetes.io/target: "external.${SECRET_DOMAIN}"
        labels:
          gethomepage.dev/enabled: "true"
        hosts:
          - host: &host "paperless.${SECRET_DOMAIN}"
            paths:
              - path: /
                pathType: Prefix
        tls:
          - hosts:
              - *host
    persistence:
      data:
        enabled: true
        existingClaim: paperless-data
      log:
        enabled: true
        type: emptyDir
        # Switched from CIFS to emptyDir to avoid concurrent log file locking issues
        # CIFS doesn't handle multiple Celery workers writing to same log files well
      media:
        enabled: true
        mountPath: /usr/src/paperless/media
        existingClaim: paperless-ngx-media
      export:
        enabled: true
        mountPath: /usr/src/paperless/export
        existingClaim: paperless-ngx-export
      consume:
        enabled: true
        mountPath: /usr/src/paperless/consume
        existingClaim: paperless-ngx-consume
      prompts:
        enabled: true
        type: emptyDir
        mountPath: /app/prompts
      hocr:
        enabled: true
        type: emptyDir
        mountPath: /app/hocr
      pdf:
        enabled: true
        type: emptyDir
        mountPath: /app/pdf
      gptdb:
        enabled: true
        type: emptyDir
        mountPath: /app/db
    postgresql:
      enabled: false
    # Bundled Bitnami mariadb retired 2026-08-19: bitnamilegacy is an ARCHIVED
    # registry (last push 2025-08-28, no future security fixes) and
    # docker.io/bitnami/mariadb publishes no semver tags (digest-only).
    # Security driver tracked as F-cb42f390. Paperless now uses the official
    # mariadb image deployed by db-deployment.yaml in this folder.
    # Server charset is PINNED to utf8mb3/utf8mb3_general_ci there to match the
    # retired server — utf8mb4 is a separate migration.
    # The retired volume paperless-mariadb is kept (Retain) as the rollback path.
    mariadb:
      enabled: false
    # Bundled Bitnami redis retired 2026-08-18: bitnamilegacy is an ARCHIVED
    # registry (last push 2025-08-28, no future security fixes) and
    # docker.io/bitnami/redis publishes no semver tags. Security driver
    # tracked as F-d62ac46a. Paperless now uses the official redis image
    # deployed by redis-deployment.yaml in this folder.
    redis:
      enabled: false
    resources:
      requests:
        cpu: 1000m
        memory: 2Gi
      # 3Gi OOM-killed paperless when OCR_MODE=force re-OCRs a multi-page doc:
      # ocrmypdf rasterizes+OCRs all pages concurrently (e.g. "processing 12
      # pages concurrently"), spiking memory. force mode makes this the norm for
      # any multi-page PDF, so the limit must accommodate it.
      limits:
        memory: 6Gi
    securityContext:
      #runAsUser: 1000
      #runAsGroup: 1000
      #fsGroup: 1000

    podSecurityContext:
      #runAsUser: 1000
      #runAsGroup: 1000
      #fsGroup: 1000

    # If you have a containers section:
    containers:
      paperless:
        securityContext:
          #runAsUser: 1000
          #runAsGroup: 1000
          #fsGroup: 1000

    # initContainers wait for stateful deps to be reachable on cold-start /
    # node-reboot. Without these the paperless pod starts before mariadb /
    # redis, hits a connect error, enters CrashLoopBackOff, and recovery
    # takes 5+ minutes (kubelet exponential backoff) instead of seconds.
    # See docs/sops/container-dependencies.md.
    initContainers:
      wait-for-mariadb:
        image: busybox:1.38.0
        command:
          - sh
          - -c
          - |
            until nc -z paperless-db 3306; do
              echo "waiting for paperless-db:3306..."
              sleep 2
            done
      wait-for-redis:
        image: busybox:1.38.0
        command:
          - sh
          - -c
          - |
            until nc -z paperless-redis 6379; do
              echo "waiting for paperless-redis:6379..."
              sleep 2
            done

    # additionalContainers:
    #   - name: sidecar
    #     image: nginx:alpine
