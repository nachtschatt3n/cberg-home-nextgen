---
# Official redis image replacing the chart-bundled bitnamilegacy redis
# (archived registry, frozen at redis 8.0.3 — see F-d62ac46a and the
# retirement comment in helmrelease.yaml). Plain Deployment + Service on
# purpose (not app-template): keeps this datastore out of the
# app-template-5.0 migration blast radius, same as superset-redis-official.
#
# Deliberately NO PVC: this is paperless' Celery broker/result backend and
# channels layer only — nothing durable. The queue is drained before any
# cutover; persisting it would only create a stale-state hazard. The old
# longhorn-static PV `paperless-redis` is kept (Retain) purely as the
# rollback path for the bundled chart redis.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless-redis
  namespace: office
  labels:
    app: paperless-redis
spec:
  replicas: 1
  # No RWO volume here, but Recreate keeps rollouts deterministic for a
  # single-replica stateful-ish service and avoids two brokers answering
  # the same Service during an image bump.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: paperless-redis
  template:
    metadata:
      labels:
        app: paperless-redis
    spec:
      containers:
      - name: redis
        image: redis:8.10.1-alpine
        imagePullPolicy: IfNotPresent
        command:
        - redis-server
        - --save
        - ""
        - --appendonly
        - "no"
        - --requirepass
        - $(REDIS_PASSWORD)
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: paperless-ngx-secret
              key: redis-password
        # redis-cli reads REDISCLI_AUTH from the environment — keeps the
        # password out of the probe command line (visible via /proc argv).
        - name: REDISCLI_AUTH
          valueFrom:
            secretKeyRef:
              name: paperless-ngx-secret
              key: redis-password
        ports:
        - containerPort: 6379
          name: redis
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - redis-cli ping | grep -q PONG
          initialDelaySeconds: 5
          timeoutSeconds: 2
          periodSeconds: 10
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - redis-cli ping | grep -q PONG
          initialDelaySeconds: 15
          timeoutSeconds: 2
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: paperless-redis
  namespace: office
  labels:
    app: paperless-redis
spec:
  type: ClusterIP
  ports:
  - port: 6379
    targetPort: 6379
    protocol: TCP
    name: redis
  selector:
    app: paperless-redis
