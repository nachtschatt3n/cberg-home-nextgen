---
# Standalone Valkey (cache only) for Penpot — re-platformed off the deprecated
# Bitnami chart onto the official `valkey/valkey` image via bjw-s app-template.
# Cache only: no persistence, no auth (penpot uses redis://penpot-cache:6379/0).
#
# Service is `penpot-cache` (verified live 2026-11-19; there is no `-primary` object). The
# app-template service identifier `primary` is the only service and takes the release name.
# Penpot's HelmRelease config.redis.host and its wait-for-redis init container point at
# penpot-cache:6379: keep that name stable.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: penpot-cache
  namespace: office
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      penpot-cache:
        containers:
          app:
            image:
              repository: valkey/valkey
              tag: "9.1.3"
            # Cache only — no persistence (RDB + AOF off).
            command:
              - valkey-server
              - --save
              - ""
              - --appendonly
              - "no"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["valkey-cli", "ping"]
                  initialDelaySeconds: 10
                  periodSeconds: 20
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["valkey-cli", "ping"]
                  initialDelaySeconds: 5
                  periodSeconds: 10
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                memory: 256Mi
    service:
      primary:
        controller: penpot-cache
        ports:
          redis:
            port: 6379
