---
# TEMPORARY throwaway Mealie pinned to an older build, to compare browser
# rendering against prod. Fully isolated: SQLite on emptyDir, no prod DB/PVC,
# no OIDC, no secrets. Remove by reverting the commit that added it.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mealie-test
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  maxHistory: 1
  timeout: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      main:
        strategy: Recreate
        containers:
          main:
            image:
              repository: ghcr.io/mealie-recipes/mealie
              tag: v3.30.0
            env:
              TZ: ${TIMEZONE}
              BASE_URL: https://mealie-test.${SECRET_DOMAIN}
              ALLOW_SIGNUP: "false"
              DB_ENGINE: sqlite
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet: { path: /api/app/about, port: &port 9000 }
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet: { path: /api/app/about, port: *port }
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet: { path: /api/app/about, port: *port }
                  initialDelaySeconds: 15
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 60
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                cpu: 1000m
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop: ["ALL"]
        pod:
          securityContext:
            runAsUser: 911
            runAsGroup: 911
            runAsNonRoot: true
            fsGroup: 911
            fsGroupChangePolicy: OnRootMismatch
    service:
      main:
        controller: main
        type: ClusterIP
        ports:
          http:
            port: *port
    persistence:
      data:
        type: emptyDir
        advancedMounts:
          main:
            main:
              - path: /app/data
      tmp:
        type: emptyDir
        advancedMounts:
          main:
            main:
              - path: /tmp
