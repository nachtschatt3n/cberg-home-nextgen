---
# Polyfills Array.prototype.toSorted/toReversed/toSpliced/with for Chrome <110
# (Samsung Family Hub fridge = Chrome 108). Mealie's Vuetify code calls toSorted
# unguarded, so every page is otherwise blank. Injected as the first thing in
# <head> of text/html responses; module scripts execute later so it runs first.
# Scoped to THIS HTTPRoute only (targetRefs below). No CSP is set by Mealie.
# Upstream is asked for identity encoding on html navigations so the body is
# plain text; content-length is rewritten after injection.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: mealie-test-array-polyfill
  namespace: office
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: mealie-test
  lua:
    - type: Inline
      inline: |
        local MARK = "data-cb-polyfill"
        local POLY = [==[<script data-cb-polyfill>(function(){var P=Array.prototype;function d(n,f){if(!P[n])Object.defineProperty(P,n,{value:f,writable:true,configurable:true,enumerable:false})}d("toSorted",function(c){if(c!==undefined&&typeof c!=="function")throw new TypeError("The comparison function must be either a function or undefined");return Array.from(this).sort(c)});d("toReversed",function(){return Array.from(this).reverse()});d("toSpliced",function(){var a=Array.from(this);a.splice.apply(a,arguments);return a});d("with",function(i,v){var l=this.length>>>0,r=Math.trunc(i)||0,x=r<0?l+r:r;if(x<0||x>=l)throw new RangeError("Invalid index");var a=Array.from(this);a[x]=v;return a})})()</script>]==]

        function envoy_on_request(handle)
          local accept = handle:headers():get("accept")
          if accept and string.find(accept, "text/html", 1, true) then
            local h = handle:headers()
            h:remove("accept-encoding")
            h:remove("if-none-match")
            h:remove("if-modified-since")
          end
        end

        function envoy_on_response(handle)
          local h = handle:headers()
          local ct = h:get("content-type")
          if not ct or not string.find(ct, "text/html", 1, true) then
            return
          end
          if h:get("content-encoding") then
            return
          end
          local buf = handle:body()
          if not buf then
            return
          end
          local html = buf:getBytes(0, buf:length())
          if string.find(html, MARK, 1, true) then
            return
          end
          local s, e = string.find(html, "<head>", 1, true)
          if not s then
            return
          end
          local out = string.sub(html, 1, e) .. POLY .. string.sub(html, e + 1)
          buf:setBytes(out)
          h:replace("content-length", tostring(#out))
        end
