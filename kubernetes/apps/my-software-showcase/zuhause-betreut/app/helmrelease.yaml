---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
# HelmRelease for zuhause-betreut-caretakermanager (bjw-s/app-template v3.7.3)
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app zuhause-betreut
  namespace: my-software-showcase
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      zuhause-betreut:
        replicas: 1
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/nachtschatt3n/zuhause-betreut-caretakermanager
              tag: production-20260818060155
              pullPolicy: IfNotPresent
            env:
              - name: TZ
                value: "Europe/Berlin"
              # live_production, NOT production: this app ships no
              # config/environments/production.rb (only development / staging /
              # live_production), and its Dockerfile sets RAILS_ENV=live_production.
              # Overriding it to "production" makes Rails abort at boot.
              - name: RAILS_ENV
                value: "live_production"
              - name: RACK_ENV
                value: "live_production"
              - name: PORT
                value: "3000"
              - name: RAILS_LOG_TO_STDOUT
                value: "1"
              - name: RAILS_SERVE_STATIC_FILES
                value: "1"
            envFrom:
              - secretRef:
                  name: zuhause-betreut-secrets
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/liveness
                    port: 3000
                    httpHeaders:
                      - name: X-Forwarded-Proto
                        value: https
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/readiness
                    port: 3000
                    httpHeaders:
                      - name: X-Forwarded-Proto
                        value: https
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/startup
                    port: 3000
                    httpHeaders:
                      - name: X-Forwarded-Proto
                        value: https
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 30
    defaultPodOptions:
      imagePullSecrets:
        - name: ghcr-secret
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        fsGroupChangePolicy: "OnRootMismatch"
    service:
      main:
        controller: zuhause-betreut
        ports:
          http:
            port: 3000
    ingress:
      main:
        enabled: true
        className: internal
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "Zuhause Betreut"
          gethomepage.dev/description: "Caretaker Management System"
          gethomepage.dev/group: "Software Portfolio"
          gethomepage.dev/icon: "mdi-home-heart"
        labels:
          gethomepage.dev/enabled: "true"
        hosts:
          - host: &host "zuhause-betreut.${SECRET_DOMAIN}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: main
                  port: http
        tls:
          - hosts:
              - *host
    persistence:
      uploads:
        enabled: true
        type: persistentVolumeClaim
        # longhorn-static: PVC name, volumeName, PV name and the Longhorn
        # Volume CR must all be the same speaking identifier (zuhause-betreut-uploads).
        # The Volume CR is applied manually by the operator, not by Flux.
        storageClass: longhorn-static
        volumeName: zuhause-betreut-uploads
        suffix: uploads
        accessMode: ReadWriteOnce
        size: 5Gi
        globalMounts:
          - path: /app/public/uploads
      tmp:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /app/tmp
      log:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /app/log
