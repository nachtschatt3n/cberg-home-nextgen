---
# NOT listed in app/kustomization.yaml on purpose.
# Flux's `targetNamespace: my-software-showcase` would override `namespace: storage`
# below and create a duplicate Volume in the app namespace that Longhorn does not
# manage. Apply this ONCE by hand before the first reconcile:
#   mise exec -- kubectl apply -f kubernetes/apps/my-software-showcase/globalmobility/app/longhorn-volume-globalmobility-fileadmin.yaml
# See docs/sops/new-deployment-blueprint.md (Storage blueprint).
apiVersion: longhorn.io/v1beta2
kind: Volume
metadata:
  name: globalmobility-fileadmin
  namespace: storage
spec:
  size: "10737418240"  # 10Gi in bytes
  numberOfReplicas: 2
  dataEngine: v1
  accessMode: rwo
  frontend: blockdev
  migratable: false
  encrypted: false
