---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
# HelmRelease for Globalmobility globalDISPO (TYPO3 4.2) — bjw-s/app-template v3.7.3
# Converted from a hand-rolled Deployment + ConfigMap + plaintext Secret +
# ServiceAccount + local-path PVCs.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app globalmobility
  namespace: my-software-showcase
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      globalmobility:
        # replicas: 1, not 2. The previous manifest asked for 2 replicas while
        # mounting ReadWriteOnce volumes -- the second pod could never attach.
        replicas: 1
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/nachtschatt3n/globalmobility-group-gmbh-globaldispo
              tag: master-ae96ef4
              pullPolicy: IfNotPresent
            env:
              # Showcase deployment opts in: the sign-in form arrives with the
              # shared demo credential already filled so a visitor only presses
              # submit. Default in the app is OFF; only this deployment enables it.
              - name: SHOWCASE_DEMO_PREFILL
                value: "1"
              - name: TZ
                value: "Europe/Berlin"
            envFrom:
              - secretRef:
                  name: globalmobility-secrets
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 512Mi
            # Port 80, NOT 9000. The previous manifest exposed containerPort 9000
            # and probed it over HTTP, but this image is php:5.6-apache (Apache +
            # mod_php, EXPOSE 80) -- 9000 is the FastCGI port of an FPM setup this
            # image does not use, so an HTTP GET there could never succeed.
            # /health.php exists at the docroot and returns a real 503 when the DB
            # is down, the typo3_src symlink is broken, typo3temp is unwritable, or
            # the Install Tool is enabled.
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health.php
                    port: 80
                  initialDelaySeconds: 60
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health.php
                    port: 80
                  initialDelaySeconds: 20
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health.php
                    port: 80
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 30
    defaultPodOptions:
      imagePullSecrets:
        - name: ghcr-secret
      # No runAsNonRoot/runAsUser: this image has no USER directive and Apache
      # starts as root to bind :80 (privileged) before dropping to www-data.
      # The namespace runs Pod Security Admission "baseline", which permits this.
      securityContext:
        # www-data is uid/gid 33 on the Debian base; the image chowns
        # /app/typo3temp /app/uploads /app/fileadmin to www-data:www-data.
        fsGroup: 33
        fsGroupChangePolicy: "OnRootMismatch"
    service:
      main:
        controller: globalmobility
        ports:
          http:
            port: 80
    # Envoy Gateway migration phase 2 (2026-09-07): Ingress -> HTTPRoute.
    # Both halves in ONE commit -- k8s-gateway watches Ingress AND HTTPRoute,
    # so leaving the Ingress alongside the route gives this host two records
    # (.100 and .103) and it resolves non-deterministically.
    route:
      main:
        kind: HTTPRoute
        hostnames:
          - "globalmobility.${SECRET_DOMAIN}"
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: Gateway
            name: envoy-internal
            namespace: network
            # https only. The http listener is owned cluster-wide by
            # httproute-https-redirect, which 301s every host.
            sectionName: https
        labels:
          gethomepage.dev/enabled: "true"
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "globalDISPO"
          gethomepage.dev/description: "Globalmobility dispatch system"
          gethomepage.dev/group: "Software Portfolio"
          gethomepage.dev/icon: "typo3.png"
        # Rule written out explicitly rather than relying on the chart default:
        # the "rules may be omitted" shortcut only holds while exactly one
        # Service is enabled, and _validate.tpl hard-fails the moment a second
        # one appears.
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: main
                port: http
    persistence:
      # storageClass was `local-path`, which does not exist in this cluster --
      # both PVCs would have stayed Pending forever. Now longhorn-static with
      # speaking names; the Longhorn Volume CRs are applied manually by the
      # operator (see longhorn-volume-*.yaml, deliberately not in kustomization).
      fileadmin:
        enabled: true
        type: persistentVolumeClaim
        storageClass: longhorn-static
        volumeName: globalmobility-fileadmin
        suffix: fileadmin
        accessMode: ReadWriteOnce
        size: 10Gi
        globalMounts:
          - path: /app/fileadmin
      uploads:
        enabled: true
        type: persistentVolumeClaim
        storageClass: longhorn-static
        volumeName: globalmobility-uploads
        suffix: uploads
        accessMode: ReadWriteOnce
        size: 5Gi
        globalMounts:
          - path: /app/uploads
      typo3temp:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /app/typo3temp
