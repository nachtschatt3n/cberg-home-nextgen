apiVersion: image.fluxcd.io/v1beta1
kind: ImageRepository
metadata:
  name: max-jung
  namespace: my-software-showcase
  labels:
    app: max-jung
spec:
  image: ghcr.io/nachtschatt3n/max-jung-transporte-fahrzeugcontrolling
  interval: 10m
  secretRef:
    name: ghcr-pull-secret  # Requires a secret with GHCR credentials
---
apiVersion: image.fluxcd.io/v1beta1
kind: ImagePolicy
metadata:
  name: max-jung
  namespace: my-software-showcase
  labels:
    app: max-jung
spec:
  imageRepositoryRef:
    name: max-jung
  policy:
    semver:
      range: '>=0.0.0'  # Accept any version matching production-* pattern
    alphabetical:
      order: desc  # Prefer lexicographically highest tag (production-YYYYMMDDHHMMSS is monotonic)
---
apiVersion: image.fluxcd.io/v1beta1
kind: ImageUpdateAutomation
metadata:
  name: max-jung
  namespace: my-software-showcase
  labels:
    app: max-jung
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: homelab  # Update this to your flux repo name
  git:
    commit:
      author:
        email: flux@my-software-showcase.local
        name: Flux Automation
      messageTemplate: 'Update max-jung image: {{range .Updated.Images}}{{println .}}{{end}}'
    push:
      branch: main
  update:
    strategy: Setters
    path: ./apps/max-jung  # Path to K8s manifests in your Flux repo
  sourceRef:
    kind: GitRepository
    name: homelab
