apiVersion: v1
kind: Secret
metadata:
  name: max-jung-secrets
  namespace: my-software-showcase
  labels:
    app: max-jung
type: Opaque
stringData:
  # Database configuration
  db-host: "mysql.default.svc.cluster.local"
  db-port: "3306"
  db-name: "showcase_max_jung_prod"
  db-user: "max_jung_user"
  # WARNING: This is a placeholder password. Replace with a secure password in production.
  # Use `openssl rand -base64 32` to generate a strong password.
  # After creation, encrypt this file with: sops -e -i k8s/secrets.yaml
  db-password: "CHANGE_ME_IN_PRODUCTION"

  # Rails secret key base
  # Generate with: bundle exec rails secret
  # After generation, encrypt this file with SOPS
  secret-key-base: "CHANGE_ME_IN_PRODUCTION"
