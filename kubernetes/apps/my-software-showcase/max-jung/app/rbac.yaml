apiVersion: v1
kind: ServiceAccount
metadata:
  name: max-jung
  namespace: my-software-showcase
  labels:
    app: max-jung
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: max-jung
  namespace: my-software-showcase
  labels:
    app: max-jung
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["max-jung-secrets"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get"]
  selector:
    matchLabels:
      app: max-jung
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: max-jung
  namespace: my-software-showcase
  labels:
    app: max-jung
subjects:
- kind: ServiceAccount
  name: max-jung
  namespace: my-software-showcase
roleRef:
  kind: Role
  name: max-jung
  apiGroup: rbac.authorization.k8s.io
