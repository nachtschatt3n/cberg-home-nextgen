---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
# HelmRelease for Max Jung Fahrzeugcontrolling (bjw-s/app-template v3.7.3)
# Replaces BOTH the hand-rolled Deployment and a HelmRelease that used the dead
# `helm.fluxcd.io/v1` API against the Bitnami "rails" chart.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app max-jung
  namespace: my-software-showcase
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      max-jung:
        replicas: 1
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/nachtschatt3n/max-jung-transporte-fahrzeugcontrolling
              tag: production-20260816191422
              pullPolicy: IfNotPresent
            env:
              - name: TZ
                value: "Europe/Berlin"
              - name: RAILS_ENV
                value: "production"
              - name: RACK_ENV
                value: "production"
              - name: PORT
                value: "3000"
              - name: RAILS_LOG_TO_STDOUT
                value: "1"
              - name: RAILS_SERVE_STATIC_FILES
                value: "1"
              - name: EXECJS_RUNTIME
                value: "Node"
            envFrom:
              - secretRef:
                  name: max-jung-secrets
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
            # config.force_ssl = true (config/environments/production.rb).
            # ActionDispatch::SSL is Rack middleware, so no controller-level skip
            # can exempt these paths -- without the header every probe gets a 301,
            # which Kubernetes scores as success (false green on a dead app).
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/liveness
                    port: 3000
                    httpHeaders:
                      - name: X-Forwarded-Proto
                        value: https
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/readiness
                    port: 3000
                    httpHeaders:
                      - name: X-Forwarded-Proto
                        value: https
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/startup
                    port: 3000
                    httpHeaders:
                      - name: X-Forwarded-Proto
                        value: https
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 30
    defaultPodOptions:
      imagePullSecrets:
        - name: ghcr-secret
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        fsGroupChangePolicy: "OnRootMismatch"
    service:
      main:
        controller: max-jung
        ports:
          http:
            port: 3000
    ingress:
      main:
        enabled: true
        className: internal
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "Max Jung Fahrzeugcontrolling"
          gethomepage.dev/description: "Vehicle fleet controlling"
          gethomepage.dev/group: "Software Portfolio"
          gethomepage.dev/icon: "mdi-truck-delivery"
        labels:
          gethomepage.dev/enabled: "true"
        hosts:
          - host: &host "max-jung.${SECRET_DOMAIN}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: main
                  port: http
        tls:
          - hosts:
              - *host
    persistence:
      csvimport:
        enabled: true
        type: persistentVolumeClaim
        # Mount path is /app/csvimport, NOT /app/public/uploads: this app's
        # CarrierWave uploader overrides store_dir to "#{Rails.root}/csvimport"
        # (app/uploaders/csv_import_uploader.rb).
        # longhorn-static: PVC name, volumeName, PV name and the Longhorn Volume CR
        # must all be the same speaking identifier (max-jung-csvimport).
        # The Volume CR is applied manually by the operator, not by Flux.
        storageClass: longhorn-static
        volumeName: max-jung-csvimport
        accessMode: ReadWriteOnce
        size: 5Gi
        globalMounts:
          - path: /app/csvimport
      tmp:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /app/tmp
      log:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /app/log
