apiVersion: apps/v1
kind: Deployment
metadata:
  name: max-jung
  namespace: my-software-showcase
  labels:
    app: max-jung
    component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: max-jung
      component: web
  template:
    metadata:
      labels:
        app: max-jung
        component: web
      annotations:
        prometheus.io/scrape: "false"
    spec:
      serviceAccountName: max-jung
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      containers:
      - name: web
        image: ghcr.io/nachtschatt3n/max-jung-transporte-fahrzeugcontrolling:latest
        imagePullPolicy: Always

        ports:
        - name: http
          containerPort: 3000
          protocol: TCP

        env:
        - name: RAILS_ENV
          value: "production"
        - name: RACK_ENV
          value: "production"
        - name: RAILS_LOG_TO_STDOUT
          value: "1"
        - name: RAILS_SERVE_STATIC_FILES
          value: "1"
        - name: EXECJS_RUNTIME
          value: "Node"

        # Database configuration from secrets
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: max-jung-secrets
              key: db-host
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: max-jung-secrets
              key: db-port
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: max-jung-secrets
              key: db-name
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: max-jung-secrets
              key: db-user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: max-jung-secrets
              key: db-password

        # Rails secret key base
        - name: SECRET_KEY_BASE
          valueFrom:
            secretKeyRef:
              name: max-jung-secrets
              key: secret-key-base

        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"

        # Liveness probe: indicates whether the process is alive
        livenessProbe:
          httpGet:
            path: /health/liveness
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        # Readiness probe: indicates whether the app is ready to accept traffic
        readinessProbe:
          httpGet:
            path: /health/readiness
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2

        # Startup probe: indicates whether the app has started up successfully
        startupProbe:
          httpGet:
            path: /health/startup
            port: http
          initialDelaySeconds: 0
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30  # 30 * 5s = 150s max startup time

        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL

        volumeMounts:
        - name: tmp
          mountPath: /app/tmp
        - name: log
          mountPath: /app/log

      volumes:
      - name: tmp
        emptyDir: {}
      - name: log
        emptyDir: {}

      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      restartPolicy: Always
