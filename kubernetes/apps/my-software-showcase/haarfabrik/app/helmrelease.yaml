---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
# HelmRelease for Haarfabrik Extranet (bjw-s/app-template v3.7.3)
# Converted from a hand-rolled Deployment + ConfigMap + RBAC + ServiceMonitor.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app haarfabrik
  namespace: my-software-showcase
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      haarfabrik:
        replicas: 1
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/nachtschatt3n/haarfabrik-extranet
              tag: production-20260818061936
              pullPolicy: IfNotPresent
            env:
              # Showcase deployment opts in: the sign-in form arrives with the
              # shared demo credential already filled so a visitor only presses
              # submit. Default in the app is OFF; only this deployment enables it.
              - name: SHOWCASE_DEMO_PREFILL
                value: "1"
              - name: TZ
                value: "Europe/Berlin"
              - name: RAILS_ENV
                value: "production"
              - name: RACK_ENV
                value: "production"
              - name: PORT
                value: "3000"
              - name: RAILS_LOG_TO_STDOUT
                value: "1"
              - name: RAILS_SERVE_STATIC_FILES
                value: "1"
              # This app pulls in therubyracer/execjs; the image ships node.
              - name: EXECJS_RUNTIME
                value: "Node"
            envFrom:
              - secretRef:
                  name: haarfabrik-secrets
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
            # config.force_ssl = true (config/environments/production.rb:37) and
            # the health controller is NOT exempt (ActionDispatch::SSL is Rack
            # middleware). Without the header every probe gets a 301, which
            # Kubernetes scores as success -- a false green on a dead app.
            # Probe paths use /health/liveness|readiness|startup, which
            # config/routes.rb defines alongside the older /health/live|ready.
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/liveness
                    port: 3000
                    httpHeaders:
                      - name: X-Forwarded-Proto
                        value: https
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/readiness
                    port: 3000
                    httpHeaders:
                      - name: X-Forwarded-Proto
                        value: https
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/startup
                    port: 3000
                    httpHeaders:
                      - name: X-Forwarded-Proto
                        value: https
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 30
    defaultPodOptions:
      imagePullSecrets:
        - name: ghcr-secret
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        fsGroupChangePolicy: "OnRootMismatch"
    service:
      main:
        controller: haarfabrik
        ports:
          http:
            port: 3000
    ingress:
      main:
        enabled: true
        className: internal
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "Haarfabrik Extranet"
          gethomepage.dev/description: "Salon extranet"
          gethomepage.dev/group: "Software Portfolio"
          gethomepage.dev/icon: "ruby-on-rails.png"
        labels:
          gethomepage.dev/enabled: "true"
        hosts:
          - host: &host "haarfabrik.${SECRET_DOMAIN}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: main
                  port: http
        tls:
          - hosts:
              - *host
    persistence:
      uploads:
        enabled: true
        type: persistentVolumeClaim
        # Paperclip with no :path override -> default is public/system,
        # so the mount is /app/public/system (has_attached_file :file).
        # longhorn-static: PVC name, volumeName, PV name and the Longhorn Volume CR
        # must all be the same speaking identifier (haarfabrik-uploads).
        # The Volume CR is applied manually by the operator, not by Flux.
        storageClass: longhorn-static
        volumeName: haarfabrik-uploads
        suffix: uploads
        accessMode: ReadWriteOnce
        size: 5Gi
        globalMounts:
          - path: /app/public/system
      tmp:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /app/tmp
      log:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /app/log
