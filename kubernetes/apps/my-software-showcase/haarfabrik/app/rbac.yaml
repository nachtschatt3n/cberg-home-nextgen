apiVersion: v1
kind: ServiceAccount
metadata:
  name: haarfabrik
  namespace: my-software-showcase
  labels:
    app: haarfabrik

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: haarfabrik
  namespace: my-software-showcase
  labels:
    app: haarfabrik
rules:
# Rails apps typically don't need cluster-level permissions
# Add rules here if your app needs to read K8s resources
# Example: reading ConfigMaps or Secrets
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: haarfabrik
  namespace: my-software-showcase
  labels:
    app: haarfabrik
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: haarfabrik
subjects:
- kind: ServiceAccount
  name: haarfabrik
  namespace: my-software-showcase
