apiVersion: apps/v1
kind: Deployment
metadata:
  name: haarfabrik
  namespace: my-software-showcase
  labels:
    app: haarfabrik
    version: v1
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: haarfabrik
  template:
    metadata:
      labels:
        app: haarfabrik
        version: v1
      annotations:
        prometheus.io/scrape: "false"
    spec:
      serviceAccountName: haarfabrik
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      containers:
      - name: haarfabrik
        image: ghcr.io/ibdigital/haarfabrik-extranet:latest
        imagePullPolicy: Always

        ports:
        - name: http
          containerPort: 3000
          protocol: TCP

        env:
        - name: RAILS_ENV
          value: "production"
        - name: RAILS_LOG_TO_STDOUT
          value: "1"
        - name: RACK_ENV
          value: "production"
        - name: RAILS_SERVE_STATIC_FILES
          value: "true"
        - name: EXECJS_RUNTIME
          value: "Node"
        - name: DB_ADAPTER
          value: "mysql2"
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: haarfabrik-config
              key: db.host
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: haarfabrik-config
              key: db.port
        - name: DB_DATABASE
          valueFrom:
            configMapKeyRef:
              name: haarfabrik-config
              key: db.database
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: haarfabrik-secrets
              key: db.username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: haarfabrik-secrets
              key: db.password
        - name: SECRET_KEY_BASE
          valueFrom:
            secretKeyRef:
              name: haarfabrik-secrets
              key: secret.key.base

        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        startupProbe:
          httpGet:
            path: /health/startup
            port: http
          failureThreshold: 30
          periodSeconds: 10
          timeoutSeconds: 5

        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"

        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
              - ALL

        volumeMounts:
        - name: tmp
          mountPath: /app/tmp
        - name: log
          mountPath: /app/log

      volumes:
      - name: tmp
        emptyDir: {}
      - name: log
        emptyDir: {}

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - haarfabrik
              topologyKey: kubernetes.io/hostname
