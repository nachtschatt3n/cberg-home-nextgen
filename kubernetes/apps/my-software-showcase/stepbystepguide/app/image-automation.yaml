---
# yaml-language-server: =https://json.schemastore.org/kustomization
# Image Automation for stepbystepguide
# Handles automatic image updates when new tags are pushed to GHCR
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: stepbystepguide
  namespace: my-software-showcase
spec:
  image: ghcr.io/ibdigital/stepbystepguide
  interval: 10m
  secretRef:
    name: ghcr-secret
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: stepbystepguide
  namespace: my-software-showcase
spec:
  imageRepositoryRef:
    name: stepbystepguide
  filterTags:
    pattern: '^production-(?P<ts>\d{14})$'
    extract: '$ts'
  policy:
    numerical:
      order: asc
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: stepbystepguide-image-updates
  namespace: my-software-showcase
spec:
  interval: 30m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        email: fluxcdbot@users.noreply.github.com
        name: fluxcdbot
      messageTemplate: |
        chore(stepbystepguide): update container images

        Automation name: {{ .AutomationObject }}

        Files updated:
        {{ range $filename, $_ := .Changed.FileChanges -}}
        - {{ $filename }}
        {{ end -}}

        Objects updated:
        {{ range $resource, $changes := .Changed.Objects -}}
        - {{ $resource.Kind }} {{ $resource.Name }}
        {{- range $_, $change := $changes }}
          {{ $change.OldValue }} -> {{ $change.NewValue }}
        {{ end -}}
        {{ end -}}
    push:
      branch: main
  update:
    strategy: Setters
    path: "./kubernetes/apps/my-software-showcase"
