---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: showcase-image-updates
  namespace: my-software-showcase
spec:
  # Cross-namespace sourceRef to the write-capable flux-system GitRepository:
  # my-software-showcase is on the allowlist of the
  # flux-imageupdateautomation-sourceref ValidatingAdmissionPolicy
  # (kubernetes/apps/flux-system/flux-guardrails). Setters strategy bounds the
  # write to the 15 `$imagepolicy`-marked tag lines under update.path.
  # NOTE: a SUSPENDED ImageUpdateAutomation still reports READY=True; check
  # `.spec.suspend` directly. To hold ONE app, remove its `$imagepolicy` marker.
  interval: 30m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        email: fluxcdbot@users.noreply.github.com
        name: fluxcdbot
      messageTemplate: |
        chore(showcase): update container images (weekly rebuild)

        Automation name: {{ .AutomationObject }}

        Files updated:
        {{ range $filename, $_ := .Changed.FileChanges -}}
        - {{ $filename }}
        {{ end -}}

        Objects updated:
        {{ range $resource, $changes := .Changed.Objects -}}
        - {{ $resource.Kind }} {{ $resource.Name }}
        {{- range $_, $change := $changes }}
          {{ $change.OldValue }} -> {{ $change.NewValue }}
        {{ end -}}
        {{ end -}}
    push:
      branch: main
  update:
    strategy: Setters
    path: "./kubernetes/apps/my-software-showcase"
