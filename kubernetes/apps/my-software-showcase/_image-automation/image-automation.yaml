---
# Flux image automation for the my-software-showcase portfolio (program item F,
# operator-approved 2026-09-27). Mode per image: docs/sops/self-built-image-rebuild.md
# section "Weekly rebuild + deploy mode".
#
# WHY AUTO HERE: all 15 apps are internal-only (envoy-internal), non-critical demo
# deployments, each with liveness/readiness/startup probes, `strategy: Recreate`
# and `upgrade.remediation.strategy: rollback`. A rolled image that fails its
# probes makes the Helm upgrade time out and roll back automatically (the
# auto-revert); the HelmRelease is then left not-Ready, which the sweep's Flux
# check reports.
#
# TAG SCHEMES (both emitted by the source repos' weekly Monday 05:00 UTC rebuild):
#   P  `production-<YYYYMMDDHHMMSS>` -- ci.yml on push to the default branch AND on
#      the weekly schedule (no-cache, fresh base) -- a rebuild is a NEW tag, never a
#      re-push, so the newest timestamp is the newest build.
#   S  `sha-<7hex>-b<YYYYMMDD>` -- scheduled-rebuild.yml only (the push CI keeps
#      publishing plain sha tags, which this pattern deliberately does NOT match,
#      so an ad-hoc push is never auto-deployed; only the weekly rebuild is).
# The ^...$ anchors are load-bearing: Flux matches filterTags unanchored (see
# the absenty ImagePolicy for the incident that taught this).
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: globalmobility
  namespace: my-software-showcase
spec:
  image: ghcr.io/nachtschatt3n/globalmobility-group-gmbh-globaldispo
  interval: 1h
  secretRef:
    name: ghcr-secret
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: globalmobility
  namespace: my-software-showcase
spec:
  imageRepositoryRef:
    name: globalmobility
  filterTags:
    pattern: '^sha-[0-9a-f]{7}-b(?P<ts>\d{8})$'
    extract: '$ts'
  policy:
    numerical:
      order: asc
