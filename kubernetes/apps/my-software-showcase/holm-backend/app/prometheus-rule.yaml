apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: holm
  namespace: my-software-showcase
spec:
  groups:
  - name: holm.rules
    interval: 30s
    rules:
    - alert: HolmPodRestartingTooOften
      expr: |
        rate(kube_pod_container_status_restarts_total{pod=~"holm-.*"}[15m]) > 0.1
      for: 5m
      labels:
        severity: warning
        app: holm
      annotations:
        summary: "Holm pod restarting too frequently"
        description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has restarted {{ $value | humanize }} times in the last 15 minutes"

    - alert: HolmPodNotReady
      expr: |
        kube_pod_status_ready{pod=~"holm-.*", condition="false"} == 1
      for: 5m
      labels:
        severity: critical
        app: holm
      annotations:
        summary: "Holm pod not ready"
        description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has not been ready for the last 5 minutes"

    - alert: HolmHighMemoryUsage
      expr: |
        (container_memory_usage_bytes{pod=~"holm-.*"} / container_spec_memory_limit_bytes{pod=~"holm-.*"}) > 0.9
      for: 5m
      labels:
        severity: warning
        app: holm
      annotations:
        summary: "Holm container memory usage is high"
        description: "Container {{ $labels.container }} in pod {{ $labels.pod }} is using {{ $value | humanizePercentage }} of its memory limit"

    - alert: HolmHighCPUUsage
      expr: |
        (rate(container_cpu_usage_seconds_total{pod=~"holm-.*"}[5m]) / container_spec_cpu_quota{pod=~"holm-.*"}) > 0.8
      for: 5m
      labels:
        severity: warning
        app: holm
      annotations:
        summary: "Holm container CPU usage is high"
        description: "Container {{ $labels.container }} in pod {{ $labels.pod }} is using {{ $value | humanizePercentage }} of its CPU limit"

    - alert: HolmReadinessProbeFailing
      expr: |
        kube_pod_container_status_ready{pod=~"holm-.*"} == 0
      for: 3m
      labels:
        severity: warning
        app: holm
      annotations:
        summary: "Holm readiness probe is failing"
        description: "Readiness probe for {{ $labels.pod }} in namespace {{ $labels.namespace }} has been failing for 3 minutes"

    - alert: HolmLivenessProbeFailing
      expr: |
        increase(kube_pod_container_status_terminated_reason{pod=~"holm-.*", reason="ContainerStatusUnknown"}[5m]) > 0
      for: 2m
      labels:
        severity: critical
        app: holm
      annotations:
        summary: "Holm liveness probe is failing"
        description: "Liveness probe for {{ $labels.pod }} in namespace {{ $labels.namespace }} has failed"
