apiVersion: apps/v1
kind: Deployment
metadata:
  name: holm
  namespace: my-software-showcase
  labels:
    app: holm
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: holm
  template:
    metadata:
      labels:
        app: holm
        version: v1
    spec:
      containers:
      - name: holm
        image: ghcr.io/ibdigital/my-software-showcase-holm:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        env:
        - name: RAILS_ENV
          value: "production"
        - name: RACK_ENV
          value: "production"
        - name: RAILS_LOG_TO_STDOUT
          value: "true"
        - name: RAILS_SERVE_STATIC_FILES
          value: "true"
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: holm-secrets
              key: db-host
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: holm-secrets
              key: db-port
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: holm-secrets
              key: db-name
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: holm-secrets
              key: db-user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: holm-secrets
              key: db-password
        - name: SECRET_KEY_BASE
          valueFrom:
            secretKeyRef:
              name: holm-secrets
              key: secret-key-base
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health/liveness
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/readiness
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health/startup
            port: 3000
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 30
        volumeMounts:
        - name: tmp
          mountPath: /app/tmp
        - name: log
          mountPath: /app/log
        - name: public
          mountPath: /app/public
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
      volumes:
      - name: tmp
        emptyDir: {}
      - name: log
        emptyDir: {}
      - name: public
        emptyDir: {}
      securityContext:
        fsGroup: 1000
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - holm
              topologyKey: kubernetes.io/hostname
