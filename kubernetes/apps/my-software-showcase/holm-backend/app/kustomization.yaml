apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: my-software-showcase

resources:
  - deployment.yaml
  - service.yaml
  - secrets.yaml
  - prometheus-rule.yaml

commonLabels:
  app: holm
  managed-by: flux

commonAnnotations:
  orchestrator: my-software-showcase

replicas:
  - name: holm
    count: 1

images:
  - name: ghcr.io/ibdigital/my-software-showcase-holm
    newTag: latest
