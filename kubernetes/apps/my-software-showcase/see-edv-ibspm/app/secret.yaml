apiVersion: v1
kind: Secret
metadata:
  name: see-edv-ibspm-secrets
  namespace: my-software-showcase
  labels:
    app: see-edv-ibspm
type: Opaque
stringData:
  # Database credentials
  # Replace with actual values from your production database
  db.username: "ibspm_prod_user"
  db.password: "REPLACE_WITH_SECURE_PASSWORD"

  # Rails secret key base (generate with: rails secret)
  # Minimum 30 characters, all random, no regular words
  secret.key.base: "REPLACE_WITH_RAILS_SECRET_KEY_BASE"

  # SMTP password for email delivery
  smtp.password: "REPLACE_WITH_SMTP_PASSWORD"

---
# NOTE: In production, this secret should be encrypted with SOPS:
#   sops -e k8s/secret.yaml > k8s/secret.sops.yaml
# Then use secret.sops.yaml in your Flux kustomization
# See: https://fluxcd.io/docs/guides/mozilla-sops/
