---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
# HelmRelease for See EDV IBSPM (bjw-s/app-template v3.7.3)
# Converted from a hand-rolled Deployment + ConfigMap + plaintext Secret.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app see-edv-ibspm
  namespace: my-software-showcase
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      see-edv-ibspm:
        replicas: 1
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/nachtschatt3n/see-edv-ibspm
              tag: production-20260818110306
              pullPolicy: IfNotPresent
            env:
              # Showcase deployment opts in: the sign-in form arrives with the
              # shared demo credential already filled so a visitor only presses
              # submit. Default in the app is OFF; only this deployment enables it.
              - name: SHOWCASE_DEMO_PREFILL
                value: "1"
              - name: TZ
                value: "Europe/Berlin"
              - name: RAILS_ENV
                value: "production"
              - name: RACK_ENV
                value: "production"
              - name: PORT
                value: "3000"
              - name: RAILS_LOG_TO_STDOUT
                value: "1"
              - name: RAILS_SERVE_STATIC_FILES
                value: "1"
            # No SMTP by design. The removed ConfigMap carried SMTP_ADDRESS /
            # SMTP_PORT / SMTP_USER_NAME pointing at a third-party mail host,
            # with a real mailbox address, in a public repo. This is a showcase
            # deployment with no outbound integrations, so mail stays off: the
            # app disables delivery when SMTP_* is unset rather than falling
            # back to the real relay. Do not reinstate these.
            envFrom:
              - secretRef:
                  name: see-edv-ibspm-secrets
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/liveness
                    port: 3000
                    httpHeaders:
                      - name: X-Forwarded-Proto
                        value: https
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/readiness
                    port: 3000
                    httpHeaders:
                      - name: X-Forwarded-Proto
                        value: https
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/startup
                    port: 3000
                    httpHeaders:
                      - name: X-Forwarded-Proto
                        value: https
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 30
    defaultPodOptions:
      imagePullSecrets:
        - name: ghcr-secret
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        fsGroupChangePolicy: "OnRootMismatch"
    service:
      main:
        controller: see-edv-ibspm
        ports:
          http:
            port: 3000
    ingress:
      main:
        enabled: true
        className: internal
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "See EDV IBSPM"
          gethomepage.dev/description: "IBSPM service management"
          gethomepage.dev/group: "Software Portfolio"
          gethomepage.dev/icon: "ruby-on-rails.png"
        labels:
          gethomepage.dev/enabled: "true"
        hosts:
          - host: &host "see-edv-ibspm.${SECRET_DOMAIN}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: main
                  port: http
        tls:
          - hosts:
              - *host
    persistence:
      # No PVC: no file-upload gem in the app's Gemfile.
      tmp:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /app/tmp
      log:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /app/log
