---
# ImageRepository scans the GHCR registry for new images pushed by GitHub Actions CI
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageRepository
metadata:
  name: see-edv-ibspm
  namespace: my-software-showcase
spec:
  interval: 5m
  image: ghcr.io/nachtschatt3n/see-edv-ibspm
  access:
    secretRef:
      name: ghcr-secret

---
# ImagePolicy selects the most recent image matching the production-* tag pattern
# Flux will automatically update kustomization resources when a new image appears
apiVersion: image.toolkit.fluxcd.io/v1beta1
kind: ImagePolicy
metadata:
  name: see-edv-ibspm
  namespace: my-software-showcase
spec:
  imageRepositoryRef:
    name: see-edv-ibspm
  policy:
    semver:
      range: 'production-*'
      # Extract version from production-YYYYMMDDHHMMSS format
