apiVersion: apps/v1
kind: Deployment
metadata:
  name: see-edv-ibspm
  namespace: my-software-showcase
  labels:
    app: see-edv-ibspm
    version: v1
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: see-edv-ibspm
  template:
    metadata:
      labels:
        app: see-edv-ibspm
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: default
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000

      containers:
      - name: see-edv-ibspm
        image: ghcr.io/nachtschatt3n/see-edv-ibspm:latest
        imagePullPolicy: Always

        ports:
        - name: http
          containerPort: 3000
          protocol: TCP

        env:
        - name: RAILS_ENV
          value: "production"
        - name: RACK_ENV
          value: "production"
        - name: RAILS_LOG_TO_STDOUT
          value: "1"
        - name: RAILS_SERVE_STATIC_FILES
          value: "1"
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: see-edv-ibspm-config
              key: db.host
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: see-edv-ibspm-config
              key: db.port
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: see-edv-ibspm-config
              key: db.name
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: see-edv-ibspm-secrets
              key: db.username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: see-edv-ibspm-secrets
              key: db.password
        - name: SECRET_KEY_BASE
          valueFrom:
            secretKeyRef:
              name: see-edv-ibspm-secrets
              key: secret.key.base
        - name: SMTP_ADDRESS
          valueFrom:
            configMapKeyRef:
              name: see-edv-ibspm-config
              key: smtp.address
        - name: SMTP_PORT
          valueFrom:
            configMapKeyRef:
              name: see-edv-ibspm-config
              key: smtp.port
        - name: SMTP_USER_NAME
          valueFrom:
            configMapKeyRef:
              name: see-edv-ibspm-config
              key: smtp.username
        - name: SMTP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: see-edv-ibspm-secrets
              key: smtp.password

        livenessProbe:
          httpGet:
            path: /health/liveness
            port: http
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /health/readiness
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        startupProbe:
          httpGet:
            path: /health/startup
            port: http
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30

        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi

        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: false

        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: log
          mountPath: /app/log

      volumes:
      - name: tmp
        emptyDir: {}
      - name: log
        emptyDir: {}

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - see-edv-ibspm
              topologyKey: kubernetes.io/hostname
