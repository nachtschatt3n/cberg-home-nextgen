---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
# HelmRelease for U-Zeit Time Management
# Uses bjw-s/app-template 3.7.3
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app u-zeit
  namespace: my-software-showcase
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      u-zeit:
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/nachtschatt3n/u-zeit
              tag: production-20260816000000 # {"$imagepolicy": "my-software-showcase:u-zeit:tag"}
              pullPolicy: IfNotPresent
            env:
              - name: TZ
                value: "Europe/Berlin"
              - name: RAILS_ENV
                value: "production"
              - name: RACK_ENV
                value: "production"
              - name: PORT
                value: "3000"
              - name: RAILS_LOG_TO_STDOUT
                value: "1"
              - name: RAILS_SERVE_STATIC_FILES
                value: "1"
              - name: DATABASE_HOST
                value: "mariadb.databases.svc.cluster.local"
              - name: DATABASE_PORT
                value: "3306"
              - name: DATABASE_NAME
                value: "showcase_u_zeit_prod"
            envFrom:
              - secretRef:
                  name: u-zeit-secrets
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/liveness
                    port: 3000
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/readiness
                    port: 3000
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/startup
                    port: 3000
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 30
    defaultPodOptions:
      imagePullSecrets:
        - name: ghcr-secret
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        fsGroupChangePolicy: "OnRootMismatch"
    service:
      main:
        controller: u-zeit
        ports:
          http:
            port: 3000
    ingress:
      main:
        enabled: true
        className: internal
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "U-Zeit Time Management"
          gethomepage.dev/group: "Software Portfolio"
          gethomepage.dev/icon: "si-clock"
        labels:
          gethomepage.dev/enabled: "true"
        hosts:
          - host: &host "u-zeit.\${SECRET_DOMAIN}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: main
                  port: http
        tls:
          - hosts:
              - *host
    persistence:
      data:
        enabled: true
        type: persistentVolumeClaim
        storageClass: longhorn
        size: 5Gi
        accessMode: ReadWriteOnce
        globalMounts:
          - path: /data
      uploads:
        enabled: true
        type: persistentVolumeClaim
        storageClass: longhorn
        size: 10Gi
        accessMode: ReadWriteOnce
        globalMounts:
          - path: /app/public/uploads
      tmp:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /app/tmp
      log:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /app/log
