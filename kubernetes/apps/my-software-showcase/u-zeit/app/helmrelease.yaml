---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
# HelmRelease for U-Zeit Time Management
# Uses bjw-s/app-template 3.7.3
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app u-zeit
  namespace: my-software-showcase
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      u-zeit:
        replicas: 1
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/nachtschatt3n/u-zeit
              tag: production-20260818065631
              pullPolicy: IfNotPresent
            env:
              # Showcase deployment opts in: the sign-in form arrives with the
              # shared demo credential already filled so a visitor only presses
              # submit. Default in the app is OFF; only this deployment enables it.
              - name: SHOWCASE_DEMO_PREFILL
                value: "1"
              - name: TZ
                value: "Europe/Berlin"
              - name: RAILS_ENV
                value: "production"
              - name: RACK_ENV
                value: "production"
              - name: PORT
                value: "3000"
              - name: RAILS_LOG_TO_STDOUT
                value: "1"
              - name: RAILS_SERVE_STATIC_FILES
                value: "1"
            envFrom:
              - secretRef:
                  name: u-zeit-secrets
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/liveness
                    port: 3000
                    httpHeaders:
                      - name: X-Forwarded-Proto
                        value: https
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/readiness
                    port: 3000
                    httpHeaders:
                      - name: X-Forwarded-Proto
                        value: https
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/startup
                    port: 3000
                    httpHeaders:
                      - name: X-Forwarded-Proto
                        value: https
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 30
    defaultPodOptions:
      imagePullSecrets:
        - name: ghcr-secret
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        fsGroupChangePolicy: "OnRootMismatch"
    service:
      main:
        controller: u-zeit
        ports:
          http:
            port: 3000
    # Envoy Gateway migration phase 2 (2026-09-07): Ingress -> HTTPRoute.
    # Both halves in ONE commit -- k8s-gateway watches Ingress AND HTTPRoute,
    # so leaving the Ingress alongside the route gives this host two records
    # (.100 and .103) and it resolves non-deterministically.
    route:
      main:
        kind: HTTPRoute
        hostnames:
          - "u-zeit.${SECRET_DOMAIN}"
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: Gateway
            name: envoy-internal
            namespace: network
            # https only. The http listener is owned cluster-wide by
            # httproute-https-redirect, which 301s every host.
            sectionName: https
        labels:
          gethomepage.dev/enabled: "true"
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "U-Zeit Time Management"
          gethomepage.dev/group: "Software Portfolio"
          gethomepage.dev/icon: "mdi-clock-outline"
        # Rule written out explicitly rather than relying on the chart default:
        # the "rules may be omitted" shortcut only holds while exactly one
        # Service is enabled, and _validate.tpl hard-fails the moment a second
        # one appears.
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: main
                port: http
    persistence:
      uploads:
        enabled: true
        type: persistentVolumeClaim
        # longhorn-static: PVC name, volumeName, PV name and the Longhorn
        # Volume CR must all be the same speaking identifier (u-zeit-uploads).
        # The Volume CR is applied manually by the operator, not by Flux.
        storageClass: longhorn-static
        volumeName: u-zeit-uploads
        suffix: uploads
        accessMode: ReadWriteOnce
        size: 5Gi
        globalMounts:
          - path: /app/public/system
      tmp:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /app/tmp
      log:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /app/log
