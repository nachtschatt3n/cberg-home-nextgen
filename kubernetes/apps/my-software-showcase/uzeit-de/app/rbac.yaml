apiVersion: v1
kind: ServiceAccount
metadata:
  name: uzeit-de
  namespace: my-software-showcase
  labels:
    app: uzeit-de
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: uzeit-de
  namespace: my-software-showcase
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: uzeit-de
  namespace: my-software-showcase
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: uzeit-de
subjects:
  - kind: ServiceAccount
    name: uzeit-de
    namespace: my-software-showcase
