---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: uzeit-de-uploads
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  # Retain: these hold user-uploaded files for EOL applications that have no
  # upstream to re-fetch from. A reclaim must never be automatic.
  persistentVolumeReclaimPolicy: Retain
  storageClassName: longhorn-static
  csi:
    driver: driver.longhorn.io
    fsType: ext4
    volumeAttributes:
      numberOfReplicas: "2"
      staleReplicaTimeout: "30"
    volumeHandle: uzeit-de-uploads
