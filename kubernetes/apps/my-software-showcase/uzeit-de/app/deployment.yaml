apiVersion: apps/v1
kind: Deployment
metadata:
  name: uzeit-de
  namespace: my-software-showcase
  labels:
    app: uzeit-de
    version: v1
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: uzeit-de
  template:
    metadata:
      labels:
        app: uzeit-de
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "80"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: uzeit-de
      securityContext:
        runAsNonRoot: true
        runAsUser: 33
        fsGroup: 33

      initContainers:
        # Wait for MySQL to be ready
        - name: wait-for-mysql
          image: busybox:1.35
          command: ['sh', '-c']
          args:
            - |
              until nc -z mysql-service 3306; do
                echo 'Waiting for MySQL...'
                sleep 2
              done
              echo 'MySQL is ready!'

        # Initialize database if needed
        - name: db-init
          image: mysql:5.7
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: uzeit-de-config
                  key: db.host
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: uzeit-de-config
                  key: db.port
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: uzeit-de-config
                  key: db.name
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: uzeit-de-secrets
                  key: db.user
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: uzeit-de-secrets
                  key: db.password
          command: ['sh', '-c']
          args:
            - |
              mysql -h $DB_HOST -u $DB_USER -p$DB_PASS -e "CREATE DATABASE IF NOT EXISTS $DB_NAME CHARACTER SET utf8 COLLATE utf8_general_ci;"
              echo "Database initialized"

      containers:
        - name: app
          image: ghcr.io/ibdigital/uzeit-de:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: uzeit-de-config
                  key: db.host
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: uzeit-de-config
                  key: db.port
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: uzeit-de-config
                  key: db.name
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: uzeit-de-secrets
                  key: db.user
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: uzeit-de-secrets
                  key: db.password
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: uzeit-de-config
                  key: app.env
            - name: APP_DEBUG
              valueFrom:
                configMapKeyRef:
                  name: uzeit-de-config
                  key: app.debug
            - name: PHP_MEMORY_LIMIT
              valueFrom:
                configMapKeyRef:
                  name: uzeit-de-config
                  key: php.memory_limit
            - name: PHP_MAX_EXECUTION_TIME
              valueFrom:
                configMapKeyRef:
                  name: uzeit-de-config
                  key: php.max_execution_time

          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"

          livenessProbe:
            httpGet:
              path: /health.php
              port: http
            initialDelaySeconds: 40
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health.php
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 2

          volumeMounts:
            - name: fileadmin
              mountPath: /var/www/html/fileadmin
            - name: uploads
              mountPath: /var/www/html/uploads
            - name: typo3temp
              mountPath: /var/www/html/typo3temp

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL

      volumes:
        - name: fileadmin
          persistentVolumeClaim:
            claimName: uzeit-de-fileadmin-pvc
        - name: uploads
          persistentVolumeClaim:
            claimName: uzeit-de-uploads-pvc
        - name: typo3temp
          emptyDir:
            sizeLimit: 1Gi

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - uzeit-de
                topologyKey: kubernetes.io/hostname
