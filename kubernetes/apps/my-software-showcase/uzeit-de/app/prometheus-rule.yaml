apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: uzeit-de
  namespace: my-software-showcase
  labels:
    app: uzeit-de
spec:
  groups:
    - name: uzeit-de.rules
      interval: 30s
      rules:
        # Pod restart tracking
        - alert: UzeitDePodRestartingTooOften
          expr: |
            increase(kube_pod_container_status_restarts_total{pod=~"uzeit-de-.*"}[15m]) > 2
          for: 5m
          labels:
            severity: warning
            app: uzeit-de
          annotations:
            summary: "uzeit-de pod is restarting too often"
            description: "Pod {{ $labels.pod }} has restarted {{ $value }} times in the last 15 minutes"

        # Memory usage alert
        - alert: UzeitDeHighMemoryUsage
          expr: |
            container_memory_usage_bytes{pod=~"uzeit-de-.*"} / container_spec_memory_limit_bytes{pod=~"uzeit-de-.*"} > 0.85
          for: 5m
          labels:
            severity: warning
            app: uzeit-de
          annotations:
            summary: "uzeit-de container memory usage is high"
            description: "Pod {{ $labels.pod }} memory usage is {{ $value | humanizePercentage }}"

        # CPU usage alert
        - alert: UzeitDeHighCPUUsage
          expr: |
            rate(container_cpu_usage_seconds_total{pod=~"uzeit-de-.*"}[5m]) > 0.8
          for: 5m
          labels:
            severity: warning
            app: uzeit-de
          annotations:
            summary: "uzeit-de container CPU usage is high"
            description: "Pod {{ $labels.pod }} CPU usage is {{ $value | humanizePercentage }}"

        # Pod not ready
        - alert: UzeitDePodNotReady
          expr: |
            kube_pod_status_ready{pod=~"uzeit-de-.*", condition="true"} == 0
          for: 10m
          labels:
            severity: critical
            app: uzeit-de
          annotations:
            summary: "uzeit-de pod is not ready"
            description: "Pod {{ $labels.pod }} has not been ready for more than 10 minutes"

        # Readiness probe failures
        - alert: UzeitDeReadinessProbeFailure
          expr: |
            increase(kube_pod_container_status_ready{pod=~"uzeit-de-.*"}[5m]) == 0
          for: 2m
          labels:
            severity: warning
            app: uzeit-de
          annotations:
            summary: "uzeit-de readiness probe is failing"
            description: "Pod {{ $labels.pod }} readiness probe has been failing"

        # Liveness probe failures
        - alert: UzeitDeCheckpointFailure
          expr: |
            kube_pod_container_status_last_terminated_reason{pod=~"uzeit-de-.*", reason="Error"} == 1
          for: 5m
          labels:
            severity: critical
            app: uzeit-de
          annotations:
            summary: "uzeit-de pod has crashed"
            description: "Pod {{ $labels.pod }} has terminated with error"

        # File permission issues (inferred from restart patterns)
        - alert: UzeitDeFilePermissionLikely
          expr: |
            increase(kube_pod_container_status_restarts_total{pod=~"uzeit-de-.*"}[30m]) > 5
            and on(pod) kube_pod_labels{label_app="uzeit-de"}
          for: 5m
          labels:
            severity: warning
            app: uzeit-de
          annotations:
            summary: "uzeit-de may have file permission issues"
            description: "Pod {{ $labels.pod }} is restarting frequently; check file permissions in volumes"

    - name: uzeit-de.recording-rules
      interval: 30s
      rules:
        # Recording rules for performance dashboards
        - record: uzeit_de:pod_memory_usage:ratio
          expr: |
            container_memory_usage_bytes{pod=~"uzeit-de-.*"} / container_spec_memory_limit_bytes{pod=~"uzeit-de-.*"}

        - record: uzeit_de:pod_cpu_usage:rate
          expr: |
            rate(container_cpu_usage_seconds_total{pod=~"uzeit-de-.*"}[5m])

        - record: uzeit_de:pod_request_rate
          expr: |
            rate(http_requests_total{pod=~"uzeit-de-.*"}[5m])

        - record: uzeit_de:pod_error_rate
          expr: |
            rate(http_requests_total{pod=~"uzeit-de-.*", status=~"5.."}[5m])
