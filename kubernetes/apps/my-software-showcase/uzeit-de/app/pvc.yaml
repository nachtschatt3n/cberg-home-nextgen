apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uzeit-de-fileadmin-pvc
  namespace: my-software-showcase
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uzeit-de-uploads-pvc
  namespace: my-software-showcase
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 10Gi
