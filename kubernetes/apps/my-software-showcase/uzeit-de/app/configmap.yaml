apiVersion: v1
kind: ConfigMap
metadata:
  name: uzeit-de-config
  namespace: my-software-showcase
data:
  # Database configuration
  db.host: "mysql-service"
  db.port: "3306"
  db.name: "showcase_uzeit_de_prod"

  # Application configuration
  app.env: "production"
  app.debug: "0"
  app.url: "https://uzeit-de.showcase.local"

  # PHP configuration
  php.memory_limit: "512M"
  php.max_execution_time: "300"
  php.upload_max_filesize: "50M"

  # TYPO3 extensions
  typo3.extensions.realurl: "1"
  typo3.extensions.news: "1"
  typo3.extensions.metaseo: "1"
  typo3.extensions.powermail: "1"

  # Monitoring
  prometheus.metrics.enabled: "1"
