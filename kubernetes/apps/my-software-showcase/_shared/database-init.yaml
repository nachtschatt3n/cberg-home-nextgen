# Database Initialization Documentation
#
# This file documents the database setup required for all 15 containerized apps
# in the my-software-showcase namespace.
#
# PREREQUISITES:
#   - MariaDB 10.1+ running in 'databases' namespace at: mariadb.databases.svc.cluster.local:3306
#   - MySQL root credentials (user: root, password should be in cluster secret)
#   - kubectl access to cluster
#
# DATABASES TO CREATE:
#
# The following databases must be created before apps can start.
# You can create them manually via MySQL client or run the Job below.
#
# Database names follow pattern: showcase_<app-id>_<env>
#
# App Database Details:
#
# 1. zuhause-betreut (Caretaker Manager)
#    Database: showcase_zuhause_betreut_prod
#    User: showcase_app
#    Password: (in secret)
#
# 2. inbewegung (Family Manager)
#    Database: showcase_inbewegung_prod
#    User: showcase_app
#    Password: (in secret)
#
# 3. kfa-medienarchiv (Media Archive)
#    Database: showcase_kfa_medienarchiv_prod
#    User: showcase_app
#    Password: (in secret)
#
# 4. mangold-smarthomeadvisor (Smart Home Advisor)
#    Database: showcase_mangold_prod
#    User: showcase_app
#    Password: (in secret)
#
# 5. metaldyne (Mini ERP)
#    Database: showcase_metaldyne_prod
#    User: showcase_app
#    Password: (in secret)
#
# 6. u-zeit (Time Management)
#    Database: showcase_u_zeit_prod
#    User: showcase_app
#    Password: (in secret)
#
# 7. stepbystepguide (Step By Step Guide)
#    Database: showcase_stepbystepguide_prod
#    User: showcase_app
#    Password: (in secret)
#
# 8. holm-backend (Holm Backend)
#    Database: showcase_holm_prod
#    User: showcase_app
#    Password: (in secret)
#
# 9. see-edv-ibspm (See EDV IBSPM)
#    Database: showcase_see_edv_prod
#    User: showcase_app
#    Password: (in secret)
#
# 10. ordiga (Order Management)
#     Database: showcase_ordiga_prod
#     User: showcase_app
#     Password: (in secret)
#
# 11. haarfabrik (Haarfabrik Extranet)
#     Database: showcase_haarfabrik_prod
#     User: showcase_app
#     Password: (in secret)
#
# 12. max-jung (Fahrzeugcontrolling)
#     Database: showcase_max_jung_prod
#     User: showcase_app
#     Password: (in secret)
#
# 13. ibgastro (IB Gastro)
#     Database: showcase_ibgastro_prod
#     User: showcase_app
#     Password: (in secret)
#
# 14. globalmobility (Global Mobility Group)
#     Database: showcase_globalmobility_prod
#     User: showcase_app
#     Password: (in secret)
#
# 15. uzeit-de (Uzeit.de)
#     Database: showcase_uzeit_de_prod
#     User: showcase_app
#     Password: (in secret)
#
---
# OPTION 1: Manual Database Creation via MySQL Client
#
# Connect to MariaDB:
#   kubectl port-forward -n databases svc/mariadb 3306:3306 &
#   mysql -h localhost -P 3306 -u root -p
#
# Run the following SQL commands:
#
# CREATE DATABASE showcase_zuhause_betreut_prod CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
# CREATE DATABASE showcase_inbewegung_prod CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
# CREATE DATABASE showcase_kfa_medienarchiv_prod CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
# CREATE DATABASE showcase_mangold_prod CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
# CREATE DATABASE showcase_metaldyne_prod CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
# CREATE DATABASE showcase_u_zeit_prod CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
# CREATE DATABASE showcase_stepbystepguide_prod CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
# CREATE DATABASE showcase_holm_prod CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
# CREATE DATABASE showcase_see_edv_prod CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
# CREATE DATABASE showcase_ordiga_prod CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
# CREATE DATABASE showcase_haarfabrik_prod CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
# CREATE DATABASE showcase_max_jung_prod CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
# CREATE DATABASE showcase_ibgastro_prod CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
# CREATE DATABASE showcase_globalmobility_prod CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
# CREATE DATABASE showcase_uzeit_de_prod CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
#
# CREATE USER 'showcase_app'@'%' IDENTIFIED BY 'SECURE_PASSWORD_HERE';
# GRANT ALL PRIVILEGES ON showcase_*.* TO 'showcase_app'@'%';
# FLUSH PRIVILEGES;
#
---
