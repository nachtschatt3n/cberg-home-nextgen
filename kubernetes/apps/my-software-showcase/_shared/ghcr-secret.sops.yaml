# yaml-language-server: $schema=https://json.schemastore.org/kustomization
# SOPS-Encrypted GHCR ImagePullSecret
#
# SHARED ACROSS ALL APPS in my-software-showcase namespace
#
# Purpose:
#   - Allows Kubernetes pods to pull Docker images from GitHub Container Registry (GHCR)
#   - This is a single shared secret used by all 15 apps
#   - Deploy once per namespace; all apps reference it
#
# To encrypt and apply this file:
#   1. Follow the setup instructions below to create .dockerconfigjson
#   2. Replace PLACEHOLDER_DOCKERCONFIGJSON with actual value
#   3. SAVE the file (unsaved)
#   4. Run: sops -e -i kubernetes/apps/my-software-showcase/_shared/ghcr-secret.sops.yaml
#   5. Verify encryption: sops kubernetes/apps/my-software-showcase/_shared/ghcr-secret.sops.yaml (should show encrypted data)
#   6. Commit encrypted file to git
#
# To generate .dockerconfigjson (SETUP INSTRUCTIONS):
#   1. Create a GitHub Personal Access Token (PAT):
#      - Go to https://github.com/settings/tokens
#      - Click "Generate new token (classic)"
#      - Name: "GHCR read:packages"
#      - Check only: repo (full control), read:packages, workflow
#      - Copy the token
#
#   2. Authenticate with Docker:
#      docker login ghcr.io -u YOUR_GITHUB_USERNAME -p YOUR_PERSONAL_ACCESS_TOKEN
#      # When prompted for password, paste the token
#
#   3. Extract and encode the config:
#      cat ~/.docker/config.json | base64 -w 0
#      # Copy the entire base64 output
#
#   4. Replace PLACEHOLDER_DOCKERCONFIGJSON below with the base64 string
#      (It should start with eyJh and be very long)
#
#   5. Save file and run sops encryption as above
#
# To view/edit (after encryption):
#   sops kubernetes/apps/my-software-showcase/_shared/ghcr-secret.sops.yaml
#
---
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-secret
  namespace: my-software-showcase
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: PLACEHOLDER_DOCKERCONFIGJSON_ENCRYPT_WITH_SOPS_BEFORE_COMMITTING
sops:
  age:
    - recipient: age1nw624gkjpl0sattullahnekdswjcvsgarf8gwwyf9jdqc0zm9enqyp2pf6
      enc: |
        -----BEGIN AGE ENCRYPTED FILE-----
        PLACEHOLDER_AGE_ENCRYPTION_KEY_REPLACE_WITH_REAL_KEY
        -----END AGE ENCRYPTED FILE-----
  lastmodified: "2026-08-16T00:00:00Z"
  mac: PLACEHOLDER_MAC_REPLACE_WITH_REAL_VALUE
  encrypted_regex: ^(data|stringData)$
  mac_only_encrypted: true
  version: 3.11.0
