---
# SOPS-Encrypted Kubernetes Secret for metaldyne
#
# This secret contains sensitive environment variables required by the app:
# - DATABASE_USER: MySQL username
# - DATABASE_PASSWORD: MySQL password
# - SECRET_KEY_BASE: Rails secret key for sessions and cookies
#
# To create this file:
#   1. Generate a random SECRET_KEY_BASE:
#      rails secret
#   2. Edit this file with sops:
#      sops kubernetes/apps/my-software-showcase/metaldyne/app/secret.sops.yaml
#   3. Replace placeholder values with actual secrets
#   4. Save (sops auto-encrypts on close)
#   5. Verify encryption
#   6. Commit encrypted file
#
apiVersion: v1
kind: Secret
metadata:
  name: metaldyne-secrets
  namespace: my-software-showcase
type: Opaque
stringData:
  DATABASE_USER: showcase_app
  DATABASE_PASSWORD: PLACEHOLDER_ENCRYPTED_DB_PASSWORD_REPLACE_WITH_ACTUAL_PASSWORD
  SECRET_KEY_BASE: PLACEHOLDER_ENCRYPTED_RAILS_SECRET_KEY_REPLACE_WITH_ACTUAL_KEY
sops:
  age:
    - recipient: age1nw624gkjpl0sattullahnekdswjcvsgarf8gwwyf9jdqc0zm9enqyp2pf6
      enc: |
        -----BEGIN AGE ENCRYPTED FILE-----
        PLACEHOLDER_AGE_ENCRYPTION_KEY_REPLACE_WITH_REAL_KEY
        -----END AGE ENCRYPTED FILE-----
  encrypted_regex: ^(data|stringData)$
  lastmodified: "2026-08-16T00:00:00Z"
  mac: PLACEHOLDER_MAC_REPLACE_WITH_REAL_VALUE
  mac_only_encrypted: true
  version: 3.13.0
