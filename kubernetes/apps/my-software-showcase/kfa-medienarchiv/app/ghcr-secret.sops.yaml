# yaml-language-server: $schema=https://json.schemastore.org/kustomization
# SOPS-Encrypted GHCR ImagePullSecret
#
# IMPORTANT: This file is SOPS-encrypted. The secret value shown below is a placeholder.
#
# Purpose:
#   - Allows Kubernetes pods to pull Docker images from GitHub Container Registry (GHCR)
#   - Used as a shared secret across all apps in my-software-showcase namespace
#   - NOTE: This can be shared with other apps in the same namespace
#
# To update this file (if credentials change):
#   1. Edit with SOPS: `sops kubernetes/apps/my-software-showcase/kfa-medienarchiv/app/ghcr-secret.sops.yaml`
#   2. Recreate .dockerconfigjson with new GHCR token
#   3. SOPS re-encrypts the file
#   4. Commit the encrypted result
#
# To generate .dockerconfigjson:
#   1. Create a GitHub Personal Access Token with read:packages scope
#   2. Create Docker config: docker login ghcr.io -u {github-username} -p {token}
#   3. Extract ~/.docker/config.json and set as .dockerconfigjson
#   4. Encrypt with SOPS before committing
#
# NOTE: This secret is shared across multiple apps in the namespace.
# You can alternatively reference the ghcr-secret from zuhause-betreut
# if it already exists and has the necessary permissions.
#
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-secret
  namespace: my-software-showcase
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: PLACEHOLDER_DOCKERCONFIGJSON_ENCRYPT_WITH_SOPS_BEFORE_COMMITTING
