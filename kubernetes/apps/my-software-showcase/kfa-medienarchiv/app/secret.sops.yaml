---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/v1/secret.json
# Secret: kfa-medienarchiv-secrets
# This file contains encrypted secrets for the kfa-medienarchiv application.
# Secrets are encrypted using sops/age and decrypted by Flux at deployment time.
#
# To edit this file:
# 1. Ensure you have sops and age installed
# 2. Have the age private key for this cluster in ~/.config/sops/age/keys.txt
# 3. Run: sops kubernetes/apps/my-software-showcase/kfa-medienarchiv/app/secret.sops.yaml
#
# Fields required:
# - DATABASE_URL: PostgreSQL/MySQL connection string
# - SECRET_KEY_BASE: Rails secret key (generate with: rails secret)
#
# Example values (replace with actual secrets):
# DATABASE_URL: mysql2://kfa_user:password@mysql.database.svc.cluster.local:3306/kfa_medienarchiv_prod
# SECRET_KEY_BASE: <128-char-random-string-generated-with-rails-secret>
apiVersion: v1
kind: Secret
metadata:
  name: kfa-medienarchiv-secrets
  namespace: my-software-showcase
type: Opaque
stringData:
  # Database connection URL
  # Format: mysql2://username:password@host:port/database
  DATABASE_URL: TBD_REPLACE_WITH_ENCRYPTED_VALUE

  # Rails secret key base
  # Generate with: rails secret
  SECRET_KEY_BASE: TBD_REPLACE_WITH_ENCRYPTED_VALUE

  # Database configuration (alternative to DATABASE_URL)
  DB_ADAPTER: mysql2
  DB_HOST: mysql.database.svc.cluster.local
  DB_PORT: "3306"
  DB_USERNAME: TBD_REPLACE_WITH_ENCRYPTED_VALUE
  DB_PASSWORD: TBD_REPLACE_WITH_ENCRYPTED_VALUE
  DB_DATABASE: kfa_medienarchiv_prod
  DB_POOL: "20"
  DB_TIMEOUT: "5000"
