---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
# Flux Kustomization for IB Gastro
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app ibgastro
  namespace: &namespace my-software-showcase
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    # the shared ghcr-secret must exist before any pod tries to pull
    - name: showcase-shared
    # every app in this namespace talks to the shared MariaDB
    - name: mariadb
      namespace: databases
    # binds a longhorn-static PVC
    - name: longhorn
      namespace: storage
  path: ./kubernetes/apps/my-software-showcase/ibgastro/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
