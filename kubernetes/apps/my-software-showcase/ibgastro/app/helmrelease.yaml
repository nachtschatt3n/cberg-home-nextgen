---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
# HelmRelease for IB Gastro (CakePHP) — bjw-s/app-template v3.7.3
# Converted from a hand-rolled Deployment + ConfigMap + plaintext Secret + PVC.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app ibgastro
  namespace: my-software-showcase
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      ibgastro:
        replicas: 1
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/nachtschatt3n/ibgastro
              tag: sha-c5cefcd64bcda51d8732475a3fdea899fab718e4
              pullPolicy: IfNotPresent
            env:
              # Showcase deployment opts in: the sign-in form arrives with the
              # shared demo credential already filled so a visitor only presses
              # submit. Default in the app is OFF; only this deployment enables it.
              - name: SHOWCASE_DEMO_PREFILL
                value: "1"
              - name: TZ
                value: "Europe/Berlin"
              - name: CAKEPHP_DEBUG
                value: "0"
            envFrom:
              - secretRef:
                  name: ibgastro-secrets
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 512Mi
            # /health is a CakePHP ROUTE (app/controllers/health_controller.php,
            # wired in app/config/routes.php), not a file in app/webroot -- there
            # is no health.php. It checks the DB connection and TMP writability
            # and returns a real 503 on failure.
            # The previous manifest probed "/", which routes to OrderclientsController
            # and 302-redirects to /users/login. Kubernetes scores 3xx as success, so
            # "/" reported Ready even with MySQL completely unreachable.
            #
            # PROBE SPLIT (2026-08-18) -- see configmap-nginx-healthz.yaml for the
            # full rationale and the measured numbers.
            #
            # Every request to the CakePHP `/health` ROUTE boots the whole
            # framework in php-fpm and emits ~370 `PHP Strict Standards:`
            # deprecation notices. At 480 probes/hour that was ~179,000 log
            # lines/hour -- 58% of the entire cluster's log ingest.
            #
            #   liveness  -> /health  on :80    CakePHP route: DB + TMP writability,
            #                                   returns a real 503. Kept, because this
            #                                   is the depth 81f78e6e added and the
            #                                   only probe that must detect a dead
            #                                   PHP tier. 120 boots/hour.
            #   readiness -> /healthz on :8080  static nginx `return 200`, never
            #   startup   -> /health  on :80    deep route as well. It fires 0x/hour
            #                                   in steady state, so it costs no volume, and
            #                                   it is what gates the Flux rollout.
            #
            # Do NOT "fix" this by relaxing the intervals instead -- that is
            # palliative and costs failure-detection latency. Do NOT drop the
            # notices at the collector either; the app would then have no way to
            # report a REAL error.
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 80
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8080
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              # STARTUP STAYS ON THE DEEP ROUTE (corrected 2026-08-18, same day).
              # The first cut moved startup to /healthz too. That was wrong: startup
              # fires ZERO times per hour in steady state -- it stops once it
              # succeeds -- so moving it saved no log volume at all, while costing
              # the deploy-time gate. While startup is failing the container is not
              # Ready, so the Deployment never becomes Available and Flux's
              # `upgrade.remediation.strategy: rollback` triggers. With the shallow
              # probe there, a pod that comes up with a bad DB credential, an
              # unreachable MariaDB or an unwritable TMP would report the release
              # SUCCESSFUL and only CrashLoop afterwards. The 360 boots/hour saving
              # is entirely in READINESS; this one was given away for nothing.
              #
              # failureThreshold 30 -> 12 bounds the noise a genuinely broken pod can
              # emit while crash-looping (12 x ~380 lines per start attempt instead of
              # 30 x). 5s delay + 12 x 5s = 65s of startup budget; the pod reaches
              # Ready in ~11s, so this is still ~6x headroom.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 80
                  initialDelaySeconds: 5
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 12
    defaultPodOptions:
      imagePullSecrets:
        - name: ghcr-secret
      # No runAsNonRoot/runAsUser here, unlike the Rails apps: this image has no
      # USER directive and its entrypoint starts nginx as root to bind :80 (a
      # privileged port) before dropping workers to the `nginx` user. Forcing
      # runAsNonRoot would stop the container from ever binding.
      # The namespace runs Pod Security Admission "baseline", which permits this.
      securityContext:
        # fsGroup makes the uploads PVC writable by the nginx/php-fpm user.
        # 101 is the gid Alpine's nginx package creates. VERIFY before rollout:
        #   docker run --rm <image> id nginx
        fsGroup: 101
        fsGroupChangePolicy: "OnRootMismatch"
    service:
      main:
        controller: ibgastro
        ports:
          http:
            port: 80
    ingress:
      main:
        enabled: true
        className: internal
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "IB Gastro"
          gethomepage.dev/description: "Gastronomy ordering system"
          gethomepage.dev/group: "Software Portfolio"
          gethomepage.dev/icon: "mdi-silverware-fork-knife"
        labels:
          gethomepage.dev/enabled: "true"
        hosts:
          - host: &host "ibgastro.${SECRET_DOMAIN}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: main
                  port: http
        tls:
          - hosts:
              - *host
    persistence:
      # Additive nginx snippet: a probe-only :8080 server that answers /healthz
      # from nginx itself. subPath keeps the image's own conf.d/default.conf
      # intact -- this adds a file, it does not shadow the directory.
      nginx-healthz:
        enabled: true
        type: configMap
        name: ibgastro-nginx-healthz
        globalMounts:
          - path: /etc/nginx/conf.d/healthz.conf
            subPath: healthz.conf
            readOnly: true
      uploads:
        enabled: true
        type: persistentVolumeClaim
        # longhorn-static: PVC name, volumeName, PV name and the Longhorn Volume CR
        # must all be the same speaking identifier (ibgastro-uploads).
        # The Volume CR is applied manually by the operator, not by Flux.
        storageClass: longhorn-static
        volumeName: ibgastro-uploads
        suffix: uploads
        accessMode: ReadWriteOnce
        size: 5Gi
        globalMounts:
          - path: /var/www/html/app/webroot/uploads
      tmp:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /var/www/html/app/tmp
      cache:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /var/www/html/app/cache
