apiVersion: apps/v1
kind: Deployment
metadata:
  name: ibgastro
  namespace: my-software-showcase
  labels:
    app: ibgastro
    version: "1.3.6"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ibgastro
  template:
    metadata:
      labels:
        app: ibgastro
      annotations:
        prometheus.io/scrape: "false"
    spec:
      serviceAccountName: default
      containers:
      - name: ibgastro
        image: ghcr.io/ibdigital/my-software-showcase-ibgastro:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
        env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: ibgastro-config
              key: db.host
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: ibgastro-secrets
              key: db.user
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: ibgastro-secrets
              key: db.password
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: ibgastro-config
              key: db.name
        - name: CAKEPHP_DEBUG
          valueFrom:
            configMapKeyRef:
              name: ibgastro-config
              key: cakephp.debug
        - name: CAKEPHP_SALT
          valueFrom:
            secretKeyRef:
              name: ibgastro-secrets
              key: cakephp.salt
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 40
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 2
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: tmp
          mountPath: /var/www/html/app/tmp
        - name: cache
          mountPath: /var/www/html/app/cache
        - name: uploads
          mountPath: /var/www/html/app/webroot/uploads
      volumes:
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir: {}
      - name: uploads
        persistentVolumeClaim:
          claimName: ibgastro-uploads
