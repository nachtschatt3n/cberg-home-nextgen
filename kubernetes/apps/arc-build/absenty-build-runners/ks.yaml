apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: absenty-build-runners
  namespace: flux-system
spec:
  targetNamespace: arc-build
  dependsOn:
    - name: gha-runner-scale-set-build-controller
    # owns the shared arc-build/gha-runner-scale-set chart source + quota
    - name: the-ninth-banner-build-runners
  path: ./kubernetes/apps/arc-build/absenty-build-runners/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
