apiVersion: v1
kind: ResourceQuota
metadata:
  name: arc-build-quota
  namespace: arc-build
spec:
  hard:
    # 2026-11-02: pods 4 -> 6, limits 24/40 -> 40/50. Adds absenty-build-k8s and
    # rainbow-rescue-build-k8s (max 1 runner each, minRunners 0, same pod caps:
    # runner 2 + dind 6 CPU limit, 6 + 4 Gi): 3 + 1 + 1 = 5 pods worst case, +1 slack for a
    # terminating pod overlapping its replacement.
    # requests.* are DELIBERATELY unchanged: worst case 3x2 + 2x2 = 10 CPU,
    # 5x3 = 15 Gi fit under 12 / 24Gi, and KubeCPUQuotaOvercommit sums the
    # requests quota (see ci-runner-alerts.yaml), so it must not move.
    pods: "6"
    requests.cpu: "12"
    requests.memory: 24Gi
    # 2026-10-12: 20 -> 24. ninth-banner-build-k8s maxRunners 3 (nuc14-02
    # back) x 8 CPU limits per build pod (runner 2 + dind 6) = 24.
    limits.cpu: "40"
    limits.memory: 50Gi
    services: "0"
    persistentvolumeclaims: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: arc-build-defaults
  namespace: arc-build
spec:
  limits:
    - type: Container
      default: { cpu: "1", memory: 1Gi, ephemeral-storage: 2Gi }
      defaultRequest: { cpu: 100m, memory: 256Mi, ephemeral-storage: 256Mi }
      # cpu 6: dind/BuildKit limit (owner 2026-10-06)
      max: { cpu: "6", memory: 10Gi, ephemeral-storage: 24Gi }
