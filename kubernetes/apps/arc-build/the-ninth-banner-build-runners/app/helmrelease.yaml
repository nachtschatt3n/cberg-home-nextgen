apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: the-ninth-banner-build-runners
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: gha-runner-scale-set
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  # ARC 0.15.0 generates the dind sidecar without resources. Cap its CPU,
  # memory, and scratch space so it remains inside the CI thermal budget.
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: actions.github.com
              version: v1alpha1
              kind: AutoscalingRunnerSet
              name: ninth-banner-build-k8s
            patch: |-
              - op: replace
                path: /spec/template/spec/initContainers/1/image
                value: docker.io/library/docker:29.1.3-dind@sha256:173f284a4299164772a90f52b373e73e087583c0963f1334c9995f190ef6f3f5
              - op: add
                path: /spec/template/spec/initContainers/1/resources
                value:
                  # dind runs BuildKit (the build itself): owner 2026-10-06
                  # allows up to 6 CPU (bursts accepted). Request 1.5 (+0.5
                  # runner = 2.0 per build pod) is sized for the old 6-CPU
                  # node budget: 1 build + 2 CPU runners (1.6) = 5.2 per node.
                  requests: {cpu: 1500m, memory: 1Gi, ephemeral-storage: 4Gi}
                  limits: {cpu: "6", memory: 4Gi, ephemeral-storage: 16Gi}
  values:
    githubConfigUrl: https://github.com/nachtschatt3n/the-ninth-banner
    githubConfigSecret: the-ninth-banner-arc-build-github
    runnerScaleSetName: ninth-banner-build-k8s
    # Owner 2026-10-06: one warm idle build runner (release image builds start
    # at once). Max 3 since 2026-10-12 (was 2 on two nodes): one build pod
    # per CI node now that nuc14-02 is back. Idle, it keeps its 2.0 CPU
    # request on its node.
    minRunners: 1
    maxRunners: 3
    controllerServiceAccount:
      namespace: arc-system
      name: arc-build-controller
    containerMode:
      type: dind
    # arc-system enforces PodSecurity restricted; the chart's default listener
    # pod is rejected without this (same template as ci-runner's scale sets).
    listenerTemplate:
      metadata:
        labels:
          app.kubernetes.io/name: the-ninth-banner-arc-listener
      spec:
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          seccompProfile:
            type: RuntimeDefault
        containers:
          - name: listener
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests: { cpu: 10m, memory: 32Mi }
              limits: { cpu: 200m, memory: 128Mi }
    template:
      metadata:
        labels:
          app.kubernetes.io/name: the-ninth-banner-runner
          ci.cberg.home/lane: browser
          ci.cberg.home/suite: gha-build
      spec:
        priorityClassName: ci-low
        automountServiceAccountToken: false
        enableServiceLinks: false
        affinity:
          # Owner, 2026-10-12: nuc14-02 is clean again (cooler cleaned, coolest
          # node under the RAPL caps), so the node affinity that kept CI on
          # nuc14-01/03 (plan ci-runner-exclude-node02) is gone: all three
          # nodes take CI pods, the shard Job template too.
          podAntiAffinity:
            # Owner 2026-10-06: no hard one-runner-per-node rule any more. Pods
            # of all three pools may share a node. The thermal gate was removed
            # 2026-10-06, so the scheduler places every pod; this preferred
            # term spreads them and the pool maxRunners bound the load.
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  topologyKey: kubernetes.io/hostname
                  namespaceSelector: {}
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: the-ninth-banner-runner
        containers:
          - name: runner
            image: ghcr.io/actions/actions-runner:2.338.0@sha256:4ffadc0002b2581327e06101fc8c06cd189232baf79fe561fac9caeb76f5e807
            # ARC does not inject the runner command when the template defines the
            # runner container: without it the image default exits 0 at once and
            # the ephemeral runner is recycled every ~10 s without taking a job.
            command: ["/home/runner/run.sh"]
            resources:
              # agent + docker CLI only; the build runs in dind (above)
              requests: { cpu: 500m, memory: 2Gi, ephemeral-storage: 4Gi }
              limits: { cpu: "2", memory: 6Gi, ephemeral-storage: 20Gi }
        volumes:
          - name: work
            emptyDir: { sizeLimit: 12Gi }
