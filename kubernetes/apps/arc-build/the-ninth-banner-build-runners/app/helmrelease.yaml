apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: the-ninth-banner-build-runners
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: gha-runner-scale-set
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  # ARC 0.15.0 generates the dind sidecar without resources. Cap its CPU,
  # memory, and scratch space so it remains inside the CI thermal budget.
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: actions.github.com
              version: v1alpha1
              kind: AutoscalingRunnerSet
              name: ninth-banner-build-k8s
            patch: |-
              - op: replace
                path: /spec/template/spec/initContainers/1/image
                value: docker.io/library/docker:29.1.3-dind@sha256:173f284a4299164772a90f52b373e73e087583c0963f1334c9995f190ef6f3f5
              - op: add
                path: /spec/template/spec/initContainers/1/resources
                value:
                  requests: {cpu: "1", memory: 1Gi, ephemeral-storage: 4Gi}
                  limits: {cpu: "2", memory: 4Gi, ephemeral-storage: 16Gi}
  values:
    githubConfigUrl: https://github.com/nachtschatt3n/the-ninth-banner
    githubConfigSecret: the-ninth-banner-arc-build-github
    runnerScaleSetName: ninth-banner-build-k8s
    minRunners: 0
    maxRunners: 1
    controllerServiceAccount:
      namespace: arc-system
      name: arc-build-controller
    containerMode:
      type: dind
    template:
      metadata:
        labels:
          app.kubernetes.io/name: the-ninth-banner-runner
          ci.cberg.home/lane: browser
          ci.cberg.home/suite: gha-build
      spec:
        priorityClassName: ci-low
        automountServiceAccountToken: false
        enableServiceLinks: false
        schedulingGates:
          - name: ci.cberg.home/thermal
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: In
                      values: ["k8s-nuc14-01", "k8s-nuc14-03"]
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - topologyKey: kubernetes.io/hostname
                namespaceSelector: {}
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: the-ninth-banner-runner
        containers:
          - name: runner
            image: ghcr.io/actions/actions-runner:2.337.0@sha256:e5496277be5d09bc968b3d64911b74e219ac4a3f2edce956a3ecf9271bea1ef4
            resources:
              requests: { cpu: "1", memory: 2Gi, ephemeral-storage: 4Gi }
              limits: { cpu: "2", memory: 6Gi, ephemeral-storage: 20Gi }
        volumes:
          - name: work
            emptyDir: { sizeLimit: 12Gi }
