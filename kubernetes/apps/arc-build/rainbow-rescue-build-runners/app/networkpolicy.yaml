---
# Egress for the privileged, ephemeral Rainbow Rescue image-build runners (scale set
# rainbow-rescue-build-k8s, repo rainbow-rescue-party-hunt, PRIVATE). Same model as arc-build-egress (the-ninth-banner pool):
# FQDN-allowed egress only (no LAN or in-cluster destination); the runner takes no inbound connections.
# Names are EXACT where possible (Azure storage account names are first-come, so
# the Results blob hosts are enumerated instead of wildcarded; see the sibling policy).
#   github.com, api/codeload, *.actions.githubusercontent.com, Results blobs,
#   objects/release-assets.githubusercontent.com       checkout, actions, logs, cache, releases
#   ghcr.io, pkg-containers.githubusercontent.com      image push (+ buildcache) and pull
#   registry-1.docker.io, auth.docker.io, *.docker.io,
#   production.cloudflare/cloudfront.docker.com        Docker Hub base images + buildx builder image
#   dl-cdn.alpinelinux.org                            apk upgrade (nginx:*-alpine base; :80 and :443)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: rainbow-rescue-build-egress
  namespace: arc-build
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: rainbow-rescue-build-runner
  ingress:
    - {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchName: github.com
              - matchName: api.github.com
              - matchName: codeload.github.com
              - matchPattern: "*.actions.githubusercontent.com"
              - matchName: productionresultssa0.blob.core.windows.net
              - matchName: productionresultssa1.blob.core.windows.net
              - matchName: productionresultssa2.blob.core.windows.net
              - matchName: productionresultssa3.blob.core.windows.net
              - matchName: productionresultssa4.blob.core.windows.net
              - matchName: productionresultssa5.blob.core.windows.net
              - matchName: productionresultssa6.blob.core.windows.net
              - matchName: productionresultssa7.blob.core.windows.net
              - matchName: productionresultssa8.blob.core.windows.net
              - matchName: productionresultssa9.blob.core.windows.net
              - matchName: productionresultssa10.blob.core.windows.net
              - matchName: productionresultssa11.blob.core.windows.net
              - matchName: productionresultssa12.blob.core.windows.net
              - matchName: productionresultssa13.blob.core.windows.net
              - matchName: productionresultssa14.blob.core.windows.net
              - matchName: productionresultssa15.blob.core.windows.net
              - matchName: productionresultssa16.blob.core.windows.net
              - matchName: productionresultssa17.blob.core.windows.net
              - matchName: productionresultssa18.blob.core.windows.net
              - matchName: productionresultssa19.blob.core.windows.net
              - matchName: objects.githubusercontent.com
              - matchName: release-assets.githubusercontent.com
              - matchName: ghcr.io
              - matchName: pkg-containers.githubusercontent.com
              - matchName: registry-1.docker.io
              - matchName: auth.docker.io
              - matchName: production.cloudflare.docker.com
              - matchName: production.cloudfront.docker.com
              - matchPattern: "*.docker.io"
              - matchName: dl-cdn.alpinelinux.org
              - matchPattern: "**.cluster.local"
    - toFQDNs:
        - matchName: github.com
        - matchName: api.github.com
        - matchName: codeload.github.com
        - matchPattern: "*.actions.githubusercontent.com"
        - matchName: productionresultssa0.blob.core.windows.net
        - matchName: productionresultssa1.blob.core.windows.net
        - matchName: productionresultssa2.blob.core.windows.net
        - matchName: productionresultssa3.blob.core.windows.net
        - matchName: productionresultssa4.blob.core.windows.net
        - matchName: productionresultssa5.blob.core.windows.net
        - matchName: productionresultssa6.blob.core.windows.net
        - matchName: productionresultssa7.blob.core.windows.net
        - matchName: productionresultssa8.blob.core.windows.net
        - matchName: productionresultssa9.blob.core.windows.net
        - matchName: productionresultssa10.blob.core.windows.net
        - matchName: productionresultssa11.blob.core.windows.net
        - matchName: productionresultssa12.blob.core.windows.net
        - matchName: productionresultssa13.blob.core.windows.net
        - matchName: productionresultssa14.blob.core.windows.net
        - matchName: productionresultssa15.blob.core.windows.net
        - matchName: productionresultssa16.blob.core.windows.net
        - matchName: productionresultssa17.blob.core.windows.net
        - matchName: productionresultssa18.blob.core.windows.net
        - matchName: productionresultssa19.blob.core.windows.net
        - matchName: objects.githubusercontent.com
        - matchName: release-assets.githubusercontent.com
        - matchName: ghcr.io
        - matchName: pkg-containers.githubusercontent.com
        - matchName: registry-1.docker.io
        - matchName: auth.docker.io
        - matchName: production.cloudflare.docker.com
        - matchName: production.cloudfront.docker.com
        - matchPattern: "*.docker.io"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toFQDNs:
        - matchName: dl-cdn.alpinelinux.org
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP
