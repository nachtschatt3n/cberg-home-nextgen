---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-dashboard
  namespace: media
  labels:
    app.kubernetes.io/name: media-dashboard
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: media-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: media-dashboard
    spec:
      serviceAccountName: media-dashboard
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: dashboard
          image: python:3.14.7-slim
          # pg8000 (pure-Python Postgres driver) is installed at start into the
          # /pylib emptyDir so dashboard.py can read the persisted audit runs in
          # sweep_history.media_audit_runs -- the runtime-pip house pattern
          # (ai/openclaw, ai/mcpo). A failed install is deliberately NOT fatal:
          # dashboard.py then falls back to the audit pod's logs, i.e. the
          # pre-2026-09-23 behaviour (plan media-audit-durable-output).
          command: ["bash", "-c"]
          args:
            - |
              if ! timeout 90 python -m pip install --quiet --no-cache-dir --target /pylib pg8000==1.31.5; then
                echo "WARN: pip install pg8000 failed; audit summary falls back to pod logs" >&2
              fi
              export PYTHONPATH=/pylib
              exec python /app/dashboard.py
          env:
            - name: INTAKE_ROOT
              value: "/intake"
            - name: PORT
              value: "8080"
            - name: READER_DSN
              valueFrom:
                secretKeyRef:
                  name: media-audit-db
                  key: READER_DSN
                  optional: true   # read path only; absent => pod-log fallback
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: app
              mountPath: /app
            - name: intake
              mountPath: /intake
              readOnly: true
            - name: pylib
              mountPath: /pylib
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10   # pip install runs first (a few seconds)
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 60   # > the 90s pip timeout minus one period
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: app
          configMap:
            name: media-dashboard
        - name: intake
          persistentVolumeClaim:
            claimName: jdownloader-intake
        - name: pylib
          emptyDir:
            sizeLimit: 64Mi
