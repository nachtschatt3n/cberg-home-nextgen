---
# Suspended CronJob — invoked on-demand to remove a SPECIFIC JDownloader
# subdirectory after re-verifying every move target exists with size > 0.
# Refuses globs, share roots, missing VERIFY_DESTINATIONS. See cleanup.py.
# Single share-root mount (see organize-cronjob.yaml for the EXDEV reason):
# CLEANUP_PATH is /data/downloads/jdownloader/<item>.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: media-cleanup
  namespace: media
spec:
  schedule: "0 0 31 2 *"   # never
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      # Templated jobs are created by hand / by agents; without a TTL every
      # run's Job + pod lingered until the history limit swept it.
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          restartPolicy: Never
          containers:
            - name: cleanup
              image: python:3.14.8-slim
              command: ["python", "/app/cleanup.py"]
              env:
                - name: MEDIA_ROOT
                  value: "/data/data"
                - name: JDOWNLOADER_ROOT
                  value: "/data/downloads/jdownloader"
                # Overridden per-invocation:
                # CLEANUP_PATH, VERIFY_DESTINATIONS
              volumeMounts:
                - name: scripts
                  mountPath: /app
                # read-write: the intake sub-path is removed from this mount.
                # cleanup.py refuses anything outside the intake root.
                - name: media
                  mountPath: /data
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 256Mi
          volumes:
            - name: scripts
              configMap:
                name: library-tools-scripts
            - name: media
              persistentVolumeClaim:
                claimName: plex-media-smb
