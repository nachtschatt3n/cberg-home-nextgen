---
apiVersion: v1
kind: ConfigMap
metadata:
  name: library-tools-scripts
  namespace: media
data:

  # =========================================================================
  # common.py — shared helpers, mount paths, redacted logger, ffprobe wrapper
  # =========================================================================
  common.py: |
    """Shared helpers for library-tools scripts.

    Privacy: all logging goes through `log()` which redacts media titles
    by default. Only counts and structural identifiers are emitted.
    """
    import os
    import re
    import subprocess
    import sys
    import json
    import urllib.request
    import urllib.error
    from pathlib import Path

    # Mount path inside any library-tools job pod that mounts plex-media-smb.
    # Layout under MEDIA_ROOT:
    #   Movies/, "TV Shows"/, Music/, YouTube/
    MEDIA_ROOT = Path(os.environ.get("MEDIA_ROOT", "/data/data"))
    # The intake lives on the SAME share as the library (//NAS/media ->
    # downloads/jdownloader vs data/). Jobs that move files must mount the
    # share ROOT once (PVC plex-media-smb at /data) and reach the intake as a
    # sub-path of that single mount. Two separate CIFS mounts (the old
    # /intake + /data layout) are two filesystems to the kernel, so every
    # rename between them failed with EXDEV (errno 18). atomic_mv() now
    # refuses a cross-device move explicitly instead of trying it.
    JDOWNLOADER_ROOT = Path(os.environ.get("JDOWNLOADER_ROOT",
                                           "/data/downloads/jdownloader"))

    SECTIONS = {
        "movies":   MEDIA_ROOT / "Movies",
        "tv":       MEDIA_ROOT / "TV Shows",
        "music":    MEDIA_ROOT / "Music",
        # YouTube is not in data/ — it's at /media/downloads/tube-archivist/,
        # owned by Tube Archivist and consumed by Jellyfin only. Not audited here.
    }

    # Filename patterns
    EP_RE       = re.compile(r"[Ss](\d{2})[Ee](\d{2})")
    # Year regex MUST constrain to 1900-2099. A naive `(\d{4})` matches
    # `(1080)` / `(720)` / `(2160)` — resolution leaked into the folder name —
    # which silently breaks year-restricted TMDb queries downstream.
    YEAR_RE     = re.compile(r"\((19[0-9]{2}|20[0-9]{2})\)")
    # SOP canonical episode filename is `<Show Name> - SXXEYY - Episode Title.ext`
    # (docs/sops/media-library-standards.md "Naming rules"), and the SAME rule
    # says: "Episode title is preferred; if unknown, `Show Name - S01E01.mkv`
    # is acceptable." Compliance therefore requires BOTH of:
    #   * a CASE-SENSITIVE SxxExx token (uppercase S/E) — release-scene lowercase
    #     `s01e01` and dotted `Show.S01E01.GROUP` forms fail,
    #   * the prefix before the token equals the show folder name EXACTLY,
    # and the episode title after the token is OPTIONAL: either absent entirely
    # (the documented title-less fallback) or ` - <non-empty title>`. A dangling
    # ` - ` with nothing after it is NOT the fallback form and still fails.
    # The prior lax check ` - SxxEyy\b` (case-insensitive, no prefix constraint)
    # measured a weaker rule and under-counted the non-compliant surface ~4x
    # (reported 99 vs the true 404 of 807). Then the fix over-corrected: it also
    # REQUIRED a title, scoring the SOP's own fallback form as a failure — 87 of
    # the 191 "non-compliant" episodes measured 2026-09-13 were exactly that
    # form (F-3e46ac10), so code was stricter than the standard. Title-less
    # compliant episodes are now counted separately as the title-backfill
    # surface (episode_title_missing()) instead of as naming failures.
    # Use episode_name_ok() below — the bare regex cannot check the prefix,
    # which needs the show name.
    EPISODE_NAME_RE = re.compile(
        r"^(?P<show>.+) - S[0-9]{2}E[0-9]{2}(?: - (?P<title>.+))?$")

    def _episode_name_match(stem: str, show_name: str):
        m = EPISODE_NAME_RE.match(stem)
        return m if (m and m.group("show") == show_name) else None

    def episode_name_ok(stem: str, show_name: str) -> bool:
        """True iff `stem` matches an SOP-compliant episode form for `show_name`:
        `<show_name> - SXXEYY - <Episode Title>` or the documented title-less
        fallback `<show_name> - SXXEYY` — case-sensitive SxxExx token, prefix
        equal to the show folder name."""
        return _episode_name_match(stem, show_name) is not None

    def episode_title_missing(stem: str, show_name: str) -> bool:
        """True iff `stem` is compliant ONLY via the title-less fallback form
        `<show_name> - SXXEYY`. Compliant per the SOP, but a title-backfill
        candidate — reported as its own metric, never as a naming failure."""
        m = _episode_name_match(stem, show_name)
        return bool(m) and not m.group("title")
    YT_ID_RE    = re.compile(r"\[([A-Za-z0-9_-]{11})\]")

    # Redaction guard: ban the printing of arbitrary filename text.
    # Use log_count() / log_event() / log_path_anonymous() instead of print().
    def log(msg, count=None):
        """Structural log line. msg must NOT include any media title."""
        if count is not None:
            print(f"{msg}: {count}", flush=True)
        else:
            print(msg, flush=True)

    def log_event(category, severity="info", **fields):
        """Emit a structured event. Fields must be counts/booleans/identifiers."""
        rec = {"event": category, "severity": severity, **fields}
        print(json.dumps(rec, sort_keys=True), flush=True)

    def anon_path(p: Path) -> str:
        """Return an anonymised path: only the section and depth, no titles."""
        p = Path(p)
        try:
            rel = p.relative_to(JDOWNLOADER_ROOT)
            if not rel.parts:
                return "intake/<root>"
            return "intake/<item>" + ("/<sub>" * (len(rel.parts) - 1))
        except ValueError:
            pass
        try:
            rel = p.relative_to(MEDIA_ROOT)
            parts = rel.parts
            if not parts:
                return "<root>"
            section = parts[0]
            if len(parts) > 1 and parts[1] == "_duplicates":
                return f"{section}/_duplicates/<item>" + ("/<sub>" * (len(parts) - 3) if len(parts) > 3 else "")
            return f"{section}/<item>" + ("/<sub>" * (len(parts) - 2) if len(parts) > 2 else "")
        except ValueError:
            return "<external>"

    # ---- ffprobe wrapper ---------------------------------------------------
    # Static ffmpeg/ffprobe are mounted from an OCI image volume at /tools in
    # the jobs that need them (media-intake-watcher); plain `ffprobe` on PATH
    # everywhere else.
    FFPROBE = os.environ.get("FFPROBE", "ffprobe")
    FFMPEG = os.environ.get("FFMPEG", "ffmpeg")

    def ffprobe_full(path: Path) -> dict:
        """Raw ffprobe JSON (all streams + format + tags) or {} on failure.
        Used for music: tags live in format.tags, cover art is a video stream
        with disposition.attached_pic == 1."""
        try:
            r = subprocess.run(
                [FFPROBE, "-v", "error", "-show_streams", "-show_format",
                 "-of", "json", str(path)],
                capture_output=True, timeout=60, check=False)
            if r.returncode != 0:
                return {}
            return json.loads(r.stdout or "{}")
        except Exception as e:
            log_event("ffprobe-error", severity="warn", error=type(e).__name__)
            return {}

    def sanitize_name(name: str) -> str:
        """Make a title safe as an SMB path component. `:` -> ` -` (Plex
        convention); `?*"<>|` dropped; `/` and backslash -> `-`."""
        name = name.replace(":", " -").replace("/", "-").replace("\\", "-")
        name = re.sub(r'[?*"<>|]', "", name)
        return " ".join(name.split()).strip(" .")
    def ffprobe(path: Path) -> dict:
        """Return {width, height, duration, bit_rate, size, fps} or {} on failure."""
        if not path.exists():
            return {}
        try:
            r = subprocess.run(
                [FFPROBE, "-v", "error",
                 "-select_streams", "v:0",
                 "-show_entries", "stream=width,height,r_frame_rate",
                 "-show_entries", "format=duration,bit_rate,size",
                 "-of", "json", str(path)],
                capture_output=True, timeout=60, check=False,
            )
            if r.returncode != 0:
                return {}
            data = json.loads(r.stdout or "{}")
            stream = (data.get("streams") or [{}])[0]
            fmt = data.get("format", {})
            fps_raw = stream.get("r_frame_rate", "0/1")
            try:
                num, den = fps_raw.split("/")
                fps = float(num) / float(den) if float(den) else 0.0
            except Exception:
                fps = 0.0
            return {
                "width":    int(stream.get("width") or 0),
                "height":   int(stream.get("height") or 0),
                "fps":      round(fps, 3),
                "duration": float(fmt.get("duration") or 0),
                "bit_rate": int(fmt.get("bit_rate") or 0),
                "size":     int(fmt.get("size") or 0),
            }
        except Exception as e:
            log_event("ffprobe-error", severity="warn", error=type(e).__name__)
            return {}

    # ---- image dimension probe (pure stdlib — no ffprobe needed) -----------
    def image_dims(path: Path) -> tuple[int, int]:
        """Return (width, height) by reading JPEG / PNG headers directly.

        Pure stdlib — no ffprobe, no Pillow. Returns (0, 0) on any failure
        (missing file, unsupported format, truncated header). Sufficient for
        the audit's threshold check (poster ≥ 600 px, fanart ≥ 1280 px).
        """
        try:
            with open(path, "rb") as f:
                head = f.read(32)
                # PNG: 8-byte signature, then IHDR chunk with width @16-19, height @20-23
                if head.startswith(b"\x89PNG\r\n\x1a\n"):
                    return (int.from_bytes(head[16:20], "big"),
                            int.from_bytes(head[20:24], "big"))
                # JPEG: walk segments to find SOF0/SOF2 marker
                if head.startswith(b"\xff\xd8"):
                    f.seek(2)
                    while True:
                        b = f.read(1)
                        if not b or b != b"\xff":
                            return (0, 0)
                        # Skip fill bytes (0xFF padding)
                        while b == b"\xff":
                            b = f.read(1)
                            if not b:
                                return (0, 0)
                        marker = b[0]
                        # SOF markers: C0..CF except C4, C8, CC
                        if marker in (0xC0, 0xC1, 0xC2, 0xC3, 0xC5, 0xC6, 0xC7,
                                      0xC9, 0xCA, 0xCB, 0xCD, 0xCE, 0xCF):
                            f.read(3)  # length(2) + precision(1)
                            h = int.from_bytes(f.read(2), "big")
                            w = int.from_bytes(f.read(2), "big")
                            return (w, h)
                        # Standalone markers (no length): SOI, EOI, RSTn, TEM
                        if marker in (0xD0, 0xD1, 0xD2, 0xD3, 0xD4, 0xD5,
                                      0xD6, 0xD7, 0xD8, 0xD9, 0x01):
                            continue
                        # All other markers have a length field; skip the segment
                        size_bytes = f.read(2)
                        if len(size_bytes) < 2:
                            return (0, 0)
                        seg_len = int.from_bytes(size_bytes, "big") - 2
                        if seg_len > 0:
                            f.seek(seg_len, 1)
            return (0, 0)
        except Exception:
            return (0, 0)

    # ---- atomic move helper ------------------------------------------------
    def _existing_ancestor(p: Path) -> Path:
        p = Path(p)
        while not p.exists() and p != p.parent:
            p = p.parent
        return p

    def same_filesystem(a: Path, b: Path) -> bool:
        """True iff a and b (or b's nearest existing ancestor) share st_dev."""
        try:
            return (os.stat(_existing_ancestor(a)).st_dev
                    == os.stat(_existing_ancestor(b)).st_dev)
        except OSError:
            return False

    def atomic_mv(src: Path, dst: Path) -> bool:
        """mv src → dst on the same filesystem; verify size; never overwrite.

        Rename only — never a copy. A cross-device move is REFUSED up front
        (the old two-mount job layout hit EXDEV on every rename)."""
        src, dst = Path(src), Path(dst)
        if dst.exists():
            log_event("mv-skip-exists", path=anon_path(dst))
            return False
        if not src.exists():
            log_event("mv-skip-missing-src", path=anon_path(src), severity="warn")
            return False
        src_size = src.stat().st_size
        if src_size == 0:
            log_event("mv-skip-empty-src", path=anon_path(src), severity="warn")
            return False
        if not same_filesystem(src, dst.parent):
            log_event("mv-refused-exdev", severity="error",
                      src=anon_path(src), dst=anon_path(dst))
            return False
        dst.parent.mkdir(parents=True, exist_ok=True)
        if dst.exists():   # re-check after mkdir (narrows the race)
            log_event("mv-skip-exists", path=anon_path(dst))
            return False
        try:
            os.replace(str(src), str(dst))   # atomic on same fs
        except OSError as e:
            # errno only: str(e) embeds both full paths (titles) in the log.
            log_event("mv-fail", severity="error", errno=e.errno,
                      error=type(e).__name__, path=anon_path(src))
            return False
        # verify
        if not dst.exists() or dst.stat().st_size != src_size:
            log_event("mv-verify-fail", severity="critical", path=anon_path(dst))
            return False
        log_event("mv-ok", src=anon_path(src), dst=anon_path(dst), bytes=src_size)
        return True

    # ---- HTTP helper -------------------------------------------------------
    def http_get(url: str, headers: dict = None, timeout: int = 30) -> bytes | None:
        req = urllib.request.Request(url, headers=headers or {})
        try:
            with urllib.request.urlopen(req, timeout=timeout) as r:
                return r.read() if r.status == 200 else None
        except urllib.error.HTTPError as e:
            if e.code != 404:
                log_event("http-error", severity="warn", code=e.code)
            return None
        except Exception as e:
            log_event("http-error", severity="warn", error=type(e).__name__)
            return None

    # ---- TMDb query helpers (German-first, exact-match scoring) -------------
    # Documented in docs/sops/media-library-standards.md ("TMDb integration")
    # and .claude/agents/media-manager.md ("TMDb query ladder").
    import urllib.parse as _urllib_parse

    # Release tokens stripped from raw folder names before TMDb query.
    # CRITICAL: do NOT add 2-letter language codes here (e.g. `fr`, `it`) — they
    # eat real words like `Fremde`, `Fragtime`, `From`, `Italienisch`.
    _NOISE = re.compile(
        r'\b(german|deutsch|dl|dual|english|spanish|italian|'
        r'bdrip|brrip|webrip|web-?dl|hdtv|hdrip|dvdrip|dvdr|bluray|blu-ray|'
        r'x264|x265|h\.?264|h\.?265|hevc|xvid|divx|aac|ac3|dts|dts-?hd|dtshd|atmos|truehd|dubbed|'
        r'1080p|720p|2160p|480p|360p|4k|uhd|hdr|sdr|10bit|8bit|hd|sd|ws|web|'
        r'unrated|extended|extreme|director\'?s?|dc|uncut|repack|proper|'
        r'internal|limited|read-?nfo|readnfo|crucial|opium|fme|wayne|sauerkraut|'
        r'empire|tk|fnd|spicy|zerotwo|anime|bimbambino|aniem|ast4u|gds|fsk|'
        r'remastered|remaster|criterion|imax|theatrical|complete|special|edition|platinum|teil|'
        r'\.|-|_)+\s*',
        re.IGNORECASE,
    )

    def umlaut_fix(s: str) -> str:
        """German romanisation: ae→ä, oe→ö, ue→ü."""
        return (s.replace('ae','ä').replace('oe','ö').replace('ue','ü')
                 .replace('Ae','Ä').replace('Oe','Ö').replace('Ue','Ü'))

    def clean_tmdb_query(folder_name: str):
        """Extract (clean_title, year_or_None) suitable for TMDb search."""
        m = YEAR_RE.search(folder_name)   # honours 1900-2099 constraint
        if m:
            year = int(m.group(1))
            raw = folder_name[:m.start()] + folder_name[m.end():]
        else:
            year = None
            raw = folder_name
        # Strip [bracket junk] and (NN) parenthetical sequence numbers
        raw = re.sub(r'\[[^\]]*\]', ' ', raw)
        raw = re.sub(r'\(\d{1,4}\)', ' ', raw)
        # Strip user prefix patterns: "A01 Title", "tm-foo", etc.
        raw = re.sub(r'^[A-Za-z]\d{1,2}\s+', '', raw)
        raw = re.sub(r'^(tm-|muhhd-|d-|dung-|tk-)\s*', '', raw, flags=re.IGNORECASE)
        # Replace separators with spaces
        title = raw.replace('.', ' ').replace('_', ' ').replace('-', ' ')
        # Strip release tokens
        while True:
            new = _NOISE.sub(' ', title)
            if new == title: break
            title = new
        return ' '.join(title.split()).strip(), year

    def tmdb_best_match(query: str, results: list) -> dict | None:
        """Strict scoring: exact > startswith > contains > popularity.

        Without this, `results[0]` is sorted by TMDb's relevance which
        favours the most *popular* match — `<franchise>` query returns
        `<franchise>: <newer-sequel>` because the sequel is currently
        more popular than the original.
        """
        if not results: return None
        ql = query.lower().strip()
        scored = []
        for r in results:
            title = (r.get('title') or r.get('name') or '').lower().strip()
            pop = r.get('popularity', 0)
            if title == ql: score = 10000 + pop
            elif title.startswith(ql + ' ') or title.startswith(ql + ':'): score = 5000 + pop
            elif ql in title: score = 1000 + pop
            else: score = pop
            scored.append((score, r))
        scored.sort(key=lambda x: -x[0])
        return scored[0][1]

    def tmdb_search(kind: str, query: str, year: int | None = None,
                    language: str | None = None, api_key: str = '') -> list:
        """Single TMDb search call. kind ∈ {movie, tv}.
        api_key MUST be a v3 key (32-char hex). v4 Bearer JWT returns 401."""
        if not query or not api_key: return []
        path = "movie" if kind == "movie" else "tv"
        q = _urllib_parse.quote_plus(query)
        url = f"https://api.themoviedb.org/3/search/{path}?api_key={api_key}&query={q}"
        if year and kind == "movie": url += f"&year={year}"
        if language: url += f"&language={language}"
        body = http_get(url)
        if not body: return []
        try: return (json.loads(body).get('results') or [])
        except (json.JSONDecodeError, ValueError): return []

    def tmdb_smart(kind: str, folder_name: str, api_key: str,
                   prefer_lang: str = 'de-DE') -> dict | None:
        """Multi-strategy TMDb lookup with German preference + exact-match scoring.
        Returns the best matching item or None."""
        title, year = clean_tmdb_query(folder_name)
        if not title: return None
        candidates = [(title, "clean")]
        u = umlaut_fix(title)
        if u != title: candidates.append((u, "umlaut"))
        # Try year-restricted first (most accurate when year present), then loose
        for q, _label in candidates:
            for y in (year, None) if year else (None,):
                for lang in (prefer_lang, None):
                    results = tmdb_search(kind, q, y, lang, api_key)
                    item = tmdb_best_match(q, results)
                    if item: return item
        return None

    # ---- safety: refuse share-root operations ------------------------------
    BANNED_DELETE_PATHS = {
        Path("/data"), Path("/data/data"), Path("/intake"),
        Path("/data/downloads"), MEDIA_ROOT, JDOWNLOADER_ROOT,
        MEDIA_ROOT / "Movies", MEDIA_ROOT / "TV Shows", MEDIA_ROOT / "Music",
    }

    def assert_safe_target(path: Path):
        """Raise if path is the share root or contains a glob.

        Only `*` counts as a glob marker. `?` legitimately occurs in release
        and folder names (the old check refused every title containing one),
        and nothing here expands globs — paths go to os.* calls verbatim,
        never to a shell."""
        path = Path(path)
        p = path.resolve()
        if "*" in str(path):
            raise SystemExit(f"REFUSED: glob in path: {anon_path(path)}")
        for banned in BANNED_DELETE_PATHS:
            if p == banned.resolve():
                raise SystemExit(f"REFUSED: target is share root: {anon_path(path)}")
        if not str(p).startswith(str(MEDIA_ROOT.resolve())) \
           and not str(p).startswith(str(JDOWNLOADER_ROOT.resolve())):
            raise SystemExit(f"REFUSED: target outside known mount: {anon_path(path)}")

  # =========================================================================
  # audit.py — read-only library walker, emits markdown + JSON to stdout
  # =========================================================================
  audit.py: |
    """Audit the media library for compliance with media-library-standards.

    Read-only. Emits a markdown summary (heading lines) and per-section JSON
    counts to stdout. Does NOT name individual items — only counts and
    anonymous identifiers (`item #1`, `item #2`, ...).
    """
    import json
    import sys
    import time
    from pathlib import Path
    from xml.etree import ElementTree as ET
    sys.path.insert(0, "/app")
    from common import (
        SECTIONS, MEDIA_ROOT, EP_RE, YEAR_RE, YT_ID_RE, EPISODE_NAME_RE,
        episode_name_ok,
        episode_title_missing,
        log, log_event, anon_path, image_dims,
    )

    POSTER_MIN_WIDTH = 600     # 2:3 MOVIE/TV posters
    FANART_MIN_WIDTH = 1280
    # SQUARE album covers, a separate constant since 2026-09-06 (F-ae230057).
    # check_album() previously reused POSTER_MIN_WIDTH, which the SOP defines
    # for 2:3 posters and which says nothing about ~1:1 album art -- so the
    # Music section was being scored against a threshold that had never been
    # decided for it. The measurement was sound and triple-confirmed (32 of 39
    # folder.jpg are exactly 500x500; only one 776x776 cleared 600), but 2.6%
    # was the audit's printed headline and while it stood it MASKED any real
    # regression in the other sections. Operator decision 2026-09-06: 500x500
    # is adequate for album art. Now stated in the SOP's Music row.
    ALBUM_COVER_MIN_WIDTH = 500

    def check_movie(folder: Path) -> dict:
        """Compliance record for one movie folder."""
        name = folder.name
        # Layout: must be a folder named "Title (Year)"
        layout_ok = bool(YEAR_RE.search(name))
        # Filename: must contain matching .mkv/.mp4 inside
        media = next((f for f in folder.iterdir()
                      if f.is_file() and f.suffix.lower() in {".mkv", ".mp4", ".avi", ".m4v"}),
                     None)
        filename_ok = media is not None and media.stem == name
        # NFO
        nfo = folder / f"{name}.nfo"
        nfo_ok = False
        if nfo.exists():
            try:
                root = ET.parse(nfo).getroot()
                nfo_ok = bool(root.find(".//title") is not None and root.find(".//year") is not None)
            except Exception:
                nfo_ok = False
        # Poster + Fanart
        poster = folder / "poster.jpg"
        fanart = folder / "fanart.jpg"
        pw, _ = image_dims(poster) if poster.exists() else (0, 0)
        fw, _ = image_dims(fanart) if fanart.exists() else (0, 0)
        return {
            "layout":  layout_ok,
            "filename": filename_ok,
            "nfo":     nfo_ok,
            "poster":  pw >= POSTER_MIN_WIDTH,
            "fanart":  fw >= FANART_MIN_WIDTH,
        }

    def audit_movies():
        root = SECTIONS["movies"]
        if not root.is_dir():
            log("Movies: section root missing")
            return None
        # Two cases: (a) folder = movie (nested = compliant); (b) loose .mkv (flat = non-compliant)
        # Filter `_*` folders (e.g. _duplicates/, _archive/) — they're operator
        # housekeeping, not library content. Otherwise they show as
        # 1 false-positive non-compliant item per audit run.
        nested, flat = [], []
        movie_nfo_orphan = 0      # Plex/Jellyfin auto-write — should be deduped
        drift_count = 0           # nfo year ≠ folder year (ignoring 1080/720 since YEAR_RE blocks those now)
        inner_basename_mismatch = 0
        for entry in sorted(root.iterdir()):
            if entry.name.startswith('_'):
                continue
            if entry.is_dir():
                rec = check_movie(entry)
                nested.append(rec)
                # Bonus checks (don't affect compliance %, just surfaced)
                if (entry / "movie.nfo").exists() and (entry / f"{entry.name}.nfo").exists():
                    movie_nfo_orphan += 1
                # Drift: parse nfo, compare to folder
                nfo_path = entry / f"{entry.name}.nfo"
                if nfo_path.exists():
                    try:
                        from xml.etree import ElementTree as _ET
                        nfo_root = _ET.parse(nfo_path).getroot()
                        nfo_year = (nfo_root.findtext('.//year') or '').strip()
                        m = YEAR_RE.search(entry.name)
                        if m and nfo_year and abs(int(nfo_year) - int(m.group(1))) > 5:
                            drift_count += 1
                    except Exception:
                        pass
                # Inner-file basename consistency
                for inner in entry.iterdir():
                    if inner.is_file() and inner.suffix.lower() in {".mkv", ".mp4", ".avi", ".m4v"}:
                        if inner.stem != entry.name and "- cd" not in inner.stem:
                            inner_basename_mismatch += 1
            elif entry.is_file() and entry.suffix.lower() in {".mkv", ".mp4", ".avi", ".m4v"}:
                flat.append(entry.name)
        total = len(nested) + len(flat)
        if total == 0:
            return {"section": "movies", "items": 0}
        compliant = sum(1 for r in nested if all(r.values()))
        return {
            "section":              "movies",
            "items":                total,
            "nested":               len(nested),
            "flat":                 len(flat),
            "compliant":            compliant,
            # nested/total answers "is it in a folder", NOT "is the layout
            # compliant". A folder whose name lacks a valid (YYYY) fails the
            # per-record `layout` flag but still counted as 100% here, so
            # malformed names were invisible behind a green layout_pct.
            "layout_pct":           round(100 * sum(r["layout"] for r in nested) / total, 1),
            "nested_pct":           round(100 * len(nested) / total, 1),
            "nfo_pct":              round(100 * sum(r["nfo"] for r in nested) / max(len(nested), 1), 1),
            "poster_pct":           round(100 * sum(r["poster"] for r in nested) / max(len(nested), 1), 1),
            "fanart_pct":           round(100 * sum(r["fanart"] for r in nested) / max(len(nested), 1), 1),
            "movie_nfo_orphan":     movie_nfo_orphan,
            "drift":                drift_count,
            "inner_basename_mismatch": inner_basename_mismatch,
        }

    def audit_tv():
        root = SECTIONS["tv"]
        if not root.is_dir():
            log("TV Shows: section root missing")
            return None
        # Filter `_*` housekeeping folders (same reason as audit_movies)
        shows = [s for s in sorted(root.iterdir()) if s.is_dir() and not s.name.startswith('_')]
        episodes_total, episodes_in_season = 0, 0
        episodes_with_nfo, episodes_with_thumb, episodes_named_ok = 0, 0, 0
        # Title-backfill surface: compliant via the SOP's title-less fallback
        # (`Show - SXXEYY`) — a subset of episodes_named_ok, NOT a failure.
        episodes_title_missing = 0
        series_compliant = 0
        for show in shows:
            tvshow_nfo = show / "tvshow.nfo"
            poster_w, _ = image_dims(show / "poster.jpg") if (show / "poster.jpg").exists() else (0, 0)
            fanart_w, _ = image_dims(show / "fanart.jpg") if (show / "fanart.jpg").exists() else (0, 0)
            series_ok = (tvshow_nfo.exists()
                         and poster_w >= POSTER_MIN_WIDTH
                         and fanart_w >= FANART_MIN_WIDTH)
            if series_ok:
                series_compliant += 1
            # Walk episodes.
            # NOTE: this used to count ONLY episodes_total/episodes_in_season, so
            # the SOP's episode-level NFO floor (>=80%) and the `Show - SXXEYY`
            # naming rule were never computed at all — the section reported PASS
            # while actual NFO coverage sat at 2.5%. A threshold that is never
            # measured is not a passing threshold.
            for ep in show.rglob("*"):
                if ep.is_file() and ep.suffix.lower() in {".mkv", ".mp4", ".avi", ".m4v"}:
                    episodes_total += 1
                    if ep.parent.name.lower().startswith("season"):
                        episodes_in_season += 1
                    if ep.with_suffix(".nfo").exists():
                        episodes_with_nfo += 1
                    if (ep.parent / f"{ep.stem}-thumb.jpg").exists():
                        episodes_with_thumb += 1
                    if episode_name_ok(ep.stem, show.name):
                        episodes_named_ok += 1
                        if episode_title_missing(ep.stem, show.name):
                            episodes_title_missing += 1
        return {
            "section":              "tv",
            "shows":                len(shows),
            "shows_compliant":      series_compliant,
            "episodes_total":       episodes_total,
            "episodes_in_season":   episodes_in_season,
            "season_layout_pct":    round(100 * episodes_in_season / max(episodes_total, 1), 1),
            "episodes_with_nfo":    episodes_with_nfo,
            "episode_nfo_pct":      round(100 * episodes_with_nfo / max(episodes_total, 1), 1),
            "episode_thumb_pct":    round(100 * episodes_with_thumb / max(episodes_total, 1), 1),
            "episodes_named_ok":    episodes_named_ok,
            "episode_naming_pct":   round(100 * episodes_named_ok / max(episodes_total, 1), 1),
            # Subset of episodes_named_ok: compliant title-less fallback form,
            # i.e. the title-backfill work queue. No SOP threshold row.
            "episodes_title_missing":   episodes_title_missing,
            "episode_title_backfill_pct": round(100 * episodes_title_missing / max(episodes_total, 1), 1),
            "series_compliance_pct": round(100 * series_compliant / max(len(shows), 1), 1),
        }

    def check_album(folder: Path) -> dict:
        """Compliance record for one album folder (Music/<Artist>/<Album (Year)>/)."""
        name = folder.name
        layout_ok = bool(YEAR_RE.search(name))
        nfo = folder / "album.nfo"
        nfo_ok = False
        if nfo.exists():
            try:
                ET.parse(nfo)
                nfo_ok = True
            except Exception:
                nfo_ok = False
        # SOP calls the album-level cover "folder.jpg", not "poster.jpg" -- the
        # `poster` record key is kept for naming consistency with check_movie(),
        # it just points at a different filename per the Music layout in
        # docs/sops/media-library-standards.md.
        poster = folder / "folder.jpg"
        pw, _ = image_dims(poster) if poster.exists() else (0, 0)
        return {
            "layout": layout_ok,
            "nfo":    nfo_ok,
            "poster": pw >= ALBUM_COVER_MIN_WIDTH,
        }

    def audit_music():
        # common.SECTIONS has defined "music" since this file was written; the
        # SOP's own audit-thresholds table has a Music row (Layout >=95%,
        # NFO >=80%, folder.jpg >=80%); main() never called this. A threshold
        # that is never measured is not a passing threshold -- same class of
        # defect the audit_tv() fix above already names. Found 2026-08-24.
        root = SECTIONS["music"]
        if not root.is_dir():
            log("Music: section root missing")
            return None
        # Music/<Artist>/<Album (Year)>/ -- TWO levels of nesting, unlike
        # Movies' one. `_*` artist/album folders are operator housekeeping,
        # excluded the same way audit_movies()/audit_tv() exclude them.
        albums = []
        flat_artists = 0  # tracks sitting directly under Artist/, no Album layer
        AUDIO_EXT = {".flac", ".mp3", ".m4a", ".ogg", ".wav"}
        for artist in sorted(root.iterdir()):
            if not artist.is_dir() or artist.name.startswith('_'):
                continue
            found_album = False
            for entry in sorted(artist.iterdir()):
                if entry.name.startswith('_'):
                    continue
                if entry.is_dir():
                    found_album = True
                    albums.append(check_album(entry))
            if not found_album:
                has_loose_tracks = any(
                    f.is_file() and f.suffix.lower() in AUDIO_EXT
                    for f in artist.iterdir()
                )
                if has_loose_tracks:
                    flat_artists += 1
        total = len(albums) + flat_artists
        if total == 0:
            return {"section": "music", "items": 0}
        compliant = sum(1 for r in albums if all(r.values()))
        return {
            "section":     "music",
            "items":       total,
            "nested":      len(albums),
            "flat":        flat_artists,
            "compliant":   compliant,
            "layout_pct":  round(100 * sum(r["layout"] for r in albums) / total, 1),
            "nested_pct":  round(100 * len(albums) / total, 1),
            "nfo_pct":     round(100 * sum(r["nfo"] for r in albums) / max(len(albums), 1), 1),
            "poster_pct":  round(100 * sum(r["poster"] for r in albums) / max(len(albums), 1), 1),
        }

    def main():
        log("# Media Library Audit")
        log(f"Mount root: {MEDIA_ROOT}")
        log("")
        log("YouTube (Tube Archivist) is Jellyfin-only and not audited here.")
        log("")
        results = []
        for fn in (audit_movies, audit_tv, audit_music):
            r = fn()
            if r:
                results.append(r)
                log_event("audit-section", **r)
        log("")
        log("## Summary")
        for r in results:
            log(f"- {r['section']}: " + ", ".join(
                f"{k}={v}" for k, v in r.items() if k != "section"))
        # "Worst compliance metric" is meant to answer "are we meeting the
        # docs/sops/media-library-standards.md audit-thresholds table" -- so
        # it must only look at the *_pct keys THAT TABLE ACTUALLY DEFINES A
        # THRESHOLD FOR. An earlier blanket `k.endswith("_pct")` swept in
        # every percentage the code happens to compute, including ones with
        # no SOP threshold at all: `episode_thumb_pct` (thumbnails are a
        # required SIDECAR per the Naming rules section, but never got a row
        # in the threshold table) and `episode_naming_pct`/`nested_pct`
        # (structural stats, not compliance targets). Found 2026-08-24: the
        # untracked episode_thumb_pct was the low outlier that made the
        # headline read as a near-total library failure while every SOP
        # threshold the table actually defines was passing. An ALLOWLIST
        # (not a blocklist) so a FUTURE *_pct the code adds defaults to
        # excluded until someone deliberately maps it to a table row.
        TRACKED_PCT_KEYS = {
            "layout_pct", "nfo_pct", "poster_pct", "fanart_pct",  # movies, music
            "season_layout_pct", "episode_nfo_pct",               # tv, episode-level
            "series_compliance_pct",                              # tv, series-level
        }
        worst = 100.0
        for r in results:
            for k, v in r.items():
                if k in TRACKED_PCT_KEYS and isinstance(v, (int, float)):
                    worst = min(worst, v)
        log(f"\nWorst compliance metric (SOP-tracked thresholds only): {worst}%")
        # Final line: compact JSON mirroring metadata_coverage.py's
        # COVERAGE_RESULT_JSON. `sections` carries the exact per-section dicts
        # printed in the Summary above (counts and *_pct only -- never a
        # title), `worst_pct` the headline. The audit CronJob's `persist`
        # container greps this line out of the tee'd log and INSERTs it into
        # sweep_history.media_audit_runs; the dashboard renders the newest row
        # and only falls back to pod logs when the table is unreachable. Pod
        # stdout alone was GC'd with the pod on 2026-09-06 (plan
        # media-audit-durable-output). Keep it LAST and on ONE line.
        now = time.time()
        result = {
            "timestamp": int(now),
            "ran_at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime(now)),
            "sections": results,
            "worst_pct": worst,
        }
        print("AUDIT_RESULT_JSON " + json.dumps(result, separators=(',', ':')), flush=True)
        # Always exit 0 — the audit ran successfully if it walked the share.
        # Low compliance is a number, not a Job failure; alerting on it
        # belongs to a metrics exporter, not a CronJob exit code.
        sys.exit(0)

    if __name__ == "__main__":
        main()

  # =========================================================================
  # rescan.py — trigger Plex + Jellyfin library refresh
  # =========================================================================
  rescan.py: |
    """Folder-scoped library rescan in Plex + Jellyfin.

    FULL-LIBRARY SCANS WERE REMOVED ON PURPOSE (2026-09-28). A whole-section
    Plex refresh and Jellyfin's /Library/Refresh walk every item; on Jellyfin
    (SQLite on an NFS-served Longhorn RWX volume) that produced "database is
    locked" and liveness-probe kills mid-scan. Only the folders that actually
    changed are announced now:

      Plex:     GET  /library/sections/{id}/refresh?path=<folder>
                (section chosen by longest matching Location; paths outside
                 every section are skipped, never widened to a full scan)
      Jellyfin: POST /Library/Media/Updated  {"Updates":[{"Path":..,"UpdateType":"Created"}]}
                one request per folder, throttled (RESCAN_THROTTLE_S, default 2s)

    Env:
      RESCAN_PATHS       JSON list of library folders as seen in THIS pod
                         (e.g. /data/data/Movies/<item>). Empty/unset => no-op.
      PLEX_URL / PLEX_TOKEN
      JELLYFIN_URL / JELLYFIN_API_KEY
      PLEX_PATH_MAP      "<pod-prefix>=<plex-prefix>"     default "/data/=/data/"
      JELLYFIN_PATH_MAP  "<pod-prefix>=<jellyfin-prefix>" default "/data/=/media/"
        (Plex mounts the share root at /data like the tools jobs; Jellyfin
         mounts it at /media — see docs/sops/media-library-standards.md.)

    Note: the Plex chart names its service `plex-plex-media-server`, NOT `plex`.
    """
    import json
    import os
    import sys
    import time
    import urllib.parse
    import urllib.request
    import urllib.error
    import xml.etree.ElementTree as ET
    sys.path.insert(0, "/app")
    from common import log_event


    def _req(url, method="GET", headers=None, body=None, timeout=30):
        data = json.dumps(body).encode() if body is not None else None
        h = dict(headers or {})
        if data is not None:
            h["Content-Type"] = "application/json"
        req = urllib.request.Request(url, data=data, headers=h, method=method)
        try:
            with urllib.request.urlopen(req, timeout=timeout) as r:
                return r.status, r.read()
        except urllib.error.HTTPError as e:
            return e.code, b""
        except Exception as e:
            log_event("rescan-error", severity="warn", error=type(e).__name__)
            return 0, b""


    def map_path(p, mapping):
        src, _, dst = mapping.partition("=")
        return dst + p[len(src):] if src and p.startswith(src) else p


    def plex_sections(url, token):
        """[(section_id, location_path)] from /library/sections."""
        code, body = _req(f"{url}/library/sections?X-Plex-Token={token}")
        if code != 200:
            log_event("plex-sections-error", severity="warn", status=code)
            return []
        out = []
        for d in ET.fromstring(body).iter("Directory"):
            for loc in d.iter("Location"):
                out.append((d.get("key"), loc.get("path", "").rstrip("/")))
        return out


    def pick_section(path, sections):
        best = None
        for sid, loc in sections:
            if loc and (path == loc or path.startswith(loc + "/")):
                if best is None or len(loc) > len(best[1]):
                    best = (sid, loc)
        return best[0] if best else None


    def rescan_paths(paths, env=os.environ, sleep=time.sleep):
        paths = sorted({p.rstrip("/") for p in paths if p})
        if not paths:
            log_event("rescan-skipped", reason="no-paths")
            return {"plex": 0, "jellyfin": 0}
        throttle = float(env.get("RESCAN_THROTTLE_S", "2"))
        plex_url = env.get("PLEX_URL", "http://plex-plex-media-server.media.svc.cluster.local:32400")
        plex_token = env.get("PLEX_TOKEN", "")
        jf_url = env.get("JELLYFIN_URL", "http://jellyfin.media.svc.cluster.local:8096")
        jf_key = env.get("JELLYFIN_API_KEY", "")
        plex_map = env.get("PLEX_PATH_MAP", "/data/=/data/")
        jf_map = env.get("JELLYFIN_PATH_MAP", "/data/=/media/")
        done = {"plex": 0, "jellyfin": 0}

        if plex_token:
            sections = plex_sections(plex_url, plex_token)
            for p in paths:
                pp = map_path(p, plex_map)
                sid = pick_section(pp, sections)
                if not sid:
                    log_event("plex-rescan-skipped", reason="no-section-for-path", severity="warn")
                    continue
                q = urllib.parse.quote(pp, safe="")
                code, _ = _req(f"{plex_url}/library/sections/{sid}/refresh?path={q}&X-Plex-Token={plex_token}")
                log_event("plex-rescan-folder", section=sid, status=code)
                done["plex"] += code == 200
                sleep(throttle)
        else:
            log_event("plex-rescan-skipped", reason="missing-token", severity="warn")

        if jf_key:
            hdr = {"Authorization": f'MediaBrowser Token="{jf_key}"'}
            for p in paths:
                body = {"Updates": [{"Path": map_path(p, jf_map), "UpdateType": "Created"}]}
                code, _ = _req(f"{jf_url}/Library/Media/Updated", "POST", hdr, body)
                log_event("jellyfin-rescan-folder", status=code)
                done["jellyfin"] += code in (200, 204)
                sleep(throttle)
        else:
            log_event("jellyfin-rescan-skipped", reason="missing-key", severity="warn")
        return done


    def main():
        raw = os.environ.get("RESCAN_PATHS", "")
        try:
            paths = json.loads(raw) if raw else []
        except ValueError:
            sys.exit("REFUSED: RESCAN_PATHS is not a JSON list")
        rescan_paths(paths)


    if __name__ == "__main__":
        main()

  # =========================================================================
  # cleanup.py — `rm -rf` of an explicit subpath only, with re-verification
  # =========================================================================
  cleanup.py: |
    """Remove a specific JDownloader subdirectory after re-verifying that all
    its media files exist at known destination paths with size > 0.

    Required env (standalone Job use):
      CLEANUP_PATH           absolute path inside the intake root (no globs)
      VERIFY_DESTINATIONS    JSON list of dst paths that MUST all exist with
                             size > 0 before any rm. Empty list => REFUSE.

    intake.py calls cleanup() directly with guard_media=True, which additionally
    refuses when the directory still holds ANY file that is not on the scene-junk
    ALLOWLIST (JUNK_EXT, or a sample/trailer-named video under SAMPLE_MAX_BYTES).
    An allowlist, not a denylist (F-718fdeea): an unknown extension (.zip, .iso,
    .ape, a Subs/ folder, a small unnamed video) blocks the delete instead of
    being removed with the junk.
    """
    import json
    import os
    import re
    import shutil
    import sys
    from pathlib import Path
    sys.path.insert(0, "/app")
    from common import (
        log_event, anon_path, assert_safe_target, JDOWNLOADER_ROOT,
    )

    VIDEO_EXT = {".mkv", ".mp4", ".avi", ".m4v", ".ts", ".m2ts", ".mov", ".wmv", ".mpg", ".mpeg", ".webm"}
    AUDIO_EXT = {".mp3", ".flac", ".m4a", ".ogg", ".opus", ".wav", ".aac", ".alac", ".wma", ".aiff"}
    SAMPLE_MAX_BYTES = 150 * 1024 * 1024
    JUNK_EXT = {".nfo", ".txt", ".url", ".jpg", ".jpeg", ".png", ".sfv", ".srr",
                ".md5", ".nzb", ".log", ".html", ".htm", ".website"}
    SAMPLE_NAME_RE = re.compile(r"(^|[ ._\-/])(sample|trailer)([ ._\-/]|$)", re.I)


    def leftover_media(path: Path) -> int:
        """Count files under path that are NOT on the scene-junk allowlist."""
        n = 0
        for dp, _dn, fn in os.walk(path):
            for f in fn:
                fp = Path(dp) / f
                ext = fp.suffix.lower()
                if f.startswith(".") and ext not in VIDEO_EXT | AUDIO_EXT:
                    continue          # .DS_Store, ._foo, .intake tag-fix leftovers
                try:
                    size = fp.stat().st_size
                except OSError:
                    n += 1
                    continue
                if ext in JUNK_EXT:
                    continue
                rel = str(fp.relative_to(path))
                if ext in VIDEO_EXT and size <= SAMPLE_MAX_BYTES and SAMPLE_NAME_RE.search(rel):
                    continue
                n += 1
        return n


    def cleanup(path: Path, destinations, guard_media=False) -> bool:
        """Returns True if removed (or already gone), False if refused."""
        path = Path(path)
        destinations = [Path(d) for d in destinations]
        if not destinations:
            log_event("cleanup-refused", severity="error", reason="no-destinations")
            return False
        # Hard rail: a real sub-path of the intake root, never a glob/root.
        # Returned as a refusal (not SystemExit) so an in-process caller such as
        # intake.py records it and carries on with the other items.
        try:
            assert_safe_target(path)
        except SystemExit as e:
            log_event("cleanup-refused", severity="error", reason=str(e).split(":")[0])
            return False
        if path.resolve() == JDOWNLOADER_ROOT.resolve() \
                or JDOWNLOADER_ROOT.resolve() not in path.resolve().parents:
            log_event("cleanup-refused", severity="error", reason="not-an-intake-subpath")
            return False
        missing = []
        for d in destinations:
            if not d.exists():
                missing.append(("missing", anon_path(d)))
            elif d.is_file() and d.stat().st_size == 0:
                missing.append(("empty", anon_path(d)))
        if missing:
            log_event("cleanup-refused", severity="critical",
                      reason="verification-failed", missing=missing)
            return False
        if not path.exists():
            log_event("cleanup-skip-missing", path=anon_path(path))
            return True
        if guard_media and leftover_media(path):
            log_event("cleanup-refused", severity="error",
                      reason="non-junk-media-left", count=leftover_media(path))
            return False
        log_event("cleanup-remove-start", path=anon_path(path))
        shutil.rmtree(path)
        log_event("cleanup-remove-ok", path=anon_path(path))
        return True


    def main():
        path = os.environ.get("CLEANUP_PATH", "")
        verify = os.environ.get("VERIFY_DESTINATIONS", "")
        if not path:
            sys.exit("REFUSED: CLEANUP_PATH unset")
        if not verify:
            sys.exit("REFUSED: VERIFY_DESTINATIONS empty (no proof that moves succeeded)")
        try:
            destinations = json.loads(verify)
        except Exception:
            sys.exit("REFUSED: VERIFY_DESTINATIONS not valid JSON list")
        if not destinations:
            sys.exit("REFUSED: VERIFY_DESTINATIONS list is empty")
        sys.exit(0 if cleanup(Path(path), destinations) else 1)


    if __name__ == "__main__":
        main()

  # =========================================================================
  # organize.py — apply a move plan from stdin (JSON)
  # =========================================================================
  organize.py: |
    """Apply a move plan (JSON on stdin, or apply_plan() from intake.py).

    Plan format:
      {"dry_run": true,
       "moves":  [{"src": "...", "dst": "..."}, ...],          # independent moves
       "groups": [{"id": "g1", "moves": [{"src","dst"}, ...]}]} # ordered, all-or-rollback

    `moves` are independent: one failing does not affect the others.
    `groups` are ORDERED and TRANSACTIONAL — the two-step replace is a group:
      1. library file   -> <Section>/_duplicates/...   (displace the old copy)
      2. intake file    -> library path                (bring the new copy in)
    If step N fails, steps N-1..1 are undone in reverse (dst -> src). If an undo
    itself fails the group is reported `rollback-failed` (critical) and the file
    stays wherever the last successful rename left it — never deleted, never
    overwritten, since atomic_mv() refuses an existing destination.

    Refuses globs and share-root targets; rename-only (atomic_mv never copies and
    refuses cross-device moves); every destination is size-verified by atomic_mv.
    dry_run defaults to TRUE: a plan without the key moves nothing.
    """
    import json
    import sys
    from pathlib import Path
    sys.path.insert(0, "/app")
    from common import atomic_mv, assert_safe_target, log_event, anon_path


    def _validate(moves):
        for m in moves:
            assert_safe_target(Path(m["src"]))
            assert_safe_target(Path(m["dst"]))


    def apply_group(group, dry_run, mv=atomic_mv):
        """Run one ordered group. Returns 'ok' | 'failed' | 'rollback-failed'."""
        done = []
        for m in group["moves"]:
            src, dst = Path(m["src"]), Path(m["dst"])
            if dry_run:
                log_event("organize-plan", group=group.get("id"),
                          src=anon_path(src), dst=anon_path(dst))
                continue
            if mv(src, dst):
                done.append((src, dst))
                continue
            log_event("organize-group-step-failed", severity="error",
                      group=group.get("id"), step=len(done) + 1)
            for s, d in reversed(done):
                if not mv(d, s):
                    log_event("organize-rollback-failed", severity="critical",
                              group=group.get("id"), stranded=anon_path(d))
                    return "rollback-failed"
            log_event("organize-group-rolled-back", severity="warn",
                      group=group.get("id"), undone=len(done))
            return "failed"
        return "ok"


    def apply_plan(plan, mv=atomic_mv):
        """Returns {"ok": n, "fail": n, "groups": {id: outcome}}."""
        dry_run = bool(plan.get("dry_run", True))   # default safe
        moves = plan.get("moves", []) or []
        groups = plan.get("groups", []) or []
        _validate(moves)
        for g in groups:
            _validate(g["moves"])
        log_event("organize-start", moves=len(moves), groups=len(groups),
                  dry_run=dry_run)
        ok = fail = 0
        outcomes = {}
        for m in moves:
            src, dst = Path(m["src"]), Path(m["dst"])
            if dry_run:
                log_event("organize-plan", src=anon_path(src), dst=anon_path(dst))
                ok += 1
            elif mv(src, dst):
                ok += 1
            else:
                fail += 1
        for g in groups:
            res = apply_group(g, dry_run, mv)
            outcomes[g.get("id")] = res
            if res == "ok":
                ok += 1
            else:
                fail += 1
        log_event("organize-done", ok=ok, fail=fail, dry_run=dry_run)
        return {"ok": ok, "fail": fail, "groups": outcomes}


    def main():
        try:
            plan = json.load(sys.stdin)
        except Exception as e:
            sys.exit(f"REFUSED: stdin is not valid JSON ({type(e).__name__})")
        if not plan.get("moves") and not plan.get("groups"):
            sys.exit("REFUSED: empty plan (no moves, no groups)")
        res = apply_plan(plan)
        sys.exit(0 if res["fail"] == 0 else 1)


    if __name__ == "__main__":
        main()

  # =========================================================================
  # sidecar.py — fetch + write .nfo + poster + fanart for one item
  # =========================================================================
  sidecar.py: |
    """Fetch sidecars (.nfo + poster.jpg + fanart.jpg) from TMDb for one movie
    or one TV show folder.

    Required env:
      ITEM_PATH        absolute path of the movie folder OR show folder
      ITEM_KIND        "movie" | "show"
      TMDB_API_KEY     **MUST be a v3 API key** (32-char hex) — the v4 Bearer
                       JWT is sent as Authorization header and does NOT work
                       as the `?api_key=` query param. Wrong key → HTTP 401.
                       Get the v3 key from https://www.themoviedb.org/settings/api
      TMDB_QUERY       title to search (omit to derive from folder name via
                       common.clean_tmdb_query; useful for batch retry)
      TMDB_YEAR        optional year (movies). Year-restricted queries are
                       ~99% accurate when the year is right.

    Strategy: tmdb_smart() in common.py applies the German-first +
    umlaut-fallback + exact-match-scoring ladder. Eliminates the popularity
    bug where `<franchise>` query returned `<franchise>: <newer-sequel>`.
    """
    import os
    import sys
    from pathlib import Path
    sys.path.insert(0, "/app")
    from common import (
        http_get, log_event, anon_path, assert_safe_target,
        tmdb_smart, tmdb_search, tmdb_best_match,
    )

    IMG = "https://image.tmdb.org/t/p"

    def write_nfo(target: Path, kind: str, item: dict):
        title = item.get("title") or item.get("name") or ""
        year = (item.get("release_date") or item.get("first_air_date") or "")[:4]
        tag = "movie" if kind == "movie" else "tvshow"
        plot = (item.get('overview') or '').replace('<', '&lt;')
        body = (
            f"<{tag}>\n"
            f"  <title>{title}</title>\n"
            f"  <year>{year}</year>\n"
            f'  <uniqueid type="tmdb">{item.get("id", "")}</uniqueid>\n'
            f"  <plot>{plot}</plot>\n"
            f"</{tag}>\n"
        )
        target.write_text(body, encoding="utf-8")
        log_event("nfo-written", path=anon_path(target))

    def fetch_image(url: str, target: Path):
        body = http_get(url)
        if body:
            target.write_bytes(body)
            log_event("image-written", path=anon_path(target), bytes=len(body))
        else:
            log_event("image-fetch-failed", path=anon_path(target), severity="warn")

    def main():
        item_path = Path(os.environ.get("ITEM_PATH", ""))
        kind = os.environ.get("ITEM_KIND", "")
        query = os.environ.get("TMDB_QUERY", "")
        year = os.environ.get("TMDB_YEAR", "")
        key = os.environ.get("TMDB_API_KEY", "")
        if not (item_path and kind and key):
            sys.exit("REFUSED: missing one of ITEM_PATH/ITEM_KIND/TMDB_API_KEY")
        if kind not in {"movie", "show"}:
            sys.exit("REFUSED: ITEM_KIND must be 'movie' or 'show'")
        assert_safe_target(item_path)
        if not item_path.is_dir():
            sys.exit("REFUSED: ITEM_PATH does not exist or is not a directory")

        # Two paths:
        # 1. Explicit TMDB_QUERY supplied (manual override) → year-restricted
        #    single search with exact-match scoring.
        # 2. No explicit query → use tmdb_smart() to derive from folder name
        #    with the full strategy ladder (German-first, umlauts, prefix
        #    stripping, etc.). This is the smart-retry mode.
        if query:
            year_int = int(year) if year and year.isdigit() else None
            results = tmdb_search(kind, query, year_int, 'de-DE', key)
            if not results:
                results = tmdb_search(kind, query, year_int, None, key)
            item = tmdb_best_match(query, results)
        else:
            item = tmdb_smart(kind, item_path.name, key)

        if not item:
            # Soft outcome: TMDb couldn't match this query. The audit script
            # surfaces it; not a Job failure (KubeJobFailed alert noise).
            log_event("tmdb-no-match", severity="warn")
            return

        nfo_name = "tvshow.nfo" if kind == "show" else f"{item_path.name}.nfo"
        # Drop any pre-existing nfos so we don't end up with both
        # <folder>.nfo and movie.nfo (Plex/Jellyfin auto-write `movie.nfo`).
        for f in item_path.iterdir():
            if f.is_file() and f.suffix.lower() == '.nfo':
                try: f.unlink()
                except OSError: pass
        write_nfo(item_path / nfo_name, kind, item)

        if item.get("poster_path"):
            fetch_image(f"{IMG}/w780{item['poster_path']}", item_path / "poster.jpg")
        if item.get("backdrop_path"):
            fetch_image(f"{IMG}/w1920{item['backdrop_path']}", item_path / "fanart.jpg")

    if __name__ == "__main__":
        main()

  # =========================================================================
  # episode_sidecar.py — per-EPISODE .nfo writer for ONE show (dry-run default)
  # =========================================================================
  # NOT a mode of sidecar.py, deliberately. sidecar.py unlinks every .nfo in
  # its target folder before writing one file, so pointing it at a show wipes
  # the series sidecar and writes zero episode NFOs. This script never
  # deletes, never touches series-level artefacts, and writes nothing at all
  # unless DRY_RUN=0 is passed explicitly.
  # =========================================================================
  episode_sidecar.py: |
    """Write one `.nfo` beside each episode file of ONE TV show, from TMDb.

    DRY-RUN BY DEFAULT — set DRY_RUN=0 to actually write.

    Why this is a separate script and not a mode of `sidecar.py`: `sidecar.py`
    unlinks EVERY `.nfo` in its target folder before writing its single
    `<folder>.nfo` / `tvshow.nfo`. Pointed at a show it would destroy the
    series-level sidecar (series compliance is currently 100%) and write zero
    episode NFOs. `sidecar.py` must never be used for episode work. This script
    therefore never deletes anything and never touches series-level files.

    Required env:
      SHOW_PATH        absolute path of ONE show folder, a direct child of
                       `<MEDIA_ROOT>/TV Shows`
      TMDB_API_KEY     **v3 key** (32-char hex). The v4 Bearer JWT returns 401
                       when passed as `?api_key=`.

    Optional env:
      DRY_RUN          "1" (default) — log only, write nothing. "0" — write.
      OVERWRITE        "0" (default) — never replace an existing episode .nfo.
      TMDB_ID          skip series resolution, use this TMDb tv id directly
      TMDB_QUERY       explicit series title. Hand-format it (periods, spaces,
                       umlauts) — TMDb's TV index is brittle and the umlaut
                       ladder only runs on the tmdb_smart() path. Unset falls
                       back to common.tmdb_smart() on the folder name.

    Invariants (these are the review criteria — do not relax them):
      * never deletes, truncates, renames or moves anything
      * only ever creates `<episode basename>.nfo` beside its own media file
      * never touches tvshow.nfo / poster.jpg / fanart.jpg / banner.jpg
      * one show per invocation, so the batch boundary is the rollback boundary
      * never guesses a season/episode number — unparsable files are counted
    """
    import json
    import os
    import sys
    from pathlib import Path
    sys.path.insert(0, "/app")
    from common import (
        EP_RE, SECTIONS, anon_path, assert_safe_target, http_get, log_event,
        tmdb_best_match, tmdb_search, tmdb_smart,
    )

    VIDEO_EXT = {".mkv", ".mp4", ".avi", ".m4v"}
    # Series-level artefacts this script must never write, whatever the input.
    PROTECTED_NAMES = {"tvshow.nfo", "poster.jpg", "fanart.jpg", "banner.jpg",
                       "movie.nfo", "artist.nfo", "folder.jpg", "backdrop.jpg"}


    def esc(s) -> str:
        """Minimal XML escaping. `&` MUST be replaced first."""
        return (s or "").replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;")


    def env_true(name: str, default: str) -> bool:
        return os.environ.get(name, default).strip().lower() in {"1", "true", "yes", "on"}


    def _season_call(tv_id: int, season_no: int, key: str, lang: str | None) -> dict:
        """One `/tv/{id}/season/{n}` call. Returns {episode_number: record}."""
        url = f"https://api.themoviedb.org/3/tv/{tv_id}/season/{season_no}?api_key={key}"
        if lang:
            url += f"&language={lang}"
        body = http_get(url)
        if not body:
            return {}
        try:
            data = json.loads(body)
        except (json.JSONDecodeError, ValueError):
            return {}
        out = {}
        for e in data.get("episodes") or []:
            n = e.get("episode_number")
            if n is None:
                continue
            try:
                out[int(n)] = e
            except (TypeError, ValueError):
                continue
        return out


    def fetch_season(tv_id: int, season_no: int, key: str) -> dict:
        """German-first season fetch, English filling any gap left by de-DE.

        TMDb returns the season with empty `name`/`overview` strings when a
        German translation is missing, so a de-DE-only fetch silently produces
        title-less episodes. Merge per field instead.
        """
        merged: dict = {}
        for lang in ("de-DE", None):
            for n, e in _season_call(tv_id, season_no, key, lang).items():
                cur = merged.setdefault(n, {})
                for field in ("name", "air_date", "overview", "id"):
                    if not cur.get(field) and e.get(field):
                        cur[field] = e[field]
        return merged


    def build_nfo(season: int, episode: int, ep: dict) -> str:
        lines = [
            "<episodedetails>",
            f"  <title>{esc(ep.get('name'))}</title>",
            f"  <season>{season}</season>",
            f"  <episode>{episode}</episode>",
            f"  <aired>{esc((ep.get('air_date') or ''))}</aired>",
        ]
        if ep.get("overview"):
            lines.append(f"  <plot>{esc(ep.get('overview'))}</plot>")
        if ep.get("id"):
            lines.append(f'  <uniqueid type="tmdb">{esc(str(ep.get("id")))}</uniqueid>')
        lines.append("</episodedetails>")
        return "\n".join(lines) + "\n"


    def write_episode_nfo(target: Path, show_path: Path, season: int, episode: int,
                          ep: dict, dry_run: bool) -> str:
        """Return "wrote" | "would" | "refused". Creates nothing in dry-run."""
        # Guards re-evaluated on every single write. Cheap; the share is
        # catastrophic-class (docs/sops/storage-safety.md).
        if target.suffix.lower() != ".nfo":
            log_event("refused-not-nfo", severity="error", path=anon_path(target))
            return "refused"
        if target.name.lower() in PROTECTED_NAMES:
            log_event("refused-protected-name", severity="error", path=anon_path(target))
            return "refused"
        try:
            target.resolve().relative_to(show_path.resolve())
        except ValueError:
            log_event("refused-outside-show", severity="error", path=anon_path(target))
            return "refused"

        body = build_nfo(season, episode, ep)
        if dry_run:
            log_event("would-write-nfo", path=anon_path(target), season=season,
                      episode=episode, bytes=len(body.encode("utf-8")))
            return "would"
        target.write_text(body, encoding="utf-8")
        log_event("nfo-written", path=anon_path(target), season=season, episode=episode)
        return "wrote"


    def main():
        show_path = Path(os.environ.get("SHOW_PATH", ""))
        key = os.environ.get("TMDB_API_KEY", "")
        if not os.environ.get("SHOW_PATH") or not key:
            sys.exit("REFUSED: missing SHOW_PATH or TMDB_API_KEY")
        # Default-on: anything other than an explicit falsey value keeps dry-run.
        dry_run = os.environ.get("DRY_RUN", "1").strip().lower() not in {"0", "false", "no", "off"}
        overwrite = env_true("OVERWRITE", "0")

        assert_safe_target(show_path)
        tv_root = SECTIONS["tv"].resolve()
        resolved = show_path.resolve()
        if resolved.parent != tv_root:
            sys.exit("REFUSED: SHOW_PATH must be a single show folder directly under the TV section")
        if not show_path.is_dir():
            sys.exit("REFUSED: SHOW_PATH does not exist or is not a directory")

        log_event("episode-sidecar-start", dry_run=dry_run, overwrite=overwrite,
                  path=anon_path(show_path))

        # ---- resolve the series once -------------------------------------
        tmdb_id_env = os.environ.get("TMDB_ID", "").strip()
        query = os.environ.get("TMDB_QUERY", "").strip()
        if tmdb_id_env.isdigit():
            tv_id = int(tmdb_id_env)
            log_event("series-resolved", source="env-id")
        else:
            if query:
                results = (tmdb_search("tv", query, None, "de-DE", key)
                           or tmdb_search("tv", query, None, None, key))
                item = tmdb_best_match(query, results)
            else:
                item = tmdb_smart("tv", show_path.name, key)
            if not item or not item.get("id"):
                # Soft outcome — the audit surfaces the missing sidecars. A Job
                # failure per TMDb miss is pager noise.
                log_event("tmdb-no-match", severity="warn", scope="series")
                log_event("episode-sidecar-summary", dry_run=dry_run, media_files=0,
                          written=0, would_write=0, skipped_existing=0, unparsed=0,
                          no_match=0, errors=0)
                return
            tv_id = int(item["id"])
            log_event("series-resolved", source="query" if query else "folder-name")

        # ---- collect episodes on disk ------------------------------------
        media = sorted(f for f in show_path.rglob("*")
                       if f.is_file() and f.suffix.lower() in VIDEO_EXT)
        parsed, unparsed = [], 0
        for f in media:
            m = EP_RE.search(f.stem)
            if not m:
                unparsed += 1
                log_event("episode-unparsed", severity="warn", path=anon_path(f))
                continue
            parsed.append((int(m.group(1)), int(m.group(2)), f))

        season_cache: dict = {}
        written = would_write = skipped_existing = no_match = errors = 0
        for season, episode, f in parsed:
            # `with_suffix(".nfo")` is exactly what audit.py checks for.
            target = f.with_suffix(".nfo")
            if target.exists() and not overwrite:
                skipped_existing += 1
                continue
            if season not in season_cache:
                season_cache[season] = fetch_season(tv_id, season, key)
                log_event("season-fetched", season=season,
                          episodes=len(season_cache[season]))
            ep = season_cache[season].get(episode)
            if not ep or not (ep.get("name") or "").strip():
                no_match += 1
                log_event("episode-no-match", severity="warn", season=season,
                          episode=episode)
                continue
            try:
                outcome = write_episode_nfo(target, show_path, season, episode, ep, dry_run)
            except OSError as e:
                errors += 1
                log_event("nfo-write-error", severity="error",
                          error=type(e).__name__, path=anon_path(target))
                continue
            if outcome == "wrote":
                written += 1
            elif outcome == "would":
                would_write += 1
            else:
                errors += 1

        log_event("episode-sidecar-summary", dry_run=dry_run, media_files=len(media),
                  written=written, would_write=would_write,
                  skipped_existing=skipped_existing, unparsed=unparsed,
                  no_match=no_match, errors=errors)
        # Always exit 0 on soft outcomes (no TMDb match, unparsable filenames) —
        # same convention as sidecar.py / audit.py.
        sys.exit(0)


    if __name__ == "__main__":
        main()

  # =========================================================================
  # cleanup_nfos.py — delete redundant `movie.nfo` next to `<folder>.nfo`
  # =========================================================================
  # Plex/Jellyfin auto-write `movie.nfo` during library scans alongside any
  # existing `<folder>.nfo`. Both readers tolerate either, but having both
  # creates drift over time. This script keeps `<folder>.nfo` (the SOP
  # canonical) and removes the auto-generated duplicate.
  #
  # Read-only walk: each Movies/<X>/ folder, if both `<X>.nfo` and `movie.nfo`
  # exist, delete `movie.nfo`.
  # =========================================================================
  # =========================================================================
  # metadata_coverage.py — server-side metadata coverage check
  # =========================================================================
  # Queries Plex (per section) + Jellyfin and reports coverage %.
  # On-disk audit (audit.py) shows nfo/poster files exist; this shows whether
  # Plex/Jellyfin actually parsed + indexed them. Result emitted as JSON on
  # last stdout line; dashboard reads via kubectl-equivalent API.
  # =========================================================================
  metadata_coverage.py: |
    """Plex + Jellyfin server-side metadata coverage report.

    Required env (from media-manager-tokens secret):
      PLEX_URL, PLEX_TOKEN, PLEX_SECTION_IDS  (comma-separated)
      JELLYFIN_URL, JELLYFIN_API_KEY

    Output: structured log lines (`coverage-section`, `coverage-jellyfin`)
    AND a final compact JSON on the last stdout line that the dashboard
    parses. Dashboard reads via pod-log kubectl API.
    """
    import json, os, sys, time, urllib.request, urllib.error
    sys.path.insert(0, "/app")
    from common import log_event

    def http_get_json(url, headers=None):
        req = urllib.request.Request(url, headers=headers or {})
        try:
            with urllib.request.urlopen(req, timeout=30) as r:
                if r.status != 200: return None
                return json.loads(r.read())
        except urllib.error.HTTPError as e:
            log_event("coverage-http-error", severity="warn", code=e.code)
            return None
        except Exception as e:
            log_event("coverage-http-error", severity="warn", error=type(e).__name__)
            return None

    def plex_section(plex_url, token, sid):
        # Plex returns XML by default; ask for JSON via Accept header.
        url = f"{plex_url}/library/sections/{sid}/all?X-Plex-Token={token}"
        data = http_get_json(url, headers={"Accept": "application/json"})
        if not data:
            return None
        container = data.get("MediaContainer", {})
        items = container.get("Metadata", []) or []
        total = len(items)
        summary = sum(1 for i in items if (i.get("summary") or "").strip())
        thumb   = sum(1 for i in items if (i.get("thumb") or "").strip())
        art     = sum(1 for i in items if (i.get("art") or "").strip())
        title   = container.get("title1") or container.get("librarySectionTitle") or ""
        return {
            "section_id": sid,
            "title": title,
            "total": total,
            "with_summary": summary,
            "with_thumb": thumb,
            "with_art": art,
            "summary_pct": round(100*summary/total, 1) if total else 0.0,
            "thumb_pct":   round(100*thumb/total, 1)   if total else 0.0,
            "art_pct":     round(100*art/total, 1)     if total else 0.0,
        }

    def plex_unmatched(plex_url, token, sid):
        """Item count Plex marks as 'unmatched' in this section."""
        url = f"{plex_url}/library/sections/{sid}/all?unmatched=1&X-Plex-Token={token}"
        data = http_get_json(url, headers={"Accept": "application/json"})
        if not data:
            return 0
        return len(data.get("MediaContainer", {}).get("Metadata", []) or [])

    def jellyfin_items(jf_url, key):
        # Jellyfin: query Items recursively, including Movies + Series at top level.
        url = (f"{jf_url}/Items?Recursive=true"
               f"&IncludeItemTypes=Movie,Series"
               f"&Fields=Overview,ImageTags,BackdropImageTags"
               f"&Limit=10000")
        data = http_get_json(url, headers={"Authorization": f'MediaBrowser Token="{key}"'})
        if not data:
            return None
        items = data.get("Items", []) or []
        total = len(items)
        overview = sum(1 for i in items if (i.get("Overview") or "").strip())
        primary  = sum(1 for i in items if (i.get("ImageTags") or {}).get("Primary"))
        backdrop = sum(1 for i in items if i.get("BackdropImageTags"))
        return {
            "total":               total,
            "with_overview":       overview,
            "with_primary_image":  primary,
            "with_backdrop_image": backdrop,
            "overview_pct":  round(100*overview/total, 1) if total else 0.0,
            "primary_pct":   round(100*primary/total, 1)  if total else 0.0,
            "backdrop_pct":  round(100*backdrop/total, 1) if total else 0.0,
        }

    def main():
        plex_url = os.environ.get("PLEX_URL", "http://plex-plex-media-server.media.svc.cluster.local:32400")
        plex_token = os.environ.get("PLEX_TOKEN", "")
        plex_sids = [s.strip() for s in os.environ.get("PLEX_SECTION_IDS", "").split(",") if s.strip()]
        jf_url = os.environ.get("JELLYFIN_URL", "http://jellyfin.media.svc.cluster.local:8096")
        jf_key = os.environ.get("JELLYFIN_API_KEY", "")

        result = {"timestamp": int(time.time()), "plex": [], "jellyfin": None}

        if plex_token and plex_sids:
            for sid in plex_sids:
                sec = plex_section(plex_url, plex_token, sid)
                if sec:
                    sec["unmatched"] = plex_unmatched(plex_url, plex_token, sid)
                    result["plex"].append(sec)
                    log_event("coverage-section", server="plex", **{
                        k: v for k, v in sec.items() if k != "title"
                    })
        else:
            log_event("coverage-skipped", server="plex", reason="missing-token-or-sections", severity="warn")

        if jf_key:
            jf = jellyfin_items(jf_url, jf_key)
            if jf:
                result["jellyfin"] = jf
                log_event("coverage-jellyfin", **jf)
        else:
            log_event("coverage-skipped", server="jellyfin", reason="missing-key", severity="warn")

        # Final line: compact JSON that the dashboard parses
        print("COVERAGE_RESULT_JSON " + json.dumps(result, separators=(',', ':')))

    if __name__ == "__main__":
        main()

  cleanup_nfos.py: |
    """Periodic cleanup: delete redundant `movie.nfo` Plex/Jellyfin auto-writes.

    No env required. Safe by construction:
      - Only deletes the literal filename `movie.nfo`
      - Only when a sibling `<folder>.nfo` exists in the same directory
      - Only inside MEDIA_ROOT/Movies (skips _* folders)
      - Reports counts; never lists titles
    """
    import os, sys
    from pathlib import Path
    sys.path.insert(0, "/app")
    from common import SECTIONS, log, log_event

    def main():
        root = SECTIONS["movies"]
        if not root.is_dir():
            sys.exit("REFUSED: Movies section root missing")
        deleted = inspected = 0
        for d in sorted(os.listdir(root)):
            full = root / d
            if not full.is_dir() or d.startswith('_'):
                continue
            inspected += 1
            movie_nfo = full / "movie.nfo"
            folder_nfo = full / f"{d}.nfo"
            if movie_nfo.exists() and folder_nfo.exists():
                try:
                    movie_nfo.unlink()
                    deleted += 1
                except OSError as e:
                    log_event("nfo-cleanup-fail", severity="warn", error=type(e).__name__)
        log_event("nfo-cleanup-done", inspected=inspected, deleted=deleted)
        log(f"Deleted {deleted} redundant movie.nfo files (kept canonical <folder>.nfo)")
        sys.exit(0)

    if __name__ == "__main__":
        main()

  # =========================================================================
  # per_item_refresh.py — nudge Plex/Jellyfin to re-fetch metadata for items
  # that are missing summary / poster / backdrop server-side.
  # =========================================================================
  # metadata_coverage.py reports % coverage; this script acts on the gap.
  # It lists items missing art/overview and fires per-item refresh requests:
  #   Plex:     PUT /library/metadata/{ratingKey}/refresh?force=1
  #   Jellyfin: POST /Items/{Id}/Refresh?MetadataRefreshMode=FullRefresh
  #                                      &ImageRefreshMode=FullRefresh
  # No on-disk writes; only API calls. Output: structured log events + counts.
  # =========================================================================
  per_item_refresh.py: |
    """Per-item metadata refresh for items missing art/overview server-side.

    Required env (from media-manager-tokens secret, all optional — script
    skips a server cleanly if its credentials are absent):
      PLEX_URL, PLEX_TOKEN, PLEX_SECTION_IDS  (comma-separated)
      JELLYFIN_URL, JELLYFIN_API_KEY

    Tunables:
      MAX_REFRESH_PER_RUN  (default 200) — cap per-server to avoid storms
      DRY_RUN              ("1" to skip POSTs and only log what would fire)
      REFRESH_SKIP_ART_ONLY ("1" default) — skip items whose ONLY missing
                       field is the backdrop/art image. See below.

    Why REFRESH_SKIP_ART_ONLY exists (2026-08-15):
    A FullRefresh cannot create an image the upstream provider does not have.
    A small tail of obscure items (documentaries, shorts) have `backdrop_path:
    None` on TMDb with zero backdrops in any language — no amount of refreshing
    will ever populate them. Left unfiltered, those items are re-detected as
    "missing backdrop" on every run and re-refreshed every 6h forever. That
    loop is not harmless: a Jellyfin FullRefresh rewrites `movie.nfo` next to
    the media file, so it continuously regenerates the redundant `movie.nfo`
    sidecars that `media-cleanup-nfos` then deletes weekly — the two CronJobs
    fight each other indefinitely.

    Items missing `overview`/`summary` or the primary/thumb poster are still
    refreshed — those are genuinely fixable. Only the art-only case is skipped,
    because it is the one that cannot be fixed by retrying. The gap stays
    VISIBLE: `media-metadata-coverage` continues to measure and report
    backdrop_pct, so this suppresses pointless write traffic, not the metric.
    Per docs/sops/media-library-standards.md the repair-pass rule for art the
    upstream simply lacks is to record it as "best available", not to retry.
    """
    import json
    import os
    import sys
    import time
    import urllib.error
    import urllib.request
    sys.path.insert(0, "/app")
    from common import log, log_event

    DEFAULT_CAP = 200

    # Missing-field names that represent the backdrop/art image on each server.
    # An item whose missing set is a SUBSET of these is an upstream-gap item:
    # retrying cannot fix it. Keyed per-server because the field names differ.
    ART_ONLY_FIELDS = {
        "plex":     {"art"},
        "jellyfin": {"backdrop"},
    }

    def _art_only(missing, server):
        """True if the item is missing nothing except the backdrop/art image."""
        return bool(missing) and set(missing) <= ART_ONLY_FIELDS[server]

    def _http(url, method="GET", headers=None, timeout=30):
        req = urllib.request.Request(url, headers=headers or {}, method=method)
        try:
            with urllib.request.urlopen(req, timeout=timeout) as r:
                body = r.read()
                return r.status, body
        except urllib.error.HTTPError as e:
            return e.code, b""
        except Exception as e:
            log_event("refresh-http-error", severity="warn",
                      method=method, error=type(e).__name__)
            return 0, b""

    def get_json(url, headers=None):
        status, body = _http(url, "GET", headers)
        if status != 200 or not body:
            return None
        try:
            return json.loads(body)
        except Exception:
            return None

    # ---- Plex --------------------------------------------------------------
    def plex_missing_in_section(plex_url, token, sid):
        """Yield (ratingKey, missing_fields) for items missing art/summary."""
        url = f"{plex_url}/library/sections/{sid}/all?X-Plex-Token={token}"
        data = get_json(url, headers={"Accept": "application/json"})
        if not data:
            return
        for item in (data.get("MediaContainer", {}).get("Metadata") or []):
            rk = item.get("ratingKey")
            if not rk:
                continue
            missing = []
            if not (item.get("summary") or "").strip():
                missing.append("summary")
            if not (item.get("thumb") or "").strip():
                missing.append("thumb")
            if not (item.get("art") or "").strip():
                missing.append("art")
            if missing:
                yield rk, missing

    def plex_refresh(plex_url, token, rk):
        url = f"{plex_url}/library/metadata/{rk}/refresh?force=1&X-Plex-Token={token}"
        status, _ = _http(url, "PUT")
        return status

    # ---- Jellyfin ----------------------------------------------------------
    def jellyfin_missing(jf_url, key):
        """Yield (item_id, missing_fields) for items missing overview/art/backdrop."""
        url = (f"{jf_url}/Items?Recursive=true"
               f"&IncludeItemTypes=Movie,Series"
               f"&Fields=Overview,ImageTags,BackdropImageTags"
               f"&Limit=10000")
        data = get_json(url, headers={"Authorization": f'MediaBrowser Token="{key}"'})
        if not data:
            return
        for item in (data.get("Items") or []):
            iid = item.get("Id")
            if not iid:
                continue
            missing = []
            if not (item.get("Overview") or "").strip():
                missing.append("overview")
            if not (item.get("ImageTags") or {}).get("Primary"):
                missing.append("primary")
            if not item.get("BackdropImageTags"):
                missing.append("backdrop")
            if missing:
                yield iid, missing

    def jellyfin_refresh(jf_url, key, iid):
        url = (f"{jf_url}/Items/{iid}/Refresh"
               f"?MetadataRefreshMode=FullRefresh"
               f"&ImageRefreshMode=FullRefresh")
        status, _ = _http(url, "POST", headers={"Authorization": f'MediaBrowser Token="{key}"'})
        return status

    # ---- main --------------------------------------------------------------
    def main():
        plex_url   = os.environ.get("PLEX_URL", "http://plex-plex-media-server.media.svc.cluster.local:32400")
        plex_token = os.environ.get("PLEX_TOKEN", "")
        plex_sids  = [s.strip() for s in os.environ.get("PLEX_SECTION_IDS", "").split(",") if s.strip()]
        jf_url     = os.environ.get("JELLYFIN_URL", "http://jellyfin.media.svc.cluster.local:8096")
        jf_key     = os.environ.get("JELLYFIN_API_KEY", "")
        cap        = int(os.environ.get("MAX_REFRESH_PER_RUN", str(DEFAULT_CAP)))
        dry_run    = os.environ.get("DRY_RUN", "0") == "1"
        skip_art   = os.environ.get("REFRESH_SKIP_ART_ONLY", "1") == "1"

        plex_total = plex_fired = plex_failed = plex_skipped = 0
        if plex_token and plex_sids:
            for sid in plex_sids:
                section_fired = 0
                for rk, missing in plex_missing_in_section(plex_url, plex_token, sid):
                    plex_total += 1
                    if skip_art and _art_only(missing, "plex"):
                        plex_skipped += 1
                        continue
                    if section_fired >= cap:
                        continue
                    if dry_run:
                        plex_fired += 1
                        section_fired += 1
                        continue
                    status = plex_refresh(plex_url, plex_token, rk)
                    if 200 <= status < 300:
                        plex_fired += 1
                        section_fired += 1
                    else:
                        plex_failed += 1
                        log_event("plex-refresh-fail", severity="warn",
                                  section=sid, status=status)
                    # gentle pacing — 50/s upper bound is generous; 20/s plenty.
                    time.sleep(0.05)
                log_event("plex-refresh-section-done",
                          section=sid, fired=section_fired,
                          missing=plex_total, skipped_art_only=plex_skipped,
                          dry_run=dry_run)
        else:
            log_event("plex-refresh-skipped", severity="warn",
                      reason="missing-token-or-sections")

        jf_total = jf_fired = jf_failed = jf_skipped = 0
        if jf_key:
            for iid, missing in jellyfin_missing(jf_url, jf_key):
                jf_total += 1
                if skip_art and _art_only(missing, "jellyfin"):
                    jf_skipped += 1
                    continue
                if jf_fired >= cap:
                    continue
                if dry_run:
                    jf_fired += 1
                    continue
                status = jellyfin_refresh(jf_url, jf_key, iid)
                if 200 <= status < 300:
                    jf_fired += 1
                else:
                    jf_failed += 1
                    log_event("jellyfin-refresh-fail", severity="warn", status=status)
                time.sleep(0.05)
            log_event("jellyfin-refresh-done",
                      missing=jf_total, fired=jf_fired,
                      failed=jf_failed, skipped_art_only=jf_skipped,
                      dry_run=dry_run)
        else:
            log_event("jellyfin-refresh-skipped", severity="warn",
                      reason="missing-key")

        log(f"Plex: fired refresh on {plex_fired}/{plex_total} "
            f"(failed={plex_failed}, skipped_art_only={plex_skipped}); "
            f"Jellyfin: fired {jf_fired}/{jf_total} "
            f"(failed={jf_failed}, skipped_art_only={jf_skipped}); "
            f"cap={cap} dry_run={dry_run} skip_art_only={skip_art}")
        # Soft-success even if some refreshes failed — alerting belongs in
        # the coverage CronJob's Prometheus rule, not in this Job's exit code.
        sys.exit(0)

    if __name__ == "__main__":
        main()

  # =========================================================================
  # plex_fs_classifier.py — classify the gap between FS Movies/* and Plex
  # =========================================================================
  # Read-only. Walks Movies/ on disk, queries Plex section 1 with
  # `?includeFiles=1`, and emits structured log events for each category:
  #   - multi_part_collapse  (cd1/cd2 split files Plex collapsed to one item)
  #   - skip_dir_leftover    (`_duplicates/`, `_archive/`, etc. seen by Plex)
  #   - unmatched            (Plex has the item but couldn't match metadata)
  #   - no_resolvable_path   (Plex item has no Part.file — orphaned metadata)
  #   - loose_mkv_at_root    (Movies/<file>.mkv with no folder — flat layout)
  #   - bundled_extra_subdir (Movies/<title>/<extras>/... non-canonical)
  # Output: per-category counts only. NO titles emitted (public-repo rule).
  # =========================================================================
  plex_fs_classifier.py: |
    """Classify the gap between Movies/ on disk and Plex's view of section 1.

    Read-only on both filesystem and Plex API. No mutations.

    Required env:
      PLEX_URL, PLEX_TOKEN, PLEX_MOVIES_SECTION_ID  (default "1")
      MEDIA_ROOT  (default /data/data — set by CronJob spec)

    Output: structured log lines (one per category) and a summary line.
    Logs only counts and category names; never names items.
    """
    import json
    import os
    import sys
    import urllib.error
    import urllib.request
    from pathlib import Path
    sys.path.insert(0, "/app")
    from common import SECTIONS, log, log_event

    MEDIA_EXTS = {".mkv", ".mp4", ".avi", ".m4v", ".mov", ".wmv"}
    SKIP_DIR_PREFIX = "_"

    def http_get_json(url, headers=None):
        req = urllib.request.Request(url, headers=headers or {})
        try:
            with urllib.request.urlopen(req, timeout=60) as r:
                if r.status != 200:
                    return None
                return json.loads(r.read())
        except urllib.error.HTTPError as e:
            log_event("classifier-http-error", severity="warn", code=e.code)
            return None
        except Exception as e:
            log_event("classifier-http-error", severity="warn", error=type(e).__name__)
            return None

    def fs_inventory(movies_root: Path):
        """Walk Movies/ and bucket entries.

        Returns (folders, loose_files, skip_dirs) where:
          - folders: {Path -> [media file paths inside]}
          - loose_files: [Path] — .mkv etc directly under Movies/ (flat leftover)
          - skip_dirs: [Path] — `_duplicates/` etc.
        """
        folders, loose_files, skip_dirs = {}, [], []
        if not movies_root.is_dir():
            return folders, loose_files, skip_dirs
        for entry in sorted(movies_root.iterdir()):
            if entry.is_dir():
                if entry.name.startswith(SKIP_DIR_PREFIX):
                    skip_dirs.append(entry)
                    continue
                inner = []
                for f in entry.rglob("*"):
                    if f.is_file() and f.suffix.lower() in MEDIA_EXTS:
                        inner.append(f)
                folders[entry] = inner
            elif entry.is_file() and entry.suffix.lower() in MEDIA_EXTS:
                loose_files.append(entry)
        return folders, loose_files, skip_dirs

    def plex_items_with_files(plex_url, token, sid):
        """Return list of items with their resolved Part.file paths.

        Each entry: {"ratingKey": str, "files": [str], "title_present": bool,
                     "guid_present": bool}
        """
        url = (f"{plex_url}/library/sections/{sid}/all"
               f"?includeFiles=1&X-Plex-Token={token}")
        data = http_get_json(url, headers={"Accept": "application/json"})
        if not data:
            return []
        out = []
        for item in (data.get("MediaContainer", {}).get("Metadata") or []):
            files = []
            for media in (item.get("Media") or []):
                for part in (media.get("Part") or []):
                    f = part.get("file")
                    if f:
                        files.append(f)
            out.append({
                "ratingKey":     item.get("ratingKey", ""),
                "files":         files,
                "title_present": bool((item.get("title") or "").strip()),
                "guid_present":  bool((item.get("guid")  or "").strip()),
            })
        return out

    def plex_unmatched(plex_url, token, sid):
        url = f"{plex_url}/library/sections/{sid}/all?unmatched=1&X-Plex-Token={token}"
        data = http_get_json(url, headers={"Accept": "application/json"})
        if not data:
            return 0
        return len(data.get("MediaContainer", {}).get("Metadata") or [])

    def main():
        plex_url   = os.environ.get("PLEX_URL", "http://plex-plex-media-server.media.svc.cluster.local:32400")
        plex_token = os.environ.get("PLEX_TOKEN", "")
        sid        = os.environ.get("PLEX_MOVIES_SECTION_ID", "1")
        movies     = SECTIONS["movies"]

        if not plex_token:
            log_event("classifier-skipped", severity="warn", reason="missing-plex-token")
            sys.exit(0)

        folders, loose_files, skip_dirs = fs_inventory(movies)
        plex_items = plex_items_with_files(plex_url, plex_token, sid)
        unmatched_count = plex_unmatched(plex_url, plex_token, sid)

        # Build path index from Plex side. Plex's Part.file is the absolute
        # path inside Plex's mount (`/data/data/Movies/...`). Compare against
        # our equivalent local Path. Since both use MEDIA_ROOT, Plex paths
        # should already start with str(MEDIA_ROOT).
        plex_paths = set()
        no_resolvable_path = 0
        multi_part_collapse = 0
        for it in plex_items:
            if not it["files"]:
                no_resolvable_path += 1
                continue
            if len(it["files"]) > 1:
                multi_part_collapse += 1
            for f in it["files"]:
                plex_paths.add(os.path.normpath(f))

        # FS-side categories
        loose_mkv_at_root = len(loose_files)
        skip_dir_leftover = 0
        # If a skip-dir actually appears in any plex_paths file path, count it.
        for sd in skip_dirs:
            sd_str = str(sd) + os.sep
            if any(p.startswith(sd_str) for p in plex_paths):
                skip_dir_leftover += 1

        # Bundled-extra subdirs: any folder with media files at depth >1
        # (i.e. nested under a sub-subdir) not matching Plex multi-part naming.
        bundled_extra_subdir = 0
        for folder, files in folders.items():
            for f in files:
                # depth from folder root: how many extra path parts
                rel_parts = f.relative_to(folder).parts
                if len(rel_parts) > 1:
                    bundled_extra_subdir += 1
                    break  # one count per folder

        # FS items missing from Plex: folder media file path not in plex_paths
        fs_files_total = sum(len(v) for v in folders.values()) + loose_mkv_at_root
        fs_missing_in_plex = 0
        for folder, files in folders.items():
            for f in files:
                if os.path.normpath(str(f)) not in plex_paths:
                    fs_missing_in_plex += 1
        for f in loose_files:
            if os.path.normpath(str(f)) not in plex_paths:
                fs_missing_in_plex += 1

        # Plex items pointing at a file that no longer exists on disk (stale)
        plex_stale = sum(
            1 for p in plex_paths
            if not Path(p).exists()
        )

        log_event("classifier-fs",
                  folders=len(folders),
                  loose_mkv_at_root=loose_mkv_at_root,
                  skip_dirs=len(skip_dirs),
                  fs_files_total=fs_files_total)
        log_event("classifier-plex",
                  items=len(plex_items),
                  unmatched=unmatched_count,
                  no_resolvable_path=no_resolvable_path,
                  multi_part_collapse=multi_part_collapse,
                  stale_paths=plex_stale)
        log_event("classifier-gap",
                  fs_missing_in_plex=fs_missing_in_plex,
                  plex_stale_paths=plex_stale,
                  skip_dir_leftover=skip_dir_leftover,
                  bundled_extra_subdir=bundled_extra_subdir)

        log(f"FS folders={len(folders)} loose={loose_mkv_at_root} skip_dirs={len(skip_dirs)} | "
            f"Plex items={len(plex_items)} unmatched={unmatched_count} multi_part={multi_part_collapse} "
            f"no_path={no_resolvable_path} | gap fs_missing={fs_missing_in_plex} stale={plex_stale} "
            f"skip_leftover={skip_dir_leftover} bundled_extra={bundled_extra_subdir}")
        sys.exit(0)

    if __name__ == "__main__":
        main()

  # =========================================================================
  # intake.py — automatic JDownloader intake (CronJob media-intake-watcher)
  # =========================================================================
  intake.py: |
    """Automatic JDownloader intake: classify, dedupe, move, sidecar, clean up.

    Runs every 30 min as CronJob media-intake-watcher. SOP:
    docs/sops/media-library-standards.md "Automatic intake".

    Invariants (do not weaken):
      * RENAME ONLY. Media is never deleted and never overwritten. atomic_mv()
        refuses an existing destination and refuses a cross-device move. The
        only deletion is cleanup() of a fully-moved intake folder, and that
        refuses while any audio file or any non-sample video is still inside.
      * `_duplicates/` keeps every displaced file. A better-quality REPLACE is an
        ordered two-step group (organize.apply_group): the library copy goes to
        `_duplicates/` FIRST, then the new file takes its name; a failed second
        step rolls the first back.
      * Kill switch: INTAKE_APPLY=0 -> plan + log + metrics only, nothing on disk
        changes (not even the state file).
      * Safety stops: > INTAKE_MAX_ITEMS (50) items to act on -> whole run
        aborted before the first move; free space dropping by more than
        INTAKE_MAX_FREE_DROP_BYTES (1 GiB) during the run -> stop (a rename
        never consumes space, so a drop means something is copying).
      * Privacy: logs carry counts, outcome codes, anonymised paths and an 8-hex
        item id (sha1 of the name) — never a title. Same for metrics.

    Env:
      INTAKE_APPLY (default 0 here; the CronJob sets 1), INTAKE_MIN_AGE_MIN (30),
      INTAKE_MAX_ITEMS (50), INTAKE_MAX_FREE_DROP_BYTES (1073741824),
      INTAKE_RESCAN (1), INTAKE_SIDECARS (1), TMDB_API_KEY, PUSHGATEWAY_URL,
      INTAKE_METRICS_FILE (optional textfile copy), MEDIA_ROOT, JDOWNLOADER_ROOT.
    """
    import datetime
    import hashlib
    import json
    import os
    import re
    import shutil
    import subprocess
    import sys
    import time
    import urllib.request
    from collections import Counter
    from pathlib import Path

    APP_DIR = os.environ.get("APP_DIR", "/app")
    sys.path.insert(0, APP_DIR)
    import common as C  # noqa: E402
    from common import (  # noqa: E402
        log_event, anon_path, sanitize_name, MEDIA_ROOT, JDOWNLOADER_ROOT,
    )
    import organize  # noqa: E402
    import cleanup as CL  # noqa: E402

    VIDEO_EXT = CL.VIDEO_EXT
    AUDIO_EXT = CL.AUDIO_EXT
    SUB_EXT = {".srt", ".ass", ".ssa", ".sub", ".idx", ".vtt", ".sup"}
    COVER_NAMES = {"folder.jpg", "cover.jpg", "front.jpg", "folder.png", "cover.png"}
    INCOMPLETE_RE = re.compile(r"\.(rar|r\d{2}|part|partial|crdownload|jdtmp|tmp)$", re.I)
    EP_ANY_RE = re.compile(r"(?<![A-Za-z0-9])[Ss](\d{1,2})[ ._-]?[Ee](\d{2,3})(?![0-9])")
    MULTI_EP_RE = re.compile(r"[Ss]\d{1,2}[ ._-]?[Ee]\d{2,3}[ ._-]?-?[Ee]\d{2,3}")
    YEAR_ANY_RE = re.compile(r"(?<!\d)(19\d{2}|20\d{2})(?!\d)")
    SAMPLE_RE = re.compile(r"(^|[ ._\-/])(sample|trailer)([ ._\-/]|$)", re.I)
    DISC_DIR_RE = re.compile(r"^(?:cd|disc|disk)\s*[-_ ]?(\d{1,2})$", re.I)
    PART_RE = re.compile(r"[ ._-](cd|part|pt|disc)[ ._-]?\d", re.I)
    YOUTUBE_RE = re.compile(r"youtube|youtu\.be", re.I)

    SECTION_DIR = {"movie": "Movies", "tv": "TV Shows", "music": "Music"}


    def env_int(name, default):
        try:
            return int(os.environ.get(name, default))
        except ValueError:
            return default


    APPLY = os.environ.get("INTAKE_APPLY", "0") == "1"
    MIN_AGE_S = env_int("INTAKE_MIN_AGE_MIN", 30) * 60
    MAX_ITEMS = env_int("INTAKE_MAX_ITEMS", 50)
    MAX_FREE_DROP = env_int("INTAKE_MAX_FREE_DROP_BYTES", 1 << 30)
    RESCAN = os.environ.get("INTAKE_RESCAN", "1") == "1"
    SIDECARS = os.environ.get("INTAKE_SIDECARS", "1") == "1"
    TMDB_KEY = os.environ.get("TMDB_API_KEY", "")
    STATE_FILE = JDOWNLOADER_ROOT / ".intake-state.json"
    TODAY = datetime.date.today().isoformat()


    def item_id(name):
        return hashlib.sha1(name.encode("utf-8", "surrogateescape")).hexdigest()[:8]


    def norm(s):
        """Comparison key: casefold, umlauts folded, only alphanumerics."""
        s = s.casefold()
        for a, b in (("ä", "ae"), ("ö", "oe"), ("ü", "ue"), ("ß", "ss")):
            s = s.replace(a, b)
        return re.sub(r"[^0-9a-z]", "", s)


    # ---- injectable probes (tests replace these) ------------------------------
    def probe_video(path):
        return C.ffprobe(Path(path))


    def probe_audio(path):
        """{duration, bit_rate, size, tags{lowercase}, has_cover} or {}."""
        d = C.ffprobe_full(Path(path))
        if not d:
            return {}
        fmt = d.get("format", {})
        tags = {k.lower(): v for k, v in (fmt.get("tags") or {}).items()}
        for s in d.get("streams", []):
            if s.get("codec_type") == "audio":
                for k, v in (s.get("tags") or {}).items():
                    tags.setdefault(k.lower(), v)
        has_cover = any((s.get("disposition") or {}).get("attached_pic") == 1
                        for s in d.get("streams", []))
        return {"duration": float(fmt.get("duration") or 0),
                "bit_rate": int(fmt.get("bit_rate") or 0),
                "size": int(fmt.get("size") or 0),
                "width": 0, "height": 0, "fps": 0.0,
                "tags": tags, "has_cover": has_cover}


    def run_ffmpeg(args):
        try:
            r = subprocess.run([C.FFMPEG, "-v", "error", "-nostdin"] + args,
                               capture_output=True, timeout=600, check=False)
            return r.returncode == 0
        except Exception as e:
            log_event("ffmpeg-error", severity="warn", error=type(e).__name__)
            return False


    def tmdb_movie(title, year):
        """Confident TMDb match or None: same year AND normalized title equal."""
        if not TMDB_KEY:
            return None
        for q in dict.fromkeys([title, C.umlaut_fix(title)]):
            for lang in ("de-DE", None):
                res = C.tmdb_search("movie", q, year, lang, TMDB_KEY)
                for r in res:
                    ry = (r.get("release_date") or "")[:4]
                    if ry != str(year):
                        continue
                    if norm(q) in (norm(r.get("title") or ""), norm(r.get("original_title") or "")):
                        if lang is None:   # re-fetch German title for naming
                            de = C.tmdb_search("movie", q, year, "de-DE", TMDB_KEY)
                            r = next((x for x in de if x.get("id") == r.get("id")), r)
                        return r
        return None


    def tmdb_show(name):
        if not TMDB_KEY:
            return None
        for q in dict.fromkeys([name, C.umlaut_fix(name)]):
            for lang in ("de-DE", None):
                for r in C.tmdb_search("tv", q, None, lang, TMDB_KEY):
                    if norm(q) in (norm(r.get("name") or ""), norm(r.get("original_name") or "")):
                        return r
        return None


    def tmdb_episode_title(tv_id, season, episode):
        if not (TMDB_KEY and tv_id):
            return ""
        body = C.http_get(f"https://api.themoviedb.org/3/tv/{tv_id}/season/{season}/"
                          f"episode/{episode}?api_key={TMDB_KEY}&language=de-DE")
        try:
            name = (json.loads(body or b"{}").get("name") or "").strip()
        except ValueError:
            return ""
        if re.fullmatch(r"(episode|folge|episodio)\s*\d+", name, re.I):
            return ""
        return sanitize_name(name)


    # ---- enumeration + guards -------------------------------------------------
    def enumerate_items(root):
        items = []
        for e in sorted(root.iterdir()):
            if e.name.startswith((".", "_")):
                continue
            items.append(e)
        return items


    def walk_files(item):
        if item.is_file():
            return [item]
        out = []
        for dp, dn, fn in os.walk(item):
            dn[:] = [d for d in dn if not d.startswith(".")]
            out.extend(Path(dp) / f for f in fn if not f.startswith("."))
        return out


    def newest_mtime(item):
        t = item.stat().st_mtime
        if item.is_dir():
            for dp, dn, fn in os.walk(item):
                for x in dn + fn:
                    try:
                        t = max(t, (Path(dp) / x).stat().st_mtime)
                    except OSError:
                        pass
        return t


    def incomplete_reason(item, files, now):
        if any(INCOMPLETE_RE.search(f.name) for f in files):
            return "archive-or-partial"
        if now - newest_mtime(item) < MIN_AGE_S:
            return "recent-mtime"
        return None


    def is_sample(f, item):
        rel = str(f.relative_to(item)) if f != item else f.name
        return bool(SAMPLE_RE.search(rel)) and f.stat().st_size <= CL.SAMPLE_MAX_BYTES


    # ---- classification -------------------------------------------------------
    def split_movie_name(name):
        """(title, year) from a scene/folder name, or (None, None)."""
        stem = name
        matches = [m for m in YEAR_ANY_RE.finditer(stem) if m.start() > 0]
        if not matches:
            return None, None
        m = matches[-1]
        title, _ = C.clean_tmdb_query(stem[:m.start()])
        return (title or None), int(m.group(1))


    def show_from_name(stem):
        m = EP_ANY_RE.search(stem)
        if not m or m.start() == 0:
            return None
        title, _ = C.clean_tmdb_query(stem[:m.start()])
        return title or None


    def classify(item):
        files = walk_files(item)
        names = [item.name] + [f.name for f in files]
        if any(YOUTUBE_RE.search(n) or C.YT_ID_RE.search(n) for n in names):
            return {"kind": "ambiguous", "reason": "youtube"}
        videos = [f for f in files if f.suffix.lower() in VIDEO_EXT and not is_sample(f, item)]
        audios = [f for f in files if f.suffix.lower() in AUDIO_EXT]
        subs = [f for f in files if f.suffix.lower() in SUB_EXT]
        if videos and audios:
            return {"kind": "ambiguous", "reason": "mixed-audio-video"}
        if videos:
            eps = [(v, EP_ANY_RE.search(v.name)) for v in videos]
            if all(m for _, m in eps):
                if any(MULTI_EP_RE.search(v.name) for v in videos):
                    return {"kind": "ambiguous", "reason": "multi-episode-file"}
                shows = {norm(show_from_name(v.stem) or show_from_name(item.name) or "")
                         for v, _ in eps}
                show = show_from_name(videos[0].stem) or show_from_name(item.name)
                if not show or len(shows) != 1:
                    return {"kind": "ambiguous", "reason": "show-name-unclear"}
                episodes = [{"file": v, "season": int(m.group(1)), "episode": int(m.group(2))}
                            for v, m in eps]
                if len({(e["season"], e["episode"]) for e in episodes}) != len(episodes):
                    return {"kind": "ambiguous", "reason": "duplicate-episode-in-item"}
                return {"kind": "tv", "show": show, "episodes": episodes, "subs": subs}
            if any(m for _, m in eps):
                return {"kind": "ambiguous", "reason": "mixed-episode-and-other"}
            if len(videos) != 1:
                return {"kind": "ambiguous", "reason": "multiple-videos"}
            title, year = split_movie_name(item.name if item.is_dir() else item.stem)
            if not title:
                title, year = split_movie_name(videos[0].stem)
            if not title:
                return {"kind": "ambiguous", "reason": "no-year"}
            return {"kind": "movie", "title": title, "year": year,
                    "file": videos[0], "subs": subs}
        if audios:
            return {"kind": "music", "tracks": audios,
                    "covers": [f for f in files if f.name.lower() in COVER_NAMES]}
        return {"kind": "ambiguous", "reason": "no-media"}


    # ---- quality decision -----------------------------------------------------
    def decide(new, old):
        """identical | better | worse | ambiguous (rules: SOP 'Automatic intake')."""
        if not new or not old:
            return "ambiguous"
        key = lambda p: (p.get("width"), p.get("height"), round(p.get("fps", 0), 3),
                         round(p.get("duration", 0), 1), p.get("bit_rate"))
        if new.get("size") == old.get("size") and key(new) == key(old):
            return "identical"
        od, nd = old.get("duration", 0), new.get("duration", 0)
        if od <= 0 or abs(nd - od) / od > 0.02:
            return "ambiguous"
        if abs(new.get("fps", 0) - old.get("fps", 0)) >= 0.01:
            return "ambiguous"
        nres = new.get("width", 0) * new.get("height", 0)
        ores = old.get("width", 0) * old.get("height", 0)
        nbr, obr = new.get("bit_rate", 0), old.get("bit_rate", 0)
        if nres == 0 and ores == 0:        # audio: bitrate is the only axis
            if nbr > obr:
                return "better"
            if nbr < obr:
                return "worse"
            return "ambiguous"
        if nres > ores and nbr > obr:
            return "better"
        if nres < ores and nbr < obr:
            return "worse"
        return "ambiguous"


    # ---- library lookups ------------------------------------------------------
    def section(kind):
        return MEDIA_ROOT / SECTION_DIR[kind]


    def find_existing_dir(parent, wanted_names):
        """Existing child dir of `parent` whose norm() equals any wanted name
        (with or without a trailing ' (YYYY)')."""
        if not parent.is_dir():
            return None
        keys = {norm(w) for w in wanted_names if w}
        for d in parent.iterdir():
            if not d.is_dir() or d.name.startswith(("_", ".")):
                continue
            k = norm(d.name)
            k2 = norm(re.sub(r"\s*\((19|20)\d{2}\)$", "", d.name))
            if k in keys or k2 in keys:
                return d
        return None


    def main_videos(folder):
        if not folder.is_dir():
            return []
        return [f for f in folder.iterdir() if f.is_file() and f.suffix.lower() in VIDEO_EXT
                and not SAMPLE_RE.search(f.name)]


    def ep_key(name):
        m = EP_ANY_RE.search(name)
        return (int(m.group(1)), int(m.group(2))) if m else None


    def dup_target(kind, orig_name, *, show=None, season=None, item_label=None, artist=None):
        base = section(kind) / "_duplicates"
        if kind == "tv":
            d = base / show / f"Season {season:02d}"
        elif kind == "music":
            d = base / artist / f"{item_label} - intake dup {TODAY}"
        else:
            d = base / f"{item_label} - intake dup {TODAY}"
        t = d / orig_name
        n = 2
        while t.exists():
            t = d / f"{Path(orig_name).stem} ({n}){Path(orig_name).suffix}"
            n += 1
        return t


    def tvshow_tmdb_id(show_dir):
        nfo = show_dir / "tvshow.nfo"
        try:
            m = re.search(r'<uniqueid type="tmdb"[^>]*>(\d+)<', nfo.read_text(errors="ignore"))
            return int(m.group(1)) if m else None
        except OSError:
            return None


    # ---- planning -------------------------------------------------------------
    class Plan:
        def __init__(self, item):
            self.item = item
            self.groups = []        # organize groups
            self.group_outcome = {} # group id -> moved|duplicate|replaced|sidecar
            self.outcomes = Counter()
            self.ambiguous = []     # reasons for things left behind
            self.rescan = set()
            self.verify = []        # destinations cleanup must re-verify
            self.sidecars = []      # post-move sidecar tasks
            self.music = None       # music post-processing context
            self.needs_dupdir = set()

        def add(self, gid, moves, outcome, verify):
            gid = f"{item_id(self.item.name)}-{gid}"
            self.groups.append({"id": gid, "moves": moves})
            self.group_outcome[gid] = outcome
            self.outcomes[outcome] += 1
            self.verify.extend(verify)

        @property
        def acts(self):
            return bool(self.groups)


    def sub_moves(subs, video_stem_old, target_dir, target_stem):
        """Move subtitles whose name starts with the source video's stem."""
        out = []
        for s in subs:
            if s.name.startswith(video_stem_old):
                tail = s.name[len(video_stem_old):]
                dst = target_dir / f"{target_stem}{tail}"
                if not dst.exists():
                    out.append({"src": str(s), "dst": str(dst)})
        return out


    def plan_video(plan, kind, src, target_dir, target_stem, label, dup_kw, subs):
        """Common new/identical/better/worse handling for one video file."""
        existing = main_videos(target_dir)
        if kind == "tv":
            existing = [v for v in existing if ep_key(v.name) == ep_key(src.name)]
        dst = target_dir / f"{target_stem}{src.suffix.lower()}"
        if not existing:
            moves = [{"src": str(src), "dst": str(dst)}]
            moves += sub_moves(subs, src.stem, target_dir, target_stem)
            plan.add(label, moves, "moved", [dst])
            plan.rescan.add(str(target_dir))
            return "moved"
        if len(existing) > 1 or (kind == "movie" and any(PART_RE.search(v.stem) for v in existing)):
            plan.ambiguous.append("multiple-existing-copies")
            return "ambiguous"
        old = existing[0]
        verdict = decide(probe_video(src), probe_video(old))
        if verdict in ("identical", "worse"):
            d = dup_target(kind, src.name, **dup_kw)
            plan.needs_dupdir.add(kind)
            plan.add(label, [{"src": str(src), "dst": str(d)}], "duplicate", [d])
            return verdict
        if verdict == "better":
            d = dup_target(kind, old.name, **dup_kw)
            new_dst = old.with_suffix(src.suffix.lower())
            if new_dst != old and new_dst.exists():
                plan.ambiguous.append("replace-target-occupied")
                return "ambiguous"
            plan.needs_dupdir.add(kind)
            # ORDER IS LOAD-BEARING: displace the library copy first, then the
            # new file takes its name. organize.apply_group rolls step 1 back if
            # step 2 fails.
            plan.add(label, [{"src": str(old), "dst": str(d)},
                             {"src": str(src), "dst": str(new_dst)}], "replaced", [d, new_dst])
            plan.rescan.add(str(target_dir))
            return "replaced"
        plan.ambiguous.append("quality-undecidable")
        return "ambiguous"


    def plan_movie(plan, c):
        title, year = c["title"], c["year"]
        sec = section("movie")
        folder = find_existing_dir(sec, [f"{title} ({year})"])
        tm = None
        if not folder:
            tm = tmdb_movie(title, year)
            if not tm:
                plan.ambiguous.append("no-confident-tmdb-match" if TMDB_KEY else "no-tmdb-key")
                return
            folder = find_existing_dir(sec, [f"{tm.get('title')} ({year})",
                                             f"{tm.get('original_title')} ({year})"])
        new_folder = folder is None
        if new_folder:
            folder = sec / sanitize_name(f"{tm.get('title')} ({year})")
        label = folder.name
        plan_video(plan, "movie", c["file"], folder, label, "m",
                   {"item_label": label}, c["subs"])
        if new_folder and plan.acts:
            plan.sidecars.append({"script": "sidecar.py", "env": {
                "ITEM_PATH": str(folder), "ITEM_KIND": "movie",
                "TMDB_QUERY": tm.get("title") or title, "TMDB_YEAR": str(year)}})


    def plan_tv(plan, c):
        sec = section("tv")
        show_dir = find_existing_dir(sec, [c["show"]])
        tv_id = tvshow_tmdb_id(show_dir) if show_dir else None
        new_show = show_dir is None
        if new_show:
            tm = tmdb_show(c["show"])
            if not tm:
                plan.ambiguous.append("no-confident-tmdb-match" if TMDB_KEY else "no-tmdb-key")
                return
            tv_id = tm.get("id")
            show_dir = sec / sanitize_name(tm.get("name") or c["show"])
        show = show_dir.name
        for i, ep in enumerate(sorted(c["episodes"], key=lambda e: (e["season"], e["episode"]))):
            s, e = ep["season"], ep["episode"]
            season_dir = show_dir / f"Season {s:02d}"
            title = tmdb_episode_title(tv_id, s, e)
            stem = f"{show} - S{s:02d}E{e:02d}" + (f" - {title}" if title else "")
            plan_video(plan, "tv", ep["file"], season_dir, stem, f"e{i}",
                       {"show": show, "season": s}, c["subs"])
        if plan.acts:
            if new_show:
                plan.sidecars.append({"script": "sidecar.py", "env": {
                    "ITEM_PATH": str(show_dir), "ITEM_KIND": "show",
                    "TMDB_QUERY": show}})
            plan.sidecars.append({"script": "episode_sidecar.py", "env": {
                "SHOW_PATH": str(show_dir), "DRY_RUN": "0", "OVERWRITE": "0",
                **({"TMDB_ID": str(tv_id)} if tv_id else {})}})


    def _num(v):
        m = re.match(r"\s*(\d+)", str(v or ""))
        return int(m.group(1)) if m else None


    def _majority(values):
        vals = [v for v in values if v]
        if not vals:
            return None
        (top, n), = Counter(vals).most_common(1)
        return top if n * 2 > len(vals) else None


    def plan_music(plan, c):
        probes = {t: probe_audio(t) for t in c["tracks"]}
        if any(not p for p in probes.values()):
            plan.ambiguous.append("audio-probe-failed")
            return
        tags = {t: p["tags"] for t, p in probes.items()}
        albums = {(tg.get("album") or "").strip() for tg in tags.values()}
        if len(albums) != 1 or "" in albums:
            plan.ambiguous.append("album-tags-inconsistent")
            return
        album = albums.pop()
        aa = _majority([(tg.get("album_artist") or tg.get("albumartist") or "").strip()
                        for tg in tags.values()])
        if not aa:
            artists = {(tg.get("artist") or "").strip() for tg in tags.values()}
            aa = artists.pop() if len(artists) == 1 and "" not in artists else None
        if not aa:
            plan.ambiguous.append("album-artist-unclear")
            return
        year = _majority([(_num((tg.get("date") or tg.get("year") or "")[:4]) or None)
                          for tg in tags.values()])
        if not year or not (1900 <= year <= 2099):
            plan.ambiguous.append("album-year-missing")
            return
        tracks = []
        for t, tg in tags.items():
            n = _num(tg.get("track"))
            disc = _num(tg.get("disc"))
            if disc is None:
                m = DISC_DIR_RE.match(t.parent.name)
                disc = int(m.group(1)) if m else 1
            title = (tg.get("title") or "").strip()
            if not n or not title:
                plan.ambiguous.append("track-tags-missing")
                return
            tracks.append({"file": t, "track": n, "disc": disc, "title": title, "tags": tg})
        if len({(x["disc"], x["track"]) for x in tracks}) != len(tracks):
            plan.ambiguous.append("track-numbers-collide")
            return
        multi = max(x["disc"] for x in tracks) > 1
        discs = max(x["disc"] for x in tracks)
        sec = section("music")
        artist_dir = find_existing_dir(sec, [aa]) or sec / sanitize_name(aa)
        album_label = sanitize_name(f"{album} ({year})")
        album_dir = find_existing_dir(artist_dir, [f"{album} ({year})"]) or artist_dir / album_label
        for x in sorted(tracks, key=lambda x: (x["disc"], x["track"])):
            prefix = f"{x['disc']}-{x['track']:02d}" if multi else f"{x['track']:02d}"
            stem = sanitize_name(f"{prefix} - {x['title']}")
            dst = album_dir / f"{stem}{x['file'].suffix.lower()}"
            existing = [f for f in (album_dir.iterdir() if album_dir.is_dir() else [])
                        if f.suffix.lower() in AUDIO_EXT and f.name.startswith(prefix + " - ")]
            label = f"t{x['disc']}-{x['track']}"
            if not existing:
                plan.add(label, [{"src": str(x["file"]), "dst": str(dst)}], "moved", [dst])
                plan.rescan.add(str(album_dir))
                continue
            old = existing[0]
            verdict = decide(probes[x["file"]], probe_audio(old)) if len(existing) == 1 else "ambiguous"
            dkw = {"artist": artist_dir.name, "item_label": album_dir.name}
            if verdict in ("identical", "worse"):
                d = dup_target("music", x["file"].name, **dkw)
                plan.needs_dupdir.add("music")
                plan.add(label, [{"src": str(x["file"]), "dst": str(d)}], "duplicate", [d])
            elif verdict == "better":
                d = dup_target("music", old.name, **dkw)
                new_dst = old.with_suffix(x["file"].suffix.lower())
                if new_dst != old and new_dst.exists():
                    plan.ambiguous.append("replace-target-occupied")
                    continue
                plan.needs_dupdir.add("music")
                plan.add(label, [{"src": str(old), "dst": str(d)},
                                 {"src": str(x["file"]), "dst": str(new_dst)}], "replaced", [d, new_dst])
                plan.rescan.add(str(album_dir))
            else:
                plan.ambiguous.append("quality-undecidable")
        # Loose cover image -> folder.jpg (a move, never a delete).
        if (plan.outcomes["moved"] and not (album_dir / "folder.jpg").exists()):
            jpgs = [f for f in c["covers"] if f.suffix.lower() == ".jpg"]
            if jpgs:
                plan.add("cover", [{"src": str(jpgs[0]), "dst": str(album_dir / "folder.jpg")}],
                         "sidecar", [album_dir / "folder.jpg"])
        plan.music = {"album_dir": album_dir, "album": album, "artist": aa, "year": year,
                      "discs": discs, "tracks": tracks}


    # ---- music post-processing (apply only) -----------------------------------
    def fix_track_tags(t, album_artist, discs):
        """Rewrite album-artist / disc tags on the INTAKE copy before the move.
        Stream copy into a sibling temp file, verify, then rename over. The
        audio stream is not re-encoded; the track's display `artist` is kept."""
        tg = t["tags"]
        meta = []
        if (tg.get("album_artist") or tg.get("albumartist") or "").strip() != album_artist:
            meta += ["-metadata", f"album_artist={album_artist}"]
        if discs > 1 and _num(tg.get("disc")) != t["disc"]:
            meta += ["-metadata", f"disc={t['disc']}/{discs}"]
        if not meta:
            return False
        src = t["file"]
        tmp = src.with_name(f".tagfix-{item_id(src.name)}{src.suffix}")
        ok = run_ffmpeg(["-i", str(src), "-map", "0", "-c", "copy",
                         "-map_metadata", "0"] + meta + ["-y", str(tmp)])
        if ok and tmp.exists():
            a, b = probe_audio(src), probe_audio(tmp)
            if a and b and a["duration"] and abs(a["duration"] - b["duration"]) / a["duration"] < 0.005:
                os.replace(tmp, src)
                return True
        if tmp.exists():
            tmp.unlink()
        log_event("music-tagfix-skipped", severity="warn")
        return False


    def write_album_nfo(ctx):
        nfo = ctx["album_dir"] / "album.nfo"
        if nfo.exists():
            return
        esc = lambda s: (str(s).replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;"))
        nfo.write_text("<album>\n"
                       f"  <title>{esc(ctx['album'])}</title>\n"
                       f"  <artist>{esc(ctx['artist'])}</artist>\n"
                       f"  <albumartist>{esc(ctx['artist'])}</albumartist>\n"
                       f"  <year>{ctx['year']}</year>\n"
                       "</album>\n", encoding="utf-8")
        log_event("nfo-written", path=anon_path(nfo))


    def extract_cover(ctx):
        target = ctx["album_dir"] / "folder.jpg"
        if target.exists():
            return
        for f in sorted(ctx["album_dir"].iterdir()):
            if f.suffix.lower() in AUDIO_EXT and probe_audio(f).get("has_cover"):
                if run_ffmpeg(["-i", str(f), "-an", "-map", "0:v:0", "-frames:v", "1",
                               "-y", str(target)]) and target.exists():
                    log_event("cover-extracted", path=anon_path(target))
                return


    # ---- execution helpers ----------------------------------------------------
    def ensure_dup_dir(kind):
        """`_duplicates/` needs a .plexignore line at the section root and an
        empty `.ignore` inside for Jellyfin (SOP 'Duplicate quarantine')."""
        sec = section(kind)
        dup = sec / "_duplicates"
        dup.mkdir(parents=True, exist_ok=True)
        (dup / ".ignore").touch(exist_ok=True)
        pi = sec / ".plexignore"
        have = pi.read_text().splitlines() if pi.exists() else []
        add = [ln for ln in ("_duplicates/", "_duplicates/**") if ln not in have]
        if add:
            with pi.open("a") as fh:
                if have and have[-1] != "":
                    fh.write("\n")
                fh.write("\n".join(add) + "\n")


    def run_sidecar(task):
        env = dict(os.environ, **task["env"], TMDB_API_KEY=TMDB_KEY)
        try:
            r = subprocess.run([sys.executable, str(Path(APP_DIR) / task["script"])],
                               env=env, capture_output=True, timeout=900, check=False)
            # the child logs structured events only; pass them through
            sys.stdout.write(r.stdout.decode(errors="replace"))
            log_event("sidecar-run", script=task["script"], rc=r.returncode)
        except Exception as e:
            log_event("sidecar-error", severity="warn", error=type(e).__name__)


    def load_state():
        try:
            return json.loads(STATE_FILE.read_text())
        except (OSError, ValueError):
            return {"version": 1, "first_seen": {}, "failed": {}, "events": []}


    def save_state(state):
        tmp = STATE_FILE.with_name(STATE_FILE.name + ".tmp")
        tmp.write_text(json.dumps(state, sort_keys=True))
        os.replace(tmp, STATE_FILE)


    def free_bytes():
        return shutil.disk_usage(str(MEDIA_ROOT)).free


    def render_metrics(m):
        lines = []
        def g(name, help_, samples):
            lines.append(f"# HELP {name} {help_}")
            lines.append(f"# TYPE {name} gauge")
            for labels, v in samples:
                lab = ",".join(f'{k}="{val}"' for k, val in labels.items())
                lines.append(f"{name}{{{lab}}} {v}" if lab else f"{name} {v}")
        g("media_intake_items", "Top-level intake items by state after the last run.",
          [({"state": s}, m["items"].get(s, 0)) for s in ("pending", "ambiguous", "failed", "planned")])
        g("media_intake_ambiguous_items", "Ambiguous intake items by reason.",
          [({"reason": r}, n) for r, n in sorted(m["ambiguous_reasons"].items())] or [({"reason": "none"}, 0)])
        g("media_intake_ambiguous_oldest_first_seen_timestamp_seconds",
          "First-seen time of the oldest ambiguous item (run time when none).",
          [({}, int(m["oldest_ambiguous"]))])
        g("media_intake_run_actions", "Actions taken by the last run.",
          [({"action": a}, m["run_actions"].get(a, 0)) for a in ("moved", "duplicate", "replaced", "cleaned", "failed")])
        g("media_intake_actions_24h", "Actions taken in the last 24h (from the state file).",
          [({"action": a}, m["actions_24h"].get(a, 0)) for a in ("moved", "duplicate", "replaced", "cleaned", "failed")])
        g("media_intake_run_aborted", "1 if the last run hit a safety stop.",
          [({"reason": m["abort_reason"] or "none"}, 1 if m["abort_reason"] else 0)])
        g("media_intake_apply_enabled", "0 when the INTAKE_APPLY kill switch is off.", [({}, 1 if APPLY else 0)])
        g("media_intake_last_run_timestamp_seconds", "End of the last run.", [({}, int(m["now"]))])
        return "\n".join(lines) + "\n"


    def push_metrics(body):
        """Pushgateway PUT replaces the whole group. Returns False on failure."""
        ok = True
        mf = os.environ.get("INTAKE_METRICS_FILE")
        if mf:
            Path(mf).write_text(body)
        url = os.environ.get("PUSHGATEWAY_URL", "")
        if not url:
            return ok
        try:
            req = urllib.request.Request(f"{url.rstrip('/')}/metrics/job/media-intake-watcher",
                                         data=body.encode(), method="PUT",
                                         headers={"Content-Type": "text/plain"})
            with urllib.request.urlopen(req, timeout=15) as r:
                ok = 200 <= r.status < 300
        except Exception as e:
            log_event("metrics-push-failed", severity="error", error=type(e).__name__)
            ok = False
        return ok


    # ---- main -----------------------------------------------------------------
    def run():
        now = time.time()
        result = {"items": Counter(), "ambiguous_reasons": Counter(), "run_actions": Counter(),
                  "abort_reason": None, "now": now, "oldest_ambiguous": now,
                  "actions_24h": Counter(), "rescanned": 0}
        if not JDOWNLOADER_ROOT.is_dir() or not MEDIA_ROOT.is_dir():
            log_event("intake-preflight-failed", severity="critical", reason="mount-missing")
            result["abort_reason"] = "preflight"
            return result
        if not C.same_filesystem(JDOWNLOADER_ROOT, MEDIA_ROOT):
            # The single-mount rule. A rename across two mounts is EXDEV.
            log_event("intake-preflight-failed", severity="critical", reason="exdev-two-mounts")
            result["abort_reason"] = "preflight"
            return result
        state = load_state()
        seen_now = {}
        plans = []
        for item in enumerate_items(JDOWNLOADER_ROOT):
            iid = item_id(item.name)
            seen_now[iid] = state["first_seen"].get(iid, now)
            try:
                files = walk_files(item)
                why = incomplete_reason(item, files, now)
                if why:
                    result["items"]["pending"] += 1
                    log_event("intake-skip", item=iid, reason=why)
                    continue
                if item.is_dir() and not files:
                    # Empty folder: not media, so not "ambiguous" (it would alert
                    # forever), and deliberately NOT removed either -- an empty
                    # top-level folder may be a JDownloader category/target dir
                    # (the live intake has one). Ignored, logged, left alone.
                    log_event("intake-skip", item=iid, reason="empty-dir")
                    continue
                c = classify(item)
                plan = Plan(item)
                if c["kind"] == "movie":
                    plan_movie(plan, c)
                elif c["kind"] == "tv":
                    plan_tv(plan, c)
                elif c["kind"] == "music":
                    plan_music(plan, c)
                else:
                    plan.ambiguous.append(c["reason"])
                log_event("intake-classified", item=iid, kind=c["kind"],
                          actions=dict(plan.outcomes), left=len(plan.ambiguous),
                          reasons=sorted(set(plan.ambiguous)))
                plans.append(plan)
            except Exception as e:   # one bad item must not stop the rest
                log_event("intake-item-error", severity="error", item=iid, error=type(e).__name__)
                result["items"]["failed"] += 1
                state["failed"][iid] = {"ts": now, "reason": type(e).__name__}

        acting = [p for p in plans if p.acts]
        if len(acting) > MAX_ITEMS:
            log_event("intake-aborted", severity="critical", reason="too-many-items",
                      count=len(acting), limit=MAX_ITEMS)
            result["abort_reason"] = "too-many-items"
            acting = []

        free0 = free_bytes()
        for p in plans:
            iid = item_id(p.item.name)
            if p not in acting:
                if p.acts:
                    result["items"]["pending"] += 1   # blocked by the abort
                elif p.ambiguous:
                    result["items"]["ambiguous"] += 1
                    result["ambiguous_reasons"].update(set(p.ambiguous))
                    result["oldest_ambiguous"] = min(result["oldest_ambiguous"], seen_now[iid])
                continue
            if not APPLY:
                result["items"]["planned"] += 1
                try:
                    organize.apply_plan({"dry_run": True, "groups": p.groups})
                except SystemExit:
                    log_event("intake-plan-refused", severity="error", item=iid)
                if p.ambiguous:
                    result["ambiguous_reasons"].update(set(p.ambiguous))
                continue
            if result["abort_reason"]:
                result["items"]["pending"] += 1
                continue
            for kind in sorted(p.needs_dupdir):
                ensure_dup_dir(kind)
            if p.music:
                for t in p.music["tracks"]:
                    fix_track_tags(t, p.music["artist"], p.music["discs"])
            try:
                res = organize.apply_plan({"dry_run": False, "groups": p.groups})
            except SystemExit:   # a path rail refused the whole plan: nothing moved
                res = {"groups": {g["id"]: "refused" for g in p.groups}}
            failed = [g for g, o in res["groups"].items() if o != "ok"]
            oc = Counter(p.group_outcome[g] for g, o in res["groups"].items()
                         if o == "ok" and p.group_outcome[g] != "sidecar")
            result["run_actions"].update(oc)
            for a, n in oc.items():
                state["events"].extend([[now, a]] * n)
            if failed:
                result["items"]["failed"] += 1
                result["run_actions"]["failed"] += len(failed)
                state["events"].extend([[now, "failed"]] * len(failed))
                state["failed"][iid] = {"ts": now, "reason": "move-failed", "groups": len(failed)}
                log_event("intake-item-failed", severity="error", item=iid, groups=len(failed))
            else:
                state["failed"].pop(iid, None)
                if p.music:
                    write_album_nfo(p.music)
                    extract_cover(p.music)
                if SIDECARS and TMDB_KEY:
                    for task in p.sidecars:
                        run_sidecar(task)
                if p.item.is_dir() and not p.ambiguous:
                    if CL.cleanup(p.item, [str(v) for v in p.verify], guard_media=True):
                        result["run_actions"]["cleaned"] += 1
                        state["events"].append([now, "cleaned"])
                if p.ambiguous:
                    result["items"]["ambiguous"] += 1
                    result["ambiguous_reasons"].update(set(p.ambiguous))
                    result["oldest_ambiguous"] = min(result["oldest_ambiguous"], seen_now[iid])
            if RESCAN and p.rescan and not failed:
                import rescan as R
                R.rescan_paths(sorted(p.rescan))
                result["rescanned"] += len(p.rescan)
            drop = free0 - free_bytes()
            if drop > MAX_FREE_DROP:
                log_event("intake-aborted", severity="critical", reason="free-space-drop",
                          dropped_bytes=drop)
                result["abort_reason"] = "free-space"

        # Failed items still present keep counting until they succeed or vanish.
        for iid in list(state["failed"]):
            if iid not in seen_now:
                state["failed"].pop(iid)
        result["items"]["failed"] = max(result["items"]["failed"], len(state["failed"]))
        state["first_seen"] = seen_now
        state["events"] = [e for e in state["events"] if now - e[0] < 7 * 86400]
        for ts, a in state["events"]:
            if now - ts < 86400:
                result["actions_24h"][a] += 1
        if APPLY:
            save_state(state)
        return result


    def main():
        log_event("intake-start", apply=APPLY, min_age_min=MIN_AGE_S // 60,
                  max_items=MAX_ITEMS, rescan=RESCAN)
        res = run()
        pushed = push_metrics(render_metrics(res))
        log_event("intake-done", apply=APPLY, items=dict(res["items"]),
                  actions=dict(res["run_actions"]), aborted=res["abort_reason"],
                  rescanned=res["rescanned"], pushed=pushed)
        bad = res["abort_reason"] == "preflight" or res["run_actions"].get("failed") or not pushed
        sys.exit(1 if bad else 0)


    if __name__ == "__main__":
        main()
