---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/common-3.2.0/charts/library/common/values.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: makemkv
  namespace: media
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: app-template
      version: 5.2.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  maxHistory: 1
  install:
    remediation:
      retries: 1
  upgrade:
    cleanupOnFail: true
    force: false
    remediation:
      retries: 1
      remediateLastFailure: true
    timeout: 10m
  uninstall:
    keepHistory: false
  values:
    image:
      repository: jlesage/makemkv
      tag: v26.09.2@sha256:bfdddd29c5a9958da3003df1e673de7ad6915c846723449c76196d4ef6ca1ca2
      pullPolicy: IfNotPresent

    service:
      main:
        controller: main
        ports:
          http:
            port: 5800

    # Envoy Gateway migration phase 2 (2026-09-07): Ingress -> HTTPRoute.
    # The nginx Ingress below is kept DISABLED as the rollback target until
    # phase 4 removes nginx.
    ingress:
      main:
        enabled: false
        className: internal
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "MakeMKV"
          gethomepage.dev/description: "DVD and Blu-ray ripping software"
          gethomepage.dev/group: "Media"
          gethomepage.dev/icon: "makemkv.png"
        labels:
          gethomepage.dev/enabled: "true"
        hosts:
          - host: &host "makemkv.${SECRET_DOMAIN}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: main
                  port: http
        tls:
          - hosts:
              - *host

    route:
      main:
        kind: HTTPRoute
        hostnames:
          - *host
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: Gateway
            name: envoy-internal
            namespace: network
            # https only -- the http listener is owned cluster-wide by
            # httproute-https-redirect, which 301s every host.
            sectionName: https
        labels:
          gethomepage.dev/enabled: "true"
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "MakeMKV"
          gethomepage.dev/description: "DVD and Blu-ray ripping software"
          gethomepage.dev/group: "Media"
          gethomepage.dev/icon: "makemkv.png"

    persistence:
      config:
        enabled: true
        existingClaim: makemkv-config
      media:
        enabled: true
        existingClaim: makemkv-media
        # /output is MakeMKV's app_DestinationDir (autodiscripper target).
        # Without this mount it is the image's anonymous VOLUME on node-local
        # disk and every rip is lost on pod restart (F-6b04715e). The legacy
        # extraVolumeMounts entry below is ignored by app-template 5.x.
        # cifs-makemkv-media: subdir /Transcode, reclaim Retain (Severe tier).
        globalMounts:
          - path: /media
          - path: /output

    securityContext:
      privileged: true
      capabilities:
        add:
          - SYS_ADMIN
      allowPrivilegeEscalation: true
      runAsUser: 0
      runAsGroup: 0
      fsGroup: 0

    resources:
      requests:
        cpu: 100m
        memory: 250Mi
        gpu.intel.com/i915: 1
      limits:
        memory: 2Gi
        gpu.intel.com/i915: 1

    extraVolumes:
      - name: dev-dri
        hostPath:
          path: /dev/dri
          type: Directory
      - name: makemkv-media
        persistentVolumeClaim:
          claimName: makemkv-media
      - name: makemkv-config
        persistentVolumeClaim:
          claimName: makemkv-config

    extraVolumeMounts:
      - name: dev-dri
        mountPath: /dev/dri
      - name: makemkv-media
        mountPath: /output
      - name: makemkv-config
        mountPath: /config

    env:
      - name: MAKEMKV_KEY
        value: "BETA"
      # No physical optical drive exists on any node. /dev/sr0 on nuc14-03
      # is the PiKVM virtual-media drive: the ripper must never touch it.
      - name: AUTO_DISC_RIPPER
        value: "0"

    controllers:
      main:
        type: deployment
        # RWO Longhorn config volume at replicas 1 -> never RollingUpdate
        # (docs/sops/longhorn-rwo-multi-attach.md).
        strategy: Recreate
        containers:
          main:
            image:
              repository: jlesage/makemkv
              tag: v26.09.2@sha256:bfdddd29c5a9958da3003df1e673de7ad6915c846723449c76196d4ef6ca1ca2
              pullPolicy: IfNotPresent
            env:
              - name: MAKEMKV_KEY
                value: "BETA"
              # No physical optical drive exists on any node. /dev/sr0 on nuc14-03
              # is the PiKVM virtual-media drive: the ripper must never touch it.
              - name: AUTO_DISC_RIPPER
                value: "0"
            securityContext:
              privileged: true
              capabilities:
                add:
                  - SYS_ADMIN
              allowPrivilegeEscalation: true
              runAsUser: 0
            resources:
              requests:
                cpu: 100m
                memory: 250Mi
                gpu.intel.com/i915: 1
              limits:
                memory: 2Gi
                gpu.intel.com/i915: 1