# yaml-language-server: $schema=https://kubernetesjsonschema.dev/v1.18.1-standalone-strict/persistentvolumeclaim.json
---
# External-library originals: read-only CIFS mount of the icloud-backup PARENT
# (mu/photos + andrea/photos both visible under /libraries). Dynamically bound
# from the cifs-immich-icloud-backup StorageClass, same mechanism as plex-media-smb.
# The SC mounts `ro`, so Immich indexes but never writes/deletes the iCloud originals.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-library
  annotations:
    volume.beta.kubernetes.io/storage-provisioner: smb.csi.k8s.io
    volume.kubernetes.io/storage-provisioner: smb.csi.k8s.io
  labels:
    csi-driver-smb: "cifs-share"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 8Ti
  storageClassName: cifs-immich-icloud-backup
---
# Postgres (VectorChord) data — app database, so dynamic `longhorn` per the repo
# Longhorn SOP ("Use longhorn for app databases. Default choice"; longhorn-static
# is discouraged unless a volume must survive namespace deletion). media/ is a
# permanent namespace, so dynamic (2 replicas, HA) is correct and keeps this
# fully GitOps with no manual Longhorn Volume CR step.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-pg-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: longhorn
---
# Immich media location (/data): thumbnails, encoded video, uploaded/profile
# assets and generated data. Grows with the library; dynamic longhorn.
#
# SUPERSEDED by immich-upload-v2 below (2026-08-08) — kept temporarily as the
# rollback target. Delete once v2 has proven itself for a few days.
# It was 200Gi holding 33GiB, and at 3 replicas that reserved 600GiB of Longhorn
# scheduling space. Nothing that big fits on a second node, so Longhorn parked
# BOTH surviving replicas on nuc14-03 — a single node loss would have taken the
# volume offline.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-upload
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 200Gi
  storageClassName: longhorn
---
# Immich media location (/data) — right-sized replacement for immich-upload.
# Contents are 100% DERIVED (thumbs + encoded video); the iCloud originals live
# on the read-only CIFS library mount, so `library/` and `upload/` stay ~empty.
# Sizing from measurement, not guesswork: at 69% of thumbnails and 53% of video
# transcodes complete, thumbs were 13GiB and encoded-video 21GiB, projecting to
# ~19GiB + ~40GiB = ~60GiB at full scan. 100Gi leaves ~40GiB of growth headroom
# and, at 2 replicas, fits on a second node so the volume gets real redundancy.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-upload-v2
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
  storageClassName: longhorn
---
# Machine-learning model cache (CLIP + face-detection ONNX models). Re-downloadable,
# but persisting avoids re-pull on every ML pod restart.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-ml-cache
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: longhorn
