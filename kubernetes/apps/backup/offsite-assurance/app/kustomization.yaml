---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./cronjob-assure.yaml
  - ./cronjob-restore-proof.yaml
configMapGenerator:
  - name: offsite-assure-script
    files:
      - assure.sh
  - name: offsite-restore-proof-script
    files:
      - restore-proof.sh
generatorOptions:
  disableNameSuffixHash: true
