              "range": false,
              "format": "table"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "noValue": "No off-site alerts firing"
            },
            "overrides": []
          },
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Value": true,
                  "__name__": true,
                  "container": true,
                  "endpoint": true,
                  "instance": true,
                  "job": true,
                  "namespace": true,
                  "pod": true,
                  "service": true,
                  "prometheus": true,
                  "alertgroup": true
                },
                "indexByName": {
                  "alertname": 0,
                  "alertstate": 1,
                  "severity": 2
                }
              }
            }
          ],
          "options": {
            "showHeader": true
