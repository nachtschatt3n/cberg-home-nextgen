---
apiVersion: v1
kind: ConfigMap
metadata:
  name: offsite-backup-dashboard
  namespace: backup
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Backup
    # Prevent Flux postBuild var substitution from mangling any ${...} tokens in JSON.
    kustomize.toolkit.fluxcd.io/substitute: disabled
data:
  offsite-backup.json: |
    {
      "uid": "offsite-backup",
      "title": "Off-site backup",
      "tags": [
        "backup",
        "offsite"
      ],
      "schemaVersion": 41,
      "version": 1,
      "refresh": "5m",
      "time": {
        "from": "now-14d",
        "to": "now"
      },
      "timezone": "browser",
      "editable": false,
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Core backup: last success age",
          "description": "Time since the last successful backup run. Green under 48h, amber to 60h, red beyond (alert at 60h; widened because the first run after adding the Time Machine images uploads ~1.9 TiB).",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "time() - max(offsite_backup_last_success_timestamp_seconds{job=\"offsite-backup\",kind=\"backup\",tier=\"core\"})",
              "refId": "A",
              "legendFormat": "",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#2e9e6a",
                    "value": null
                  },
                  {
                    "color": "#e3a008",
                    "value": 172800
                  },
                  {
                    "color": "#d64545",
                    "value": 216000
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "noValue": "no data"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false
            },
            "justifyMode": "center"
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Apps backup: last success age",
          "description": "Time since the last successful backup run. Green under 36h, amber to 48h, red beyond (alert at 36h).",
