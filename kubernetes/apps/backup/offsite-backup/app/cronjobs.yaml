                  readOnly: true
                - name: ssh
                  mountPath: /secrets/ssh
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: scripts
              configMap:
                name: offsite-backup-script
            - name: ssh
              secret:
                secretName: offsite-backup-prune
                defaultMode: 292
                items:
                  - key: SSH_KEY
                    path: SSH_KEY
                  - key: KNOWN_HOSTS
                    path: KNOWN_HOSTS
            - name: tmp
              emptyDir:
                sizeLimit: 10Gi
