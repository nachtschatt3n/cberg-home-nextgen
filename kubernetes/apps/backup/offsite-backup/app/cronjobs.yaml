  name: offsite-backup-prune
  namespace: backup
spec:
  schedule: "30 4 * * 0"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 604800
      activeDeadlineSeconds: 43200
      template:
        metadata:
          labels:
            app: offsite-backup-prune
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          # root: ssh needs a passwd entry for its uid and the image has none
          # for 1000. Capabilities are dropped; sources are mounted read-only.
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: restic
              image: docker.io/restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - /scripts/run.sh
                - prune
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              env:
                - name: SFTP_HOST
                  valueFrom:
                    secretKeyRef:
                      name: offsite-backup-prune
                      key: SFTP_HOST
                - name: SFTP_PORT
                  valueFrom:
                    secretKeyRef:
                      name: offsite-backup-prune
                      key: SFTP_PORT
                - name: SFTP_USER
                  valueFrom:
                    secretKeyRef:
                      name: offsite-backup-prune
                      key: SFTP_USER
                - name: RESTIC_PASSWORD_CORE
                  valueFrom:
                    secretKeyRef:
                      name: offsite-backup-write
                      key: RESTIC_PASSWORD_CORE
                - name: REPO_CORE
                  valueFrom:
                    secretKeyRef:
                      name: offsite-backup-prune
                      key: REPO_CORE
                - name: RESTIC_PASSWORD_APPS
                  valueFrom:
                    secretKeyRef:
                      name: offsite-backup-write
                      key: RESTIC_PASSWORD_APPS
                - name: REPO_APPS
                  valueFrom:
                    secretKeyRef:
                      name: offsite-backup-prune
                      key: REPO_APPS
                - name: KEY_NAME
                  value: SSH_KEY
                - name: GOMEMLIMIT
                  value: 3500MiB
                - name: HOME
