# Weekly "what is in the backup" exporter (Monday 06:00 UTC). READ-ONLY: append-only keys,
# restic --no-lock --limit-download, metrics to the Pushgateway (kind=contents).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: offsite-backup-contents
  namespace: backup
spec:
  schedule: "0 6 * * 1"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 604800
      activeDeadlineSeconds: 7200
      template:
        metadata:
          labels:
            app: offsite-backup-contents
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          # root: ssh needs a passwd entry for its uid and the image has none
          # for 1000. Capabilities are dropped; nothing is mounted writable
          # except the scratch emptyDir.
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: restic
              image: docker.io/restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - /scripts/contents.sh
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              env:
                - name: SFTP_HOST
                  valueFrom:
                    secretKeyRef:
                      name: offsite-backup-write
                      key: SFTP_HOST
                - name: SFTP_PORT
                  valueFrom:
                    secretKeyRef:
                      name: offsite-backup-write
                      key: SFTP_PORT
                - name: SFTP_USER
                  valueFrom:
                    secretKeyRef:
                      name: offsite-backup-write
                      key: SFTP_USER
                - name: RESTIC_PASSWORD_CORE
                  valueFrom:
                    secretKeyRef:
                      name: offsite-backup-write
                      key: RESTIC_PASSWORD_CORE
                - name: RESTIC_PASSWORD_APPS
                  valueFrom:
                    secretKeyRef:
                      name: offsite-backup-write
                      key: RESTIC_PASSWORD_APPS
                - name: LIMIT_DOWNLOAD
                  value: "20000"
                - name: PATH_DEPTH
                  value: "3"
                - name: MAX_PATHS
                  value: "40"
                - name: GOMEMLIMIT
                  value: 1800MiB
                - name: HOME
                  value: /tmp
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 2Gi
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: ssh
                  mountPath: /secrets/ssh
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: scripts
              configMap:
                name: offsite-backup-contents-script
            - name: ssh
              secret:
                secretName: offsite-backup-write
                defaultMode: 292
                items:
                  - key: SSH_KEY
                    path: SSH_KEY
                  - key: SSH_KEY_APPS
                    path: SSH_KEY_APPS
                  - key: KNOWN_HOSTS
                    path: KNOWN_HOSTS
            - name: tmp
              emptyDir:
                sizeLimit: 3Gi
