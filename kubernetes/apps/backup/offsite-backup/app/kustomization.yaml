---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./pv.yaml
  - ./pvc.yaml
  - ./cronjobs.yaml
configMapGenerator:
  - name: offsite-backup-script
    files:
      - run.sh=script.sh
generatorOptions:
  disableNameSuffixHash: true
