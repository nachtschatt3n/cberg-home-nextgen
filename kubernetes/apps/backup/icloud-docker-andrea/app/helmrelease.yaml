---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: icloud-docker-andrea
  namespace: backup
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.2.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      main:
        strategy: Recreate
        # Trusted session established 2026-08-08 (interactive 2FA re-auth).
        #
        # If this instance ever needs a fresh re-auth, set this back to 0 FIRST:
        # a container with no trusted session loops on auth failure and burns
        # Apple's per-day 2FA code-send quota, after which Apple silently stops
        # pushing codes to every device on the account while still reporting
        # requires_2fa: True. See docs/sops/icloud-docker-reauth.md
        # (export INSTANCE=andrea).
        replicas: 1
        containers:
          app:
            image:
              repository: mandarons/icloud-drive
              # Release 2.1.0 (2026-10-01): icloudpy 0.10.0 (keeps 0.9.0's
              # trigger_2fa_push_notification() needed for iOS 26.4+ 2FA), and fixes
              # Drive package handling (#525/#526 is_zipfile, #461, #473, #550).
              # Web UI stays OFF (app.web_ui unset => disabled, loopback-only).
              # KEEP IN SYNC with the other icloud-docker-* instance.
              # See docs/sops/icloud-docker-reauth.md.
              tag: "2.1.0@sha256:c57e8248fefc55d490f090eb5edd08ff53045861e4b8f532403926b38af36ba9"
              pullPolicy: IfNotPresent
            env:
              TZ: ${TIMEZONE}
              PUID: 1000
              PGID: 1000
              ENV_CONFIG_FILE_PATH: /config/config.yaml
              ENV_ICLOUD_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: icloud-docker-andrea-secrets
                    key: SECRET_ICLOUD_PASSWORD
            envFrom:
              - secretRef:
                  name: icloud-docker-andrea-secrets
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                # 2Gi mirrors icloud-docker-mu, which OOMKilled 3x in 2h at 1Gi
                # on 2026-05-01. Steady-state is ~136Mi but photo-sync (every
                # 500s) and drive-sync cycles spike past 1Gi briefly.
                memory: 2Gi
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false
    defaultPodOptions:
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 1000
        runAsNonRoot: false
        fsGroupChangePolicy: "OnRootMismatch"

    service:
      main:
        controller: main
        enabled: false

    ingress:
      main:
        enabled: false

    persistence:
      config:
        enabled: true
        type: configMap
        name: icloud-docker-andrea-config
        globalMounts:
          - path: /config/config.yaml
            subPath: config.yaml
      data:
        enabled: true
        existingClaim: icloud-docker-andrea-data
        globalMounts:
          - path: /icloud
            readOnly: false
      session:
        enabled: true
        existingClaim: icloud-docker-andrea-session
        globalMounts:
          - path: /config/session_data
