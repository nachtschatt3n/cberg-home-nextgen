---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: icloud-docker-andrea
  namespace: backup
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      main:
        strategy: Recreate
        # Trusted session established 2026-08-08 (interactive 2FA re-auth).
        #
        # If this instance ever needs a fresh re-auth, set this back to 0 FIRST:
        # a container with no trusted session loops on auth failure and burns
        # Apple's per-day 2FA code-send quota, after which Apple silently stops
        # pushing codes to every device on the account while still reporting
        # requires_2fa: True. See docs/sops/icloud-docker-reauth.md
        # (export INSTANCE=andrea).
        replicas: 1
        containers:
          app:
            image:
              repository: mandarons/icloud-drive
              # Pinned to the `main` build (2026-06-06) that bundles icloudpy 0.9.0,
              # which adds trigger_2fa_push_notification() — REQUIRED for iOS 26.4+
              # 2FA re-auth. The latest RELEASE (v1.25.0) still ships the broken
              # icloudpy 0.8.0, so Apple never pushes the code and no 2FA dialog
              # appears on any device. Move back to a release tag once icloud-docker
              # cuts >= v1.26.0 with icloudpy 0.9.0. See docs/sops/icloud-docker-reauth.md.
              # KEEP IN SYNC with icloud-docker-mu — bump both instances together,
              # or the un-bumped one silently loses the 2FA push capability.
              tag: "main@sha256:91486ec1eaeb382e7af264b7ffa935c5ba110f11c3c2f1805976782ff5017917"
              pullPolicy: IfNotPresent
            env:
              TZ: ${TIMEZONE}
              PUID: 1000
              PGID: 1000
              ENV_CONFIG_FILE_PATH: /config/config.yaml
              ENV_ICLOUD_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: icloud-docker-andrea-secrets
                    key: SECRET_ICLOUD_PASSWORD
            envFrom:
              - secretRef:
                  name: icloud-docker-andrea-secrets
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                # 2Gi mirrors icloud-docker-mu, which OOMKilled 3x in 2h at 1Gi
                # on 2026-05-01. Steady-state is ~136Mi but photo-sync (every
                # 500s) and drive-sync cycles spike past 1Gi briefly.
                memory: 2Gi
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false
    defaultPodOptions:
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 1000
        runAsNonRoot: false
        fsGroupChangePolicy: "OnRootMismatch"

    service:
      main:
        controller: main
        enabled: false

    ingress:
      main:
        enabled: false

    persistence:
      config:
        enabled: true
        type: configMap
        name: icloud-docker-andrea-config
        globalMounts:
          - path: /config/config.yaml
            subPath: config.yaml
      data:
        enabled: true
        existingClaim: icloud-docker-andrea-data
        globalMounts:
          - path: /icloud
            readOnly: false
      session:
        enabled: true
        existingClaim: icloud-docker-andrea-session
        globalMounts:
          - path: /config/session_data
