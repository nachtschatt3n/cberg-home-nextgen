# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./pvc.yaml
configMapGenerator:
  - name: db-dumps-scripts
    files:
      - db-dump.sh
      - report.py
# The script uses shell ${var} syntax; Flux postBuild envsubst must not touch it.
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
