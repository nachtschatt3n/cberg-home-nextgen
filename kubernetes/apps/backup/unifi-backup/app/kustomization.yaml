---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./storageclass.yaml
  - ./pvc.yaml
  - ./secret.sops.yaml
  - ./cronjob.yaml
configMapGenerator:
  - name: unifi-backup-scripts
    files:
      - backup.py
generatorOptions:
  disableNameSuffixHash: true
