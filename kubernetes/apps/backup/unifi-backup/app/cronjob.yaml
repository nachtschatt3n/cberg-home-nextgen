---
# Weekly UniFi controller autobackup copy (Monday 05:15 UTC). The gateway keeps
# its autobackups only on its own disk; this job logs in ONCE (rate-limited
# endpoint, never retried), downloads the newest .unf, validates it and writes it
# atomically to the NAS backups share (subdir unifi, newest 8 kept). The nightly
# off-site core job carries the directory off-site (history lives in the restic
# repo). Metrics go to the Pushgateway (job=unifi-backup). Off-site jobs run at
# 00:30/00:40, prune Sun 04:30, check Wed 04:30: no overlap.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: unifi-backup
  namespace: backup
spec:
  schedule: "15 5 * * 1"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 2592000
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app: unifi-backup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: unifi-backup
              # Same pinned python:alpine image the repo already uses; stdlib only.
              image: docker.io/library/python:3.15.2-alpine@sha256:0f9552bb28711333da16915ec146f5e6bb44a7fdac9ced15dc17c2e0206346dd
              imagePullPolicy: IfNotPresent
              command:
                - python3
                - /scripts/backup.py
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              env:
                - name: UNIFI_HOST
                  value: 192.168.30.1
                - name: UNIFI_SITE
                  value: default
                - name: OUT_DIR
                  value: /backup
                - name: PUSHGATEWAY
                  value: http://prometheus-pushgateway.monitoring:9091
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
                - name: UNIFI_USER
                  valueFrom:
                    secretKeyRef:
                      name: unifi-backup-credentials
                      key: UNIFI_USER
                - name: UNIFI_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: unifi-backup-credentials
                      key: UNIFI_PASSWORD
                - name: UNIFI_CERT_SHA256
                  valueFrom:
                    secretKeyRef:
                      name: unifi-backup-credentials
                      key: UNIFI_CERT_SHA256
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
                - name: data
                  mountPath: /backup
          volumes:
            - name: scripts
              configMap:
                name: unifi-backup-scripts
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
            - name: data
              persistentVolumeClaim:
                claimName: unifi-backup-data
