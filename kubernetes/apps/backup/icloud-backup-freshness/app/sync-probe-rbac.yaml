---
# Least privilege for CronJob/icloud-sync-probe: read pod objects and pod logs
# in namespace backup, nothing else. No exec, no secrets, no writes. The probe
# needs the pod list to find icloud-docker-<account>'s Running pod and its
# restartCount (to also read the previous container's log after a crash).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: icloud-sync-probe
  namespace: backup
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: icloud-sync-probe
  namespace: backup
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: icloud-sync-probe
  namespace: backup
subjects:
  - kind: ServiceAccount
    name: icloud-sync-probe
    namespace: backup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: icloud-sync-probe
