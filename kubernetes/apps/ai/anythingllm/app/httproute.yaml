---
# Envoy migration — anythingllm onto envoy-internal.
#
# Annotation notes: proxy-body-size 100m; streaming LLM responses
#   Body-size limits have no route-level equivalent; Envoy streams uncapped
#   unless a requestBuffer is set and none is, so this loosens rather than
#   breaks. A cap would have to be Gateway-scoped and hit every other app.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: anythingllm
  namespace: ai
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - "anythingllm.${SECRET_DOMAIN}"
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - group: ""
          kind: Service
          name: anythingllm
          port: 3001
      timeouts:
        # Replaces nginx proxy-read/send-timeout: 3600. Left off, the route
        # inherits the gateway-wide 60s default — a tightening invisible to a
        # `curl /` check.
        request: 3600s
        backendRequest: 3600s
