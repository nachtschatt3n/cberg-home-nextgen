---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes-agent
  namespace: ai
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  maxHistory: 1
  install:
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    cleanupOnFail: false
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      hermes-agent:
        pod:
          annotations:
            secret.reloader.stakater.com/reload: hermes-agent-secret
          securityContext:
            fsGroup: 10000
            fsGroupChangePolicy: OnRootMismatch

        initContainers:
          # ⚠️ THIS CONFIGMAP IS A SEED, NOT THE LIVE CONFIG. ⚠️
          # The seed script below copies /seed/config.yaml to /opt/data/config.yaml
          # ONLY if that file does not already exist. /opt/data is the
          # hermes-agent-data PVC, and once seeded the PVC copy is authoritative
          # forever. Editing configmap.yaml therefore changes NOTHING on a running
          # install — not on reconcile, not on restart, not with Reloader. Adding a
          # reloader annotation here would be actively misleading for that reason.
          #
          # Cost of learning this the hard way (2026-09-04, gemma4 GGUF->MLX
          # migration): the ConfigMap and the manifest both said gemma4:26b-mlx,
          # Flux was green, the pod had been restarted — and the live process was
          # still requesting the GGUF from a 17-day-old PVC file.
          #
          # To actually change the model (or any other setting) on a live install:
          #   kubectl exec -n ai deploy/hermes-agent -c gateway -- \
          #     sed -i 's/^  default: .*/  default: <new-model>/' /opt/data/config.yaml
          #   kubectl rollout restart -n ai deploy/hermes-agent
          # Then VERIFY the file in-container, not the ConfigMap.
          seed-config:
            image:
              repository: busybox
              tag: 1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
            command:
              - sh
              - -c
              - |
                if [ ! -f /opt/data/config.yaml ]; then
                  cp /seed/config.yaml /opt/data/config.yaml
                  echo "Seeded /opt/data/config.yaml from ConfigMap"
                else
                  echo "/opt/data/config.yaml already exists, not overwriting"
                fi
            securityContext:
              runAsUser: 10000
              runAsGroup: 10000

        containers:
          gateway:
            image:
              repository: nousresearch/hermes-agent
              # No release tag matches this build (inter-release latest); digest-pinned.
              tag: latest@sha256:c09a0f421b8c93216520cecd3a8bab45651cc223c9126ac26fcbdd38aaae0375
              pullPolicy: Always
            args:
              - gateway
              - run
            env:
              - name: TELEGRAM_BOT_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: hermes-agent-secret
                    key: TELEGRAM_BOT_TOKEN
              - name: TELEGRAM_ALLOWED_USERS
                valueFrom:
                  secretKeyRef:
                    name: hermes-agent-secret
                    key: TELEGRAM_ALLOWED_USERS
              - name: API_SERVER_HOST
                value: "0.0.0.0"
              - name: API_SERVER_KEY
                valueFrom:
                  secretKeyRef:
                    name: hermes-agent-secret
                    key: API_SERVER_KEY
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8642
                  initialDelaySeconds: 90
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8642
                  initialDelaySeconds: 60
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8642
                  initialDelaySeconds: 15
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                cpu: 2
                memory: 2Gi
            securityContext:
              runAsNonRoot: true
              runAsUser: 10000
              runAsGroup: 10000
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL

          dashboard:
            image:
              repository: nousresearch/hermes-agent
              # No release tag matches this build (inter-release latest); digest-pinned.
              tag: latest@sha256:c09a0f421b8c93216520cecd3a8bab45651cc223c9126ac26fcbdd38aaae0375
              pullPolicy: Always
            args:
              - dashboard
              - --host
              - "0.0.0.0"
              - --no-open
              - --insecure
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 9119
                  initialDelaySeconds: 60
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 9119
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 9119
                  initialDelaySeconds: 15
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                cpu: 500m
                memory: 512Mi
            securityContext:
              runAsNonRoot: true
              runAsUser: 10000
              runAsGroup: 10000
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL

    service:
      main:
        controller: hermes-agent
        type: ClusterIP
        ports:
          dashboard:
            protocol: TCP
            port: 9119
            targetPort: 9119
          api:
            protocol: TCP
            port: 8642
            targetPort: 8642

    ingress:
      dashboard:
        enabled: true
        className: internal
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "Hermes Agent"
          gethomepage.dev/group: "AI"
          gethomepage.dev/icon: "mdi-robot-outline"
          gethomepage.dev/description: "Self-improving AI agent — Telegram + gemma4:26b-mlx"
          # Pod label is `app.kubernetes.io/name=hermes-agent`, not
          # `hermes-agent-dashboard` (homepage's default guess from
          # ingress name). Set explicitly so status probes resolve.
          gethomepage.dev/pod-selector: "app.kubernetes.io/name=hermes-agent"
        labels:
          gethomepage.dev/enabled: "true"
        hosts:
          - host: hermes.${SECRET_DOMAIN}
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: main
                  port: dashboard
        tls:
          - hosts:
              - hermes.${SECRET_DOMAIN}

      api:
        enabled: true
        className: internal
        hosts:
          - host: hermes-api.${SECRET_DOMAIN}
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: main
                  port: api
        tls:
          - hosts:
              - hermes-api.${SECRET_DOMAIN}

    persistence:
      data:
        type: persistentVolumeClaim
        existingClaim: hermes-agent-data
        advancedMounts:
          hermes-agent:
            seed-config:
              - path: /opt/data
            gateway:
              - path: /opt/data
            dashboard:
              - path: /opt/data

      seed-config:
        type: configMap
        name: hermes-agent-config
        advancedMounts:
          hermes-agent:
            seed-config:
              - path: /seed
