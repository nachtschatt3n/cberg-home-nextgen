# Only OpenClaw may reach the browser API (9377). Everything else ingress-wise
# is denied; egress is left open (the browser must reach the internet).
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: camofox-browser
  namespace: ai
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: camofox-browser
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openclaw
      ports:
        - protocol: TCP
          port: 9377
