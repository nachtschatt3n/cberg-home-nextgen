---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: next-ai-draw-io
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  maxHistory: 1
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: false
    remediation:
      retries: 1
  uninstall:
    keepHistory: false
  values:
    controllers:
      next-ai-draw-io:
        containers:
          app:
            image:
              repository: ghcr.io/dayuanjiang/next-ai-draw-io
              tag: 0.4.15
            env:
              - name: AI_PROVIDER
                value: "ollama"
              - name: AI_MODEL
                value: "gemma4:26b-mlx"
              - name: OLLAMA_BASE_URL
                value: "http://192.168.30.111:11434/api"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 3000
                  initialDelaySeconds: 15
                  periodSeconds: 30
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 3000
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  successThreshold: 1
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 500m
                memory: 512Mi

    service:
      main:
        controller: next-ai-draw-io
        ports:
          http:
            port: 3000

    # Envoy Gateway migration phase 2 (2026-09-07): Ingress -> HTTPRoute.
    # The swap happens in ONE commit. k8s-gateway watches Ingress AND HTTPRoute,
    # so leaving both alive would publish two A records for this host (.100
    # nginx and .103 envoy) and it would resolve non-deterministically.
    #
    # DROPPED deliberately: the `tls:` block. Gateway API terminates TLS at the
    # LISTENER, not per route, and the envoy-internal https listener already
    # presents the wildcard *.${SECRET_DOMAIN} certificate.
    route:
      main:
        kind: HTTPRoute
        hostnames:
          - "next-ai-draw-io.${SECRET_DOMAIN}"
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: Gateway
            name: envoy-internal
            namespace: network
            # https only -- the http listener is owned cluster-wide by
            # httproute-https-redirect, which 301s every host.
            sectionName: https
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "AI Draw.io"
          gethomepage.dev/description: "Create and edit diagrams using natural language AI"
          gethomepage.dev/group: "AI"
          gethomepage.dev/icon: "draw-io.png"
          gethomepage.dev/pod-selector: app.kubernetes.io/name=next-ai-draw-io
        labels:
          gethomepage.dev/enabled: "true"
        # Rule written out explicitly. The chart's "rules may be omitted"
        # shortcut only holds while exactly one Service is enabled; with two,
        # _validate.tpl hard-fails. Being explicit is future-proof.
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: main
                port: http