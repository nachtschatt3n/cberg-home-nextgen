---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: paperclip-backup-cleanup
  namespace: ai
spec:
  schedule: "0 4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: Never
          # Explicit `default` (not just omitted): the old dedicated SA was
          # pruned, and server-side apply does NOT clear a field the applier
          # merely stopped setting — the stale paperclip-backup-cleanup
          # reference would orphan on the live object and fail pod creation
          # with "serviceaccount not found". Pinning `default` re-takes SSA
          # ownership. No token is mounted: this job needs zero API access.
          serviceAccountName: default
          automountServiceAccountToken: false
          # Paperclip creates its OWN backups in-app (config.json
          # backup.intervalMinutes: 1440, firing ~04:00Z). The old
          # scale-down → cleanup → scale-up choreography here raced that
          # timer: scaling to 0 at 04:00:00Z killed the pod mid-backup
          # every night, so no new backup ever landed. Deleting week-old
          # .sql files needs NO downtime — the app never rewrites old
          # backups — so this job now ONLY deletes, never touches the
          # Deployment (and needs no ServiceAccount/RBAC at all).
          # podAffinity stays: it co-schedules onto paperclip's node,
          # which is sufficient to mount the RWO Longhorn volume
          # alongside the running app.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchExpressions:
                      - key: app.kubernetes.io/name
                        operator: In
                        values:
                          - paperclip
                  topologyKey: kubernetes.io/hostname
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          containers:
            - name: cleanup
              image: busybox:stable
              command:
                - /bin/sh
                - -c
                - |
                  DIR=/paperclip/instances/default/data/backups
                  if [ ! -d "$DIR" ]; then
                    echo "No backups directory, nothing to clean"
                    exit 0
                  fi
                  before=$(find "$DIR" -maxdepth 1 -name '*.sql' | wc -l)
                  find "$DIR" -maxdepth 1 -name '*.sql' -mtime +7 -print -delete || true
                  after=$(find "$DIR" -maxdepth 1 -name '*.sql' | wc -l)
                  echo "backups: $before -> $after (removed $((before - after)) older than 7 days)"
                  exit 0
              resources:
                requests: {cpu: 10m, memory: 32Mi}
                limits:   {cpu: 100m, memory: 64Mi}
              volumeMounts:
                - name: data
                  mountPath: /paperclip
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: paperclip-data
