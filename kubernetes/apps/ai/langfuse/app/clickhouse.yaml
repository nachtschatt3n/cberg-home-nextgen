---
apiVersion: v1
kind: ConfigMap
metadata:
  name: langfuse-clickhouse-config
  namespace: ai
data:
  cluster.xml: |
    <clickhouse>
        <zookeeper>
            <node>
                <host>langfuse-zookeeper</host>
                <port>2181</port>
            </node>
        </zookeeper>
        <remote_servers>
            <default>
                <shard>
                    <replica>
                        <host>localhost</host>
                        <port>9000</port>
                    </replica>
                </shard>
            </default>
        </remote_servers>
        <distributed_ddl>
            <path>/clickhouse/task_queue/ddl</path>
        </distributed_ddl>
        <macros>
            <cluster>default</cluster>
            <shard>1</shard>
            <replica>langfuse_clickhouse_1</replica>
        </macros>
    </clickhouse>
  system-log-ttl.xml: |
    <clickhouse>
        <!--
          Cap ClickHouse's internal system-log tables. These ship with NO TTL and
          had grown to ~13 GiB on langfuse-clickhouse-data (asynchronous_metric_log
          alone was 10.5 GiB / 20.6B rows), flapping the PVC usage warning, while the
          actual langfuse trace data is only a couple of MiB. Langfuse does not read
          these tables (they are ClickHouse server diagnostics only), so an aggressive
          3-day retention is safe and durable across pod/PVC recreation.
        -->
        <asynchronous_metric_log><ttl>event_date + INTERVAL 3 DAY DELETE</ttl></asynchronous_metric_log>
        <metric_log><ttl>event_date + INTERVAL 3 DAY DELETE</ttl></metric_log>
        <trace_log><ttl>event_date + INTERVAL 3 DAY DELETE</ttl></trace_log>
        <query_log><ttl>event_date + INTERVAL 3 DAY DELETE</ttl></query_log>
        <query_views_log><ttl>event_date + INTERVAL 3 DAY DELETE</ttl></query_views_log>
        <part_log><ttl>event_date + INTERVAL 3 DAY DELETE</ttl></part_log>
        <!--
          NOTE: opentelemetry_span_log is intentionally omitted. ClickHouse's base
          config.xml defines it with an explicit <engine> block, and CH rejects a
          separate <ttl> tag alongside an <engine> ("TTL parameters should be
          specified directly inside 'engine'", BAD_ARGUMENTS) — which aborts server
          startup. That table is tiny (<1 MiB) and not a growth concern, so it is
          left at its default (no TTL).
        -->
        <!--
          Collect async metrics every 60s instead of the 1s default — this was the
          main write-volume driver (~86M rows/day into asynchronous_metric_log). 60s
          cuts that ~60x while retaining server diagnostics.
        -->
        <asynchronous_metrics_update_period_s>60</asynchronous_metrics_update_period_s>
    </clickhouse>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-clickhouse
  namespace: ai
spec:
  replicas: 1
  strategy:
    type: Recreate  # Required for RWO volumes - terminates old pod before starting new one
  selector:
    matchLabels:
      app: langfuse-clickhouse
  template:
    metadata:
      annotations:
        secret.reloader.stakater.com/reload: "langfuse-clickhouse"
      labels:
        app: langfuse-clickhouse
    spec:
      containers:
      - name: clickhouse
        image: clickhouse/clickhouse-server:25.3-alpine
        ports:
        - containerPort: 8123
        - containerPort: 9000
        env:
        - name: CLICKHOUSE_DB
          value: langfuse
        - name: CLICKHOUSE_USER
          value: default
        - name: CLICKHOUSE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: langfuse-clickhouse
              key: password
        - name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
          value: "1"
        volumeMounts:
        - name: data
          mountPath: /var/lib/clickhouse
          subPath: clickhouse
        - name: config
          mountPath: /etc/clickhouse-server/config.d/cluster.xml
          subPath: cluster.xml
        - name: config
          mountPath: /etc/clickhouse-server/config.d/system-log-ttl.xml
          subPath: system-log-ttl.xml
        readinessProbe:
          httpGet:
            path: /ping
            port: 8123
          initialDelaySeconds: 30
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /ping
            port: 8123
          initialDelaySeconds: 60
          timeoutSeconds: 5
        resources:
          requests:
            memory: "1Gi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "500m"
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: langfuse-clickhouse-data-new
      - name: config
        configMap:
          name: langfuse-clickhouse-config
---
apiVersion: v1
kind: Service
metadata:
  name: langfuse-clickhouse
  namespace: ai
spec:
  selector:
    app: langfuse-clickhouse
  ports:
  - name: http
    port: 8123
    targetPort: 8123
  - name: native
    port: 9000
    targetPort: 9000
---
# Simple ZooKeeper for ClickHouse clustering
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-zookeeper
  namespace: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langfuse-zookeeper
  template:
    metadata:
      labels:
        app: langfuse-zookeeper
    spec:
      containers:
      - name: zookeeper
        image: zookeeper:3.9
        ports:
        - containerPort: 2181
        env:
        - name: ZOOKEEPER_CLIENT_PORT
          value: "2181"
        - name: ZOOKEEPER_TICK_TIME
          value: "2000"
        - name: ZOO_MY_ID
          value: "1"
        - name: ZOO_SERVERS
          value: "server.1=0.0.0.0:2888:3888;2181"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: langfuse-zookeeper
  namespace: ai
spec:
  selector:
    app: langfuse-zookeeper
  ports:
  - name: client
    port: 2181
    targetPort: 2181
