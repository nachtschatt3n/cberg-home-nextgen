---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: librechat
spec:
  interval: 30m
  chart:
    spec:
      chart: librechat
      version: "2.0.7"
      sourceRef:
        kind: HelmRepository
        name: librechat
        namespace: flux-system
  maxHistory: 1
  install:
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    cleanupOnFail: false
    remediation:
      retries: 1
  uninstall:
    keepHistory: false
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Ingress
              name: librechat-librechat
            patch: |
              - op: add
                path: /metadata/labels/gethomepage.dev~1enabled
                value: "true"
  values:
    # Pin the app image explicitly. Chart 2.0.7 already defaults to appVersion
    # v0.8.7 via `image.tag: ""` -> .Chart.AppVersion, so this is a no-op today
    # (verified by `helm template`). It is kept as a guard: chart 2.0.8 ships
    # appVersion v0.8.8-rc1, so a future chart bump without this pin would drag
    # a release candidate into production.
    image:
      tag: "v0.8.7"

    # Recreate (not RollingUpdate): librechat-librechat mounts the RWO PVC
    # `librechat-librechat-images`, so the chart default RollingUpdate
    # (maxSurge 25% with replicaCount 1 -> surges a 2nd pod) deadlocks on a
    # Multi-Attach error — the new pod waits for a volume the old pod holds,
    # and the old pod won't terminate until the new one is Ready. Observed on
    # the 2.0.2 -> 2.0.7 upgrade (2026-08-15): the rollout hung ~10m and only
    # recovered because upgrade.remediation retried after the old pod was
    # finally torn down. Recreate tears the old pod down FIRST, making the
    # rollout deterministic instead of timeout-dependent.
    #
    # Same class of bug as the open-webui pipelines block, but NOTE the values
    # path differs: this chart exposes `updateStrategy` (templates/deployment.yaml
    # renders `.Values.updateStrategy` into spec.strategy), NOT `strategy` as
    # bjw-s/open-webui does. Verified by `helm template` against chart 2.0.7 —
    # `strategy.type` here would silently no-op.
    #
    # Trade-off: Recreate means a brief gap (single replica, no surge) on every
    # librechat rollout. That is inherent to a RWO volume and is preferable to a
    # 15m deadlock.
    updateStrategy:
      type: Recreate

    global:
      librechat:
        existingSecretName: "librechat-credentials-env"
        existingSecretApiKey: OPENAI_API_KEY

    librechat:
      existingSecretName: "librechat-credentials-env"

      configEnv:
        DOMAIN_CLIENT: "https://librechat.${SECRET_DOMAIN}"
        DOMAIN_SERVER: "https://librechat.${SECRET_DOMAIN}"
        ALLOW_EMAIL_LOGIN: "true"
        ALLOW_REGISTRATION: "false"
        SEARCH: "true"

        # --- Authentik OIDC (SSO) ---------------------------------------
        # Authentik is the identity source. ALLOW_REGISTRATION stays "false":
        # that flag gates the LOCAL email/password signup form only. The OIDC
        # path is separate and auto-provisions on first login —
        # api/strategies/openidStrategy.js:processOpenIDAuth() calls
        # createUser() when no local user matches, and its `existingUsersOnly`
        # argument is undefined for the login strategy (createOpenIDCallback()
        # is invoked with no args), so it is falsy. No local account and no
        # open registration are needed. Verified against the running v0.8.7
        # image, not the docs.
        #
        # ALLOW_SOCIAL_LOGIN is load-bearing: api/server/index.js only calls
        # configureSocialLogins(app) — which is what runs setupOpenId() and
        # registers the 'openid' passport strategy — inside
        # `if (isEnabled(ALLOW_SOCIAL_LOGIN))`. Without it the /oauth/openid
        # route 500s even though every OPENID_* value below is correct.
        # ALLOW_SOCIAL_REGISTRATION is deliberately NOT set: it gates
        # strategies/socialLogin.js (Google/GitHub/Discord/Apple), which the
        # openid strategy does not go through.
        ALLOW_SOCIAL_LOGIN: "true"

        # openid-client v6 `client.discovery()` appends
        # /.well-known/openid-configuration to this URL, and validates the
        # discovered `issuer` claim against it — so the trailing slash must
        # stay (Authentik issues the slug URL WITH it).
        OPENID_ISSUER: "https://auth.${SECRET_DOMAIN}/application/o/librechat/"
        # The strategy builds its callback as DOMAIN_SERVER + this path, and
        # the oauth router is mounted at /oauth (api/server/index.js), so this
        # is the only value that can match the blueprint's redirect_uri.
        OPENID_CALLBACK_URL: "/oauth/openid/callback"
        OPENID_SCOPE: "openid profile email"
        OPENID_BUTTON_LABEL: "Sign in with Authentik"

        # Promote Authentik admins to LibreChat ADMIN. Needed because nothing
        # else does: the first-user-becomes-admin logic lives in
        # AuthService.registerUser (the LOCAL registration path), and
        # createUser() defaults role to SystemRoles.USER — so an OIDC-created
        # user is a plain USER unless this mapping fires. The `groups` claim is
        # carried by Authentik's managed scope-profile mapping, which the
        # blueprint binds. All three variables are required together
        # (openidStrategy.js guards on `adminRole && path && kind`); if the
        # claim is ever missing the branch is a no-op and login still succeeds
        # as USER, so this cannot lock anyone out.
        OPENID_ADMIN_ROLE: "authentik Admins"
        OPENID_ADMIN_ROLE_PARAMETER_PATH: "groups"
        OPENID_ADMIN_ROLE_TOKEN_KIND: "userinfo"
        # OPENID_CLIENT_ID / OPENID_CLIENT_SECRET / OPENID_SESSION_SECRET come
        # from the SOPS secret `librechat-credentials-env` (envFrom secretRef,
        # applied AFTER this ConfigMap so secret values win on any collision).

      configYamlContent: |
        version: 1.2.1
        endpoints:
          openAI:
            disabled: true
          assistants:
            disabled: true
          azureAssistants:
            disabled: true
          custom:
            - name: "Ollama"
              apiKey: "ollama"
              baseURL: "http://192.168.30.111:11434/v1"
              models:
                default:
                  - "gemma4:26b"
                fetch: true
              titleConvo: true
              titleModel: "current_model"
              summarize: false

      imageVolume:
        enabled: true
        size: 10Gi
        accessModes: ReadWriteOnce
        storageClassName: longhorn

    ingress:
      enabled: true
      className: external
      annotations:
        external-dns.alpha.kubernetes.io/target: "external.${SECRET_DOMAIN}"
        # Strip client-supplied X-Tenant-Id at the edge. LibreChat v0.8.5+ trusts
        # this header on four UNAUTHENTICATED routes, and this ingress is
        # internet-facing, so an anonymous caller can vary the header to pollute
        # per-tenant cache keys against a 1Gi pod. No data leak (our documents
        # carry no tenantId), but it is a free unauthenticated memory-pressure
        # lever -- so the header must never reach the app from outside.
        #
        # Setting a proxy_set_header to the empty string makes nginx OMIT the
        # header from the upstream request entirely (it does not forward an
        # empty value). Header names are matched case-insensitively, so this
        # also covers `x-tenant-id` / `X-TENANT-ID`.
        #
        # This ACCUMULATES with the controller's built-in proxy_set_header
        # directives rather than replacing them: nginx only falls back to
        # inherited headers when a level defines NONE, and the snippet is
        # injected into the same `location` block that already sets Host /
        # X-Forwarded-For / X-Real-IP. Verified against the rendered nginx.conf.
        #
        # Deliberately NOT TENANT_ISOLATION_STRICT=true -- that setting takes
        # LibreChat down in this deployment.
        nginx.ingress.kubernetes.io/configuration-snippet: |
          proxy_set_header X-Tenant-Id "";
        nginx.ingress.kubernetes.io/enable-websocket: "true"
        nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
        nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
        nginx.ingress.kubernetes.io/proxy-body-size: "100m"
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: "LibreChat"
        gethomepage.dev/description: "AI chat interface"
        gethomepage.dev/group: "AI"
        gethomepage.dev/icon: "librechat.png"
      labels:
        gethomepage.dev/enabled: "true"
      hosts:
        - host: &host "librechat.${SECRET_DOMAIN}"
          paths:
            - path: /
              pathType: Prefix
      tls:
        - hosts:
            - *host

    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi

    mongodb:
      enabled: true

      # Authentication. Previously `enabled: false`, i.e. any pod that could
      # reach the Service had unauthenticated full read/write on the chat DB.
      #
      # NOTE the values PATH. The old block carried a TOP-LEVEL
      # `mongodb.databases: [LibreChat]`, but subchart 16.5.45 has no
      # top-level `databases` key at all -- only `auth.databases`. That value
      # was therefore INERT and silently did nothing. Verified against
      # charts/mongodb/values.yaml. Same class of trap as the
      # `updateStrategy` vs `strategy` note above.
      #
      # `existingSecret` replaces the chart-generated secret wholesale
      # (see mongodb.secretName in _helpers.tpl), so the key names below are
      # NOT ours to choose -- templates/secrets.yaml fixes them as
      # `mongodb-root-password` and `mongodb-passwords`. The latter is a
      # COMMA-SEPARATED list positionally matched against `auth.usernames`.
      # Source: kubernetes/apps/ai/librechat/app/mongodb-secret.sops.yaml
      #
      # The bitnami entrypoint creates users ONLY on an EMPTY datadir. Turning
      # auth on over a populated volume yields a mongod that starts happily and
      # rejects every login. Enabling this therefore REQUIRED wiping the PVC
      # (done 2026-08-15 in window sat-early; the store held only seed data).
      auth:
        enabled: true
        existingSecret: librechat-mongodb-auth
        usernames:
          - librechat
        databases:
          - LibreChat

      # The chart-generated NetworkPolicy previously granted nothing. With the
      # subchart default `allowExternal: true`, templates/networkpolicy.yaml
      # emits an ingress rule with ports but NO `from:` selector -- which
      # matches EVERY source in EVERY namespace. The policy existed, so it read
      # as protection while admitting the whole cluster.
      #
      # `allowExternal: false` is the switch that makes the template render the
      # `from:` block at all. `ingressPodMatchLabels` then adds the one selector
      # we actually want.
      #
      # The label is `app.kubernetes.io/name: librechat-librechat`, NOT
      # `librechat` -- the parent chart suffixes its own name. Verified against
      # the live pod labels. Getting this wrong renders a perfectly valid
      # NetworkPolicy that locks LibreChat out of its own database.
      #
      # A NetworkPolicy podSelector with no namespaceSelector is scoped to this
      # namespace (ai), which is what we want -- nothing outside `ai` should
      # reach this database.
      #
      # `addExternalClientAccess: false` drops the subchart's extra
      # opt-in selector (any pod labelled `librechat-mongodb-client: "true"`);
      # nothing uses it and a narrower policy is the point of this change.
      networkPolicy:
        allowExternal: false
        addExternalClientAccess: false
        ingressPodMatchLabels:
          app.kubernetes.io/name: librechat-librechat

      # Pinned by DIGEST, not tag. `bitnami/mongodb` no longer publishes semver
      # tags (502 tags, all `sha256-*` plus `latest`), so a digest is the ONLY
      # available pin. `8.2.6` / `8.3.8` both 404 as tags, and the subchart's
      # OWN default tag (`8.0.13-debian-12-r0`) 404s too -- so dropping this
      # override is NOT a fallback, it produces an unpullable image.
      #
      # `tag` is deliberately left in place but is INERT: bitnami common
      # `common.images.image` switches the separator to "@" and replaces the
      # termination with `.digest` whenever digest is non-empty, so the
      # rendered image is `docker.io/bitnami/mongodb@sha256:...` and the tag is
      # never consulted. Do NOT delete `digest` and expect `tag` to be safe.
      #
      # The digest below is MongoDB 8.3.8 (image built 2026-08-14), moved from
      # 8.2.6 (sha256:3cb21cf1...) in window sat-early:2026-08-15 per
      # runbooks/maintenance/plans/librechat-mongodb-8.3.8.md. It was applied
      # immediately AFTER the auth change above wiped the datadir, so this was
      # a fresh 8.3.8 initialisation rather than an 8.2 -> 8.3 migration.
      #
      # STRATEGIC CAVEAT: 8.0 is the LTS line; 8.1/8.2/8.3 are rapid releases,
      # each supported only until the next supersedes it. Because Bitnami
      # publishes only `latest` publicly, we cannot pick LTS here -- we get
      # whatever `latest` is on the day. The durable fix is migrating to the
      # official `mongo` image (real semver tags, incl. LTS) or an operator;
      # that is a larger change and needs its own plan.
      image:
        registry: docker.io
        repository: bitnami/mongodb
        tag: "latest"
        digest: "sha256:0c57d0efdf2f08958e5cd1392b20664c92597c7c6da2fbd0e972bcfb96d0dc92"
      persistence:
        size: 10Gi
      # Recreate: same RWO Multi-Attach deadlock as the parent librechat
      # Deployment above -- librechat-mongodb mounts the RWO Longhorn PVC
      # `librechat-mongodb`, and the subchart default RollingUpdate surges a
      # second pod (maxSurge 25% rounds UP to 1 at replicaCount 1) onto a
      # volume the old pod still holds.
      #
      # Values path is `mongodb.updateStrategy` and it is NOT a StatefulSet
      # key here: bitnami mongodb 16.5.45 templates/standalone/dep-sts.yaml
      # branches on `useStatefulSet` (false -> Deployment) and renders
      # `.Values.updateStrategy` into spec.strategy. Verified by helm template
      # against chart 2.0.7 -> librechat-mongodb strategy {type: Recreate}.
      #
      # Trade-off: a brief DB gap on every librechat rollout, inherent to a
      # single-replica RWO volume. See docs/sops/longhorn-rwo-multi-attach.md.
      updateStrategy:
        type: Recreate

    meilisearch:
      enabled: true
      persistence:
        enabled: true
        storageClass: longhorn
      image:
        tag: "v1.7.3"
      auth:
        existingMasterKeySecret: "librechat-credentials-env"

    redis:
      enabled: false
