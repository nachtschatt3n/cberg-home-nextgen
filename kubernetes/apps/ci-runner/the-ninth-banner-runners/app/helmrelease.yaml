---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
# ARC runner scale set for nachtschatt3n/the-ninth-banner (repo-scoped).
# Ephemeral: one job per pod, the pod is deleted after its job (ARC JIT runners).
# docs/sops/ci-runner.md §2c. CPU checks and simulation jobs.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: the-ninth-banner-runners
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: gha-runner-scale-set
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    githubConfigUrl: https://github.com/nachtschatt3n/the-ninth-banner
    # Pre-defined SOPS secret: cluster GITHUB_TOKEN referenced via Flux substitution.
    githubConfigSecret: the-ninth-banner-arc-github
    # The scale-set name is itself a runs-on label. Labels are registered with
    # GitHub only when the scale set is CREATED: changing them later needs the
    # scale set deleted and re-created (rename runnerScaleSetName).
    runnerScaleSetName: ninth-banner-k8s
    scaleSetLabels:
      - self-hosted
      - ninth-banner
      - k8s
      - linux
      - x64
    # Owner 2026-10-06: one warm idle runner so a job starts at once (a
    # release fires ~5 jobs within a minute). An idle runner keeps its CPU
    # request on its node.
    minRunners: 1
    # nuc14-01/03 only; 4 x 1.6 CPU fit the two nodes' 6-CPU CI budgets next
    # to the build pool (2 x 2 CPU).
    maxRunners: 4
    controllerServiceAccount:
      namespace: arc-system
      name: arc-controller
    listenerTemplate:
      metadata:
        labels:
          # NOT effective: ARC 0.15 overwrites app.kubernetes.io/name on the
          # listener pod; PodMonitor arc-system/arc selects on the component label.
          app.kubernetes.io/name: the-ninth-banner-arc-listener
      spec:
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          seccompProfile:
            type: RuntimeDefault
        containers:
          - name: listener
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests: { cpu: 10m, memory: 32Mi }
              limits: { cpu: 200m, memory: 128Mi }
    template:
      metadata:
        labels:
          # CiliumNetworkPolicy the-ninth-banner-runners-egress + anti-affinity
          app.kubernetes.io/name: the-ninth-banner-runner
          ci.cberg.home/lane: cpu
          ci.cberg.home/suite: gha-runner
      spec:
        # Negative priority, never preempts (cluster-scoped, from
        # ../../the-ninth-banner-tests/app/priorityclass.yaml).
        priorityClassName: ci-low
        # The chart's <name>-no-permission ServiceAccount has no RBAC; also
        # never mount its token. Runner pods have no Kubernetes API access.
        automountServiceAccountToken: false
        enableServiceLinks: false
        securityContext:
          # pwuser in the Playwright image = runner user in the actions-runner
          # image = uid/gid 1001
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          fsGroup: 1001
          seccompProfile:
            type: RuntimeDefault
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    # Owner, 2026-10-06: the CI farm is nuc14-01 + nuc14-03.
                    # nuc14-02 stays excluded (suspected cooler defect, plan
                    # ci-runner-exclude-node02), the shard Job template excludes it too.
                    - key: kubernetes.io/hostname
                      operator: In
                      values: ["k8s-nuc14-01", "k8s-nuc14-03"]
          podAntiAffinity:
            # Owner 2026-10-06: no hard one-runner-per-node rule any more. Pods
            # of all three pools may share a node. The thermal gate was removed
            # 2026-10-06, so the scheduler places every pod; this preferred
            # term spreads them and the pool maxRunners bound the load.
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  topologyKey: kubernetes.io/hostname
                  namespaceSelector: {}
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: the-ninth-banner-runner
        initContainers:
          # The runner agent comes from the official image; the job runs in
          # the game's pinned Playwright image (Node 24, npm, git, browsers in
          # /ms-playwright), the same digest as job-template.yaml.tpl and the
          # game's tests/e2e/runner.json. Keep both images current: GitHub
          # stops assigning jobs to a runner version that is too old (ARC
          # registers runners with updates disabled).
          - name: runner-agent
            image: ghcr.io/actions/actions-runner:2.338.0@sha256:4ffadc0002b2581327e06101fc8c06cd189232baf79fe561fac9caeb76f5e807
            # Copy the entries, not "/home/runner/." itself: cp -a on "." tries to
            # set times on the emptyDir mount root, which uid 1001 does not own.
            command: ["sh", "-c", "find /home/runner -mindepth 1 -maxdepth 1 -exec cp -a {} /runner/ \\;"]
            securityContext: &csc
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests: { cpu: 100m, memory: 128Mi, ephemeral-storage: 256Mi }
              limits: { cpu: 500m, memory: 256Mi, ephemeral-storage: 1Gi }
            volumeMounts:
              - { name: runner, mountPath: /runner }
        containers:
          - name: runner
            image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
            command: ["/runner/run.sh"]
            workingDir: /runner
            env:
              - name: HOME
                value: /home/pwuser
              # Node sees all host CPUs; keep libuv/V8 helper pools sane
              - name: UV_THREADPOOL_SIZE
                value: "4"
            securityContext: *csc
            resources:
              # cpu-lane pod (the gate counts it as one). Owner 2026-10-06: up
              # to 6 CPU (Vitest was CPU-bound at 2), bursts toward the limit
              # accepted. Request 1.5 (+ postgres 0.1 = 1.6) is sized for the
              # gate's 6-CPU node budget: 2 runners + 1 build pod (2.0) = 5.2
              # per node, below the ~7.7 CPU production leaves free on
              # nuc14-01/03. Browser jobs use the separate GPU scale set.
              requests: { cpu: 1500m, memory: 2Gi, ephemeral-storage: 2Gi }
              limits: { cpu: "6", memory: 6Gi, ephemeral-storage: 16Gi }
            volumeMounts:
              - { name: runner, mountPath: /runner }
              - { name: home, mountPath: /home/pwuser }
              - { name: tmp, mountPath: /tmp }
          - name: postgres
            image: postgres:18-alpine
            env:
              - { name: POSTGRES_PASSWORD, value: postgres }
              - { name: PGDATA, value: /tmp/pgdata }
            securityContext:
              runAsNonRoot: true
              runAsUser: 70
              runAsGroup: 70
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            resources:
              requests: { cpu: 100m, memory: 128Mi }
              limits: { cpu: 500m, memory: 512Mi }
        volumes:
          # runner agent + _work (checkout, node_modules, tool cache)
          - name: runner
            emptyDir: { sizeLimit: 12Gi }
          # npm cache, git config
          - name: home
            emptyDir: { sizeLimit: 4Gi }
          - name: tmp
            emptyDir: { sizeLimit: 4Gi }
