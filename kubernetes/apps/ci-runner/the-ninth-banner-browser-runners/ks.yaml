---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: the-ninth-banner-browser-runners
  namespace: flux-system
spec:
  targetNamespace: ci-runner
  dependsOn:
    - name: the-ninth-banner-runners
  path: ./kubernetes/apps/ci-runner/the-ninth-banner-browser-runners/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
