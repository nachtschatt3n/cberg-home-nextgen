---
apiVersion: v1
kind: Namespace
metadata:
  name: ci-runner
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    # Test pods run as the image's non-root pwuser with no capabilities, so the
    # strictest profile fits (only cert-manager was restricted before).
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
