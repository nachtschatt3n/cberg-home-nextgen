# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app the-ninth-banner-tests
  # flux-system, NOT ci-runner: SOPS decryption (sops-age) and postBuild
  # substitution (cluster-secrets) are resolved in the Kustomization's own
  # namespace, and ci-runner must not hold either (see ../kustomization.yaml).
  namespace: flux-system
spec:
  targetNamespace: ci-runner
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/ci-runner/the-ninth-banner-tests/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
