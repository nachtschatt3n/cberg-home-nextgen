# Ceiling for the whole namespace = 6 concurrent shards at 2 CPU / 6Gi requested
# (4 CPU limit). Raised from 3 on 2026-10-04 TOGETHER WITH the thermal gate
# (scripts/ninth-banner-admit.py): the quota is now only the total cap; WHERE and
# WHEN a shard starts is decided by the gate (node 2m avg < 85 C, 3m peak < 93 C,
# at most 2 CI pods per node). Headroom measured 2026-10-04: production requests
# 8.4-10.7 of 17 CPU and 21-32 of 58Gi per node, GPU slots free 2/3/3, so 2 shards
# (4 CPU / 12Gi / 2 i915) fit every node. PriorityClass ci-low never preempts, and
# production (priority >= 0) preempts CI. Gated (queued) pods count here too.
# Rollback to 3: docs/sops/ci-runner.md "Thermal gate" -> Rollback.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ci-runner-quota
  namespace: ci-runner
spec:
  hard:
    pods: "6"
    requests.cpu: "12"
    requests.memory: 36Gi
    requests.ephemeral-storage: 50Gi
    limits.cpu: "24"
    limits.memory: 60Gi
    limits.ephemeral-storage: 100Gi
    services: "0"
    services.loadbalancers: "0"
    services.nodeports: "0"
    persistentvolumeclaims: "0"
    # Device-plugin resources: at most one shared iGPU slot per running shard
    # (6 shards, at most 2 per node via the thermal gate), and NEVER the plugin's all-device monitoring
    # resources or the NPU, whatever a future template edit asks for.
    requests.gpu.intel.com/i915: "6"
    requests.gpu.intel.com/monitoring: "0"
    requests.gpu.intel.com/i915_monitoring: "0"
    requests.npu.intel.com/accel: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: ci-runner-defaults
  namespace: ci-runner
spec:
  limits:
    - type: Container
      default:
        cpu: "1"
        memory: 1Gi
        ephemeral-storage: 2Gi
      defaultRequest:
        cpu: 100m
        memory: 256Mi
        ephemeral-storage: 256Mi
      max:
        cpu: "4"
        memory: 10Gi
