---
# Ceiling for the whole namespace = 3 concurrent shards at 3 CPU / 6Gi
# requested. Measured 2026-10-03: each NUC has 17 allocatable CPU with
# ~10-11 CPU and ~45-50% memory already REQUESTED by production, so 3 CPU per
# node leaves every node >= 3 CPU of request headroom. A 4th shard pod (or a
# second concurrent run) waits in Pending instead of squeezing production.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ci-runner-quota
  namespace: ci-runner
spec:
  hard:
    pods: "4"
    requests.cpu: "9500m"
    requests.memory: 19Gi
    requests.ephemeral-storage: 30Gi
    limits.cpu: "19"
    limits.memory: 32Gi
    limits.ephemeral-storage: 54Gi
    services: "0"
    services.loadbalancers: "0"
    services.nodeports: "0"
    persistentvolumeclaims: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: ci-runner-defaults
  namespace: ci-runner
spec:
  limits:
    - type: Container
      default:
        cpu: "1"
        memory: 1Gi
        ephemeral-storage: 2Gi
      defaultRequest:
        cpu: 100m
        memory: 256Mi
        ephemeral-storage: 256Mi
      max:
        cpu: "6"
        memory: 10Gi
