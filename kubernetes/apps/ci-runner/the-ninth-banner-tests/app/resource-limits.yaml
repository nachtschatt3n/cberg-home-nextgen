# Ceiling for the whole namespace. The THERMAL GATE (2026-10-04) was removed
# 2026-10-06 (docs/sops/ci-runner.md §2b): this quota, node requests and the
# 35/55 W RAPL caps are now the only limits on CI load. Resources are sized for
# 24 browser-sized pods (2 CPU / 6Gi request; cpu-lane pods ask 1 CPU / 1Gi).
# i915: 2 browser pods per node running (6) + 6 queued. Production requests
# leave 6.4-7.2 of 17 CPU and 2/3/3 GPU slots free per node (measured
# 2026-10-04); PriorityClass ci-low never preempts, and production preempts CI.
# 2026-10-06: +5 pods and their resources for the ARC runner pods that share
# this namespace (ninth-banner-k8s max 4 at 1.6/6.5 CPU, ninth-banner-browser-k8s
# max 1), so warm/busy runners never eat the 24 shard pods' room.
# 2026-10-12: ninth-banner-k8s max 4 -> 6 (nuc14-02 back): +2 pods, +3.2 CPU /
# +4.25Gi / +4Gi requests, +13 CPU / +13Gi / +36Gi limits.
# Rollback: docs/sops/ci-runner.md §11 Rollback Plan.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ci-runner-quota
  namespace: ci-runner
spec:
  hard:
    pods: "31"
    requests.cpu: "62"
    requests.memory: 165Gi
    requests.ephemeral-storage: 216Gi
    limits.cpu: "141"
    limits.memory: 293Gi
    limits.ephemeral-storage: 516Gi
    services: "0"
    services.loadbalancers: "0"
    services.nodeports: "0"
    persistentvolumeclaims: "0"
    # Device-plugin resources: one shared iGPU slot per browser shard (bounded by the
    # quota and the 5 iGPU slots per node), and NEVER the plugin's
    # all-device monitoring resources or the NPU, whatever a future template edit asks for.
    requests.gpu.intel.com/i915: "13"
    requests.gpu.intel.com/monitoring: "0"
    requests.gpu.intel.com/i915_monitoring: "0"
    requests.npu.intel.com/accel: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: ci-runner-defaults
  namespace: ci-runner
spec:
  limits:
    - type: Container
      default:
        cpu: "1"
        memory: 1Gi
        ephemeral-storage: 2Gi
      defaultRequest:
        cpu: 100m
        memory: 256Mi
        ephemeral-storage: 256Mi
      max:
        # 6: ARC runner limit (owner 2026-10-06); test shards stay at 4 via the template
        cpu: "6"
        memory: 10Gi
