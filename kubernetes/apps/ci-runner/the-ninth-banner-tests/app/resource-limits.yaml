---
# Ceiling for the whole namespace = 3 concurrent shards at 2 CPU / 6Gi
# requested (4 CPU limit: thermal cap, see job-template.yaml.tpl). Measured 2026-10-03: each NUC has 17 allocatable CPU with
# ~13-14 CPU (76-81%) already REQUESTED by production, so 2 CPU per node keeps
# >= 1 CPU of request headroom; PriorityClass ci-low never preempts. A 4th shard pod (or a
# second concurrent run) waits in Pending instead of squeezing production.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ci-runner-quota
  namespace: ci-runner
spec:
  hard:
    pods: "4"
    requests.cpu: "6500m"
    requests.memory: 19Gi
    requests.ephemeral-storage: 30Gi
    limits.cpu: "13"
    limits.memory: 32Gi
    limits.ephemeral-storage: 54Gi
    services: "0"
    services.loadbalancers: "0"
    services.nodeports: "0"
    persistentvolumeclaims: "0"
    # Device-plugin resources: at most one shared iGPU slot per running shard
    # (GPU-mode parallelism 3, one per node), and NEVER the plugin's all-device monitoring
    # resources or the NPU, whatever a future template edit asks for.
    requests.gpu.intel.com/i915: "3"
    requests.gpu.intel.com/monitoring: "0"
    requests.gpu.intel.com/i915_monitoring: "0"
    requests.npu.intel.com/accel: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: ci-runner-defaults
  namespace: ci-runner
spec:
  limits:
    - type: Container
      default:
        cpu: "1"
        memory: 1Gi
        ephemeral-storage: 2Gi
      defaultRequest:
        cpu: 100m
        memory: 256Mi
        ephemeral-storage: 256Mi
      max:
        cpu: "4"
        memory: 10Gi
