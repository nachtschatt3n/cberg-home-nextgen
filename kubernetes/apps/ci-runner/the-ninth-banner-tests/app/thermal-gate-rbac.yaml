---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: arc-thermal-gate
  namespace: ci-runner
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: arc-thermal-gate
  namespace: ci-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: arc-thermal-gate
subjects:
  - kind: ServiceAccount
    name: arc-thermal-gate
    namespace: arc-system
