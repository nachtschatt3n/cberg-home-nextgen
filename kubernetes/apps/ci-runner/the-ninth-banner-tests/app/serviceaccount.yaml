---
# No Role/RoleBinding exists in ci-runner and the token is never mounted: a
# test pod has no Kubernetes API access at all.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: the-ninth-banner-tests
  namespace: ci-runner
automountServiceAccountToken: false
---
# The namespace's auto-created `default` SA, declared so it too never mounts a
# token (a pod created without serviceAccountName would otherwise get one).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: ci-runner
automountServiceAccountToken: false
