---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# mail-ingest image (Stalwart inbound shim, see containers/mail-ingest/app/main.py).
# Same contract as sweep-dashboard.yaml (weekly-rebuild program item F, Scheme S):
#
# Push path: on pushes touching containers/mail-ingest, runs the unit tests,
# builds, smoke-tests and publishes `sha-<7hex>` + `latest`.
#
# Schedule/dispatch path: weekly pull + no-cache rebuild so the digest-pinned
# base's Debian packages get `apt-get upgrade`d, smoke-tested, then published as
# `sha-<7hex>-b<YYYYMMDD>` + `weekly`. <7hex> is the LAST COMMIT TOUCHING
# containers/mail-ingest (on a schedule GITHUB_SHA is the unrelated repo HEAD).
# The plain `sha-<7hex>` tag the cluster pins is never re-pushed by the schedule.
#
# Keepalive: GitHub disables scheduled workflows after 60 days without repo
# activity; the last step re-enables this workflow (actions: write).
name: "Mail Ingest Image"

on:
  push:
    branches: ["main"]
    paths:
      - containers/mail-ingest/**
      - .github/workflows/mail-ingest.yaml
  schedule:
    - cron: "15 5 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  actions: write   # keepalive step re-enables this workflow

concurrency:
  group: mail-ingest-build
  cancel-in-progress: false

jobs:
  build:
    name: Test, build and push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed for `git log -- containers/mail-ingest`

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests (fake SMTP server via aiosmtpd)
        working-directory: containers/mail-ingest
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image and tag
        id: meta
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${OWNER_LC}/mail-ingest" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=sha-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
            echo "float=latest" >> "$GITHUB_OUTPUT"
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
          else
            SHA7=$(git log -1 --format=%H -- containers/mail-ingest | cut -c1-7)
            [ -n "$SHA7" ] || { echo "no commit touches containers/mail-ingest"; exit 1; }
            echo "tag=sha-${SHA7}-b$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
            echo "float=weekly" >> "$GITHUB_OUTPUT"
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (loaded locally so the smoke-tested image is what gets pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/mail-ingest/Dockerfile
          platforms: linux/amd64
          load: true
          pull: ${{ steps.meta.outputs.rebuild == 'true' }}
          no-cache: ${{ steps.meta.outputs.rebuild == 'true' }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.float }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (starts as non-root, /healthz ok, unsigned ingest is 401)
        env:
          REF: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
        run: |
          docker run -d --name ingest --network host \
            -e INGEST_HMAC_KEY="smoke-smoke-smoke-smoke-smoke-smoke-smoke" \
            -e SECRET_DOMAIN="example.test" "$REF"
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/healthz 2>/dev/null | grep -qx ok && break
            [ "$(docker inspect -f '{{.State.Running}}' ingest)" = true ] || { docker logs ingest; exit 1; }
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz | grep -qx ok || { docker logs ingest; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST --data-binary 'x' http://127.0.0.1:8080/v1/ingest)
          [ "$code" = 401 ] || { echo "unsigned ingest returned $code, want 401"; docker logs ingest; exit 1; }
          [ "$(docker exec ingest id -u)" = 1000 ] || { echo "not running as uid 1000"; exit 1; }
          docker rm -f ingest

      - name: Push
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
          FLOAT: ${{ steps.meta.outputs.float }}
        run: |
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:$FLOAT"
          docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest.Digest}}'

      - name: Keepalive (re-enable this workflow; resets the 60-day inactivity timer)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/mail-ingest.yaml/enable"
