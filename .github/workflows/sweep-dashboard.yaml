---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# Weekly-rebuild program item F (2026-09-27).
#
# Push path (unchanged contract): builds on pushes touching the dashboard and
# publishes `sha-<7hex>` + `latest`, exactly as before.
#
# Schedule/dispatch path (NEW, Scheme S): weekly pull + no-cache rebuild so the
# python:3.12-slim-bookworm base and the Dockerfile's apt upgrade are fresh,
# smoke-tested against a throwaway Postgres (the app refuses to start without a
# reachable DB: lifespan opens the pool with wait=True), then published as
# `sha-<7hex>-b<YYYYMMDD>` + `weekly`. <7hex> is the LAST COMMIT TOUCHING
# containers/sweep-dashboard -- on a schedule, GITHUB_SHA is the whole-repo HEAD,
# which would name a commit unrelated to the image content. The plain
# `sha-<7hex>` tag the cluster pins is never re-pushed by the scheduled path.
#
# Keepalive: GitHub disables scheduled workflows after 60 days without repo
# activity; the last step re-enables this workflow (actions: write).
#
# The Dockerfile runs `apt-get upgrade` in its only stage, so a no-cache
# rebuild picks up Debian security updates without a code change.
name: "Sweep Dashboard Image"

on:
  push:
    branches: ["main"]
    paths:
      - containers/sweep-dashboard/**
      - .github/workflows/sweep-dashboard.yaml
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  actions: write   # keepalive step re-enables this workflow

concurrency:
  group: sweep-dashboard-build
  cancel-in-progress: false

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: smoke
          POSTGRES_PASSWORD: smoke
          POSTGRES_DB: smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smoke" --health-interval 2s
          --health-timeout 5s --health-retries 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # needed for `git log -- containers/sweep-dashboard`

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image and tag
        id: meta
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${OWNER_LC}/sweep-dashboard" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=sha-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
            echo "float=latest" >> "$GITHUB_OUTPUT"
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
          else
            # Whole-repo HEAD is not the image's commit: tag from the last
            # commit that touched the dashboard (same 7-hex the push path used).
            SHA7=$(git log -1 --format=%H -- containers/sweep-dashboard | cut -c1-7)
            [ -n "$SHA7" ] || { echo "no commit touches containers/sweep-dashboard"; exit 1; }
            echo "tag=sha-${SHA7}-b$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
            echo "float=weekly" >> "$GITHUB_OUTPUT"
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (loaded locally so the smoke-tested image is what gets pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/sweep-dashboard/Dockerfile
          platforms: linux/amd64
          load: true
          # Schedule + dispatch: fresh base and a real apt upgrade (no cache).
          pull: ${{ steps.meta.outputs.rebuild == 'true' }}
          no-cache: ${{ steps.meta.outputs.rebuild == 'true' }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.float }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (starts, opens the DB pool, /api/health answers ok)
        env:
          REF: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
        run: |
          docker run -d --name dash --network host \
            -e SWEEP_PG_DSN="host=127.0.0.1 port=5432 dbname=smoke user=smoke password=smoke" "$REF"
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/api/health 2>/dev/null | grep -qx ok && break
            [ "$(docker inspect -f '{{.State.Running}}' dash)" = true ] || { docker logs dash; exit 1; }
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/api/health | grep -qx ok || { docker logs dash; exit 1; }
          docker rm -f dash

      - name: Push
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
          FLOAT: ${{ steps.meta.outputs.float }}
        run: |
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:$FLOAT"
          docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest.Digest}}'

      - name: Keepalive (re-enable this workflow; resets the 60-day inactivity timer)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/sweep-dashboard.yaml/enable"
