[env]
_.python.venv = { path = "{{config_root}}/.venv", create = true }
KUBERNETES_DIR = '{{config_root}}/kubernetes'
KUBECONFIG = "{{config_root}}/kubeconfig"
SOPS_AGE_KEY_FILE = "{{config_root}}/age.key"
TALOSCONFIG = "{{config_root}}/kubernetes/bootstrap/talos/clusterconfig/talosconfig"

[tasks.deps]
description = "Install dependencies"
run = "uv pip install -r requirements.txt"

[tools]
# Template tools
python = "3.12"
uv = "latest"
"aqua:charmbracelet/gum" = "0.17.0"
"aqua:cloudflare/cloudflared" = "2026.10.7"
"aqua:FiloSottile/age" = "1.3.2"
"aqua:fluxcd/flux2" = "2.10.0"
"aqua:getsops/sops" = "3.13.3"
"aqua:go-task/task" = "3.54.0"
"aqua:helm/helm" = "3.22.1"
"aqua:helmfile/helmfile" = "0.171.0"
"aqua:jqlang/jq" = "1.7.1"
"aqua:kubernetes-sigs/kustomize" = "5.6.0"
"aqua:kubernetes/kubectl" = "1.36.0"
"aqua:mikefarah/yq" = "4.54.1"
"aqua:siderolabs/talos" = "1.14.1"  # CLI pin — track the CLUSTER (talosVersion in
                                     # kubernetes/bootstrap/talos/talconfig.yaml), not Renovate.
                                     # Renovate PR #212 proposes 1.14.0, a minor AHEAD of a v1.13.10
                                     # cluster: the siderolabs/* deny glob matches the dep NAME, so it
                                     # cannot tell this dev-tool pin from the node image and the tooling
                                     # mislabels it "needs a rolling node-reboot window" (F-9a58f400).
                                     # It needs neither a window nor a plan — it is a local binary.
"aqua:aquasecurity/trivy" = "0.76.1"
"aqua:yannh/kubeconform" = "0.8.0"
# flate -- the Flux renderer/validator that flux-local's archived README points
# at. Drives the SINGLE render gate (job `flate`, "Flate Render Gate") in
# .github/workflows/flux-local.yaml since 2026-09-23 (F-6b1dd22b); keep this pin
# and the action ref there in lockstep. No `aqua:` pin is possible (aqua-registry
# carries no home-operations/*), and `ubi:` is deprecated for removal in mise
# 2027.1.0, so use the `github:` backend. Renovate's built-in mise manager DOES
# extract this pin (depName `github:home-operations/flate`, measured with
# `renovate --dry-run=extract` 44.133.0 on 2026-10-26), but with no
# extractVersion for flate's `v`-prefixed release tags. That entry is switched
# off by the "mise: github:/cargo:/talhelper pins owned by the customManager"
# packageRule, and the annotation below feeds the `.mise.toml` customManager in
# .github/renovate.json5 instead, which carries extractVersion. The packageRule
# groupName "flate" bundles this pin and the action ref into ONE PR (no branch
# automerge) so they cannot drift apart. (The aqua: pins above ARE tracked
# natively by Renovate's mise manager.)
# renovate: datasource=github-releases depName=home-operations/flate extractVersion=^v(?<version>.+)$
"github:home-operations/flate" = "0.6.5"
# renovate: datasource=crate depName=unifictl
"cargo:unifictl" = "5.7.0"
# renovate: datasource=crate depName=zigbeectl
"cargo:zigbeectl" = "0.1.2"
# renovate: datasource=github-releases depName=budimanjojo/talhelper extractVersion=^v(?<version>.+)$
talhelper = "3.1.17"
