# auto-update-policy — what the scheduled sweep may auto-merge unattended.
#
# Model: the operator chose a "patch + minor" safe tier. So an OPEN Renovate PR
# auto-merges only when ALL of these hold (see runbooks/auto-update.py):
#   G1 type     : update_type in {patch, minor}
#   G2 policy   : depName is NOT blocked by a `deny` rule below
#   G3 breaking : no breaking-change signal in the target release notes
#                 (reuses check-all-versions' detect_breaking_changes)
#   G4 ci       : PR mergeable + every CI check green (no check is named;
#                 the render check is the Flate Render Gate — the flux-local
#                 test job was retired 2026-09-23, F-6b1dd22b)
# and APPLY is only performed on the cron-triggered sweep (SWEEP_TRIGGER=cron),
# never a manual read-only `operation sweep`.
#
# This file encodes operator knowledge that a component is risky REGARDLESS of
# its semver label — the human layer on top of the automated gates. Fail-safe:
# if this file is missing or unparseable, auto-update.py denies EVERYTHING.
#
# Edit → commit → push (git-tracked on purpose: an unattended-merge allowlist
# must be code-reviewed, not a mutable DB row). Bump `version` on every change.
version: "2026.11.28"

# ── Settle budgets (added 2026-11-28, F-08d5bc72) ───────────────────────────
# Per-component post-apply health-gate window, seconds, keyed "<namespace>/<app>"
# (the kubernetes/apps/<ns>/<app>/ directory a PR touches). Used only when a
# merged PR touches that app; every other batch keeps the default
# (AUTO_UPDATE_SETTLE_TIMEOUT=600). Never shortens the default.
settle_budget_s:
  ai/openclaw: 1200   # ~6-7 min to Ready after an image change (fsGroup chown of ~364k files + plugin installs)

# ── Image major ceilings (added 2026-10-23, F-6a859080) ─────────────────────
# Caps the MAJOR line the version checker may propose for ONE image in ONE
# component. Scoped by (component = HelmRelease name, repository), so other
# consumers of the same image keep tracking newer lines. Patches/minors inside
# the ceiling are still reported normally. Read by check-all-versions.py
# (get_latest_image_tag candidate filter); mirrored for Renovate by the
# `node` allowedVersions rule scoped to kubernetes/apps/ai/openclaw/** in
# .github/renovate.json5.
image_major_ceiling:
  - component: openclaw
    repository: node
    max_major: 24
    reason: "openclaw 2026.11.1 engines is node >=24.16.0 <25 || >=26.1.0 (node 22 is excluded from 2026.9.3 on). Rehearsed and rolled on node 24.22.x (2026-11-07); a node 26 move needs its own cloned-PVC rehearsal first."

# ── G5: release-age cooldown (added 2026-08-26, operator set 48h) ───────────
# An unattended merge waits until the PR's newest Renovate commit is this old.
# Supply-chain hygiene: poisoned releases are typically yanked within days, so
# the nightly lane must not merge day-old artifacts. CVE/security-driven bumps
# are WAIVED (merge at age 0): a known-bad current version outranks an
# unknown-new one. Unknown age HOLDS. Set 0 to disable the gate.
minimum_release_age_hours: 48

# Per-update_type override of the cooldown above (throughput program item B,
# operator-approved 2026-09-27: "patches aren't keeping pace"). A PATCH waits
# 24h; a MINOR (and anything unlisted) keeps the 48h base. Read by BOTH lanes
# via runbooks/lib/fast_lane.py::cooldown_hours(). A malformed value falls back
# to the base, never to 0. Delete the key to restore 48h for everything.
minimum_release_age_hours_by_type:
  patch: 24
  digest: 24   # same-tag rebuild of a stateless image (digest_bumps.stateless)

# ── Security fast lane (item B.3, 2026-09-27) ────────────────────────────────
# true => a NON-MAJOR bump whose CURRENT tag carries an open, non-accepted
# security finding "`<repo>:<tag>`: N fixable CRITICAL|HIGH CVE(s) — newer
# upstream tag available" skips the cooldown in BOTH lanes. The finding id is
# carried with the item and recorded (fast_lane=security); never the CVE detail.
# Needs SWEEP_PG_DSN; without it the bypass is OFF (cooldown holds). Everything
# else (G1-G4, G3 breaking/structural, health gate + auto-revert) still applies.
# Set false (or delete) to turn the bypass off.
security_cooldown_bypass: true

# ── Earned autonomy (item B.1, 2026-09-27) ───────────────────────────────────
# A non-major, non-0.x-minor, not-denied patch/minor whose release notes could
# NOT be verified ("notes unverified") is still AUTO-eligible when its
# component has a clean track record in sweep_history `component_autonomy`:
# >= min_green green applies AND <= max_reverts reverts in the last
# window_days. Greens count only AFTER the latest revert — a revert resets the
# component to zero. A POSITIVE breaking/structural signal still holds it; the
# cooldown still applies. Components without the record keep today's behaviour
# (unverified => PLAN). Needs SWEEP_PG_DSN; unreadable ledger => lane OFF.
# KILL SWITCH: delete this block.
earned_autonomy:
  min_green: 3
  window_days: 90
  max_reverts: 0

# deps whose bumps skip the cooldown even without a security marker in the PR
# (shell globs against depName, same syntax as deny.match). Keep short.
#
# Matched against BOTH the Renovate depName and, for coverage.py's direct-bump
# lane, the image repository — so a repo glob covers every component mounting
# that image (e.g. scan-inbox-validator rides the paperless-ngx image).
#
# The two entries below are the operator's 2026-09-04 call. Both components had
# open findings for FIXABLE CRITICAL CVEs whose fix tags were <48h old, and the
# direct-bump lane has no PR title for the security-marker waiver to read, so
# G5 would have held the CVE fixes for the full cooldown. That is exactly the
# case this file already calls out: "a known-bad current version outranks an
# unknown-new one."
#
# NOTE these are PERMANENT until removed — they waive the cooldown for ALL
# future mealie / paperless-ngx bumps, not just the CVE ones. Revisit if either
# component starts shipping regressions.
age_waive:
  - {match: "*mealie*", until: 2026-12-31, reason: "CVE-fix waiver, first bound set 2026-09-22 (F-7eaae066); re-decide before it lapses"}
  - {match: "*paperless-ngx*", until: 2026-12-31, reason: "CVE-fix waiver, first bound set 2026-09-22 (F-7eaae066); re-decide before it lapses"}
  # Added 2026-09-05, same reason as the two above. music-assistant 2.10.1 has
  # an open CRITICAL security finding (F-759a45b5) whose fix IS the 2.10.2 tag,
  # and G5 held that fix for the full 48h because the DIRECT-BUMP lane has no
  # PR title for the security-marker waiver to read. A known-bad current
  # version outranks an unknown-new one -- this file already says so; the
  # waiver just could not see the marker.
  - {match: "*music-assistant*", until: 2026-12-31, reason: "CVE-fix waiver, first bound set 2026-09-22 (F-7eaae066); re-decide before it lapses"}

# ── Digest-only bumps (2026-11-25) ───────────────────────────────────────────
# Renovate renders a same-tag rebuild as `update <dep> ( abc1234 → def5678 )`. It
# used to be typed update_type=unknown and therefore NEVER auto. It is now
# classified by WHAT the image is:
#   stateless  - listed EXACTLY (registry prefix and `library/` normalised, no
#                substring match: over-matching here is the UNSAFE direction).
#                AUTO-eligible behind the normal cooldown (digest: 24h) + CI.
#   stateful   - globs (over-matching is the safe direction). Routed to the PLAN
#                lane with the reason below: the tag does not move, but the
#                binary under a live data directory does.
#   anything else is `unclassified` and goes to PLAN (fail closed).
digest_bumps:
  stateless:
    - python
    - node
    - ubuntu
    - debian
    - alpine
    - busybox
    - phpmyadmin
    - actions/actions-runner
  stateful:
    - {match: "*postgres*", reason: "PostgreSQL engine image: a same-tag rebuild can move the minor binary under a live PGDATA; restore-from-dump is the only rollback"}
    - {match: "*pgvector*", reason: "PostgreSQL+pgvector engine image: a same-tag rebuild can move the extension version under live data (extension upgrade is one-way)"}
    - {match: "*mariadb*", reason: "MariaDB engine image: mariadb-upgrade is never run by the entrypoint; a rebuilt binary can leave old-format system tables"}
    - {match: "*nextcloud*", reason: "Nextcloud: image rebuilds run occ migrations on start and can break custom apps (Mail) or stick maintenance mode"}
    - {match: "*iobroker*", reason: "ioBroker: a rebuild can move js-controller and adapters under a persistent /opt/iobroker volume"}
    - {match: "*valkey*", reason: "key-value engine: a rebuilt binary reads the persisted RDB/AOF"}
    - {match: "*redis*", reason: "key-value engine: a rebuilt binary reads the persisted RDB/AOF"}

# ── Data protection catalogue (2026-11-25) ───────────────────────────────────
# A schema/data MIGRATION is AUTO-BACKUP-GATED only when the component is listed
# here AND its dump CronJob manifest exists in git AND it names a restore proof.
# The pipeline that applies it (maintenance-window plan, `auto-backup-gated`
# class in autonomy-policy.yaml) runs `restore_proof` at RUNTIME and applies only
# on PASS. Listing is a CLAIM that the proof tool fits the component: it is
# runbooks/backup-restore-proof.py, which restores the newest Completed Longhorn
# backup of the named volume into a scratch volume and boots postgres on it. It
# fits POSTGRES-on-Longhorn only; mariadb/sqlite/NAS-backed data is NOT listed,
# so a migration there stays PLAN (data-loss rule). A nightly pg_dump alone is a
# dump, not a restore proof, and is not enough.
data_protection:
  - match: "teslamate/teslamate"
    volume: teslamate-db
    dump_job: kubernetes/apps/backup/db-dumps/home-automation/cronjob-teslamate-postgres.yaml
    restore_proof: "runbooks/backup-restore-proof.py --volume teslamate-db --image <running postgres image>"
  - match: "paperless-ngx"
    volume: paperless-db-data
    dump_job: kubernetes/apps/backup/db-dumps/office/cronjob-paperless-db.yaml
    restore_proof: "runbooks/backup-restore-proof.py --volume paperless-db-data --image <running postgres image>"
  - match: "nocodb"
    volume: postgresql-data-5g
    dump_job: kubernetes/apps/backup/db-dumps/databases/cronjob-postgresql.yaml
    restore_proof: "runbooks/backup-restore-proof.py --volume postgresql-data-5g --image <running postgres image>"
  - match: "mealie"
    volume: mealie-pg-data
    dump_job: kubernetes/apps/backup/db-dumps/office/cronjob-mealie-pg.yaml
    restore_proof: "runbooks/backup-restore-proof.py --volume mealie-pg-data --image <running postgres image>"

# ── Acknowledged breaking-change items (2026-11-25) ──────────────────────────
# A release-notes item that LISTS a breaking change holds the bump unless it is
# acked here: `needle` is a substring of the item text, `evidence` says why it
# cannot touch this deployment (measured, dated), `until` is a hard expiry (an
# ack with no `until` or no `evidence` is inert). Acks are per component and
# per item, never per component wholesale: any OTHER item still holds.
breaking_ack:
  - match: "*longhorn*"
    needle: "Legacy V2 Linked Clone"
    until: 2027-02-28
    evidence: "measured 2026-11-25: settings v2-data-engine=false, helmrelease v2DataEngine=false, 77 of 77 Longhorn volumes dataEngine=v1; the item concerns V2 linked-clone volumes only"

# ── Hard blocks by dependency name ──────────────────────────────────────────
# `match` is a shell-style glob against the Renovate depName (the token between
# "update " and " (" in the PR title — image repo or chart name).
# `max` (optional): the highest update_type still allowed for a match. Omit to
# block the component entirely. e.g. max: patch  → allow patch, hold minor+.
deny:
  - match: "*authentik*"
    lane: plan
    reason: >-
      PLAN lane (rewritten 2026-11-25). The ORIGINAL reason (2026-09-22) is
      RESOLVED and no longer holds anything: G3 used to pass a bump whose release
      notes it could not read; since 2026-11-25 both lanes FAIL CLOSED on that
      (auto-update.py `breaking-unverified`, coverage.py PLAN routing), proven by
      runbooks/tests/test-update-risk-lanes.py. What remains is the SECOND,
      independent reason, re-measured 2026-11-25: Renovate opens the chart
      version and the two `patch-session-settings` initContainer pins
      (ghcr.io/goauthentik/server:<tag> at two sites in helmrelease.yaml) as
      SEPARATE PRs (#570 moves only the chart, #565 only the two image pins).
      The chart appVersion drives the running server image, so a chart-only bump
      DOES move the running image while the two patch-session-settings
      initContainers lag at the old tag: merging either PR alone overlays an OLD
      settings.py onto NEW server code with nothing asserting they agree. REMOVE THIS RULE only when one reviewed change moves
      the chart and BOTH pins together (a Renovate group rule for the chart +
      goauthentik/server, plus grouped-lockstep admission in auto-update.py), or
      a coupled-pin gate asserts equality before merge.
  # Reason REWRITTEN 2026-09-22 (F-af4e0882). The previous text justified the
  # hold with the 3.x -> 5.x MAJOR migration only — which G1 blocks on its own,
  # and which has since EXECUTED (every consumer is on one 5.x chart line) — so
  # the MINOR hold this rule actually performs had no stated hazard: the exact
  # false-reason shape the *nextcloud-mcp* comment below warns about. The minor
  # hazard is written down now, without version digits, so it survives drift.
  - match: "*app-template*"
    reason: "bjw-s app-template is the chart under EVERY plain-Deployment app in this
      cluster (79 HelmReleases, all on one chart version, measured live 2026-09-22) —
      the widest blast radius of any component in this file. A chart MINOR is where
      upstream adds template features and changes rendered defaults (probes, service,
      PVC and securityContext templating, values-key moves with deprecation shims),
      and Flux re-renders every consumer in one reconcile: a regression lands on all
      79 at once and cannot be localised — the post-apply health gate can say 'many
      pods NotReady', not which of the 79 values files hit the changed key, and the
      revert is a 79-release roll in the other direction. So minor+ goes through the
      PLAN lane with a rendered diff (helm template, old chart vs new, across all
      consumers) before it moves. The MAJOR migration is G1's job, not this rule's.
      NARROWED to `max: patch` 2026-09-12 (operator call): patches change no template
      semantics and auto-merge; if a patch ever regresses broadly, restore the FULL
      block rather than reasoning about which of the 79 broke."
    max: patch
  # NARROWED 2026-09-26 from "*affine*" to the AFFiNE application image. The
  # hazard (env -> config.json moves on patch tags) is a property of the AFFiNE
  # app, but the old glob also matched every sibling component whose NAME
  # contains "affine" -- it diverted two consecutive plain redis patches of
  # `affine-redis` (redis:8.x-alpine) into window plans with this false reason.
  # AFFiNE runs on the shared app-template chart, so there is no affine chart to
  # hold; the direct-bump lane matches this glob against the image repository
  # (denied_for_item), the PR lane against the Renovate depName.
  - match: "*toeverything/affine*"
    reason: "AFFiNE app image bumps carry breaking env→config.json changes even on patch tags (0.27.3) — hold for manual review."
  - match: "*cilium*"
    lane: weekend-attended
    reason: "CNI datapath — never an unattended bump. The hold is about CONSEQUENCE,
      not a specific release: a bad cilium roll takes the cluster network with it, and
      every Flux controller that would revert it sits inside the failure domain.
      CORRECTED 2026-09-20 (F-19e12a92): the previous reason cited Gateway-API and
      mutual-auth caveats in 1.20.0. Measured live, those cannot apply here —
      `enable-gateway-api` is absent from cm/cilium-config, `mesh-auth-enabled` is
      false, and the only GatewayClass belongs to Envoy Gateway (a separate product).
      The cluster is also already past 1.20.0. The stale clause had mis-briefed a
      planner dispatch, so it is removed rather than carried. Requires an attended
      slot, a plan that exercises a FRESH CNI ADD (existing pods keep networking from
      in-kernel BPF state, so every ordinary gate can pass while new-pod networking is
      broken), and an operator GO."
  - match: "*gateway-helm*"
    lane: weekend-attended
    reason: "DEPLOYED and parallel-running since 69daf59c; bumped to 1.9.0 on 2026-08-16
      (phase 0.5) at zero Envoy traffic, which put the cluster back ON the support matrix
      (EG 1.9 covers k8s 1.33-1.36; 1.8 covered 1.32-1.35 only and this cluster runs 1.36).
      The DNS-outage trigger is RESOLVED, not live. Hold STAYS: a chart bump drags the
      Gateway API CRD channel with it. v1.5.1 -> v1.6.1 was tolerated by k8s-gateway
      3.7.2/1.8.0, but that is a property of app 1.8.0 informing only on [Ingress Service]
      — the NEXT channel bump is still unproven, and phase 1 adds HTTPRoute informers,
      which is exactly where the plugin does start route informers. Any bump must run the
      restart gate in docs/sops/k8s-gateway-dns.md (twice), and note that bundle's
      ValidatingAdmissionPolicy blocks rolling BACK to an older bundle-version."
  - match: "*gateway-crds-helm*"
    lane: weekend-attended
    reason: "DEPLOYED — same hold as gateway-helm. The CRDs remain the actual outage trigger:
      k8s_gateway starts informers for the Gateway API route family and fails CLOSED for
      EVERY name if a version it expects is not served. Latent — it only fires when a
      k8s-gateway pod restarts. Never unattended."
  - match: "*k8s-gateway*"
    lane: weekend-attended
    reason: >-
      Internal DNS for the entire cluster, pinned at chart 3.7.2. Upstream has
      relocated THREE times (ori-edge -> GitHub org -> Codeberg/kapsi.fi) and the
      last move was unannounced with the old GitHub Pages host DELETED rather than
      redirected, which took cluster-apps down on 2026-09-11 until the source was
      repointed (8c2a2d84), and then migrated to an OCIRepository on the chart's own
      signed GHCR registry (43a3b3e4). IMPORTANT: this rule is NOT the trust anchor
      any more -- the DIGEST pinned in
      kubernetes/apps/network/internal/k8s-gateway/ocirepository.yaml is. An
      OCIRepository re-resolves tag -> digest hourly and GHCR does not enforce tag
      immutability, whereas this rule only gates git-VISIBLE version changes
      (Renovate PRs, coverage.py bumps). It still holds that git-visible pin, which
      is why it stays. The relocated 3.7.2 tarball was also NOT byte-identical to the
      one we ran (9195 -> 9616 bytes, different digest); it was proven equivalent
      only by extracting both and diffing `helm template` output against the live
      values. No future version gets that for free. The real unattended risk is a
      TEMPLATE change rolling the DNS pods -- not an app-version jump, since the
      HelmRelease pins image.tag 1.8.0 explicitly. Any bump needs a fresh rendered
      output diff against the pinned chart plus the restart gate in
      docs/sops/k8s-gateway-dns.md. Never unattended.
  - match: "*envoy-gateway*"
    lane: weekend-attended
    reason: "Catch-all for Envoy Gateway artifacts (image/chart aliases) — same hold as gateway-helm.
      A chart patch whose revendor.sh diff is header-only (CRD content unchanged) uses
      CRD-identity + k8s-gateway pod-age comparison + the DNS probe instead of the
      k8s-gateway restart gate (docs/sops/envoy-gateway-upgrade.md, Verification Tests);
      any CRD content change keeps the full restart-twice gate."
  # Added 2026-09-22 with the Renovate rule that makes this tag comparable
  # (F-58dbe939). Before it, no PR could exist for this image (docker versioning
  # rejected the `distroless-v` prefix); after it, an operator-approved PR is an
  # ordinary docker minor/patch and NOTHING above matched its name — the
  # *envoy-gateway* catch-all does not contain "envoyproxy/envoy". This closes
  # that door; the Renovate side is dependencyDashboardApproval.
  - match: "*envoyproxy/envoy*"
    lane: weekend-attended
    reason: "Envoy DATA-PLANE image, pinned tag+digest in the EnvoyProxy resource
      (kubernetes/apps/network/envoy-gateway/app/gatewayclass.yaml). COUPLED to the
      controller: every Envoy Gateway release compiles in the Envoy it was tested with,
      so this pin moves only in the SAME change as the gateway-helm chart bump, to that
      release's DefaultEnvoyProxyImage — never on its own, never unattended. Same hold
      as gateway-helm; PLAN lane with the restart gate in docs/sops/k8s-gateway-dns.md,
      unless the CRD re-vendor is header-only (see the *envoy-gateway* rule)."
  # Added 2026-09-08 after an ATTENDED image pin (v0.21.0 -> v0.22.0 under chart
  # 1.21.1) took public DNS down for 94s and was reverted (aa79cf7a). Chart
  # 1.22.x will ship appVersion 0.22.0 and would classify as a safe MINOR — i.e.
  # it would land at Step 0 of an UNATTENDED nightly window, with nobody
  # watching and nothing to revert it. The bound on tonight's outage was the
  # operator being awake; that is not a control. security_ref: F-14528040
  # Reason corrected 2026-09-15 (plan external-dns-1.22.0 §1.2-1.5, verified
  # against the v0.22.0 source): the earlier text prescribed `--default-targets`,
  # which is crd-source-only and would reproduce the outage in a break-glass.
  - match: "*external-dns*"
    lane: weekend-attended
    reason: "public DNS for every internet-facing hostname, and `policy: sync` DELETES a
      record before it can fail to recreate it — so a misconfigured target is an outage, not
      a no-op. v0.22.0 switched the default annotation prefix to GA with NO fallback
      (upstream #6424): the gateway-httproute source now reads
      `external-dns.kubernetes.io/target` on the PARENT Gateway and, finding only our
      `external-dns.alpha.kubernetes.io/target`, publishes the Gateway's LAN status address
      instead — which Cloudflare rejects for a proxied record AFTER sync has already deleted
      the CNAME (the 2026-09-08 94 s outage). The remedy is the GA key
      `external-dns.kubernetes.io/target` on Gateway envoy-external, landed and verified
      live BEFORE the version moves (keep the alpha key as the v0.21 rollback path);
      fallback is `--annotation-prefix=external-dns.alpha.kubernetes.io/` in the SAME
      change. `--default-targets` is NOT a fix — it applies only to DNSEndpoint/crd
      sources with empty targets, so a bump carrying it reproduces the outage. A bare
      version bump is known-broken, whatever its semver label says. PLAN lane only,
      attended, with the record set captured before and after. security_ref: F-14528040"
  # Added 2026-09-15 (F-71dc3610, operator call). Frigate is a 0.x project, so
  # its MINOR is the breaking axis: 0.18.0 parses as a "minor" that G1 admits,
  # yet ships a config migrator (flat `genai:` -> `genai.default` + roles,
  # `clean_copy` removed, snapshot format -> WebP), three sqlite migrations and
  # a kernel floor. coverage.py's 0.x rule already routes the direct-bump half
  # to PLAN; this rule closes the OTHER door — an open Renovate PR labelled
  # `minor` auto-merging at Step 0 with only G3 (best-effort release-notes
  # scan) between it and a privileged NVR pod that starts in SAFE MODE (Ready,
  # UI up, zero cameras) when its ConfigMap-mounted, read-only config is not
  # migrated. `max: patch` keeps 0.17.x patches flowing; every minor goes
  # through a plan (runbooks/maintenance/plans/frigate-0.18.0.md is the first).
  - match: "*frigate*"
    reason: "0.x project: a MINOR is a release-line move with config migration + sqlite
      migrations (0.18.0: genai provider mapping, clean_copy removed, WebP snapshots,
      kernel >= 6.5). Read-only ConfigMap config cannot be auto-migrated, so an
      unattended bump starts Frigate in safe mode with zero cameras while every probe
      stays green. Patch bumps stay on the line and auto-merge; minor+ is PLAN lane."
    max: patch
  # Added 2026-10-26 (sweep a1721200, plan-reviewer on tube-archivist-0.6.0).
  # Tube Archivist is a 0.x project: its MINOR is the breaking axis. PR #432
  # (v0.5.12 -> v0.6.0) is OPEN and nothing here or in coverage.py names this
  # image, so it classifies as a plain minor and could merge UNATTENDED at Step 0
  # of a window. The v0.6.0 line drops nginx and validates the Host header, so
  # a kubelet probe that sends the pod IP gets HTTP 400 and the app crash-loops
  # behind a bare tag bump. The fix is a plan (runbooks/maintenance/plans/
  # tube-archivist-0.6.0.md): probe Host header, artwork sync, ordering after
  # the Elasticsearch 9 plan. `max: patch` keeps 0.5.x patches flowing. The glob
  # also matches bbilly1/tubearchivist-es (verified with auto-update.policy_block:
  # patch allowed, minor and major blocked), which is harmless: its 9.x major is
  # a plan anyway and later ES minors belong in the plan lane too.
  - match: "*bbilly1/tubearchivist*"
    reason: "0.x project: v0.6.0 removes nginx and enforces ALLOWED_HOSTS, so the
      kubelet probe (Host = pod IP) gets HTTP 400 and the pod crash-loops on a bare
      tag bump while the manifest still looks valid. Needs the probe Host header and
      artwork-sync changes of plan tube-archivist-0.6.0, after the Elasticsearch
      plan. Patch bumps on 0.5.x stay AUTO; minor+ is PLAN lane."
    max: patch
  # TIME-BOXED HOLD, added 2026-11-02 (sweep 2ad957af; review of the talos-linux-1.14.5, otel-operator-0.26.1,
  # mealie-3.30.0, grafana-14.1.0 and edot-collector-0.164.0 plans). Renovate PR #428 (kube-prometheus-stack
  # 92.11.1 -> 92.17.0 when written; the PR has since moved to 92.22.0) clears its 48 h minor cooldown on 2026-11-02 ~23:30 and would land unattended at the next
