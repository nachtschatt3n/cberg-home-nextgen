# auto-update-policy — what the scheduled sweep may auto-merge unattended.
#
# Model: the operator chose a "patch + minor" safe tier. So an OPEN Renovate PR
# auto-merges only when ALL of these hold (see runbooks/auto-update.py):
#   G1 type     : update_type in {patch, minor}
#   G2 policy   : depName is NOT blocked by a `deny` rule below
#   G3 breaking : no breaking-change signal in the target release notes
#                 (reuses check-all-versions' detect_breaking_changes)
#   G4 ci       : PR mergeable + flux-local CI checks all green
# and APPLY is only performed on the cron-triggered sweep (SWEEP_TRIGGER=cron),
# never a manual read-only `operation sweep`.
#
# This file encodes operator knowledge that a component is risky REGARDLESS of
# its semver label — the human layer on top of the automated gates. Fail-safe:
# if this file is missing or unparseable, auto-update.py denies EVERYTHING.
#
# Edit → commit → push (git-tracked on purpose: an unattended-merge allowlist
# must be code-reviewed, not a mutable DB row). Bump `version` on every change.
version: "2026.09.05.2"

# ── G5: release-age cooldown (added 2026-08-26, operator set 48h) ───────────
# An unattended merge waits until the PR's newest Renovate commit is this old.
# Supply-chain hygiene: poisoned releases are typically yanked within days, so
# the nightly lane must not merge day-old artifacts. CVE/security-driven bumps
# are WAIVED (merge at age 0): a known-bad current version outranks an
# unknown-new one. Unknown age HOLDS. Set 0 to disable the gate.
minimum_release_age_hours: 48

# deps whose bumps skip the cooldown even without a security marker in the PR
# (shell globs against depName, same syntax as deny.match). Keep short.
#
# Matched against BOTH the Renovate depName and, for coverage.py's direct-bump
# lane, the image repository — so a repo glob covers every component mounting
# that image (e.g. scan-inbox-validator rides the paperless-ngx image).
#
# The two entries below are the operator's 2026-09-04 call. Both components had
# open findings for FIXABLE CRITICAL CVEs whose fix tags were <48h old, and the
# direct-bump lane has no PR title for the security-marker waiver to read, so
# G5 would have held the CVE fixes for the full cooldown. That is exactly the
# case this file already calls out: "a known-bad current version outranks an
# unknown-new one."
#
# NOTE these are PERMANENT until removed — they waive the cooldown for ALL
# future mealie / paperless-ngx bumps, not just the CVE ones. Revisit if either
# component starts shipping regressions.
age_waive:
  - "*mealie*"
  - "*paperless-ngx*"
  # Added 2026-09-05, same reason as the two above. music-assistant 2.10.1 has
  # an open CRITICAL security finding (F-759a45b5) whose fix IS the 2.10.2 tag,
  # and G5 held that fix for the full 48h because the DIRECT-BUMP lane has no
  # PR title for the security-marker waiver to read. A known-bad current
  # version outranks an unknown-new one -- this file already says so; the
  # waiver just could not see the marker.
  - "*music-assistant*"

# ── Hard blocks by dependency name ──────────────────────────────────────────
# `match` is a shell-style glob against the Renovate depName (the token between
# "update " and " (" in the PR title — image repo or chart name).
# `max` (optional): the highest update_type still allowed for a match. Omit to
# block the component entirely. e.g. max: patch  → allow patch, hold minor+.
deny:
  - match: "*app-template*"
    reason: "app-template 3.7.3→5.0.0 is a breaking chart migration wrapping ~40 HelmReleases — must be done deliberately, once."
  - match: "*affine*"
    reason: "affine chart/image bumps carry breaking env→config.json changes even on patch tags (0.27.3) — hold for manual review."
  - match: "*cilium*"
    reason: "CNI datapath — 1.20.0 carries Gateway-API/mutual-auth caveats that can affect streaming protocols (Music Assistant / Home Assistant). Plan + verify MA/HA streaming before upgrading; never an unattended bump."
  - match: "*gateway-helm*"
    reason: "DEPLOYED and parallel-running since 69daf59c; bumped to 1.9.0 on 2026-08-16
      (phase 0.5) at zero Envoy traffic, which put the cluster back ON the support matrix
      (EG 1.9 covers k8s 1.33-1.36; 1.8 covered 1.32-1.35 only and this cluster runs 1.36).
      The DNS-outage trigger is RESOLVED, not live. Hold STAYS: a chart bump drags the
      Gateway API CRD channel with it. v1.5.1 -> v1.6.1 was tolerated by k8s-gateway
      3.7.2/1.8.0, but that is a property of app 1.8.0 informing only on [Ingress Service]
      — the NEXT channel bump is still unproven, and phase 1 adds HTTPRoute informers,
      which is exactly where the plugin does start route informers. Any bump must run the
      restart gate in docs/sops/k8s-gateway-dns.md (twice), and note that bundle's
      ValidatingAdmissionPolicy blocks rolling BACK to an older bundle-version."
  - match: "*gateway-crds-helm*"
    reason: "DEPLOYED — same hold as gateway-helm. The CRDs remain the actual outage trigger:
      k8s_gateway starts informers for the Gateway API route family and fails CLOSED for
      EVERY name if a version it expects is not served. Latent — it only fires when a
      k8s-gateway pod restarts. Never unattended."
  - match: "*envoy-gateway*"
    reason: "Catch-all for Envoy Gateway artifacts (image/chart aliases) — same hold as gateway-helm."
  - match: "*mariadb*"
    reason: "A DB-engine bump is never unattended-safe. The bitnami entrypoint can SKIP
      mariadb-upgrade on a server-major roll while reporting Ready and the right
      SELECT VERSION() — leaving old-format system tables under the new binary.
      See docs/sops/mariadb-major-upgrade.md."
    max: patch
  - match: "*mcpo*"
    reason: "python init base image major (3.11→3.14) rides these tags."
  # Added 2026-08-19 with the 0.301.5 -> 2026.08.0 execution. NocoDB left semver
  # for calver, so the classifier's tuple comparison reads a routine month hop
  # (2026.08.0 -> 2026.09.0) as major=equal / minor=greater, i.e. "minor" — which
  # G1 admits for unattended apply. That inference is wrong for this component:
  # every monthly release runs knex schema migrations, on boot, into nocodb's
  # database inside the SHARED postgresql instance, and upstream documents no
  # downgrade — so the migration is one-way and a pre-dump is the only rollback.
  # An unattended Step-0 apply would perform exactly that with no dump taken.
  - match: "*nocodb*"
    reason: "calver — month bumps parse as `minor` but are FEATURE releases that run
      one-way knex schema migrations into the shared postgresql instance on boot.
      Upstream documents no downgrade, so rollback is restore-from-dump only.
      Never unattended: needs the mandatory pre-dump + operator acceptance gate
      from runbooks/maintenance/plans/nocodb-calver.md."
    max: patch
  # MUST stay above "*nextcloud*": first match wins, and the glob below would
  # otherwise swallow nextcloud-mcp and justify holding it with the Nextcloud
  # SERVER's occ/maintenance-mode reason. nextcloud-mcp is a standalone
  # third-party MCP bridge — no chart coupling, no occ, no maintenance mode —
  # so that reason was simply false, and a false reason is what makes an
  # operator override a hold that turns out to be real (0.176.0 drops a table).
  - match: "*nextcloud-mcp*"
    reason: "third-party MCP bridge; upstream ships BREAKING-tagged releases on minor hops (0.176.0 removed the webhook registration API and dropped its table; 0.177.0 tightened create_share). Read the release notes per hop — never an unattended bump."
  # Same reasoning as *nextcloud-mcp* above, same required position: without
  # this rule nextcloud-redis falls through to "*nextcloud*" and is held with
  # the Nextcloud SERVER's chart-lockstep/occ/maintenance-mode reason, which is
  # false for it. It is a plain Kustomize Deployment — no HelmRelease, no
  # chart, no occ — decoupled from the server since the bitnamilegacy-exit
  # cutover (2026-08-19). It still deserves a hold, but for its OWN reason:
  # this redis holds live PHP sessions and file-locking state with NO
  # persistence, so any swap signs out every logged-in user. Holding it for a
  # false reason is the failure mode already documented above — an operator who
  # disproves the stated reason overrides the hold, and the real risk (user
  # impact) rides along unnoticed.
  - match: "*nextcloud-redis*"
    reason: "session + file-lock store with no persistence: any restart signs out every logged-in Nextcloud user and drops held locks. Not chart-coupled to the server and no occ migrations — hold is about user impact, so schedule an ATTENDED low-traffic slot, never the unattended nightly lane."
  - match: "*nextcloud*"
    reason: "chart+image must bump together and run occ migrations (Mail custom_app / stuck-maintenance trap) — operator-supervised only."
  # Pre-release CHANNEL, not a version pin. Upstream cuts GitHub releases on ODD
  # minors only: v0.143.0 is the newest with prerelease=false, v0.144.x has NO
  # release at all, and the v0.144.0 tag was pushed 2025-10-31 — BEFORE stable
  # v0.143.0 (2025-11-16). So a "minor" bump here moves the cluster onto a beta
  # build of a PRIVILEGED NVR (privileged: true, SYS_ADMIN, i915). AR-081 rules
  # that channel unacceptable for this workload. Belt-and-braces: coverage.py's
  # channel gate already keeps it out of the AUTO lane's direct-bump path; this
  # rule closes the OTHER door, an open Renovate PR auto-merging at Step 0.
  - match: "*scrypted*"
    reason: "v0.144.x is upstream's PRE-RELEASE channel (stable = odd minors; no GitHub release for 144, and v0.144.0 predates stable v0.143.0). Beta builds are not acceptable on a privileged NVR — AR-081. A stable odd-minor bump is planned in a window, never unattended."
  # Chart and image are ONE deployable unit here. RETARGETED 2026-08-19: the old
  # note said "remove this rule when unpoller-v3 has executed" — it has (live is
  # chart 2.4.0 + image v3.5.0, matching that plan's target). Removing it now
  # would re-arm the same failure in the opposite direction: upstream released
  # image v4.0.0 on 2026-08-19 and the chart repo's newest entry is still
  # chart 2.4.0 -> appVersion v3.5.0 (published 2026-08-18), so NO v4-aware
  # chart exists. With the rule gone, the v4 image major would be free to land
  # unattended against a chart that templates for v3. Keep unpoller denied and
  # move it in plan unpoller-v4 once a v4 chart ships.
  - match: "*unpoller*"
    reason: "image v4.0.0 (2026-08-19) has no v4-aware chart — newest is chart 2.4.0/appVersion v3.5.0. Chart and image move together in plan unpoller-v4, never as an unattended half."
  - match: "*openclaw*"
    reason: "held at 2026.6.11 pending the Memory Core→SQLite migration (2026.7.1 blocked)."
  - match: "*@openclaw/*"
    reason: "openclaw plugins (discord/codex) move in lockstep with the held host."
  - match: "*coredns*"
    reason: "CLUSTER DNS, and currently image-tag-pinned AHEAD of the chart. On 2026-08-19
      the image was pinned to 1.14.7 in helm-values.yaml because chart 1.47.0 is the newest
      published and still ships appVersion 1.14.6. The chart templates
      `.Values.image.tag | default .Chart.AppVersion`, so that pin now wins PERMANENTLY over
      any future appVersion — a later chart bump would score a safe minor, land unattended at
      Step 0, and quietly leave a NEWER CHART DRIVING AN OLDER IMAGE with none of the vetting.
      This is the same shape coverage.py::_apply_lockstep guards (the unpoller v3-chart/v2-image
      case), but that only fires when a sibling is HELD, and nothing here is — so it would not
      catch this direction of drift. Forcing coredns into the PLAN lane is the guard.
      Independently: 1.14.7 proved that a coredns PATCH number is not a patch RELEASE (it added
      ACME TLS, topology-aware services, HTTP/2 forwarding, DoQ limits and changed the forward
      connect-attempt default), so this component should never bump unattended regardless of
      the pin. REMOVE THIS RULE when a chart ships appVersion >= the pinned tag AND the
      image.tag override is dropped from helm-values.yaml — both, not either."
  - match: "siderolabs/*"
    reason: "Talos node image — needs a rolling node-reboot maintenance window, not a git merge."
  - match: "*talos*"
    reason: "Talos/Kubernetes node-level component — reboot window required."

# ── Hard blocks by Renovate manager ─────────────────────────────────────────
# github-actions patch/minor are already auto-merged by Renovate itself
# (packageRules in .github/renovate.json5); don't double-handle them here.
deny_managers:
  - github-actions

# ── Extra-caution namespaces (informational; still gated the same) ──────────
# Stateful/data services — the post-apply health gate watches these closest.
# Not a block, just documents where a bad merge hurts most.
sensitive_namespaces:
  - databases
  - storage
  - kube-system
  - flux-system
