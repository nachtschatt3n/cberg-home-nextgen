# maintenance-windows — when NON-safe (held) updates get executed.
#
# The auto-updater (runbooks/auto-update.py) merges patch/minor SAFE updates in
# every window's Step 0. Everything it HOLDS (majors, breaking-despite-patch,
# deny-listed components, node-reboot items) flows here instead: an
# upgrade-planner-agent preps an executable plan per held update (or per
# PLAN-lane finding), and the maintenance-window-agent vets those plans for
# interference + side effects and runs the approved sequence.
#
# THREE windows (reshaped 2026-08-26, P1.1 of the ops-continuity plan; was
# "7/week — DAILY"). Seven declared slots turned out to be fictional capacity:
# four never had a driving cron, and plans scheduled into them — including one
# carrying a live operator GO — silently never ran. "An idle window costs
# nothing" was empirically false: an UNDRIVEN window absorbed scheduled work
# into a black hole. The operator's actual policy has exactly two time shapes:
#
#   nightly       unattended, every night — routine reversible work while
#                 nobody is using the services. Safe updates now land DAILY
#                 (previously only when a driven window happened to exist).
#   sat/sun       attended weekend mornings — human-gated plans, with Sunday
#                 the only reboot-capable slot (Talos node rolls).
#
# Every window here MUST have a driving OpenClaw cron; `window-crons.py
# --check` asserts that parity on every sweep, and `window_runs` rows assert
# each dated slot actually RAN. A window this file declares that does not fire
# is a sweep finding, not a quiet absence.
#
# Soak rule (unchanged): daily nightly windows compress INDEPENDENT work; they
# must never be used to collapse a deliberate soak ("the old database IS the
# rollback"). A plan that says soak/observe keeps its full interval.
#
# Weekend ids renamed sat-early -> sat-attended / sun-window -> sun-attended
# (2026-08-26, operator call). Renamed ATOMICALLY with every reference: the two
# scheduled plans' window: fields, the OpenClaw crons' payloads, and the live
# GO/issue records — a rename without that migration orphans a live GO.
# Edit freely (git-tracked); bump `version`.
version: "2026.09.15"
timezone: Europe/Berlin

# SCHEDULABLE BUDGET = duration_min - 20.
# `runbooks/window-scheduler.py` reserves STEP0_RESERVE_MIN = 20 for the Step 0
# safe-update batch that runs FIRST in every window, then places plans against
# `duration_min - 20` (window-scheduler.py:92 and :270). So the usable figures are:
#   nightly      90 -> 70
#   sat-attended 90 -> 70
#   sun-attended 200 -> 180
# Stated here because the reserve lives only in the scheduler: FOUR separate
# artifacts have now done slot arithmetic against the raw `duration_min` and
# concluded a plan fits when the scheduler would refuse it (2026-09-20).
windows:
  - id: nightly
    day: daily
    start: "03:30"            # after the 03:00 Longhorn backup kicks off its
                              # snapshots, before the 04:00-anchored sweep and
                              # frigate's 02:30 restart-window traffic; nobody
                              # is using the services.
    duration_min: 90
    capacity_risk: 6
    allow_reboot: false
    mode: unattended          # NOTE (2026-09-12): autonomy classes NO LONGER key
                              # on `mode:` — AUTO-* plans run in ANY window, and
                              # HUMAN-GATED runs in none without an operator GO.
                              # `mode:` now only records whether a human is
                              # expected to be around, which still drives the
                              # attended-window operator ping.
    retry_after_min: 135      # 03:30 + 135 = 05:45 Europe/Berlin — ONE retry of a
                              # LOST occurrence, the same morning. WHY (2026-09-14):
                              # the driving OpenClaw cron reports `ok` on DELIVERY
                              # of the prompt to the ai-server-ops console, not on
                              # completion, so a run the console never picked up
                              # looks identical to one that ran — five nightly
                              # dates had no window_runs row and nothing noticed
                              # until the next sweep. 135 = the 90-min window plus
                              # 45 min for a slow-but-alive run to reach its
                              # close-out row, and still before the 07:00 briefing.
                              # The retry cron (`window-crons.py --render` prints
                              # it; --check asserts it exists) calls
                              # `maintenance-window retry --window nightly`, which
                              # is a NO-OP if ANY window_runs row exists for
                              # (nightly, today) — including outcome=running, the
                              # row the window agent now writes at Step 0 start —
                              # so a live or finished run is never re-fired.
                              # If NO row exists and the console is busy /
                              # in a menu (exit 8) or exhausted and not
                              # auto-clearable (exit 4), retry fails LOUDLY,
                              # nothing typed, so the retry cron's failureAlert
                              # pages the same morning (2026-09-26).
  - id: sat-attended
    day: saturday
    start: "09:00"
    duration_min: 90
    capacity_risk: 6
    allow_reboot: false
    mode: attended
  - id: sun-attended
    day: sunday
    start: "09:00"
    duration_min: 200         # RAISED 2026-09-12 from 150. The 150 was sized on an
                              # ESTIMATE of 115 min for the roll, leaving a 35-min
                              # margin. The talos-1.14.0 plan, once actually written,
                              # estimates 140 min IN-WINDOW -- so the margin the 150
                              # was built to provide had already been spent before the
                              # window arrived, leaving 10 min. Ten minutes is not a
                              # rollback budget for a node-reboot plan: rolling back a
                              # Talos node is another reboot cycle (~45 min for node
                              # 01), not a git revert.
                              # 200 = 140 (plan) + 45 (single-node rollback, the
                              # realistic worst case -- you roll back the node that
                              # failed, not all three) + 15 (the plan's final alert
                              # gate requires firing:0 SUSTAINED for >=15 min, which
                              # sits at the very end and is the first thing shortchanged
                              # when the clock is against you).
                              # This is a slot-wide CEILING, not a commitment: windows
                              # consume what their plans need, and most Sundays need far
                              # less. Sizing it honestly is the same principle that drove
                              # the 90->150 change -- a window we intend to run must not
                              # trip the reconciler's OVER-TIME check, because that
                              # trains people to ignore the check.
                              # PRIOR REASONING (2026-09-06, raised 90->150): A full 3-node Talos
                              # roll is 70 min (nodes 02+03) + 45 min (node 01)
                              # = 115 min, and 90 was already the binding
                              # constraint that forced the roll to be split
                              # across two Sundays. The operator asked for all
                              # three in one window, so the slot has to be
                              # honestly sized for it — leaving 90 here would
                              # have made the reconciler's OVER-TIME check fire
                              # on a window we intend to run, which trains
                              # people to ignore that check.
                              # 150 keeps a 35-min margin over 115 for the
                              # Longhorn rebuild gate between node 03 and
                              # node 01, which is the step most likely to run
                              # long on 94 volumes.
    capacity_risk: 6          # unchanged: risk-load 4 (both plans rated medium)
    allow_reboot: true        # rolling node reboots (Talos) go here, operator-present
    mode: attended

# ON-DEMAND "NOW" SLOT (2026-09-15, operator request "run the plan with an
# active NOW trigger"). An operator can say "run X now" — to OpenClaw
# (`home-operation run --issue X`) or in the Mac ops console — and have vetted,
# approved plans executed immediately in an ATTENDED run instead of waiting for
# the next scheduled window. Plans stamped for such a run carry
# `window: "now:<YYYY-MM-DD>"`; the run is recorded in window_runs as slot `now`.
#
# WHY THIS IS NOT AN ENTRY IN `windows:`. Everything that reads `windows:` is
# asserting a SCHEDULE, and an on-demand slot has none:
#   * `window-crons.py --check` requires exactly one driving cron per window —
#     an on-demand slot must have NO cron (a cron would make it scheduled);
#   * `maintenance-plan.py` liveness expects a window_runs row per dated
#     occurrence — an on-demand slot has no occurrences, so it can never be
#     "missed", only used;
#   * `window-scheduler.py` places auto-capable plans into upcoming slots — it
#     must never place work into a run nobody asked for.
# Keeping it top-level leaves all three untouched by construction instead of
# special-casing an id in each of them.
#
# What IS read from here: `id` (the plan window-ref prefix and the window_runs
# slot), `duration_min` (a CEILING — per-plan fit in validate_plans and the
# stuck-row threshold for an open `now` row; it is not a time budget the
# operator commits to), `allow_reboot: false` (a needs_reboot plan may NOT be
# stamped now: — node rolls stay in the reboot-capable Sunday window with its
# sized rollback budget), and `serial: true` (plans run strictly one at a time,
# which is the only reason a declared conflicts_with pair may share one
# on-demand run; runbooks/run-now.py flags such pairs so the executor
# re-verifies cluster health and settles between them).
# Step 0 (safe updates) still runs FIRST in an on-demand run, as in every run.
on_demand:
  id: now
  mode: attended              # the operator asked for it and is present
  allow_reboot: false
  serial: true
  duration_min: 480           # 8h ceiling: stuck detection + per-plan fit only

execution:
  # Autonomy is CLASS-BASED (P2.1b, 2026-08-26). A plan's execution class is
  # DERIVED by maintenance-plan.py from declared facts against
  # runbooks/autonomy-policy.yaml — plans cannot claim a class. AUTO-NIGHT and
  # AUTO-BACKUP-GATED may run WITHOUT asking, provided there is no unresolved
  # interference (and, for AUTO-BACKUP-GATED, the named backup gate PASSES in
  # the window). Everything else — HUMAN-GATED, any interference/side-effect
  # conflict, any blocked/rollback — ALWAYS notifies the operator and waits for
  # go/no-go. So the pre-approved runs itself; anything needing a decision
  # reaches your phone.
  default_mode: operator-go-no-go
  # RETIRED knobs, do not reintroduce: `auto_execute` + `risk: low` (the
  # 2026-07-25 pair), `unattended_allowed`, `max_unattended_risk`. Autonomy is
  # decided by reversibility + capability-change + blast radius — NOT by `risk:`
  # (which stays the capacity weight) and NOT by the window's `mode:` (widened
  # 2026-09-12: AUTO-* plans run in ANY window; see the `mode:` note above).

  # Operator MUST be told on every event below, and a go/no-go is never silently
  # skipped or auto-decided. Since 2026-07-25 OpenClaw's `home-operation` skill
  # OWNS notification + the open-issue store + the reminder cadence (emitters
  # route via `kubectl exec ... home-operation ingest`; see maintenance-windows
  # SOP). runbooks/lib/notify.py is only the FALLBACK when the openclaw pod is
  # unreachable, so an alert is never lost.
  notify:
    channel: openclaw-home-operation # primary; notify.py (telegram) is fallback
    events:                          # NB: key is `events` not `on` — YAML parses
                                     # a bare `on:` as boolean true (Norway problem)
      - decision-needed              # go/no-go before executing a non-auto plan
      - interference-conflict        # plans clash → operator must choose
      - blocked                      # a plan failed verification + was rolled back
      - reverted                     # auto-update post-apply revert
      - window-complete              # end-of-window summary
    urgent:                          # critical → immediate audible push
      - decision-needed
      - interference-conflict
      - blocked
      - reverted
    # If a go/no-go isn't answered during the window, DEFER (don't hang/auto-run).
    # OpenClaw reminds on its own escalating `tick` cron; the sweep just re-syncs
    # its open-issue set (ingest + reconcile) every cycle until answered/superseded.
    reminder: openclaw-tick

planning:
  # A held update needs a fresh plan before its window. A plan is STALE if the
  # PR's target version moved or the PR closed since the plan was generated.
  stale_after_days: 14               # re-investigate if a plan sits unused
  plans_dir: runbooks/maintenance/plans
